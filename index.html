пр. М/1d4+1 урона | Нет | – |\n| Разведчики | 5 | 5 | Нет | М пр. М/2d4 урона | 1d4+1 урона | Неприметный |\n| Резервный корпус | 4 | 4 | Нет | М пр. М/1d6 урона | 1d6 урона | – |\n| **Мощь 3** | | | | | | |\n| Зачарованная элита | 8 | 6 | Средняя | М пр. М/1d10 урона | 1d6 урона | – |\n| Охотники на ведьм | 6 | 4 | Низкая | Х пр. Х/1d4+1 урона | 1d6 урона | Неприметный |\n| Пехота | 6 | 6 | Нет | М пр. М/1d8 урона | 1d6 урона | – |\n| Храмовые фанатики | 4 | 6 | Нет | М пр. М/2d6 урона | 2d6 урона | Особое |\n| **Мощь 4** | | | | | | |\n| Военные дороги | 10 | 10 | Нет | Нет | Нет | Действие |\n| Военный флот | 12 | 8 | Нет | М пр. М/2d6 урона | 1d8 урона | Действие |\n| Конница | 8 | 12 | Нет | М пр. М/2d6 урона | 1d4 урона | – |\n| Передовой отряд | 10 | 10 | Нет | Нет | 1d6 урона | Действие |\n| **Мощь 5** | | | | | | |\n| Демонический убийца | 12 | 4 | Высокая | Х пр. Х/2d6+2 урона | Нет | Неприметный, Особое |\n| Магическое снабжение | 14 | 6 | Средняя | Нет | Нет | Особое |\n| Мастера осады | 10 | 8 | Нет | М пр. Б/1d6 урона | 1d6 урона | – |\n| **Мощь 6** | | | | | | |\n| Боевые машины | 25 | 14 | Средняя | М пр. М/2d10+4 урона | 1d10 урона | – |\n| Рыцари | 18 | 16 | Нет | М пр. М/2d8 урона | 2d6 урона | – |\n| Сеть укреплений | 20 | 18 | Нет | Нет | 2d6 урона | Действие |\n| **Мощь 7** | | | | | | |\n| Выкованные для войны | 30 | 16 | Высокая | М пр. М/2d8+2 урона | 2d8 урона | Неприметный |\n| Гениальный полководец | 25 | 8 | Нет | Х пр. М/1d8 урона | Нет | Неприметный, Особое |\n| Обряды чистоты | 20 | 10 | Низкая | Нет | 2d8+2 урона | Особое |\n| **Мощь 8** | | | | | | |\n| Машина апокалипсиса | 35 | 20 | Средняя | М пр. М/3d10+4 урона | Нет | – |\n| Непобедимый легион | 40 | 30 | Нет | М пр. М/2d10+4 урона | 2d10+4 урона | Особое |"},{"n":"6.10.0","l":2,"te":"Wealth Assets","tr":"Активы Богатства","en":"Ancient Mechanisms: Some useful magical mechanism from ages \npast has been refitted to be useful in local industry. Whenever an \nAsset in the same location must roll to make a profit, such as Farm-\ners or Manufactory, the faction may roll the die twice and take the \nbetter result.\nAncient Workshop: A workshop has been refitted with ancient \nmagical tools, allowing prodigies of production, albeit not always \nsafely. As a free action, once per turn, the Ancient Workshop takes \n1d6 damage and the owning faction gains 1d6 Treasure.\nArcane Laboratory: The faction’s overall Magic is counted as one \nstep higher for the purposes of creating Assets in the same location \nas the laboratory. Multiple Arcane Laboratories in the same location \ncan increase the Magic boost by multiple steps.\nArmed Guards: Hired caravan guards, bodyguards, or other armed \nminions serve the faction.\nCaravan: As a free action, once per turn, the Caravan can spend 1 \nTreasure and move itself and one other Asset in the same place to a \nnew location within one move.\nCooperative Businesses: If any other faction attempts to create \nan Asset in the same location as a Cooperative Business, the cost of \ndoing so increases by 1 Treasure. This penalty stacks.\nDragomans: Interpreters, cultural specialists, and go-betweens sim-\nplify the expansion of a faction’s influence in an area. A faction that \ntakes an Expand Influence action in the same location as this Asset \ncan roll an extra die on all checks there that turn. As a free action \nonce per turn, this Asset can move.\nEconomic Disruption: As a free action once per turn, this Asset can \nmove itself without cost.\nFarmers: Farmers, hunters, and simple rural artisans are in service \nto the faction here. Once per turn, as a free action, the Asset’s owner \ncan roll 1d6; on a 5+, they gain 1 Treasure from the Farmers.\nFree Company: Hired mercenaries and professional soldiers, this \nAsset can, as a free action once per turn, move itself. At the start of \neach of its owner’s turn, it takes 1 Treasure in upkeep costs; if this is \nnot paid, roll 1d6. On a 1-3 the Asset is lost, on a 4-6 it goes rogue \nand will move to Attack the most profitable-looking target. This roll is \nrepeated each turn until back pay is paid or the Asset is lost.\nFront Merchant: Whenever the Front Merchant successfully Attacks \nan enemy Asset, the target faction loses 1 Treasure, if they have any, \nand the Front Merchant’s owner gains it. Such a loss can occur only \nonce per turn.\nGolden Prosperity: Each turn, as a free action, the faction gains 1d6 \nTreasure that can be used to fix damaged Assets as if by the Repair \nAssets action. Any of this Treasure not spent on such purposes is lost.\nHealers: Whenever an Asset within one move of the Healers is de-\nstroyed by an Attack that used Force against the target, the owner \nof the Healers may pay half its purchase price in Treasure, rounded \nup, to instantly restore it with 1 hit point. This cannot be used to repair \nBases of Influence.\nHired Legion: As a free action once per turn, the Hired Legion can \nmove. This faction must be paid 2 Treasure at the start of each turn \nas upkeep, or else they go rogue as the Free Company Asset does. \nThis Asset cannot be voluntarily sold or disbanded.\nLead or Silver: If Lead or Silver’s Attack reduces an enemy Asset to \nzero hit points, this Asset’s owner may immediately pay half the tar-\nget’s purchase cost to claim it as their own, reviving it with 1 hit point.\nMad Genius: As a free action, once per turn, the Mad Genius may \nmove. As a free action, once per turn, the Mad Genius may be sacri-\nficed to treat the Magic rating in their location as High for the purpose\nof buying Assets that require such resources. This boost lasts only until \nthe next Asset is purchased in that location.\nManufactory: Once per turn, as a free action, the Asset’s owner may \nroll 1d6; on a 1, one point of Treasure is lost, on a 2-5, one point \nis gained, and on a 6, two points are gained. If Treasure is lost and \nnone is available to pay it by the end of the turn, this Asset is lost.\nMerchant Prince: A canny master of trade, the Merchant Prince may \nbe triggered as a free action once per turn before buying a new Asset \nin the same location; the Merchant Prince takes 1d4 damage and \nthe purchased Asset costs 1d8 Treasure less, down to a minimum of \nhalf its normal price.\nMonopoly: Once per turn, as a free action, the Monopoly Asset \ncan target an Asset in the same location; that Asset’s owning fac-\ntion must either pay the Monopoly’s owner 1 Treasure or lose the \ntargeted Asset.\nOccult Countermeasures: This asset can only Attack or inflict Coun-\nterattack damage on Assets that require at least a Low Magic rating \nto purchase.\nPleaders: Whether lawyers, skalds, lawspeakers, sage elders, or \nother legal specialists, Pleaders can turn the local society’s laws \nagainst the enemies of the faction. However, Pleaders can neither \nAttack nor inflict Counterattack damage on Force Assets.\nSmuggling Fleet: Once per turn, as a free action, they may move \nthemselves and any one Asset at their current location to any other \nwater-accessible location within one move. Any Asset they move \nwith them gains the Subtle quality until they take some action at the \ndestination.\nSupply Interruption: As a free action, once per turn, the Asset can \nmake a Cunning vs. Wealth check against an Asset in the same loca-\ntion. On a success, the owning faction must sacrifice Treasure equal to \nhalf the target Asset’s purchase cost, or else it is disabled and useless \nuntil this price is paid.\nTrade Company: Bold traders undertake potentially lucrative- or \ncatastrophic- new business opportunities. As a free action, once per \nturn, the owner of the Asset may roll accept 1d4 damage done to \nthe Asset in exchange for earning 1d6-1 Treasure points.\nTransport Network: A vast array of carters, ships, smugglers, and \nofficial caravans are under the faction’s control. As a free action the \nTransport Network can spend 1 Treasure to move any friendly Asset \nwithin two moves to any location within one move of either the target \nor the Transport Network.\nUsurers: Moneylenders and other proto-bankers ply their trade for \nthe faction. For each unit of Usurers owned by a faction, the Treasure \ncost of buying Assets may be decreased by 2 Treasure, to a minimum \nof half its cost. Each time the Usurers are used for this benefit, they \nsuffer 1d4 damage from popular displeasure.\nWorker Mob: The roughest, most brutal laborers in service with the \nfaction have been quietly organized to sternly discipline the enemies \nof the group.\nWealth 1\nWealth 2\nWealth 3\nWealth 4\nWealth 5\nWealth 6\nWealth 7\nWealth 8\nWealth Asset\nCost\nHP\nMagic\nAttack\nCounter\nQualities\nArmed Guards\nNone\nW v. F/1d3 damage\n1d4 damage\nCooperative Businesses\nNone\nW v. W/1d4-1 damage\nNone\nSubtle, Special\nFarmers\nNone\nNone\n1d4 damage\nAction\nFront Merchant\nNone\nW v. W/1d4 damage\n1d4-1 damage\nSubtle\nCaravan\nNone\nW v. W/1d4 damage\nNone\nAction\nDragomans\nNone\nNone\n1d4 damage\nSubtle, Special\nPleaders\nNone\nC v. W/2d4 damage\n1d6 damage\nSpecial\nWorker Mob\nNone\nW v. F/1d4+1 damage\n1d4 damage\nAncient Mechanisms\nMedium\nNone\nNone\nSpecial\nArcane Laboratory\nNone\nNone\nNone\nSpecial\nFree Company\nNone\nW v. F/2d4+2 damage\n1d6 damage\nAction, Special\nManufactory\nNone\nNone\n1d4 damage\nAction\nHealers\nNone\nNone\nNone\nAction\nMonopoly\nNone\nW v. W/1d6 damage\n1d6 damage\nAction\nOccult Countermeasures\nLow\nW v. C/2d10 damage\n1d10 damage\nSpecial\nUsurers\nNone\nW v. W/1d10 damage\nNone\nAction\nMad Genius\nNone\nW v. C/1d6 damage\nNone\nAction\nSmuggling Fleet\nNone\nW v. F/2d6 damage\nNone\nSubtle, Action\nSupply Interruption\nNone\nC v. W/1d6 damage\nNone\nSubtle, Action\nEconomic Disruption\nNone\nW v. W/2d6 damage\nNone\nSubtle, Action\nMerchant Prince\nNone\nW v. W/2d8 damage\n1d8 damage\nAction\nTrade Company\nNone\nW v. W/2d6 damage\n1d6 damage\nAction\nAncient Workshop\nMedium\nNone\nNone\nLead or Silver\nNone\nW v. W/2d10 damage\n2d8 damage\nTransport Network\nNone\nW v. W/1d12 damage\nNone\nAction\nGolden Prosperity\nMedium\nNone\n2d10 damage\nHired Legion\nNone\nW v F/2d10+4 damage\n2d10 damage\nAction","ru":"**Безумный гений:** Свободным действием раз за ход Безумный гений может переместиться. Свободным действием раз за ход Безумного гения можно принести в жертву, чтобы рейтинг Магии в его местоположении считался Высоким при покупке Активов, которым нужны такие ресурсы. Подспорье держится лишь до следующей покупки Актива в этом местоположении.\n\n**Вольная рота:** Наёмники и профессиональные солдаты; свободным действием раз за ход этот Актив может переместиться. В начале каждого хода владельца он требует 1 Казны на содержание. Если не заплатить, владелец бросает 1d6: на 1-3 Актив теряется, на 4-6 он выходит из повиновения и двинется Атаковать самую прибыльную с виду цель. Этот бросок повторяется каждый ход, пока долг не выплачен или Актив не потерян.\n\n**Вооружённая охрана:** Фракции служат наёмные караванные охранники, телохранители и прочие вооружённые прислужники.\n\n**Драгоманы:** Толмачи, знатоки чужих обычаев и посредники облегчают распространение влияния фракции в округе. Фракция, выполняющая действие «Расширить влияние» в одном местоположении с этим Активом, в тот ход может бросать там дополнительную кость во всех проверках. Свободным действием раз за ход этот Актив может переместиться.\n\n**Древние механизмы:** Некий полезный магический механизм былых эпох приспособлен к местному производству. Всякий раз, когда Актив в том же местоположении должен бросать на прибыль, как Земледельцы или Мануфактура, фракция может бросить кость дважды и взять лучший результат.\n\n**Древняя мастерская:** Мастерская переоснащена древними магическими инструментами и творит чудеса производительности, хотя и не всегда безопасно. Свободным действием раз за ход Древняя мастерская получает 1d6 урона, а владеющая фракция — 1d6 Казны.\n\n**Дружественные предприятия:** Если любая другая фракция пытается создать Актив в одном местоположении с Дружественным предприятием, цена создания растёт на 1 Казны. Этот штраф складывается.\n\n**Земледельцы:** Здесь фракции служат земледельцы, охотники и простые сельские ремесленники. Раз за ход свободным действием владелец Актива может бросить 1d6: на 5+ Земледельцы приносят ему 1 Казны.\n\n**Золотое процветание:** Каждый ход свободным действием фракция получает 1d6 Казны, которую может пустить на починку повреждённых Активов, как при действии «Починить Актив». Вся эта Казна, не потраченная на такие цели, пропадает.\n\n**Караван:** Свободным действием раз за ход Караван может потратить 1 Казны и переместить себя и один другой Актив из того же места в новое местоположение в пределах одного перемещения.\n\n**Контрабандный флот:** Раз за ход свободным действием он может переместить себя и любой один Актив из своего текущего местоположения в любое другое доступное с воды местоположение в пределах одного перемещения. Любой Актив, который он берёт с собой, получает качество «Неприметный», пока не совершит какое-нибудь действие на месте прибытия.\n\n**Купеческий князь:** Ловкий мастер торговли. Купеческого князя можно задействовать свободным действием раз за ход перед покупкой нового Актива в том же местоположении: Купеческий князь получает 1d4 урона, а покупаемый Актив стоит на 1d8 Казны меньше, но не меньше половины обычной цены.\n\n**Лекари:** Когда Актив в пределах одного перемещения от Лекарей гибнет от Атаки, использовавшей против цели Мощь, владелец Лекарей может заплатить половину его покупной цены в Казне, округляя вверх, и мгновенно восстановить его с 1 пунктом здоровья. Так нельзя чинить Базы влияния.\n\n**Мануфактура:** Раз за ход свободным действием владелец Актива может бросить 1d6: на 1 теряется один пункт Казны, на 2-5 один пункт приобретается, на 6 приобретаются два. Если Казна потеряна, а платить к концу хода нечем, этот Актив теряется.\n\n**Монополия:** Раз за ход свободным действием Актив «Монополия» может выбрать целью Актив в том же местоположении. Фракция-владелец цели должна либо заплатить владельцу Монополии 1 Казны, либо потерять выбранный Актив.\n\n**Наёмный легион:** Свободным действием раз за ход Наёмный легион может переместиться. В начале каждого хода этому Активу нужно платить 2 Казны содержания — иначе он выходит из повиновения, как Актив «Вольная рота». Этот Актив нельзя добровольно продать или распустить.\n\n**Оккультные контрмеры:** Этот Актив может Атаковать и наносить урон Контратакой только тем Активам, для покупки которых нужен рейтинг Магии хотя бы «Низкая».\n\n**Перевозочная сеть:** Под контролем фракции — необъятное скопище возчиков, кораблей, контрабандистов и официальных караванов. Свободным действием Перевозочная сеть может потратить 1 Казны и переместить любой дружественный Актив в пределах двух перемещений в любое местоположение в пределах одного перемещения от цели или от самой Перевозочной сети.\n\n**Перекрытые поставки:** Свободным действием раз за ход этот Актив может сделать проверку Хитрости против Богатства против Актива в том же местоположении. При успехе владеющая фракция должна пожертвовать Казной в половину покупной цены целевого Актива — иначе тот выведен из строя и бесполезен, пока эта цена не уплачена.\n\n**Подрыв хозяйства:** Свободным действием раз за ход этот Актив может переместиться, ничего не платя.\n\n**Подставной купец:** Всякий раз, когда Подставной купец успешно Атакует вражеский Актив, целевая фракция теряет 1 Казны, если есть что терять, а владелец Подставного купца её получает. Такая потеря случается не больше раза за ход.\n\n**Рабочая ватага:** Самые грубые и свирепые работяги на службе фракции втихую сколочены в ватагу, чтобы сурово вразумлять врагов группы.\n\n**Ростовщики:** Ростовщики и прочие протобанкиры промышляют для фракции. За каждый отряд Ростовщиков во владении фракции цену покупки Активов можно снижать на 2 Казны, но не ниже половины цены. Каждый раз, когда Ростовщики идут в ход ради этой выгоды, народное недовольство наносит им 1d4 урона.\n\n**Свинец или серебро:** Если Атака Свинца или серебра доводит вражеский Актив до нуля пунктов здоровья, владелец этого Актива может немедленно заплатить половину покупной цены цели и забрать её себе, оживив с 1 пунктом здоровья.\n\n**Стряпчие:** Юристы, скальды, законоговорители, мудрые старейшины и прочие знатоки права — Стряпчие умеют обращать законы местного общества против врагов фракции. Однако Стряпчие не могут ни Атаковать Активы Мощи, ни наносить им урон Контратакой.\n\n**Торговая компания:** Отчаянные купцы пускаются в новые предприятия, то ли прибыльные, то ли гибельные. Свободным действием раз за ход владелец Актива может принять 1d4 урона по Активу в обмен на 1d6-1 пунктов Казны.\n\n**Чародейская лаборатория:** Общая Магия фракции считается на одну ступень выше при создании Активов в одном местоположении с лабораторией. Несколько Чародейских лабораторий в одном местоположении могут поднять Магию на несколько ступеней.\n\n| Актив Богатства | Цена | ПЗ | Магия | Атака | Контратака | Качества |\n|---|---|---|---|---|---|---|\n| **Богатство 1** | | | | | | |\n| Вооружённая охрана | 1 | 3 | Нет | Б пр. М/1d3 урона | 1d4 урона | – |\n| Дружественные предприятия | 1 | 2 | Нет | Б пр. Б/1d4-1 урона | Нет | Неприметный |\n| Земледельцы | 2 | 4 | Нет | Нет | 1d4 урона | Действие |\n| Подставной купец | 2 | 3 | Нет | Б пр. Б/1d4 урона | 1d4-1 урона | Неприметный, Особое |\n| **Богатство 2** | | | | | | |\n| Драгоманы | 4 | 4 | Нет | Нет | 1d4 урона | Неприметный, Особое |\n| Караван | 5 | 4 | Нет | Б пр. Б/1d4 урона | Нет | Действие |\n| Рабочая ватага | 4 | 6 | Нет | Б пр. М/1d4+1 урона | 1d4 урона | – |\n| Стряпчие | 6 | 4 | Нет | Х пр. Б/2d4 урона | 1d6 урона | Особое |\n| **Богатство 3** | | | | | | |\n| Вольная рота | 8 | 6 | Нет | Б пр. М/2d4+2 урона | 1d6 урона | Действие, Особое |\n| Древние механизмы | 8 | 4 | Средняя | Нет | Нет | Особое |\n| Мануфактура | 8 | 4 | Нет | Нет | 1d4 урона | Действие |\n| Чародейская лаборатория | 6 | 4 | Нет | Нет | Нет | Особое |\n| **Богатство 4** | | | | | | |\n| Лекари | 12 | 8 | Нет | Нет | Нет | Действие |\n| Монополия | 8 | 12 | Нет | Б пр. Б/1d6 урона | 1d6 урона | Действие |\n| Оккультные контрмеры | 10 | 8 | Низкая | Б пр. Х/2d10 урона | 1d10 урона | Особое |\n| Ростовщики | 12 | 8 | Нет | Б пр. Б/1d10 урона | Нет | Действие |\n| **Богатство 5** | | | | | | |\n| Безумный гений | 6 | 2 | Нет | Б пр. Х/1d6 урона | Нет | Действие |\n| Контрабандный флот | 12 | 6 | Нет | Б пр. М/2d6 урона | Нет | Неприметный, Действие |\n| Перекрытые поставки | 10 | 8 | Нет | Х пр. Б/1d6 урона | Нет | Неприметный, Действие |\n| **Богатство 6** | | | | | | |\n| Купеческий князь | 20 | 10 | Нет | Б пр. Б/2d8 урона | 1d8 урона | Действие |\n| Подрыв хозяйства | 25 | 10 | Нет | Б пр. Б/2d6 урона | Нет | Неприметный, Действие |\n| Торговая компания | 15 | 10 | Нет | Б пр. Б/2d6 урона | 1d6 урона | Действие |\n| **Богатство 7** | | | | | | |\n| Древняя мастерская | 25 | 16 | Средняя | Нет | Нет | Действие |\n| Перевозочная сеть | 15 | 5 | Нет | Б пр. Б/1d12 урона | Нет | – |\n| Свинец или серебро | 20 | 10 | Нет | Б пр. Б/2d10 урона | 2d8 урона | – |\n| **Богатство 8** | | | | | | |\n| Золотое процветание | 40 | 30 | Средняя | Нет | 2d10 урона | Действие |\n| Наёмный легион | 30 | 20 | Нет | Б пр. М/2d10+4 урона | 2d10 урона | – |"},{"n":"7.0.0","l":1,"te":"Major Projects","tr":"Великие начинания","en":"In any campaign, there will likely arise some occasion when the \nPCs take it into their heads to accomplish some great change in the \nworld. Perhaps they want to abolish slavery in a country, or institute \na new government in a howling wilderness, or crush the economic \npower of a hateful merchant cartel. The party wants to accomplish \nsomething grand or large-scale where there is no obvious direct path \nto success. No single killing or specific act of heroism will get them \ntheir aim, though the goal itself isn’t so wild as to be obviously futile.\nSuch ambitions are major projects, and this section will cover a \nsimple system to help the GM adjudicate their progress and success. \nThis system is meant to handle sprawling, ambiguous ambitions that \naren’t clearly susceptible to a simple solution. If the party wants a \ndead town burgomaster, then they can simply kill him. If they want \nto turn his town into a major new trading nexus, something more \ncomplicated may be required.","ru":"Почти в любой кампании однажды наступает момент, когда ПИ задумывают совершить в мире большую перемену. Скажем, они хотят отменить рабство в целой стране, учредить новую власть посреди воющей глуши или сокрушить экономическое могущество ненавистного купеческого картеля. Партия замахивается на нечто великое или масштабное, к чему нет очевидного прямого пути. Ни одно убийство, ни один отдельный подвиг не принесут им желаемого — но сама цель не настолько безумна, чтобы быть заведомо тщетной.\nТакие замыслы и есть великие начинания, и этот раздел предлагает простую систему, которая поможет Мастеру оценивать их ход и успех. Система предназначена для размашистых, расплывчатых устремлений, у которых нет явного простого решения. Если партии нужен мёртвый бургомистр, его можно просто убить. Если же они хотят превратить его городок в новый крупный торговый узел, понадобится нечто посложнее."},{"n":"7.1.0","l":2,"te":"Renown","tr":"Слава","en":"The basic currency of major projects is called Renown, and it’s mea-\nsured in points much like experience points. PCs gain Renown for \nsucceeding at adventures, building ties with the world, and generally \nbehaving in a way to attract interest and respect from those around \nthem. PCs then spend Renown to accomplish the changes they want \nto make in the world, reflecting their own background activities and \nthe work of cooperative allies and associates.\nEach individual PC has their own Renown score. They can spend \nit together with the rest of the party if they agree on the mutual focus \nof their interests, but a PC might also spend it on other ambitions or \nintermediate goals that come to mind. It’s ultimately up to the player \nas to what they want to put their effort into; spending Renown reflects \nthe kind of background work and off-screen support that the hero \ncan bring to bear.\nA GM doesn’t have to track Renown unless they intend to use the \nthis system. If the GM prefers to do things their own way, they can \ncompletely ignore Renown awards. If the GM changes their mind \nlater and wants to introduce the system, they can simply give each \nPC a Renown score equal to their current accumulated experience \npoints and then track things accordingly from there.\nGenerally, a PC will receive one point of Renown after each \nadventure. Some other activities or undertakings might win them \nadditional bonus Renown, usually those works that increase the \nPC’s influence and involvement with the campaign world, and some \nadventures might not give them much Renown at all if they left no \nimpression on the people around the party.","ru":"Базовая валюта великих начинаний называется Славой и измеряется в пунктах, во многом подобно пунктам опыта. ПИ получают Славу за успешные приключения, за связи, которыми обрастают в мире, и вообще за то, что ведут себя так, чтобы привлекать интерес и уважение окружающих. Затем ПИ тратят Славу, чтобы осуществить желаемые перемены в мире; эта трата отражает их собственную закулисную работу и труды дружественных союзников и помощников.\nУ каждого ПИ свой запас Славы. Её можно тратить вместе с остальной партией, если группа сходится на общей цели, но ПИ может пустить её и на другие замыслы или промежуточные задачи, которые придут ему в голову. В конечном счёте игрок сам решает, во что вкладывать усилия; трата Славы отражает ту закулисную работу и внеэкранную поддержку, которую герой способен привести в движение.\nМастеру не обязательно вести учёт Славы, если он не собирается пользоваться этой системой. Если Мастер предпочитает вести дела по-своему, награды Славой можно полностью игнорировать. Если позже он передумает и захочет ввести систему, достаточно дать каждому ПИ запас Славы, равный его текущим накопленным пунктам опыта, и дальше вести учёт как обычно.\nКак правило, ПИ получает один пункт Славы после каждого приключения. Отдельные дела и предприятия могут приносить дополнительную Славу — обычно те, что усиливают влияние ПИ и его вовлечённость в мир кампании; а иные приключения могут не дать почти никакой Славы, если не оставили никакого следа в памяти людей вокруг партии."},{"n":"7.2.0","l":2,"te":"Determining the Project Difficulty","tr":"Определение сложности начинания","en":"To find out how much Renown is needed to achieve a project, the \nGM must determine its difficulty. This total difficulty is a product of \nthe intensity of the change, the scope it affects, and the powers that \nare opposed to it.\nFirst, decide whether the change is plausible, improbable, or im-\npossible. If the change is something that is predictable or unsurprising, \nit’s a plausible change. A town with good transport links and a couple \nof wealthy neighbors might quite plausibly become a trade hub. A \nduke with an abandoned frontier keep and a raider problem might \nplausibly decide to give it to a famed warrior PC with the agreement \nthat the PC would pledge fealty to him. A plausible change in the \ncampaign is simply one that no one would find particularly surprising\nor unlikely.\nAn improbable change is one that’s not physically or socially \nimpossible, but is highly unlikely. Transforming a random patch of \nsteppe grasslands into a trading hub might be an improbable change, \nas would convincing a duke to simply hand over the frontier fort with \nno particular claim of allegiance. Some things that are not particularly \nphysically difficult might be improbable due to the social or emotional \nimplications; a society with a relative handful of trophy slaves might \nfind it improbable to give them up even if they serve only as status \nsymbols for their owners.\nAn impossible change is just that; something that is physically or \nsocially impossible to contemplate. Turning a desolate glacier on the \nedge of the world into a trading hub might be such, or convincing \nthe duke to simply give the PCs his duchy. Accomplishing a feat like \nthis might require substantial magical Workings, the involvement of \nancient artifacts, or a degree of social upheaval on par with a war \nof conquest. Some changes might be so drastic that they require \ntheir own heroic labors simply to prepare the groundwork for the \nreal effort, and entire separate projects must be undertaken before \nthe real goal even becomes possible.","ru":"Чтобы узнать, сколько Славы нужно для успеха начинания, Мастер должен определить его сложность. Итоговая сложность — произведение глубины перемены, охваченного ею размаха и противостоящих ей сил.\nСначала нужно решить, является ли перемена правдоподобной, маловероятной или невозможной. Если перемена предсказуема и никого не удивит — она правдоподобна. Городок с хорошими путями сообщения и парой богатых соседей вполне правдоподобно может стать торговым узлом. Герцог, у которого есть заброшенная пограничная крепость и беда с налётчиками, вполне правдоподобно может решить отдать её прославленному воину-ПИ с условием, что тот присягнёт ему на верность. Правдоподобная перемена в кампании — попросту та, которую никто не сочтёт особенно удивительной или невероятной.\nМаловероятная перемена не является физически или социально невозможной, но крайне маловероятна. Превратить случайный клочок степи в торговый узел — перемена маловероятная, как и убедить герцога отдать пограничную крепость просто так, без всяких уз верности. Иные вещи, не особенно трудные физически, могут быть маловероятны из-за социальных или эмоциональных последствий: общество с горсткой рабов-трофеев вряд ли согласится отпустить их, даже если те служат хозяевам лишь символом статуса.\nНевозможная перемена — именно такова: она физически или социально немыслима. Такова попытка превратить безлюдный ледник на краю света в торговый узел или убедить герцога просто подарить ПИ своё герцогство. Подобный подвиг может потребовать серьёзных магических Творений, участия древних артефактов или социального потрясения масштаба завоевательной войны. Иные перемены настолько радикальны, что одна лишь подготовка почвы для настоящей работы требует собственных героических трудов, и прежде чем подлинная цель вообще станет возможной, придётся довести до конца целые отдельные начинания."},{"n":"7.3.0","l":2,"te":"Determining the Project Scope","tr":"Определение размаха начинания","en":"Once the change’s probability is decided, the GM must identify how \nwide the scope of the change may be. The more land and the more \npeople the change affects, the harder it will be to bring it about.\nA village-sized change is the smallest scale, affecting only a single \nhamlet or a village’s worth of people. A city-sized change affects the \npopulation of a single city or several villages, while a regional one \nmight affect a single barony or small province. A kingdom-sized one \naffects a whole kingdom or a collection of feudal lordships, and a \nglobal change affects the entire world, or at least those parts known \nto the PCs.\nWhen deciding the scope of the change, focus on how many \npeople are going to be immediately affected by the project. Turning \na town into a trading hub might incidentally affect a significant part \nof a kingdom, but the immediate consequences are felt only by the \nresidents of that town, and perhaps their closest trading partners. \nThe scope in that case would be simply that of a city, rather than a \nregion. Banishing slavery throughout a kingdom would require a \nkingdom-sized change, while getting it banned within some smaller \nfeudal region would require a proportionately lesser scope.\nIf the PCs are trying to establish an educational institution, or a \nreligious order, or some other sub-group meant to serve a chosen \ncause, the scope should be the largest general area the order can \nhave influence in at any one time. A very small order of warrior-monks \nmight only have enough devotees to affect a village-sized community \nor problem. An order with multiple monasteries and bases of opera-\ntions throughout a kingdom might have enough muscle to affect events \non a nation-wide scale. In the same vein, a small academy might be \nenough to bring enlightened learning to a city, improving the lives of \nmen and women there, but not have the reach to influence the greater \nregion around it. Individual warrior-monks or specific scholars might \nplay major roles elsewhere in the setting, but the institution itself can’t \nrely on the certainty of being able to step into such roles.\nIn some cases, a PC might attempt to forge a Working or develop \na specific bloodline of magical or cursed beings. Assuming that they \nhave the necessary tools and opportunities to achieve such a great\nProbability\nof the Goal\nBase\nDifficulty\nScope\nAffected\nDifficulty\nMultiplier\nGreatest Active\nDifficulty\nMultiplier\nOpposition\nKingdom\nx16\nKing or famed monster\nx16\nKnown World\nx32\nMultiply opposition by x2 if the local population is\nemotionally or socially against it.\nPlausible\nVillage\nx2\nMinor figures\nx2\nImprobable\nCity\nx4\nLocal leaders\nx4\nImpossible\nRegion\nx8\nMajor noble or beast\nx8\nfeat, the scope should apply to the total number of people affected \nby the magic over its entire course of existence. Thus, a village-sized \nchange like this might apply to ten generations of a very small blood-\nline, the enchantment lasting for a very long time but applying only \nto a few people at any one time. It might be reproduced by special \ntraining, magical consecration, or a natural inherited bloodline. Once \nthe scope limit is reached, the magic can no longer be transmitted, as \nit has either been exhausted or the subtle shiftings of the magic have \ndamaged it beyond repair. Conversely, a very large scope for such \na work might mean that many people are so affected, though a very \nlarge change like that would only last for a few generations before \nreaching the maximum affected population. Because of such limits, \nmany such empowered bloodlines or augmented magical traditions \nare very selective about adding new members.\nOptionally, PCs who want to create such a magical working can \nfix it indefinitely, causing it to be heritable or transmissible for the \nindefinite future. Such laborious workings are much more difficult \nthan simply tying the effect to the natural flow of the magic, however, \nand so it costs four times more than it would otherwise. Thus, imbuing \na village of people with some magical quality that they will forever \nafter transmit down to a similar number of heirs would count as a x8 \nmultiplier instead of a x2 multiplier.","ru":"Когда правдоподобие перемены определено, Мастер должен понять, насколько широк её размах. Чем больше земель и людей затрагивает перемена, тем труднее её осуществить.\nПеремена размаха деревни — наименьший масштаб: она затрагивает лишь одну деревушку или число людей, равное населению деревни. Перемена размаха города затрагивает население одного города или нескольких деревень; перемена размаха области — одну баронию или небольшую провинцию. Перемена размаха королевства охватывает целое королевство или россыпь феодальных владений, а перемена размаха известного мира — весь мир или по крайней мере те его части, что известны ПИ.\nОпределяя размах перемены, следует смотреть на то, скольких людей начинание затронет непосредственно. Превращение городка в торговый узел может косвенно сказаться на немалой части королевства, но непосредственные последствия ощутят лишь жители самого города и, возможно, его ближайшие торговые партнёры. Размах в этом случае будет всего лишь городским, а не областным. Чтобы изгнать рабство из целого королевства, нужна перемена размаха королевства, а чтобы добиться его запрета в каком-нибудь меньшем феодальном владении, хватит соответственно меньшего размаха.\nЕсли ПИ основывают учебное заведение, религиозный орден или иное сообщество, призванное служить избранному делу, размахом следует считать наибольшую территорию, на которую орден способен влиять одновременно. У совсем маленького ордена воинов-монахов приверженцев хватит лишь на общину или задачу размаха деревни. Орден с монастырями и опорными пунктами по всему королевству может иметь достаточно силы, чтобы влиять на события в масштабе целой страны. Точно так же небольшой академии может хватить, чтобы принести просвещение в город и улучшить жизнь его мужчин и женщин, но не хватит охвата, чтобы влиять на окружающую область. Отдельные воины-монахи или конкретные учёные могут играть большие роли и в других уголках сеттинга, но само заведение не может твёрдо рассчитывать, что сумеет взять на себя такие роли.\nИногда ПИ может взяться выковать Творение или вывести особую кровную линию магических или проклятых существ. Если у него есть необходимые средства и возможности для такого великого свершения, размахом следует считать общее число людей, которых магия затронет за весь срок своего существования. Так, перемена размаха деревни может распространяться на десять поколений очень малочисленного рода: чары длятся очень долго, но в каждый момент действуют лишь на нескольких человек. Передаваться они могут особым обучением, магическим посвящением или естественным наследованием крови. Когда предел размаха достигнут, магия больше не передаётся: она либо исчерпана, либо её тонкие сдвиги повредили её безвозвратно. И наоборот, очень большой размах такой работы означает, что затронуты будут многие, — но столь масштабная перемена продержится лишь несколько поколений, прежде чем достигнет предельного числа затронутых. Из-за этих ограничений многие такие усиленные кровные линии и укреплённые магические традиции очень разборчивы в приёме новых членов.\nПо желанию ПИ, создающие такое магическое творение, могут закрепить его навечно, сделав наследуемым или передаваемым на неопределённое будущее. Однако столь кропотливые творения гораздо труднее, чем простая привязка эффекта к естественному току магии, и потому стоят вчетверо дороже обычного. Так, наделить жителей деревни неким магическим свойством, которое они будут вечно передавать сопоставимому числу наследников, — это множитель ×8 вместо ×2.\n\n\n| Правдоподобие цели | Базовая сложность | Охваченный размах | Множитель сложности | Сильнейший активный противник | Множитель сложности |\n|---|---|---|---|---|---|\n| Правдоподобная | 1 | Деревня | ×2 | Мелкая сошка | ×2 |\n| Маловероятная | 2 | Город | ×4 | Местные лидеры | ×4 |\n| Невозможная | 4 | Область | ×8 | Крупный вельможа или зверь | ×8 |\n| – | – | Королевство | ×16 | Король или прославленное чудовище | ×16 |\n| – | – | Известный мир | ×32 | – | – |\n\nПротиводействие умножается ещё на ×2, если местное население эмоционально или социально против перемены."},{"n":"7.4.0","l":2,"te":"Determining the Opposition","tr":"Определение противодействия","en":"Once you have decided on the difficulty and the scope, you now \nneed to identify the most significant people or power bases that \nwould be opposed to this change. In some cases, there may be no \none opposed to the alteration; turning a steppe oasis into a trading \npost might not have anyone to object if there are no nomads who \ncontrol the land, nor terrible beasts to threaten settlers. In most cases, \nhowever, there’s going to be at least one person, creature, or other \npower in the area who would prefer things not change.\nIf the opposition comes in the form of ordinary peasants or citizens, \nminor bandit rabble, normal dangerous animals, or other disorga-\nnized and low-level threats, then the difficulty is multiplied by x2.\nIf the opposition is organized under competent leadership, such as \na local baron, rich merchant, or persuasive priest, or if the opposition \nis some dangerous but not especially remarkable monster, then the \ndifficulty is multiplied by x4.\nIf the opposition is entrenched and powerful, such as a group of \nnobles, an influential bandit king, a crime boss, a major city’s mayor, \nor a monster impressive enough to have developed its own legendry, \nthen the difficulty is multiplied by x8.\nIf the opposition involves facing down a king, a legendary mon-\nster, the primate of a major religion, or some similar monarchic power, \nthen the difficulty is multiplied by x16.\nWhen measuring opposition, only the greatest opponent counts. \nThus, if the king, the nobility, and the local village chief all hate an\nidea, the difficulty modifier is x16. If the king is then persuaded to \nrelent, the difficulty modifier becomes x8, until the barons are pac-\nified, after which the village chieftain is the only opposition left, for \na x2 modifier.\nOn top of this, if the change inspires widespread popular dis-\napproval or unease among the populace affected by the change, \nmultiply the modifier by an additional x2. Such changes usually touch \non delicate questions of group identity, cultural traditions, or basic \nvalues, and the people in the change’s scope are likely to resist such \nmeasures on multiple levels.\nAs an example, assume an idealistic band of adventurers dreamed \nof extirpating slavery from an entire kingdom. The natives use slaves \nfor work and status, but their labor isn’t crucial to the economy’s sur-\nvival, so the GM decides it is merely improbable to give up slavery, \nfor a base difficulty of 2. The scope is kingdom-wide, so 2 is multiplied \nby 16, for a difficulty of 32. As the situation stands now, the king has \nno desire to infuriate the wealthy magnates of his kingdom by taking \naway their free labor, so he would oppose it for an additional x16 \nmultiplier, for a total difficulty of 512. Oh, and the natives find the idea \nof accepting slaves as equals to be emotionally abhorrent, so that’s \nan additional x2 multiplier, for a final difficulty of 1,024.\nIt is very unlikely for the heroes to manage to scrape up the 1,024 \npoints of Renown needed to make this change out of hand. They’re \ngoing to have to alter the situation to quell the opposition and make \nspecific strides toward making the ideal more plausible before they \ncan finally bring about their dream.","ru":"Определив сложность и размах, нужно установить, какие значимые люди или силы будут противостоять этой перемене. Иногда против неё не будет никого: превращению степного оазиса в торговый пост никто не воспротивится, если этой землёй не владеют кочевники и поселенцам не грозят страшные звери. Однако в большинстве случаев в округе найдётся хотя бы один человек, существо или иная сила, которых устраивает всё как есть.\nЕсли противодействие исходит от обычных крестьян или горожан, мелкого разбойничьего сброда, обычных опасных животных или иных разрозненных и незначительных угроз, сложность умножается на ×2.\nЕсли противодействие организовано под умелым руководством — местный барон, богатый купец, убедительный жрец — или если противник представляет собой опасное, но ничем особенно не выдающееся чудовище, сложность умножается на ×4.\nЕсли противник прочно укоренён и силён — группа вельмож, влиятельный разбойничий король, глава преступного мира, градоначальник крупного города или чудовище настолько внушительное, что обросло собственными легендами, — сложность умножается на ×8.\nЕсли противостоять придётся королю, легендарному чудовищу, предстоятелю крупной религии или иной власти монаршего масштаба, сложность умножается на ×16.\nПри оценке противодействия считается только сильнейший противник. Так, если идею ненавидят и король, и знать, и староста местной деревни, модификатор сложности равен ×16. Если короля удалось уговорить отступиться, модификатор становится ×8 — пока не усмирены бароны, после чего единственным противником остаётся деревенский староста с модификатором ×2.\nВдобавок, если перемена вызывает широкое народное недовольство или тревогу среди затронутого населения, модификатор умножается ещё на ×2. Такие перемены обычно задевают тонкие вопросы группового самосознания, культурных традиций или базовых ценностей, и люди в пределах размаха перемены будут сопротивляться подобным мерам на всех уровнях сразу.\nДля примера: допустим, компания идеалистов-искателей приключений возмечтала искоренить рабство в целом королевстве. Местные держат рабов для работы и престижа, но их труд не жизненно важен для выживания хозяйства, так что Мастер решает: отказаться от рабства здесь всего лишь маловероятно — базовая сложность 2. Размах — целое королевство, поэтому 2 умножается на 16, итого сложность 32. При нынешнем положении дел король не имеет ни малейшего желания злить богатых магнатов королевства, отнимая у них дармовой труд, так что он воспротивится — ещё множитель ×16, итого сложность 512. Ах да: сама мысль принять рабов как равных местным эмоционально отвратительна, так что это ещё множитель ×2 — окончательная сложность 1024.\nКрайне маловероятно, что герои сумеют наскрести 1024 пункта Славы, чтобы провернуть такую перемену с ходу. Им придётся менять само положение дел: гасить противодействие и целенаправленно, шаг за шагом делать свой идеал более правдоподобным, прежде чем мечта наконец сбудется."},{"n":"7.5.0","l":2,"te":"Decreasing Difficulty","tr":"Снижение сложности","en":"Adventurers who have a dream bigger than their available Renown \nhave several options for bringing it about more rapidly. The party \ncan use some or all of these techniques for making their ambition \nmore feasible, and the GM might well insist on at least some of them \nbefore the PCs can succeed.\nThey can spend money. Sometimes a problem can be solved by \nthrowing enough money at it, either by paying off troublesome op-\nponents, constructing useful facilities or installations, or hiring enough \nhelp to push the cause through. Money is often useful, but it eventually \nbegets diminishing returns; once everything useful has been bought, \nadditional coinage brings little result.\nThe adjacent table shows how much a point of Renown dedicated \nto the project costs. The first few points come relatively cheaply, but \nafter that the price increases rapidly. Eventually, there comes a point \nwhere only the wealth of empires can shove a massive project through \nwith sheer monetary force. Small projects and modest ambitions are \ngenerally easy to accomplish with cash, but society-wide alterations \nand massive undertakings can defeat the richest vault.\nThey can build institutions. If the PCs want a fortified monastery \nloyal to them, they can either throw enough Renown at their goal until\nRenown\nCost in Silver Pieces\nBought\nper Point\nFirst 1-4 points\n500 per point\nNext 4 points\n2,000 per point\nNext 8 points\n4,000 per point\nNext 16 points\n8,000 per point\nNext 32 points\n16,000 per point\nNext 64 points\n32,000 per point\nFurther points\nProhibitively expensive\nsix, for 34,000 sp total.\nallied NPCs and local potentates think it’s a good idea to buy them \noff by building it for them, or they can actually go out and purchase \nit with their own money. They can hire the masons, recruit the monks, \nand find a trustworthy abbot to act as regent for the heroes. Such steps \nmay not be enough to completely attain the purpose, as they’ll still \nhave to deal with quelling any local opposition to the new monastery \nand any innate implausibility of establishing a monastery wherever \nthey want to put it, but it’ll get them a long way toward success.\nThe GM decides a reasonable cost for the institution they want \nto build and the assorted recruits they’ll need to operate it, using the \nguidelines in this section. Prices will vary drastically based on the \nsituation; building a splendid stone castle in a desert with no good \nsource of stone will cost far more than listed, while hiring skilled \nartisans in a major metropolis won’t be nearly as difficult as finding \nthem in an empty tundra.\nOnce the cost is paid, the GM assigns a suitable amount of Re-\nnown toward attaining the goal. For example, if the overall goal is \nsecuring the trade route between two distant cities, building a fortified \ncaravansary with patrolling road guards might give enough Renown \nto solve half the problem. The rest of it might require dealing with the \nopposition that’s making the hazard in the first place, such as the \ndepredations of a bandit chief or the perils of the savage monsters \nthat haunt the road.\nThey can nullify opposition. Either through gold, persuasion, \nor sharp steel, the PCs can end the opposition of those powers who \nstand against their ambition. Opponents who can be bought off might \nbe managed with nothing more than a lengthy discussion and an \nexchange of valuables, but other opponents might need full-fledged \nadventures to deal with. Some might demand favors in exchange \nfor withdrawing their opposition, or quests accomplished on their \nbehalf, or enemies snuffed out by the swords of the heroes. Others \ncould be so unalterably opposed to the idea that they must either be \nkilled or endured.\nThey can adventure in pursuit of their goal. This adventure \nmight be something as simple as finding the den of a troublesome \npack of monsters, or it could be something as involved as delving \ninto an ancient dungeon to recover the lost regalia that will give them \nthe moral authority to make demands of a troublesome prelate. Such \nadventures will give the PCs their usual award of Renown, but they \ncan also give a bonus award toward their specific goal if their efforts \nare particularly relevant.\nThis bonus is determined by the GM. The easiest way for the GM \nto pick the proper amount for the award is to privately estimate how \nmany such adventures their goal is worth and then award Renown \naccordingly. Thus, if the GM thinks that three adventures like this one \nis as much focus and effort as the group should have to spend toward \naccomplishing their aim, then each adventure will decrease the goal’s \ndifficulty by one-third.\nAdventuring is by far the most efficient way to accomplish a \ngroup’s goals, assuming they can come up with adventures that are \nrelevant. This is intentional; a goal that gives the GM an easy supply \nof adventuring grist is a genuine contribution to the game. The more \nadventures that a GM gets out of PC ambitions, the easier it will be \nto prepare for the game and ensure the players are involved in the \ncampaign.\nFor example, purchasing 14 points of Renown would cost 2,000 \nfor the first four, 8,000 for the next four, and 24,000 for the next","ru":"У искателей приключений, чья мечта больше их наличной Славы, есть несколько способов приблизить её быстрее. Партия может пустить в ход некоторые из этих приёмов или все сразу, чтобы сделать свой замысел более достижимым, а Мастер вполне может настоять хотя бы на части из них, прежде чем ПИ добьются успеха.\n**Они могут тратить деньги.** Иногда задача решается, если завалить её деньгами: откупиться от досадных противников, возвести полезные постройки и сооружения или нанять достаточно помощников, чтобы продавить дело. Деньги часто полезны, но со временем отдача падает: когда всё полезное уже куплено, лишняя монета мало что даёт.\nТаблица рядом показывает, во сколько обходится пункт Славы, вложенный в начинание. Первые несколько пунктов достаются сравнительно дёшево, но дальше цена растёт стремительно. Рано или поздно наступает предел, за которым лишь богатства империй способны протолкнуть громадное начинание чистой денежной силой. Малые начинания и скромные замыслы обычно легко осуществить за наличные, но перемен в масштабе всего общества и исполинских предприятий не одолеть и богатейшей сокровищнице.\n**Они могут строить институции.** Если ПИ нужен верный им укреплённый монастырь, они могут либо вкладывать в цель Славу, пока союзные NPC и местные владыки не решат, что проще откупиться и построить его для них, либо действительно пойти и купить его за собственные деньги: нанять каменщиков, набрать монахов и найти надёжного аббата, который будет править от имени героев. Этих шагов может не хватить для полного достижения цели — придётся ещё гасить местное противодействие новому монастырю и преодолевать врождённую неправдоподобность затеи поставить монастырь именно там, где им захотелось, — но к успеху они продвинут изрядно.\nМастер назначает разумную цену институции, которую хотят построить герои, и разношёрстным работникам, которые нужны для её работы, опираясь на ориентиры этого раздела. Цены будут резко меняться от ситуации: великолепный каменный замок в пустыне без хорошего источника камня обойдётся куда дороже указанного, а нанять умелых ремесленников в большом столичном городе не в пример проще, чем отыскать их в пустой тундре.\nКогда цена уплачена, Мастер зачисляет в счёт цели подобающее количество Славы. Например, если общая цель — обезопасить торговый путь между двумя далёкими городами, укреплённый караван-сарай с дорожной стражей в дозорах может дать достаточно Славы, чтобы решить половину задачи. Остальное потребует разобраться с тем противодействием, что и порождает опасность: с грабежами разбойничьего вожака или свирепыми чудовищами, что рыщут вдоль дороги.\n**Они могут устранять противодействие.** Золотом, убеждением или острой сталью ПИ могут покончить с сопротивлением сил, стоящих на пути их замысла. С теми, кто продаётся, порой хватает долгого разговора и обмена ценностями, но с иными противниками не справиться без полноценных приключений. Кто-то потребует услуг в обмен на отказ от противодействия, исполненных для него поручений или врагов, погашенных мечами героев. А кто-то настолько непримиримо против самой идеи, что его остаётся либо убить, либо терпеть.\n**Они могут отправиться в приключения ради своей цели.** Такое приключение может быть простым — найти логово досаждающей стаи чудовищ, — а может быть и замысловатым: спуститься в древнее подземелье за утраченными регалиями, которые дадут моральное право предъявлять требования несговорчивому прелату. За такие приключения ПИ получают обычную награду Славой, но если их труды особенно относятся к делу, они могут получить и премию в счёт своей конкретной цели.\nРазмер премии определяет Мастер. Проще всего прикинуть про себя, скольких таких приключений стоит цель группы, и начислять Славу соответственно. Так, если Мастер считает, что три подобных приключения — это ровно столько внимания и сил, сколько группа должна потратить на достижение своей цели, каждое приключение снизит сложность цели на треть.\nПриключения — безусловно самый выгодный способ добиваться групповых целей, если удаётся придумывать приключения, относящиеся к делу. Так задумано: цель, которая даёт Мастеру лёгкий запас сюжетного сырья, — настоящий вклад в игру. Чем больше приключений Мастер извлекает из амбиций ПИ, тем легче готовиться к игре и тем вернее игроки вовлечены в кампанию.\n\n\n| Куплено Славы | Цена за пункт в серебряных монетах |\n|---|---|\n| Первые 1–4 пункта | 500 за пункт |\n| Следующие 4 пункта | 2 000 за пункт |\n| Следующие 8 пунктов | 4 000 за пункт |\n| Следующие 16 пунктов | 8 000 за пункт |\n| Следующие 32 пункта | 16 000 за пункт |\n| Следующие 64 пункта | 32 000 за пункт |\n| Дальнейшие пункты | Запретительно дорого |\n\nНапример, покупка 14 пунктов Славы обойдётся в 2 000 за первые четыре, 8 000 за следующие четыре и 24 000 за следующие шесть — всего 34 000 см."},{"n":"7.6.0","l":2,"te":"Achieving the Goal","tr":"Достижение цели","en":"Once the PCs have piled up enough Renown and lowered the dif-\nficulty enough to actually make it feasible to achieve the goal, they \nneed to take the final steps necessary to complete the work. For a \nminor goal, this might be a simple matter of describing how they take \ncare of the details, while a vast campaign of effort might culminate \nin several brutal, perilous adventures.\nThe time this change takes will rest with the GM’s judgment. If the \nPCs have been working on the project for some time already this effort \nshould be taken into account and lessen the time required.\nFor mundane changes or changes the GM doesn’t really want to \nfocus on, the PCs simply declare that they’re spending their Renown \nand using their own good name, personal prowess, and accumulated \nfriendships and contacts to pull off their ambition. They might give \nexamples of some of the ways they’re working to achieve the goal \nand specify what allies or resources they’re deploying. The GM then \ndescribes the outcome of their efforts. They may not be completely \nsuccessful and events may not work out exactly as they planned, but \nthey’ll get the substance of what they wanted.\nFor changes that push through opposition instead of subverting it, \nthose that just pay the price for the opposition multiplier, the GM might \nmake the PCs deal with consequences of that unquelled opposition. \nThe kingdom might outlaw slavery, but if not all the opposition was \ndefeated there may remain small pockets where the law doesn’t reach \nor the populace refuses to accept the freed slaves as fellow citizens. \nSolving these remnant problems might require their own projects or \nadventures.\nFor magical, impossible, or truly epic changes, the GM might \noblige the PCs to face some culminating adventure or challenge \nbefore their ambition becomes real. They might’ve marshaled enough \nforce and enough allies to depose the wicked king, but now the day of \nreckoning has come and they must face the tyrant and his elite guard \nin a pitched battle within the capital city. Some heroic changes might \nrequire several such adventures, with failure meaning that their efforts \nsomehow fall short of complete success. If the tyrant is not slain, he \nmight escape into exile to foment further trouble, or he might flee to \na province he still can control.\nOnce the change is successfully achieved, the GM should take a \nlittle while to consider the larger ramifications of the event. Who in the \nsurrounding area is going to take notice of the events, and what are \nthey likely to do about it? What allies of the PCs might be strengthened \nby the change and able to push their own agendas further? What \nare the longer-term consequences of their actions, and how might\nthese show up during future adventures?\nThe ultimate point of changes like these is not simply to make marks \non the campaign map, but to create the seeds of future adventures and \nfuture events. The actions of the characters create reactions, and the \ndeeper they involve themselves in the campaign setting, the more that \nsetting is going to involve itself with them. This is ultimately a virtuous \ncircle for the GM and the group, as it helps to generate adventures \nand events that matter to the players and spares the GM from con-\nfusion or uncertainty over what kind of adventuring grist to generate.","ru":"Когда ПИ накопили достаточно Славы и снизили сложность настолько, что цель стала действительно достижимой, остаётся сделать последние шаги и завершить дело. Для скромной цели, возможно, хватит просто описать, как герои улаживают частности, а огромная кампания трудов может увенчаться несколькими жестокими, гибельными приключениями.\nСколько времени займёт перемена — на усмотрение Мастера. Если ПИ уже какое-то время трудятся над начинанием, эти усилия следует учесть и сократить требуемый срок.\nДля обыденных перемен или перемен, на которых Мастер не хочет задерживаться, ПИ просто объявляют, что тратят Славу и пускают в ход своё доброе имя, личную доблесть и накопленные дружбы и связи, чтобы провернуть задуманное. Они могут привести примеры того, как именно работают на цель, и указать, каких союзников и какие ресурсы задействуют. Затем Мастер описывает исход их усилий. Возможно, успех будет неполным и события повернутся не совсем так, как планировалось, но суть желаемого герои получат.\nЕсли перемена продавлена сквозь противодействие, а не подорвала его изнутри — то есть за множитель противодействия просто уплачена цена, — Мастер может заставить ПИ разбираться с последствиями неусмирённого сопротивления. Королевство может объявить рабство вне закона, но если сломлено не всё противодействие, останутся островки, куда закон не дотягивается или где население отказывается принимать освобождённых рабов как сограждан. Решение этих остаточных проблем может потребовать собственных начинаний и приключений.\nДля магических, невозможных или воистину эпических перемен Мастер может обязать ПИ пройти завершающее приключение или испытание, прежде чем их замысел станет явью. Пусть они собрали достаточно сил и союзников, чтобы низложить злого короля, — но вот настал день расплаты, и им предстоит сойтись с тираном и его отборной стражей в решающей битве в столице. Иные героические перемены могут потребовать нескольких таких приключений, и провал означает, что усилия так и не увенчались полным успехом. Если тиран не убит, он может бежать в изгнание и сеять новые смуты — или укрыться в провинции, которую всё ещё держит в руках.\nКогда перемена успешно свершилась, Мастеру стоит немного подумать о её более широких последствиях. Кто в округе заметит случившееся и что, скорее всего, предпримет? Какие союзники ПИ усилятся благодаря перемене и смогут дальше продвигать собственные планы? Каковы долгосрочные последствия действий героев и как они могут проявиться в будущих приключениях?\nКонечный смысл таких перемен — не просто оставить отметки на карте кампании, а посеять семена будущих приключений и событий. Действия персонажей рождают ответные действия, и чем глубже герои врастают в мир кампании, тем сильнее этот мир вовлекается в их жизнь. В итоге это благотворный круг для Мастера и группы: он помогает порождать приключения и события, которые важны игрокам, и избавляет Мастера от растерянности и сомнений, из какого сюжетного сырья готовить игру."},{"n":"7.7.0","l":2,"te":"Magical Projects","tr":"Магические начинания","en":"Some projects are flatly impossible in nature, such as changing hu-\nmans into some new humanoid species or creating a magical effect \nthat covers an entire region. These efforts are a step beyond ordinary \nimpossibility, as they often require measures entirely beyond the \nphysical capabilities of normal civilizations.\nWhile exceedingly difficult, such projects are not out of the ques-\ntion for powerful mages who have the help of skilled adventurers. \nThey do require a few more steps than an ordinary project would \nrequire, however.\nThe heroes must create one or more Workings dedicated to en-\nabling the change, using the guidelines given in the Magic chapter. \nThe scope of these Workings must be large enough to affect the scope \nof the change itself; if the alteration is to be done to an entire region, \nthen a region-sized Working must be built. Workings so large as to \naffect an entire kingdom are beyond the scope of modern magic, \nand only some special quest into the fathomless past could discover \nthe keys to grand, world-spanning alterations.\nThe degree of the Working will depend on the degree of the \nchange. The devising of a race of humanoid creatures similar to \nhumans but cosmetically different might be a Minor Working, while \nmore substantial alterations will require great degrees of power. The \nsummoning of a river from the depths of the earth might be a Major \nchange for a small stream, while something the size of the Amazon \nmight be of Supreme difficulty.\nIf the magical change is impossible but relatively modest in scope, \nthen one great Working will be necessary to empower it. If the change \nis significant and will have major repercussions on the future area, \nit will take two, while a change that seems barely within the limits of \npossibility will need three Workings to support it, all of the appro-\npriate degree and scope. The construction of these Workings often \nrequire adventures in their own right to find the critical components \nor esoteric substances needed to erect them, to say nothing of the \nmaterial cost of the work.\nIf these Workings are later destroyed or corrupted the change \nitself may be damaged as well. Sometimes the effect is so graven on \nthe world that it continues unsupported, but other times the change \nfades away into something more mundane. In the worst cases, the \nmagic goes rampant and terrible consequences are born from its \nuncontrolled fury. As a consequence, most nations are highly averse \nto the construction of large-scale magical infrastructure, even when \nthey can afford to do so.","ru":"Некоторые начинания невозможны по самой своей природе — например, превратить людей в новый гуманоидный вид или создать магический эффект, накрывающий целую область. Эти затеи на ступень выше обычной невозможности: им зачастую нужны средства, целиком лежащие за пределами физических возможностей обычных цивилизаций.\nПри всей их неимоверной трудности такие начинания не заказаны могущественным магам, которым помогают умелые искатели приключений. Однако шагов они требуют чуть больше, чем обычное начинание.\nГерои должны создать одно или несколько Творений, посвящённых этой перемене, по правилам главы о магии. Размах этих Творений должен покрывать размах самой перемены: если преобразить нужно целую область, придётся возвести Творение размаха области. Творения, способные охватить целое королевство, лежат за пределами современной магии, и лишь особый поход в бездонное прошлое мог бы открыть ключи к великим переменам мирового размаха.\nСтепень Творения зависит от глубины перемены. Сотворить расу гуманоидов, подобных людям, но внешне иных, может быть малым Творением, а более существенные превращения потребуют больших степеней силы. Вызвать реку из земных глубин — перемена большой степени, если речь о малом ручье, и высшей сложности, если о чём-то размером с Амазонку.\nЕсли магическая перемена невозможна, но сравнительно скромна по размаху, чтобы дать ей силу, понадобится одно грандиозное Творение. Если перемена значительна и серьёзно отзовётся на будущем этих мест, потребуется два, а перемена, которая кажется едва умещающейся в пределы возможного, потребует трёх поддерживающих Творений — все подобающей степени и размаха. Возведение этих Творений часто само по себе требует приключений: нужно добыть ключевые компоненты и эзотерические субстанции, без которых их не воздвигнуть, не говоря уж о материальной цене работ.\nЕсли позже эти Творения разрушат или осквернят, может пострадать и сама перемена. Иногда эффект так глубоко врезан в мир, что держится и без опоры, но бывает, что перемена выцветает во что-то более обыденное. В худших случаях магия срывается с привязи, и её необузданная ярость рождает ужасные последствия. Поэтому большинство государств крайне неохотно смотрит на строительство масштабной магической инфраструктуры, даже когда может себе её позволить."},{"n":"7.8.0","l":2,"te":"Major Projects and Existing Factions","tr":"Великие начинания и существующие фракции","en":"Players are likely to end up with goals or ambitions that directly \ninvolve them with local factions or potentially touch on Assets or \nother resources significant to faction powers. This is normal, and it’s \nnot difficult to integrate the two systems when they happen to touch.\nAs a general rule, major projects should be treated just as adven-\ntures would be. When a project would plausibly damage a faction’s \nAssets, then the Assets will be damaged or destroyed. When they \nwould create an Asset useful for a faction, whether one belonging to \nthe players or to another group, then the Asset is created. If a faction \ndoesn’t care for a project, it might turn into a source of opposition that \nmust be quelled or overcome, while an allied faction might supply \nsome portion of the Renown itself by taking an action to aid the PCs.\nThe help of a faction should be scaled by the GM; if an empire \ndecides to give the PCs a castle, then it might be such a minor part \nof the faction’s holding that no Treasure expense or other effort is \nrequired to do so. A small religious cult that wants to help build a \nmonastery for the PCs might not be able to give nearly as much help, \nand might simply be good for a quarter of the Renown needed if \nthey spend an action assisting the PCs. Conversely, when a faction is \nopposed to some measure, the PCs will probably have to undertake \nan adventure to change its mind or pull the fangs that it’s using to \ninterfere with their efforts.","ru":"Цели и амбиции игроков наверняка рано или поздно напрямую сведут их с местными фракциями или заденут Активы и другие ресурсы, важные для фракционных сил. Это нормально, и совместить обе системы там, где они соприкасаются, несложно.\nОбщее правило: великие начинания разбираются так же, как приключения. Если начинание правдоподобно повредило бы Активы фракции, Активы получают урон или уничтожаются. Если оно создало бы Актив, полезный фракции — принадлежащей игрокам или кому-то ещё, — Актив создаётся. Фракция, которой начинание не по нраву, может обернуться источником противодействия, которое придётся гасить или преодолевать, а союзная фракция может сама покрыть часть Славы, потратив действие на помощь ПИ.\nМасштаб фракционной помощи определяет Мастер. Если империя решает подарить ПИ замок, для её владений это может быть такая мелочь, что не потребуется ни трат Казны, ни иных усилий. Маленький религиозный культ, желающий помочь ПИ построить монастырь, даст куда меньше — возможно, покроет лишь четверть нужной Славы, потратив действие на содействие героям. И наоборот: если фракция противится какой-то мере, ПИ, скорее всего, придётся отправиться в приключение, чтобы переубедить её — или вырвать клыки, которыми она мешает их делу."},{"n":"7.9.0","l":2,"te":"Player-Run Factions and Major Projects","tr":"Фракции под управлением игроков и Великие начинания","en":"PCs who have the friendship or control of factions can leverage them \nto assist in their grand plans. A faction can assist on a project only \nonce per faction turn, and this help counts as its action for the turn.\nWhen a faction helps, it spends one point of Treasure and decreas-\nes the difficulty of the project by the sum total of its Wealth, Force, \nand Cunning attributes, down to a minimum difficulty of 1 point. The \nfaction can’t usually complete a major project on its own; it needs the \nPC or some driving personality to envision and implement the plan. \nA faction needs to spend Treasure and help only once on a project \nto decrease the difficulty. The difficulty reduction remains until the \nproject is complete or the faction chooses to withdraw its support for \nsome reason. More than one faction can contribute its help, if they \ncan be persuaded.\nIf the faction is ideally suited to the project, such as a government \nestablishing a new political order, or a religion instituting a new cul-\ntural norm, or a thieves’ guild forming a cabal of assassins, then their \nattribute total is doubled for purposes of calculating the new difficulty.\nIf the faction is willing or forced to go to extremes in helping \na project, either out of desperation or the ruthless demands of its \nleadership, it can commit its Assets and own institutional health to \nthe project. Any Asset or Base of Influence in the same location as \nthe project can accept hit point damage to lower the difficulty; each \nhit point they spend lowers it by one point. This kind of commitment \nis difficult to calibrate safely; at the end of the spend, each Asset or \nBase of Influence that contributed suffers an additional 1d4 damage. \nThis may be enough to destroy an Asset, or even destroy the faction \nitself if enough damage is done to a Base of Influence. If the Asset \nis destroyed in the process of helping the project, the fallout of its \ncollapse or exhaustion may have local consequences of its own.\nIf the faction is of a vastly larger scale than the project, such as a \nprosperous kingdom helping to construct a new border village, the \nentire project can be resolved in a single action. In some cases, the \nGM may not even require the faction to spend any Treasure, as the \nexpense is so small relative to its resources that it’s not worth tracking.","ru":"ПИ, которые дружат с фракциями или управляют ими, могут привлекать их к своим великим планам. Фракция может помочь начинанию лишь раз за ход фракций, и эта помощь считается её действием за ход.\nПомогая, фракция тратит один пункт Казны и снижает сложность начинания на сумму своих атрибутов Богатства, Мощи и Хитрости — но не ниже минимальной сложности в 1 пункт. Обычно фракция не может завершить великое начинание сама: ей нужен ПИ или иная движущая личность, чтобы замыслить и воплотить план. Чтобы снизить сложность, фракции достаточно потратить Казну и помочь один раз. Снижение сложности сохраняется, пока начинание не завершено или пока фракция по какой-то причине не отзовёт поддержку. Помочь может и не одна фракция, если их удастся уговорить.\nЕсли фракция идеально подходит начинанию — правительство учреждает новый политический порядок, религия насаждает новую культурную норму, гильдия воров сколачивает клику убийц, — сумма её атрибутов удваивается при расчёте новой сложности.\nЕсли фракция готова — или принуждена — идти на крайности ради начинания, от отчаяния или по безжалостной воле руководства, она может бросить на него свои Активы и само здоровье организации. Любой Актив или База влияния в том же месте, что и начинание, может принять урон пунктам здоровья, чтобы снизить сложность: каждый потраченный пункт здоровья снижает её на один пункт. Такую самоотдачу трудно безопасно дозировать: по завершении траты каждый Актив и каждая База влияния, внёсшие вклад, получают дополнительно 1d4 урона. Этого может хватить, чтобы уничтожить Актив — или даже саму фракцию, если Базе влияния досталось достаточно урона. Если Актив погиб, помогая начинанию, его крах или истощение могут сами по себе иметь местные последствия.\nЕсли фракция несоизмеримо крупнее начинания — скажем, процветающее королевство помогает отстроить новую пограничную деревню, — всё начинание можно разрешить одним действием. В некоторых случаях Мастер может даже не требовать от фракции трат Казны: расход настолько мал по сравнению с её ресурсами, что его не стоит и учитывать."}]}</script>
<script>
"use strict";
/* Документ открыт внутри рамки на чужой странице? Тогда высотой и прокруткой
   управляет внешняя страница, а не мы. */
const EMBED = (window.parent !== window);
if(EMBED) document.body.classList.add("embed");

const DATA = JSON.parse(document.getElementById("srd-data").textContent);
const SECS = DATA.sections;
const byNum = new Map(SECS.map(s => [s.n, s]));

const UI = {
  ru:{ title:"Миры без числа", sub:"Справочный документ по системе 1.0",
    search:"Поиск по документу…", contents:"Разделы", inThis:"В этом разделе",
    navOpen:"Разделы", navClose:"Закрыть",
    found:"Найдено", nothing:"Ничего не найдено. Поиск идёт и по русскому, и по английскому тексту.",
    orig:"В оригинале", prev:"Назад", next:"Дальше", goto:"Открыть раздел",
    noText:"В этом разделе нет своего текста — это заголовок главы.",
    foot:"Оригинал: Worlds Without Number Systems Reference Document v1.0, Kevin Crawford, 13 марта 2024. Автор передал документ в общественное достояние по лицензии CC0. Русский перевод распространяется свободно." },
  en:{ title:"Worlds Without Number", sub:"Systems Reference Document 1.0",
    search:"Search the document…", contents:"Contents", inThis:"In this section",
    navOpen:"Contents", navClose:"Close",
    found:"Found", nothing:"No matches. Search covers both the English and the Russian text.",
    orig:"In Russian", prev:"Back", next:"Next", goto:"Open section",
    noText:"This section has no body text of its own — it is a chapter heading.",
    foot:"Source: Worlds Without Number Systems Reference Document v1.0, Kevin Crawford, 13 March 2024. The author waived copyright and related rights under CC0. The Russian translation is freely distributable." }
};

/* ── страницы: главы (X.0.0) и разделы (X.Y.0); подразделы живут внутри ── */
const PAGES = SECS.filter(s => s.n === "intro" || s.l === 1 || s.l === 2);
const pageIdx = new Map(PAGES.map((s, i) => [s.n, i]));
function childrenOf(num){
  if(num === "intro") return [];
  const p = num.split(".");
  if(p[2] === "0" && p[1] !== "0")            // раздел X.Y.0 → его X.Y.Z и X.Y.Z.W
    return SECS.filter(s => s.n.startsWith(p[0] + "." + p[1] + ".") && s.n !== num);
  return [];
}
function chapterSections(num){               // глава X.0.0 → её разделы X.Y.0
  const p = num.split(".");
  return SECS.filter(s => s.l === 2 && s.n.startsWith(p[0] + "."));
}
/* какая страница показывает данный раздел */
function pageFor(num){
  if(pageIdx.has(num)) return num;
  const p = num.split(".");
  const cand = p[0] + "." + p[1] + ".0";
  return pageIdx.has(cand) ? cand : (p[0] + ".0.0");
}

let lang = (localStorage.getItem("wwn-lang") === "en") ? "en" : "ru";
let cur = "intro", query = "";

const t = () => UI[lang];
const sTitle = s => (lang === "ru" ? (s.tr || s.te) : (s.te || s.tr));
const sAlt   = s => (lang === "ru" ? s.te : s.tr);
const sBody  = s => (lang === "ru" ? s.ru : s.en);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));

/* ═══════════ разметка ═══════════ */
function inline(s){
  s = esc(s);
  s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  s = s.replace(/(^|[\s(«„\-])\*([^*\n]+)\*/g, "$1<em>$2</em>");
  s = s.replace(/`([^`]+)`/g, "<code>$1</code>");
  return s;
}
const isSep = l => /^\|[\s|:—–-]+\|?\s*$/.test(l);
const cells = l => l.replace(/^\|/, "").replace(/\|\s*$/, "").split("|").map(c => c.trim());

function tableHtml(rows){
  const hasHead = rows[1] && isSep(rows[1]);
  let h = "<div class=\"tw\"><table>";
  if(hasHead) h += "<thead><tr>" + cells(rows[0]).map(c => `<th>${inline(c)}</th>`).join("") + "</tr></thead>";
  h += "<tbody>";
  for(const r of rows.slice(hasHead ? 2 : 0)){
    if(isSep(r)) continue;
    h += "<tr>" + cells(r).map(c => `<td>${inline(c)}</td>`).join("") + "</tr>";
  }
  return h + "</tbody></table></div>";
}

/* Каждая непустая строка — самостоятельный абзац: так устроены и исходник, и перевод. */
function renderRu(txt){
  const L = txt.split("\n"); let out = "", seenText = false;
  for(let i = 0; i < L.length; i++){
    const tl = L[i].trim();
    if(!tl) continue;
    let m;
    if((m = tl.match(/^(#{1,6})\s+(.*)$/))){
      /* Первый заголовок первого уровня дублирует название страницы — опускаем его. */
      if(m[1].length === 1 && !seenText){ seenText = true; continue; }
      seenText = true;
      const h = m[1].length <= 2 ? 4 : Math.min(m[1].length + 1, 6);
      out += `<h${h}>${inline(m[2])}</h${h}>`;
      continue;
    }
    seenText = true;
    if(tl.startsWith("|")){
      const rows = []; let j = i;
      while(j < L.length && L[j].trim().startsWith("|")){ rows.push(L[j].trim()); j++; }
      i = j - 1; out += tableHtml(rows); continue;
    }
    if(/^[-*•]\s+/.test(tl)){
      const items = []; let j = i;
      while(j < L.length && /^[-*•]\s+/.test(L[j].trim())){ items.push(L[j].trim().replace(/^[-*•]\s+/, "")); j++; }
      i = j - 1;
      out += "<ul>" + items.map(x => `<li>${inline(x)}</li>`).join("") + "</ul>"; continue;
    }
    if(tl === "---"){ out += "<hr class=\"hr\">"; continue; }
    if((m = tl.match(/^\*\*([^*]{1,72}?):\*\*\s*(.*)$/))){
      out += `<p class="def"><strong>${inline(m[1])}:</strong> ${inline(m[2])}</p>`; continue;
    }
    out += `<p>${inline(tl)}</p>`;
  }
  return out;
}

function renderEn(txt){
  const L = txt.split("\n"); let out = "";
  for(let i = 0; i < L.length; i++){
    const ln = L[i];
    if(!ln.trim()) continue;
    if(ln.includes("\t")){
      const rows = []; let j = i;
      while(j < L.length && (L[j].includes("\t") || !L[j].trim())){
        if(L[j].trim()) rows.push(L[j].replace(/^\t+/, "").replace(/\t+/g, "\t"));
        j++;
      }
      i = j - 1;
      out += "<div class=\"raw\">" + rows.map(r => esc(r.split("\t").join("   "))).join("\n") + "</div>";
      continue;
    }
    const tl = ln.trim();
    if(/^[•·]\s*/.test(tl)){
      const items = []; let j = i;
      while(j < L.length && /^\s*[•·*]\s*/.test(L[j])){ items.push(L[j].trim().replace(/^[•·*]\s*/, "")); j++; }
      i = j - 1;
      out += "<ul>" + items.map(x => `<li>${inline(x)}</li>`).join("") + "</ul>"; continue;
    }
    const m = tl.match(/^([A-Z][A-Za-z0-9’'&/,()– -]{1,60}):\s+(\S.*)$/);
    if(m && m[1].split(/\s+/).length <= 8){
      out += `<p class="def"><strong>${esc(m[1])}:</strong> ${inline(m[2])}</p>`; continue;
    }
    out += `<p>${inline(tl)}</p>`;
  }
  return out;
}
const bodyHtml = s => {
  const b = sBody(s);
  if(!b || !b.trim()) return `<p class="note">${esc(t().noText)}</p>`;
  return lang === "ru" ? renderRu(b) : renderEn(b);
};
