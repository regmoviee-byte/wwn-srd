ние не тратит доступные Некроманту дневные ячейки заклинаний.\n\n### Приказ мёртвым\n\n**Уровень 1**\n\nНекромант простирает свою волю на нежить общим числом Костей здоровья до удвоенного уровня своего персонажа. Эта нежить должна быть видима и находиться в пределах ста футов от колдующего. Нежить получает Ментальный спасбросок против подчинения — со штрафом, равным навыку Магия колдующего. Существа, охваченные заклинанием лишь частично из-за избытка Костей здоровья, просто стоят в оцепенении один раунд. Те же, кто целиком уложился в предел Костей здоровья и подпал под чары, становятся самоубийственно преданы Некроманту, пока колдующий их не отпустит. Сколько бы раз колдующий ни применял это заклинание, связанной одновременно у него может быть нежить общим числом Костей здоровья не выше удвоенного уровня персонажа; первыми освобождаются зачарованные раньше всех.\n\n### Принудить плоть\n\n**Уровень 3**\n\nВидимое живое существо или обладающая физическим телом нежить в пределах 100 футов попадает под эти чары: её плоть и кости временно порабощены волей колдующего. Цель парализована, пока колдующий не отдаст ей команду Действием в свой ход; получив команду, её тело послушно исполнит приказ на её следующем ходу. Разум жертвы заклинанию не подвластен, так что её нельзя заставить читать заклинания, отвечать на вопросы или решать иные умственные задачи, но драться, двигаться и совершать прочие несамоубийственные физические действия она будет как обычно. В начале каждого своего хода цель может делать Физический спасбросок, чтобы сбросить эффект, но каждая попытка неизбежно обходится ей в один пункт урона за уровень колдующего — плоть корчится и рвётся. Если заклинание не сброшено раньше, оно длится до конца сцены.\n\n### Приумножение смертных сил\n\n**Уровень 2**\n\nНекромант может очистить и усилить естественный ток жизненных сил в согласной видимой цели. До конца сцены все Физические спасброски цели получают бонус, равный навыку Магия Некроманта, а став смертельно раненной, она стабилизируется автоматически. Один раз за сцену, Мгновенным действием, она может немедленно исцелить весь урон от раны, которая не ранила её смертельно. Получатель этого заклинания получает одну Системную нагрузку.\n\n### Слияние душ\n\n**Уровень 3**\n\nЛепя пластичное вещество жизненной силы, Некромант может связать узами двух согласных или беспомощных целей. Они должны быть достаточно близко, чтобы Некромант мог их коснуться; после этого, пока заклинание в силе, оба существа объединяют пункты здоровья в общий запас. Раны любого из них вычитаются из этого запаса, и ни один не умрёт, пока запас не дойдёт до нуля, — тогда смертельно ранены оба. Пока заклинание действует, они могут свободно общаться телепатически. Сила иссякает на рассвете; если её развеяли раньше, остаток запаса делится пропорционально."},{"n":"4.7.0","l":2,"te":"Developing New Spells","tr":"Разработка новых заклинаний","en":"To research a new spell, the wizard’s player first writes up the spell \nthey want to develop. The GM then judges its appropriateness for \nthe campaign. If it passes, an appropriate level is assigned to the \nspell and the PC can begin the research process. Researching a spell \nrequires a properly-equipped laboratory, raw materials, and time.","ru":"Чтобы исследовать новое заклинание, игрок волшебника сначала расписывает заклинание, которое хочет разработать. Мастер оценивает, уместно ли оно в кампании. Если заклинание проходит отбор, ему назначается подходящий уровень, и ПИ может приступать к исследованиям. Для исследования заклинания нужны должным образом оснащённая лаборатория, материалы и время."},{"n":"4.7.1","l":3,"te":"Preparing To Develop a Spell","tr":"Подготовка к разработке заклинания","en":"The laboratory must be established in a secure, serviceable room \nor building. A lab sufficient for researching a level 1 or 2 spell can \nfit into a room, one for a 3rd level spell can fit into a house, one for \na 4th level spell can fit into a wizard’s tower, and a lab suitable for \ndevising a new 5th level spell needs its own subterranean research \ncomplex or similar edifice. The cost for the lab is given on the adja-\ncent table; this does not include the price for the building itself. The \nnecessary materials for a lab can generally be acquired in any major \ncity, provided it’s not hostile to sorcerers.\nThe raw materials must also be purchased in a city or gathered \nfrom ransacked lairs by adventurers. They include occult materials, \nesoteric creature body parts, specialized lab equipment, and ob-\nscure monographs and grimoires. These materials are used up in the \nprocess of research.\nThe time required for researching a spell varies with its complexity, \nas given on the table. A wizard can halve this time by spending twice \nas much on raw materials, and adventuring for certain lost grimoires \nor special ingredients might further decrease the time required.\nA wizard can adventure and perform other tasks during their \nresearch time, including the development of Workings or the con-\nstruction of magical items, but they can’t simultaneously research \ntwo spells at once. Wizards kept entirely away from their labs for \nweeks or months at a time might suffer a halt to the work until they \ncan get back to it.","ru":"Лабораторию нужно устроить в надёжном, пригодном помещении или здании. Лаборатория для исследования заклинания 1-го или 2-го уровня умещается в комнате, для заклинания 3-го уровня — в доме, для 4-го — в башне волшебника, а лаборатория для разработки нового заклинания 5-го уровня требует собственного подземного исследовательского комплекса или подобного сооружения. Цена лаборатории указана в таблице рядом; цена самого здания сюда не входит. Всё необходимое для лаборатории обычно можно достать в любом крупном городе, если тот не враждебен к чародеям.\n\nМатериалы тоже покупаются в городе — или добываются искателями приключений из разорённых логовищ. Это оккультные вещества, части тел эзотерических существ, специализированное лабораторное оборудование, редкие монографии и гримуары. В процессе исследования материалы расходуются.\n\nВремя исследования заклинания зависит от его сложности и указано в таблице. Волшебник может вдвое сократить срок, потратив вдвое больше на материалы, а походы за некими утраченными гримуарами или особыми ингредиентами могут сократить его ещё сильнее.\n\nВо время исследований волшебник может искать приключения и заниматься другими делами, включая разработку Творений и создание магических предметов, но одновременно исследовать два заклинания нельзя. Если волшебника неделями или месяцами держат вдали от лаборатории, работа может встать, пока он не вернётся к ней.\n\n**Исследование заклинаний**\n\n| Уровень заклинания | 1 | 2 | 3 | 4 | 5 |\n|---|---|---|---|---|---|\n| Цена лаборатории | 50 000 см | 125 000 см | 250 000 см | 500 000 см | 1 000 000 см |\n| Цена материалов | 25 000 см | 50 000 см | 100 000 см | 200 000 см | 400 000 см |\n| Нужное время | 1 месяц | 2 месяца | 4 месяца | 8 месяцев | 2 года |"},{"n":"4.7.2","l":3,"te":"The Development Skill Check","tr":"Проверка навыка при разработке","en":"Once the lab is established, the raw materials gathered, and the nec-\nessary time taken, the mage makes an Int/Magic skill check against \na difficulty equal to 10 plus the spell level. If they have apprentices \nto assist them, they can add +1 to their skill check. Specialist mages \nresearching spells in their own field add an additional +1 to the skill \ncheck, so an Elementalist researching an Elementalist spell would \nget the bonus, as would a Necromancer researching a spell about \nundeath. Special resources or uniquely apposite grimoires gathered \non an adventure might add an additional bonus to the roll.\nIf the roll is successful, the spell is perfected and added to the cast-\ner’s grimoire. They can teach it to other wizards if they wish, or keep \nit to themselves. Specialist magic can only be learned by wizards of \nthe same tradition; if they took the spell research skill check bonus,\nit’s a specialist spell. Spells devised by High Mages are almost inev-\nitably rediscovered High Magic and can be learned by any mage \ncapable of casting such.\nIf the roll is a failure, the wizard has a choice. They can abandon \ntheir research and start over from scratch, expending new resources \nand time, or they can roll on the formula flaw table. This flaw becomes \npart of their spell, as adjusted by the GM. Some flaws might not be \nproblematic at all; a spell only ever designed to affect the caster isn’t \nmuch hindered by only being usable on willing targets. Other flaws \nmight make the spell worthless or force the PC to start over. If the \ncaster decides to live with the flaw and continue research, they can \nspend half the required research time and make a new skill check at \na cumulative +1 bonus, with no need to spend additional resources.\nA determined and unlucky mage may repeat this process several \ntimes, accruing new flaws each time and increasing their bonus until \nthey eventually come up with a functioning spell. It may be so gnarled \nby flaws as to be scarcely recognizable as their original intent, but \nthey can add it to their grimoire all the same.\nMagical Working Costs\nDifficulty\nArea\nAffected\nDifficulty\nMultiplier\nDegree\nPoints\nTrivial\n1-4\nRoom\nx1\nMinor\n4-8\nBuilding\nx4\nMajor\n8-16\nVillage\nx16\nGreat\n16-32\nCity\nx64\nSupreme\n33-64*\nRegion\nx256\n* Only demi-divine wizards can make these.","ru":"Когда лаборатория устроена, материалы собраны и нужное время потрачено, маг делает проверку Инт/Магия против сложности, равной 10 плюс уровень заклинания. Если ему помогают подмастерья, он добавляет +1 к проверке. Маги-специалисты, исследующие заклинания своего профиля, добавляют ещё +1: этот бонус получит и Стихийник, исследующий заклинание Стихийника, и Некромант, исследующий заклинание о нежизни. Особые ресурсы или на редкость подходящие гримуары, добытые в приключении, могут дать к броску дополнительный бонус.\n\nПри успехе заклинание доведено до совершенства и вносится в гримуар колдующего. Он может по желанию научить ему других волшебников — или оставить при себе. Магию специалистов могут выучить только волшебники той же традиции; если при исследовании был взят бонус специалиста к проверке, заклинание считается заклинанием специалиста. Заклинания, разработанные Высшими магами, почти неизбежно оказываются заново открытой Высшей магией, и выучить их может любой маг, способный такую магию творить.\n\nПри провале у волшебника есть выбор. Он может бросить исследование и начать с нуля, заново тратя ресурсы и время, — или бросить кость по таблице изъянов формулы. Изъян становится частью заклинания с поправками Мастера. Иные изъяны вовсе не страшны: заклинанию, с самого начала задуманному только для самого колдующего, не много вреда от того, что оно действует лишь на согласные цели. Другие изъяны могут обесценить заклинание или вынудить ПИ начать заново. Если колдующий решает смириться с изъяном и продолжить исследование, он может потратить половину требуемого срока и сделать новую проверку навыка с накапливающимся бонусом +1, без затрат дополнительных ресурсов.\n\nУпорный и невезучий маг может повторять этот процесс несколько раз, с каждым заходом набирая новые изъяны и наращивая бонус, пока в итоге не получит работающее заклинание. Оно может оказаться так изувечено изъянами, что в нём едва узнается первоначальный замысел, — но в гримуар оно ложится всё равно.\n\n| d10 | Изъяны формулы заклинания |\n|---|---|\n| 1 | Заклинание может целить только в самого колдующего. |\n| 2 | Заклинание действует только на согласные цели. |\n| 3 | Твоя прежняя работа ошибочна: формула не меняется, но ты не получаешь накапливающийся бонус +1 к броску исследования — ни за это, ни за прежние продолжения работы. |\n| 4 | Заклинание может целить в кого угодно, кроме самого колдующего. |\n| 5 | Заклинание необычно медленное: чтение занимает не меньше Основного действия, а если оно и так требует Основного действия — два Основных действия в два последовательных раунда. |\n| 6 | Заклинание очень выматывает: оно расходует дневную энергию двух заклинаний вместо одного. |\n| 7 | Заклинание бьёт по колдующему жестокой отдачей, добавляя ему 1d4 Системной нагрузки. Если это доводит его Системную нагрузку до максимума, он падает без сознания на десять минут и не может читать это заклинание, пока не сбросит часть Системной нагрузки. |\n| 8 | Заклинание сложнее, чем кажется: его уровень на один выше ожидаемого. Это не увеличивает цену и время исследования, но если ты не можешь читать заклинания такого уровня, весь проект проваливается. |\n| 9 | Заклинание попросту ненадёжно в своих эффектах: при каждом чтении бросай 1d6. На 1 заклинание без толку шипит и гаснет, а ячейка чтения потрачена впустую. |\n| 10 | Вся затея оказалась трагической ошибкой. Весь прогресс и все материалы исследования потеряны; всё придётся начинать с самого начала. |"},{"n":"4.8.0","l":2,"te":"Building Magical Workings","tr":"Возведение Магических творений","en":"In the jargon of wizards, a Working is any stationary, persistent magi-\ncal effect or structure, such a magical ever-flowering spring, an array \nof heatless eternal lamps, or a persistent curse that blights all within \nits reach. Unlike a conventional magical item, a Working cannot be \nmoved from its set location, and unlike a spell it will normally persist \nuntil damage or thaumic decay finally disperses it.\nWorkings come in five commonly-recognized tiers: trivial, minor, \nmajor, great, and supreme. Trivial Workings might be some minor \nmagic like an enchanted light source, while a supreme effort might \ntransform a whole city into a flying metropolis. While lesser Workings \nare still possible for skilled and erudite mages, supreme Workings \nare too mighty to be accomplished by anyone short of a legendary \narchmage.\nA Working requires a skilled mage, a great deal of resources, and \na considerable amount of time. Details can vary based on the arcane \nsuitability of the landscape or especially powerful, useful components, \nbut even a trivial Working is no minor labor.","ru":"На жаргоне волшебников Творение — это любой стационарный, долговечный магический эффект или сооружение: волшебный вечноцветущий источник, гирлянда нежарких вечных ламп, неотступное проклятие, губящее всё в своих пределах. В отличие от обычного магического предмета, Творение нельзя сдвинуть с назначенного места, а в отличие от заклинания, оно обычно держится, пока его не рассеют повреждения или таумический распад.\n\nТворения принято делить на пять степеней: пустячные, малые, большие, великие и высшие. Пустячным Творением может быть какая-нибудь мелкая магия вроде зачарованного светильника, а высшее способно поднять целый город в небо летающей метрополией. Если меньшие Творения ещё по силам умелым и учёным магам, то высшие слишком могучи для кого-либо, кроме легендарного архимага.\n\nТворению нужны умелый маг, огромные ресурсы и изрядное время. Частности могут зависеть от чародейной пригодности местности или особо мощных, полезных компонентов, но даже пустячное Творение — труд не из малых."},{"n":"4.8.1","l":3,"te":"Designing the Working","tr":"Замысел Творения","en":"To create the Working, the architect must first be a spellcaster of at \nleast 6th level, whether a full Mage or a Partial Mage. Mage classes \nthat do not cast spells cannot normally create Workings, as their \nmagic is insufficiently flexible. Less-accomplished spellcasters also \nlack the practical experience necessary to mold the powers.\nThe architect then decides what exactly the Working should do. The \nplayer involved discusses any custom ideas with the GM, judging the \nmagnitude of each effect desired for the Working. A single Working \nmay involve multiple effects, but they should be closely aligned; \nenchantments that provide a magical spring, hot water, enchanted \nlamps, and a pleasant climate might all be established as part of \nthe same housekeeping Working, but placing a ward against devils \nand a magical garden at the same time might not be so plausible.\nThe GM then decides the total difficulty of the Working by adding \nup the difficulty point cost of each element of it. The adjacent table \ngives common ranges for each degree of difficulty, and the GM \nshould pick a number that sounds right; the pettiest of petty Trivial \nmagics might be 1 point, while something that could maybe even be \nMinor in strength would be 4 points. The total cost of the Working \nis whatever element costs most plus half the rest, rounded up. Thus, \nif some 10-point major effect also had a 3-point trivial effect and \n8-point minor effect bundled with it, the whole would have a difficulty \nof 16 points.\nThis difficulty is then multiplied by the area the Working will affect. \nIf the magic spring merely pours a small stream of water into the \nkitchen cellar, the area might only be that of a Room; if the stream \nwas meant to provide a moat around a wizard’s keep, it would affect\na Building, or perhaps even a Village-sized area. If the spring was \nto irrigate miles of surrounding countryside, it would affect a whole \nRegion, and would probably be a great Working to boot, if not su-\npreme. The difficulty total is multiplied by the given multiplier of the \nbiggest area affected, so if the 16-point example above affected the \nwhole wizard’s tower, its final difficulty would be 64 points.\nThe architect must then demonstrate that they can actually design \nsuch a Working. A given designer multiplies their character level by \ntheir Magic skill level times two. Thus, a 6th level High Mage with \nMagic-3 skill would have a total of 36. If this total is equal or greater \nthan the Working’s difficulty, they can establish it alone. If it’s at least \nhalf the difficulty, they can build it if they can find other mages to help \nthem and make up the missing points. If it’s less than half the difficulty, \nthe whole enterprise is too difficult for them to envision.","ru":"Чтобы создать Творение, зодчий прежде всего должен быть заклинателем не ниже 6-го уровня — полным Магом или частичным. Магические классы, не читающие заклинаний, обычно не могут создавать Творения: их магия недостаточно гибка. Менее опытным заклинателям тоже не хватает практики, необходимой, чтобы лепить эти силы.\n\nЗатем зодчий решает, что именно Творение должно делать. Игрок обсуждает свои задумки с Мастером, который оценивает масштаб каждого желаемого эффекта. Одно Творение может нести несколько эффектов, но они должны быть близки по духу: чары, дающие волшебный источник, горячую воду, зачарованные лампы и приятный климат, вполне могут составить одно хозяйственное Творение, а вот оберег от дьяволов вместе с магическим садом — уже сомнительно.\n\nЗатем Мастер определяет общую сложность Творения, складывая стоимость каждого его элемента в пунктах сложности. Таблица рядом даёт обычные диапазоны для каждой степени сложности, а Мастеру стоит выбрать число, которое звучит правдоподобно: мельчайшая из пустячных магий может стоить 1 пункт, а нечто, что по силе тянет уже едва ли не на малое Творение, — 4 пункта. Итоговая стоимость Творения — самый дорогой его элемент плюс половина остальных, с округлением вверх. Так, если к большому эффекту за 10 пунктов прилагаются пустячный за 3 пункта и малый за 8, вся связка имеет сложность 16 пунктов.\n\nЭта сложность затем умножается на охват Творения. Если волшебный источник просто льёт ручеёк воды в кухонный погреб, охватом может быть всего лишь комната; если ручей должен наполнять ров вокруг замка волшебника, Творение охватит здание, а то и целую деревню. Если же источнику предстоит орошать мили окрестных полей, он охватит целую область — и такое Творение вдобавок наверняка будет великим, если не высшим. Итог сложности умножается на множитель самой большой охваченной области: если Творение из примера выше на 16 пунктов охватывает всю башню волшебника, его окончательная сложность — 64 пункта.\n\nЗатем зодчий должен доказать, что подобное Творение ему вообще по силам замыслить. Замысливший Творение умножает свой уровень персонажа на удвоенный уровень навыка Магия. Так, Высший маг 6-го уровня с навыком Магия-3 получает итог 36. Если этот итог не меньше сложности Творения, он может возвести его в одиночку. Если итог составляет хотя бы половину сложности, он может строить Творение, найдя других магов в помощь и покрыв недостающие пункты. Если итог меньше половины сложности, вся затея слишком сложна, чтобы он мог её замыслить.\n\n**Стоимость Магических творений**\n\n| Степень | Пункты сложности | Охват | Множитель сложности |\n|---|---|---|---|\n| Пустячное | 1–4 | Комната | ×1 |\n| Малое | 4–8 | Здание | ×4 |\n| Большое | 8–16 | Деревня | ×16 |\n| Великое | 16–32 | Город | ×64 |\n| Высшее | 33–64* | Область | ×256 |\n\n*: Такие под силу только полубожественным волшебникам."},{"n":"4.8.2","l":3,"te":"Building the Working","tr":"Возведение Творения","en":"If the Working is designed properly and enough help is had, it can be \nconstructed at a cost of 1,000 silver pieces per point of difficulty and \na time cost of one month, plus one week per five points of difficulty \nor fraction thereof. If the cost is doubled, the work can be done in \nhalf this time. Note that this construction only applies to the magical \ncomponents of the Working; if the mage means to enchant a wall, \nthe wall must already be built. A mage can generally adventure and \ndo other things while completing a Working, but if they are taken \naway from the site for too long, the work may halt in their absence.\nWhile Workings are generally very durable, intentional sabotage \nof critical points or the slow decay of ages can end up corrupting \nor destroying them, sometimes with catastrophic results. It is for this \nreason that many of the Workings found in ancient dungeons or \nforgotten ruins are dangerous or perverse, and many nations that \ncould at least theoretically afford the construction of Workings avoid \nmaking use of them.","ru":"Если Творение правильно замышлено и помощи достаточно, его можно возвести по цене 1 000 серебряных монет за пункт сложности и со сроком в один месяц плюс неделя за каждые полные или неполные пять пунктов сложности. Если удвоить расходы, работу можно выполнить вдвое быстрее. Учти: это строительство касается только магических частей Творения; если маг собирается зачаровать стену, стена уже должна быть построена. Как правило, маг может искать приключения и заниматься другими делами, пока Творение завершается, но если увести его с места работ слишком надолго, дело без него может встать.\n\nХотя Творения в целом очень прочны, намеренный саботаж узловых точек или медленный распад веков способны исказить или разрушить их — порой с катастрофическими последствиями. Именно поэтому многие Творения, найденные в древних подземельях и забытых руинах, опасны или извращены, и многие державы, которым возведение Творений хотя бы теоретически по карману, избегают ими пользоваться."},{"n":"4.9.0","l":2,"te":"Magic Items and Enchanted Treasures","tr":"Магические предметы и зачарованные сокровища","en":"Statting out specific magic items is left as an exercise for the reader. \nCertain particular types of items do exist, however.","ru":"Расписывать статы конкретных магических предметов оставим упражнением для читателя. Однако отдельные особые типы предметов всё же существуют."},{"n":"4.9.1","l":3,"te":"Scrolls","tr":"Свитки","en":"Some scrolls, tablets, or other objects can be imbued with one or \nmore spells by wizards who craft them. Each spell in a scroll can be \nused only once. A user must grasp the item firmly and spend a Main \nAction, wasting the spell if they are struck or otherwise disturbed \nduring the action. The spell is then cast, with details of targeting and \nfocus determined by the user.\nReleasing a scroll safely requires a clear understanding of its mag-\nic. A user must have a Magic skill no more than one less than the \nsuspended spell’s level in order to safely trigger it. If a wielder doesn’t \nhave a high enough Magic skill, they can attempt to use the item \nanyway, albeit at considerable risk. An Int/Magic or Cha/Magic \nskill check is needed against a difficulty of 8 plus the spell level. If it \nfails by one or two points, the spell fizzles and is wasted. If it fails by \nmore than two points, it goes off, but at the wrong target or with the \nwrong effect at the GM’s discretion. If the check succeeds, the spell \ngoes off as intended.\nSpellcasters can create their own scrolls for later use, creating \nthem as single-use items. The expense is 1,000 silver per spell level, \nand the difficulty is 7 plus half the spell level, rounded up. While a \nscroll takes only a week to inscribe, the process is exhausting, and a \nwizard can do it no more than once a week per spell level inscribed.","ru":"Иные свитки, таблички и другие предметы волшебники-изготовители могут наполнить одним или несколькими заклинаниями. Каждое заклинание в свитке можно использовать лишь один раз. Пользователь должен крепко взять предмет и потратить Основное действие; если во время этого действия его ударят или иначе потревожат, заклинание пропадает. Затем заклинание срабатывает; цели и наведение определяет пользователь.\n\nЧтобы безопасно высвободить свиток, нужно ясно понимать его магию. Для безопасного срабатывания навык Магия пользователя должен быть не более чем на единицу ниже уровня удержанного в свитке заклинания. Если навыка Магия не хватает, применить предмет всё равно можно — но на немалый риск. Нужна проверка Инт/Магия или Хар/Магия против сложности 8 плюс уровень заклинания. Если бросок не дотянул один-два пункта, заклинание шипит и пропадает впустую. Если не дотянул больше двух — оно срабатывает, но не по той цели или не с тем эффектом, на усмотрение Мастера. При успехе заклинание срабатывает как задумано.\n\nЗаклинатели могут изготавливать собственные свитки впрок, создавая их как одноразовые предметы. Расходы составляют 1 000 серебряных монет за уровень заклинания, а сложность — 7 плюс половина уровня заклинания с округлением вверх. Хотя на письмо свитка уходит всего неделя, процесс изнурителен, и волшебник может заниматься этим не чаще одного раза в неделю за каждый уровень вписанного заклинания."},{"n":"4.9.2","l":3,"te":"Potions","tr":"Зелья","en":"Some magical effects can be contained in an ounce or two of liquid, \noil, incense, or other consumable substance. Using a potion requires \nthat it be Readied and a Main Action be used to consume it.\nApprehending the Arcane Form can give a one-sentence de-\nscription of the potion’s intended effect. Touching a single drop of \nthe fluid against a user’s tongue can sometimes give a hint as well, \nwith a tiny flicker of its effect impressed on the user. Aside from these, \nsomeone with the Magic skill can spend a full day in careful analysis \nof the potion, rolling Wis/Magic or Int/Magic against the potion’s \ncreation difficulty to identify its purpose. A given investigator can \nmake only one attempt to identify it.\nWizards can create potions as single-use magic items, with the \nbase cost and difficulty varying depending on the nature of the po-\ntion’s effect.","ru":"Иные магические эффекты можно заключить в унцию-другую жидкости, масла, благовония или иного расходуемого вещества. Чтобы использовать зелье, оно должно быть в готовности, а на его приём тратится Основное действие.\n\nЗаклинание Постижение тайной формы может дать описание задуманного эффекта зелья в одну фразу. Капля жидкости, тронутая языком, порой тоже даёт подсказку — крохотный отблеск эффекта, запечатлённый на пробующем. Помимо этого, владеющий навыком Магия может потратить целый день на тщательный анализ зелья, бросая Мдр/Магия или Инт/Магия против сложности создания зелья, чтобы опознать его назначение. Каждый исследователь может сделать лишь одну попытку опознания.\n\nВолшебники могут создавать зелья как одноразовые магические предметы; базовая цена и сложность зависят от природы эффекта зелья."},{"n":"4.9.3","l":3,"te":"Magic Weapons and Armor","tr":"Магическое оружие и броня","en":"Magical weapons and armor have a bonus, usually +1, but some-\ntimes as great as +3. This bonus adds directly to the hit roll, damage \nroll, and Shock of weapons, while it adds to the base Armor Class of \narmor. Some weapons and armor have additional special abilities.\nMagical shields with special powers do exist, but shields do not \nget numeric bonuses as armor does.","ru":"У магического оружия и брони есть бонус — обычно +1, но порой вплоть до +3. У оружия этот бонус прямо добавляется к броску атаки, броску урона и Шоку, у брони — к базовому Классу защиты. У некоторого оружия и брони есть дополнительные особые способности.\n\nМагические щиты с особыми силами существуют, но числовых бонусов, как броня, щиты не получают."},{"n":"4.9.4","l":3,"te":"Magical Devices","tr":"Магические устройства","en":"Enchanted wands, magic boots, ensorceled cloaks, and other devices \nof magic are rare, but do exist. These items usually require a Main \nAction to trigger any active abilities they grant, while passive benefits \nare automatically granted to the wielder.\nMost magical devices are permanent, but wands, rods, and staves \noften have a limited number of charges. It is usually prohibitively \ndifficult to recharge such devices.\nMagic Item Creation Costs\nCreation\nDifficulty\nCreation\nCost in SP\nCreation Time\nType of Item","ru":"Зачарованные палочки, магические сапоги, заколдованные плащи и прочие магические устройства редки, но существуют. Обычно, чтобы включить даруемые ими активные способности, нужно Основное действие, а пассивные выгоды владелец получает автоматически.\n\nБольшинство магических устройств постоянны, но у палочек, жезлов и посохов запас зарядов часто ограничен. Перезарядить такое устройство обычно запредельно трудно."},{"n":"4.10.0","l":2,"te":"Creating Magic Items","tr":"Создание магических предметов","en":"All permanent magical items are difficult to make. Even if the item \nis nothing more than a tankard that keeps its contents perpetually \nchilled, making that tankard is every bit as difficult as forging an \nenchanted sword. As a consequence, very few sorcerers bother to \nmake petty items; if it’s going to be as hard to make a trifling token \nas a significant one, why make trifles?\nMagical items are exceedingly expensive to build. The rare com-\nponents, expensive rituals, and costly processes involved eat up vast \namounts of silver and great labor on the part of the mage. These \ncomponents must be bought at some major city or salvaged from the \ndungeons or ruins that the PCs are exploring. They form many of the \nsame components that are used in building Workings or researching \nnew spells, so the same general pool of magical components can be \nused for any of those purposes.\nMagical items are also complex and difficult to create. A novice \nmage cannot fashion them and even an expert might find it difficult to \nget an item to come out just right. Flaws can creep into the construction \nprocess, forcing the PC to either start over or cope with an item that \nisn’t exactly what was intended.","ru":"Все постоянные магические предметы трудно делать. Даже если предмет — всего лишь кружка, вечно держащая питьё холодным, изготовить эту кружку ничуть не проще, чем выковать зачарованный меч. Оттого редкий чародей возится с мелочёвкой: если пустяковая безделушка обходится в тот же труд, что и значимая вещь, зачем делать пустяки?\n\nМагические предметы к тому же чрезвычайно дороги в изготовлении. Редкие компоненты, дорогие ритуалы и затратные процессы пожирают горы серебра и великий труд мага. Эти компоненты покупаются в каком-нибудь крупном городе или добываются из подземелий и руин, которые исследуют ПИ. Это во многом те же компоненты, что идут на возведение Творений и исследование новых заклинаний, так что один и тот же общий запас магических компонентов годится для любой из этих целей.\n\nМагические предметы вдобавок сложны и трудны в создании. Новичку они не по силам, и даже знаток может намучиться, добиваясь, чтобы предмет вышел в точности таким, как надо. В процесс работы могут вкрасться изъяны, вынуждая ПИ либо начать заново, либо мириться с предметом, который получился не совсем таким, как задумано."},{"n":"4.10.1","l":3,"te":"Designing the Item","tr":"Замысел предмета","en":"To build a magic item, the player first describes what it is that the item \nis supposed to do. It’s up to the GM to decide whether or not the item \nfits with their campaign and is an acceptable introduction.\nFor item designs, it’s recommended that the GM be careful not to \nallow magic items that simply solve whole categories of problems. A \nset of magic earplugs that make it impossible to hear lies may seem \nclever, but it also immediately solves any challenge revolving around \ndetecting deceit. Boots that grant perpetual flight, apotropaic wands \nthat banish specific types of creatures, and other items that simply \nremove certain problems from the party’s concerns should probably \nbe denied. Even if they’re charged or limit-use items, they’ll probably \nbe available whenever the party really needs them, which means \nthose challenges that would otherwise be the most critical become \nthe ones they most easily bypass.\nA GM should also be careful about items that simply add bo-\nnuses to the PC’s rolls, whether skill checks or combat rolls. Magical \nweapons and armor do exist, and there are some items that do simply \nadd numbers to the PC, but these should be avoided in other cas-\nes. There’s a reason that most veteran Warriors are eager to find a \nmagical weapon; such a weapon simply makes them better at their \nmost important function. If other items exist that simply increase critical \nnumbers, then the other players will feel obligated to hunt them down.\nIf the item’s concept passes muster, the GM should compare it to \nthe adjacent table to see what kind of price and minimum difficulty \nlevel should be required to make it. Spellcasting wizards can gener-\nally make any kind of magic item, while non-casters such as Vowed\nor Healers are usually restricted to making items appropriate to their \nparticular concepts, whether those are magical scriptures or healing \nelixirs. A GM should always feel free to adjust prices and difficulties \nto reflect their own sense of what’s appropriate for their campaign.\nIn addition to the minimum level and money involved, permanent \nmagic items always require at least one adventure to acquire the \nnecessary components. The wizard will have researched the item suf-\nficiently to know where they need to go and what they need to fetch, \nbut it will always be dangerous and difficult to do so. Very capable \nunderlings or hired adventurers might be able to fetch the required \ncomponent, but it’s up to the GM whether such efforts are successful. \nFrom a GM’s perspective, this required adventure is to ensure that \na wizard who makes a permanent magic item provides at least one \nsession worth of adventure grist in exchange for the new gear, and it \nalso ensures that not too many permanent magic items will be made \nunless the party agrees to constantly be out adventuring for parts.","ru":"Чтобы создать магический предмет, игрок сначала описывает, что этот предмет должен делать. Мастеру решать, вписывается ли предмет в его кампанию и приемлемо ли его появление.\n\nОценивая замыслы предметов, Мастеру стоит остерегаться магии, которая попросту решает целые категории проблем. Волшебные затычки для ушей, не дающие услышать ложь, кажутся остроумной находкой, но они разом снимают любой вызов, построенный на распознавании обмана. Сапоги вечного полёта, обережные палочки, изгоняющие определённые типы существ, и прочие предметы, попросту вычёркивающие какие-то проблемы из забот отряда, лучше, пожалуй, отклонять. Даже если предмет на зарядах или с ограниченным числом применений, он наверняка окажется под рукой всякий раз, когда отряду по-настоящему нужно, — а значит, самые критические из подобных испытаний станут теми, что обходятся легче всего.\n\nМастеру также стоит быть осторожным с предметами, которые просто добавляют бонусы к броскам ПИ — будь то проверки навыков или боевые броски. Магическое оружие и броня существуют, есть и предметы, которые попросту прибавляют персонажу цифры, но в прочих случаях подобного лучше избегать. Не зря большинство бывалых Воинов жаждет добыть магическое оружие: такое оружие попросту делает их лучше в главном их ремесле. Если будут существовать и другие предметы, которые просто наращивают ключевые числа, остальные игроки почувствуют себя обязанными за ними охотиться.\n\nЕсли замысел предмета прошёл отбор, Мастер сверяет его с таблицей рядом, чтобы понять, какая цена и какой минимальный уровень сложности нужны для его изготовления. Волшебники-заклинатели обычно могут делать магические предметы любого рода, а неколдующие, такие как Обетники или Целители, как правило, ограничены предметами, подходящими их концепции, — будь то магические писания или целебные эликсиры. Мастер всегда волен подправлять цены и сложности под собственное чувство того, что уместно в его кампании.\n\nПомимо минимального уровня и денег, постоянные магические предметы всегда требуют хотя бы одного приключения за необходимыми компонентами. Волшебник, достаточно изучив предмет, уже знает, куда идти и что добывать, но добыча всегда будет опасной и трудной. Очень способные подручные или наёмные искатели приключений могут взяться принести нужный компонент, но успех таких попыток — на усмотрение Мастера. С точки зрения Мастера это обязательное приключение гарантирует, что волшебник, создающий постоянный магический предмет, отработает новое снаряжение хотя бы одной сессией приключенческого материала, — а заодно и то, что постоянных магических предметов не расплодится слишком много, если только отряд не согласен беспрерывно странствовать за запчастями."},{"n":"4.10.2","l":3,"te":"Creating the Item","tr":"Создание предмета","en":"If the creator is capable, the coin is at hand, and any adventuring \ncomponents have been fetched, the mage can attempt to make the \nitem. They spend the time given on the adjacent table and then make \nan Int/Magic skill check against the appropriate difficulty. If they’re \nmaking a batch of limited-use items, such as a batch of magic potions, \nthey can make two doses for a +1 difficulty or four doses for a +2 \ndifficulty. If they have an apprentice to aid them, they can add +1 \nto their skill check.\nIf the check is a success, the item is made. If it’s a failure, they have \na choice; they can start over from the beginning, spending the money \nand time anew, though not needing to repeat any adventure the item \nmight have required. They can then make a second attempt at creating \nthe item. If they are reluctant to do this, the item incurs some kind of \nflaw or unfortunate side effect to its power, suffering that hindrance \nto the item’s eventual effect as adjusted by the GM. If that flaw isn’t \nintolerable, they may spend half the time they originally took to make \nanother skill check to make the item at a cumulative +1 bonus. No \nadditional coin need be paid. They can repeat this process, adding \na new flaw each time and paying half the original time, until they \neither succeed or the flaws become intolerable.\nA mage can generally keep adventuring while crafting a magic \nitem, as the work doesn’t eat up all their spare time. Particularly mas-\nsive or powerful magic items might require the use of a dedicated \nlaboratory, forcing the wizard to remain there while the work is under-\nway lest the process be spoiled. Any special tools or resources such a \nlaboratory requires are assumed to be part of the item’s creation cost.\nA single-use item, such as a potion or scroll\n8–10\n250–2,500\n1 week\nA multi-use item that still contains limited charges, such as a wand\n9–11\n5,000–25,000\n1 month\nA low-powered but permanent magic item, such as a Sword +1\n12,500\n1 month\nA significant item that creates a situation-changing effect\n50,000\n3 months\nA powerful item or one with multiple significant abilities\n250,000\n6 months","ru":"Если создатель способен, деньги на руках и все приключенческие компоненты добыты, маг может взяться за предмет. Он тратит время, указанное в таблице рядом, и делает проверку Инт/Магия против соответствующей сложности. Если он готовит партию предметов ограниченного применения — например, партию волшебных зелий, — он может сделать две дозы за +1 к сложности или четыре дозы за +2. Если ему помогает подмастерье, он добавляет +1 к проверке.\n\nПри успехе предмет готов. При провале есть выбор: можно начать с самого начала, заново потратив деньги и время, — хотя повторять приключение, которого мог требовать предмет, не нужно, — и сделать вторую попытку создания. Если это не по душе, предмет обзаводится каким-нибудь изъяном или досадным побочным свойством, и эта помеха ложится на итоговый эффект предмета с поправками Мастера. Если изъян терпим, можно потратить половину исходного срока и сделать новую проверку навыка с накапливающимся бонусом +1, чтобы всё же завершить предмет. Доплачивать не нужно. Этот процесс можно повторять — каждый раз добавляя новый изъян и платя половину исходного времени, — пока предмет не будет готов или изъяны не станут невыносимыми.\n\nКак правило, маг может продолжать искать приключения, пока мастерит магический предмет: работа не съедает всё его свободное время. Особо огромные или могучие магические предметы могут требовать отдельной лаборатории — тогда волшебнику придётся оставаться при ней, пока идёт работа, чтобы процесс не пошёл прахом. Любые особые инструменты и ресурсы, которых требует такая лаборатория, считаются частью цены создания предмета.\n\n**Цены создания магических предметов**\n\n| Тип предмета | Сложность создания | Цена создания, см | Время создания |\n|---|---|---|---|\n| Одноразовый предмет — например, зелье или свиток | 8–10 | 250–2 500 | 1 неделя |\n| Многоразовый предмет с ограниченным запасом зарядов — например, палочка | 9–11 | 5 000–25 000 | 1 месяц |\n| Слабый, но постоянный магический предмет — например, Меч +1 | 10 | 12 500 | 1 месяц |\n| Значимый предмет, создающий меняющий ситуацию эффект | 12 | 50 000 | 3 месяца |\n| Могучий предмет или предмет с несколькими значимыми способностями | 14 | 250 000 | 6 месяцев |"},{"n":"5.0.0","l":1,"te":"Monsters and Foes","tr":"Чудовища и противники","en":"The following page includes a list of example stat lines for various \nkinds of people and creatures. These are not universal truths for every \nbeing in the campaign setting, but they’re good baselines for what \nto expect from a given creature. As a first step in building a creature \na GM should pick the stat line that fits best the type of foe they need, \nand then modify it to suit their own purposes.\nNote that there’s nothing stopping you from putting a guaranteed \nparty-slaughterer in your campaign. If the situation logically requires \nthat such a creature be present, then it ought to be there. If logic re-\nquires its existence, however, you should take pains to ensure that the \nPCs are not forced to actually fight the thing. They need to be able to \nget forewarnings of its presence, or opportunities to flee it, or some \nmeans to negotiate with it or hide from it. It’s not unfair to populate \nyour world with the creatures that ought to live in it, but it’s decidedly \nunfun to shove hapless PCs face-first into certain death.","ru":"На следующей странице приведён список примерных строк статов для разных видов людей и существ. Это не непреложные истины для каждого обитателя сеттинга кампании, но хорошие отправные точки: чего ждать от того или иного существа. Создавая существо, Мастеру стоит первым делом выбрать строку статов, лучше всего подходящую нужному типу противника, а затем изменить её под свои цели.\n\nЗаметим: ничто не мешает поселить в кампании тварь, гарантированно способную вырезать всю партию. Если по логике ситуации такое существо должно присутствовать — значит, ему там и место. Но раз уж логика требует его существования, стоит приложить усилия к тому, чтобы ПИ не были вынуждены по-настоящему с ним драться. Им нужна возможность заранее узнать о его присутствии, шанс сбежать, способ договориться с ним или спрятаться. Населять мир существами, которые должны в нём жить, — не нечестно; а вот толкать незадачливых ПИ лицом в верную смерть — решительно невесело."},{"n":"5.1.0","l":2,"te":"Monster and NPC Statistics","tr":"Характеристики чудовищ и NPC","en":"The table of example stat lines has several columns, each one listing \na particular statistic for the creature.\nHit dice are a measure of the creature’s general power, not unlike \na level rating for PCs. For each hit die a creature has, it rolls 1d8 \nfor its hit points. Most ordinary humans have only one hit die, while \nveterans of bloody struggle or ruthless court intrigue might have two, \nor three, or even more for the most heroic among them.\nAC is for the creature’s Armor Class. The higher this number, the \nharder it is to meaningfully hurt the thing. Monsters and wild beasts \nhave an Armor Class appropriate to their agility and the toughness \nof their hide; 12 or 13 for quick things with leathery skins, up to 15 for \nvery well-armored beasts, or even up to 20 for things with supernat-\nural hardihood. Humans and other sentients usually have whatever \nArmor Class is granted by the armor they wear. Some creatures have \nan “a” annotation with their AC; this just means that the creature wears \narmor and the AC given is what their usual armor is worth.\nAtk is the creature’s usual total attack bonus for its hit rolls in \ncombat. For most creatures, this is equal to its hit dice, possibly with \na bonus if it’s well-trained, exceptionally vicious, or supernaturally \npowerful. Some creatures have more than one attack, indicated by \nan “x2” or “x3” notation. This means the creature can attack two or \nthree times with a single Main Action, directing them all at a single \ncreature or splitting them up among nearby foes within reach.\nDmg is the damage done by a successful hit by the creature. If \nthe listing says “Wpn”, then it does whatever damage is usual for \nthe weapon that it’s wielding. A creature will never do less damage \non a hit than it would do with its Shock score, if Shock would apply \nto the target.\nShock is the Shock damage inflicted by the creature and the \nmaximum AC it affects. Thus, “3/13” means that the creature inflicts \na minimum of 3 points of Shock damage on a miss to any foe with \nan AC of 13 or less. “Wpn” means the usual Shock damage of the \nweapon being used is applied. Exceptionally powerful or savage \ncreatures might automatically apply Shock regardless of the AC of \nthe foe; such creatures have a dash listed for the maximum AC, such \nas “3/-”. Such damage is always applied unless the foe is immune \nto Shock.\nMove is the distance the creature can move with a single Move \naction. Some creatures may fly, others swim, or still stranger means \nof locomotion may apply depending on the beast’s nature.\nML is the creature’s Morale score. Whenever a Morale check is \nforced by a situation, the creature must roll 2d6. If the total is greater \nthan its Morale score, it loses its taste for the fight and will retreat, \nsurrender, or otherwise take whatever actions seem best to get it \nsafely away.\nInst is the creature’s Instinct score. When confused, infuriated, or \ngoaded in combat, it runs the risk of behaving according to its instincts \nrather than martial prudence.\nSkill is the creature’s total Skill bonus for any skill checks it makes \nthat are in line with its talents and abilities. If the creature ought to \nbe good at something, it can add its Skill bonus to the base 2d6 skill \ncheck. If not, it adds +0, or might even take a penalty if it seems like \nsomething it would be exceptionally bad at doing.\nSave is the saving throw target used by the creature whenever \nit’s called upon to make a Physical, Mental, Evasion, or Luck saving \nthrow. Unlike PCs, creatures only have a single save target, usually \nequal to 15 minus half its hit dice, rounded down. Thus, a foe with 3 \nhit dice usually rolls 14+ to succeed at any saving throw. This score \ncan’t be less than 2+, as a 1 on a saving throw always fails.","ru":"В таблице примерных строк статов несколько колонок, и каждая содержит отдельный показатель существа.\n\n**Кости здоровья** — мера общей мощи существа, во многом похожая на уровень у ПИ. За каждую свою кость здоровья существо бросает 1d8 для своих пунктов здоровья. У большинства обычных людей всего одна кость здоровья; у ветеранов кровавых битв или беспощадных придворных интриг их может быть две, три, а у самых героических из них — и того больше.\n\n**КЗщ** — класс защиты существа. Чем выше это число, тем труднее нанести твари ощутимый вред. У чудовищ и диких зверей класс защиты соответствует их проворству и прочности шкуры: 12–13 у быстрых созданий с дублёной кожей, до 15 у зверей в надёжном природном панцире и даже до 20 у существ со сверхъестественной крепостью. У людей и прочих разумных класс защиты обычно определяется носимой бронёй. У некоторых существ рядом с КЗщ стоит пометка «a»: она означает лишь, что существо носит броню, и указанный КЗщ — показатель его обычной брони.\n\n**Атк** — обычный суммарный бонус атаки существа для его бросков на попадание в бою. У большинства существ он равен числу их костей здоровья, иногда с надбавкой за хорошую выучку, исключительную свирепость или сверхъестественную мощь. У некоторых существ атак больше одной — это обозначено пометкой «×2» или «×3». Такое существо может атаковать два или три раза одним Основным действием, обрушив все атаки на одно существо или разделив их между противниками в пределах досягаемости.\n\n**Урон** — урон от успешного попадания существа. Если в графе стоит «Ор.», существо наносит обычный урон того оружия, которым вооружено. При попадании существо никогда не наносит меньше урона, чем дал бы его Шок, если Шок применим к цели.\n\n**Шок** — урон Шоком, наносимый существом, и максимальный КЗщ, на который он действует. Так, «3/13» означает, что при промахе существо наносит минимум 3 пункта урона Шоком любому противнику с КЗщ 13 и ниже. «Ор.» означает, что применяется обычный Шок используемого оружия. Исключительно мощные или свирепые существа могут наносить Шок автоматически, независимо от КЗщ противника; у таких существ вместо максимального КЗщ стоит прочерк, например «3/–». Такой урон наносится всегда, если только противник не обладает иммунитетом к Шоку.\n\n**Скор.** — дистанция, которую существо преодолевает одним Действием перемещения. Одни существа летают, другие плавают, а у иных, в зависимости от природы зверя, способы передвижения могут быть и куда более странными.\n\n**Дух** — показатель боевого духа существа. Всякий раз, когда ситуация вынуждает проверку боевого духа, существо должно бросить 2d6. Если сумма больше его показателя боевого духа, оно теряет вкус к драке и будет отступать, сдаваться или иным образом делать всё, что кажется ему лучшим способом уйти целым.\n\n**Инст.** — показатель Инстинкта существа. Сбитое с толку, взбешённое или раздразнённое в бою, оно рискует повести себя согласно инстинктам, а не воинскому благоразумию.\n\n**Нав** — суммарный бонус навыка существа для любых его проверок навыков, которые соответствуют его талантам и способностям. Если существу положено быть в чём-то хорошим, оно добавляет свой бонус навыка к базовой проверке навыка 2d6. Если нет — добавляет +0, а то и получает штраф, если в этом деле оно должно быть исключительно плохо.\n\n**Спас** — порог спасброска, который существо использует всякий раз, когда ему нужно сделать Физический или Ментальный спасбросок, спасбросок Уклонения или Удачи. В отличие от ПИ, у существ только один порог спасброска, обычно равный 15 минус половина костей здоровья с округлением вниз. Так, противник с 3 костями здоровья обычно преуспевает в любом спасброске на 14+. Этот показатель не может быть ниже 2+, поскольку 1 на спасброске — всегда провал."},{"n":"5.1.1","l":3,"te":"Powerful Foes","tr":"Могучие противники","en":"These statistics are only a bare framework for most ordinary creatures. \nAn entity of special power, such as a heroic knight or monstrous \nbeast, should likely have at least one special ability related to their \nskills or nature. Potent enemies without a significant number of special \ndefenses and powerful attack modes can often be chewed down \nrapidly by a PC party. Granting major enemies multiple actions per \nround and a good selection of special powers is generally necessary \nto make them a worthy opponent for a veteran party.\nNormal Humans\nHD\nAC\nAtk.\nDmg.\nShock\nMove\nML\nInst.\nSkill\nSave\nPeaceful Human\n +0\nWpn\nWpn\n30'\n +1\n15+\nThug or Militia\n13a\n+1\nWpn\nWpn\n30'\n +1\n15+\nBarbarian Fighter\n13a\n+2\nWpn+1\nWpn+1\n30'\n +1\n15+\nVeteran Soldier\n13a\n+2\nWpn+1\nWpn+1\n30'\n +1\n15+\nSkilled Veteran\n15a\n+3\nWpn+1\nWpn+1\n30'\n +1\n14+\nElites or Special Guards\n18a\n+4\nWpn+2\nWpn+2\n30'\n +2\n14+\nKnight or Minor Hero\n18a\n+6\nWpn+2\nWpn+2\n30'\n +2\n13+\nWarrior Baron\n18a\n+8\nWpn+3\nWpn+3\n30'\n +2\n12+\nBarbarian Warlord\n16a\n +10 x2\nWpn+4\nWpn+4/-\n30'\n +2\n11+\nMighty General\n18a\n+10\nWpn+4\nWpn+4/-\n30'\n +3\n11+\nMajor Hero\n18a\n +12 x2\nWpn+5\nWpn+5/-\n30'\n +3\n10+\nGreat Warrior King\n18a\n +14 x2\nWpn+5\nWpn+5/-\n30'\n +3\n9+\nSpellcasters\nHD\nAC\nAtk.\nDmg.\nShock\nMove\nML\nInst.\nSkill\nSave\nPetty Mage\n+1\nWpn\nWpn\n30'\n +1\n14+\nTribal Shaman\n+3\nWpn+1\nWpn+1\n30'\n +1\n13+\nSkilled Sorcerer\n+1\nWpn\nWpn\n30'\n +2\n13+\nMaster Wizard\n+1\nWpn\nWpn\n30'\n +2\n11+\nFamous Arch-Mage\n+2\nWpn\nWpn\n30'\n +3\n10+\nMages generally have the spellcasting and Arts of an appropriate mage tradition at a level equal to their hit dice and Effort equal to their \nskill bonus plus two.\nNormal Animals\nHD\nAC\nAtk.\nDmg.\nShock\nMove\nML\nInst.\nSkill\nSave\nSmall Pack Predator\n+2\n1d4\n1/13\n40'\n +1\n15+\nLarge Solitary Predator\n+6\n1d8\n2/13\n30'\n +1\n13+\nApex Predator\n +6 x2\n1d8\n2/13\n40'\n +2\n12+\nHerd Beast\n+2\n1d4\nNone\n40'\n +1\n14+\nVicious Large Herbivore\n+5\n1d10\n1/13\n40'\n +1\n13+\nElephantine Grazer\n+5\n2d8\nNone\n40'\n +1\n12+\nUnnatural Entities\nHD\nAC\nAtk.\nDmg.\nShock\nMove\nML\nInst.\nSkill\nSave\nAutomaton, Humanlike\n+2\nWpn\nWpn\n30'\n +1\n14+\nAutomaton, Laborer\n+2\n1d6\n1/13\n30'\n +1\n14+\nAutomaton, Military\n+5\n1d10+2\n4/15\n30'\n +1\n13+\nAutomaton, Warbot\n +12 x3\n1d12+5\n7/-\n40'\n +2\n10+\nSlime or ooze\n +6 x2\n1d8\n1/-\n20'\n +1\n12+\nPredator, Small Vicious\n+1\n1d4\n1/13\n30'\n +1\n15+\nPredator, Large Vicious\n +7 x2\n2d6\n2/15\n40'\n +2\n13+\nPredator, Hulking\n +12 x2\n2d6+3\n6/15\n30'\n +1\n10+\nPredator, Hellbeast\n +12 x4\n1d10+5\n6/-\n60'\n +3\n10+\nUnnatural Swarm\n +6 x3\n1d6\n1/-\n30'\n +1\n13+\nTerrible Warbeast\n +10 x2\n2d6+4\n7/15\n40'\n +2\n11+\nLegendary God-Titan\n +20 x3\n2d10+5\n10/-\n40'\n +3\n2+\n2d6\nNPC Reaction\n2-\nAs aggressively hostile as the situation allows\n3–5\nMore unfriendly and hostile than they’d be expected\nto be in the given situation\n6–8\nAs predictably hostile or friendly as they’d usually be\nin this situation\n9–11\nMore friendly and benign than you’d expect them to \nbe, given the circumstances\n12+\nAs friendly and helpful as their nature and the situation\npermits them to be","ru":"Эти статистики — лишь голый каркас для большинства обычных существ. Сущности особой мощи — героическому рыцарю или чудовищному зверю — стоит дать хотя бы одну особую способность, связанную с её умениями или природой. Сильных врагов без солидного набора особых защит и мощных способов атаки партия ПИ зачастую перемалывает стремительно. Чтобы главный враг стал достойным противником для партии ветеранов, ему, как правило, необходимо дать несколько действий за раунд и хороший набор особых способностей.\n\n### Обычные люди\n\n| | КЗд | КЗщ | Атк | Урон | Шок | Скор. | Дух | Инст. | Нав | Спас |\n|---|---|---|---|---|---|---|---|---|---|---|\n| Мирный житель | 1 | 10 | +0 | Ор. | Ор. | 30' | 7 | 5 | +1 | 15+ |\n| Громила или ополченец | 1 | 13a | +1 | Ор. | Ор. | 30' | 8 | 4 | +1 | 15+ |\n| Варвар-боец | 1 | 13a | +2 | Ор.+1 | Ор.+1 | 30' | 8 | 5 | +1 | 15+ |\n| Солдат-ветеран | 1 | 13a | +2 | Ор.+1 | Ор.+1 | 30' | 8 | 3 | +1 | 15+ |\n| Умелый ветеран | 2 | 15a | +3 | Ор.+1 | Ор.+1 | 30' | 9 | 2 | +1 | 14+ |\n| Элита или отборная стража | 3 | 18a | +4 | Ор.+2 | Ор.+2 | 30' | 10 | 2 | +2 | 14+ |\n| Рыцарь или малый герой | 4 | 18a | +6 | Ор.+2 | Ор.+2 | 30' | 10 | 1 | +2 | 13+ |\n| Барон-воитель | 6 | 18a | +8 | Ор.+3 | Ор.+3 | 30' | 9 | 1 | +2 | 12+ |\n| Варварский вождь | 8 | 16a | +10 ×2 | Ор.+4 | Ор.+4/– | 30' | 10 | 3 | +2 | 11+ |\n| Могучий полководец | 8 | 18a | +10 | Ор.+4 | Ор.+4/– | 30' | 10 | 1 | +3 | 11+ |\n| Великий герой | 10 | 18a | +12 ×2 | Ор.+5 | Ор.+5/– | 30' | 10 | 2 | +3 | 10+ |\n| Великий король-воин | 12 | 18a | +14 ×2 | Ор.+5 | Ор.+5/– | 30' | 10 | 1 | +3 | 9+ |\n\n### Колдующие\n\n| | КЗд | КЗщ | Атк | Урон | Шок | Скор. | Дух | Инст. | Нав | Спас |\n|---|---|---|---|---|---|---|---|---|---|---|\n| Мелкий маг | 2 | 10 | +1 | Ор. | Ор. | 30' | 8 | 4 | +1 | 14+ |\n| Племенной шаман | 4 | 10 | +3 | Ор.+1 | Ор.+1 | 30' | 9 | 4 | +1 | 13+ |\n| Умелый чародей | 5 | 10 | +1 | Ор. | Ор. | 30' | 9 | 4 | +2 | 13+ |\n| Мастер-волшебник | 8 | 13 | +1 | Ор. | Ор. | 30' | 9 | 3 | +2 | 11+ |\n| Прославленный архимаг | 10 | 13 | +2 | Ор. | Ор. | 30' | 9 | 2 | +3 | 10+ |\n\nМаги, как правило, владеют заклинаниями и Искусствами подходящей магической традиции на уровне, равном их костям здоровья, а их Усилие равно бонусу навыка плюс два.\n\n### Обычные звери\n\n| | КЗд | КЗщ | Атк | Урон | Шок | Скор. | Дух | Инст. | Нав | Спас |\n|---|---|---|---|---|---|---|---|---|---|---|\n| Мелкий стайный хищник | 1 | 12 | +2 | 1d4 | 1/13 | 40' | 7 | 6 | +1 | 15+ |\n| Крупный хищник-одиночка | 5 | 13 | +6 | 1d8 | 2/13 | 30' | 8 | 6 | +1 | 13+ |\n| Сверххищник | 6 | 13 | +6 ×2 | 1d8 | 2/13 | 40' | 8 | 6 | +2 | 12+ |\n| Стадное животное | 2 | 11 | +2 | 1d4 | Нет | 40' | 7 | 6 | +1 | 14+ |\n| Злобное крупное травоядное | 4 | 13 | +5 | 1d10 | 1/13 | 40' | 9 | 6 | +1 | 13+ |\n| Травоядный исполин | 6 | 13 | +5 | 2d8 | Нет | 40' | 7 | 6 | +1 | 12+ |\n\n### Противоестественные существа\n\n| | КЗд | КЗщ | Атк | Урон | Шок | Скор. | Дух | Инст. | Нав | Спас |\n|---|---|---|---|---|---|---|---|---|---|---|\n| Автоматон человекоподобный | 2 | 13 | +2 | Ор. | Ор. | 30' | 12 | 3 | +1 | 14+ |\n| Автоматон-работник | 2 | 15 | +2 | 1d6 | 1/13 | 30' | 12 | 3 | +1 | 14+ |\n| Военный автоматон | 4 | 18 | +5 | 1d10+2 | 4/15 | 30' | 12 | 3 | +1 | 13+ |\n| Боевой колосс | 10 | 20 | +12 ×3 | 1d12+5 | 7/– | 40' | 12 | 2 | +2 | 10+ |\n| Слизь или студень | 6 | 10 | +6 ×2 | 1d8 | 1/– | 20' | 12 | 5 | +1 | 12+ |\n| Небольшая злобная тварь | 1 | 14 | +1 | 1d4 | 1/13 | 30' | 7 | 5 | +1 | 15+ |\n| Крупная злобная тварь | 6 | 13 | +7 ×2 | 2d6 | 2/15 | 40' | 9 | 5 | +2 | 13+ |\n| Громадная тварь | 10 | 15 | +12 ×2 | 2d6+3 | 6/15 | 30' | 10 | 4 | +1 | 10+ |\n| Адская тварь | 10 | 18 | +12 ×4 | 1d10+5 | 6/– | 60' | 11 | 4 | +3 | 10+ |\n| Противоестественный рой | 4 | 10 | +6 ×3 | 1d6 | 1/– | 30' | 10 | 5 | +1 | 13+ |\n| Ужасный боевой зверь | 8 | 15 | +10 ×2 | 2d6+4 | 7/15 | 40' | 9 | 4 | +2 | 11+ |\n| Легендарный бог-титан | 20 | 22 | +20 ×3 | 2d10+5 | 10/– | 40' | 10 | 3 | +3 | 2+ |"},{"n":"5.2.0","l":2,"te":"Reaction Rolls and Parleying","tr":"Проверки реакции и переговоры","en":"These rules do not encourage constant combat encounters. Heroes \nare fragile, foes are dangerous, and almost every fight runs some risk \nof downing at least one PC. GMs or players who arrange their games \nas a curated sequence of battles are going to rapidly run out of luck.\nGMs need to constantly recall the fact that not every hostile en-\ncounter needs to end in a massacre. The denizens of this world are \njust as aware of their own mortality as the PCs are, and they will not \npick chance fights that they do not expect to win decisively. Even \nintrinsically hostile creatures will take a moment to size up a situation.\nUnless the situation is so patently destined for bloodshed that all \nnegotiation is futile, a GM should always make a reaction roll when-\never the PCs encounter another creature or group, whether friendly \nor hostile. This roll will indicate the general mood of the encounter, \nand whether the subjects are likely to be amenable to negotiations.","ru":"Эти правила не поощряют бесконечные боевые столкновения. Герои хрупки, враги опасны, и почти каждая драка несёт риск свалить хотя бы одного ПИ. У Мастеров и игроков, выстраивающих игру как выверенную череду сражений, удача закончится быстро.\n\nМастеру нужно постоянно помнить: не каждая враждебная встреча обязана кончаться резнёй. Обитатели этого мира сознают собственную смертность не хуже ПИ и не станут ввязываться в случайные драки, в которых не рассчитывают победить решительно. Даже враждебные по самой своей природе существа возьмут паузу, чтобы оценить обстановку.\n\nЕсли только ситуация не ведёт к кровопролитию столь явно, что любые переговоры бессмысленны, Мастеру следует делать проверку реакции всякий раз, когда ПИ встречают другое существо или группу — дружественную или враждебную. Этот бросок покажет общее настроение встречи и то, склонны ли встреченные к переговорам."},{"n":"5.2.1","l":3,"te":"Making a Reaction Roll","tr":"Как делать проверку реакции","en":"To make a reaction roll, roll 2d6 and compare it to the adjacent \ntable. If a PC is in a position to greet the targets, add their Charisma \nmodifier to the roll.\nThe higher the reaction roll, the friendlier and more helpful the \nNPCs will be. This doesn’t mean that goblin raiders will invite the PCs \nto drink with them, but it does mean that otherwise violent groups \nmight decide to demand a bribe instead, or back off rather than risk \nlosing lives to the heroes. Conversely, a low roll means that the group \nis more hostile and unhelpful than they might be expected to be.\nOnce a roll is made, the GM should clearly clue the PCs into its \ngeneral results. If the bandits are feeling sociable, the GM needs \nto let the players know that they’re looking relaxed and leaning on \ntheir spears. If the wild beast is getting ready to attack, it should be \ndescribed as crouching and snarling as it begins to creep forward. \nThis information needs to be given before the PCs choose their initial \nactions, or else a lot of potential parleys are going to be erased by \nthe immediate and judicious drawing of swords.\nA reaction roll applies to non-martial encounters as well. Determin-\ning the initial mood of a government clerk, the temper of a merchant, \nor the attitude of a noble patron can all be done by a reaction roll. \nThis attitude will likely color the difficulty and nature of any negotia-\ntions or social skill checks the PCs might try to conduct with the target.\nReaction rolls are only the start of an encounter, not the end. Clever \nwords, persuasive arguments, or prudent gifts can all shift the attitude \nof an NPC, as can insults, threats, and looking excessively tender and \ndelicious. Provided the NPCs aren’t the sort to simply attack, the PCs \nalways have a chance to salvage a meeting.","ru":"Чтобы сделать проверку реакции, Мастер бросает 2d6 и сравнивает результат с таблицей рядом. Если кто-то из ПИ в состоянии поприветствовать встреченных, к броску добавляется его модификатор Харизмы.\n\nЧем выше результат проверки реакции, тем дружелюбнее и услужливее будут NPC. Это не значит, что гоблины-налётчики позовут ПИ выпить с ними, но значит, что в иных обстоятельствах кровожадная группа может решить вместо боя потребовать откуп или отойти, лишь бы не терять людей в схватке с героями. И наоборот: низкий результат означает, что группа враждебнее и несговорчивее, чем от неё можно было бы ожидать.\n\nСделав бросок, Мастер должен ясно дать ПИ понять его общий итог. Если разбойники настроены пообщаться, игрокам нужно сообщить, что те выглядят расслабленно и опираются на копья. Если дикий зверь готовится напасть, его стоит описать так: он припадает к земле и рычит, начиная подкрадываться. Эта информация должна прозвучать до того, как ПИ выберут свои первые действия, — иначе множество возможных переговоров будет перечёркнуто немедленным и предусмотрительным обнажением клинков.\n\nПроверка реакции годится и для невоенных встреч. Исходное настроение чиновника, нрав купца или расположение знатного покровителя — всё это можно определить проверкой реакции. Полученное отношение, скорее всего, повлияет на сложность и характер любых переговоров и социальных проверок навыков, которые ПИ попробуют вести с целью.\n\nПроверка реакции — лишь начало встречи, а не её итог. Ловкие слова, убедительные доводы и своевременные подарки могут изменить отношение NPC — как и оскорбления, угрозы и слишком нежный и аппетитный вид. Если NPC не из тех, кто нападает без разговоров, у ПИ всегда есть шанс спасти встречу.\n\n| 2d6 | Реакция NPC |\n|---|---|\n| 2- | Настолько агрессивно-враждебны, насколько позволяет ситуация |\n| 3–5 | Недружелюбнее и враждебнее, чем можно было бы ожидать в данной ситуации |\n| 6–8 | Предсказуемо враждебны или дружелюбны — как обычно вели бы себя в такой ситуации |\n| 9–11 | Дружелюбнее и благодушнее, чем можно было бы ожидать при данных обстоятельствах |\n| 12+ | Настолько дружелюбны и готовы помочь, насколько позволяют их натура и ситуация |"},{"n":"5.2.2","l":3,"te":"Peaceful Encounter Reactions","tr":"Мирные реакции при встрече","en":"Suppose a GM’s just rolled a 12 for the PCs’ roadside encounter with \na band of zealous blood cultists. The GM knows that the cultists are \nvicious but have no pressing reason to immediately attack the PCs, \nso what does “friendly” mean in such a situation? If you find yourself \nhaving to figure out plausible reactions for otherwise-hostile groups, \nhere are some suggestions.\nThey demand a bribe. They’ll take money, gear, food, booze, \npraise to their dark god, or some other currency for peace.\nThey back off. If they aren’t defending their lair or carrying out \nsome critical task, they may just decide to back away and keep their \ndistance as the groups pass by. They may bring word of the adventur-\ners to their comrades, but a fight under the present terms might look \nlike a bad deal to them.\nThey ask for favors. Maybe they have an enemy they want \nkilled, or a task they need done. They may trade offers of ignoring \nthe PCs while they remain in the area in exchange for the help, or \noffer an outright bribe to the PCs to get them to cooperate. Even the \nmost hostile raider group might be willing to let a few targets go in \nexchange for some profitable work being done.\nThey offer tribute. They’ve looked at the PCs and decided that \ntheir own lives are in danger. They’ll offer wealth, information, ser-\nvices, or other inducements to get the PCs to leave them alone. This \nreaction grows more possible if the PCs have been carving a bloody \nswath through their surroundings.\nThey willingly socialize. Maybe the bandits have been out here \nso long that they’re lonely for civilized conversation, and the PCs look \ntoo dangerous to engage. The goblin raiders might’ve mistaken them \nfor allied marauders and invite them to share their camp. The vile \nnecromancer might consider herself a perfectly respectable person \nwho loves good dinner conversation. However it’s sliced, the NPC \ncould be willing just to have a nice chat.","ru":"Допустим, Мастер только что выбросил 12 на встрече ПИ у дороги с бандой фанатичных культистов крови. Мастер знает, что культисты злобны, но насущных причин немедленно нападать на ПИ у них нет — что же значит «дружелюбно» в такой ситуации? Если приходится придумывать правдоподобные реакции для групп, в остальном враждебных, вот несколько подсказок.\n\n**Они требуют откуп.** За мир они возьмут деньги, снаряжение, еду, выпивку, хвалу своему тёмному богу или иную звонкую монету.\n\n**Они отходят.** Если они не защищают логово и не заняты каким-то важнейшим делом, они могут просто решить отступить и держаться поодаль, пока группы расходятся. Возможно, они донесут весть об искателях приключений своим товарищам, но драка на нынешних условиях может показаться им плохой сделкой.\n\n**Они просят об услуге.** Может, у них есть враг, которого они хотят убить чужими руками, или дело, которое нужно сделать. В обмен на помощь они могут пообещать не трогать ПИ, пока те остаются в этих краях, или попросту предложить им плату за сотрудничество. Даже самая враждебная шайка налётчиков может согласиться отпустить несколько жертв в обмен на выгодную работу.\n\n**Они предлагают дань.** Они посмотрели на ПИ и решили, что их собственные жизни в опасности. Они предложат богатство, сведения, услуги или иные посулы, лишь бы ПИ оставили их в покое. Такая реакция тем вероятнее, чем шире кровавая просека, которую ПИ прорубают по окрестностям.\n\n**Они охотно общаются.** Может, разбойники торчат в глуши так долго, что стосковались по цивилизованной беседе, а ПИ выглядят слишком опасными, чтобы с ними связываться. Гоблины-налётчики могли принять их за союзных мародёров и позвать к себе в лагерь. Гнусная некромантка может считать себя абсолютно приличной особой, которая обожает хорошую застольную беседу. Как ни крути, NPC может хотеть просто мило поболтать."},{"n":"5.3.0","l":2,"te":"Morale Checks and Fleeing","tr":"Проверки боевого духа и бегство","en":"Sometimes, however, combat is inevitable. The raiders swoop down \non the heroes, the savage beast pounces, or the vile necromancer \nruns out of small talk. Even after blades are drawn, however, the \nhostile NPCs might come to think better of their choices when they \nfail a Morale check.","ru":"И всё же порой бой неизбежен. Налётчики обрушиваются на героев, свирепый зверь прыгает, у гнусной некромантки заканчиваются светские темы. Но даже когда клинки обнажены, враждебные NPC могут одуматься, провалив проверку боевого духа."},{"n":"5.3.1","l":3,"te":"Making a Morale Check","tr":"Как делать проверку боевого духа","en":"A Morale check is made by rolling 2d6 and comparing it to the crea-\nture’s Morale score. If the roll is greater than the score, the creature \nloses heart and will seek to flee or stop the battle. PCs never make \nMorale checks and will fight on until they decide to flee.\nA Morale check is usually made under certain circumstances, \nthough the GM can add to these whenever they think the situation \ncalls for one. More than one Morale check may be needed in a fight \nif more than one condition occurs.\n•\t\nWhen a non-combatant civilian is first faced with the pros-\npect of serious physical harm.\n•\t\nWhen the first member of a group is killed or rendered \nincapacitated.\n•\t\nWhen the group starts to visibly lose the fight or see their \nodds of victory considerably shrink.\n•\t\nWhen the group faces some terrifying work of magic, a \nhorrendous slaughter, or a vastly superior foe.\nThe consequences of a failed Morale check will vary based on \nthe situation and the creatures being tested. Non-combatants and \nundisciplined fighters will generally flee madly, dropping shields and \nabandoning burdens as they try to escape their doom.\nTrained and experienced warriors will usually make a fighting \nwithdrawal, trying to pull away from their enemies and escape back \nto safety with as many of their comrades as they can. Of course, in \nthe face of truly devastating situations they may flee just as readily \nas their green compatriots.\nIf flight seems impossible or prohibitively dangerous, they might \nthrow down their weapons and beg for mercy, if they think they have \nany chance of receiving it from their assailants. If that seems hopeless, \nthey might just collapse in terrified despair as they pray to their gods, \nor fight with a renewed frenzy in a desperate attempt to cut their way \nout of the trap. Some may offer bribes or favors to win their lives.\nIn all cases, once a side has failed its Morale check, it’s not go-\ning to be in a condition to fight those foes until it’s had some time to \nrecover its courage.","ru":"Для проверки боевого духа бросается 2d6, и результат сравнивается с показателем боевого духа существа. Если бросок больше показателя, существо падает духом и будет стремиться сбежать или прекратить бой. ПИ никогда не делают проверок боевого духа и сражаются, пока сами не решат отступить.\n\nПроверка боевого духа обычно делается при определённых обстоятельствах, но Мастер может дополнять этот список всякий раз, когда, по его мнению, ситуация того требует. За один бой может понадобиться не одна проверка боевого духа, если наступает несколько условий.\n\n* Когда мирный человек, не боец, впервые сталкивается с перспективой серьёзного физического вреда.\n* Когда первого участника группы убивают или выводят из строя.\n* Когда группа начинает заметно проигрывать бой или её шансы на победу существенно тают.\n* Когда группа сталкивается с ужасающим проявлением магии, чудовищной бойней или несоизмеримо превосходящим противником.\n\nПоследствия проваленной проверки боевого духа зависят от ситуации и от того, кто её проваливает. Небойцы и недисциплинированные вояки обычно бегут без оглядки, бросая щиты и поклажу в попытке спастись от гибели.\n\nОбученные и опытные воины обычно совершают боевой отход, стараясь оторваться от врага и увести в безопасность как можно больше товарищей. Разумеется, перед лицом поистине сокрушительных обстоятельств они могут побежать так же резво, как их зелёные собратья.\n\nЕсли бегство кажется невозможным или чрезмерно опасным, они могут бросить оружие и молить о пощаде — если считают, что есть хоть какой-то шанс получить её от нападающих. Если и это выглядит безнадёжным, они могут просто осесть на землю в парализующем отчаянии, молясь своим богам, или драться с новым неистовством в отчаянной попытке прорубить себе путь из западни. Кто-то предложит откуп или услуги в обмен на свою жизнь.\n\nВ любом случае, провалив проверку боевого духа, сторона будет не в состоянии сражаться с этими врагами, пока не получит время собраться с духом."},{"n":"5.3.2","l":3,"te":"Fleeing and Escape","tr":"Бегство и спасение","en":"Whether from a failed Morale check or the PCs deciding on a prudent \nretreat, sometimes a side decamps the field. If pursued, the rules for \nchases and pursuit given in the rules section of this document can be \nused to judge the likelihood of success.\nGMs should be charitable about allowing PCs to run away. Most \npursuers have little reason to be particularly relentless, and a party \nshould be taught that running away is a viable option and not an \nexcuse to die tired.\nThe Importance of Morale\nIt’s very important that GMs keep Morale checks in mind and use \nthem regularly during combat. Only truly abnormal creatures such as \nmindless undead, unthinking vermin, or command-bound automatons \nwill fight relentlessly onward regardless of the situation. If every goblin \nwarrior is a Spartan at Thermopylae, the PCs are going to lose a lot of \ncomrades cleaning up fights that were clearly won five rounds ago.\nAside from that, warriors are not fools, and they will not linger to \nfight battles that cannot be won and are not worth their lives. Even \nif they never fail a Morale check, they will not stay to die to the last \nman if there’s no pressing reason for them to do so. Once they see\nthat victory is a vain hope, they’ll try to withdraw or to cut some kind \nof deal with their enemies.\nOf course, not all beaten sides respond rationally. The terror of \nbattle, the confusion of melee, and a misunderstanding of the situa-\ntion might leave some few warriors battling on even when all is lost, \nsimply because they haven’t realized that all their friends are dead \nyet. Green troops are notorious for sometimes achieving military \ngoals that veterans never could, because veterans would recognize \ncertain failure much earlier. The same can sometimes apply to frenetic \nbarbarians, savage mobs, or single-minded marauders.","ru":"Из-за проваленной проверки боевого духа или благоразумного решения ПИ отступить — но порой одна из сторон покидает поле. Если за ней гонятся, шансы на успех можно оценить по правилам погонь и преследования, приведённым в разделе правил этого документа.\n\nМастеру стоит быть великодушным, позволяя ПИ убегать. У большинства преследователей мало причин для особого упорства, а партию нужно приучить, что бегство — рабочий вариант, а не способ умереть усталым.\n\n### Важность боевого духа\n\nОчень важно, чтобы Мастер помнил о проверках боевого духа и регулярно применял их в бою. Лишь по-настоящему аномальные существа — безмозглая нежить, неразумные гады да скованные приказом автоматоны — будут неумолимо драться дальше, что бы ни происходило. Если каждый гоблин-воин — спартанец при Фермопилах, ПИ потеряют немало товарищей, дочищая бои, которые были явно выиграны пять раундов назад.\n\nКроме того, воины не дураки: они не станут задерживаться в битвах, которые нельзя выиграть и которые не стоят их жизней. Даже ни разу не провалив проверку боевого духа, они не останутся умирать до последнего человека, если нет веской причины так поступать. Поняв, что победа — пустая надежда, они попытаются отойти или сторговаться с врагом о какой-нибудь сделке.\n\nКонечно, не всякая битая сторона ведёт себя разумно. Ужас боя, сумятица рукопашной и непонимание происходящего могут заставить горстку воинов драться дальше, даже когда всё потеряно, — просто потому, что они ещё не осознали, что все их друзья уже мертвы. Зелёные войска печально знамениты тем, что порой добиваются военных целей, недостижимых для ветеранов: ветераны распознали бы верный провал куда раньше. То же порой относится к исступлённым варварам, озверевшим толпам и одержимым одной целью мародёрам."},{"n":"5.4.0","l":2,"te":"Instinct Checks","tr":"Проверки Инстинкта","en":"Very few creatures are capable of engaging in desperate, life-or-\ndeath struggles without losing some amount of their rationality. Terror, \nfury, excruciating pain, and situational blindness can sometimes make \na combatant do something genuinely stupid, even if they would never \nhave made such a mistake in calmer circumstances The Instinct check \nis the game’s way of helping a GM take this situational chaos into \naccount.","ru":"Очень немногие существа способны вести отчаянную схватку не на жизнь, а на смерть, не теряя при этом части рассудительности. Ужас, ярость, невыносимая боль и слепота к происходящему вокруг порой заставляют бойца сделать откровенную глупость, которой он никогда не совершил бы в спокойной обстановке. Проверка Инстинкта — это способ, которым игра помогает Мастеру учесть этот ситуационный хаос."},{"n":"5.4.1","l":3,"te":"Making an Instinct Check","tr":"Как делать проверку Инстинкта","en":"Whenever an Instinct check is triggered, the GM rolls a 1d10. If \nthe number rolled is equal or less than a combatant’s Instinct score, \nmeasured from 1 to 10, they do something impulsive, short-sighted, \ninstinctual, or otherwise less-than-tactically-sound. Instinct checks \nare rolled separately for individual combatants, though the GM can \nsimply decide that an appropriate percentage of large groups au-\ntomatically fail the check. If the creatures have an Instinct of 3, for \nexample, the GM might just decide that 30% of them fail the check \nrather than dicing for every one.\nPCs never make Instinct checks. Even in the grip of terror or trau-\nmatic injury they remain in control of their own choi
