 5d6 | +2 | +1 Any |\n| 6 | 6d6 | +3 |  |\n| 7 | 7d6 | +3 | +1 Any |\n| 8 | 8d6 | +4 |  |\n| 9 | 9d6 | +4 |  |\n| 10 | 10d6 | +5 | +1 Any |\n\n**Partial Mage/Bard**\n| Level | Hit Dice | Bonus Attack | Focus Picks |\n|---|---|---|---|\n| 1 | 1d6 | +0 | 1 Any |\n| 2 | 2d6 | +1 | +1 Any |\n| 3 | 3d6 | +1 |  |\n| 4 | 4d6 | +2 |  |\n| 5 | 5d6 | +2 | +1 Any |\n| 6 | 6d6 | +3 |  |\n| 7 | 7d6 | +3 | +1 Any |\n| 8 | 8d6 | +4 |  |\n| 9 | 9d6 | +4 |  |\n| 10 | 10d6 | +5 | +1 Any |\n\n**Partial Warrior/Bard**\n| Level | Hit Dice | Bonus Attack | Focus Picks |\n|---|---|---|---|\n| 1 | 1d6+2 | +1 | 1 Warrior +1 Any |\n| 2 | 2d6+4 | +2 | +1 Any |\n| 3 | 3d6+6 | +2 |  |\n| 4 | 4d6+8 | +3 |  |\n| 5 | 5d6+10 | +4 | +1 Any |\n| 6 | 6d6+12 | +5 |  |\n| 7 | 7d6+14 | +5 | +1 Any |\n| 8 | 8d6+16 | +6 |  |\n| 9 | 9d6+18 | +6 |  |\n| 10 | 10d6+20 | +7 | +1 Any |","ru":"Барды — те, кто наделён сверхъестественной способностью трогать сердца силой своего выступления.\n\n#### Преимущества Барда\n\nБард — частичный класс Эксперта: Авантюрист должен соединить его со вторым частичным классом. Частичный Воин/Бард может быть воинственным скальдом, частичный Эксперт/Бард — вороватым трубадуром, а частичный Маг/Бард — вплетать истинную магию в своё искусное выступление.\n\nВсе Барды получают Выступление-0 при создании персонажа. Их способности держатся на умении тронуть слушателя — песней, музыкой или зажигательной речью.\n\nВ отличие от обычного класса частичного Эксперта, Бард не получает ни бонусный небоевой Фокус на первом уровне, ни бонусный пункт навыка частичного Эксперта при росте уровня персонажа. Тот, кто берёт вторым классом стандартного частичного Эксперта, получает всё это как обычно.\n\n**Частичный Эксперт/Бард**\n\n| Уровень | Кости здоровья | Бонус атаки | Выборы Фокусов |\n|---|---|---|---|\n| 1 | 1d6 | +0 | 1 экспертский + 1 любой |\n| 2 | 2d6 | +1 | +1 любой |\n| 3 | 3d6 | +1 | – |\n| 4 | 4d6 | +2 | – |\n| 5 | 5d6 | +2 | +1 любой |\n| 6 | 6d6 | +3 | – |\n| 7 | 7d6 | +3 | +1 любой |\n| 8 | 8d6 | +4 | – |\n| 9 | 9d6 | +4 | – |\n| 10 | 10d6 | +5 | +1 любой |\n\n**Частичный Маг/Бард**\n\n| Уровень | Кости здоровья | Бонус атаки | Выборы Фокусов |\n|---|---|---|---|\n| 1 | 1d6 | +0 | 1 любой |\n| 2 | 2d6 | +1 | +1 любой |\n| 3 | 3d6 | +1 | – |\n| 4 | 4d6 | +2 | – |\n| 5 | 5d6 | +2 | +1 любой |\n| 6 | 6d6 | +3 | – |\n| 7 | 7d6 | +3 | +1 любой |\n| 8 | 8d6 | +4 | – |\n| 9 | 9d6 | +4 | – |\n| 10 | 10d6 | +5 | +1 любой |\n\n**Частичный Воин/Бард**\n\n| Уровень | Кости здоровья | Бонус атаки | Выборы Фокусов |\n|---|---|---|---|\n| 1 | 1d6+2 | +1 | 1 воинский + 1 любой |\n| 2 | 2d6+4 | +2 | +1 любой |\n| 3 | 3d6+6 | +2 | – |\n| 4 | 4d6+8 | +3 | – |\n| 5 | 5d6+10 | +4 | +1 любой |\n| 6 | 6d6+12 | +5 | – |\n| 7 | 7d6+14 | +5 | +1 любой |\n| 8 | 8d6+16 | +6 | – |\n| 9 | 9d6+18 | +6 | – |\n| 10 | 10d6+20 | +7 | +1 любой |"},{"n":"1.5.3.1","l":4,"te":"Bard Arts","tr":"Искусства Барда","en":"A Bard has an Effort score equal to their Perform skill level plus their Charisma modifier, to a minimum of one point. Bard arts may be used in or out of armor, and do not count as magical effects for the purposes of abilities that counter or detect magic. Unless specified otherwise, their range is out to normal unaided voice range.\nEvery Bard gains A Thousand Tongues as a starting art, plus one more of their choice. As they advance in levels, they can pick additional arts.\n**A Thousand Tongues:** Your arts that require communication are intuitively understood by all intelligent creatures, whether or not you speak their language. You can learn a new language with no more than a week of study with a native speaker.\n**Battle Cry:** Commit Effort for the day as an On Turn action to bolster your allies. They gain +1 to hit, saving throws, and damage, including Shock, for one round per level. At 4th level this bonus increases to +2, and at 9th, to +3.\n**Cursed Tune:** Commit Effort for the scene as a Main Action while targeting an intelligent creature. Your imprecations cause them to falter, inflicting a -1 penalty to their hit, damage, and saving throw rolls for one round per level. At 4th level this penalty becomes -2, and at 9th it becomes -3.\n**Deft Fingers:** You’re accustomed to juggling your belongings while holding an instrument. Your maximum Readied item count increases by two.\n**Entangle Incantation:** Commit Effort for the scene as an Instant action when an foe within 60’ incants a spell. Your voice tangles with their words, forcing them to make an opposed Int/Magic vs Cha/Perform skill check against you, with a +2 bonus to your roll. If you tie or succeed, the spell fizzles and is wasted. This art can be used only once per round.\n**Evoke Emotion:** Commit Effort for the day as a Main Action while performing. You evoke a desired emotion in listeners, whether intelligent or animal, granting a +1 bonus to relevant social skill checks for the scene for you and your allies. If desired, you can force a new Reaction Roll, taking it if it’s more favorable than the original. This art does not work in combat and can be used only once per scene.\n**Inspire Dread:** Commit Effort for the day as an Instant action when your enemies are forced to make a Morale check. You goad\ntheir fears, forcing them to make two Morale checks instead of one. Those who succeed on both must still make an Instinct check immediately after.\n**Keen Senses:** This art gives you the equivalent of sight out to 60’ even if blinded. You cannot distinguish colors, but you can perceive physical details as readily as if with your eyes. Physically-invisible creatures and objects are obvious to you.\n**Liberating Song:** You are immune to mindor emotion-controlling effects. You can Commit Effort for the scene as an Instant action to grant any ally in range a Mental saving throw to throw off such effects, assuming they allowed a save to begin with. If the second save is failed, this art cannot help them.\n**Rally:** Commit Effort for the day as a Main Action to exhort a wounded or fallen ally, removing any Frailty. The target regains 2d6 plus your level in hit points, but you incur one System Strain.\n**Soothe the Savage:** Commit Effort for the day as a Main Action. For as long as you keep spending a Main Action performing each round, animals and other living bestial creatures will not attack you or your allies unless commanded by their masters or threatened by the party. This art can’t be triggered once actual combat has begun.\n**Soothing Graces:** Your arts restore and hearten those with you. You and your allies lose an extra point of System Strain after each night’s comfortable rest. This does not stack with similar rest-aiding powers.\n**Swift Misdirection:** Commit Effort for the scene as a Main Action and target one intelligent creature within earshot. Tell them something in no more than one sentence; unless what you say is physically impossible or emotionally unendurable, they must make a Mental save or believe it for one round. After that, they can judge your words with their normal reason. This art can affect a creature only once per scene.\n| Level | Arts Gained at This Level Bard Art Progression |\n|---|---|\n| 1 | A Thousand Tongues and Any One |\n| 2 | Any One |\n| 3 |  |\n| 4 | Any One |\n| 5 |  |\n| 6 | Any One |\n| 7 |  |\n| 8 | Any One |\n| 9 |  |\n| 10 | Any One |","ru":"Показатель Усилия Барда равен уровню его навыка Выступление плюс модификатор Харизмы, минимум один пункт. Искусства Барда можно применять как в доспехах, так и без них, и они не считаются магическими эффектами для способностей, которые противодействуют магии или обнаруживают её. Если не сказано иное, их дальность — обычная слышимость голоса без усиления.\n\nКаждый Бард получает стартовым Искусством Тысячу языков, плюс ещё одно на свой выбор. С ростом уровней он выбирает дополнительные Искусства.\n\n**Боевой клич:** Задействуй Усилие до конца дня Действием в свой ход, чтобы приободрить союзников. Они получают +1 к атаке, спасброскам и урону, включая Шок, на один раунд за уровень. На 4-м уровне бонус растёт до +2, на 9-м — до +3.\n\n**Вселить ужас:** Задействуй Усилие до конца дня Мгновенным действием, когда враги вынуждены проходить проверку боевого духа. Ты растравливаешь их страхи: вместо одной они проходят две проверки боевого духа. Те, кто прошёл обе, всё равно сразу после этого проходят проверку Инстинкта.\n\n**Ловкие пальцы:** Ты привык управляться со своим скарбом, не выпуская из рук инструмента. Максимум предметов в готовности у тебя увеличивается на два.\n\n**Ловкий отвод глаз:** Задействуй Усилие до конца сцены Основным действием и выбери одно разумное существо в пределах слышимости. Скажи ему что-нибудь, уложившись в одно предложение; если сказанное не является физически невозможным или эмоционально невыносимым, цель должна пройти Ментальный спасбросок, иначе будет верить этому один раунд. Затем она сможет оценить твои слова обычным рассудком. Это Искусство действует на существо лишь раз за сцену.\n\n**Острые чувства:** Это Искусство даёт тебе эквивалент зрения на 60 футов, даже если ты ослеплён. Цветов ты не различаешь, но физические детали воспринимаешь так же легко, как глазами. Физически невидимые существа и предметы для тебя очевидны.\n\n**Песнь освобождения:** Ты невосприимчив к эффектам, управляющим разумом или чувствами. Ты можешь задействовать Усилие до конца сцены Мгновенным действием, чтобы дать любому союзнику в пределах дальности Ментальный спасбросок для сброса такого эффекта — при условии, что эффект изначально допускал спасбросок. Если и этот второй спасбросок провален, это Искусство союзнику уже не поможет.\n\n**Пробудить чувство:** Задействуй Усилие до конца дня Основным действием во время выступления. Ты пробуждаешь в слушателях — разумных или животных — нужное чувство, давая себе и союзникам +1 к соответствующим социальным проверкам навыков до конца сцены. По желанию можешь потребовать новую проверку реакции и взять её результат, если он благоприятнее исходного. В бою это Искусство не работает и применяется лишь раз за сцену.\n\n**Проклятый мотив:** Задействуй Усилие до конца сцены Основным действием, выбрав целью разумное существо. Твои поношения заставляют его дрогнуть: штраф -1 к броскам атаки, урона и спасброскам на один раунд за уровень. На 4-м уровне штраф становится -2, на 9-м — -3.\n\n**Сплочение:** Задействуй Усилие до конца дня Основным действием, чтобы воодушевить раненого или павшего союзника, сняв любую Хилость. Цель восстанавливает 2d6 плюс твой уровень пунктов здоровья, а ты получаешь один пункт Системной нагрузки.\n\n**Спутать чары:** Задействуй Усилие до конца сцены Мгновенным действием, когда враг в пределах 60 футов начитывает заклинание. Твой голос вплетается в его слова, вынуждая его пройти встречную проверку Инт/Магия против твоей Хар/Выступление с бонусом +2 к твоему броску. Если ты сравнялся или превзошёл его, заклинание срывается и пропадает впустую. Это Искусство можно применять лишь раз в раунд.\n\n**Тысяча языков:** Твои Искусства, требующие общения, интуитивно понятны всем разумным существам, говоришь ты на их языке или нет. Новый язык ты выучиваешь не больше чем за неделю занятий с носителем.\n\n**Усмирить дикаря:** Задействуй Усилие до конца дня Основным действием. Пока ты каждый раунд тратишь Основное действие на выступление, животные и другие живые звероподобные существа не нападут на тебя и твоих союзников, если только им не прикажут хозяева или отряд сам им не пригрозит. Это Искусство нельзя пустить в ход, когда настоящий бой уже начался.\n\n**Утешающая благодать:** Твои Искусства восстанавливают и ободряют спутников. Ты и твои союзники теряете дополнительный пункт Системной нагрузки после каждой ночи спокойного отдыха. Это не складывается с похожими способностями, улучшающими отдых.\n\n**Развитие Искусств Барда**\n\n| Уровень | Искусства, получаемые на этом уровне |\n|---|---|\n| 1 | Тысяча языков и одно любое |\n| 2 | Одно любое |\n| 3 | – |\n| 4 | Одно любое |\n| 5 | Одно любое |\n| 6 | Одно любое |\n| 7 | – |\n| 8 | Одно любое |\n| 9 | – |\n| 10 | Одно любое |"},{"n":"1.5.4","l":3,"te":"The Beastmaster","tr":"Повелитель зверей","en":"Beastmasters are those PCs with an unnatural ability to control and influence animals. For some, these abilities are the fruit of rigorous magical study, while others obtain them from cultural practices, a feral upbringing, or natural aptitude.\n#### Beastmaster Benefits\nThe Beastmaster exists only as a partial Mage class, meant to be taken by an Adventurer along with another partial class. A Partial Warrior/Beastmaster may be a savage barbarian or wood-wise ranger, while a Partial Expert/Beastmaster might be a masterful hunter or zoologist.\nAll Beastmasters get Survive as a bonus skill at level-0, or at level-1 if they already have it at level-0. The amount of time they spend in the wilderness learning of its ways can’t help but teach them how to survive in hard conditions and navigate the perils of an untamed land.\n#### Beastmaster Companions\nMany Beastmaster arts apply to the PC’s animal companion. There are a few basic guidelines for such companions that a GM should keep in mind during play.\nA companion animal cannot have a number of hit dice greater than the Beastmaster’s level plus one. Thus a 2 hit die wolf is an acceptable companion for a first-level Beastmaster, but a 5 hit die tentacular horror is too potent to be bound to service.\nA companion animal cannot have human levels of intelligence. It must be more-or-less animal in its thought patterns, though it can be a magical beast or supernatural entity of some kind.\nA Beastmaster can normally have only one companion animal at a time. They can leave an animal behind in any terrain suitable for its survival and expect it to be in the same vicinity later if they choose to return for it and no one has killed it in the meanwhile. Released creatures are usually friendly to the Beastmaster still, unless they have been mistreated or are exceptionally savage.\nA companion animal functions as an independent allied creature. It will obey commands from the Beastmaster that are not contrary to its own nature or beyond its intellect, but it will fight, move, check Instinct and Morale as normal, and act independently in combat. If the creature is mistreated or used as mere cannon fodder, it can flee or turn on its former master.\nA companion animal must be given a name by the Beastmaster. Without a name to focus the PC’s arts, the creature cannot be controlled.\n#### The Chosen Friend\nSome Beastmasters form a lifelong bond with a single dear companion. If a PC chooses this option, they can only ever Bind one companion, but it gains the benefit of the Shared Vitality and Mind Call arts automatically. So long as the Beastmaster lives, this chosen friend cannot truly die; if reduced to zero hit points, it disappears, but will manifest again at the Beastmaster’s side the following dawn with its full hit points. Of course, the master is expected to treat this companion as the beloved friend it is, and not as mere battle-fodder.\n**Partial Expert/Beastmaster**\n| Level | Hit Dice | Bonus Attack | Focus Picks |\n|---|---|---|---|\n| 1 | 1d6 | +0 | 1 Expert +1 Any |\n| 2 | 2d6 | +1 | +1 Any |\n| 3 | 3d6 | +1 |  |\n| 4 | 4d6 | +2 |  |\n| 5 | 5d6 | +2 | +1 Any |\n| 6 | 6d6 | +3 |  |\n| 7 | 7d6 | +3 | +1 Any |\n| 8 | 8d6 | +4 |  |\n| 9 | 9d6 | +4 |  |\n| 10 | 10d6 | +5 | +1 Any |\n**Partial Mage/Beastmaster**\n| Level | Hit Dice | Bonus Attack | Focus Picks |\n|---|---|---|---|\n| 1 | 1d6-1 | +0 | 1 Any |\n| 2 | 2d6-2 | +0 | +1 Any |\n| 3 | 3d6-3 | +0 |  |\n| 4 | 4d6-4 | +0 |  |\n| 5 | 5d6-5 | +1 | +1 Any |\n| 6 | 6d6-6 | +1 |  |\n| 7 | 7d6-7 | +1 | +1 Any |\n| 8 | 8d6-8 | +1 |  |\n| 9 | 9d6-9 | +1 |  |\n| 10 | 10d6-10 | +2 | +1 Any |\n**Partial Warrior/Beastmaster**\n| Level | Hit Dice | Bonus Attack | Focus Picks |\n|---|---|---|---|\n| 1 | 1d6+2 | +1 | 1 Warrior +1 Any |\n| 2 | 2d6+4 | +2 | +1 Any |\n| 3 | 3d6+6 | +2 |  |\n| 4 | 4d6+8 | +3 |  |\n| 5 | 5d6+10 | +4 | +1 Any |\n| 6 | 6d6+12 | +5 |  |\n| 7 | 7d6+14 | +5 | +1 Any |\n| 8 | 8d6+16 | +6 |  |\n| 9 | 9d6+18 | +6 |  |\n| 10 | 10d6+20 | +7 | +1 Any |","ru":"Повелители зверей — это ПИ с противоестественной способностью управлять животными и влиять на них. У одних эти способности — плод строгих магических штудий, другим их дали обычаи народа, дикарское воспитание или природный дар.\n\n#### Преимущества Повелителя зверей\n\nПовелитель зверей существует только как частичный класс Мага, который Авантюрист берёт вместе с другим частичным классом. Частичный Воин/Повелитель зверей может быть свирепым варваром или знающим лес следопытом, а частичный Эксперт/Повелитель зверей — искусным охотником или зоологом.\n\nВсе Повелители зверей получают Выживание как бонусный навык на уровне-0, а если он уже есть на уровне-0 — на уровне-1. Время, проведённое в глуши за изучением её обычаев, не может не научить их выживать в суровых условиях и обходить опасности дикого края.\n\n#### Спутники Повелителя зверей\n\nМногие Искусства Повелителя зверей относятся к зверю-спутнику ПИ. Вот несколько базовых правил о таких спутниках, которые Мастеру стоит держать в голове во время игры.\n\nЗверь-спутник не может иметь больше Костей здоровья, чем уровень Повелителя зверей плюс один. Так, волк с 2 КЗд — допустимый спутник для Повелителя зверей первого уровня, а щупальцевый ужас с 5 КЗд слишком могуч, чтобы привязать его к службе.\n\nЗверь-спутник не может обладать человеческим уровнем разума. Его мышление должно быть более-менее звериным, хотя сам он может быть магическим зверем или своего рода сверхъестественным существом.\n\nОбычно у Повелителя зверей может быть лишь один зверь-спутник за раз. Он может оставить зверя в любой местности, пригодной для его выживания, и рассчитывать найти его в той же округе позже, если решит за ним вернуться, а зверя тем временем никто не убьёт. Отпущенные существа обычно по-прежнему дружелюбны к Повелителю зверей — если с ними не обращались дурно и они не исключительно свирепы.\n\nЗверь-спутник действует как независимое союзное существо. Он выполняет команды Повелителя зверей, которые не противоречат его природе и не превосходят его разумения, но сражается, перемещается, проходит проверки Инстинкта и боевого духа как обычно и действует в бою самостоятельно. Если с существом обращаются дурно или используют его как простое пушечное мясо, оно может сбежать или наброситься на бывшего хозяина.\n\nПовелитель зверей обязан дать зверю-спутнику имя. Без имени, на котором сосредоточиваются Искусства ПИ, существом нельзя управлять.\n\n#### Избранный друг\n\nНекоторые Повелители зверей на всю жизнь связывают себя с одним дорогим спутником. Если ПИ выбирает этот вариант, он может Привязать лишь одного спутника за всю жизнь, но тот автоматически получает преимущества Искусств «Общая жизненная сила» и «Мысленный зов». Пока Повелитель зверей жив, избранный друг не может умереть по-настоящему: упав до нуля пунктов здоровья, он исчезает, но на следующем рассвете вновь возникает рядом с Повелителем зверей с полными пунктами здоровья. Разумеется, от хозяина ждут, что он будет обращаться с этим спутником как с любимым другом, каков тот и есть, а не как с расходным материалом для битв.\n\n**Частичный Эксперт/Повелитель зверей**\n\n| Уровень | Кости здоровья | Бонус атаки | Выборы Фокусов |\n|---|---|---|---|\n| 1 | 1d6 | +0 | 1 экспертский + 1 любой |\n| 2 | 2d6 | +1 | +1 любой |\n| 3 | 3d6 | +1 | – |\n| 4 | 4d6 | +2 | – |\n| 5 | 5d6 | +2 | +1 любой |\n| 6 | 6d6 | +3 | – |\n| 7 | 7d6 | +3 | +1 любой |\n| 8 | 8d6 | +4 | – |\n| 9 | 9d6 | +4 | – |\n| 10 | 10d6 | +5 | +1 любой |\n\n**Частичный Маг/Повелитель зверей**\n\n| Уровень | Кости здоровья | Бонус атаки | Выборы Фокусов |\n|---|---|---|---|\n| 1 | 1d6-1 | +0 | 1 любой |\n| 2 | 2d6-2 | +0 | +1 любой |\n| 3 | 3d6-3 | +0 | – |\n| 4 | 4d6-4 | +0 | – |\n| 5 | 5d6-5 | +1 | +1 любой |\n| 6 | 6d6-6 | +1 | – |\n| 7 | 7d6-7 | +1 | +1 любой |\n| 8 | 8d6-8 | +1 | – |\n| 9 | 9d6-9 | +1 | – |\n| 10 | 10d6-10 | +2 | +1 любой |\n\n**Частичный Воин/Повелитель зверей**\n\n| Уровень | Кости здоровья | Бонус атаки | Выборы Фокусов |\n|---|---|---|---|\n| 1 | 1d6+2 | +1 | 1 воинский + 1 любой |\n| 2 | 2d6+4 | +2 | +1 любой |\n| 3 | 3d6+6 | +2 | – |\n| 4 | 4d6+8 | +3 | – |\n| 5 | 5d6+10 | +4 | +1 любой |\n| 6 | 6d6+12 | +5 | – |\n| 7 | 7d6+14 | +5 | +1 любой |\n| 8 | 8d6+16 | +6 | – |\n| 9 | 9d6+18 | +6 | – |\n| 10 | 10d6+20 | +7 | +1 любой |"},{"n":"1.5.4.1","l":4,"te":"Beastmaster Arts","tr":"Искусства Повелителя зверей","en":"Beastmaster Effort is calculated with Survive, and is equal to the PC’s Survive skill level plus the higher of their Wisdom or Charisma modifiers, to a minimum of one point. All Beastmasters start play with the Bind Companion art and one more of their choosing. They learn additional arts as they gain experience. Unlike some Mage traditions, Beastmasters can use their arts normally while armored.\n\n**Bind Companion:** With a day’s work in a location you can find and bind a suitable animal companion. If looking for a particular type of companion, it must be found in the area and may require a Wis/Survive skill check at a difficulty of 10 or more if it’s a particularly rare creature. If you encounter a suitable animal on an adventure, you may bind it as a Main Action, with the creature allowed a Mental saving throw to resist and become impervious to your powers. You may release a companion as a Main Action if you no longer wish its service or want to bind a different beast.\n\n##### Other Beastmaster Arts\n\n**Beast Ward:** Commit Effort as an On Turn action. So long as the Effort remains Committed, the Beastmaster will not be attacked by unintelligent beasts unless the beast is commanded to do so by its master, the beast is starving, or the Beastmaster or their allies performs some hostile act against it. Once the ward ends or is broken, it cannot be re-established in the same scene. Magical beasts and those trained specifically as guardians of an area get a Mental save to resist this power.\n\n**Eyes of the Beast:** Commit Effort for the scene as an On Turn action. For the rest of the scene, you can share the senses of your companion. Neither of you can be surprised unless both are surprised.\n\n**Feral Toughness:** Your maximum hit point total is increased by the natural, unmodified hit dice of your companion; thus, a 5 hit die companion increases your maximum hit points by 5. You are impervious to normal outdoor extremes of heat or cold. Your base Armor Class is equal to 13 plus half your level, rounded up. This AC can be modified by shields or Dexterity modifiers, but not by armor.\n\n**Howl of Distant Summons:** You can call former animal companions to your side by Committing Effort for the day as a Main Action. The howl extends through time as well as space, and the subject will have received the message in time to reach your side within five minutes after you call for it. Once summoned, you may bind it again if you have no current companion. If the journey is exceptionally dangerous, difficult, or long, you’ll need to make a Cha/Survive skill check against a difficulty of 10 or more; on a failure, the beast could not make the journey and cannot be called by this power for another week.\n\n**Know the Weak Spot:** Whenever inflicting damage on a beast with a weapon or physical attack, roll the damage twice and take the higher score. Optionally, Commit Effort for the scene as an Instant action when an ally within earshot hits a beast; your shouted advice or distracting help allows them to roll damage twice and take the better result as well.\n\n**Mind Call:** Commit Effort for the scene as an On Turn action. For the rest of the scene you forge a telepathic bond with your animal companion. You can give it orders and receive information from the creature, at least insofar as its limited intellect allows.\n\n**Natural Weaponry:** You may have physically grown fangs and claws, or it may be that you just intuitively absorbed effective unarmed fighting techniques from your animal companions. When unarmed, your attacks count as weapons that use either Str or Dex\n\nas their modifier, use Punch or Stab as the skill, do 1d8 damage, and have a Shock value of 2/AC 13. These unarmed attacks can harm even creatures immune to non-magical weapons. The damage and Shock of these weapons gains a +1 bonus at level 3, a +2 bonus at level 6, and a +3 bonus at level 9.\n\n**Savage Senses:** Commit Effort for the scene as an On Turn action. For the remainder of the scene you are capable of seeing clearly even in pitch blackness, can scent out trails and belongings as perfectly as a wolf could, and gain a +2 bonus on all Notice skill checks involving sight, sound, or smell.\n\n**Shared Vitality:** The animal companions you bind have hit dice no lower than your level, even if they normally have far fewer. Thus, a 2 hit die beast bound by a 7th level Beastmaster would have 7 hit dice while it remained bound. Its hit bonus can’t be less than half its hit dice, rounded up. A Beastmaster can stabilize a Mortally Wounded companion by Committing Effort for the scene as an Instant action.\n\n**Swift Healing:** Commit Effort for the day as a Main Action to heal 1d6 damage per character level to a wounded companion. This healing can be extended only once per scene or fifteen minutes.\n\n**Tongue of the Beasts:** Commit Effort as an On Turn action. While the Effort remains committed, you can speak with any animal that has fur, feathers, scales, or skin. This art allows them to temporarily speak as if they had human intellect, though their interests, knowledge, and desires do not change.\n\n| Level | Arts Gained Partial Beastmaster |\n|---|---|\n| 1 | Bind Companion and Any One |\n| 2 | Any One |\n| 3 |  |\n| 4 | Any One |\n| 5 | Any One |\n| 6 | Any One |\n| 7 |  |\n| 8 | Any One |\n| 9 |  |\n| 10 | Any One |","ru":"Усилие Повелителя зверей считается через Выживание: оно равно уровню навыка Выживание ПИ плюс больший из модификаторов Мудрости или Харизмы, минимум один пункт. Все Повелители зверей начинают игру с Искусством «Привязать спутника» и ещё одним на свой выбор. Дополнительные Искусства они осваивают, набираясь опыта. В отличие от некоторых традиций Мага, Повелители зверей свободно применяют свои Искусства в доспехах.\n\n**Привязать спутника:** За день работы в какой-то местности ты можешь найти и привязать подходящего зверя-спутника. Если ищешь спутника определённого вида, он должен водиться в этих краях, а для особенно редкого существа может понадобиться проверка Мдр/Выживание сложностью 10 и выше. Встретив подходящего зверя в приключении, ты можешь привязать его Основным действием; существу положен Ментальный спасбросок, чтобы устоять и стать невосприимчивым к твоим силам. Ты можешь отпустить спутника Основным действием, если больше не желаешь его службы или хочешь привязать другого зверя.\n\n##### Прочие Искусства Повелителя зверей\n\n**Быстрое исцеление:** Задействуй Усилие до конца дня Основным действием, чтобы исцелить раненому спутнику 1d6 урона за уровень персонажа. Такое исцеление можно даровать лишь раз за сцену или пятнадцать минут.\n\n**Вой дальнего зова:** Ты можешь призывать к себе прежних зверей-спутников, задействовав Усилие до конца дня Основным действием. Вой разносится не только сквозь пространство, но и сквозь время: адресат получит весть загодя — так, чтобы успеть оказаться рядом с тобой в течение пяти минут после зова. Призванного зверя можно привязать снова, если у тебя сейчас нет спутника. Если путь исключительно опасен, труден или долог, потребуется проверка Хар/Выживание против сложности 10 и выше; при провале зверь не смог проделать путь, и этой способностью его не позвать ещё неделю.\n\n**Глаза зверя:** Задействуй Усилие до конца сцены Действием в свой ход. До конца сцены ты можешь разделять чувства своего спутника. Ни одного из вас нельзя застать врасплох, если врасплох не застигнуты оба.\n\n**Звериная стойкость:** Твой максимум пунктов здоровья увеличивается на число природных, немодифицированных Костей здоровья твоего спутника: так, спутник с 5 КЗд увеличивает твой максимум пунктов здоровья на 5. Ты невосприимчив к обычным для дикой природы крайностям жары и холода. Твой базовый Класс защиты равен 13 плюс половина твоего уровня с округлением вверх. Этот КЗщ могут менять щиты и модификатор Ловкости, но не броня.\n\n**Звериное чутьё:** Задействуй Усилие до конца сцены Действием в свой ход. До конца сцены ты ясно видишь даже в кромешной тьме, чуешь следы и вещи не хуже волка и получаешь +2 ко всем проверкам навыка Внимание, связанным со зрением, слухом или обонянием.\n\n**Знание слабых мест:** Нанося зверю урон оружием или физической атакой, бросай урон дважды и бери больший результат. Вдобавок можешь задействовать Усилие до конца сцены Мгновенным действием, когда союзник в пределах слышимости попадает по зверю: твоя выкрикнутая подсказка или отвлекающая помощь позволяет и ему бросить урон дважды и взять лучший результат.\n\n**Мысленный зов:** Задействуй Усилие до конца сцены Действием в свой ход. До конца сцены ты держишь телепатическую связь со своим зверем-спутником. Ты можешь отдавать ему приказы и получать от существа сведения — насколько позволяет его ограниченный разум.\n\n**Оберег от зверей:** Задействуй Усилие Действием в свой ход. Пока Усилие остаётся задействованным, неразумные звери не нападают на Повелителя зверей — если только зверю не прикажет хозяин, зверь не изголодался или Повелитель зверей либо его союзники не совершат против зверя враждебное действие. Когда оберег закончился или был сломан, в той же сцене его не восстановить. Магические звери и звери, специально обученные охранять место, получают Ментальный спасбросок против этой способности.\n\n**Общая жизненная сила:** Привязанные тобой звери-спутники имеют Кости здоровья не ниже твоего уровня, даже если обычно их у них куда меньше. Так, зверь с 2 КЗд, привязанный Повелителем зверей 7-го уровня, имеет 7 КЗд, пока остаётся привязан. Его бонус атаки не может быть меньше половины его КЗд с округлением вверх. Повелитель зверей может стабилизировать смертельно раненного спутника, задействовав Усилие до конца сцены Мгновенным действием.\n\n**Природное оружие:** Может, у тебя и впрямь выросли клыки и когти, а может, ты просто интуитивно перенял действенные приёмы боя без оружия у своих зверей-спутников. Безоружные атаки считаются у тебя оружием, которое использует модификатор Сил или Лов, навык Кулак или Клинок, наносит 1d8 урона и имеет Шок 2/КЗщ 13. Такие безоружные атаки ранят даже существ, неуязвимых для немагического оружия. Урон и Шок этого оружия получают бонус +1 на 3-м уровне, +2 на 6-м и +3 на 9-м.\n\n**Язык зверей:** Задействуй Усилие Действием в свой ход. Пока Усилие остаётся задействованным, ты можешь говорить с любым животным, у которого есть мех, перья, чешуя или кожа. Это Искусство временно позволяет им говорить, будто у них человеческий разум, но их интересы, знания и желания не меняются.\n\n**Частичный Повелитель зверей**\n\n| Уровень | Получаемые Искусства |\n|---|---|\n| 1 | Привязать спутника и одно любое |\n| 2 | Одно любое |\n| 3 | – |\n| 4 | Одно любое |\n| 5 | Одно любое |\n| 6 | Одно любое |\n| 7 | – |\n| 8 | Одно любое |\n| 9 | – |\n| 10 | Одно любое |"},{"n":"1.5.5","l":3,"te":"The Blood Priest","tr":"Жрец крови","en":"As the devotee of a sanguinary god, a blood priest has magical powers for strengthening and supporting their allies.\n#### Blood Priest Benefits\nThe Blood Priest exists only as a partial Mage class, to be taken by an Adventurer alongside another partial class. A Partial Warrior/ Blood Priest might be a crusader for their god, wielding steel and terror against the evils of this world. A Partial Expert/Blood Priest might be an inquisitor, investigating dubious figures and sifting out the truth of mysterious events.\nAll Blood Priests gain Pray as a bonus skill, acquiring it at level-0, or level-1 if they already have it at level-0. Even a “Blood Priest” who has only learned their abilities through study of their scriptures must master a wide variety of ecclesiastical rites and rituals in order to activate their powers.","ru":"Посвящённый кровавого бога, жрец крови владеет магическими силами для укрепления и поддержки своих союзников.\n\n#### Преимущества Жреца крови\n\nЖрец крови существует только как частичный класс Мага и берётся Авантюристом в паре с другим частичным классом. Частичный Воин/Жрец крови может быть крестоносцем своего бога, обрушивающим сталь и ужас на зло этого мира. Частичный Эксперт/Жрец крови может быть инквизитором, что проверяет сомнительных особ и докапывается до истины в загадочных событиях.\n\nВсе Жрецы крови получают Молитву как бонусный навык: она приобретается на уровне-0 или на уровне-1, если уже была уровня-0. Даже «жрец крови», постигший свои способности лишь изучением писаний, должен освоить великое множество церковных обрядов и ритуалов, чтобы приводить свои силы в действие."},{"n":"1.5.5.1","l":4,"te":"Blood Priest Arts","tr":"Искусства Жреца крови","en":"Blood Priest Effort is calculated with Pray, with their total maximum Effort being equal to their Pray skill plus the higher of their Wisdom or Charisma modifiers, to a minimum of one point.\n\nAt first level, the Blood Priest may choose two of the following miracles to master, and gain more as they advance in levels. Once chosen, a miracle pick is permanent and cannot be changed later. Miracles are not hindered by the wearing of armor and require no gestures or free hand to employ, though usually a prayer must be vocalized as part of the action.\n\n**A Thousand Tongues:** Commit Effort as an On Turn action; while it remains Committed, you can speak with and understand any sentient creature with a language of their own. To any listener, it will seem as if you are perfectly fluent in their own language, even as you speak in your own native tongue. This ability does not allow you to read or write unknown languages.\n\n**Armor of God:** Commit Effort as an On Turn action. While the\n\nEffort remains Committed, you have a natural Armor Class of 15 plus half your level, rounded down. This AC can be modified by shields or your Dexterity modifier, but not by other worn armor.\n\n**Divine Guidance:** Commit Effort for the day as a Main Action and meditate upon a choice or potential action before you. The GM will tell you whether the likely outcome of that choice is weal, woe, a mix of both, or nothing significant, using their own best estimation. This insight cannot perceive likely outcomes more than an hour or so into the future.\n\n**Fear No Flame:** Commit Effort for the day as an On Turn action while nominating a visible target. For the rest of the scene, they are immune to non-magical flame, smoke, or explosive damage, and decrease any sources of such magical damage they take by five points per level of Pray you have.\n\n**God Wills It:** Commit Effort for the day as an Instant action and loudly call down your god’s blessing on your comrades. For the rest of the scene, up to six allies per character level in earshot gain an effective Morale of 12 and a +1 bonus to hit and damage rolls, including any Shock that may be inflicted. At fifth level this becomes a +2 bonus, and at tenth level it becomes a +3 bonus.\n\n**Merciful Healing:** Commit Effort for the day as a Main Action and touch a target within melee range. The target receives 1d6+2 points of magical healing. If done in combat or used to revive a Mortally Wounded subject, the rushed haste of the healing adds 1 System\n\nStrain to the target, but no System Strain is added if it is applied outside of combat. At fourth level the healing done increases to 2d6+4 and at eighth level it becomes 4d6+8.\n\n**Sanctified Ward:** Commit Effort as an On Turn action. While the Effort is maintained and until you take some hostile action against a creature, you are immune to Shock damage and gain a +4 bonus to your Armor Class and all saving throws. Enemies must pass an Instinct check each round to target you with attacks; on a failure, they may take some other action instead. Once this art is ended it cannot be reactivated for the rest of the scene. Healing and other indirect support of fighting comrades does not count as a hostile action.\n\n**Smite the Wicked:** Commit Effort for the day as a On Turn action whenever you attack or take some damaging action toward a single target. You gain a +4 bonus to any hit roll, you inflict your character level as automatic damage, and you can roll any damage dice twice and take the higher result. This ability can only be used once per scene on a given target.\n\n**The Light of Faith:** Commit Effort as an On Turn action; while it remains Committed, you can cast a clear, bright radiance that extends up to thirty feet away from you. At your discretion, this light is visible only to you and your comrades, including up to a dozen allies.\n\n**Transubstantiation:** Commit Effort for the day as a Main Action to transform up to a gallon of any liquid into sacred blood. A draught of this holy liquid is sufficient to sustain a drinker for a day without further food or drink and will heal 1d6 plus the user’s Pray skill in lost hit points. A gallon of blood is sufficient to help a half-dozen people. The benefits of this art can be enjoyed only once per day, and any undrunk blood sublimates away within a minute.\n\n**Turn False Life:** Commit Effort for the day as a Main Action and make the sign of your god before one or more visible targets within sixty feet. Roll 2d6 and add your character level; that many hit dice of undead, automatons, or other synthetic, extraplanar, or unnatural life forms must make Mental saving throws or cower for the rest of the scene or until they or their comrades are attacked. Cowering enemies will take no hostile action and may flee unless bound to their location. This power does not affect foes with twice as many hit dice as the blood priest has levels. If the rolled hit die total isn’t enough to fully affect a creature, it is unaffected.\n\n**Words of Mercy:** Commit Effort for the day as an Instant action to reroll any failed social skill check related to maintaining peace, granting help, or encouraging virtuous acts of compassion, mercy, or truthfulness. This art can be used only once on any given skill check.\n\n**Wrath of the Most High:** Commit Effort for the scene as a Main Action while you rebuke a visible target. The first time the target takes damage before the end of the next round, it suffers automatic additional damage equal to 1d8 plus your level.\n\n**Partial Expert/Blood Priest**\n| Level | Hit Dice | Bonus Attack | Focus Picks |\n|---|---|---|---|\n| 1 | 1d6 | +0 | 1 Expert +1 Any |\n| 2 | 2d6 | +1 | +1 Any |\n| 3 | 3d6 | +1 |  |\n| 4 | 4d6 | +2 |  |\n| 5 | 5d6 | +2 | +1 Any |\n| 6 | 6d6 | +3 |  |\n| 7 | 7d6 | +3 | +1 Any |\n| 8 | 8d6 | +4 |  |\n| 9 | 9d6 | +4 |  |\n| 10 | 10d6 | +5 | +1 Any |\n\n**Partial Mage/Blood Priest**\n| Level | Hit Dice | Bonus Attack | Focus Picks |\n|---|---|---|---|\n| 1 | 1d6-1 | +0 | 1 Any |\n| 2 | 2d6-2 | +0 | +1 Any |\n| 3 | 3d6-3 | +0 |  |\n| 4 | 4d6-4 | +0 |  |\n| 5 | 5d6-5 | +1 | +1 Any |\n| 6 | 6d6-6 | +1 |  |\n| 7 | 7d6-7 | +1 | +1 Any |\n| 8 | 8d6-8 | +1 |  |\n| 9 | 9d6-9 | +1 |  |\n| 10 | 10d6-10 | +2 | +1 Any |\n\n**Partial Warrior/Blood Priest**\n| Level | Hit Dice | Bonus Attack | Focus Picks |\n|---|---|---|---|\n| 1 | 1d6+2 | +1 | 1 Warrior +1 Any |\n| 2 | 2d6+4 | +2 | +1 Any |\n| 3 | 3d6+6 | +2 |  |\n| 4 | 4d6+8 | +3 |  |\n| 5 | 5d6+10 | +4 | +1 Any |\n| 6 | 6d6+12 | +5 |  |\n| 7 | 7d6+14 | +5 | +1 Any |\n| 8 | 8d6+16 | +6 |  |\n| 9 | 9d6+18 | +6 |  |\n| 10 | 10d6+20 | +7 | +1 Any |\n\n| Level | Arts Gained Blood Priest Arts |\n|---|---|\n| 1 | Any Two |\n| 2 | Any One |\n| 3 |  |\n| 4 | Any One |\n| 5 | Any One |\n| 6 | Any One |\n| 7 |  |\n| 8 | Any One |\n| 9 |  |\n| 10 | Any One |","ru":"Усилие Жреца крови рассчитывается по Молитве: его полный максимум равен навыку Молитва плюс больший из модификаторов Мудрости или Харизмы, минимум один пункт.\n\nНа первом уровне Жрец крови может выбрать для освоения два из перечисленных ниже чудес и получает новые по мере роста уровней. Выбор чуда окончателен: поменять его позже нельзя. Чудесам не мешает ношение доспехов, для них не нужны жесты и свободная рука, хотя обычно частью действия должна быть произнесённая вслух молитва.\n\n**Божье наставление:** Задействуй Усилие до конца дня Основным действием и предайся размышлению над стоящим перед тобой выбором или возможным поступком. Мастер скажет тебе, что скорее всего принесёт этот выбор — благо, беду, смесь того и другого или ничего существенного, — по своему лучшему разумению. Это прозрение не видит вероятных исходов дальше, чем примерно на час вперёд.\n\n**Божья броня:** Задействуй Усилие Действием в свой ход. Пока Усилие остаётся задействованным, твой естественный Класс защиты равен 15 плюс половина уровня с округлением вниз. Этот КЗщ могут менять щиты и модификатор Ловкости, но не прочие носимые доспехи.\n\n**Гнев Всевышнего:** Задействуй Усилие до конца сцены Основным действием, обличая видимую цель. Когда до конца следующего раунда цель впервые получит урон, она понесёт автоматический дополнительный урон, равный 1d8 плюс твой уровень.\n\n**Изгнание ложной жизни:** Задействуй Усилие до конца дня Основным действием и сотвори знамение своего бога перед одной или несколькими видимыми целями в пределах шестидесяти футов. Брось 2d6 и прибавь уровень персонажа: столько костей здоровья нежити, автоматонов и прочих искусственных, внепланарных или противоестественных форм жизни должны пройти Ментальные спасброски, иначе съёжатся в страхе до конца сцены или до тех пор, пока их самих или их товарищей не атакуют. Съёжившиеся враги не предпринимают враждебных действий и могут обратиться в бегство, если не привязаны к своему месту. Эта сила не действует на врагов, у которых костей здоровья вдвое больше, чем у жреца крови уровней. Если выпавшей суммы костей здоровья не хватает, чтобы затронуть существо целиком, оно не затронуто вовсе.\n\n**Милосердное исцеление:** Задействуй Усилие до конца дня Основным действием и коснись цели на дистанции ближнего боя. Цель получает 1d6+2 пункта магического исцеления. Если это сделано в бою или чтобы поднять смертельно раненного, поспешность лечения добавляет цели 1 Системной нагрузки; вне боя Системная нагрузка не добавляется. На четвёртом уровне исцеление возрастает до 2d6+4, а на восьмом — до 4d6+8.\n\n**Не убоюсь огня:** Задействуй Усилие до конца дня Действием в свой ход, назначив видимую цель. До конца сцены она невосприимчива к урону от немагического пламени, дыма и взрывов, а любой такой магический урон по ней уменьшается на пять пунктов за каждый твой уровень Молитвы.\n\n**Освящённый оберег:** Задействуй Усилие Действием в свой ход. Пока Усилие поддерживается и пока ты не совершишь враждебного действия против какого-либо существа, ты невосприимчив к урону Шока и получаешь бонус +4 к Классу защиты и всем спасброскам. Чтобы нацелить на тебя атаки, враги должны каждый раунд проходить проверку Инстинкта; при провале они могут вместо этого предпринять какое-то другое действие. Закончившись, это Искусство не может быть включено вновь до конца сцены. Лечение и иная косвенная поддержка сражающихся товарищей враждебным действием не считаются.\n\n**Покарать нечестивых:** Задействуй Усилие до конца дня Действием в свой ход, когда атакуешь одну цель или предпринимаешь против неё какое-то наносящее урон действие. Ты получаешь бонус +4 к любой атаке, наносишь автоматический урон, равный уровню персонажа, и можешь бросать любые кости урона дважды, беря больший результат. Эту способность можно применить к данной цели лишь раз за сцену.\n\n**Пресуществление:** Задействуй Усилие до конца дня Основным действием, чтобы превратить до галлона любой жидкости в священную кровь. Глотка этой святой влаги довольно, чтобы день поддерживать выпившего без иной еды и питья, и он исцеляет 1d6 плюс навык Молитвы пользователя потерянных пунктов здоровья. Галлона крови хватает примерно на полдюжины человек. Благами этого Искусства можно пользоваться лишь раз в день, а невыпитая кровь улетучивается в течение минуты.\n\n**Свет веры:** Задействуй Усилие Действием в свой ход; пока оно остаётся задействованным, ты можешь испускать ясное яркое сияние, простирающееся до тридцати футов от тебя. По твоему усмотрению этот свет виден только тебе и твоим товарищам — числом до дюжины союзников.\n\n**Слова милосердия:** Задействуй Усилие до конца дня Мгновенным действием, чтобы перебросить любую провальную проверку социального навыка, связанную с сохранением мира, оказанием помощи или склонением к добродетельным делам сострадания, милосердия или правдивости. К одной и той же проверке навыка это Искусство можно применить лишь однажды.\n\n**Так хочет Бог:** Задействуй Усилие до конца дня Мгновенным действием и громко призови благословение своего бога на товарищей. До конца сцены до шести союзников за уровень персонажа в пределах слышимости получают эффективный Боевой дух 12 и бонус +1 к атакам и броскам урона, включая любой наносимый Шок. На пятом уровне бонус становится +2, а на десятом — +3.\n\n**Тысяча языков:** Задействуй Усилие Действием в свой ход; пока оно остаётся задействованным, ты можешь говорить с любым разумным существом, обладающим собственным языком, и понимать его. Любому слушателю будет казаться, что ты свободно говоришь на его родном языке, даже когда ты произносишь слова на своём. Это Искусство не позволяет читать и писать на незнакомых языках.\n\n**Искусства Жреца крови**\n\n| Уровень | Полученные Искусства |\n|---|---|\n| 1 | Любые два |\n| 2 | Любое одно |\n| 3 | – |\n| 4 | Любое одно |\n| 5 | Любое одно |\n| 6 | Любое одно |\n| 7 | – |\n| 8 | Любое одно |\n| 9 | – |\n| 10 | Любое одно |\n\n**Частичный Эксперт/Жрец крови**\n\n| Уровень | Кости здоровья | Бонус атаки | Выборы Фокусов |\n|---|---|---|---|\n| 1 | 1d6 | +0 | 1 Эксперта, +1 любой |\n| 2 | 2d6 | +1 | +1 любой |\n| 3 | 3d6 | +1 | – |\n| 4 | 4d6 | +2 | – |\n| 5 | 5d6 | +2 | +1 любой |\n| 6 | 6d6 | +3 | – |\n| 7 | 7d6 | +3 | +1 любой |\n| 8 | 8d6 | +4 | – |\n| 9 | 9d6 | +4 | – |\n| 10 | 10d6 | +5 | +1 любой |\n\n**Частичный Маг/Жрец крови**\n\n| Уровень | Кости здоровья | Бонус атаки | Выборы Фокусов |\n|---|---|---|---|\n| 1 | 1d6-1 | +0 | 1 любой |\n| 2 | 2d6-2 | +0 | +1 любой |\n| 3 | 3d6-3 | +0 | – |\n| 4 | 4d6-4 | +0 | – |\n| 5 | 5d6-5 | +1 | +1 любой |\n| 6 | 6d6-6 | +1 | – |\n| 7 | 7d6-7 | +1 | +1 любой |\n| 8 | 8d6-8 | +1 | – |\n| 9 | 9d6-9 | +1 | – |\n| 10 | 10d6-10 | +2 | +1 любой |\n\n**Частичный Воин/Жрец крови**\n\n| Уровень | Кости здоровья | Бонус атаки | Выборы Фокусов |\n|---|---|---|---|\n| 1 | 1d6+2 | +1 | 1 Воина, +1 любой |\n| 2 | 2d6+4 | +2 | +1 любой |\n| 3 | 3d6+6 | +2 | – |\n| 4 | 4d6+8 | +3 | – |\n| 5 | 5d6+10 | +4 | +1 любой |\n| 6 | 6d6+12 | +5 | – |\n| 7 | 7d6+14 | +5 | +1 любой |\n| 8 | 8d6+16 | +6 | – |\n| 9 | 9d6+18 | +6 | – |\n| 10 | 10d6+20 | +7 | +1 любой |"},{"n":"1.5.6","l":3,"te":"The Duelist","tr":"Дуэлянт","en":"Some warriors indulge in unique training methods that draw on arcane forces to enhance their speed and agility.\n#### Duelist Benefits\nThe Duelist is a partial Mage class, meant to be taken by an Adventurer in conjunction with another partial class. Partial Warrior/ Duelist is the most common pairing, for a skilled light-armor combatant with high mobility and a number of useful combat techniques. Partial Expert/Duelist might represent an assassin who relies on stealth as much as steel, while a rare few Mage/Duelist combinations speak of adventuring wizards who perhaps have more talent for the sword than for the spell.\nAll Duelists gain Stab as a bonus skill. No Duelist worth the name is entirely incapable of effective use of melee weapons, though the style lends itself heavily to specialization.\n#### The Flaw of Fragility\nWhile the canons of the duelist make for an excellent one-on-one combatant, their practitioners spend much less time at raw physical conditioning than their more traditional warrior peers. The techniques they use are swift and lethal, but they aren’t as generally applicable to enduring harm as are standard training methods.\nAs such, Partial Warriors/Partial Duelists use 1d6 for their hit dice, rather than the Partial Warrior’s usual 1d6+2. Other partial class mixes are unaffected by this flaw.","ru":"Некоторые воины прибегают к особым методам подготовки, черпая тайные силы для умножения своей скорости и ловкости.\n\n#### Преимущества Дуэлянта\n\nДуэлянт — частичный класс Мага, предназначенный для Авантюриста в сочетании с другим частичным классом. Частичный Воин/Дуэлянт — самое распространённое сочетание: умелый боец в лёгком доспехе, с высокой подвижностью и рядом полезных боевых приёмов. Частичный Эксперт/Дуэлянт может представлять убийцу, полагающегося на скрытность не меньше, чем на сталь, а редкие сочетания Маг/Дуэлянт говорят о волшебниках-искателях приключений, у которых, возможно, больше таланта к мечу, чем к заклинанию.\n\nВсе Дуэлянты получают Клинок как бонусный навык. Дуэлянт, достойный этого имени, не может совсем не уметь обращаться с оружием ближнего боя, хотя сам стиль сильно тяготеет к специализации.\n\n#### Изъян хрупкости\n\nХотя каноны дуэлянта делают из него превосходного бойца один на один, его приверженцы тратят куда меньше времени на грубую физическую закалку, чем их более традиционные собратья-воины. Их приёмы стремительны и смертоносны, но для стойкости к увечьям они не так полезны, как обычные методы подготовки.\n\nПоэтому частичные Воины/частичные Дуэлянты используют для костей здоровья 1d6 вместо обычных для частичного Воина 1d6+2. Другие сочетания частичных классов этот изъян не затрагивает."},{"n":"1.5.6.1","l":4,"te":"Duelist Arts","tr":"Искусства Дуэлянта","en":"Duelist Effort is based on Stab, and is equal to the PC’s Stab skill plus the highest of their Dexterity or Intelligence modifiers, to a minimum of one point. All Duelists begin with the Favored Weapon art and one more of their choice. Additional arts are learned as the PC advances in experience.\n\nThe arts of the Duelist require agility and free motion. The Duelist cannot benefit from any art of this class while wearing medium or heavy armor or carrying a large shield. Dual-wielding is practiced by some Duelists, but most prefer the defensive advantages of a small offhand shield.\n\n**Favored Weapon:** Choose one specific type of non-unarmed melee weapon. You begin play with such a weapon, and when using this type you may use the Favored Weapon attack bonus column on the Duelist table to determine your base hit bonus, unless it’s already better for some other reason. If your second partial class is Partial Warrior, your class’ base hit bonus with the weapon is instead equal to your level. You cannot apply this or other Duelist arts to thrown weapons.\n\n#### Other Duelist Arts\n\n**Blood for Blood:** Commit Effort for the scene as an Instant action when an enemy hits you with a physical attack. If you attack that enemy with your favored weapon before the end of the next round, the first blow hits automatically and can do no less damage than was done to you, up to the weapon’s maximum.\n\n**Burst of Speed:** Commit Effort for the day as an On Turn action. You may move your full normal movement rate as an On Turn action. This art can be used only once per round.\n\n**Code Duello:** Commit Effort for the day as an On Turn action when engaged with a single foe. So long as no other combatant attacks\n\neither your target or you, and you attack no one but your target, you gain a +4 bonus to your Armor Class and can roll your hit rolls twice, taking the better result. Once the Code Duello has been disrupted or ended, it cannot be invoked again during that scene.\n\n**Crushing Superiority:** Your favored weapon gains the Less Lethal quality if it doesn’t already have it. Commit Effort for the scene as an Instant action when you hit a target; they must immediately make an Instinct check. This ability can be used only once per scene on any given target.\n\n**Dauntless Step:** Commit Effort for the scene as an On Turn action. The Move actions you make for the rest of the round can cross vertical surfaces or difficult terrain at your full normal movement rate, provided you end the round standing upright on a surface that can bear your weight.\n\n**Dodge Doom:** Commit Effort for the day as an Instant action when caught in some explosion or other burst effect. You take half damage, or no damage if the effect allows a save and you succeed at it. You can move yourself up to ten feet away from your original location, provided the new location is behind cover or away from the blast’s point of origin.\n\n**Forced Engagement:** Commit Effort for the scene as an Instant action when making an attack with your favored weapon; you may ignore one foe’s Screen Ally action for that attack.\n\n**Gentleman’s Withdrawal:** Commit Effort for the scene as a Move action. As part of this, you may move at your full movement rate without being hindered by armed foes unless they completely block your path. You count as having made a Fighting Withdrawal against any enemies engaged with you at the time.\n\n**Graceful Leap:** Commit Effort for the scene as an On Turn action to immediately leap up to ten feet horizontally or vertically, counting it as a Fighting Withdrawal. You can’t use this art more than once per round or after you’ve attacked. You are immune to falling damage from plunges of less than 30 feet.\n\n**Lightning Draw:** Commit Effort for the day as an Instant action at the start of hostilities; you win initiative against anyone without a similar ability to act first and may ready a Stowed favored weapon Instantly.\n\n**Piercing Strike:** Commit Effort for the scene as an On Turn action and choose a visible target. For the rest of the scene, their AC is treated as 10 for purposes of resisting the Shock of your favored weapon.\n\n**Spiritual Weapon:** You are able to translate examples of your favored weapon into a spiritual template that you may manifest as you wish. Any favored weapon can be turned into such a template, including a magical weapon, but the process destroys the object’s physical form. To manifest a template, Commit Effort as an Instant action; a ghostly copy of the weapon appears Readied in hand for you until you release the Effort or stop touching the weapon. Dual-wielders can summon the same weapon into both hands with one use of this art.\n\n**Unbindable:** Commit Effort for the day as an On Turn action whenever you wish to escape chains, grapples, shackles, ropes, or even a magical spell of physical binding. You automatically wriggle free from mundane restraints and gain an Evasion saving throw to instantly end a physical magical binding of some sort. You can use this art only once per round.\n\n**Unworthy Rabble:** Commit Effort for the day as an On Turn action. For the rest of the scene, when using your favored weapon, reroll any failed hit roll against foes with one hit die. At eighth level, this ability applies to foes with two hit dice.\n\n**Whirling Evasion:** Your base Armor Class becomes equal to 13 plus half your level, rounded up. This AC can be modified by small shields and your Dexterity modifier, but not by armor or large shields.\n\n**Partial Expert/Duelist**\n| Level | Hit Dice | Bonus Attack | Focus Picks |\n|---|---|---|---|\n| 1 | 1d6 | +0 | 1 Expert +1 Any |\n| 2 | 2d6 | +1 | +1 Any |\n| 3 | 3d6 | +1 |  |\n| 4 | 4d6 | +2 |  |\n| 5 | 5d6 | +2 | +1 Any |\n| 6 | 6d6 | +3 |  |\n| 7 | 7d6 | +3 | +1 Any |\n| 8 | 8d6 | +4 |  |\n| 9 | 9d6 | +4 |  |\n| 10 | 10d6 | +5 | +1 Any |\n\n**Partial Mage/Duelist**\n| Level | Hit Dice | Bonus Attack | Focus Picks |\n|---|---|---|---|\n| 1 | 1d6-1 | +0 | 1 Any |\n| 2 | 2d6-2 | +0 | +1 Any |\n| 3 | 3d6-3 | +0 |  |\n| 4 | 4d6-4 | +0 |  |\n| 5 | 5d6-5 | +1 | +1 Any |\n| 6 | 6d6-6 | +1 |  |\n| 7 | 7d6-7 | +1 | +1 Any |\n| 8 | 8d6-8 | +1 |  |\n| 9 | 9d6-9 | +1 |  |\n| 10 | 10d6-10 | +2 | +1 Any |\n\n**Partial Warrior/Duelist**\n| Level | Hit Dice | Bonus Attack | Focus Picks |\n|---|---|---|---|\n| 1 | 1d6 | +1 | 1 Warrior +1 Any |\n| 2 | 2d6 | +2 | +1 Any |\n| 3 | 3d6 | +2 |  |\n| 4 | 4d6 | +3 |  |\n| 5 | 5d6 | +4 | +1 Any |\n| 6 | 6d6 | +5 |  |\n| 7 | 7d6 | +5 | +1 Any |\n| 8 | 8d6 | +6 |  |\n| 9 | 9d6 | +6 |  |\n| 10 | 10d6 | +7 | +1 Any |\n\n**Duelist Arts and Favored Weapon Bonus**\n| Level | Bonus Favored Weapon | Arts Gained |\n|---|---|---|\n| 1 | +1 | Favored Weapon and Any One |\n| 2 | +1 | Any One |\n| 3 | +2 |  |\n| 4 | +2 | Any One |\n| 5 | +3 | Any One |\n| 6 | +3 | Any One |\n| 7 | +4 |  |\n| 8 | +4 | Any One |\n| 9 | +5 |  |\n| 10 | +5 | Any One |","ru":"Усилие Дуэлянта основано на Клинке и равно навыку Клинок ПИ плюс больший из модификаторов Ловкости или Интеллекта, минимум один пункт. Все Дуэлянты начинают с Искусством «Излюбленное оружие» и ещё одним на свой выбор. Дальнейшие Искусства изучаются по мере роста опыта ПИ.\n\nИскусства Дуэлянта требуют ловкости и свободы движения. Дуэлянт не может пользоваться никаким Искусством этого класса, нося средний или тяжёлый доспех или большой щит. Некоторые Дуэлянты практикуют бой двумя оружиями, но большинство предпочитает защитные преимущества малого щита в свободной руке.\n\n**Излюбленное оружие:** Выбери один конкретный тип оружия ближнего боя, кроме безоружных атак. Ты начинаешь игру с таким оружием, и, используя оружие этого типа, можешь определять свой базовый бонус атаки по колонке бонуса Излюбленного оружия в таблице Дуэлянта — если только он уже не лучше по какой-то другой причине. Если твой второй частичный класс — частичный Воин, базовый классовый бонус атаки этим оружием вместо того равен твоему уровню. Ни это, ни другие Искусства Дуэлянта нельзя применять к метательному оружию.\n\n#### Другие Искусства Дуэлянта\n\n**Бестрепетный шаг:** Задействуй Усилие до конца сцены Действием в свой ход. До конца раунда твои Действия перемещения могут пролегать по отвесным поверхностям и труднопроходимой местности на полной обычной скорости — при условии, что закончишь раунд стоя на поверхности, способной выдержать твой вес.\n\n**Вихревое уклонение:** Твой базовый Класс защиты становится равен 13 плюс половина уровня с округлением вверх. Этот КЗщ могут менять малые щиты и модификатор Ловкости, но не доспехи и не большие щиты.\n\n**Джентльменский отход:** Задействуй Усилие до конца сцены Действием перемещения. В рамках него ты можешь идти на полной скорости перемещения, и вооружённые враги тебе не помеха, если только они полностью не преграждают путь. Ты считаешься совершившим Боевой отход от всех врагов, что бились с тобой в этот момент.\n\n**Дуэльный кодекс:** Задействуй Усилие до конца дня Действием в свой ход, когда бьёшься с единственным противником. Пока никто из других бойцов не атакует ни твою цель, ни тебя, а ты не атакуешь никого, кроме своей цели, ты получаешь бонус +4 к Классу защиты и можешь бросать атаки дважды, беря лучший результат. Однажды нарушенный или завершённый, Дуэльный кодекс нельзя призвать вновь в течение этой сцены.\n\n**Жалкий сброд:** Задействуй Усилие до конца дня Действием в свой ход. До конца сцены, используя излюбленное оружие, перебрасывай любую провальную атаку против врагов с одной костью здоровья. На восьмом уровне способность распространяется на врагов с двумя костями здоровья.\n\n**Изящный прыжок:** Задействуй Усилие до конца сцены Действием в свой ход, чтобы немедленно прыгнуть до десяти футов по горизонтали или вертикали; это считается Боевым отходом. Это Искусство нельзя применять больше раза в раунд или после того, как ты уже атаковал. Ты невосприимчив к урону от падения с высоты меньше 30 футов.\n\n**Кровь за кровь:** Задействуй Усилие до конца сцены Мгновенным действием, когда враг попадает по тебе физической атакой. Если до конца следующего раунда ты атакуешь этого врага излюбленным оружием, первый удар попадает автоматически и наносит не меньше урона, чем было нанесено тебе, — вплоть до максимума оружия.\n\n**Молниеносное выхватывание:** Задействуй Усилие до конца дня Мгновенным действием в начале схватки: ты выигрываешь инициативу у любого, кто не обладает подобной способностью действовать первым, и можешь Мгновенно привести в готовность излюбленное оружие из укладки.\n\n**Навязанный бой:** Задействуй Усилие до конца сцены Мгновенным действием при атаке излюбленным оружием; для этой атаки ты можешь игнорировать действие «Прикрыть союзника» одного из врагов.\n\n**Неудержимый:** Задействуй Усилие до конца дня Действием в свой ход, когда хочешь вырваться из цепей, захватов, кандалов, верёвок и даже магического заклинания физического связывания. Из обычных пут ты выскальзываешь автоматически, а против какого-либо физического магического связывания получаешь спасбросок Уклонения, чтобы мгновенно его прекратить. Это Искусство можно использовать лишь раз в раунд.\n\n**Оружие духа:** Ты умеешь обращать экземпляры своего излюбленного оружия в духовный шаблон и воплощать его по желанию. В такой шаблон можно обратить любое излюбленное оружие, в том числе магическое, но физическая форма предмета при этом уничтожается. Чтобы воплотить шаблон, задействуй Усилие Мгновенным действием: призрачная копия оружия появляется у тебя в руке в готовности и остаётся, пока ты не освободишь Усилие или не перестанешь касаться оружия. Сражающиеся двумя оружиями могут одним применением этого Искусства призвать то же оружие в обе руки.\n\n**Подавляющее превосходство:** Твоё излюбленное оружие получает качество «Щадящее», если ещё его не имеет. Задействуй Усилие до конца сцены Мгновенным действием, когда попадаешь по цели: она должна немедленно пройти проверку Инстинкта. Эту способность можно применить к данной цели лишь раз за сцену.\n\n**Порыв скорости:** Задействуй Усилие до конца дня Действием в свой ход. Ты можешь пройти свою полную обычную скорость перемещения Действием в свой ход. Это Искусство используется не чаще раза в раунд.\n\n**Пронзающий удар:** Задействуй Усилие до конца сцены Действием в свой ход и выбери видимую цель. До конца сцены её КЗщ считается равным 10 для целей сопротивления Шоку твоего излюбленного оружия.\n\n**Уход от гибели:** Задействуй Усилие до конца дня Мгновенным действием, когда тебя накрывает взрыв или иной объёмный эффект. Ты получаешь половину урона — или вовсе никакого, если эффект допускает спасбросок и ты его прошёл. Ты можешь переместиться до десяти футов от исходного места, если новое место находится за укрытием или дальше от точки, откуда пришёл взрыв.\n\n**Искусства Дуэлянта и бонус Излюбленного оружия**\n\n| Уровень | Бонус Излюбленного оружия | Полученные Искусства |\n|---|---|---|\n| 1 | +1 | Излюбленное оружие и любое одно |\n| 2 | +1 | Любое одно |\n| 3 | +2 | – |\n| 4 | +2 | Любое одно |\n| 5 | +3 | Любое одно |\n| 6 | +3 | Любое одно |\n| 7 | +4 | – |\n| 8 | +4 | Любое одно |\n| 9 | +5 | – |\n| 10 | +5 | Любое одно |\n\n**Частичный Эксперт/Дуэлянт**\n\n| Уровень | Кости здоровья | Бонус атаки | Выборы Фокусов |\n|---|---|---|---|\n| 1 | 1d6 | +0 | 1 Эксперта, +1 любой |\n| 2 | 2d6 | +1 | +1 любой |\n| 3 | 3d6 | +1 | – |\n| 4 | 4d6 | +2 | – |\n| 5 | 5d6 | +2 | +1 любой |\n| 6 | 6d6 | +3 | – |\n| 7 | 7d6 | +3 | +1 любой |\n| 8 | 8d6 | +4 | – |\n| 9 | 9d6 | +4 | – |\n| 10 | 10d6 | +5 | +1 любой |\n\n**Частичный Маг/Дуэлянт**\n\n| Уровень | Кости здоровья | Бонус атаки | Выборы Фокусов |\n|---|---|---|---|\n| 1 | 1d6-1 | +0 | 1 любой |\n| 2 | 2d6-2 | +0 | +1 любой |\n| 3 | 3d6-3 | +0 | – |\n| 4 | 4d6-4 | +0 | – |\n| 5 | 5d6-5 | +1 | +1 любой |\n| 6 | 6d6-6 | +1 | – |\n| 7 | 7d6-7 | +1 | +1 любой |\n| 8 | 8d6-8 | +1 | – |\n| 9 | 9d6-9 | +1 | – |\n| 10 | 10d6-10 | +2 | +1 любой |\n\n**Частичный Воин/Дуэлянт**\n\n| Уровень | Кости здоровья | Бонус атаки | Выборы Фокусов |\n|---|---|---|---|\n| 1 | 1d6 | +1 | 1 Воина, +1 любой |\n| 2 | 2d6 | +2 | +1 любой |\n| 3 | 3d6 | +2 | – |\n| 4 | 4d6 | +3 | – |\n| 5 | 5d6 | +4 | +1 любой |\n| 6 | 6d6 | +5 | – |\n| 7 | 7d6 | +5 | +1 любой |\n| 8 | 8d6 | +6 | – |\n| 9 | 9d6 | +6 | – |\n| 10 | 10d6 | +7 | +1 любой |"},{"n":"1.5.7","l":3,"te":"The Elementalist","tr":"Стихийник","en":"Elementalists are spellcasting Mages who focus on the manipulation of the material world around them. While they are capable of using High Magic, their specialist spells focus chiefly on wielding the classical elements of fire, air, water, and earth.\n#### Elementalist Benefits\nAll Elementalists gain Magic as a bonus skill, acquiring it at level-0, or level-1 if was already level-0.\nElementalists can prepare and cast High Magic spells in addition to the spells specific to Elementalists. As usual for spellcasters, Elementalists can’t cast spells or use arts while armored or holding a shield.\nElementalists are not as talented at general High Magic research as High Mages are, but their studies still bear fruit in time. Each time they advance a level, they can pick a new High Magic spell or an Elementalist spell to add to their spellbook. They must be able to cast the spell to add it to their selection.\nElementalists gain the Elemental Resilience and Elemental Sparks arts as part of their basic training, and may pick one additional art from the list below. Further arts are learned as they advance in character level, as given in the tables below. Once chosen, an art cannot be changed.","ru":"Стихийники — колдующие Маги, сосредоточенные на управлении окружающим материальным миром. Хотя им доступна Высшая магия, их специальные заклинания посвящены главным образом власти над классическими стихиями: огнём, воздухом, водой и землёй.\n\n#### Преимущества Стихийника\n\nВсе Стихийники получают Магию как бонусный навык: она приобретается на уровне-0 или на уровне-1, если уже была уровня-0.\n\nСтихийники могут готовить и читать заклинания Высшей магии вдобавок к собственным заклинаниям Стихийников. Как обычно у заклинателей, Стихийники не могут читать заклинания и применять Искусства, будучи в доспехах или со щитом в руке.\n\nСтихийники не так одарены в общих изысканиях Высшей магии, как Высшие маги, но со временем их занятия тоже приносят плоды. Каждый раз, поднимаясь на уровень, они могут выбрать новое заклинание Высшей магии или заклинание Стихийника и вписать его в свою книгу заклинаний. Добавить можно лишь то заклинание, которое они способны читать.\n\nСтихийники получают Искусства «Стихийная стойкость» и «Искры стихий» в рамках базовой подготовки и могут выбрать ещё одно Искусство из списка ниже. Дальнейшие Искусства изучаются с ростом уровня персонажа, как указано в таблицах ниже. Однажды выбранное Искусство поменять нельзя."},{"n":"1.5.7.1","l":4,"te":"Elementalist Arts","tr":"Искусства Стихийника","en":"Elementalist Effort is calculated as usual, with each PC’s maximum being equal to one plus their Magic skill level plus the better of their Intelligence or Charisma modifiers. Partial Elementalists have a score one point lower than this, albeit not less than one.\n\n**Elemental Resilience:** You are unharmed by mundane extremes of cold or by heat less than that of a furnace. You suffer only half damage from magical or extremely intense flame or frost attacks.\n\n**Elemental Sparks:** You can conjure petty amounts of flame, water, ice, stone, or wind, sufficient to do small tricks, chill drinks, light candles, or do other minor things. Conjured substances last no longer than a scene, and conjured water cannot lastingly quench thirst. This art cannot actually be useful in solving a problem or overcoming a challenge more than once per game session.\n\n#### Other Elementalist Arts\n\n**Beckoned Deluge:** Commit Effort for the scene as a Main Action to conjure a considerable amount of water at a visible point within fifty feet per caster level. This water is sufficient to drench one 10-foot cube of matter per character level, making non-magical bowstrings useless, extinguishing flames, and inflicting 1d6 damage per caster level on fiery supernatural creatures. This water persists indefinitely after its conjuration and is sufficient to hydrate ten people per caster level.\n\n**Earthsight:** Commit Effort for the scene as an On Turn action. For the rest of the scene, you can see the outlines of solid objects even in perfect darkness, and can peer through a number of feet of earth or stone equal to your character level.\n\n**Elemental Blast:** Commit Effort for the scene as a Main Action to hurl a blast of some elemental force at a visible target within fifty feet per character level. The attack is made with Magic as the combat skill, Int, Cha, or Dex as the attribute, and a bonus to hit equal to your character level. It is not hindered by melee foes. On a hit, the attack does 1d6 damage plus your character level and attribute\n\nmod. The blast may have collateral effects on objects in the case of hurled fire or a torrent of pressurized water, but any conjured matter vanishes at the end of the round.\n\n**Flamesight:** Commit Effort as an On Turn action. While the Effort remains Committed, you can see thermal gradients sufficient to distinguish surfaces and living creatures, even in perfect darkness. Optionally, you may cause your own eyes to cast a light sufficient to illuminate your surroundings clearly out to a range of 30 feet.\n\n**Pavis of Elements:** Commit Effort as an On Turn action to conjure an elemental barrier around yourself. The barrier improves your Armor Class by +4 and remains as long as the Effort remains Committed. This bonus stacks with other effects, but cannot increase AC above 18, regardless of the combinations.\n\n**Petrifying Stare:** Commit Effort for the day as a Main Action and target a visible creature. The creature must make a Physical save or become partially petrified, losing its Move action for a number of rounds equal to half your caster level, rounded up. Flying creatures are forced to land by this art and swimming creatures will inevitably sink to the bottom.\n\n**Rune of Destruction:** Commit Effort for the day as a Main Action and target an adjacent solid surface. A glowing rune the size of a handprint forms on the surface and persists for one hour per caster level. Any creature who gets within two feet of the rune will trigger it, causing it to explode in a five-foot radius with an elemental force of your choice and suffering 2d6 damage plus your caster level. Creatures already within five feet of the rune when it is laid will not trigger it until they re-enter the area, nor will the caster trigger their own runes. Runes cannot overlap their areas of effect.\n\n**Steps of Air:** Commit Effort for the scene as an On Turn action and target a visible ally; for one round per caster level, the target can fly at their usual movement rate. If the art ends while they are still in the air, they descend harmlessly to the ground. This art may also be used as an Instant action to negate falling damage for any single target.\n\n**Stunning Shock:** Commit Effort for the day as a Main Action and target a visible creature within fifty feet per caster level. The target creature must be wearing or holding at least a pound worth of conductive metal or be considerably dampened. An electrical bolt leaps from the caster to stun the target, causing them to lose their next Main Action. A Physical saving throw can mitigate the effect, causing the target to lose their Move action instead of their Main. A creature can be targeted only once per scene by this.\n\n**Thermal Shield:** Commit Effort for the scene as an Instant action to immediately negate one instance of fire or frost damage to any single visible ally or object. This defense lasts only long enough to nullify the single instance of damage.\n\n**Full Elementalist**\n| Level | Hit Dice | Attack Bonus | Focus Picks |\n|---|---|---|---|\n| 1 | 1d6-1 | +0 | 1 Any |\n| 2 | 2d6-2 | +0 | +1 Any |\n| 3 | 3d6-3 | +0 |  |\n| 4 | 4d6-4 | +0 |  |\n| 5 | 5d6-5 | +1 | +1 Any |\n| 6 | 6d6-6 | +1 |  |\n| 7 | 7d6-7 | +1 | +1 Any |\n| 8 | 8d6-8 | +1 |  |\n| 9 | 9d6-9 | +1 |  |\n| 10 | 10d6-10 | +2 | +1 Any |\n\n**Full Elementalist Arts and Spells**\n| Level | Max Level | Cast Spells | Spells Prepared | Arts Gained |\n|---|---|---|---|---|\n| 1 | 1 | 1 | 3 | Elemental Resilience, Elemental Sparks, and Any One |\n| 2 | 1 | 1 | 3 | Any One |\n| 3 | 2 | 2 | 4 |  |\n| 4 | 2 | 2 | 5 | Any One |\n| 5 | 3 | 3 | 6 |  |\n| 6 | 3 | 3 | 7 | Any One |\n| 7 | 4 | 4 | 8 |  |\n| 8 | 4 | 4 | 9 | Any One |\n| 9 | 5 | 5 | 10 |  |\n| 10 | 5 | 6 | 12 | Any One |\n\n**Partial Elementalist Arts and Spells**\n| Level | Max Level | Cast Spells | Spells Prepared | Arts Gained |\n|---|---|---|---|---|\n| 1 | 1 | 1 | 2 | Elemental Resilience, Elemental Sparks, and Any |\n| **One** |  |  |  |  |\n| 2 | 1 | 1 | 3 |  |\n| 3 | 1 | 1 | 3 | Any One |\n| 4 | 1 | 2 | 4 |  |\n| 5 | 2 | 2 | 5 |  |\n| 6 | 2 | 3 | 6 | Any One |\n| 7 | 2 | 3 | 7 |  |\n| 8 | 2 | 3 | 7 |  |\n| 9 | 3 | 4 | 8 | Any One |\n| 10 | 3 | 4 | 9 |  |\n\n**Partial Expert/Elementalist**\n| Level | Hit Dice | Bonus Attack | Focus Picks |\n|---|---|---|---|\n| 1 | 1d6 | +0 | 1 Expert +1 Any |\n| 2 | 2d6 | +1 | +1 Any |\n| 3 | 3d6 | +1 |  |\n| 4 | 4d6 | +2 |  |\n| 5 | 5d6 | +2 | +1 Any |\n| 6 | 6d6 | +3 |  |\n| 7 | 7d6 | +3 | +1 Any |\n| 8 | 8d6 | +4 |  |\n| 9 | 9d6 | +4 |  |\n| 10 | 10d6 | +5 | +1 Any |\n\n**Partial Other Mage/Elementalist**\n| Level | Hit Dice | Bonus Attack | Focus Picks |\n|---|---|---|---|\n| 1 | 1d6-1 | +0 | 1 Any |\n| 2 | 2d6-2 | +0 | +1 Any |\n| 3 | 3d6-3 | +0 |  |\n| 4 | 4d6-4 | +0 |  |\n| 5 | 5d6-5 | +1 | +1 Any |\n| 6 | 6d6-6 | +1 |  |\n| 7 | 7d6-7 | +1 | +1 Any |\n| 8 | 8d6-8 | +1 |  |\n| 9 | 9d6-9 | +1 |  |\n| 10 | 10d6-10 | +2 | +1 Any |\n\n**Partial Warrior/Elementalist**\n| Level | Hit Dice | Bonus Attack | Focus Picks |\n|---|---|---|---|\n| 1 | 1d6+2 | +1 | 1 Warrior +1 Any |\n| 2 | 2d6+4 | +2 | +1 Any |\n| 3 | 3d6+6 | +2 |  |\n| 4 | 4d6+8 | +3 |  |\n| 5 | 5d6+10 | +4 | +1 Any |\n| 6 | 6d6+12 | +5 |  |\n| 7 | 7d6+14 | +5 | +1 Any |\n| 8 | 8d6+16 | +6 |  |\n| 9 | 9d6+18 | +6 |  |\n| 10 | 10d6+20 | +7 | +1 Any |","ru":"Усилие Стихийника рассчитывается как обычно: максимум каждого ПИ равен единице плюс уровень навыка Магия плюс больший из модификаторов Интеллекта или Харизмы. У частичных Стихийников этот показатель на пункт ниже, хотя и не меньше единицы.\n\n**Стихийная стойкость:** Тебе не вредят обычные крайности холода и жар слабее печного. От магических или чрезвычайно сильных атак пламенем и морозом ты получаешь лишь половину урона.\n\n**Искры стихий:** Ты можешь наколдовать толику пламени, воды, льда, камня или ветра — довольно для мелких фокусов: остудить питьё, зажечь свечи и тому подобные пустяки. Наколдованные субстанции существуют не дольше сцены, а наколдованная вода не может утолить жажду надолго. Реальную пользу в решении проблемы или преодолении испытания это Искусство может принести не чаще раза за игровую сессию.\n\n#### Другие Искусства Стихийника\n\n**Взор земли:** Задействуй Усилие до конца сцены Действием в свой ход. До конца сцены ты видишь очертания твёрдых предметов даже в полной темноте и можешь смотреть сквозь толщу земли или камня на число футов, равное уровню персонажа.\n\n**Взор огня:** Задействуй Усилие Действием в свой ход. Пока Усилие остаётся задействованным, ты видишь тепловые градиенты, достаточные, чтобы различать поверхности и живых существ даже в полной темноте. По желанию ты можешь заставить собственные глаза испускать свет, ясно озаряющий всё вокруг в радиусе 30 футов.\n\n**Каменящий взгляд:** Задействуй Усилие до конца дня Основным действием и выбери видимое существо. Существо должно пройти Физический спасбросок, иначе частично окаменеет и потеряет Действие перемещения на число раундов, равное половине уровня колдующего с округлением вверх. Летающих существ это Искусство вынуждает сесть на землю, а плывущие неотвратимо идут ко дну.\n\n**Оглушающий разряд:** Задействуй Усилие до конца дня Основным действием и выбери видимое существо в пределах пятидесяти футов за уровень колдующего. Цель должна носить на себе или держать не меньше фунта проводящего металла либо быть изрядно мокрой. С колдующего срывается электрический разряд, оглушая цель: она теряет своё следующее Основное действие. Физический спасбросок смягчает эффект — цель теряет Действие перемещения вместо Основного. Одно существо может стать целью этого Искусства не чаще раза за сцену.\n\n**Павис стихий:** Задействуй Усилие Действием в свой ход, чтобы наколдовать стихийный барьер вокруг себя. Барьер улучшает твой Класс защиты на +4 и держится, пока Усилие остаётся задействованным. Этот бонус складывается с другими эффектами, но не может поднять КЗщ выше 18, каковы бы ни были сочетания.\n\n**Призванный ливень:** Задействуй Усилие до конца сцены Основным действием, чтобы наколдовать изрядное количество воды в видимой точке в пределах пятидесяти футов за уровень колдующего. Этой воды хватает, чтобы промочить один 10-футовый куб материи за уровень персонажа: немагические тетивы приходят в негодность, пламя гаснет, а огненные сверхъестественные существа получают 1d6 урона за уровень колдующего. Сотворённая вода остаётся насовсем, и её довольно, чтобы напоить десять человек за уровень колдующего.\n\n**Руна разрушения:** Задействуй Усилие до конца дня Основным действием и выбери прилегающую твёрдую поверхность. На ней проступает светящаяся руна размером с отпечаток ладони, сохраняющаяся один час за уровень колдующего. Любое существо, оказавшееся в двух футах от руны, приводит её в действие: руна взрывается в пятифутовом радиусе избранной тобой стихийной силой, а существо получает 2d6 урона плюс уровень колдующего. Существа, уже находившиеся в пяти футах от руны при её наложении, не приводят её в действие, пока не войдут в область заново; собственные руны на колдующего тоже не срабатывают. Области действия рун не могут перекрываться.\n\n**Стихийный удар:** Задействуй Усилие до конца сцены Основным действием, чтобы метнуть заряд некой стихийной силы в видимую цель в пределах пятидесяти футов за уровень персонажа. Атака совершается с Магией в роли боевого навыка, с Инт, Хар или Лов в роли характеристики и с бонусом к попаданию, равным уровню персонажа. Ей не мешают враги в ближнем бою. При попадании атака наносит 1d6 урона плюс уровень персонажа и модификатор характеристики. У метнутого огня или струи воды под напором могут быть побочные последствия для предметов, но любая наколдованная материя исчезает в конце раунда.\n\n**Тепловой щит:** Задействуй Усилие до конца сцены Мгновенным действием, чтобы немедленно отменить один случай урона от огня или мороза любому одиночному видимому союзнику или предмету. Эта защита длится ровно столько, чтобы свести на нет этот единственный случай урона.\n\n**Шаги по воздуху:** Задействуй Усилие до конца сцены Действием в свой ход и выбери видимого союзника: в течение одного раунда за уровень колдующего цель может летать со своей обычной скоростью перемещения. Если Искусство закончится, пока она ещё в воздухе, она безвредно опустится на землю. Это Искусство можно применить и Мгновенным действием, чтобы отменить урон от падения любой одиночной цели.\n\n**Полный Стихийник**\n\n| Уровень | Кости здоровья | Бонус атаки | Выборы Фокусов |\n|---|---|---|---|\n| 1 | 1d6-1 | +0 | 1 любой |\n| 2 | 2d6-2 | +0 | +1 любой |\n| 3 | 3d6-3 | +0 | – |\n| 4 | 4d6-4 | +0 | – |\n| 5 | 5d6-5 | +1 | +1 любой |\n| 6 | 6d6-6 | +1 | – |\n| 7 | 7d6-7 | +1 | +1 любой |\n| 8 | 8d6-8 | +1 | – |\n| 9 | 9d6-9 | +1 | – |\n| 10 | 10d6-10 | +2 | +1 любой |\n\n**Искусства и заклинания полного Стихийника**\n\n| Уровень | Макс. уровень заклинаний | Заклинаний в день | Подготовлено заклинаний | Полученные Искусства |\n|---|---|---|---|---|\n| 1 | 1 | 1 | 3 | Стихийная стойкость, Искры стихий и любое одно |\n| 2 | 1 | 1 | 3 | Любое одно |\n| 3 | 2 | 2 | 4 | – |\n| 4 | 2 | 2 | 5 | Любое одно |\n| 5 | 3 | 3 | 6 | – |\n| 6 | 3 | 3 | 7 | Любое одно |\n| 7 | 4 | 4 | 8 | – |\n|
