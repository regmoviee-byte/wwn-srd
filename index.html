дели случайное направление по циферблату часов. Это Искусство можно применять раз в день.\n\n**Принудить к правде:** Гадатель заставляет человека выпить особый отвар, пройти определённый обряд или иначе выдержать испытание длиной в сцену. После этого гадатель может задать цели один вопрос, а Мастер втайне бросает проверку Хар/Магия против сложности, равной боевому духу цели +1, либо уровню +6 для ПИ. При успехе испытуемый обязан ответить на вопрос правдиво и полно. При провале он может дать любой ответ, какой пожелает. Один и тот же — или по сути тот же — вопрос нельзя задать этим Искусством дважды.\n\n**Читать знамения:** Проситель излагает ПИ задуманное дело. После обряда длиной в сцену, требующего скота или жертвенных материалов не меньше чем на 10 см, Мастер втайне делает проверку Мдр/Магия против сложности 10. При успехе ПИ чувствует, приведёт ли замысел к успеху или к провалу — как это кажется наиболее вероятным Мастеру. При провале Мастер выдаёт случайный ответ. Умножение расходов на обряд в 10 раз даёт +1 к проверке: так, жертва скотом на 1000 см даёт +2 к проверке. Об одном и том же замысле нельзя гадать чаще раза в месяц.\n\n##### Порчи и благословения\n\nДаровать удачу или навести злую судьбу — дело нешуточное. Одно и то же существо можно проклясть или благословить этими Искусствами лишь раз в день.\n\n**Благоприятное начинание:** Основным действием благослови конкретный план или начинание, к которому цель стремится сейчас. Во время исполнения плана или на пути к желанной цели благословлённый может перебросить одну провальную проверку навыка или один промахнувшийся бросок атаки. Благословение держится, пока не будет использовано, пока план не завершится или пока не пройдёт по одному дню за уровень колдующего. Одновременно может быть благословлён только один план.\n\n**Благословение удачи:** Основным действием даруй благословение видимой цели. Её следующая проверка навыка в этот день получит бонус +1. На одном существе может действовать лишь одно благословение удачи за раз.\n\n**Дурной глаз:** Это Искусство усиливает твои порчи и благословения. Теперь ты можешь применять эти Искусства Мгновенным действием — хотя по-прежнему не больше одного такого Искусства за раунд — и тебе достаточно лишь взглянуть на цель, не произнося вслух никакого проклятия или благословения.\n\n**Злая доля:** Основным действием наведи порчу на видимую цель. Можно назвать определённый род начинаний или распространить порчу на всё, что цель будет делать. Следующая подходящая проверка навыка, которую она делает, идёт со штрафом -1. Если чистый бросок костей окажется равен навыку Магия этого ПИ плюс один или меньше, затея кончается сокрушительным провалом. Порча держится до следующей подходящей проверки навыка.\n\n**Ратная порча:** Основным действием прокляни видимого врага. До конца сцены он получает штраф -2 к броскам атаки, броскам урона и урону Шока. Если он промахивается атакой, а чистый бросок атаки меньше навыка Магия Ведуна, он случайно ранит сам себя, нанося себе обычный урон. Одновременно может действовать лишь одна ратная порча."},{"n":"1.6.0","l":2,"te":"Foci","tr":"Фокусы","en":"Foci are special talents that a PC can possess. They aren’t as powerful \nas Edges, but a PC will develop more of them over time. Any PC can \nselect any Focus, barring a few with specific requirements; they do not \nneed to fit the class they selected. So long as the player can explain \nhow or why they acquired the talent they can have it.\nFoci usually come in two levels, though some have only one. The \nfirst time a Focus is chosen, the benefits of the first level are gained. \nThe second time it’s chosen, the benefits of the second level are added \nto those of the first.\nA new character may choose one Focus of any kind. Warriors \nand Partial Warriors may select another combat-related Focus, and \nExperts and Partial Experts may select another non-combat-related \nFocus. If a Focus is ambiguous, the GM decides whether or not it falls \ninto a particular category for the PC.","ru":"Фокусы — это особые таланты, которыми может обладать ПИ. Они не так сильны, как Козыри, но со временем ПИ наберёт их больше. Любой ПИ может выбрать любой Фокус, за вычетом немногих с особыми требованиями; подходить выбранному классу Фокусы не обязаны. Пока игрок может объяснить, как и почему персонаж приобрёл талант, он вправе его взять.\n\nОбычно у Фокуса два уровня, хотя у некоторых только один. Когда Фокус выбран впервые, ты получаешь преимущества первого уровня. При втором выборе преимущества второго уровня добавляются к преимуществам первого.\n\nНовый персонаж может выбрать один Фокус любого рода. Воины и частичные Воины могут выбрать ещё один боевой Фокус, а Эксперты и частичные Эксперты — ещё один небоевой. Если Фокус двусмыслен, Мастер решает, попадает ли он для этого ПИ в нужную категорию."},{"n":"1.6.1","l":3,"te":"Focus List","tr":"Список Фокусов","en":"The Foci below are common to most fantasy settings. Others might \nbe added to support particular campaigns.\nAlert\nYou are keenly aware of your surroundings and virtually impossible \nto take unaware.\nLevel 1: Gain Notice as a bonus skill. You cannot be surprised, nor \ncan others use the Execution Attack option on you. If the GM rolls \ninitiative by sides, you can add a +1 bonus to your side’s initiative roll, \nthough multiple Alert PCs don’t stack this bonus. If you roll initiative \nindividually, you can roll it twice and take the better result.\nLevel 2: You always act first in a combat round unless someone else \ninvolved is also this Alert.\nArmored Magic\nUsable only by Mage heroes who would otherwise be prevented \nfrom casting spells or using arts while armored, this Focus reflects \nspecial training in channeling magic through the hindering materials \nof conventional armor.\nLevel 1: You can cast spells or use arts while wearing armor that has \nan Encumbrance value of no more than two. You can use a shield \nwhile casting, provided your other hand is empty for gesturing.\nLevel 2: You can cast spells while wearing armor of any Encum-\nbrance. You’ve also learned to cast spells while both your hands are \nfull, though not bound.\nArmsmaster\nYou have an unusual competence with thrown weapons and melee \nattacks. This Focus’ benefits do not apply to unarmed attacks or non-\nthrown projectile weapons. This Focus’ bonuses also don’t stack with \nDeadeye or other Foci that add a skill’s level to your damage or \nShock.\nLevel 1: Gain Stab as a bonus skill. You can Ready a Stowed melee \nor thrown weapon as an Instant action. You may add your Stab skill \nlevel to a melee or thrown weapon’s damage roll or Shock damage, \nassuming it has any to begin with.\nLevel 2: The Shock from your melee attacks always treats the target \nas if they have AC 10. Gain a +1 bonus to hit with all thrown or \nmelee attacks.\nArtisan\nYou have remarkable gifts as a crafter and can often improvise tech-\nniques even in fields unrelated to your usual background. You are \nable to create mods for equipment even if you are not an Expert.\nLevel 1: Gain Craft as a bonus skill. Your Craft skill is treated as one \nlevel higher, up to a maximum of 5, for purposes of crafting and \nmaintaining mods. Mods you build require one fewer unit of arcane \nsalvage, down to a minimum of one. Your Craft skill is applicable to \nany normal crafting profession’s work, allowing you to fashion their \nwares without penalty.\nLevel 2: The first mod you add to an item requires no Maintenance \nand only half the silver piece cost usually required. This benefit is in \naddition to the benefits of installing a mod in masterwork gear you \nbuild. You automatically succeed at any attempt to build masterwork \ngear, and once per month you can reduce a created mod’s salvage \ncost by one further unit, down to a minimum of zero.\nAssassin\nYou are practiced at sudden murder, and have certain advantages \nin carrying out an Execution Attack. \nLevel 1: Gain Sneak as a bonus skill. You can conceal an object no \nlarger than a knife from anything less invasive than a strip search. \nYou can draw or produce this object as an On Turn action, and your \npoint-blank thrown or melee attacks made during a surprise round \nwith it cannot miss the target.\nLevel 2: You can take a Move action on the same round as you \nmake an Execution Attack, closing rapidly with a target before you \nattack. You may split this Move action when making an Execution \nAttack, taking part of it before you murder your target and part of it \nafterwards. This movement happens too quickly to alert a victim or \nto be hindered by bodyguards.\nAuthority\nYou have an uncanny kind of charisma about you, one that makes \nothers instinctively follow your instructions and further your causes. \nAt level 1, this is a knack of charm and personal magnetism, while \nlevel 2 might suggest latent magical powers or an ancient bloodline \nof sorcerous rule. Where this Focus refers to followers, it means NPCs \nwho have voluntarily chosen to be in your service. PCs never count \nas followers.\nLevel 1: Gain Lead as a bonus skill. Once per day, you can make \na request from an NPC who is not openly hostile to you, rolling a \nCha/Lead skill check at a difficulty of the NPC’s Morale score. If \nyou succeed, they will comply with the request, provided it is not \nsignificantly harmful or extremely uncharacteristic.\nLevel 2: Those who follow you are fired with confidence. Any NPC \nbeing directly led by you gains a Morale and hit roll bonus equal \nto your Lead skill and a +1 bonus on all skill checks. Your followers \nand henchmen will not act against your interests unless under extreme \npressure.\nClose Combatant\nYou’ve had all too much practice at close-in fighting and desperate \nstruggles with drawn blades. You’re extremely skilled at avoiding \ninjury in melee combat, and at level 2 you can dodge through a \nmelee scrum without fear of being knifed in passing.\nLevel 1: Gain any combat skill as a bonus skill. You can use knife-\nsized thrown weapons in melee without suffering penalties for the \nproximity of melee attackers. You ignore Shock damage from melee \nassailants, even if you’re unarmored at the time, but invoking this \nbenefit disrupts any spellcasting you might do that round due to the \nneed for violently active evasion.\nLevel 2: The Shock damage from your melee attacks treats all targets \nas if they were AC 10. The Fighting Withdrawal combat action is \ntreated as an On Turn action for you and can be performed freely.\nConnected\nYou’re remarkably gifted at making friends and forging ties with the \npeople around you. Wherever you go, you always seem to know \nsomebody useful to your ends.\nLevel 1: Gain Connect as a bonus skill. If you’ve spent at least a week \nin a not-entirely-hostile location, you’ll have built a web of contacts \nwilling to do favors for you that are no more than mildly illegal. You \ncan call on one favor per game day and the GM decides how far \nthey’ll go for you.\nLevel 2: Once per game session, if it’s not entirely implausible, you \nmeet someone you know who is willing to do modest favors for you. \nYou can decide when and where you want to meet this person, but \nthe GM decides who they are and what they can do for you.\nCultured\nThrough wide travel, careful observation, or extensive study, you’ve \nobtained a wide experience of the cultures of your region and an abil-\nity to navigate their customs, laws, and languages. You know what to \ndo and say to impress others with the reasonableness of your wishes.\nLevel 1: Gain Connect as a bonus skill. You can fluently speak all the \ncommon languages of your native region and convey at least basic \ninformation in the uncommon or esoteric ones. You can learn a new \nlanguage with only a week’s practice with a native speaker. Once \nper game day, your polished ways automatically gain a minor favor \nfrom an NPC that would not put them to significant expense or risk, \nassuming the NPC isn’t hostile to you.\nLevel 2: Once per game session, reroll a failed social skill check as \nyou use your cultural knowledge to push your interlocutor toward \nthe desired result.\nDie Hard\t\nYou are surprisingly hard to kill. You can survive injuries or bear up \nunder stresses that would incapacitate a less determined hero.\nLevel 1: You gain an extra 2 maximum hit points per level. This bonus \napplies retroactively if you take this Focus after first level. You auto-\nmatically stabilize if Mortally Wounded, provided you have not been \nincinerated, dismembered, or otherwise torn apart.\nLevel 2: The first time each day that you are reduced to zero hit \npoints by an injury, you instead survive with one hit point remaining. \nThis ability can’t save you from large-scale, instantly-lethal trauma.\nDeadeye\nYou have a gift with ranged weapons. While this talent most common-\nly applies to bows, it is also applicable to thrown weapons or other \nranged weapons that can be used with the Shoot skill. For thrown \nweapons, you can’t use the benefits of the Armsmaster Focus at the \nsame time as Deadeye.\nLevel 1: Gain Shoot as a bonus skill. You can Ready a Stowed ranged \nweapon as an Instant action. You may use a bow or two-handed \nranged weapon even when an enemy is within melee range, albeit \nat a -4 hit penalty. You may add your Shoot skill level to a ranged \nweapon’s damage roll.\nLevel 2: You can reload crossbows or other slow-loading weapons \nas an On Turn action, provided they don’t take more than a round to \nreload. You can use ranged weapons of any size in melee without \npenalty. Once per scene, as an On Turn action when target shooting \nat an inanimate, non-creature target, you automatically hit unless you \nroll a 2 on your Shoot skill check or the shot is physically impossible.\nDealmaker\nYou have an uncanny ability to sniff out traders and find good deals, \nlicit or otherwise. Even those who might not normally be disposed \nto bargain with you can sometimes be persuaded to pause and \nnegotiate, if you have something they want.\nLevel 1: Gain Trade as a bonus skill. With a half hour of effort you \ncan find a buyer or seller for any good or service that can be traded \nin the community, legal or otherwise. Finding a marginally possible \nservice, like an assassin willing and able to target a king, or some \nspecific precious ancient artifact, may require an adventure if the \nGM allows it at all.\nLevel 2: Once per session, target a sentient who is not just then trying \nto kill you or your allies and make a request of it that it can compre-\nhend. If it’s at all plausible for it to make such terms, it will do so for a \nprice or favor it thinks you can grant, though the price for significant \nfavors might be dear.\nDeveloped Attribute\nYour hero has a remarkable degree of development to one or more \nof their attributes. This may be derived from an eldritch bloodline, \nnative brilliance, or sheer, stubborn determination. This Focus cannot \nbe taken by heroes with the Mage or Partial Mage classes.\nLevel 1: Choose an attribute; its modifier is increased by +1, up to a \nmaximum of +3. The actual score does not change, but the modifier \nincreases, and may increase again if later advancement improves \nthe attribute enough. You can choose this Focus more than once to \nimprove different attributes.\nDiplomatic Grace\nYour skill at personal negotiations is enormous and uncanny. Some \nmight even think it supernatural in nature.\nLevel 1: Gain Convince as a bonus skill. You speak all the languages \ncommon to your region of the world and can learn new ones to a \nworkable level in a week, becoming fluent in a month. Reroll 1s on \nany skill check dice related to negotiation or diplomacy.\nLevel 2: Once per day, silently consecrate a bargain; the target must \nmake a Mental save to break the deal unless their life or something \nthey love as much is imperiled by it. Most NPCs won’t even try to \nbreak it. The deal must be for something specific and time-limited, \nand not an open-ended bargain.\nGifted Chirurgeon\nYou have an unusual gift for saving Mortally Wounded allies and \nquickening the natural recovery of the wounded in your care.\nLevel 1: Gain Heal as a bonus skill. You may attempt to stabilize \none Mortally Wounded adjacent person per round as an On Turn \naction. When rolling Heal skill checks, roll 3d6 and drop the lowest \ndie. You heal twice as many hit points as usual when applying first \naid after a battle.\nLevel 2: Your curative gifts count as magical healing. You can heal \n1d6+Heal skill in damage to an adjacent wounded ally as a Main \nAction, potentially reviving them without any lingering Frailty. Each \nsuch application of healing adds 1 System Strain to the target, and the \ngift cannot be used on targets already at their maximum System Strain.\nHenchkeeper\nYou have a distinct knack for picking up lost souls who willingly do \nyour bidding. You might induce them with promises of money, pow-\ner, excitement, sex, or some other prize that you may or may not \neventually grant. A henchman obtained with this Focus will serve \nin loyal fashion until clearly betrayed or placed in unacceptable \ndanger. Henchmen are not “important” people in their society, and \nare usually marginal sorts, outcasts, the desperate, or other persons \nwith few options.\nYou can use more conventional pay or inducements to acquire \nadditional henchmen, but these extra hirelings are no more loyal or \ncompetent than your pay and treatment can purchase.\nLevel 1: Gain Lead as a bonus skill. You can acquire henchmen within \n24 hours of arriving in a community, assuming anyone is suitable \nhench material. These henchmen will not fight except to save their \nown lives, but will escort you on adventures and risk great danger to \nhelp you. Most henchmen will have the combat statistics of a normal \nadult from their culture. You can have one henchmen at a time for \nevery three character levels you have, rounded up. You can release \nhenchmen with no hard feelings at any plausible time and pick them \nback up later should you be without a current henchman.\nLevel 2: Your henchmen are remarkably loyal and determined, and \nwill fight for you against anything but clearly overwhelming odds. \nWhether through natural competence or their devotion to you, they’re \ntreated as 2 HD combatants from their culture. You can make faithful \nhenchmen out of skilled and highly-capable NPCs, but this requires \nthat you actually have done them some favor or help that would \nreasonably earn such fierce loyalty.\nImpervious Defense\nWhether through uncanny reflexes, remarkable luck, supernatural \nheritage, or magical talent, you have natural defenses equivalent to \nhigh-quality armor. The benefits of this Focus don’t stack with armor, \nthough Dexterity or shield modifiers apply.\nLevel 1: You have an innate Armor Class of 15 plus half your char-\nacter level, rounded up.\nLevel 2: Once per day, as an Instant action, you can shrug off any \nsingle weapon attack or physical trauma inflicted by a foe. Envi-\nronmental damage, falling damage, or other harm that couldn’t be \nforfended by strong armor cannot be resisted this way.\nImpostor\nYou are exceedingly skilled at presenting yourself as something you \nare not, including disguises, voice mimicry, and lightning-fast ward-\nrobe changes. Some impostors rely on the acting skills of Perform, \nwhile others lean more to the nefarious tricks of Sneak.\nLevel 1: Gain Perform or Sneak as a bonus skill. Once per scene, \nreroll any failed skill check or saving throw related to maintaining an \nimposture or disguise. Create one false identity of no great social im-\nportance; you can flawlessly pretend to be that person, such that only \nextremely persuasive proof can connect you with it. You can change \nthis identity with a week’s worth of effort in building a new one.\nLevel 2: You can alter your clothing and armor such that a single \nMain Action lets you swap between any of three chosen appear-\nances. In addition to your original false identity, you can establish \na new false identity in each city or significant community you spend \nat least a day in.\nLucky\nSome fund of remarkable luck has preserved your life at least once \nin the past, and continues to give you an edge in otherwise hopeless \nsituations. This luck does not favor the already-blessed; this Focus can \nonly be taken by a PC with at least one attribute modifier of -1 or less.\nLevel 1: Once per week, a blow or effect that would otherwise have \nleft you killed, mortally wounded, or rendered helpless somehow \nfails to connect or affect you. You make any rolls related to games \nof chance twice, taking the better roll.\nLevel 2: Once per session, in a situation of need or peril, you can \ntrust to your luck and roll 1d6. On a 2 or more, something fortunate \nwill happen to further your goal, provide an escape from immediate \nperil, or otherwise give you an advantage you need, if not immediate \nvictory. On a 1, the situation will immediately grow much worse, as \nthe GM sees fit.\nNullifier\nSomething about your hero interferes with easy use of magic on them. \nIt may be a strangely powerful birth blessing, a particular supernat-\nural bloodline, or simple occult incompatibility. This Focus cannot be \ntaken by Mages or Partial Mages.\nLevel 1: You and all allies within twenty feet gain a +2 bonus to all \nsaving throws against magical effects. As an On Turn action, you can \nfeel the presence or use of magic within twenty feet of you, though \nyou can’t discern details about it or the specific source. The first failed \nsaving throw against a magical effect you suffer in a day is turned \ninto a success.\nLevel 2: Once per day, as an Instant action, you are simply not \naffected by an unwanted magical effect or supernatural monstrous \nability, even if it wouldn’t normally allow a saving throw. Immunity \nto a persistent effect lasts for the rest of the scene.\nPoisoner\nYou are a skilled poisoner, capable of compounding toxins out of \nreadily-available flora and minerals. It takes an hour to brew a poi-\nson, and you can keep as many doses fresh as you have levels. Blade \nvenoms take a Main Action to apply and last for ten minutes or until \na hit or Shock is inflicted, whichever comes first. Detecting poisoned \nfood is a Wis/Notice skill check against 10, or 12 if the diner’s not a \nnoble or otherwise normally wary of poison. One dose can poison \nup to a half-dozen diners.\nLevel 1: Gain Heal as a bonus skill. Gain a reroll on any failed saving \nthrow versus poison. Your toxins inflict 2d6 damage plus your level \non a hit or Shock, with a Physical save for half. Your incapacitating \nor hallucinogenic toxins do the same, but those reduced to zero hit \npoints are simply incapacitated for an hour.\nLevel 2: You are immune to poison and can apply a universal antidote \nto any poisoned ally as a Main Action. Any attempt to detect or save\nagainst your poisons takes a penalty equal to your Heal skill. Your \ningested poisons count as an Execution Attack against unsuspecting \ntargets, with Heal used for the Physical saving throw penalty and \n1d6 damage per level done on a success. Such poisons can be \nnon-lethal at your discretion.\nPolymath\nYou have a passing acquaintance with a vast variety of practical skills \nand pastimes, and can make a modest attempt at almost any exercise \nof skill or artisanry. Note that the phantom skill levels granted by \nthis Focus don’t stack with normal skill levels or give a skill purchase \ndiscount. Only Experts or Partial Experts can take this Focus.\nLevel 1: Gain any one bonus skill. You treat all non-combat skills as \nif they were at least level-0 for purposes of skill checks, even if you \nlack them entirely.\nLevel 2: You treat all non-combat skills as if they were at least level-1 \nfor purposes of skill checks.\nRider\nAnyone with any level of Ride skill can fight competently on horseback \nor keep their mount healthy. You have an almost supernatural bond \nwith your steeds, however, and can push them beyond normal limits.\nLevel 1: Gain Ride as a bonus skill. Your steeds all count as Morale \n12 in battle, use your AC if it’s higher than theirs, and can travel \n50% further in a day than normal for their kind. You can intuitively \ncommunicate with riding beasts, gaining as much information from it \nas its intellect can convey.\nLevel 2: Once per scene, negate a successful attack against your \nsteed as an Instant action. Once per scene, reroll any failed Ride \nskill check. You can telepathically send and receive simple warnings, \nthoughts, and commands to and from your steed so long as it’s within \ntwo hundred feet. You can so bond with one steed at a time, taking \nan hour to do so.\nShocking Assault\nYou’re extremely dangerous to enemies around you. The ferocity of \nyour melee attacks stresses and distracts enemies even when your \nblows don’t draw blood.\nLevel 1: Gain Punch or Stab as a bonus skill. The Shock damage of \nyour weapon treats all targets as if they were AC 10, assuming your \nweapon is capable of harming the target in the first place and the \ntarget is not immune to Shock.\nLevel 2: In addition, you gain a +2 bonus to the Shock damage rating \nof all melee weapons and unarmed attacks that do Shock. As usual, \nregular hits never do less damage than this Shock would do on a miss.\nSniper’s Eye\nYou are an expert at placing a thrown knife or arrow on an unsus-\npecting target. These special benefits only apply when making an \nExecution Attack with a bow, hurlant, or thrown weapon.\nLevel 1: Gain Shoot as a bonus skill. When making a skill check for \na ranged Execution Attack or target shooting, roll 3d6 and drop the \nlowest die.\nLevel 2: You don’t miss ranged Execution Attacks. A target hit by one \ntakes a -4 penalty on the Physical saving throw to avoid immediate \nmortal injury. Even if the save is successful, the target takes double \nthe normal damage inflicted by the attack.\n•\t\nIt has hit points equal to three times your level\n•\t\nIt gains the ability to attack with a hit bonus equal to half \nyour level, rounded up, doing 1d8 damage on a hit with no \nShock\n•\t\nIt gains a +1 skill check bonus and can apply it to a range \nof situations equivalent to one normal human background\n•\t\nIt gains another shape of your choice which it can adopt \nor discard as an On Turn action\n•\t\nIt can hover or fly at its usual movement rate\n•\t\nIt can communicate freely with others in any language you \nknow\nSpecial Origin\nHeroes in this game are assumed to be human, or close enough as to \nmake no real difference. PCs who want to belong to some more exotic \nspecies or demihuman kind can pick the origin Focus appropriate to \ntheir chosen species, such as those given in the bestiary chapter for \ndifferent types of creatures.\nThe availability of these special origins will depend on the cam-\npaign and the GM’s permission. Even if elves and dwarves do exist \nin the campaign world, the GM is not obliged to let players use them \nas PCs if that choice doesn’t fit the tone or location being used.\nNote also that a PC who just wants to be different without asking \nfor any special mechanical benefits does not need to buy any special \nFocus. If their particular demihuman or alien has no real advantages \nover a human, then they can just proclaim their nature as such, as-\nsuming the GM allows such beings in their campaign.\nSpecialist\nYou are remarkably talented at a particular skill. Whether a marvelous \ncat burglar, a famed athlete, a brilliant scholar, or some other savant, \nyour expertise is extremely reliable. You may take this Focus more \nthan once for different skills.\nLevel 1: Gain any skill as a bonus, except for Magic, Stab, Shoot, or \nPunch. Roll 3d6 and drop the lowest die for all skill checks in this skill.\nLevel 2: Roll 4d6 and drop the two lowest dice for all skill checks \nin this skill.\nSpirit Familiar\nYou have a minor spirit, devil, construct, magical beast, or other \ncreature as a devoted companion. While its abilities are limited, it is \nabsolutely loyal to you.\nLevel 1: Choose a form for your familiar no smaller than a cat nor \nlarger than a human. It has the traits and abilities of an entity created \nby Calculation of the Evoked Servitor but may be summoned or \ndismissed as a Main Action, appearing within melee range of its \nowner. It cannot carry objects with it during its vanishment aside from \nthe clothing natural to its shape. It has no need for food, water, or \nsleep. If killed, it vanishes and cannot be re-summoned for 24 hours. \nOnce per day, it can refresh one point of Committed Effort for you.\nLevel 2: Pick two benefits from the list below for your familiar. This \nlevel may be taken more than once, adding two additional options \neach time.\nTrapmaster\nYou have uncommon expertise in handling traps and snares, both \nmundane ones and the magical perils sometimes found in dungeons \nor the lairs of sorcerers. You know how to improvise traps with ma-\nterials you easily carry.\nLevel 1: Gain Notice as a bonus skill. Once per scene, reroll any \nfailed saving throw or skill check related to traps or snares. Given five\nminutes of work you can trap a portal, container, passageway, or \nother relatively narrow space with foot snares, caltrops, toxic needles, \nor other hazards. Non-lethal traps cause the first victim to trigger it \nto lose a round of actions while dangerous ones inflict 1d6 damage \nplus twice the character’s level, with an appropriate saving throw \nfor half. Only one such improvised trap can be maintained at a time. \nMore fearsome traps may be laid with congenial circumstances and \nthe GM’s permission.\nLevel 2: You know secrets for unraveling even magical traps or ar-\ncane hazards that would normally require a wizard to dispel them. \nOnce per scene, your efforts count as an Extirpate Arcana spell \nagainst the trap or hazard, cast as if a Mage of twice your level, with \nany relevant skill check being Int/Notice or Dex/Notice. This ability \ncan be used against any stationary magical effect that’s susceptible \nto being dispelled by Extirpate Arcana.\nUnarmed Combatant\nYour empty hands are more dangerous than swords in the grip of the \nless gifted. Your unarmed attacks are counted as melee weapons \nwhen it comes to binding up opponents wielding bows and similar \nranged long arms, though you need at least one hand free to do so.\nLevel 1: Gain Punch as a bonus skill. Your unarmed attacks become \nmore dangerous as your Punch skill increases. At level-0, they do \n1d6 damage. At level-1, they do 1d8 damage. At level-2 they do \n1d10, level-3 does 1d12, and level-4 does 1d12+1. At Punch-1 or \nbetter, they have the Shock quality equal to your Punch skill against \nAC 15 or less. \nLevel 2: Even on a miss with a Punch attack, you do an unmodified \n1d6 damage, plus any Shock that the blow might inflict on the target.\nUnique Gift\nYour hero has some unusual ability or magical knack that can’t be \nadequately described by an existing Focus. This choice is a catch-\nall meant to represent a special power that’s in some way worth a \nFocus pick.\nThe exact effect of the ability should be defined by the player \nand the GM together, working out some result that seems fair and \nreasonable. This will vary from table to table and from campaign \nto campaign; an innate ability to breathe water is little more than a \nnovelty in a desert setting, while a campaign based on piracy in an \nendless archipelago might make it far more significant.\nAs with any power, the group should be willing to reconsider \nthe gift if it turns out to be exceptionally weak in play or a stronger \npower than was anticipated.\nValiant Defender\nYou are a bodyguard, shieldbearer, or other gifted defender of others, \naccustomed to the roil of bloody battle and desperate struggle. You \nhave an exceptional ability to shield your allies from the attacks of \nthose who would slay them.\nLevel 1: Gain Stab or Punch as a bonus skill. Gain a +2 on all skill \nchecks for the Screen Ally combat action. You can screen against \none more attacker per round than your skill would normally allow. \nOnce per round, you can Screen Ally against even intangible spells \nor magical attacks or bodily shield them from an area-effect explosion \nor magic. Such attempts require the usual successful opposing skill \ncheck, with the assailant using their Magic skill.\nLevel 2: The first Screen Ally skill check you make in a round is \nalways successful. Gain +2 AC while screening someone. You can \nscreen against foes as large as ogres or oxen.\n•\t\nYou are immune to heat damage and can breathe and see \nthrough smoke without hindrance.\n•\t\nYou are water-adapted and can breathe water and see \nthrough it up to 120’ regardless of light. You swim at double \nyour normal Move rate.\n•\t\nYou were built to heavier or lighter gravity conditions; gain a \n+1 to either your Strength or Dexterity modifiers, to a maximum \nof +3, and a -1 penalty to the modifier of the other attribute.\n•\t\nYou are nourished by invisible radiations and need neither \neat, sleep, nor breathe. You can see clearly even in the absence \nof any light.\nWell Met\nYou have a striking ability to charm and pacify people and creatures \nyou’ve just met. Once they get to know you, however, their opinions \nare more likely to be based on experience; this Focus works only \nonce on a target.\nLevel 1: Reaction rolls made by those the party meets are given a +1 \nbonus so long as you are present, whether or not you do the talking. \nEven hostile encountered beings will usually give the party a round \nto parley before attacking unless they’re in ambush or have a clear \nreason for immediate violence.\nLevel 2: Once per game session, when a reaction roll is made, cause \nthe subject to be as friendly and helpful to you and your party as it’s \nplausibly possible for them to be. It’s up to the GM to decide why \nthe creature becomes so; it might be mistaken about your nature, or \nfind you hilarious, or perhaps want a favor from you and your allies.\nWhirlwind Assault\nYou are a frenzy of bloody havoc in melee combat, and can hack \ndown numerous lesser foes in close combat… assuming you survive \nbeing surrounded.\nLevel 1: Gain Stab as a bonus skill. Once per scene, as an On Turn \naction, apply your Shock damage to all foes within melee range, \nassuming they’re susceptible to your Shock. \nLevel 2: The first time you kill someone in a round with a normal at-\ntack, either with its rolled damage on a hit or with the Shock damage \nit inflicts, instantly gain a second attack on any target within range \nusing any Ready weapon you have.\nXenoblooded\nYou have been both blessed and cursed by some exotic supernatural \nor alien bloodline.\nLevel 1: Choose one set of benefits from the list below to reflect your \nalien heritage. Other gifts may exist.","ru":"Фокусы ниже обычны для большинства фэнтезийных сеттингов. Для отдельных кампаний можно добавлять и другие.\n\n#### Бдительный\n\nТы остро чувствуешь всё вокруг, и застать тебя врасплох почти невозможно.\n\n**Уровень 1:** Получи Внимание как бонусный навык. Тебя нельзя застигнуть врасплох, и никто не может применить против тебя Казнящую атаку. Если Мастер бросает инициативу по сторонам, добавь +1 к броску инициативы своей стороны; несколько Бдительных ПИ этот бонус не складывают. Если инициатива бросается индивидуально, бросай её дважды и бери лучший результат.\n\n**Уровень 2:** Ты всегда действуешь в боевом раунде первым, если только кто-то из участников не столь же Бдителен.\n\n#### Ближний бой\n\nТебе слишком хорошо знакомы ближняя рубка и отчаянная возня на обнажённых клинках. Ты отлично умеешь избегать ран в ближнем бою, а на уровне 2 проскальзываешь сквозь свалку, не боясь получить нож мимоходом.\n\n**Уровень 1:** Получи любой боевой навык как бонусный. Ты можешь метать оружие размером с нож в ближнем бою без штрафов за близость атакующих врагов. Ты игнорируешь урон Шока от противников в ближнем бою, даже будучи без доспехов, но использование этого преимущества срывает любое твоё колдовство в этом раунде: слишком уж бурны твои уклонения.\n\n**Уровень 2:** Урон Шока твоих атак ближнего боя считает все цели как КЗщ 10. Боевой отход для тебя — Действие в свой ход и выполняется свободно.\n\n#### Везунчик\n\nНекий запас редкостной удачи уже спасал тебе жизнь и продолжает выручать в безнадёжных, казалось бы, положениях. Эта удача не жалует и без того благословенных: этот Фокус может взять только ПИ хотя бы с одним модификатором характеристики -1 или ниже.\n\n**Уровень 1:** Раз в неделю удар или эффект, который убил бы тебя, смертельно ранил или оставил беспомощным, каким-то образом не задевает тебя или на тебя не действует. Любые броски в азартных играх ты делаешь дважды и берёшь лучший.\n\n**Уровень 2:** Раз за сессию, оказавшись в нужде или опасности, доверься удаче и брось 1d6. На 2 и больше случается что-то удачное: оно продвигает твою цель, даёт выход из непосредственной опасности или иное нужное тебе преимущество, хотя и не обязательно немедленную победу. На 1 положение немедленно становится куда хуже — как сочтёт нужным Мастер.\n\n#### Верный глаз\n\nУ тебя дар к дальнобойному оружию. Чаще всего этот талант проявляется с луками, но он применим и к метательному оружию, и к любому другому дальнобойному оружию, используемому с навыком Стрельба. Для метательного оружия нельзя пользоваться преимуществами Оружейного мастера одновременно с Верным глазом.\n\n**Уровень 1:** Получи Стрельбу как бонусный навык. Ты можешь взять дальнобойное оружие из укладки как Мгновенное действие. Ты можешь стрелять из лука или двуручного дальнобойного оружия, даже когда враг на дистанции ближнего боя, — правда, со штрафом -4 к атаке. Ты можешь добавлять уровень навыка Стрельба к броску урона дальнобойного оружия.\n\n**Уровень 2:** Ты можешь перезаряжать арбалеты и другое медленно заряжаемое оружие как Действие в свой ход, если перезарядка занимает не больше раунда. Ты можешь без штрафа использовать в ближнем бою дальнобойное оружие любого размера. Раз за сцену, как Действие в свой ход при стрельбе по неодушевлённой мишени-несуществу, ты попадаешь автоматически — если только не выбросил 2 на проверке навыка Стрельба и если выстрел вообще физически возможен.\n\n#### Вихревой натиск\n\nТы — вихрь кровавого разора в ближнем бою и можешь косить множество слабых врагов вблизи… если выживешь в окружении.\n\n**Уровень 1:** Получи Клинок как бонусный навык. Раз за сцену как Действие в свой ход нанеси свой урон Шока всем врагам на дистанции ближнего боя, если они уязвимы к твоему Шоку.\n\n**Уровень 2:** Когда ты в первый раз за раунд убиваешь кого-то обычной атакой — броском урона при попадании или нанесённым ею уроном Шока, — ты мгновенно получаешь вторую атаку по любой цели в пределах досягаемости любым оружием у тебя в готовности.\n\n#### Властность\n\nВ тебе есть жутковатая харизма, и окружающие инстинктивно следуют твоим указаниям и служат твоим целям. На уровне 1 это дар обаяния и личного магнетизма, а уровень 2 может намекать на скрытые магические силы или древнюю кровь колдовских владык. Где этот Фокус говорит о последователях, имеются в виду NPC, добровольно поступившие к тебе на службу. ПИ последователями не считаются никогда.\n\n**Уровень 1:** Получи Лидерство как бонусный навык. Раз в день ты можешь обратиться с просьбой к NPC, не проявляющему к тебе открытой враждебности, бросив проверку Хар/Лидерство со сложностью, равной Боевому духу этого NPC. При успехе он выполнит просьбу, если она не причиняет ему заметного вреда и не совсем ему несвойственна.\n\n**Уровень 2:** Идущие за тобой окрылены уверенностью. Любой NPC под твоим прямым началом получает бонус к Боевому духу и броскам атаки, равный твоему навыку Лидерство, и +1 ко всем проверкам навыков. Твои последователи и подручные не пойдут против твоих интересов, разве что под крайним давлением.\n\n#### Вожак подручных\n\nУ тебя особый талант подбирать потерянные души, готовые добровольно исполнять твою волю. Ты можешь завлекать их обещаниями денег, власти, азарта, секса или иной награды, которую в итоге дашь или не дашь. Подручный, полученный этим Фокусом, служит верно, пока его явно не предадут или не поставят под неприемлемую угрозу. Подручные — люди не «важные»: обычно это маргиналы, изгои, отчаявшиеся и прочий люд с небольшим выбором.\n\nТы можешь набирать дополнительных подручных обычной платой или посулами, но эти лишние наёмники верны и умелы ровно настолько, насколько это купят твои деньги и обращение.\n\n**Уровень 1:** Получи Лидерство как бонусный навык. Ты можешь обзавестись подручными в течение 24 часов после прибытия в поселение — если там вообще найдётся подходящий материал. Эти подручные не станут драться, кроме как спасая свою жизнь, но пойдут с тобой в приключения и на большой риск ради помощи тебе. У большинства подручных боевые параметры обычного взрослого их культуры. Ты можешь держать одного подручного за каждые три уровня персонажа, с округлением вверх. Ты можешь отпустить подручных без обид в любой правдоподобный момент и позже подобрать их снова, если останешься без подручного.\n\n**Уровень 2:** Твои подручные удивительно верны и решительны: они будут драться за тебя против чего угодно, кроме явно подавляющих сил. Благодаря природной толковости или преданности тебе они считаются бойцами своей культуры с 2 КЗд. Ты можешь делать верными подручными умелых и очень способных NPC, но для этого нужно действительно оказать им услугу или помощь, разумно заслуживающую такой яростной верности.\n\n#### Гаситель\n\nЧто-то в твоём герое мешает применять к нему магию. Может, это на диво сильное родовое благословение, особая сверхъестественная кровь или простая оккультная несовместимость. Этот Фокус нельзя брать Магам и частичным Магам.\n\n**Уровень 1:** Ты и все союзники в пределах двадцати футов получаете +2 ко всем спасброскам против магических эффектов. Как Действие в свой ход ты можешь ощутить присутствие или применение магии в двадцати футах от себя, хотя не различаешь ни подробностей, ни конкретного источника. Первый за день провальный спасбросок против магического эффекта превращается для тебя в успех.\n\n**Уровень 2:** Раз в день как Мгновенное действие нежеланный магический эффект или сверхъестественная способность чудовища просто не действует на тебя — даже если обычно она не даёт спасброска. Неуязвимость к длящемуся эффекту сохраняется до конца сцены.\n\n#### Глаз снайпера\n\nТы мастер укладывать метательный нож или стрелу в ничего не подозревающую цель. Эти особые преимущества действуют только при Казнящей атаке из лука, болтомёта или метательным оружием.\n\n**Уровень 1:** Получи Стрельбу как бонусный навык. При проверке навыка для дальнобойной Казнящей атаки или стрельбы по мишени бросай 3d6 и отбрасывай худшую кость.\n\n**Уровень 2:** Ты не промахиваешься дальнобойными Казнящими атаками. Поражённая такой атакой цель получает -4 на Физический спасбросок, чтобы избежать немедленного смертельного ранения. Даже при успешном спасброске цель получает двойной обычный урон от атаки.\n\n#### Дар дипломата\n\nТвоё искусство личных переговоров огромно и жутковато. Иные даже сочтут его сверхъестественным.\n\n**Уровень 1:** Получи Убеждение как бонусный навык. Ты говоришь на всех языках, распространённых в твоём краю мира, и выучиваешь новые до рабочего уровня за неделю, а до свободного — за месяц. Перебрасывай единицы на любых костях проверок навыков, связанных с переговорами или дипломатией.\n\n**Уровень 2:** Раз в день безмолвно освяти заключаемую сделку: чтобы нарушить её, цель должна пройти Ментальный спасбросок, — если только сделка не грозит её жизни или чему-то столь же ей дорогому. Большинство NPC даже не попытаются её нарушить. Сделка должна быть о чём-то конкретном и ограниченном по времени, а не бессрочным договором.\n\n#### Делец\n\nУ тебя сверхъестественный нюх на торговцев и выгодные сделки, законные и не очень. Даже тех, кто обычно не расположен с тобой торговаться, порой удаётся уговорить остановиться и поторговаться, если у тебя есть то, что им нужно.\n\n**Уровень 1:** Получи Торговлю как бонусный навык. За полчаса усилий ты находишь покупателя или продавца на любой товар или услугу, какими вообще торгуют в этом поселении, легально или нет. Поиск услуги на грани возможного — скажем, убийцы, готового и способного взяться за короля, или некоего конкретного драгоценного древнего артефакта — может потребовать целого приключения, если Мастер это вообще позволит.\n\n**Уровень 2:** Раз за сессию выбери разумное существо, которое прямо сейчас не пытается убить тебя или твоих союзников, и обратись к нему с понятной ему просьбой. Если для него хоть сколько-нибудь правдоподобно пойти на такие условия, оно согласится — за цену или услугу, которую, по его мнению, ты можешь дать; правда, цена серьёзных услуг может оказаться высокой.\n\n#### Доблестный защитник\n\nТы телохранитель, щитоносец или иной одарённый защитник ближних, привычный к водовороту кровавой битвы и отчаянной схватки. Ты исключительно хорошо умеешь заслонять союзников от атак тех, кто желает им смерти.\n\n**Уровень 1:** Получи Клинок или Кулак как бонусный навык. Получи +2 ко всем проверкам навыка для боевого действия «Прикрыть союзника». Ты можешь прикрывать от одного атакующего за раунд больше, чем обычно позволял бы твой навык. Раз в раунд ты можешь Прикрыть союзника даже от бесплотных заклинаний и магических атак или телом заслонить его от взрыва или магии по площади. Такие попытки требуют обычной успешной встречной проверки навыка; нападающий использует свой навык Магия.\n\n**Уровень 2:** Первая проверка навыка «Прикрыть союзника» в раунде всегда успешна. Получи +2 к КЗщ, пока кого-то прикрываешь. Ты можешь прикрывать от врагов размером вплоть до огра или вола.\n\n#### Дух-фамильяр\n\nТвой преданный спутник — мелкий дух, бес, конструкт, магический зверь или иное существо. Способности его скромны, но он абсолютно верен тебе.\n\n**Уровень 1:** Выбери облик фамильяра — не мельче кошки и не крупнее человека. У него свойства и способности существа, созданного Исчислением призванного слуги, но его можно призывать и отпускать Основным действием; появляется он на дистанции ближнего боя от владельца. Исчезая, он не уносит с собой предметов, кроме одежды, естественной для его облика. Ему не нужны еда, вода и сон. Если фамильяра убили, он исчезает, и его нельзя призвать заново 24 часа. Раз в день он может восстановить тебе один пункт задействованного Усилия.\n\n**Уровень 2:** Выбери фамильяру два преимущества из списка ниже. Этот уровень можно брать несколько раз, каждый раз добавляя ещё два варианта.\n\n- У него пункты здоровья, равные тройному твоему уровню.\n- Он получает способность атаковать с бонусом атаки в половину твоего уровня с округлением вверх, нанося 1d8 урона при попадании, без Шока.\n- Он получает +1 к проверкам навыков и может применять этот бонус к кругу задач, соответствующему одному обычному человеческому происхождению.\n- Он получает ещё один облик по твоему выбору, который может принимать и сбрасывать как Действие в свой ход.\n- Он может парить или летать со своей обычной скоростью перемещения.\n- Он может свободно общаться с окружающими на любом известном тебе языке.\n\n#### Душа компании\n\nУ тебя поразительный дар очаровывать и умиротворять людей и существ, которых ты только что встретил. Правда, узнав тебя ближе, они станут судить уже по опыту: этот Фокус действует на цель лишь однажды.\n\n**Уровень 1:** Проверки реакции встреченных отрядом существ получают +1, пока ты рядом, — вне зависимости от того, ты ли ведёшь разговор. Даже враждебные существа при встрече обычно дадут отряду раунд на переговоры, прежде чем напасть, — если только они не в засаде и у них нет явной причины для немедленного насилия.\n\n**Уровень 2:** Раз за игровую сессию, когда делается проверка реакции, сделай её объект настолько дружелюбным и услужливым к тебе и твоему отряду, насколько это для него вообще правдоподобно. Почему существо стало таким, решает Мастер: может, оно обмануто насчёт твоей природы, может, находит тебя уморительным, а может, хочет услуги от тебя и твоих союзников.\n\n#### Живучий\n\nТебя на удивление трудно убить. Ты переживаешь раны и выносишь тяготы, которые свалили бы менее упорного героя.\n\n**Уровень 1:** Ты получаешь дополнительные 2 к максимуму пунктов здоровья за уровень. Этот бонус действует задним числом, если ты берёшь Фокус после первого уровня. Будучи смертельно ранен, ты стабилизируешься автоматически — если тебя не сожгли, не расчленили и не разорвали на куски иным способом.\n\n**Уровень 2:** Первый раз за день, когда ранение опускает тебя до нуля пунктов здоровья, ты вместо этого выживаешь с одним оставшимся пунктом здоровья. Эта способность не спасёт от масштабной мгновенно убийственной травмы.\n\n#### Магия в доспехах\n\nЭтот Фокус доступен только героям-Магам, которым доспехи иначе не давали бы читать заклинания или применять Искусства; он отражает особую выучку в проведении магии сквозь мешающие материалы обычного доспеха.\n\n**Уровень 1:** Ты можешь читать заклинания и применять Искусства в доспехах со значением Загруженности не выше двух. Ты можешь колдовать со щитом, если вторая рука свободна для жестов.\n\n**Уровень 2:** Ты можешь читать заклинания в доспехах любой Загруженности. Ты также научился колдовать, когда обе руки заняты, — но не связаны.\n\n#### Мастер ловушек\n\nТы редкостно сведущ в ловушках и силках — и в обыденных, и в магических опасностях, какие встречаются в подземельях и логовах чародеев. Ты умеешь мастерить ловушки из материалов, которые легко носить с собой.\n\n**Уровень 1:** Получи Внимание как бонусный навык. Раз за сцену перебрасывай любой провальный спасбросок или проверку навыка, связанные с ловушками и силками. За пять минут работы ты можешь заминировать дверной проём, ёмкость, проход или иное относительно узкое место ножными петлями, железным чесноком, отравленными иглами и прочими опасностями. Нелетальная ловушка отнимает раунд действий у первой сработавшей на неё жертвы, а опасная наносит 1d6 урона плюс удвоенный уровень персонажа, с подходящим спасброском вполовину. Одновременно можно поддерживать лишь одну такую самодельную ловушку. При благоприятных обстоятельствах и с разрешения Мастера можно ставить ловушки и пострашнее.\n\n**Уровень 2:** Ты знаешь секреты распутывания даже магических ловушек и тайных опасностей, для снятия которых обычно нужен волшебник. Раз за сцену твои усилия считаются заклинанием Искоренение чар против ловушки или опасности, прочитанным Магом вдвое выше тебя уровнем; все нужные проверки навыка делаются как Инт/Внимание или Лов/Внимание. Эту способность можно применять против любого неподвижного магического эффекта, который поддаётся развеиванию Искоренением чар.\n\n#### Мастер на все руки\n\nУ тебя шапочное знакомство с огромным множеством практических навыков и занятий, и ты можешь сносно взяться почти за любое дело или ремесло. Учти, что фантомные уровни навыков от этого Фокуса не складываются с обычными уровнями навыков и не дают скидки на покупку навыка. Этот Фокус могут брать только Эксперты и частичные Эксперты.\n\n**Уровень 1:** Получи любой один бонусный навык. Все небоевые навыки для целей проверок считаются у тебя не ниже уровня-0, даже если их у тебя нет вовсе.\n\n**Уровень 2:** Все небоевые навыки для целей проверок считаются у тебя не ниже уровня-1.\n\n#### Наездник\n\nСражаться в седле и держать скакуна здоровым может всякий с любым уровнем навыка Верховая езда. Но твоя связь со скакунами почти сверхъестественна, и ты можешь гнать их за обычные пределы.\n\n**Уровень 1:** Получи Верховую езду как бонусный навык. Все твои скакуны считаются в бою существами с Боевым духом 12, используют твой КЗщ, если он выше их собственного, и проходят за день на 50% больше обычного для их породы. Ты интуитивно понимаешь верховых животных, узнавая от них столько, сколько способен передать их разум.\n\n**Уровень 2:** Раз за сцену отмени успешную атаку по своему скакуну как Мгновенное действие. Раз за сцену перебрось любую провальную проверку Верховой езды. Ты можешь телепатически передавать своему скакуну и принимать от него простые предупреждения, мысли и команды, пока он в пределах двухсот футов. Так ты можешь быть связан с одним скакуном за раз; установление связи занимает час.\n\n#### Неуязвимая защита\n\nНебывалые рефлексы, редкое везение, сверхъестественная кровь или магический дар — так или иначе, твоя природная защита не уступает доспеху высшей пробы. Преимущества этого Фокуса не складываются с бронёй, но модификаторы Ловкости и щита действуют.\n\n**Уровень 1:** Твой врождённый Класс защиты равен 15 плюс половина уровня персонажа с округлением вверх.\n\n**Уровень 2:** Раз в день как Мгновенное действие ты можешь стряхнуть любую одну оружейную атаку или физическую травму, нанесённую врагом. Урон от среды, урон от падения и прочий вред, от которого не уберёг бы крепкий доспех, так не отразить.\n\n#### Одарённый лекарь\n\nУ тебя необычный дар спасать смертельно раненных союзников и ускорять естественное восстановление раненых под твоей опекой.\n\n**Уровень 1:** Получи Медицину как бонусный навык. Ты можешь пытаться стабилизировать одного смертельно раненного вплотную к тебе за раунд как Действие в свой ход. При проверках навыка Медицина бросай 3d6 и отбрасывай худшую кость. Оказывая первую помощь после боя, ты исцеляешь вдвое больше пунктов здоровья, чем обычно.\n\n**Уровень 2:** Твои целительные дары считаются магическим исцелением. Как Основное действие ты можешь исцелить 1d6+Медицина урона раненому союзнику вплотную к тебе — и, возможно, привести его в чувство без всякой остаточной Хилости. Каждое такое исцеление добавляет цели 1 Системной нагрузки, и дар нельзя применять к целям, уже достигшим максимума Системной нагрузки.\n\n#### Оружейный мастер\n\nТы необычайно ловок с метательным оружием и в атаках ближнего боя. Преимущества этого Фокуса не действуют на рукопашные атаки и на стрелковое оружие, которое не метают. Его бонусы также не складываются с Верным глазом и другими Фокусами, добавляющими уровень навыка к твоему урону или Шоку.\n\n**Уровень 1:** Получи Клинок как бонусный навык. Ты можешь взять оружие ближнего боя или метательное оружие из укладки как Мгновенное действие. Ты можешь добавлять уровень навыка Клинок к броску урона или урону Шока оружия ближнего боя или метательного оружия — если они у него вообще есть.\n\n**Уровень 2:** Шок твоих атак ближнего боя всегда считает цель как КЗщ 10. Получи +1 к атаке всем метательным оружием и оружием ближнего боя.\n\n#### Особый род\n\nГерои этой игры по умолчанию люди — или настолько близки к ним, что разницы нет. ПИ, желающие принадлежать к более экзотическому виду или народу полулюдей, могут взять Фокус рода, подходящий выбранному виду, — например, из тех, что даны в главе бестиария для разных типов существ.\n\nДоступность таких особых родов зависит от кампании и разрешения Мастера. Даже если эльфы и гномы в мире кампании существуют, Мастер не обязан позволять игрокам брать их как ПИ, если этот выбор не подходит тону или месту действия.\n\nЗаметь также, что ПИ, который просто хочет отличаться, не прося особых механических выгод, не обязан покупать особый Фокус. Если у его народа полулюдей или чужаков нет настоящих преимуществ перед человеком, он может просто объявить свою природу — при условии, что Мастер вообще допускает таких существ в своей кампании.\n\n#### Отравитель\n\nТы искусный отравитель и умеешь составлять токсины из подручных растений и минералов. Варка яда занимает час; свежими ты можешь держать столько доз, сколько у тебя уровней. Клинковые яды наносятся Основным действием и держатся десять минут либо до первого попадания или Шока — смотря что случится раньше. Обнаружить отравленную еду — проверка Мдр/Внимание против 10, или против 12, если едок не вельможа и вообще не привык остерегаться яда. Одной дозы хватит отравить до полудюжины едоков.\n\n**Уровень 1:** Получи Медицину как бонусный навык. Получи переброс любого провального спасброска против яда. Твои токсины наносят 2d6 урона плюс твой уровень при попадании или Шоке, Физический спасбросок — вполовину. Обездвиживающие и галлюциногенные токсины делают то же самое, но опущенные ими до нуля пунктов здоровья просто обездвижены на час.\n\n**Уровень 2:** Ты неуязвим для яда и можешь дать универсальное противоядие любому отравленному союзнику как Основное действие. Любая попытка обнаружить твой яд или спастись от него получает штраф, равный твоему навыку Медицина. Твои пищевые яды считаются Казнящей атакой против ничего не подозревающих целей: Медицина задаёт штраф к Физическому спасброску, а при успешном спасброске цель получает 1d6 урона за твой уровень. Такие яды по твоему желанию могут быть нелетальными.\n\n#### Развитая характеристика\n\nУ твоего героя необычайно развита одна или несколько характеристик. Причиной может быть колдовская кровь, природный дар или чистое упрямое упорство. Этот Фокус нельзя брать героям с классами Мага или частичного Мага.\n\n**Уровень 1:** Выбери характеристику; её модификатор увеличивается на +1, максимум до +3. Само значение не меняется, но модификатор растёт — и может вырасти ещё, если дальнейшее развитие достаточно поднимет характеристику. Ты можешь брать этот Фокус несколько раз для разных характеристик.\n\n#### Ремесленник\n\nУ тебя выдающийся дар мастерового, и ты часто импровизируешь приёмы даже в ремёслах, далёких от твоего обычного занятия. Ты можешь создавать моды для снаряжения, даже если ты не Эксперт.\n\n**Уровень 1:** Получи Ремесло как бонусный навык. Твой навык Ремесло считается на уровень выше, максимум до 5, для целей создания и поддержания модов. Модам твоей работы нужно на одну единицу чародейного утиля меньше, минимум до одной. Твой навык Ремесло применим к работе любой обычной ремесленной профессии, так что ты изготавливаешь её изделия без штрафа.\n\n**Уровень 2:** Первый мод, который ты ставишь на предмет, не требует Обслуживания и стоит лишь половину обычной цены в серебре. Это преимущество добавляется к выгодам установки мода в мастерски изготовленное снаряжение твоей работы. Любая твоя попытка создать мастерски изготовленное снаряжение автоматически успешна, и раз в месяц ты можешь снизить расход утиля на созданный мод ещё на одну единицу, минимум до нуля.\n\n#### Рукопашник\n\nТвои пустые руки опаснее мечей в хватке менее одарённых. Твои рукопашные атаки считаются оружием ближнего боя, когда речь идёт о связывании противников с луками и подобным длинным дальнобойным оружием, но для этого нужна хотя бы одна свободная рука.\n\n**Уровень 1:** Получи Кулак как бонусный навык. Твои рукопашные атаки становятся опаснее с ростом навыка Кулак. На уровне-0 они наносят 1d6 урона. На уровне-1 — 1d8 урона. На уровне-2 — 1d10, уровень-3 даёт 1d12, а уровень-4 — 1d12+1. При Кулак-1 и выше они получают качество Шок, равное твоему навыку Кулак, против КЗщ 15 или меньше.\n\n**Уровень 2:** Даже при промахе атакой Кулаком ты наносишь немодифицированный 1d6 урона плюс любой Шок, который удар мог бы нанести цели.\n\n#### Самозванец\n\nТы изощрённо умеешь выдавать себя за того, кем не являешься: маскировка, подражание голосам, молниеносная смена гардероба. Одни самозванцы полагаются на актёрство Выступления, другие тяготеют к тёмным трюкам Скрытности.\n\n**Уровень 1:** Получи Выступление или Скрытность как бонусный навык. Раз за сцену перебрасывай любую провальную проверку навыка или спасбросок, связанные с поддержанием личины или маскировки. Создай одну фальшивую личность без большого общественного веса; ты можешь безупречно выдавать себя за этого человека, и связать вас смогут лишь крайне убедительные доказательства. Ты можешь сменить эту личность, потратив неделю на создание новой.\n\n**Уровень 2:** Ты можешь так перекроить одежду и доспех, что одним Основным действием переключаешься между любым из трёх выбранных обликов. Вдобавок к исходной фальшивой личности ты можешь заводить новую в каждом городе или крупном поселении, где провёл хотя бы день.\n\n#### Светский\n\nОбширные странствия, зоркая наблюдательность или долгая учёба дали тебе широкое знание культур твоего края и умение ориентироваться в их обычаях, законах и языках. Ты знаешь, что сделать и что сказать, чтобы убедить других в разумности твоих пожеланий.\n\n**Уровень 1:** Получи Связи как бонусный навык. Ты свободно говоришь на всех распространённых языках родного края и можешь передать хотя бы простые сведения на редких и эзотерических. Новый язык ты выучиваешь всего за неделю практики с носителем. Раз в игровой день твои отточенные манеры автоматически приносят мелкую услугу от NPC — такую, что не введёт его в заметные расходы или риск, — если NPC к тебе не враждебен.\n\n**Уровень 2:** Раз за игровую сессию перебрось провальную проверку социального навыка: твоё знание культуры подталкивает собеседника к нужному результату.\n\n#### Со связями\n\nТы на редкость легко заводишь друзей и связи среди окружающих. Куда бы ты ни попал, у тебя всегда найдётся кто-то полезный для твоих целей.\n\n**Уровень 1:** Получи Связи как бонусный навык. Если ты провёл хотя бы неделю в не совсем враждебном месте, ты сплёл там сеть знакомств, готовых оказывать тебе услуги не более чем слегка противозаконные. Ты можешь просить об одной услуге за игровой день; как далеко ради тебя пойдут, решает Мастер.\n\n**Уровень 2:** Раз за игровую сессию, если это не совсем неправдоподобно, ты встречаешь знакомого, готового на скромные услуги для тебя. Ты сам решаешь, когда и где встретить этого человека, но кто он и чем может помочь, решает Мастер.\n\n#### Специалист\n\nТы замечательно талантлив в одном определённом навыке. Изумительный домушник, прославленный атлет, блестящий учёный или иной самородок — твоё мастерство крайне надёжно. Ты можешь брать этот Фокус несколько раз для разных навыков.\n\n**Уровень 1:** Получи любой навык как бонусный, кроме Магии, Клинка, Стрельбы и Кулака. Бросай 3d6 и отбрасывай худшую кость при всех проверках этого навыка.\n\n**Уровень 2:** Бросай 4d6 и отбрасывай две худшие кости при всех проверках этого навыка.\n\n#### Убийца\n\nТы набил руку на внезапном смертоубийстве и имеешь особые преимущества при Казнящей атаке.\n\n**Уровень 1:** Получи Скрытность как бонусный навык. Ты можешь спрятать предмет не крупнее ножа от любого досмотра мягче обыска с раздеванием. Ты можешь выхватить или достать этот предмет как Действие в свой ход, а твои атаки им в упор — метательные или ближние — в раунде внезапности не могут промахнуться по цели.\n\n**Уровень 2:** Ты можешь совершить Действие перемещения в том же раунде, что и Казнящую атаку, стремительно сближаясь с целью перед ударом. Ты можешь разбить это перемещение при Казнящей атаке, пройдя часть пути до убийства, а часть после. Это движение слишком быстро, чтобы насторожить жертву, и телохранители не успевают ему помешать.\n\n#### Уникальный дар\n\nУ твоего героя есть необычная способность или магический дар, который не описать существующими Фокусами как следует. Этот выбор — запасная графа для особой силы, которая так или иначе стоит выбора Фокуса.\n\nТочный эффект способности игрок и Мастер определяют вместе, вырабатывая результат, который выглядит честным и разумным. От стола к столу и от кампании к кампании он будет разным: врождённая способность дышать под водой в пустынном сеттинге — немногим больше, чем курьёз, а в кампании о пиратстве в бескрайнем архипелаге она может значить куда больше.\n\nКак с любой силой, группе стоит быть готовой пересмотреть дар, если в игре он окажется исключительно слаб или сильнее, чем ожидалось.\n\n#### Чужая кровь\n\nНекая экзотическая сверхъестественная или чуждая кровь стала для тебя и благословением, и проклятием.\n\n**Уровень 1:** Выбери один набор преимуществ из списка ниже под стать своему чуждому наследию. Могут существовать и другие дары.\n\n- Ты неуязвим для урона от жара и без помех дышишь в дыму и видишь сквозь него.\n- Ты приспособлен к воде: дышишь под водой и видишь в ней до 120 футов независимо от освещения. Ты плаваешь с удвоенной скоростью перемещения.\n- Ты сложен для более тяжёлого или лёгкого тяготения: получи +1 к модификатору Силы или Ловкости, максимум до +3, и штраф -1 к модификатору второй из этих характеристик.\n- Тебя питают незримые излучения, и тебе не нужно ни есть, ни спать, ни дышать. Ты ясно видишь даже в полной темноте.\n\n#### Шокирующий натиск\n\nТы крайне опасен для врагов рядом с собой. Ярость твоих атак в ближнем бою давит и отвлекает противников, даже когда твои удары не пускают кровь.\n\n**Уровень 1:** Получи Кулак или Клинок как бонусный навык. Урон Шока твоего оружия считает все цели как КЗщ 10 — при условии, что оружие вообще способно навредить цели и цель не защищена от Шока.\n\n**Уровень 2:** Вдобавок ты получаешь +2 к значению урона Шока всего оружия ближнего боя и рукопашных атак, наносящих Шок. Как обычно, попадания никогда не наносят меньше урона, чем нанёс бы этот Шок при промахе."},{"n":"1.7.0","l":2,"te":"Final Character Creation Steps","tr":"Завершающие шаги создания персонажа","en":"The player now records their character’s final statistics and chooses \ntheir name and current goal.","ru":"Теперь игрок записывает итоговые характеристики персонажа и выбирает его имя и текущую цель."},{"n":"1.7.1","l":3,"te":"Record Maximum Hit Points","tr":"Запиши максимум пунктов здоровья","en":"Your character’s hit points measure their distance from defeat or death. \nIf your character is reduced to zero hit points, they are either dying \nor incapacitated based on the nature of the injury.\nA new character rolls the hit die for their class, adding their Con-\nstitution modifier to it. If they have chosen the Die Hard Focus they \nmay add +2 to the roll. The final value for a given die cannot be less \nthan 1 hit point.\nA character gains hit points as they advance in character level, \nrerolling their prior levels and taking the new score if it’s higher, as \nexplained in the rules section.","ru":"Пункты здоровья твоего персонажа измеряют, насколько он далёк от поражения или смерти. Если персонаж падает до нуля пунктов здоровья, он либо умирает, либо обездвижен — смотря какова природа ранения.\n\nНовый персонаж бросает кость здоровья своего класса, добавляя к броску модификатор Телосложения. Если он выбрал Фокус Живучий, он может добавить к броску +2. Итог одной кости не может быть меньше 1 пункта здоровья.\n\nПерсонаж получает пункты здоровья с ростом уровня, перебрасывая прежние уровни и беря новый результат, если он выше, — как объяснено в разделе правил."},{"n":"1.7.2","l":3,"te":"Record Attack Bonus","tr":"Запиши бонус атаки","en":"Your character has a certain degree of basic combat competence \nbased on their class. This bonus increases as you advance in character \nlevels and is added to your attack roll.\nA new character’s attack bonus is usually +0, though Full Warriors \nstart with a +1 base attack bonus.","ru":"У твоего персонажа есть некоторая базовая боевая подготовка, зависящая от класса. Этот бонус растёт с уровнями персонажа и добавляется к броску атаки.\n\nУ нового персонажа бонус атаки обычно +0, но полные Воины начинают с базовым бонусом атаки +1."},{"n":"1.7.3","l":3,"te":"Record Saving Throws","tr":"Запиши спасброски","en":"When faced with unusual dangers such as fireball explosions, toxic \ndarts, pit traps, or magical curses, the character may need to make \na saving throw to resist or mitigate the peril. Saving throws are rolled \non a d20 and are explained in the rules section.\nPhysical saving throws are used to resist exhaustion, disease, \npoison, or other biological harms. A new character’s Physical save \ntarget is equal to 15 minus the better of their Strength or Constitution \nmodifiers.\nEvasion saving throws are used to avoid explosions, traps, or \nother dangers requiring fast reactions. A new character’s Evasion \nsave target is equal to 15 minus the better of their Intelligence or \nDexterity modifiers.\nMental saving throws are used to resist intangible spells, mental \nattacks, or other tests of willpower or self-control. A new character’s \nMental save target is equal to 15 minus the better of their Wisdom \nor Charisma modifiers.\nLuck saving throws are rolled when facing a danger that only \nblind chance can spare them from, such as landslide, bridge collapse, \nor a sniper’s random choice of victims. A new character’s Luck save \ntarget is always 15.\nA character’s save targets all decrease by 1 point each time they \nadvance an experience level.","ru":"Столкнувшись с необычными угрозами вроде взрыва огненного шара, отравленных дротиков, ям-ловушек или магических проклятий, персонаж может быть вынужден сделать спасбросок, чтобы устоять или смягчить опасность. Спасброски бросаются на d20 и объясняются в разделе правил.\n\nФизические спасброски используются, чтобы устоять против истощения, болезни, яда и иного биологического вреда. У нового персонажа порог Физического спасброска равен 15 минус лучший из модификаторов Силы или Телосложения.\n\nСпасброски Уклонения используются, чтобы избежать взрывов, ловушек и иных опасностей, требующих быстрой реакции. У нового персонажа порог спасброска Уклонения равен 15 минус лучший из модификаторов Интеллекта или Ловкости.\n\nМентальные спасброски используются, чтобы устоять против бесплотных заклинаний, ментальных атак и иных испытаний воли и самообладания. У нового персонажа порог Ментального спасброска равен 15 минус лучший из модификаторов Мудрости или Харизмы.\n\nСпасброски Удачи бросаются при опасности, от которой может спасти только слепой случай, — оползень, обрушение моста или случайный выбор жертвы снайпером. У нового персонажа порог спасброска Удачи всегда 15.\n\nВсе пороги спасбросков персонажа снижаются на 1 каждый раз, когда он поднимает уровень опыта."},{"n":"1.7.4","l":3,"te":"Pick a Free Skill","tr":"Выбери бесплатный навык","en":"Your character has developed some side interest that may be unre-\nlated to your background or class. You can pick any one skill of your \nchoice. This skill pick is gained at level-0, or level-1 if it’s already \nlevel-0. You cannot pick a skill that is already at level-1.","ru":"У твоего персонажа развилось какое-то побочное увлечение, возможно, не связанное с твоим происхождением или классом. Ты можешь выбрать любой навык на свой вкус. Этот выбор навыка даётся на уровне-0 или на уровне-1, если навык уже уровня-0. Ты не можешь выбрать навык, который уже уровня-1."},{"n":"1.7.5","l":3,"te":"Mages Choose Starting Spells","tr":"Маги выбирают стартовые заклинания","en":"Spellcasting full Mages begin play knowing four first-level spells and \npartial Mages begin play knowing two. Adventurers with two partial \nspellcasting Mage classes, such as a partial Necromancer/partial \nHigh Mage know four. These spells may be chosen from any spell \nlist available to them. A novice High Mage, for example, would pick\nfirst-level spells from the High Magic spell list, while a new Elemental-\nist could pick them from either the High Magic or Elementalist spells.","ru":"Колдующие полные Маги начинают игру, зная четыре заклинания первого уровня, а частичные Маги — два. Авантюристы с двумя частичными классами колдующих Магов — например, частичный Некромант/частичный Высший маг — знают четыре. Эти заклинания выбираются из любого доступного им списка заклинаний. Так, начинающий Высший маг выбирал бы заклинания первого уровня из списка Высшей магии, а новый Стихийник мог бы взять их из Высшей магии или заклинаний Стихийника."},{"n":"1.7.6","l":3,"te":"Choose Starting Languages","tr":"Выбери стартовые языки","en":"Your PC begins play speaking the lingua franca of the campaign’s \ncurrent city along with their native tongue if it happens to be different. \nThey also have fluency in additional languages based on their Know \nor Connect skills. Either skill at level-0 grants one extra language, or \ntwo extra if it’s at level-1. Thus, a PC with both Know-1 and Connect-1 \nskills could pick four additional languages.\nPCs can learn additional languages to a conversational level by \nspending a few months immersed in it or studying it diligently during \ndowntime. Obtaining native fluency is at the GM’s discretion.","ru":"Твой ПИ начинает игру, говоря на лингва франка текущего города кампании и на родном языке, если тот отличается. Он также свободно владеет дополнительными языками в зависимости от навыков Знание и Связи. Любой из этих навыков на уровне-0 даёт один дополнительный язык, на уровне-1 — два. Так, ПИ с навыками Знание-1 и Связи-1 мог бы выбрать четыре дополнительных языка.\n\nПИ могут выучивать новые языки до разговорного уровня, проведя несколько месяцев в языковой среде или прилежно занимаясь во время простоя. Родное владение — на усмотрение Мастера."},{"n":"1.7.7","l":3,"te":"Choose Starting Gear","tr":"Выбери стартовое снаряжение","en":"You can either pick a starting equipment package provided by your \nGM, or roll 3d6 x 10 to find out your starting silver pieces to spend \non gear or keep in your pocket. The starting packages will generally \ngive you more equipment than the random roll would, but items can \nbe swapped at the GM’s discretion.","ru":"Ты можешь либо взять стартовый комплект снаряжения, предложенный Мастером, либо бросить 3d6 × 10 и узнать, сколько серебряных монет у тебя на закупку снаряжения или про запас в кошельке. Стартовые комплекты обычно дают больше снаряжения, чем случайный бросок, но предметы можно менять на усмотрение Мастера."},{"n":"1.7.8","l":3,"te":"Record Weapon and Armor Statistics","tr":"Запиши характеристики оружия и брони","en":"Now that you know what kind of weaponry or armor your hero has,\ntake a moment to record the total hit bonus for your weaponry. This \nis equal to your base attack bonus plus your relevant Stab, Shoot, \nor Punch skill, and the relevant attribute modifier for the weapon \ngiven on the weapon table. If two attributes are listed for a weapon, \nuse whichever is better for you. If you lack even level-0 skill in the \nweapon, take a -2 hit penalty with it.\nFor each weapon’s damage and Shock, note down the informa-\ntion from the table. You add your attribute modifier to both damage \nrolls and Shock. Punch weapons or unarmed attacks can also add \nyour Punch skill.\nFor your PC’s Armor Class, record the AC of the armor you usually \nwear. Unarmored humans have an AC of 10. Armor Class is modified \nby your Dexterity modifier.","ru":"Теперь, когда известно, каким оружием и бронёй владеет твой герой, удели минуту и запиши суммарный бонус атаки для своего оружия. Он равен базовому бонусу атаки плюс соответствующий навык Клинок, Стрельба или Кулак, плюс модификатор характеристики, указанной для оружия в оружейной таблице. Если для оружия указаны две характеристики, используй ту, что для тебя выгоднее. Если у тебя нет даже уровня-0 навыка этого оружия, получай с ним штраф -2 к атаке.\n\nДля урона и Шока каждого оружия выпиши данные из таблицы. Модификатор характеристики ты добавляешь и к броскам урона, и к Шоку. Оружие Кулака и рукопашные атаки могут также добавлять твой навык Кулак.\n\nДля Класса защиты своего ПИ запиши КЗщ брони, которую обычно носишь. У человека без брони КЗщ 10. Класс защиты изменяется модификатором Ловкости."},{"n":"1.7.9","l":3,"te":"Choose a Name and Goal","tr":"Выбери имя и цель","en":"As final step, the player should pick a name and initial goal for the \nPC. This goal can be anything so long as it gives a compelling reason \nfor the PC to be seeking perilous adventure and associating with \nsuspicious fellows. The player must make up a good reason for the \nPC to be associating with the other players; it is not the GM’s job to \njustify the party’s existence, and if the player decides that their PC \ncan’t reasonably run with the other party members it’s up to them to \ncreate a new character who can.","ru":"Последним шагом игроку следует выбрать имя и начальную цель для ПИ. Цель может быть любой, лишь бы она давала убедительную причину искать опасных приключений и водиться с подозрительными типами. Игрок обязан придумать хорошую причину, зачем его ПИ держится вместе с другими игроками; оправдывать существование отряда — не работа Мастера, и если игрок решил, что его ПИ не может разумно бегать с остальными членами отряда, то ему самому и создавать нового персонажа, который может."},{"n":"2.0.0","l":1,"te":"The Rules of the Game","tr":"Правила игры","en":"This section summarizes the rules of the game. They are intended to be \nfunctional for the average play group with typical needs; individual \nGMs may find it useful to alter them based on the specific interests \nor makeup of their own player group.","ru":"В этом разделе собраны правила игры. Они рассчитаны на среднюю компанию с обычными запросами; отдельным Мастерам может быть полезно изменить их под конкретные интересы или состав своей группы."},{"n":"2.1.0","l":2,"te":"Scenes, Rounds, and Mission Time","tr":"Сцены, раунды и ходы","en":"During play, three special measures of time are used: scenes, rounds, \nand mission time.","ru":"В игре используются три особые меры времени: сцены, раунды и ходы."},{"n":"2.1.1","l":3,"te":"Scenes","tr":"Сцены","en":"A scene is a time measurement used to determine how often certain \nabilities or actions can be taken. Some powers can be triggered \nonly so many times per scene, while some special abilities only work \nonce per scene.\nA scene is one particular fight, event, activity, or effort that usually \ndoesn’t take more than ten or fifteen minutes. A fight is a scene. A \nchase is a scene. A tense backroom negotiation is a scene. So long \nas the PCs are doing the same general activity in the same general \nlocation, it’s probably one scene. Most scenes don’t last more than \nfifteen minutes, though a GM can stretch this if it seems logical.","ru":"Сцена — мера времени, которой определяют, как часто можно использовать те или иные способности или действия. Одни способности можно запускать лишь столько-то раз за сцену, а некоторые особые способности работают только раз за сцену.\nСцена — это один конкретный бой, событие, занятие или усилие, которое обычно не занимает больше десяти-пятнадцати минут. Бой — это сцена. Погоня — это сцена. Напряжённые переговоры в задней комнате — это сцена. Пока ПИ занимаются одним и тем же делом в одном и том же месте, это, скорее всего, одна сцена. Большинство сцен не длится дольше пятнадцати минут, но Мастер может растянуть это, если так логичнее."},{"n":"2.1.2","l":3,"te":"Rounds","tr":"Раунды","en":"Combat is made up of rounds, each one lasting approximately six \nseconds. A single combat may involve multiple rounds of action. A \nround begins with the actions of the side that wins initiative and ends \nafter the actions of the side that lost initiative.","ru":"Бой состоит из раундов, каждый примерно по шесть секунд. Один бой может включать несколько раундов действий. Раунд начинается с действий стороны, победившей в инициативе, и заканчивается после действий стороны, которая инициативу проиграла."},{"n":"2.1.3","l":3,"te":"Turns","tr":"Ходы","en":"Sometimes it’s important to track the time of a more complex opera-\ntion, like exploring a dungeon or navigating the trackless depths of \nsome ancient ruin. In such cases, the turn is a common measure of \ntime. Each turn lasts ten minutes and is equivalent to one scene for \nthose situations when it matters.","ru":"Иногда важно отслеживать время более сложного предприятия — например, исследования подземелья или блужданий по непроходимым глубинам древних руин. В таких случаях обычная мера времени — ход. Каждый ход длится десять минут и приравнивается к одной сцене там, где это имеет значение."},{"n":"2
