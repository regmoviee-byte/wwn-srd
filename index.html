И растёт согласно его уровню и выбранному классу."},{"n":"2.7.1.4","l":4,"te":"Gaining and Spending Skill Points","tr":"Получение и трата пунктов навыков","en":"A PC who advances a level gains three skill points they can spend on improving their skills or save to spend later. Experts and Partial Experts with the Quick Learner class ability gain an extra bonus skill point to spend, giving them four points each time they advance.\nSkills that are gained or improved immediately on gaining a level are assumed to have been perfected over the past level and require no training time or teaching. If they save their skill points to spend them later then they’ll need to find some teacher or other explanation for developing them in the meanwhile.\nThe cost for improving a skill is listed below. Every skill level must be purchased in order; to gain level-1 in a skill you need to pay one point for level-0 and then two points for level-1. A PC must be the requisite minimum level to increase a skill to certain levels. Less hardened adventurers simply don’t have the focus and real-life experience to attain such a pitch of mastery.\nA PC cannot “partially buy” a skill level. If they don’t have enough skill points to buy a new level, they need to save them up until they can. A PC cannot develop skills beyond level-4.\n| Skill | Point | Min. |\n|---|---|---|\n| Level | Cost | Character Level |\n| 0 | 1 | 1 |\n| 1 | 2 | 1 |\n| 2 | 3 | 3 |\n| 3 | 4 | 6 |\n| 4 | 5 | 9 |","ru":"ПИ, поднявшийся на уровень, получает три пункта навыков, которые может потратить на улучшение навыков или отложить на потом. Эксперты и частичные Эксперты с классовой способностью «Схватывает на лету» получают один дополнительный бонусный пункт навыка — по четыре пункта за каждый подъём.\n\nСчитается, что навыки, взятые или улучшенные сразу при подъёме уровня, оттачивались весь прошлый уровень и не требуют ни времени на обучение, ни учителя. Если же ПИ приберёг пункты навыков, чтобы потратить их позже, ему понадобится найти наставника или другое объяснение тому, откуда взялись новые умения.\n\nСтоимость улучшения навыка указана ниже. Каждый уровень навыка должен покупаться по порядку: чтобы получить в навыке уровень-1, нужно заплатить один пункт за уровень-0 и затем два пункта за уровень-1. Для повышения навыка до определённых уровней ПИ должен иметь требуемый минимальный уровень персонажа. Недостаточно закалённым искателям приключений попросту не хватает собранности и жизненного опыта, чтобы достичь такой высоты мастерства.\n\nПИ не может «купить уровень навыка частично». Если пунктов навыков на новый уровень не хватает, придётся копить, пока не наберётся. Развить навык выше уровня-4 нельзя.\n\n| Уровень навыка | Стоимость в пунктах | Мин. уровень персонажа |\n|---|---|---|\n| 0 | 1 | 1 |\n| 1 | 2 | 1 |\n| 2 | 3 | 3 |\n| 3 | 4 | 6 |\n| 4 | 5 | 9 |"},{"n":"2.7.1.5","l":4,"te":"Improving Attributes","tr":"Повышение характеристик","en":"A PC may optionally choose to use their new skill points to improve their attribute scores.\nThe first time a PC improves an attribute, it costs 1 skill point and adds +1 to an attribute of their choice. The second improvement to their attributes costs 2 skill points, the third 3, and so forth. Each improvement adds +1 to the attribute, potentially improving its modifier. A PC can only ever make five such improvements total; not five per attribute.\nPCs must be third level before buying their third boost, sixth level before buying their fourth boost, and ninth level before buying their fifth boost. No more than five attribute boosts can ever be purchased by a PC.","ru":"ПИ может по желанию тратить новые пункты навыков на улучшение значений своих характеристик.\n\nПервое улучшение характеристики стоит 1 пункт навыка и добавляет +1 к характеристике по выбору. Второе улучшение характеристик стоит 2 пункта навыков, третье — 3 и так далее. Каждое улучшение добавляет к характеристике +1 и может улучшить её модификатор. Всего ПИ может сделать не больше пяти таких улучшений — пяти вообще, а не пяти на характеристику.\n\nТретье повышение ПИ может купить не раньше третьего уровня, четвёртое — не раньше шестого, а пятое — не раньше девятого. Больше пяти повышений характеристик ПИ не купит никогда."},{"n":"2.7.1.6","l":4,"te":"Choosing a new Focus","tr":"Выбор нового Фокуса","en":"Finally, the PC might be eligible to pick an additional level in a Focus. At levels 2, 5, 7, and 10 a PC can add a level to an existing Focus or pick up the first level in a new Focus.\nIf this is the first level they’ve taken in the Focus, they might be granted a skill as a free bonus pick, depending on the Focus’ benefits. During character creation, this bonus skill pick is treated like any other skill pick. If the Focus is taken as part of advancement, however, it instead counts as three skill points spent toward increasing the skill. This is enough to raise a nonexistent skill to level-1, or boost a level-1 skill to level-2. They may do this even if they aren’t high-enough level to normally qualify for a skill level that high.\nIf the skill points aren’t quite enough to raise the skill to a new level, they remain as credit toward future advances. If applied to a skill that is already at level-4, the PC can spend the three skill points on any other skill of their choice.","ru":"Наконец, ПИ может получить право взять дополнительный уровень Фокуса. На уровнях 2, 5, 7 и 10 ПИ может добавить уровень к уже имеющемуся Фокусу или взять первый уровень нового.\n\nЕсли это первый уровень данного Фокуса, персонажу может полагаться навык в качестве бесплатного бонусного выбора — в зависимости от преимуществ Фокуса. При создании персонажа такой бонусный навык считается обычным выбором навыка. Но если Фокус взят в ходе развития, он вместо этого считается тремя пунктами навыков, потраченными на повышение этого навыка. Этого хватает, чтобы поднять отсутствующий навык до уровня-1 или навык уровня-1 — до уровня-2. Это разрешено, даже если уровень персонажа обычно не позволяет взять столь высокий уровень навыка.\n\nЕсли этих пунктов навыков не хватает, чтобы поднять навык на новый уровень, они сохраняются как задел на будущие повышения. Если они приходятся на навык, уже достигший уровня-4, ПИ может потратить эти три пункта навыков на любой другой навык по своему выбору."},{"n":"2.7.1.7","l":4,"te":"Learning New Spells and Arts","tr":"Изучение новых заклинаний и Искусств","en":"Mage characters capable of spellcasting learn new spells when they advance a level. High Mages and Full Invokers learn two new High Magic spells they are capable of casting. All other spellcasting mages learn one spell they can cast, either from High Magic or their own specialist spells.\nMages who use arts may also gain a new art pick, depending on their class. Each such class has a table that lists the schedule for gaining new arts.","ru":"Персонажи-Маги, способные к чтению заклинаний, выучивают новые заклинания при подъёме уровня. Высшие маги и полные Волхвы выучивают два новых посильных им заклинания Высшей магии. Все прочие колдующие маги выучивают одно заклинание, которое способны читать, — из Высшей магии или из заклинаний собственной специальности.\n\nМаги, использующие Искусства, могут также получить новый выбор Искусства — в зависимости от класса. У каждого такого класса есть таблица с расписанием получения новых Искусств."},{"n":"2.8.0","l":2,"te":"Crafting and Modifying Gear","tr":"Изготовление и модификация снаряжения","en":"Any Expert or Partial Expert PC with at least Craft-1 skill, or any PC with the Artisan Focus, can modify equipment with ancient salvage. Their crafting background does not need to precisely match the gear they’re modifying; the basic principles of using ancient salvage are the same among all disciplines.","ru":"Любой ПИ — Эксперт или частичный Эксперт — с навыком не ниже Ремесло-1, а также любой ПИ с Фокусом «Ремесленник» может модифицировать снаряжение древним утилём. Его ремесленный профиль не обязан точно совпадать с модифицируемым снаряжением: базовые принципы работы с древним утилём одни во всех дисциплинах."},{"n":"2.8.1","l":3,"te":"Crafting Gear","tr":"Изготовление снаряжения","en":"An artisan requires a workshop that could plausibly build the gear in question. This may be nothing more than a sharp knife for a simple device, or a full-fledged alchemy lab for others. They also require a plausible source of parts for the device. This is usually a given if in a city or other salvage-rich area, but it may not be practical in a wilderness.\nBuilding gear takes a month for a wagon-sized vehicle or a week for a weapon, suit of armor, or other portable complex device. Very simple devices may be built faster at the GM’s discretion.\nCrafted gear is made at three levels of quality. Jury-rigged gear takes one-half the time to build and costs one-quarter the market cost in parts. If scrap salvage is available it can be built at no cost but normal build times. As an improvised device, it counts as a mod requiring Craft-0 to keep functional, as explained below in the mod maintenance rules. If it goes 24 hours without maintenance, it stops functioning. Jury-rigged devices cannot be further modded.\nNormal devices cost the same amount in parts as the market cost and take the normal amount of time to build. They cannot be built with salvaged parts unless the GM decides the salvage is perfectly suited for it. Consumable devices such as torches must be crafted as normal devices rather than jury-rigged or mastercrafted ones.\nMastercrafted devices cost ten times as much in parts as the usual market cost and take twice as long to build. They are ideal platforms for an artisan’s mods, however, and the first mod their creator installs in them requires no maintenance. Mastercrafted weapons grant a +1 to hit. Mastercrafted armor counts as 1 fewer point of encumbrance, down to a minimum of 1 point. This lightening does not affect the armor’s suitability for a user of the Armored Magic Focus.","ru":"Ремесленнику нужна мастерская, в которой правдоподобно можно построить нужное снаряжение. Для простого устройства это может быть всего лишь острый нож, для иных — полноценная алхимическая лаборатория. Нужен и правдоподобный источник деталей для устройства. В городе или другом богатом утилём месте это обычно само собой разумеется, а вот в дикой глуши может оказаться недостижимым.\n\nПостройка занимает месяц для машины размером с повозку и неделю для оружия, доспеха или другого переносного сложного устройства. Совсем простые вещи, на усмотрение Мастера, можно делать быстрее.\n\nИзготовленное снаряжение бывает трёх уровней качества. Снаряжение, собранное на скорую руку, требует половины времени постройки и четверти рыночной цены в деталях. Если под рукой есть бросовый утиль, его можно собрать вовсе бесплатно, но за обычное время. Как самоделка, оно считается модом, требующим Ремесло-0 для поддержания в рабочем состоянии, по правилам обслуживания модов ниже. Оставшись без обслуживания на 24 часа, оно перестаёт работать. Собранные на скорую руку устройства нельзя дополнительно модифицировать.\n\nОбычные устройства стоят в деталях столько же, сколько на рынке, и строятся обычное время. Их нельзя собирать из утиля, если только Мастер не решит, что утиль подходит идеально. Расходные предметы вроде факелов изготавливаются только как обычные устройства — ни на скорую руку, ни мастерски.\n\nМастерски изготовленные устройства стоят в деталях вдесятеро дороже обычной рыночной цены и строятся вдвое дольше. Зато они — идеальная платформа для модов ремесленника: первый мод, установленный в них создателем, не требует обслуживания. Мастерски изготовленное оружие даёт +1 к попаданию. Мастерски изготовленная броня считается на 1 пункт загруженности легче, но не ниже минимума в 1 пункт. Это облегчение не влияет на пригодность брони для носителя Фокуса «Магия в доспехах»."},{"n":"2.8.2","l":3,"te":"Modifying Gear","tr":"Модификация снаряжения","en":"Crafted or purchased gear can be modified by a skilled artisan. Crafting mods also requires a minimum Fix skill. Without this skill level the tech cannot install the mod or maintain it afterwards.\nCrafting and installing mods has a cost in silver and sometimes in arcane salvage. The latter consists of rare monster parts, esoteric materials, and exotic components that cannot normally be bought on the open market, but must be acquired by adventuring or in payment from patrons. Arcane salvage is generic in nature; a given piece can be used in any mod that requires salvage.\nIt takes one week per minimum skill level of the mod to build and install it. Thus, if the mod requires Craft-1 skill, it takes one week. If the artisan has an assistant with at least Craft-0 skill, this time is halved. If they do nothing but eat, sleep, and work, this time is further halved.","ru":"Изготовленное или купленное снаряжение может модифицировать умелый ремесленник. Для изготовления модов также нужен минимальный навык Ремесла. Без этого уровня навыка техник не может ни установить мод, ни обслуживать его потом.\n\nИзготовление и установка модов стоят серебра, а иногда и чародейного утиля. Последний состоит из редких частей чудовищ, эзотерических материалов и экзотических компонентов, которые обычно не купишь на открытом рынке: их добывают в приключениях или получают в уплату от покровителей. Чародейный утиль универсален: любой его кусок годится в любой мод, требующий утиля.\n\nПостройка и установка мода занимает одну неделю за каждый уровень его минимального навыка. Так, мод с требованием Ремесло-1 занимает одну неделю. Если у ремесленника есть помощник с навыком хотя бы Ремесло-0, время сокращается вдвое. Если он не делает ничего, кроме как ест, спит и работает, время сокращается вдвое ещё раз."},{"n":"2.8.3","l":3,"te":"Maintaining Mods","tr":"Обслуживание модов","en":"Mods normally require maintenance to keep functioning correctly, and a given artisan can maintain only so many mods at once. An artisan can only maintain mods they have the requisite skill levels to build.\nAn artisan’s maximum maintenance score is equal to the total of their Intelligence and Constitution modifiers plus three times their Craft skill level. Thus, a tech with a +1 Intelligence mod, a -1 Constitution mod and Craft-1 could maintain up to three mods at any one time.\nMaintenance is assumed to take place during downtime and does not require any significantly expensive components. If an artisan does nothing but maintain mods, they can double their allowed number. Such work assumes sixteen-hour workdays.\nIf a mod goes without maintenance for 24 hours, it stops working. If it goes without maintenance for a week, the item it’s attached to stops working, becoming dangerous or ineffective to use. A maintenance backlog on an item can be cleared by an hour’s work by an artisan capable of maintaining it.","ru":"Моды обычно требуют обслуживания, чтобы работать исправно, и один ремесленник может обслуживать лишь ограниченное число модов сразу. Ремесленник может обслуживать только те моды, на постройку которых у него хватает уровней навыка.\n\nМаксимальный предел обслуживания ремесленника равен сумме его модификаторов Интеллекта и Телосложения плюс утроенный уровень навыка Ремесло. Так, техник с модификатором Интеллекта +1, модификатором Телосложения -1 и Ремеслом-1 может обслуживать до трёх модов одновременно.\n\nСчитается, что обслуживание идёт во время простоя и не требует сколько-нибудь дорогих компонентов. Если ремесленник не делает ничего, кроме обслуживания модов, он может удвоить их допустимое число. Такая работа предполагает шестнадцатичасовой рабочий день.\n\nЕсли мод остался без обслуживания на 24 часа, он перестаёт работать. Если без обслуживания прошла неделя, перестаёт работать сам предмет, к которому мод прикреплён: пользоваться им становится опасно или бесполезно. Накопившийся долг по обслуживанию предмета снимается часом работы ремесленника, способного его обслуживать."},{"n":"2.8.4","l":3,"te":"Example Modifications","tr":"Примеры модификаций","en":"The mods listed here are merely some of the possibilities for using ancient salvage or large amounts of costly mundane materials. These mods are almost never available on the open market due to the rarity of usable salvage and the difficulty of maintaining the gear. Acquiring the salvage needed to make them usually means finding it as part of an adventure, receiving it in payment from a patron, or setting out on specific expeditions to find it.\nMultiple modifications can stack, but cannot increase a hit, AC, or damage bonus above +3, or a skill check bonus above +1. Magical and masterwork weapons and armor can be modified, but mods can’t improve them above this cap.\n**Arrow Storm (Craft-2):** A bow or other projectile weapon automatically generates its own ammunition, albeit the conjured projectiles vanish a round after firing. This mod does not increase reload speed. Cost: One unit of salvage and 5,000 silver pieces.\n**Assassin’s Trinket (Craft-2):** A one-handed weapon is modified to adopt the shape of some item of jewelry or adornment. It can be shifted to or from this shape by the owner as an On Turn action. Cost: One unit of salvage and 1,000 silver pieces.\n**Augmented Gear (Craft-1):** A tool, medical kit, or other item of equipment is improved for a specific purpose chosen at the time of augmentation. Skill checks made for that purpose gain a +1 skill bonus with the item. Cost: One unit of salvage and 5,000 silver pieces.\n**Automatic Reload (Craft-2):** A hurlant can be modified to reload itself, if ammunition is available. Once per scene, a man-portable hurlant can be reloaded as an On Turn action. Cost: Two units of salvage and 10,000 silver pieces.\n**Customized (Craft-1):** The weapon or suit of armor has been carefully tailored for a specific user. When used by them, they gain a +1 to hit with the weapon or +1 Armor Class with the armor. This mod doesn’t work with shields. Cost: 1,000 silver pieces.\n**Flying Razor (Craft-1):** A throwing weapon is imbued with various esoteric materials, allowing it to return to the hand of its thrower after each attack. Cost: One unit of salvage and 5,000 silver pieces.\n**Harmonized Aegis (Craft-3):** A suit of armor is altered to harmonize with the dangerous sorceries of allied casters. Provided the wearer and the caster have had ten minutes to coordinate the protection, the wearer is unharmed by the caster’s harmful spells for the rest of the day, even if caught in their area of effect. Cost: One unit of salvage and 10,000 silver pieces.\n**Long Arm (Craft-2):** A ranged or thrown weapon is modified to double its normal and maximum ranges. Cost: One unit of salvage and 5,000 silver pieces.\n**Manifold Mail (Craft-2):** A suit of armor is augmented to allow it to shift its appearance to any of five or six pre-set choices, mimicking normal clothing or other armor types as an On Turn action. The armor’s Encumbrance or other statistics are not altered. Cost: One unit of salvage, 5,000 silver pieces.\n**Omened Aim (Craft-2):** Occult components improve a ranged or thrown weapon’s targeting, adding +1 to hit rolls. Cost: 4,000 silver pieces.\n**Preserving Grace (Craft-1):** A suit of clothing or armor is specially altered to preserve the wearer. Once per week, when the wearer is Mortally Wounded, they will automatically stabilize. Cost: One unit of salvage and 5,000 silver pieces.\n**Razor Edge (Craft-2):** A weapon has been given an improved edge or shifting weight system, adding +2 to the damage and Shock it does, albeit requiring far more care. Cost: One unit of salvage and 5,000 silver pieces.\n**Tailored Harness (Craft-2):** A suit of armor is altered to perfectly fit a single wearer, decreasing its effective Encumbrance by 1 for them only. This does not affect skill check penalties or the Armored Magic Focus. Cost: 5,000 silver pieces.\n**Thirsting Blade (Craft-3):** A weapon is imbued with a fated inclination to harm, adding +1 to hit rolls. Cost: Two units of salvage and 10,000 silver pieces.","ru":"Перечисленные здесь моды — лишь часть возможностей, которые открывают древний утиль или большие объёмы дорогих обычных материалов. На открытом рынке этих модов почти не бывает: пригодный утиль редок, а поддерживать такое снаряжение трудно. Добыть утиль для них обычно значит найти его в приключении, получить в уплату от покровителя или отправиться за ним в отдельную экспедицию.\n\nНесколько модификаций складываются, но не могут поднять бонус к попаданию, КЗщ или урону выше +3, а бонус к проверкам навыка — выше +1. Магическое и мастерски изготовленное оружие и броню модифицировать можно, но моды не поднимут их выше этого предела.\n\n**Безделушка убийцы (Ремесло-2):** Одноручное оружие переделано так, чтобы принимать форму какого-нибудь украшения или убора. Владелец может обращать его в эту форму и обратно Действием в свой ход. Цена: одна единица утиля и 1 000 серебряных монет.\n\n**Бритвенная кромка (Ремесло-2):** Оружие получило улучшенную заточку или систему смещения веса: +2 к наносимым им урону и Шоку, но ухода оно требует куда более тщательного. Цена: одна единица утиля и 5 000 серебряных монет.\n\n**Вещий прицел (Ремесло-2):** Оккультные компоненты улучшают прицел стрелкового или метательного оружия: +1 к броскам на попадание. Цена: 4 000 серебряных монет.\n\n**Длинная рука (Ремесло-2):** Стрелковое или метательное оружие переделано так, что его обычная и максимальная дистанции удвоены. Цена: одна единица утиля и 5 000 серебряных монет.\n\n**Жаждущий клинок (Ремесло-3):** Оружие проникнуто роковой тягой к причинению вреда: +1 к броскам на попадание. Цена: две единицы утиля и 10 000 серебряных монет.\n\n**Индивидуальная подгонка (Ремесло-1):** Оружие или доспех тщательно подогнаны под конкретного пользователя. В его руках оружие даёт +1 к попаданию, а доспех — +1 к Классу защиты. Со щитами этот мод не работает. Цена: 1 000 серебряных монет.\n\n**Летучая бритва (Ремесло-1):** Метательное оружие насыщено разнообразными эзотерическими материалами и после каждой атаки возвращается в руку метнувшего. Цена: одна единица утиля и 5 000 серебряных монет.\n\n**Ливень стрел (Ремесло-2):** Лук или иное стрелковое оружие само порождает себе боеприпасы, хотя сотворённые снаряды исчезают через раунд после выстрела. Скорость перезарядки этот мод не повышает. Цена: одна единица утиля и 5 000 серебряных монет.\n\n**Многоликая броня (Ремесло-2):** Доспех дополнен так, что может Действием в свой ход менять облик на любой из пяти-шести заранее заданных вариантов, подражая обычной одежде или другим типам брони. Загруженность и прочие характеристики доспеха не меняются. Цена: одна единица утиля, 5 000 серебряных монет.\n\n**Подогнанная сбруя (Ремесло-2):** Доспех идеально подогнан под одного-единственного носителя: действующая Загруженность снижена на 1 — для него и только для него. На штрафы к проверкам навыков и Фокус «Магия в доспехах» это не влияет. Цена: 5 000 серебряных монет.\n\n**Самоперезарядка (Ремесло-2):** Болтомёт можно переделать так, чтобы он перезаряжался сам, пока есть боеприпасы. Раз за сцену переносной болтомёт можно перезарядить Действием в свой ход. Цена: две единицы утиля и 10 000 серебряных монет.\n\n**Согласованная эгида (Ремесло-3):** Доспех перестроен в лад с опасным чародейством союзных колдующих. Если носитель и колдующий потратили десять минут на согласование защиты, вредоносные заклинания этого колдующего до конца дня не причиняют носителю вреда — даже если он попал в их область действия. Цена: одна единица утиля и 10 000 серебряных монет.\n\n**Улучшенное снаряжение (Ремесло-1):** Инструмент, сумка лекаря или другой предмет снаряжения улучшен под конкретную задачу, выбранную в момент улучшения. Проверки навыка ради этой задачи получают с этим предметом бонус +1. Цена: одна единица утиля и 5 000 серебряных монет.\n\n**Хранящая благодать (Ремесло-1):** Одежда или доспех особым образом переделаны, чтобы беречь носителя. Раз в неделю, когда носитель становится смертельно раненным, он стабилизируется автоматически. Цена: одна единица утиля и 5 000 серебряных монет."},{"n":"2.9.0","l":2,"te":"Encumbrance","tr":"Загруженность","en":"Gear has encumbrance, measured in points, as exampled in the table below. The more awkward or bulky the object, the greater the encumbrance. The GM adjudicates ambiguous objects.\n| Gear |  |  |  | Encumbrance |\n|---|---|---|---|---|\n| Portable in a small pocket |  |  | 0 (Any reasonable |  |\n|  |  |  |  | number can be carried) |\n| Portable in one hand |  |  | 1 |  |\n| Requires two hands to carry or use it |  | 2 |  |  |\n| Requires a whole-body effort to haul it | 5+ |  |  |  |\n| Dragging an unconscious teammate |  | 12 |  |  |\nGear is either Stowed or Readied. Stowed gear is packed away carefully in pockets, packs, and harnesses. It’s easier to carry but harder to quickly access. Using Stowed gear requires that the bearer take a Main Action to pull it out before using it. Readied gear is carried in hands, holsters, quick-access pockets, or other easily-accessible places. It can be used as part of an action without any further preparation.\nA character can carry a total number of Stowed encumbrance points equal to their Strength score. They can carry a number of Readied points equal to half their Strength, rounded down. Thus, a PC with a Strength score of 11 could carry 11 points of Stowed gear and 5 points of Readied.\nPCs can haul much heavier objects if necessary. If they push their limits for longer terms, they can carry an additional two Ready and four Stowed items. The first time they do this, their Move speed is cut by 30%, from 30 feet to 20 feet. The second time, it’s cut by 50%, from 20 feet to 10 feet. More weight than this can’t be practically hauled over significant distances.","ru":"У снаряжения есть загруженность, измеряемая в пунктах, как показано на примерах в таблице ниже. Чем неудобнее и громоздче предмет, тем выше загруженность. Спорные предметы оценивает Мастер.\n\n| Снаряжение | Загруженность |\n|---|---|\n| Помещается в небольшой карман | 0 (можно нести любое разумное количество) |\n| Можно нести в одной руке | 1 |\n| Нести или использовать нужно двумя руками | 2 |\n| Тащить приходится всем телом | 5+ |\n| Волочить союзника без сознания | 12 |\n\nСнаряжение находится либо в укладке, либо в готовности. Снаряжение в укладке аккуратно упаковано по карманам, заплечным мешкам и ремням: его легче нести, но труднее быстро достать. Чтобы применить предмет из укладки, носителю нужно сперва потратить Основное действие и вытащить его. Снаряжение в готовности носят в руках, кобурах, быстрых карманах и прочих легкодоступных местах. Его можно применить как часть действия без всякой дополнительной подготовки.\n\nПерсонаж может нести суммарно пункты загруженности в укладке, равные своему значению Силы, и пункты в готовности, равные половине Силы с округлением вниз. Так, ПИ с Силой 11 может нести 11 пунктов снаряжения в укладке и 5 пунктов в готовности.\n\nПри необходимости ПИ могут волочь куда более тяжёлые грузы. Работая на пределе подолгу, они могут нести дополнительно два предмета в готовности и четыре в укладке. В первый раз их скорость перемещения урезается на 30% — с 30 футов до 20. Во второй раз — на 50%, с 20 футов до 10. Больший вес на сколько-нибудь значимые расстояния практически не утащить."},{"n":"2.9.1","l":3,"te":"Bundled Gear","tr":"Комплекты снаряжения","en":"Small, regularly-shaped objects such as oil flasks, potion bottles, rations, and torches can be wrapped into bundles for easier portability. Three such items can be tied into a bundle that only counts as one item of encumbrance. Breaking into this bundle takes an extra Main Action, however.","ru":"Небольшие предметы правильной формы — фляги с маслом, бутылочки с зельями, пайки, факелы — можно увязывать в комплекты для удобства переноски. Три таких предмета связываются в комплект, который считается всего одним предметом загруженности. Однако чтобы вскрыть такой комплект, нужно дополнительное Основное действие."},{"n":"2.9.2","l":3,"te":"Bulk Weights","tr":"Вес по объёму","en":"Sometimes the PCs need to transport bulk amounts of goods that are measured in pounds. When it’s necessary to convert these weights into encumbrance points, a GM can just assume that fifty pounds is worth about ten points of encumbrance to a PC hauling a pack out on their back.\nWhen judging the ability of a vehicle to carry encumbrance points of cargo, it can be assumed that a wagon can carry as much as the PCs need it to carry, within reason.","ru":"Иногда ПИ нужно перевозить грузы, которые меряются фунтами. Когда нужно перевести эти веса в пункты загруженности, Мастер может просто считать, что пятьдесят фунтов — это около десяти пунктов загруженности для ПИ, тащащего тюк на спине.\n\nОценивая, сколько пунктов загруженности груза увезёт транспорт, можно считать, что повозка увозит столько, сколько нужно ПИ, — в разумных пределах."},{"n":"2.9.3","l":3,"te":"Games Without Encumbrance","tr":"Игра без Загруженности","en":"Not all groups like to track encumbrance or deal with the logistics of an adventuring expedition. If the GM so elects, then PCs can carry and Ready whatever amount of gear the GM thinks is reasonable. In such cases the GM should check over character sheets before each adventure to make sure reason is not outraged.","ru":"Не всем группам нравится отслеживать загруженность и возиться с логистикой экспедиции. Если Мастер так решил, ПИ могут носить и держать в готовности столько снаряжения, сколько Мастер сочтёт разумным. В таком случае Мастеру стоит проглядывать листы персонажей перед каждым приключением — чтобы здравый смысл не был поруган."},{"n":"2.10.0","l":2,"te":"Falling and Other Hazards","tr":"Падение и другие опасности","en":"Some perils occur with some regularity for adventurers. A few of the most common are detailed here.\n**Falling:** Most creatures will take 1d6 damage per 10 full feet they fall, up to 20d6 maximum. Spikes or other hazardous terrain at the bottom will add at least 1d6 to the total. A creature that intentionally leaps or skids down in a controlled way may make a Dex or Str/Exert skill check at a difficulty of 7 + 1 for every 10 full feet; on a success, the effective distance fallen is halved.\n**Suffocation:** Creatures can fight or act normally without air for one round per point of Constitution, or 10 rounds for most NPCs. If they don’t move, they can quadruple this time. Once they run out of air, they must make a Physical save each round or take 1 hit point of damage per HD or level they have.\n**Poisons:** Typical dungeon poisons found crusted on needle traps force a Physical save or a loss of half the victim’s maximum hit points. Very potent ones might kill a victim outright. Those who die due to poison damage usually take at least 1d6 minutes to actually expire, but are helpless in the meanwhile. An antidote applied during this time can revive them with 1 hit point. A skilled healer can try to counteract the toxin with an Int/Heal skill check at a difficult of at least 10 for most poisons, or 12 or more for truly fearsome ones.\nAside from any hit point damage a poison does, many also have lingering side effects, such as penalties to hit rolls or skill checks, or the loss of Move actions for a certain period of time. Some also add System Strain to the victim due to the stress they put on their bodies. A victim forced above their maximum System Strain will collapse and die in minutes if the poison is not neutralized.","ru":"Некоторые опасности случаются с искателями приключений с завидной регулярностью. Несколько самых частых разобраны здесь.\n\n**Падение:** Большинство существ получает 1d6 урона за каждые полные 10 футов падения, максимум до 20d6. Шипы или другой опасный рельеф внизу добавят к сумме как минимум 1d6. Существо, которое намеренно прыгает или съезжает вниз, контролируя спуск, может сделать проверку Лов или Сил/Атлетика со сложностью 7 + 1 за каждые полные 10 футов; при успехе действующая высота падения уполовинивается.\n\n**Удушье:** Существа могут драться и действовать без воздуха один раунд за каждый пункт Телосложения, или 10 раундов для большинства NPC. Если не двигаться, это время учетверяется. Когда воздух кончается, они каждый раунд должны делать Физический спасбросок — или получать 1 пункт урона за каждую свою КЗд или уровень.\n\n**Яды:** Типичные подземельные яды, засохшие коркой на игольчатых ловушках, требуют Физического спасброска — иначе жертва теряет половину максимума пунктов здоровья. Особо сильные могут убить на месте. Умирающие от яда обычно испускают дух не раньше чем через 1d6 минут и всё это время беспомощны. Противоядие, применённое за это время, возвращает их к жизни с 1 пунктом здоровья. Умелый лекарь может попытаться нейтрализовать токсин проверкой Инт/Медицина со сложностью не меньше 10 для большинства ядов и 12 и выше — для по-настоящему страшных.\n\nПомимо урона пунктам здоровья многие яды оставляют долгие побочные эффекты: штрафы к броскам на попадание или проверкам навыков, потерю Действий перемещения на какой-то срок. Некоторые ещё и добавляют жертве Системную нагрузку — так тяжело они бьют по телу. Жертва, выведенная за свой максимум Системной нагрузки, свалится и умрёт за считаные минуты, если яд не нейтрализовать."},{"n":"2.11.0","l":2,"te":"Overland Travel","tr":"Путешествие по суше","en":"PCs can generally travel for ten hours a day in most seasons, the rest being absorbed in rest, camp construction, and incidental activities. For each hour of travel they can cross as many miles of a given terrain as listed in the table. This travel presumes that the PCs are moving directly toward their destination and not taking any particular time to scout the area for points of interest or investigate their surroundings. This rate of travel also assumes average walking or wagon speeds; horses can be used by their riders for quick bursts of speed to chase or avoid others, but don’t increase the average travel rate much.\n\nFor every day of travel and every night of camping outdoors, the GM rolls one die for a wandering encounter check. The die used will depend on the terrain, with safer or more peaceful lands using a larger die size. On a 1, the PCs come upon creatures or a situation that requires their attention.\n\nAssuming it’s not an ambush or a sudden encounter in an obscured area, the groups usually encounter each other at maximum sight range. An opposed Wis/Notice check can be used to determine who spots who first; PCs who get the edge can usually avoid the other group automatically if they have sufficient cover.\n\n| Terrain Type | Miles per Hour |\n|---|---|\n| Plains or savannas | 3 |\n| Light forest or desert | 2 |\n| Dense forest or rugged hills | 1.5 |\n| Swamp or marsh | 1 |\n| Mountains or dire wastelands | 0.5 |\n| There is a road through the terrain | x2* |\n| Foul weather, mud, or heavy rain | x0.5 |\n| Deep snow on the ground | x0.1 |\n| * Good roads cannot increase the party’s three miles per hour. | marching speed above |\n\nPCs traveling with a caravan or riding a well-stocked travel wagon need not concern themselves with details of food, drink, and shelter, but PCs who plan on making an overland expedition without these ready comforts should consult the rules for overland exploration for details on the supplies and difficulties involved.","ru":"В большинство времён года ПИ могут идти по десять часов в день; остальное съедают отдых, обустройство лагеря и попутные дела. За каждый час пути они проходят столько миль данной местности, сколько указано в таблице. Подразумевается, что ПИ движутся прямо к цели, не тратя времени на поиск примечательных мест и изучение окрестностей. Темп рассчитан на среднюю скорость пешехода или повозки: всадники могут пришпоривать лошадей для коротких рывков — догнать кого-то или удрать, — но средней скорости пути это почти не прибавляет.\n\nЗа каждый день пути и каждую ночь лагеря под открытым небом Мастер бросает одну кость проверки случайной встречи. Какую кость — зависит от местности: чем безопаснее и мирнее земли, тем крупнее кость. На 1 ПИ натыкаются на существ или ситуацию, требующую их внимания.\n\nЕсли это не засада и не внезапная встреча в закрытой местности, группы обычно замечают друг друга на максимальной дистанции видимости. Кто кого заметил первым, можно определить встречной проверкой Мдр/Внимание; ПИ, взявшие верх, обычно могут автоматически разминуться с другой группой, если укрытий достаточно.\n\nПИ, путешествующим с караваном или на хорошо снаряжённой дорожной повозке, незачем заботиться о еде, питье и крове, но тем, кто собирается в сухопутную экспедицию без этих готовых удобств, стоит свериться с правилами исследования дикого края — там расписаны нужные припасы и сопутствующие трудности.\n\n| Тип местности | Мили в час |\n|---|---|\n| Равнины и саванны | 3 |\n| Редкий лес или пустыня | 2 |\n| Густой лес или изрезанные холмы | 1,5 |\n| Болото или топь | 1 |\n| Горы или гиблые пустоши | 0,5 |\n| Через местность идёт дорога | ×2* |\n| Скверная погода, грязь или сильный дождь | ×0,5 |\n| Глубокий снег | ×0,1 |\n\n*: Хорошие дороги не могут поднять маршевую скорость отряда выше трёх миль в час."},{"n":"2.11.1","l":3,"te":"Sea Travel","tr":"Морское плавание","en":"A ship can usually manage about six miles an hour of travel when under sail, and can sail around the clock if far from coasts and other perils. Oar-powered galleys average the same speed, but are heedless of the winds. An ordinary crew can only row for eight hours a day, however.\nEncounters at sea are rarer but potentially more hazardous; the GM should roll daily and nightly checks on 1d10 or 1d12. On a 1, some creature has come across the ship, a troublesome wind or storm has sprung up, something has been damaged on the ship or gone awry with the crew, or otherwise complicated the vessel’s journey. Some such encounters can be overcome with a good plan and a decent Sail skill check, while others may require bloodier answers.","ru":"Под парусом корабль обычно делает около шести миль в час и вдали от берегов и прочих опасностей может идти круглые сутки. Гребные галеры в среднем так же быстры и не зависят от ветра, но обычная команда может грести лишь восемь часов в день.\n\nВстречи на море реже, но потенциально опаснее; Мастеру стоит бросать дневные и ночные проверки на 1d10 или 1d12. На 1 на корабль набрело какое-то существо, поднялся зловредный ветер или шторм, что-то сломалось на судне, стряслось с командой — или плавание осложнилось ещё как-нибудь. Часть таких встреч преодолевается хорошим планом и приличной проверкой навыка Мореходство; другие могут потребовать более кровавых ответов."},{"n":"2.12.0","l":2,"te":"Wilderness Exploration and Expeditions","tr":"Исследование дикого края и экспедиции","en":"These rules assume the PCs are exploring or venturing through a hexmapped wilderness area, one without safe waystations or reliable maps.","ru":"Эти правила предполагают, что ПИ исследуют размеченную гексами дикую местность или пробираются через неё — без безопасных путевых станций и надёжных карт."},{"n":"2.12.1","l":3,"te":"Exploring a Hex","tr":"Исследование гекса","en":"To lightly explore a standard six-mile hex for points of interest takes a full day of scouting. If the terrain is especially rugged or concealing, such as a range of mountains or trackless swamp, this time is doubled or tripled.\nThis much time is sufficient to find most major points of interest that the GM may have placed in the hex. It won’t necessarily catch small features or provide a detailed survey of the terrain.","ru":"Чтобы бегло осмотреть стандартный шестимильный гекс в поисках примечательных мест, нужен полный день разведки. Если местность особенно труднопроходима или скрытна — горная гряда, бездорожная топь, — это время удваивается или утраивается.\n\nТакого срока хватает, чтобы найти большинство главных примечательных мест, которые Мастер разместил в гексе. Мелкие особенности он не обязательно выловит, и подробной съёмки местности не даст."},{"n":"2.12.2","l":3,"te":"Supplies for an Expedition","tr":"Припасы для экспедиции","en":"When venturing into the untamed wilderness, a group is going to need certain supplies. Fire, water, shelter, and food are the four most critical. In some places, some of these supplies may be easily acquired along the way, such as fresh water from a river the PCs are following, or shelter when the climate is warm and pleasant around the clock, but usually some kind of provision will need to be made for getting them.\n**Food** is measured in days of food per person. Each day’s needed food counts as one item of encumbrance, though they can be packed snugly together as weekly rations that count as four items instead. Some magical items or Mages might be able to create food; a party who relies entirely on such things had best hope nothing happens to their literal meal ticket.\n**Water** is also measured in days of water per person, each unit counting as one item of encumbrance. Exceptionally hot or dry climates may require multiples of this to avoid dehydration or overheating.\n**Shelter** means adequate clothing for the climate and some kind of tent or lean-to to protect from the elements while resting. Characters with Survival-0 can put together a minimal lean-to of boughs and branches in wooded areas, but in places of torrential rain, fierce snows, or other extreme conditions it may prove more difficult. Lack of shelter can make it impossible to rest comfortably and regain Effort, HP, or spells. Severe privation can even threaten a PC’s life.\n**Fire** means fuel sufficient to cook food, dry wet clothes, and warm PCs after they’ve stopped moving for the day. In most places it’s easy enough for even the least wood-wise PC to scavenge enough dry wood or twigs to get a minimally sufficient fire going, but voyages into a land devoid of woody vegetation can mean trouble. A load of dung cakes, charcoal, or other fuel sufficient to keep a group warm for an ordinary night counts as four items of encumbrance.\n| Type Supply Encumbrances | Enc |\n|---|---|\n| One day of food or water | 1 |\n| One week of carefully-packed food | 4 |\n| One night’s load of fire fuel | 4 |\n| One day’s fodder for a horse or large beast | 4 |\n| One day’s fodder for a mule or small beast | 2 |\n| Daily water for a large beast | 8 |\n| Daily water for a small beast | 4 |","ru":"Отправляясь в неукрощённую глушь, группе понадобятся определённые припасы. Огонь, вода, кров и еда — четыре самых насущных. Кое-где часть из них легко добывается по дороге — свежая вода из реки, вдоль которой идут ПИ, или кров, когда климат круглые сутки тёплый и ласковый, — но обычно о них приходится позаботиться заранее.\n\nЕда меряется днями еды на человека. Дневная порция еды считается одним предметом загруженности, но её можно плотно увязать в недельные пайки, которые считаются четырьмя предметами. Некоторые магические предметы и Маги умеют творить еду; группе, которая полностью на это полагается, лучше надеяться, что с их кормильцем — в самом буквальном смысле — ничего не случится.\n\nВода тоже меряется днями воды на человека, и каждая единица считается одним предметом загруженности. В исключительно жарком или сухом климате может понадобиться кратно больше, чтобы не страдать от обезвоживания и перегрева.\n\nКров — это одежда по климату и какая-нибудь палатка или навес, защищающие от стихий на отдыхе. Персонажи с Выживанием-0 могут соорудить простейший навес из веток и лапника в лесистой местности, но там, где хлещут ливни, свирепствуют снегопады или другие крайности, это может оказаться труднее. Без крова бывает невозможно нормально отдохнуть и восстановить Усилие, ПЗ или заклинания. Суровые лишения могут и вовсе угрожать жизни ПИ.\n\nОгонь — это топливо, которого хватит приготовить еду, высушить мокрую одежду и согреть ПИ после дневного перехода. В большинстве мест даже самый далёкий от леса ПИ легко наберёт сухих дров и веток на минимально пристойный костёр, но поход по земле, лишённой древесной растительности, сулит трудности. Запас кизяка, угля или иного топлива, которого хватит греть группу обычную ночь, считается четырьмя предметами загруженности.\n\n**Загруженность припасов**\n\n| Тип | Загр. |\n|---|---|\n| День еды или воды | 1 |\n| Неделя плотно упакованной еды | 4 |\n| Топливо для костра на одну ночь | 4 |\n| Дневной фураж для лошади или крупного животного | 4 |\n| Дневной фураж для мула или мелкого животного | 2 |\n| Дневная вода для крупного животного | 8 |\n| Дневная вода для мелкого животного | 4 |"},{"n":"2.12.3","l":3,"te":"Pack Animals and Porters","tr":"Вьючные животные и носильщики","en":"Pack beasts can carry a certain amount of items of encumbrance, assuming they’re packed carefully. Professional porters are also common hires for adventurers, though they generally refuse to enter dangerous ruins.\n\nMost beasts can survive on nightly browse and brief water stops for the duration of an expedition. In barren lands, food and water must be packed in for the beasts as well as the humans.\n\nDuring combat, porters will hide or fight as normal humans to defend their lives. Pack beasts might panic if not calmed by a handler’s successful Cha/Ride skill check made as a Move action, usually against a difficulty of 8 or more. Carters, nomad riders, and other professional stock handlers always succeed at these calming checks barring the most unusual circumstances.\n\nAt need, a healthy horse can be butchered into 30 days of rations, and a mule or similar-sized beast into 15 days. Preserving this meat takes time and fire, as explained in the Foraging section.\n\nTwo porters carrying a shared litter 30\n\n| Type Pack Animaland Porter Loads | Enc |\n|---|---|\n| Riding horse or warhorse, with laden rider | 5 |\n| Riding horse or warhorse, pack only | 20 |\n| Heavy pack horse | 30 |\n| Mule or donkey | 15 |\n| Professional porter | 12 |","ru":"Вьючные животные могут нести определённое число предметов загруженности — при аккуратной укладке. Профессиональные носильщики — тоже обычный найм для искателей приключений, но в опасные руины они, как правило, идти отказываются.\n\nБольшинство животных всю экспедицию продержится на ночном подножном корме и коротких водопоях. В бесплодных землях еду и воду придётся везти не только для людей, но и для животных.\n\nВ бою носильщики прячутся или дерутся как обычные люди, защищая свою жизнь. Вьючные животные могут запаниковать, если их не успокоит погонщик успешной проверкой Хар/Верховая езда, сделанной Действием перемещения, обычно против сложности 8 и выше. Возчики, кочевники-наездники и прочие профессионалы при скотине проходят эти успокаивающие проверки всегда — кроме самых необычайных обстоятельств.\n\nПри нужде здоровую лошадь можно разделать на 30 дней пайков, а мула или животное схожего размера — на 15. Заготовка этого мяса требует времени и огня, как описано в разделе о добыче пропитания.\n\n**Грузы вьючных животных и носильщиков**\n\n| Тип | Загр. |\n|---|---|\n| Верховая или боевая лошадь с гружёным всадником | 5 |\n| Верховая или боевая лошадь, только вьюк | 20 |\n| Тяжёлая вьючная лошадь | 30 |\n| Мул или осёл | 15 |\n| Профессиональный носильщик | 12 |\n| Двое носильщиков с общими носилками | 30 |"},{"n":"2.12.4","l":3,"te":"Starving, Thirsting, and Freezing","tr":"Голод, жажда и холод","en":"If the PCs don’t have enough food, water, warmth, or shelter, bad things will start to happen. Each day without these necessities will apply the following penalties.\n\nSystem Strain is gained. If this would put the PC over their maximum, they must make a Physical save or die by dawn if not aided. On a success, they’re helpless until death or rescue.\n\n| Circumstance Situations That Cause Privation | Sys. Str. |\n|---|---|\n| First day without enough food* | +0 |\n| Consecutive day without food | +1 |\n| First day without enough water | +2 |\n| Consecutive day without water | +3 |\n| Night without adequate shelter or fire* | +0 |\n| Harsh night without shelter or fire | +1 |\n| * No System Strain is yet gained, but the PC still suffers and cannot recover lost resources. | privation |\n\nThey can’t recover System Strain, gain nightly hit point healing, refresh daily Committed Effort, or restore expended spells until they’ve had a day of proper food, water, and warm sleep.","ru":"Если ПИ не хватает еды, воды, тепла или крова, начнётся дурное. Каждый день без этих необходимых вещей влечёт следующие последствия.\n\nРастёт Системная нагрузка. Если она превысила бы максимум ПИ, он должен сделать Физический спасбросок — или умереть к рассвету, если не получит помощи. При успехе он беспомощен до самой смерти или до спасения.\n\nОн не может восстанавливать Системную нагрузку, получать ночное исцеление пунктов здоровья, обновлять задействованное на день Усилие и восстанавливать потраченные заклинания, пока не проведёт день с нормальной едой, водой и тёплым сном.\n\n**Ситуации, вызывающие лишения**\n\n| Обстоятельство | СН |\n|---|---|\n| Первый день без достатка еды* | +0 |\n| Каждый следующий день без еды | +1 |\n| Первый день без достатка воды | +2 |\n| Каждый следующий день без воды | +3 |\n| Ночь без пристойного крова или огня* | +0 |\n| Суровая ночь без крова и огня | +1 |\n\n*: Системная нагрузка ещё не растёт, но ПИ уже страдает от лишений и не может восстанавливать потраченные ресурсы."},{"n":"2.12.5","l":3,"te":"Foraging","tr":"Добыча пропитания","en":"PCs who find themselves low on supplies or lacking a particular resource can take time to forage the surrounding terrain. It’s assumed the group sticks together during this process, sacrificing efficiency for security. They can split up if desired, but each group then risks encounters.\n\nSome supplies can be gathered as normal parts of travel. If passing through ordinary, non-arid, non-barren terrain it’s assumed the PCs can refill their waterskins and scrounge firewood whenever they wish.\n\nForaging requires either a half-day or a full day of effort. The group’s most apt member makes a Wis/Survive check against the difficulty listed on the table, and on a success earns 1d6 units of forage plus the sum of the group’s Survive skill levels, to a maximum of 10. Those without the skill at all subtract 1 from the total, to a minimum of one unit found by the group.\n\nEach forage unit is worth either a day of food for a person, a day of water for a person, or a night’s firewood for the party, and the group can decide how much of each was found after the roll is made. PCs who are barbarians or other natives of the wilds normally never find less than two units of forage barring extreme circumstances.\n\n| Type of Foraged Terrain Foraging | Diff |\n|---|---|\n| Woodlands or areas of heavy vegetation | 8 |\n| Mountains, scrublands, savannas | 9 |\n| Deserts, badlands, or normal barrens | 12 |\n| Grim wastes or barely human-survivable lands | 14 |\n| A full day foraging rather than a half-day | -2 |\n| Each successive day foraging the same hex | +1 |\n| On success, 1d6 units of forage are found, plus the total skills of the foragers. Those without even level-0 skill in it 1 from the total found. | Survive subtract |\n\nForaged food is unpreserved and will spoil in three days. Smoking or drying it requires use of a day’s worth of firewood and a halfday’s labor. Any reasonable amount of forage can be preserved with a single half-day’s work.","ru":"ПИ, у которых кончаются припасы или недостаёт какого-то ресурса, могут потратить время и обшарить окрестности. Считается, что группа при этом держится вместе, жертвуя эффективностью ради безопасности. При желании можно разделиться, но тогда каждая группа рискует нарваться на встречу отдельно.\n\nЧасть припасов добывается прямо по ходу пути. В обычной, не засушливой и не бесплодной местности считается, что ПИ могут наполнять бурдюки и подбирать хворост, когда пожелают.\n\nДобыча пропитания требует полдня или полного дня трудов. Самый способный член группы делает проверку Мдр/Выживание против сложности из таблицы и при успехе добывает 1d6 единиц добычи плюс сумма уровней навыка Выживание всей группы, максимум до 10. Те, у кого навыка нет вовсе, вычитают из суммы 1, но группа всегда находит хотя бы одну единицу.\n\nКаждая единица добычи — это либо день еды на человека, либо день воды на человека, либо дрова на ночь для всей группы; чем именно она обернулась, группа решает после броска. ПИ-варвары и прочие уроженцы дикого края в обычных условиях никогда не находят меньше двух единиц добычи — кроме самых крайних обстоятельств.\n\nДобытая еда не заготовлена и испортится за три дня. Копчение или сушка требуют дневного запаса дров и полудня труда. За один полдень работы можно заготовить любое разумное количество добычи.\n\n**Добыча пропитания**\n\n| Тип обшариваемой местности | Слож. |\n|---|---|\n| Леса и места с густой растительностью | 8 |\n| Горы, кустарниковые степи, саванны | 9 |\n| Пустыни, бедленды и обычные бесплодные земли | 12 |\n| Мрачные пустоши и земли, где человеку едва выжить | 14 |\n| Полный день добычи вместо полудня | -2 |\n| Каждый следующий день добычи в том же гексе | +1 |\n\nПри успехе находится 1d6 единиц добычи плюс сумма навыков Выживание добытчиков. Те, у кого нет даже уровня-0, вычитают 1 из найденного."},{"n":"2.12.6","l":3,"te":"Wandering Encounters","tr":"Случайные встречи","en":"PCs risk encountering trouble in their expeditions. Every so often, a Wandering Encounter check die should be rolled by the GM, with example probabilities on the table below. If the GM rolls a 1, something comes up. A GM should roll an encounter check…\n- Once per day of travel and once per night of camping outdoors. Such encounters will commence at the terrain’s usual maximum sight range, with a Wis/Notice opposed check to see who first spotted who.\n- Once per foraging attempt. Whether a half-day or a full day, one check is made per attempt, per foraging group. If the group forages all day instead of traveling, the daily travel check above is omitted.\nThe precise nature of a Wandering Encounter will depend on the terrain and the GM’s preparations. These encounters fit the logic of the situation, not the levels of the PCs, so a swift retreat may be in order.\nNot all Wandering Encounters are hostile or involve combat, however. A pompous noble might be clearing rabble off the road in front of him, or a woodsman might be found with a broken leg, or the bandit crew might be carousing and willing to have visitors join in. In general, they’re simply situations, creatures, or events that the PCs will need to react to.\n**Wandering Encounter Checks**\n| Type of Terrain | Chance |\n|---|---|\n| Dangerous wilderness area | 1 in 6 |\n| Area of civil unrest or heavy banditry | 1 in 6 |\n| Ordinary trade road | 1 in 8 |\n| Well-policed trade road | 1 in 10 |\n| Borderlands or rural back country | 1 in 8 |\n| Ordinary wilderness | 1 in 8 |","ru":"В экспедициях ПИ рискуют нарваться на неприятности. Время от времени Мастер должен бросать кость проверки случайной встречи; примерные вероятности — в таблице ниже. Если у Мастера выпала 1, что-то случилось. Проверку встречи стоит бросать…\n\n- Раз за день пути и раз за ночь лагеря под открытым небом. Такие встречи начинаются на обычной для этой местности максимальной дистанции видимости, со встречной проверкой Мдр/Внимание — кто кого заметил первым.\n- Раз за попытку добычи пропитания. Полдня она заняла или полный день — одна проверка на попытку, на каждую группу добытчиков. Если группа весь день добывает пропитание, а не идёт, дневная дорожная проверка выше не делается.\n\nЧто именно это за случайная встреча, зависит от местности и заготовок Мастера. Такие встречи подчиняются логике ситуации, а не уровням ПИ, так что порой уместно быстрое отступление.\n\nВпрочем, не все случайные встречи враждебны и не все ведут к бою. Напыщенный вельможа может разгонять чернь с дороги перед собой, лесоруб — лежать со сломанной ногой, а разбойничья ватага — гулять и радоваться гостям. В общем случае это просто ситуации, существа или события, на которые ПИ придётся отреагировать.\n\n**Проверки случайных встреч**\n\n| Тип местности | Шанс |\n|---|---|\n| Опасная дикая местность | 1 из 6 |\n| Край гражданской смуты или разгула разбоя | 1 из 6 |\n| Обычный торговый тракт | 1 из 8 |\n| Хорошо охраняемый торговый тракт | 1 из 10 |\n| Пограничье или сельская глубинка | 1 из 8 |\n| Обычная дикая местность | 1 из 8 |"},{"n":"2.13.0","l":2,"te":"Dungeon Exploration","tr":"Исследование подземелья","en":"These rules are meant for tracking adventures in a dangerous site where perils could spring up at any moment. They’re not meant for casual exploration of some bosky glade or city street, and in such cases the PC actions can just be followed scene-by-scene as usual. It’s important that GMs understand the purpose of the Wandering Encounter checks in a site. They’re intended to put constant pressure on the party to get in, accomplish their purpose, and get out before they’re worn down by encounters. Not all Wandering Encounters are hostile, but each is a risk of pointless fighting or sudden alarm.","ru":"Эти правила предназначены для отслеживания приключений в опасном месте, где угроза может возникнуть в любой миг. Они не для праздных прогулок по тенистой роще или городской улице — там действия ПИ можно, как обычно, вести сцена за сценой. Мастеру важно понимать назначение проверок случайных встреч в таком месте: они должны постоянно давить на отряд, заставляя войти, сделать дело и уйти, пока встречи не измотали его. Не всякая случайная встреча враждебна, но каждая — риск бессмысленной драки или внезапной тревоги."},{"n":"2.13.1","l":3,"te":"The Order of Play","tr":"Порядок игры","en":"At the start of each turn after the party enters the site:\n- Roll a secret Wandering Encounter check if necessary. On a 1, the encounter will happen at some appropriate moment\nthis turn.\n- The PCs decide what they want to do this turn, be it move into a new room, carefully search their current location, fiddle with some object they’ve found, or something else that takes ten minutes.\n- Tell them the result of their actions, whether that’s a firstglance description of a new room, notice of the hideous abomination that’s rearing up before them, or the explosive detonation of the crystal they just experimentally rapped.\n- Start over from the top, assuming their actions have consumed a full turn, until they withdraw from the site or it becomes safe enough to stop counting turns.","ru":"В начале каждого хода после того, как отряд вошёл в опасное место:\n\n- Если нужно, Мастер тайно бросает проверку случайной встречи. На 1 встреча произойдёт в какой-нибудь подходящий момент этого хода.\n- ПИ решают, что хотят делать в этот ход: перейти в новое помещение, тщательно обыскать текущее, повозиться с найденной вещью — или заняться чем-то ещё, что занимает десять минут.\n- Мастер сообщает им результат действий — будь то описание нового помещения с первого взгляда, весть о мерзкой твари, что вздыбилась перед ними, или взрыв кристалла, по которому они только что постучали для пробы.\n- Всё повторяется с начала — считая, что действия заняли полный ход, — пока отряд не покинет это место или не станет достаточно безопасно, чтобы перестать считать ходы."},{"n":"2.13.2","l":3,"te":"Timekeeping in the Dungeon","tr":"Счёт времени в подземелье","en":"Once the heroes intrude on a ruin, dungeon, corrupt noble’s mansion, or other dangerous site the GM starts tracking time in turns. Each turn counts as about ten minutes or one scene. Members of the party can generally do one significant thing per turn. Different party members can be doing different things in the same turn.\nThe point of tracking turns isn’t to have a minute-by-minute tally of PC activities, but to have a rough measure of how much activity they’re engaging in within the ruin. The more they do and the longer they stay, the more likely that they’ll run into Wandering Encounters or the natives will have time to realize that intruders are present. Eventually, the PCs need to either pull back or clear the site entirely of its dangerous inhabitants.\n| Activity | Turns |\n|---|---|\n| Move from one room of interest to another | 1 |\n| Pick a lock or disarm a trap | 1 |\n| Get in a fight with something | 1 |\n| Perform first aid and looting after a fight | 1 |\n| Search a room carefully | 1 |\n| Jury-rig something or work a device | 1 |\n| Time a torch lasts until burning out | 6 |\n| Time a filled lantern lasts before burning out | 24 |","ru":"Едва герои вторгаются в руины, подземелье, особняк продажного вельможи или другое опасное место, Мастер начинает считать время ходами. Каждый ход — это около десяти минут или одна сцена. Каждый член отряда за ход обычно успевает одно значимое дело. Разные члены отряда в один и тот же ход могут заниматься разными делами.\n\nСмысл счёта ходов не в поминутной описи занятий ПИ, а в грубой мере того, сколько всего они делают в руинах. Чем больше они делают и чем дольше остаются, тем вероятнее случайные встречи и тем скорее местные обитатели сообразят, что в доме чужие. Рано или поздно ПИ придётся либо отойти, либо вычистить место от опасных обитателей целиком.\n\n**Примерные затраты времени в ходах**\n\n| Занятие | Ходы |\n|---|---|\n| Перейти из одного примечательного помещения в другое | 1 |\n| Вскрыть замок или обезвредить ловушку | 1 |\n| Подраться с кем-нибудь | 1 |\n| Оказать первую помощь и обобрать павших после боя | 1 |\n| Тщательно обыскать помещение | 1 |\n| Соорудить что-то на скорую руку или совладать с устройством | 1 |\n| Время, за которое догорает факел | 6 |\n| Время, за которое выгорает заправленный фонарь | 24 |"},{"n":"2.13.3","l":3,"te":"Movement and Fleeing","tr":"Перемещение и бегство","en":"In simple diagrammatic ruins consisting of points of interest, movement from one point to another takes one turn. Otherwise, travel is at the rate of 120’ per turn, reflecting the party sneaking, listening, mapping, and carefully examining their surroundings as they go.\nIf forced to flee, the party needs to decide how exactly they’re retreating and what measures they’re using to slow or dissuade pursuers. Some discouragements may be enough to work without a roll.\nIf their foes are determined, the party uses the chase rules given in the rules section of this document. When fleeing madly, the party should not be allowed to reference their maps; the GM just calls out intersections and doors until the party escapes, the foes give up, or the enemies catch them.\nOn a successful evasion, the PCs eventually outpace or lose their pursuers. On a failure, they’re caught somewhere along their escape route. A successful escape usually takes up one turn worth of time and leaves the PCs in whatever location they’re in when the pursuit stops.","ru":"В простых схематичных руинах, состоящих из примечательных точек, переход от одной точки к другой занимает один ход. В остальных случаях отряд движется со скоростью 120 футов за ход: он крадётся, прислушивается, наносит путь на карту и внимательно осматривается по дороге.\n\nЕсли отряд вынужден бежать, ему нужно решить, как именно он отступает и какими средствами замедляет или отваживает преследователей. Некоторые препятствия могут сработать и без броска.\n\nЕсли враги настроены решительно, отряд использует правила погонь из раздела правил этого документа. При паническом бегстве отряду нельзя сверяться со своими картами: Мастер просто выкрикивает перекрёстки и двери, пока отряд не спасётся, враги не отстанут или беглецов не догонят.\n\nПри успешном уходе ПИ в конце концов обгоняют преследователей или отрываются от них. При провале их настигают где-то на пути отступления. Успешный побег обычно съедает один ход времени и оставляет ПИ там, где они оказались, когда погоня прекратилась."},{"n":"2.13.4","l":3,"te":"Encounters and Surprise","tr":"Встречи и внезапность","en":"Usually, PCs are sufficiently alert when exploring a site to avoid any chance of surprise, barring a set ambush. If they burst in on the natives suddenly, however, the locals might be too stunned to act for a round. If the GM thinks this is possible, give it X-out-of-6 odds. If the PCs run into a Wandering Encounter in a room, the creatures will enter through one of the available entrances. In the corridors outside, they’re usually 1d8 x 10 feet away when first spotted or heard, assuming there’s enough space for such a distance.\nRemember to make a reaction roll when PCs encounter creatures. Not every group of dungeon denizens will immediately lunge for their weapons.\nUsually, there’s a brief, tense moment of recognition when the PCs encounter creatures, just enough time for a reaction roll and a chance to size up the odds of diplomacy. The GM should always give the PCs a chance to parley or run when encountering creatures unless the situation makes that completely impractical.","ru":"Обычно ПИ, исследуя опасное место, достаточно бдительны, чтобы исключить всякую внезапность, кроме подготовленной засады. А вот если они сами внезапно вламываются к местным, те могут на раунд оцепенеть от неожиданности. Если Мастер считает это возможным, пусть назначит шанс X из 6. Если ПИ натыкаются на случайную встречу в помещении, существа входят через один из имеющихся входов. В коридорах снаружи их обычно впервые замечают или слышат в 1d8 × 10 футах — если места хватает для такой дистанции.\n\nСтоит помнить о проверке реакции, когда ПИ встречают существ. Не всякая компания обитателей подземелья сразу хватается за оружие.\n\nОбычно встреча ПИ с существами начинается с короткого напряжённого мгновения узнавания — как раз хватает на проверку реакции и на то, чтобы прикинуть шансы дипломатии. Мастеру следует всегда давать ПИ шанс вступить в переговоры или сбежать при встрече с существами, если только ситуация не делает это совершенно невозможным."},{"n":"2.13.5","l":3,"te":"Wandering Encounter Checks in the Dungeon","tr":"Проверки случайных встреч в подземелье","en":"Every so many turns, a GM should roll 1d6 to check for a Wandering Encounter. On a 1, the PCs will run into one at some point during the turn. The frequency of the check will depend on how vigorously alert and organized the site’s inhabitants are.\n\nThe actual contents of the encounter are decided when the GM puts together the site. Not all encounters involve running into creatures. Some are mere events or situations that fit the site. In the same vein, not all encounters are necessarily hostile, either. Reaction rolls should Example Time Costs in Turns be made for all groups of creatures.\n\nHidden area or concealed chamber unknown to No check the natives of the site\n\n**When to Roll an Encounter Check**\n| Type of Location | Turns |\n|---|---|\n| Alerted site with organized defenders | Every 1 |\n| Unalert site with organized defenders | Every 2 |\n| Site with no organized or active defense | Every 3 |\n| Site with very few mobile inhabitants | Every 4 |\n| Abandoned or disused nook in a site | Every 6 |","ru":"Каждые сколько-то ходов Мастер должен бросать 1d6 на проверку случайной встречи. На 1 ПИ в какой-то момент хода на неё нарвутся. Частота проверки зависит от того, насколько бдительны и организованы обитатели места.\n\nСамо содержание встречи определяется, когда Мастер готовит это место. Не всякая встреча — это столкновение с существами: некоторые представляют собой просто события или ситуации, подходящие месту. Точно так же не всякая встреча обязательно враждебна. Для всех групп существ делаются проверки реакции.\n\n**Когда бросать проверку встречи**\n\n| Тип места | Ходы |\n|---|---|\n| Поднятое по тревоге место с организованной обороной | Каждый ход |\n| Не поднятое по тревоге место с организованной обороной | Каждые 2 |\n| Место без организованной или деятельной обороны | Каждые 3 |\n| Место с горсткой подвижных обитателей | Каждые 4 |\n| Заброшенный или нехоженый закуток | Каждые 6 |\n| Скрытая область или потайная комната, неизвестная обитателям | Без проверки |"},{"n":"3.0.0","l":1,"te":"Equipment, Armor, and Weapons","tr":"Снаряжение, броня и оружие","en":"This section provides a selection of example gear appropriate to most fantasy campaigns. The GM is naturally expected to add other items that might suit their particular world.","ru":"Этот раздел даёт подборку примеров снаряжения, подходящего для большинства фэнтезийных кампаний. Мастер, само собой, вправе добавить другие предметы, которые подойдут именно его миру."},{"n":"3.1.0","l":2,"te":"Money and Currency","tr":"Деньги и валюта","en":"The game assumes copper, silver, and gold coins in general circulation, with ten coppers to a silver and ten silvers to a gold piece. Silver is the base currency; one silver piece is a typical laborer’s daily wage.","ru":"Игра исходит из того, что в обращении ходят медные, серебряные и золотые монеты: десять медных составляют серебряную, а десять серебряных — золотую. Базовая валюта — серебро; одна серебряная монета — обычный дневной заработок работника."},{"n":"3.2.0","l":2,"te":"Adventuring Gear","tr":"Снаряжение искателя приключений","en":"**Adventuring Gear**\n| Item | Cost | Enc |\n|---|---|---|\n| Arrows, 20 | 2 sp | 1 |\n| Backpack | 2 sp | 1§ |\n| Boots | 2 sp | 1§ |\n| Candle | 1 cp | * |\n| Cart, one-horse | 50 sp | N/A |\n| Clothes, common | 25 sp | 1§ |\n| Clothes, fine | 100 sp | 1§ |\n| Clothes, noble | 500 sp | 2§ |\n| Cooking utensils | 4 sp | 1 |\n| Crowbar | 4 sp | 1 |\n| Firewood, one night's fire | 2 cp | 4 |\n| Flask, metal, one pint | 3 sp | 1 |\n| Grappling hook | 5 sp | 1 |\n| Hammer or small tool | 2 sp | 1 |\n| Healer's pouch | 5 sp | 1 |\n| Hurlant bolts, 20 | 20 sp | 1 |\n| Iron spikes, 10 | 1 sp | 1 |\n| Lantern | 10 sp | 1 |\n| Mirror, hand | 10 sp | * |\n| Oil, one pint | 1 sp | 1# |\n| Paper, 10 sheets | 1 sp | * |\n| Rations, one week | 5 sp | 4 |\n| Rope, 50' | 2 sp | 2 |\n| Sack | 1 sp | 1 |\n| Shovel, pick, or similar tool | 4 sp | 2 |\n| Tinder box | 1 sp | * |\n| Torch | 2 cp | 1# |\n| Waterskin, one gallon | 1 sp | 1 |\n| Writing kit | 3 sp | 1 |\n* the item is effectively weightless in modest numbers § the item doesn’t count for encumbrance purposes while being worn # can be bundled in units of three for the same encumbrance, with a Main Action to break open a bundle to get at the contents\n**Beasts and Transport**\n| Item | Cost |\n|---|---|\n| Horse, riding | 200 sp |\n| Horse, draft | 150 sp |\n| Horse, battle-trained | 2,000 sp |\n| Mule | 30 sp |\n| Cow | 10 sp |\n| Ox, plow-trained | 15 sp |\n| Chicken | 5 cp |\n| Pig | 3 sp |\n| Dog, working | 20 sp |\n| Sheep or goat | 5 sp |\n| River ferry, per passenger | 5 cp |\n| Ship passage, per expected day | 2 sp |\n| Carriage travel, per mile | 2 cp |\n| Rowboat | 30 sp |\n| Small fishing boat | 200 sp |\n| Merchant ship | 5,000 sp |\n| War galleon | 50,000 sp |","ru":"**Снаряжение искателя приключений**\n\n| Предмет | Цена | Загр. |\n|---|---|---|\n| Болты для болтомёта, 20 шт. | 20 см | 1 |\n| Бумага, 10 листов | 1 см | * |\n| Бурдюк, галлон | 1 см | 1 |\n| Верёвка, 50 футов | 2 см | 2 |\n| Дрова на одну ночь | 2 мм | 4 |\n| Железные клинья, 10 шт. | 1 см | 1 |\n| Крюк-кошка | 5 см | 1 |\n| Кухонная утварь | 4 см | 1 |\n| Лом | 4 см | 1 |\n| Лопата, кирка и т. п. | 4 см | 2 |\n| Масло, пинта | 1 см | 1# |\n| Мешок | 1 см | 1 |\n| Молоток или мелкий инструмент | 2 см | 1 |\n| Огниво | 1 см | * |\n| Одежда вельможная | 500 см | 2§ |\n| Одежда добротная | 100 см | 1§ |\n| Одежда простая | 25 см | 1§ |\n| Письменный прибор | 3 см | 1 |\n| Припасы на неделю | 5 см | 4 |\n| Ручное зеркальце | 10 см | * |\n| Рюкзак | 2 см | 1§ |\n| Сапоги | 2 см | 1§ |\n| Свеча | 1 мм | * |\n| Стрелы, 20 шт. | 2 см | 1 |\n| Сумка лекаря | 5 см | 1 |\n| Телега одноконная | 50 см | Н/П |\n| Факел | 2 мм | 1# |\n| Фляга железная, пинта | 3 см | 1 |\n| Фонарь | 10 см | 1 |\n\n*: предмет в умеренном количестве фактически ничего не весит\n§: надетый предмет не идёт в счёт Загруженности\n#: можно связывать по три в связку с той же Загруженностью; вскрыть связку, чтобы добраться до содержимого, — Основное действие\n\n**Животные и транспорт**\n\n| Предмет | Цена |\n|---|---|\n| Лошадь верховая | 200 см |\n| Лошадь тягловая | 150 см |\n| Лошадь боевая | 2 000 см |\n| Мул | 30 см |\n| Корова | 10 см |\n| Вол пахотный | 15 см |\n| Курица | 5 мм |\n| Свинья | 3 см |\n| Собака рабочая | 20 см |\n| Овца или коза | 5 см |\n| Речной паром, за пассажира | 5 мм |\n| Проезд на корабле, за расчётный день пути | 2 см |\n| Поездка в экипаже, за милю | 2 мм |\n| Лодка | 30 см |\n| Рыбацкий баркас | 200 см |\n| Торговый корабль | 5 000 см |\n| Боевой галеон | 50 000 см |"},{"n":"3.2.1","l":3,"te":"Gear Bundles","tr":"Комплекты снаряжения","en":"Depending on the tastes of the group, some parties might enjoy tracking every torch and carefully weighing their resource expenditures on perilous expeditions. Others prefer to gloss over the details. The “gear bundle” options below cover all the non-weapon, non-armor gear expected of a particular role and the usual encumbrance weight of it all. The specific contents of each bundle are as broad as the GM finds reasonable for the role. A GM who prefers exact accounting can disallow bundles.\n| Item Gear Bundles | Cost | Enc |\n|---|---|---|\n| Artisan’s Equipment | 50 sp | 5 |\n| Criminal Tools | 100 sp | 3 |\n| Dungeoneering Kit | 200 sp | 6 |\n| Noble Courtier Outfit | 1,000 sp | 2 |\n| Performer’s Implements | 100 sp | 3 |\n| Wilderness Travel Gear | 100 sp | 5 |","ru":"Смотря по вкусам группы: одним партиям в радость считать каждый факел и тщательно взвешивать расход припасов в опасных экспедициях, другие предпочитают не вдаваться в подробности. Приведённые ниже «комплекты снаряжения» покрывают всё снаряжение, кроме оружия и брони, какое положено определённой роли, вместе с его обычным весом для Загруженности. Что именно входит в каждый комплект — настолько широкий вопрос, насколько Мастер сочтёт разумным для этой роли. Мастер, предпочитающий точный учёт, может запретить комплекты.\n\n**Комплекты снаряжения**\n\n| Предмет | Цена | Загр. |\n|---|---|---|\n| Воровской инструмент | 100 см | 3 |\n| Набор для подземелий | 200 см | 6 |\n| Наряд придворного | 1 000 см | 2 |\n| Походное снаряжение | 100 см | 5 |\n| Реквизит артиста | 100 см | 3 |\n| Снаряжение ремесленника | 50 см | 5 |"},{"n":"3.2.2","l":3,"te":"Hirelings and Services","tr":"Наёмные работники и услуги","en":"The party may find it useful to employ temporary labor in their adventures, either for extra warm bodies in combat or for the special talents they possess.\nAdventuring hirelings will demand at least a half-share of treasure in addition to their daily pay and will undertake no risks that their employers don’t share. Their combat statistics will be as normal for their type, usually equal to a common human soldier for most. After a particularly dangerous adventure, the hireling must make a Morale check; on a failure, they decide the adventuring life is too risky and leave the group.\nOn the rare occasions that a mage can be found willing to hire out their services, their skills almost never exceed those of a first or second level Mage.\nMost communities have a limited number of men and women willing to risk an awful doom while adventuring. If the party makes a habit of returning without their employees, others may refuse to join.\nNon-adventuring hirelings who are employed to guard the party’s residence, haul their equipment on expeditions, work on their behalf, and otherwise conduct normal business will require no more than their daily wage. If they can’t go home at the end of the day, food and fit lodgings must be provided as well.\nWhere it matters, common hirelings can be assumed to have a total +1 bonus on relevant skill checks.\n| Item Hirelingsand Day Labor | Cost/day |\n|---|---|\n| Bard of Small Repute | 2 sp |\n| Common Prostitute | 2 sp |\n| Dragoman or Skilled Interpreter | 10 sp |\n| Elite Courtesan | 100 sp |\n| Farmer | 1 sp |\n| Guard, ordinary | 2 sp |\n| Guard, sergeant, for every ten guards | 10 sp |\n| Lawyer or Pleader | 10 sp |\n| Mage of Minor Abilities | 200 sp |\n| Mundane Physician | 10 sp |\n| Porter willing to go into the wilds | 5 sp |\n| Porter only for relatively safe roads | 1 sp |\n| Navigator | 5 sp |\n| Sage, per question answered | 200 sp |\n| Sailor | 1 sp |\n| Scribe or Clerk | 3 sp |\n| Skilled Artisan | 5 sp |\n| Unskilled Laborer | 1 sp |\n| Veteran Sellsword | 10 sp |\n| Wilderness Guide | 10 sp |","ru":"Партии может пригодиться временная рабочая сила — как лишние руки в бою, так и обладатели особых талантов.\n\nНаёмные работники, идущие в приключение, потребуют сверх дневной платы не меньше половинной доли добычи и не станут рисковать там, где не рискуют их наниматели. Их боевые характеристики обычны для их типа — у большинства как у простого солдата-человека. После особенно опасного приключения работник обязан пройти проверку боевого духа; при провале он решает, что жизнь искателя приключений слишком рискованна, и покидает отряд.\n\nВ тех редких случаях, когда удаётся найти мага, готового наняться, его умения почти никогда не превосходят Мага первого или второго уровня.\n\nВ большинстве общин запас мужчин и женщин, готовых рискнуть страшной участью в приключении, ограничен. Если партия взяла привычку возвращаться без своих работников, новые могут отказаться наниматься.\n\nРаботникам, не участвующим в приключениях, — тем, кто охраняет жилище партии, таскает её снаряжение в экспедициях, трудится по её поручениям и вообще ведёт обычные дела, — хватит их дневного заработка. Если к концу дня им не вернуться домой, придётся обеспечить их едой и пристойным ночлегом.\n\nТам, где это важно, считается, что обычные наёмные работники имеют суммарный бонус +1 к соответствующим проверкам навыков.\n\n**Наёмные работники и подёнщина**\n\n| Работник | Цена/день |\n|---|---|\n| Бард малой известности | 2 см |\n| Ветеран-наёмник | 10 см |\n| Драгоман или умелый толмач | 10 см |\n| Законник или стряпчий | 10 см |\n| Земледелец | 1 см |\n| Маг малых способностей | 200 см |\n| Матрос | 1 см |\n| Мудрец, за один отвеченный вопрос | 200 см |\n| Носильщик, готовый идти в дикий край | 5 см |\n| Носильщик только по сравнительно безопасным дорогам | 1 см |\n| Обычная проститутка | 2 см |\n| Обычный лекарь | 10 см |\n| Писец или конторщик | 3 см |\n| Проводник | 10 см |\n| Сержант стражи, на каждый десяток стражников | 10 см |\n| Стражник обычный | 2 см |\n| Умелый ремесленник | 5 см |\n| Чернорабочий | 1 см |\n| Штурман | 5 см |\n| Элитная куртизанка | 100 см |"},{"n":"3.2.3","l":3,"te":"Services and Living Expenses","tr":"Услуги и расходы на жизнь","en":"Heroes who are sufficiently established as to have their own homes or businesses can live comfortably on their own resources. Other PCs, however, must pay for their keep when not out adventuring.\nImpoverished lifestyle costs cover only the bare minimum of food and a mostly-dry squat to sleep in. Heroes who can afford nothing better suffer a -1 penalty to all social skill checks due to their unkempt state and must make a Physical saving throw each night to benefit from the usual decrease in System Strain.\nCommon lifestyle fees for an adventurer usually cover adequate food and a shabby private inn room. No penalties or benefits are granted by living this way.\nRich lifestyle costs generally include a rented townhouse, a small staff of servants, and social entree into high society circles that are forgiving of the nouveau riche… at least, as long as their coin remains good.\nNoble lifestyles provide the very best the community can offer in fine lodging, luxuriant food, sycophantic servants, and the provisional friendship of useful parasites. Once per game session, the PC can ask a favor of a hanger-on in their retinue, who will perform it if it is not more than mildly humiliating, dangerous or illegal.\nAside from these weekly lifestyle costs, some o
