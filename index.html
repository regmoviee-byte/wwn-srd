hibitive from moving there. Thus, a Force asset could be moved into a foreign nation’s territory even against their wishes. The unit may remain at that location afterwards even if the Vanguard Unit leaves.\n**War Fleet:** While a war fleet can only Attack assets and locations within reach of the waterways, once per turn it can freely relocate itself to any coastal area within movement range. The Asset itself must be based out of some landward location to provide for supply and refitting.\n**War Machines:** Mobile war machines driven by trained beasts or magical motive power are under the faction’s control.\n**Warshaped:** The faction has the use of magical creatures designed specifically for warfare, or ordinary humans that have been greatly altered to serve the faction’s needs. Such forces are few and elusive enough to evade easy detection.\n**Witch Hunters:** Certain personnel are trained in sniffing out traitors and spies in the organization, along with the presence of hostile magic or hidden spellcraft.\n| Force Asset | Cost | HP | Magic | Attack | Counter | Qualities |\n|---|---|---|---|---|---|---|\n| **Force 1** |  |  |  |  |  |  |\n| Fearful Intimidation | 2 | 4 | None | None | 1d4 damage |  |\n| Local Guard | 3 | 4 | None | F v. F/1d3+1 damage | 1d4+1 damage |  |\n| Summoned Hunter | 4 | 4 | Medium | C v. F/1d6 damage | None | Subtle |\n| Thugs | 2 | 1 | None | F v. C/1d6 damage | None | Subtle |\n| **Force 2** |  |  |  |  |  |  |\n| Guerrilla Populace | 6 | 4 | None | F v. F/1d4+1 damage | None |  |\n| Military Transport | 4 | 6 | None | None | None | Action |\n| Reserve Corps | 4 | 4 | None | F v. F/1d6 damage | 1d6 damage |  |\n| Scouts | 5 | 5 | None | F v. F/2d4 damage | 1d4+1 damage | Subtle |\n| **Force 3** |  |  |  |  |  |  |\n| Enchanted Elites | 8 | 6 | Medium | F v. F/1d10 damage | 1d6 damage | Subtle |\n| Infantry | 6 | 6 | None | F v. F/1d8 damage | 1d6 damage |  |\n| Temple Fanatics | 4 | 6 | None | F v. F/2d6 damage | 2d6 damage | Special |\n| Witch Hunters | 6 | 4 | Low | C v. C/1d4+1 damage | 1d6 damage |  |\n| **Force 4** |  |  |  |  |  |  |\n| Cavalry | 8 | 12 | None | F v. F/2d6 damage | 1d4 damage |  |\n| Military Roads | 10 | 10 | None | None | None | Action |\n| Vanguard Unit | 10 | 10 | None | None | 1d6 damage | Action |\n| War Fleet | 12 | 8 | None | F v. F/2d6 damage | 1d8 damage | Action |\n| **Force 5** |  |  |  |  |  |  |\n| Demonic Slayer | 12 | 4 | High | C v. C/2d6+2 damage | None | Subtle, Special |\n| Magical Logistics | 14 | 6 | Medium | None | None | Special |\n| Siege Experts | 10 | 8 | None | F v. W/1d6 damage | 1d6 damage |  |\n| **Force 6** |  |  |  |  |  |  |\n| Fortification Program | 20 | 18 | None | None | 2d6 damage | Action |\n| Knights | 18 | 16 | None | F v. F/2d8 damage | 2d6 damage |  |\n| War Machines | 25 | 14 | Medium | F v. F/2d10+4 damage | 1d10 damage |  |\n| **Force 7** |  |  |  |  |  |  |\n| Brilliant General | 25 | 8 | None | C v. F/1d8 damage | None | Subtle, Special |\n| Purity Rites | 20 | 10 | Low | None | 2d8+2 damage | Special |\n| Warshaped | 30 | 16 | High | F v. F/2d8+2 damage | 2d8 damage | Subtle |\n| **Force 8** |  |  |  |  |  |  |\n| Apocalypse Engine | 35 | 20 | Medium | F v. F/3d10+4 damage | None |  |\n| Invincible Legion | 40 | 30 | None | F v. F/2d10+4 damage | 2d10+4 damage | Special |","ru":"**Боевые машины:** Под контролем фракции — подвижные боевые машины, которые движут обученные звери или магическая тяга.\n\n**Военные дороги:** Фракция проложила сеть дорог с тыловым складом в местоположении этого Актива. Благодаря этому раз за ход фракций фракция может переместить любой один Актив из любого местоположения в пределах досягаемости в любое другое местоположение в пределах досягаемости, заплатив 1 Казны.\n\n**Военный обоз:** Фракции служит корпус умелых возчиков, транспортных судов, дорожно-строительных артелей и прочих пособников снабжения. Свободным действием раз за ход фракций он может доставить союзный Актив к себе, если тот в пределах перемещения одного хода, или переместить союзный Актив из собственного местоположения к цели тоже в пределах хода перемещения. Несколько Активов «Военный обоз» могут передавать это перемещение по цепочке на большие расстояния.\n\n**Военный флот:** Военный флот может Атаковать Активы и местоположения только в досягаемости водных путей, зато раз за ход может свободно перебазироваться в любую прибрежную зону в пределах дальности перемещения. Сам Актив должен стоять в каком-то месте на суше, обеспечивающем снабжение и ремонт.\n\n**Выкованные для войны:** Фракция располагает магическими существами, созданными нарочно для войны, или обычными людьми, глубоко переделанными под её нужды. Таких бойцов немного, и они достаточно неуловимы, чтобы уходить от лёгкого обнаружения.\n\n**Гениальный полководец:** Фракции служит полководец, каких рождается один на век. Когда Гениальный полководец или любой союзный Актив Мощи в том же местоположении Атакует или вынужден защищаться, он может бросить для этого дополнительную кость.\n\n**Громилы:** Уличная шпана и обычные костоломы, организованные на службу делу фракции.\n\n**Демонический убийца:** Могущественные чародеи призвали или собрали нечеловеческую тварь-убийцу, чтобы выслеживать и истреблять врагов фракции. Демонический убийца входит в игру затаившимся.\n\n**Зачарованная элита:** Тщательно отобранные умелые воины получают магическое вооружение и тайные благословения, повышающие их действенность.\n\n**Конница:** Фракции служат конные войска, колесницы или иные подвижные бойцы. Слабые в обороне, они умеют терзать пути снабжения и наносить сокрушительные удары с наскока.\n\n**Магическое снабжение:** Развитая сеть магических Творений, умелых чародеев и опытных снабженцев налаживает содержание сил фракции и поддерживает потрёпанные отряды. Раз за ход фракций свободным действием этот Актив может починить 2 пункта здоровья союзному Активу Мощи.\n\n**Мастера осады:** Эти солдаты обучены рыть траншеи, вести подкопы и сносить намеченные постройки. Когда они успешно Атакуют вражеский Актив, его владелец теряет 1d4 пункта Казны из запасов, а эта фракция их получает.\n\n**Машина апокалипсиса:** Одно из чудовищно мощных древних сверхорудий, извлечённых из какого-нибудь утраченного арсенала. Машина апокалипсиса обрушивает на целевой вражеский Актив некий потусторонний ужас.\n\n**Местная стража:** Обычные горожане записаны в ночные дозоры и отряды местной стражи. Лучше всего они обороняются из-за укреплений, но как держать оружие, в целом представляют.\n\n**Непобедимый легион:** Фракция выстроила поистине неодолимую военную силу, способную проламываться сквозь сопротивление без всяких вспомогательных частей. При действии «Переместить Актив» Непобедимый легион может войти туда, куда регулярному войску входить обычно нельзя, как будто у него есть качество «Неприметный». Неприметным он при этом ни в малейшей степени не является.\n\n**Обряды чистоты:** Фракция ведёт строгую программу регулярных досмотров умов и контрразведывательных мер. Этот Актив может защищаться только от атак, нацеленных на Хитрость фракции, но позволяет фракции бросать при защите дополнительную кость.\n\n**Охотники на ведьм:** Особые люди обучены вынюхивать предателей и шпионов в организации, а заодно чуять враждебную магию и скрытое чародейство.\n\n**Партизанское население:** Местным помогают обученные вожаки партизанской войны, способные вести их в диверсиях и нападениях на неосторожных врагов.\n\n**Передовой отряд:** Этот отряд специально обучен наводить мосты, срывать укрепления и прокладывать путь молниеносному удару в глубь вражеской территории. Когда его фракция выполняет ход с действием «Переместить Актив», она может переместить Передовой отряд и любые союзные отряды из того же местоположения в любое другое местоположение в пределах дальности — даже если отрядам такого типа туда обычно хода нет. Так Актив Мощи можно ввести на территорию чужой державы даже против её воли. Отряд может остаться там и после ухода Передового отряда.\n\n**Пехота:** Фракция организовала и вооружила простых пеших солдат. Геройства от них ждать не приходится, зато у них есть преимущество числа.\n\n**Призванный охотник:** Умелый чародей призвал магического зверя или мысленно подчинил полезного расходного убийцу на службу фракции.\n\n**Разведчики:** На фракцию работают дальние разведчики и мастера рекогносцировки, способные забираться глубоко на враждебную территорию.\n\n**Резервный корпус:** Отставные военные и тыловые части расселены по округе как работники или колонисты, готовые при нужде дать отпор врагу.\n\n**Рыцари:** Фракция обучила или завербовала элитных воинов немалой личной удали — из сочувствующих дворян, ветеранов движения или сговорчивых наёмников.\n\n**Сеть укреплений:** Вокруг местоположения Актива развёрнута программа планомерной фортификации и закладки припасов, укрепляющая союзные общины и дружественные Активы. Раз за ход, когда враг совершает Атаку, нацеленную на рейтинг Мощи фракции, фракция может защищаться Сетью укреплений, если этот Актив находится в пределах хода перемещения от места атаки.\n\n**Устрашение:** Расчётливые показы силы запугали местных, и теперь они неохотно сотрудничают с любой группой, вставшей против фракции.\n\n**Храмовые фанатики:** Фанатичные слуги культа, идеологии или большой религии, эти ревнители сеют опустошение среди врагов, не думая о собственной жизни. Каждый раз после того, как Храмовые фанатики защищаются или успешно атакуют, они получают 1d4 урона.\n\n| Актив Мощи | Цена | ПЗ | Магия | Атака | Контратака | Качества |\n|---|---|---|---|---|---|---|\n| **Мощь 1** | | | | | | |\n| Громилы | 2 | 1 | Нет | М пр. Х/1d6 урона | Нет | – |\n| Местная стража | 3 | 4 | Нет | М пр. М/1d3+1 урона | 1d4+1 урона | – |\n| Призванный охотник | 4 | 4 | Средняя | Х пр. М/1d6 урона | Нет | Неприметный |\n| Устрашение | 2 | 4 | Нет | Нет | 1d4 урона | Неприметный |\n| **Мощь 2** | | | | | | |\n| Военный обоз | 4 | 6 | Нет | Нет | Нет | Действие |\n| Партизанское население | 6 | 4 | Нет | М пр. М/1d4+1 урона | Нет | – |\n| Разведчики | 5 | 5 | Нет | М пр. М/2d4 урона | 1d4+1 урона | Неприметный |\n| Резервный корпус | 4 | 4 | Нет | М пр. М/1d6 урона | 1d6 урона | – |\n| **Мощь 3** | | | | | | |\n| Зачарованная элита | 8 | 6 | Средняя | М пр. М/1d10 урона | 1d6 урона | – |\n| Охотники на ведьм | 6 | 4 | Низкая | Х пр. Х/1d4+1 урона | 1d6 урона | Неприметный |\n| Пехота | 6 | 6 | Нет | М пр. М/1d8 урона | 1d6 урона | – |\n| Храмовые фанатики | 4 | 6 | Нет | М пр. М/2d6 урона | 2d6 урона | Особое |\n| **Мощь 4** | | | | | | |\n| Военные дороги | 10 | 10 | Нет | Нет | Нет | Действие |\n| Военный флот | 12 | 8 | Нет | М пр. М/2d6 урона | 1d8 урона | Действие |\n| Конница | 8 | 12 | Нет | М пр. М/2d6 урона | 1d4 урона | – |\n| Передовой отряд | 10 | 10 | Нет | Нет | 1d6 урона | Действие |\n| **Мощь 5** | | | | | | |\n| Демонический убийца | 12 | 4 | Высокая | Х пр. Х/2d6+2 урона | Нет | Неприметный, Особое |\n| Магическое снабжение | 14 | 6 | Средняя | Нет | Нет | Особое |\n| Мастера осады | 10 | 8 | Нет | М пр. Б/1d6 урона | 1d6 урона | – |\n| **Мощь 6** | | | | | | |\n| Боевые машины | 25 | 14 | Средняя | М пр. М/2d10+4 урона | 1d10 урона | – |\n| Рыцари | 18 | 16 | Нет | М пр. М/2d8 урона | 2d6 урона | – |\n| Сеть укреплений | 20 | 18 | Нет | Нет | 2d6 урона | Действие |\n| **Мощь 7** | | | | | | |\n| Выкованные для войны | 30 | 16 | Высокая | М пр. М/2d8+2 урона | 2d8 урона | Неприметный |\n| Гениальный полководец | 25 | 8 | Нет | Х пр. М/1d8 урона | Нет | Неприметный, Особое |\n| Обряды чистоты | 20 | 10 | Низкая | Нет | 2d8+2 урона | Особое |\n| **Мощь 8** | | | | | | |\n| Машина апокалипсиса | 35 | 20 | Средняя | М пр. М/3d10+4 урона | Нет | – |\n| Непобедимый легион | 40 | 30 | Нет | М пр. М/2d10+4 урона | 2d10+4 урона | Особое |"},{"n":"6.10.0","l":2,"te":"Wealth Assets","tr":"Активы Богатства","en":"**Ancient Mechanisms:** Some useful magical mechanism from ages past has been refitted to be useful in local industry. Whenever an Asset in the same location must roll to make a profit, such as Farmers or Manufactory, the faction may roll the die twice and take the better result.\n**Ancient Workshop:** A workshop has been refitted with ancient magical tools, allowing prodigies of production, albeit not always safely. As a free action, once per turn, the Ancient Workshop takes 1d6 damage and the owning faction gains 1d6 Treasure.\n**Arcane Laboratory:** The faction’s overall Magic is counted as one step higher for the purposes of creating Assets in the same location as the laboratory. Multiple Arcane Laboratories in the same location can increase the Magic boost by multiple steps.\n**Armed Guards:** Hired caravan guards, bodyguards, or other armed minions serve the faction.\n**Caravan:** As a free action, once per turn, the Caravan can spend 1 Treasure and move itself and one other Asset in the same place to a new location within one move.\n**Cooperative Businesses:** If any other faction attempts to create an Asset in the same location as a Cooperative Business, the cost of doing so increases by 1 Treasure. This penalty stacks.\n**Dragomans:** Interpreters, cultural specialists, and go-betweens simplify the expansion of a faction’s influence in an area. A faction that takes an Expand Influence action in the same location as this Asset can roll an extra die on all checks there that turn. As a free action once per turn, this Asset can move.\n**Economic Disruption:** As a free action once per turn, this Asset can move itself without cost.\n**Farmers:** Farmers, hunters, and simple rural artisans are in service to the faction here. Once per turn, as a free action, the Asset’s owner can roll 1d6; on a 5+, they gain 1 Treasure from the Farmers.\n**Free Company:** Hired mercenaries and professional soldiers, this Asset can, as a free action once per turn, move itself. At the start of each of its owner’s turn, it takes 1 Treasure in upkeep costs; if this is not paid, roll 1d6. On a 1-3 the Asset is lost, on a 4-6 it goes rogue and will move to Attack the most profitable-looking target. This roll is repeated each turn until back pay is paid or the Asset is lost.\n**Front Merchant:** Whenever the Front Merchant successfully Attacks an enemy Asset, the target faction loses 1 Treasure, if they have any, and the Front Merchant’s owner gains it. Such a loss can occur only once per turn.\n**Golden Prosperity:** Each turn, as a free action, the faction gains 1d6 Treasure that can be used to fix damaged Assets as if by the Repair Assets action. Any of this Treasure not spent on such purposes is lost.\n**Healers:** Whenever an Asset within one move of the Healers is destroyed by an Attack that used Force against the target, the owner of the Healers may pay half its purchase price in Treasure, rounded up, to instantly restore it with 1 hit point. This cannot be used to repair Bases of Influence.\n**Hired Legion:** As a free action once per turn, the Hired Legion can move. This faction must be paid 2 Treasure at the start of each turn as upkeep, or else they go rogue as the Free Company Asset does. This Asset cannot be voluntarily sold or disbanded.\n**Lead or Silver:** If Lead or Silver’s Attack reduces an enemy Asset to zero hit points, this Asset’s owner may immediately pay half the target’s purchase cost to claim it as their own, reviving it with 1 hit point.\n**Mad Genius:** As a free action, once per turn, the Mad Genius may move. As a free action, once per turn, the Mad Genius may be sacrificed to treat the Magic rating in their location as High for the purpose of buying Assets that require such resources. This boost lasts only until the next Asset is purchased in that location.\n**Manufactory:** Once per turn, as a free action, the Asset’s owner may roll 1d6; on a 1, one point of Treasure is lost, on a 2-5, one point is gained, and on a 6, two points are gained. If Treasure is lost and none is available to pay it by the end of the turn, this Asset is lost.\n**Merchant Prince:** A canny master of trade, the Merchant Prince may be triggered as a free action once per turn before buying a new Asset in the same location; the Merchant Prince takes 1d4 damage and the purchased Asset costs 1d8 Treasure less, down to a minimum of half its normal price.\n**Monopoly:** Once per turn, as a free action, the Monopoly Asset can target an Asset in the same location; that Asset’s owning faction must either pay the Monopoly’s owner 1 Treasure or lose the targeted Asset.\n**Occult Countermeasures:** This asset can only Attack or inflict Counterattack damage on Assets that require at least a Low Magic rating to purchase.\n**Pleaders:** Whether lawyers, skalds, lawspeakers, sage elders, or other legal specialists, Pleaders can turn the local society’s laws against the enemies of the faction. However, Pleaders can neither Attack nor inflict Counterattack damage on Force Assets.\n**Smuggling Fleet:** Once per turn, as a free action, they may move themselves and any one Asset at their current location to any other water-accessible location within one move. Any Asset they move with them gains the Subtle quality until they take some action at the destination.\n**Supply Interruption:** As a free action, once per turn, the Asset can make a Cunning vs. Wealth check against an Asset in the same location. On a success, the owning faction must sacrifice Treasure equal to half the target Asset’s purchase cost, or else it is disabled and useless until this price is paid.\n**Trade Company:** Bold traders undertake potentially lucrativeor catastrophicnew business opportunities. As a free action, once per turn, the owner of the Asset may roll accept 1d4 damage done to the Asset in exchange for earning 1d6-1 Treasure points.\n**Transport Network:** A vast array of carters, ships, smugglers, and official caravans are under the faction’s control. As a free action the Transport Network can spend 1 Treasure to move any friendly Asset within two moves to any location within one move of either the target or the Transport Network.\n**Usurers:** Moneylenders and other proto-bankers ply their trade for the faction. For each unit of Usurers owned by a faction, the Treasure cost of buying Assets may be decreased by 2 Treasure, to a minimum of half its cost. Each time the Usurers are used for this benefit, they suffer 1d4 damage from popular displeasure.\n**Worker Mob:** The roughest, most brutal laborers in service with the faction have been quietly organized to sternly discipline the enemies of the group.\n| Wealth Asset | Cost | HP | Magic | Attack | Counter | Qualities |\n|---|---|---|---|---|---|---|\n| **Wealth 1** |  |  |  |  |  |  |\n| Armed Guards | 1 | 3 | None | W v. F/1d3 damage | 1d4 damage |  |\n| Cooperative Businesses | 1 | 2 | None | W v. W/1d4-1 damage | None | Subtle, Special |\n| Farmers | 2 | 4 | None | None | 1d4 damage | Action |\n| Front Merchant | 2 | 3 | None | W v. W/1d4 damage | 1d4-1 damage | Subtle |\n| **Wealth 2** |  |  |  |  |  |  |\n| Caravan | 5 | 4 | None | W v. W/1d4 damage | None | Action |\n| Dragomans | 4 | 4 | None | None | 1d4 damage | Subtle, Special |\n| Pleaders | 6 | 4 | None | C v. W/2d4 damage | 1d6 damage | Special |\n| Worker Mob | 4 | 6 | None | W v. F/1d4+1 damage | 1d4 damage |  |\n| **Wealth 3** |  |  |  |  |  |  |\n| Ancient Mechanisms | 8 | 4 | Medium | None | None | Special |\n| Arcane Laboratory | 6 | 4 | None | None | None | Special |\n| Free Company | 8 | 6 | None | W v. F/2d4+2 damage | 1d6 damage | Action, Special |\n| Manufactory | 8 | 4 | None | None | 1d4 damage | Action |\n| **Wealth 4** |  |  |  |  |  |  |\n| Healers | 12 | 8 | None | None | None | Action |\n| Monopoly | 8 | 12 | None | W v. W/1d6 damage | 1d6 damage | Action |\n| Occult Countermeasures | 10 | 8 | Low | W v. C/2d10 damage | 1d10 damage | Special |\n| Usurers | 12 | 8 | None | W v. W/1d10 damage | None | Action |\n| **Wealth 5** |  |  |  |  |  |  |\n| Mad Genius | 6 | 2 | None | W v. C/1d6 damage | None | Action |\n| Smuggling Fleet | 12 | 6 | None | W v. F/2d6 damage | None | Subtle, Action |\n| Supply Interruption | 10 | 8 | None | C v. W/1d6 damage | None | Subtle, Action |\n| **Wealth 6** |  |  |  |  |  |  |\n| Economic Disruption | 25 | 10 | None | W v. W/2d6 damage | None | Subtle, Action |\n| Merchant Prince | 20 | 10 | None | W v. W/2d8 damage | 1d8 damage | Action |\n| Trade Company | 15 | 10 | None | W v. W/2d6 damage | 1d6 damage | Action |\n| **Wealth 7** |  |  |  |  |  |  |\n| Ancient Workshop | 25 | 16 | Medium | None | None |  |\n| Lead or Silver | 20 | 10 | None | W v. W/2d10 damage | 2d8 damage |  |\n| Transport Network | 15 | 5 | None | W v. W/1d12 damage | None | Action |\n| **Wealth 8** |  |  |  |  |  |  |\n| Golden Prosperity | 40 | 30 | Medium | None | 2d10 damage |  |\n| Hired Legion | 30 | 20 | None | W v F/2d10+4 damage | 2d10 damage | Action |","ru":"**Безумный гений:** Свободным действием раз за ход Безумный гений может переместиться. Свободным действием раз за ход Безумного гения можно принести в жертву, чтобы рейтинг Магии в его местоположении считался Высоким при покупке Активов, которым нужны такие ресурсы. Подспорье держится лишь до следующей покупки Актива в этом местоположении.\n\n**Вольная рота:** Наёмники и профессиональные солдаты; свободным действием раз за ход этот Актив может переместиться. В начале каждого хода владельца он требует 1 Казны на содержание. Если не заплатить, владелец бросает 1d6: на 1-3 Актив теряется, на 4-6 он выходит из повиновения и двинется Атаковать самую прибыльную с виду цель. Этот бросок повторяется каждый ход, пока долг не выплачен или Актив не потерян.\n\n**Вооружённая охрана:** Фракции служат наёмные караванные охранники, телохранители и прочие вооружённые прислужники.\n\n**Драгоманы:** Толмачи, знатоки чужих обычаев и посредники облегчают распространение влияния фракции в округе. Фракция, выполняющая действие «Расширить влияние» в одном местоположении с этим Активом, в тот ход может бросать там дополнительную кость во всех проверках. Свободным действием раз за ход этот Актив может переместиться.\n\n**Древние механизмы:** Некий полезный магический механизм былых эпох приспособлен к местному производству. Всякий раз, когда Актив в том же местоположении должен бросать на прибыль, как Земледельцы или Мануфактура, фракция может бросить кость дважды и взять лучший результат.\n\n**Древняя мастерская:** Мастерская переоснащена древними магическими инструментами и творит чудеса производительности, хотя и не всегда безопасно. Свободным действием раз за ход Древняя мастерская получает 1d6 урона, а владеющая фракция — 1d6 Казны.\n\n**Дружественные предприятия:** Если любая другая фракция пытается создать Актив в одном местоположении с Дружественным предприятием, цена создания растёт на 1 Казны. Этот штраф складывается.\n\n**Земледельцы:** Здесь фракции служат земледельцы, охотники и простые сельские ремесленники. Раз за ход свободным действием владелец Актива может бросить 1d6: на 5+ Земледельцы приносят ему 1 Казны.\n\n**Золотое процветание:** Каждый ход свободным действием фракция получает 1d6 Казны, которую может пустить на починку повреждённых Активов, как при действии «Починить Актив». Вся эта Казна, не потраченная на такие цели, пропадает.\n\n**Караван:** Свободным действием раз за ход Караван может потратить 1 Казны и переместить себя и один другой Актив из того же места в новое местоположение в пределах одного перемещения.\n\n**Контрабандный флот:** Раз за ход свободным действием он может переместить себя и любой один Актив из своего текущего местоположения в любое другое доступное с воды местоположение в пределах одного перемещения. Любой Актив, который он берёт с собой, получает качество «Неприметный», пока не совершит какое-нибудь действие на месте прибытия.\n\n**Купеческий князь:** Ловкий мастер торговли. Купеческого князя можно задействовать свободным действием раз за ход перед покупкой нового Актива в том же местоположении: Купеческий князь получает 1d4 урона, а покупаемый Актив стоит на 1d8 Казны меньше, но не меньше половины обычной цены.\n\n**Лекари:** Когда Актив в пределах одного перемещения от Лекарей гибнет от Атаки, использовавшей против цели Мощь, владелец Лекарей может заплатить половину его покупной цены в Казне, округляя вверх, и мгновенно восстановить его с 1 пунктом здоровья. Так нельзя чинить Базы влияния.\n\n**Мануфактура:** Раз за ход свободным действием владелец Актива может бросить 1d6: на 1 теряется один пункт Казны, на 2-5 один пункт приобретается, на 6 приобретаются два. Если Казна потеряна, а платить к концу хода нечем, этот Актив теряется.\n\n**Монополия:** Раз за ход свободным действием Актив «Монополия» может выбрать целью Актив в том же местоположении. Фракция-владелец цели должна либо заплатить владельцу Монополии 1 Казны, либо потерять выбранный Актив.\n\n**Наёмный легион:** Свободным действием раз за ход Наёмный легион может переместиться. В начале каждого хода этому Активу нужно платить 2 Казны содержания — иначе он выходит из повиновения, как Актив «Вольная рота». Этот Актив нельзя добровольно продать или распустить.\n\n**Оккультные контрмеры:** Этот Актив может Атаковать и наносить урон Контратакой только тем Активам, для покупки которых нужен рейтинг Магии хотя бы «Низкая».\n\n**Перевозочная сеть:** Под контролем фракции — необъятное скопище возчиков, кораблей, контрабандистов и официальных караванов. Свободным действием Перевозочная сеть может потратить 1 Казны и переместить любой дружественный Актив в пределах двух перемещений в любое местоположение в пределах одного перемещения от цели или от самой Перевозочной сети.\n\n**Перекрытые поставки:** Свободным действием раз за ход этот Актив может сделать проверку Хитрости против Богатства против Актива в том же местоположении. При успехе владеющая фракция должна пожертвовать Казной в половину покупной цены целевого Актива — иначе тот выведен из строя и бесполезен, пока эта цена не уплачена.\n\n**Подрыв хозяйства:** Свободным действием раз за ход этот Актив может переместиться, ничего не платя.\n\n**Подставной купец:** Всякий раз, когда Подставной купец успешно Атакует вражеский Актив, целевая фракция теряет 1 Казны, если есть что терять, а владелец Подставного купца её получает. Такая потеря случается не больше раза за ход.\n\n**Рабочая ватага:** Самые грубые и свирепые работяги на службе фракции втихую сколочены в ватагу, чтобы сурово вразумлять врагов группы.\n\n**Ростовщики:** Ростовщики и прочие протобанкиры промышляют для фракции. За каждый отряд Ростовщиков во владении фракции цену покупки Активов можно снижать на 2 Казны, но не ниже половины цены. Каждый раз, когда Ростовщики идут в ход ради этой выгоды, народное недовольство наносит им 1d4 урона.\n\n**Свинец или серебро:** Если Атака Свинца или серебра доводит вражеский Актив до нуля пунктов здоровья, владелец этого Актива может немедленно заплатить половину покупной цены цели и забрать её себе, оживив с 1 пунктом здоровья.\n\n**Стряпчие:** Юристы, скальды, законоговорители, мудрые старейшины и прочие знатоки права — Стряпчие умеют обращать законы местного общества против врагов фракции. Однако Стряпчие не могут ни Атаковать Активы Мощи, ни наносить им урон Контратакой.\n\n**Торговая компания:** Отчаянные купцы пускаются в новые предприятия, то ли прибыльные, то ли гибельные. Свободным действием раз за ход владелец Актива может принять 1d4 урона по Активу в обмен на 1d6-1 пунктов Казны.\n\n**Чародейская лаборатория:** Общая Магия фракции считается на одну ступень выше при создании Активов в одном местоположении с лабораторией. Несколько Чародейских лабораторий в одном местоположении могут поднять Магию на несколько ступеней.\n\n| Актив Богатства | Цена | ПЗ | Магия | Атака | Контратака | Качества |\n|---|---|---|---|---|---|---|\n| **Богатство 1** | | | | | | |\n| Вооружённая охрана | 1 | 3 | Нет | Б пр. М/1d3 урона | 1d4 урона | – |\n| Дружественные предприятия | 1 | 2 | Нет | Б пр. Б/1d4-1 урона | Нет | Неприметный |\n| Земледельцы | 2 | 4 | Нет | Нет | 1d4 урона | Действие |\n| Подставной купец | 2 | 3 | Нет | Б пр. Б/1d4 урона | 1d4-1 урона | Неприметный, Особое |\n| **Богатство 2** | | | | | | |\n| Драгоманы | 4 | 4 | Нет | Нет | 1d4 урона | Неприметный, Особое |\n| Караван | 5 | 4 | Нет | Б пр. Б/1d4 урона | Нет | Действие |\n| Рабочая ватага | 4 | 6 | Нет | Б пр. М/1d4+1 урона | 1d4 урона | – |\n| Стряпчие | 6 | 4 | Нет | Х пр. Б/2d4 урона | 1d6 урона | Особое |\n| **Богатство 3** | | | | | | |\n| Вольная рота | 8 | 6 | Нет | Б пр. М/2d4+2 урона | 1d6 урона | Действие, Особое |\n| Древние механизмы | 8 | 4 | Средняя | Нет | Нет | Особое |\n| Мануфактура | 8 | 4 | Нет | Нет | 1d4 урона | Действие |\n| Чародейская лаборатория | 6 | 4 | Нет | Нет | Нет | Особое |\n| **Богатство 4** | | | | | | |\n| Лекари | 12 | 8 | Нет | Нет | Нет | Действие |\n| Монополия | 8 | 12 | Нет | Б пр. Б/1d6 урона | 1d6 урона | Действие |\n| Оккультные контрмеры | 10 | 8 | Низкая | Б пр. Х/2d10 урона | 1d10 урона | Особое |\n| Ростовщики | 12 | 8 | Нет | Б пр. Б/1d10 урона | Нет | Действие |\n| **Богатство 5** | | | | | | |\n| Безумный гений | 6 | 2 | Нет | Б пр. Х/1d6 урона | Нет | Действие |\n| Контрабандный флот | 12 | 6 | Нет | Б пр. М/2d6 урона | Нет | Неприметный, Действие |\n| Перекрытые поставки | 10 | 8 | Нет | Х пр. Б/1d6 урона | Нет | Неприметный, Действие |\n| **Богатство 6** | | | | | | |\n| Купеческий князь | 20 | 10 | Нет | Б пр. Б/2d8 урона | 1d8 урона | Действие |\n| Подрыв хозяйства | 25 | 10 | Нет | Б пр. Б/2d6 урона | Нет | Неприметный, Действие |\n| Торговая компания | 15 | 10 | Нет | Б пр. Б/2d6 урона | 1d6 урона | Действие |\n| **Богатство 7** | | | | | | |\n| Древняя мастерская | 25 | 16 | Средняя | Нет | Нет | Действие |\n| Перевозочная сеть | 15 | 5 | Нет | Б пр. Б/1d12 урона | Нет | – |\n| Свинец или серебро | 20 | 10 | Нет | Б пр. Б/2d10 урона | 2d8 урона | – |\n| **Богатство 8** | | | | | | |\n| Золотое процветание | 40 | 30 | Средняя | Нет | 2d10 урона | Действие |\n| Наёмный легион | 30 | 20 | Нет | Б пр. М/2d10+4 урона | 2d10 урона | – |"},{"n":"7.0.0","l":1,"te":"Major Projects","tr":"Великие начинания","en":"In any campaign, there will likely arise some occasion when the PCs take it into their heads to accomplish some great change in the world. Perhaps they want to abolish slavery in a country, or institute a new government in a howling wilderness, or crush the economic power of a hateful merchant cartel. The party wants to accomplish something grand or large-scale where there is no obvious direct path to success. No single killing or specific act of heroism will get them their aim, though the goal itself isn’t so wild as to be obviously futile.\nSuch ambitions are major projects, and this section will cover a simple system to help the GM adjudicate their progress and success. This system is meant to handle sprawling, ambiguous ambitions that aren’t clearly susceptible to a simple solution. If the party wants a dead town burgomaster, then they can simply kill him. If they want to turn his town into a major new trading nexus, something more complicated may be required.","ru":"Почти в любой кампании однажды наступает момент, когда ПИ задумывают совершить в мире большую перемену. Скажем, они хотят отменить рабство в целой стране, учредить новую власть посреди воющей глуши или сокрушить экономическое могущество ненавистного купеческого картеля. Партия замахивается на нечто великое или масштабное, к чему нет очевидного прямого пути. Ни одно убийство, ни один отдельный подвиг не принесут им желаемого — но сама цель не настолько безумна, чтобы быть заведомо тщетной.\nТакие замыслы и есть великие начинания, и этот раздел предлагает простую систему, которая поможет Мастеру оценивать их ход и успех. Система предназначена для размашистых, расплывчатых устремлений, у которых нет явного простого решения. Если партии нужен мёртвый бургомистр, его можно просто убить. Если же они хотят превратить его городок в новый крупный торговый узел, понадобится нечто посложнее."},{"n":"7.1.0","l":2,"te":"Renown","tr":"Слава","en":"The basic currency of major projects is called Renown, and it’s measured in points much like experience points. PCs gain Renown for succeeding at adventures, building ties with the world, and generally behaving in a way to attract interest and respect from those around them. PCs then spend Renown to accomplish the changes they want to make in the world, reflecting their own background activities and the work of cooperative allies and associates.\nEach individual PC has their own Renown score. They can spend it together with the rest of the party if they agree on the mutual focus of their interests, but a PC might also spend it on other ambitions or intermediate goals that come to mind. It’s ultimately up to the player as to what they want to put their effort into; spending Renown reflects the kind of background work and off-screen support that the hero can bring to bear.\nA GM doesn’t have to track Renown unless they intend to use the this system. If the GM prefers to do things their own way, they can completely ignore Renown awards. If the GM changes their mind later and wants to introduce the system, they can simply give each PC a Renown score equal to their current accumulated experience points and then track things accordingly from there.\nGenerally, a PC will receive one point of Renown after each adventure. Some other activities or undertakings might win them additional bonus Renown, usually those works that increase the PC’s influence and involvement with the campaign world, and some adventures might not give them much Renown at all if they left no impression on the people around the party.","ru":"Базовая валюта великих начинаний называется Славой и измеряется в пунктах, во многом подобно пунктам опыта. ПИ получают Славу за успешные приключения, за связи, которыми обрастают в мире, и вообще за то, что ведут себя так, чтобы привлекать интерес и уважение окружающих. Затем ПИ тратят Славу, чтобы осуществить желаемые перемены в мире; эта трата отражает их собственную закулисную работу и труды дружественных союзников и помощников.\nУ каждого ПИ свой запас Славы. Её можно тратить вместе с остальной партией, если группа сходится на общей цели, но ПИ может пустить её и на другие замыслы или промежуточные задачи, которые придут ему в голову. В конечном счёте игрок сам решает, во что вкладывать усилия; трата Славы отражает ту закулисную работу и внеэкранную поддержку, которую герой способен привести в движение.\nМастеру не обязательно вести учёт Славы, если он не собирается пользоваться этой системой. Если Мастер предпочитает вести дела по-своему, награды Славой можно полностью игнорировать. Если позже он передумает и захочет ввести систему, достаточно дать каждому ПИ запас Славы, равный его текущим накопленным пунктам опыта, и дальше вести учёт как обычно.\nКак правило, ПИ получает один пункт Славы после каждого приключения. Отдельные дела и предприятия могут приносить дополнительную Славу — обычно те, что усиливают влияние ПИ и его вовлечённость в мир кампании; а иные приключения могут не дать почти никакой Славы, если не оставили никакого следа в памяти людей вокруг партии."},{"n":"7.2.0","l":2,"te":"Determining the Project Difficulty","tr":"Определение сложности начинания","en":"To find out how much Renown is needed to achieve a project, the GM must determine its difficulty. This total difficulty is a product of the intensity of the change, the scope it affects, and the powers that are opposed to it.\nFirst, decide whether the change is plausible, improbable, or impossible. If the change is something that is predictable or unsurprising, it’s a plausible change. A town with good transport links and a couple of wealthy neighbors might quite plausibly become a trade hub. A duke with an abandoned frontier keep and a raider problem might plausibly decide to give it to a famed warrior PC with the agreement that the PC would pledge fealty to him. A plausible change in the campaign is simply one that no one would find particularly surprising or unlikely.\nAn improbable change is one that’s not physically or socially impossible, but is highly unlikely. Transforming a random patch of steppe grasslands into a trading hub might be an improbable change, as would convincing a duke to simply hand over the frontier fort with no particular claim of allegiance. Some things that are not particularly physically difficult might be improbable due to the social or emotional implications; a society with a relative handful of trophy slaves might find it improbable to give them up even if they serve only as status symbols for their owners.\nAn impossible change is just that; something that is physically or socially impossible to contemplate. Turning a desolate glacier on the edge of the world into a trading hub might be such, or convincing the duke to simply give the PCs his duchy. Accomplishing a feat like this might require substantial magical Workings, the involvement of ancient artifacts, or a degree of social upheaval on par with a war of conquest. Some changes might be so drastic that they require their own heroic labors simply to prepare the groundwork for the real effort, and entire separate projects must be undertaken before the real goal even becomes possible.","ru":"Чтобы узнать, сколько Славы нужно для успеха начинания, Мастер должен определить его сложность. Итоговая сложность — произведение глубины перемены, охваченного ею размаха и противостоящих ей сил.\nСначала нужно решить, является ли перемена правдоподобной, маловероятной или невозможной. Если перемена предсказуема и никого не удивит — она правдоподобна. Городок с хорошими путями сообщения и парой богатых соседей вполне правдоподобно может стать торговым узлом. Герцог, у которого есть заброшенная пограничная крепость и беда с налётчиками, вполне правдоподобно может решить отдать её прославленному воину-ПИ с условием, что тот присягнёт ему на верность. Правдоподобная перемена в кампании — попросту та, которую никто не сочтёт особенно удивительной или невероятной.\nМаловероятная перемена не является физически или социально невозможной, но крайне маловероятна. Превратить случайный клочок степи в торговый узел — перемена маловероятная, как и убедить герцога отдать пограничную крепость просто так, без всяких уз верности. Иные вещи, не особенно трудные физически, могут быть маловероятны из-за социальных или эмоциональных последствий: общество с горсткой рабов-трофеев вряд ли согласится отпустить их, даже если те служат хозяевам лишь символом статуса.\nНевозможная перемена — именно такова: она физически или социально немыслима. Такова попытка превратить безлюдный ледник на краю света в торговый узел или убедить герцога просто подарить ПИ своё герцогство. Подобный подвиг может потребовать серьёзных магических Творений, участия древних артефактов или социального потрясения масштаба завоевательной войны. Иные перемены настолько радикальны, что одна лишь подготовка почвы для настоящей работы требует собственных героических трудов, и прежде чем подлинная цель вообще станет возможной, придётся довести до конца целые отдельные начинания."},{"n":"7.3.0","l":2,"te":"Determining the Project Scope","tr":"Определение размаха начинания","en":"Once the change’s probability is decided, the GM must identify how wide the scope of the change may be. The more land and the more people the change affects, the harder it will be to bring it about.\n\nA village-sized change is the smallest scale, affecting only a single hamlet or a village’s worth of people. A city-sized change affects the population of a single city or several villages, while a regional one might affect a single barony or small province. A kingdom-sized one affects a whole kingdom or a collection of feudal lordships, and a global change affects the entire world, or at least those parts known to the PCs.\n\nWhen deciding the scope of the change, focus on how many people are going to be immediately affected by the project. Turning a town into a trading hub might incidentally affect a significant part of a kingdom, but the immediate consequences are felt only by the residents of that town, and perhaps their closest trading partners. The scope in that case would be simply that of a city, rather than a region. Banishing slavery throughout a kingdom would require a kingdom-sized change, while getting it banned within some smaller feudal region would require a proportionately lesser scope.\n\nIf the PCs are trying to establish an educational institution, or a religious order, or some other sub-group meant to serve a chosen cause, the scope should be the largest general area the order can have influence in at any one time. A very small order of warrior-monks might only have enough devotees to affect a village-sized community or problem. An order with multiple monasteries and bases of operations throughout a kingdom might have enough muscle to affect events on a nation-wide scale. In the same vein, a small academy might be enough to bring enlightened learning to a city, improving the lives of men and women there, but not have the reach to influence the greater region around it. Individual warrior-monks or specific scholars might play major roles elsewhere in the setting, but the institution itself can’t rely on the certainty of being able to step into such roles.\n\nIn some cases, a PC might attempt to forge a Working or develop a specific bloodline of magical or cursed beings. Assuming that they have the necessary tools and opportunities to achieve such a great\n\nfeat, the scope should apply to the total number of people affected by the magic over its entire course of existence. Thus, a village-sized change like this might apply to ten generations of a very small bloodline, the enchantment lasting for a very long time but applying only to a few people at any one time. It might be reproduced by special training, magical consecration, or a natural inherited bloodline. Once the scope limit is reached, the magic can no longer be transmitted, as it has either been exhausted or the subtle shiftings of the magic have damaged it beyond repair. Conversely, a very large scope for such a work might mean that many people are so affected, though a very large change like that would only last for a few generations before reaching the maximum affected population. Because of such limits, many such empowered bloodlines or augmented magical traditions are very selective about adding new members.\n\n| Probability of the Goal | Base Difficulty | Scope Affected | Difficulty Multiplier | Opposition Greatest Active | Difficulty Multiplier |\n|---|---|---|---|---|---|\n| Plausible | 1 | Village | x2 | Minor figures | x2 |\n| Improbable | 2 | City | x4 | Local leaders | x4 |\n| Impossible | 4 | Region Kingdom Known World | x8 x16 x32 | Major noble or beast King or famed monster | x8 x16 |\n\nOptionally, PCs who want to create such a magical working can fix it indefinitely, causing it to be heritable or transmissible for the indefinite future. Such laborious workings are much more difficult than simply tying the effect to the natural flow of the magic, however, and so it costs four times more than it would otherwise. Thus, imbuing a village of people with some magical quality that they will forever after transmit down to a similar number of heirs would count as a x8 multiplier instead of a x2 multiplier.","ru":"Когда правдоподобие перемены определено, Мастер должен понять, насколько широк её размах. Чем больше земель и людей затрагивает перемена, тем труднее её осуществить.\nПеремена размаха деревни — наименьший масштаб: она затрагивает лишь одну деревушку или число людей, равное населению деревни. Перемена размаха города затрагивает население одного города или нескольких деревень; перемена размаха области — одну баронию или небольшую провинцию. Перемена размаха королевства охватывает целое королевство или россыпь феодальных владений, а перемена размаха известного мира — весь мир или по крайней мере те его части, что известны ПИ.\nОпределяя размах перемены, следует смотреть на то, скольких людей начинание затронет непосредственно. Превращение городка в торговый узел может косвенно сказаться на немалой части королевства, но непосредственные последствия ощутят лишь жители самого города и, возможно, его ближайшие торговые партнёры. Размах в этом случае будет всего лишь городским, а не областным. Чтобы изгнать рабство из целого королевства, нужна перемена размаха королевства, а чтобы добиться его запрета в каком-нибудь меньшем феодальном владении, хватит соответственно меньшего размаха.\nЕсли ПИ основывают учебное заведение, религиозный орден или иное сообщество, призванное служить избранному делу, размахом следует считать наибольшую территорию, на которую орден способен влиять одновременно. У совсем маленького ордена воинов-монахов приверженцев хватит лишь на общину или задачу размаха деревни. Орден с монастырями и опорными пунктами по всему королевству может иметь достаточно силы, чтобы влиять на события в масштабе целой страны. Точно так же небольшой академии может хватить, чтобы принести просвещение в город и улучшить жизнь его мужчин и женщин, но не хватит охвата, чтобы влиять на окружающую область. Отдельные воины-монахи или конкретные учёные могут играть большие роли и в других уголках сеттинга, но само заведение не может твёрдо рассчитывать, что сумеет взять на себя такие роли.\nИногда ПИ может взяться выковать Творение или вывести особую кровную линию магических или проклятых существ. Если у него есть необходимые средства и возможности для такого великого свершения, размахом следует считать общее число людей, которых магия затронет за весь срок своего существования. Так, перемена размаха деревни может распространяться на десять поколений очень малочисленного рода: чары длятся очень долго, но в каждый момент действуют лишь на нескольких человек. Передаваться они могут особым обучением, магическим посвящением или естественным наследованием крови. Когда предел размаха достигнут, магия больше не передаётся: она либо исчерпана, либо её тонкие сдвиги повредили её безвозвратно. И наоборот, очень большой размах такой работы означает, что затронуты будут многие, — но столь масштабная перемена продержится лишь несколько поколений, прежде чем достигнет предельного числа затронутых. Из-за этих ограничений многие такие усиленные кровные линии и укреплённые магические традиции очень разборчивы в приёме новых членов.\nПо желанию ПИ, создающие такое магическое творение, могут закрепить его навечно, сделав наследуемым или передаваемым на неопределённое будущее. Однако столь кропотливые творения гораздо труднее, чем простая привязка эффекта к естественному току магии, и потому стоят вчетверо дороже обычного. Так, наделить жителей деревни неким магическим свойством, которое они будут вечно передавать сопоставимому числу наследников, — это множитель ×8 вместо ×2.\n\n\n| Правдоподобие цели | Базовая сложность | Охваченный размах | Множитель сложности | Сильнейший активный противник | Множитель сложности |\n|---|---|---|---|---|---|\n| Правдоподобная | 1 | Деревня | ×2 | Мелкая сошка | ×2 |\n| Маловероятная | 2 | Город | ×4 | Местные лидеры | ×4 |\n| Невозможная | 4 | Область | ×8 | Крупный вельможа или зверь | ×8 |\n| – | – | Королевство | ×16 | Король или прославленное чудовище | ×16 |\n| – | – | Известный мир | ×32 | – | – |\n\nПротиводействие умножается ещё на ×2, если местное население эмоционально или социально против перемены."},{"n":"7.4.0","l":2,"te":"Determining the Opposition","tr":"Определение противодействия","en":"Once you have decided on the difficulty and the scope, you now need to identify the most significant people or power bases that would be opposed to this change. In some cases, there may be no one opposed to the alteration; turning a steppe oasis into a trading post might not have anyone to object if there are no nomads who control the land, nor terrible beasts to threaten settlers. In most cases, however, there’s going to be at least one person, creature, or other power in the area who would prefer things not change.\nIf the opposition comes in the form of ordinary peasants or citizens, minor bandit rabble, normal dangerous animals, or other disorganized and low-level threats, then the difficulty is multiplied by x2.\nIf the opposition is organized under competent leadership, such as a local baron, rich merchant, or persuasive priest, or if the opposition is some dangerous but not especially remarkable monster, then the difficulty is multiplied by x4.\nIf the opposition is entrenched and powerful, such as a group of nobles, an influential bandit king, a crime boss, a major city’s mayor, or a monster impressive enough to have developed its own legendry, then the difficulty is multiplied by x8.\nIf the opposition involves facing down a king, a legendary monster, the primate of a major religion, or some similar monarchic power, then the difficulty is multiplied by x16.\nWhen measuring opposition, only the greatest opponent counts. Thus, if the king, the nobility, and the local village chief all hate an\nMultiply opposition by x2 if the local population is emotionally or socially against it.\nidea, the difficulty modifier is x16. If the king is then persuaded to relent, the difficulty modifier becomes x8, until the barons are pacified, after which the village chieftain is the only opposition left, for a x2 modifier.\nOn top of this, if the change inspires widespread popular disapproval or unease among the populace affected by the change, multiply the modifier by an additional x2. Such changes usually touch on delicate questions of group identity, cultural traditions, or basic values, and the people in the change’s scope are likely to resist such measures on multiple levels.\nAs an example, assume an idealistic band of adventurers dreamed of extirpating slavery from an entire kingdom. The natives use slaves for work and status, but their labor isn’t crucial to the economy’s survival, so the GM decides it is merely improbable to give up slavery, for a base difficulty of 2. The scope is kingdom-wide, so 2 is multiplied by 16, for a difficulty of 32. As the situation stands now, the king has no desire to infuriate the wealthy magnates of his kingdom by taking away their free labor, so he would oppose it for an additional x16 multiplier, for a total difficulty of 512. Oh, and the natives find the idea of accepting slaves as equals to be emotionally abhorrent, so that’s an additional x2 multiplier, for a final difficulty of 1,024.\nIt is very unlikely for the heroes to manage to scrape up the 1,024 points of Renown needed to make this change out of hand. They’re going to have to alter the situation to quell the opposition and make specific strides toward making the ideal more plausible before they can finally bring about their dream.","ru":"Определив сложность и размах, нужно установить, какие значимые люди или силы будут противостоять этой перемене. Иногда против неё не будет никого: превращению степного оазиса в торговый пост никто не воспротивится, если этой землёй не владеют кочевники и поселенцам не грозят страшные звери. Однако в большинстве случаев в округе найдётся хотя бы один человек, существо или иная сила, которых устраивает всё как есть.\nЕсли противодействие исходит от обычных крестьян или горожан, мелкого разбойничьего сброда, обычных опасных животных или иных разрозненных и незначительных угроз, сложность умножается на ×2.\nЕсли противодействие организовано под умелым руководством — местный барон, богатый купец, убедительный жрец — или если противник представляет собой опасное, но ничем особенно не выдающееся чудовище, сложность умножается на ×4.\nЕсли противник прочно укоренён и силён — группа вельмож, влиятельный разбойничий король, глава преступного мира, градоначальник крупного города или чудовище настолько внушительное, что обросло собственными легендами, — сложность умножается на ×8.\nЕсли противостоять придётся королю, легендарному чудовищу, предстоятелю крупной религии или иной власти монаршего масштаба, сложность умножается на ×16.\nПри оценке противодействия считается только сильнейший противник. Так, если идею ненавидят и король, и знать, и староста местной деревни, модификатор сложности равен ×16. Если короля удалось уговорить отступиться, модификатор становится ×8 — пока не усмирены бароны, после чего единственным противником остаётся деревенский староста с модификатором ×2.\nВдобавок, если перемена вызывает широкое народное недовольство или тревогу среди затронутого населения, модификатор умножается ещё на ×2. Такие перемены обычно задевают тонкие вопросы группового самосознания, культурных традиций или базовых ценностей, и люди в пределах размаха перемены будут сопротивляться подобным мерам на всех уровнях сразу.\nДля примера: допустим, компания идеалистов-искателей приключений возмечтала искоренить рабство в целом королевстве. Местные держат рабов для работы и престижа, но их труд не жизненно важен для выживания хозяйства, так что Мастер решает: отказаться от рабства здесь всего лишь маловероятно — базовая сложность 2. Размах — целое королевство, поэтому 2 умножается на 16, итого сложность 32. При нынешнем положении дел король не имеет ни малейшего желания злить богатых магнатов королевства, отнимая у них дармовой труд, так что он воспротивится — ещё множитель ×16, итого сложность 512. Ах да: сама мысль принять рабов как равных местным эмоционально отвратительна, так что это ещё множитель ×2 — окончательная сложность 1024.\nКрайне маловероятно, что герои сумеют наскрести 1024 пункта Славы, чтобы провернуть такую перемену с ходу. Им придётся менять само положение дел: гасить противодействие и целенаправленно, шаг за шагом делать свой идеал более правдоподобным, прежде чем мечта наконец сбудется."},{"n":"7.5.0","l":2,"te":"Decreasing Difficulty","tr":"Снижение сложности","en":"Adventurers who have a dream bigger than their available Renown have several options for bringing it about more rapidly. The party can use some or all of these techniques for making their ambition more feasible, and the GM might well insist on at least some of them before the PCs can succeed.\nThey can spend money. Sometimes a problem can be solved by throwing enough money at it, either by paying off troublesome opponents, constructing useful facilities or installations, or hiring enough help to push the cause through. Money is often useful, but it eventually begets diminishing returns; once everything useful has been bought, additional coinage brings little result.\nThe adjacent table shows how much a point of Renown dedicated to the project costs. The first few points come relatively cheaply, but after that the price increases rapidly. Eventually, there comes a point where only the wealth of empires can shove a massive project through with sheer monetary force. Small projects and modest ambitions are generally easy to accomplish with cash, but society-wide alterations and massive undertakings can defeat the richest vault.\nThey can build institutions. If the PCs want a fortified monastery loyal to them, they can either throw enough Renown at their goal until allied NPCs and local potentates think it’s a good idea to buy them off by building it for them, or they can actually go out and purchase it with their own money. They can hire the masons, recruit the monks, and find a trustworthy abbot to act as regent for the heroes. Such steps may not be enough to completely attain the purpose, as they’ll still have to deal with quelling any local opposition to the new monastery and any innate implausibility of establishing a monastery wherever they want to put it, but it’ll get them a long way toward success.\nThe GM decides a reasonable cost for the institution they want to build and the assorted recruits they’ll need to operate it, using the guidelines in this section. Prices will vary drastically based on the situation; building a splendid stone castle in a desert with no good source of stone will cost far more than listed, while hiring skilled artisans in a major metropolis won’t be nearly as difficult as finding them in an empty tundra.\nOnce the cost is paid, the GM assigns a suitable amount of Renown toward attaining the goal. For example, if the overall goal is securing the trade route between two distant cities, building a fortified caravansary with patrolling road guards might give enough Renown to solve half the problem. The rest of it might require dealing with the opposition that’s making the hazard in the first place, such as the depredations of a bandit chief or the perils of the savage monsters that haunt the road.\nThey can nullify opposition. Either through gold, persuasion, or sharp steel, the PCs can end the opposition of those powers who stand against their ambition. Opponents who can be bought off might be managed with nothing more than a lengthy discussion and an exchange of valuables, but other opponents might need full-fledged adventures to deal with. Some might demand favors in exchange for withdrawing their opposition, or quests accomplished on their behalf, or enemies snuffed out by the swords of the heroes. Others could be so unalterably opposed to the idea that they must either be killed or endured.\nThey can adventure in pursuit of their goal. This adventure might be something as simple as finding the den of a troublesome pack of monsters, or it could be something as involved as delving into an ancient dungeon to recover the lost regalia that will give them the moral authority to make demands of a troublesome prelate. Such adventures will give the PCs their usual award of Renown, but they can also give a bonus award toward their specific goal if their efforts are particularly relevant.\nThis bonus is determined by the GM. The easiest way for the GM to pick the proper amount for the award is to privately estimate how many such adventures their goal is worth and then award Renown accordingly. Thus, if the GM thinks that three adventures like this one is as much focus and effort as the group should have to spend toward accomplishing their aim, then each adventure will decrease the goal’s difficulty by one-third.\nAdventuring is by far the most efficient way to accomplish a group’s goals, assuming they can come up with adventures that are relevant. This is intentional; a goal that gives the GM an easy supply of adventuring grist is a genuine contribution to the game. The more adventures that a GM gets out of PC ambitions, the easier it will be to prepare for the game and ensure the players are involved in the campaign.\n| Bought Renown | per Point Cost in Silver Pieces |\n|---|---|\n| First 1-4 points | 500 per point |\n| Next 4 points | 2,000 per point |\n| Next 8 points | 4,000 per point |\n| Next 16 points | 8,000 per point |\n| Next 32 points | 16,000 per point |\n| Next 64 points | 32,000 per point |\n| Further points | Prohibitively expensive |\nFor example, purchasing 14 points of Renown would cost 2,000 for the first four, 8,000 for the next four, and 24,000 for the next six, for 34,000 sp total.","ru":"У искателей приключений, чья мечта больше их наличной Славы, есть несколько способов приблизить её быстрее. Партия может пустить в ход некоторые из этих приёмов или все сразу, чтобы сделать свой замысел более достижимым, а Мастер вполне может настоять хотя бы на части из них, прежде чем ПИ добьются успеха.\n**Они могут тратить деньги.** Иногда задача решается, если завалить её деньгами: откупиться от досадных противников, возвести полезные постройки и сооружения или нанять достаточно помощников, чтобы продавить дело. Деньги часто полезны, но со временем отдача падает: когда всё полезное уже куплено, лишняя монета мало что даёт.\nТаблица рядом показывает, во сколько обходится пункт Славы, вложенный в начинание. Первые несколько пунктов достаются сравнительно дёшево, но дальше цена растёт стремительно. Рано или поздно наступает предел, за которым лишь богатства империй способны протолкнуть громадное начинание чистой денежной силой. Малые начинания и скромные замыслы обычно легко осуществить за наличные, но перемен в масштабе всего общества и исполинских предприятий не одолеть и богатейшей сокровищнице.\n**Они могут строить институции.** Если ПИ нужен верный им укреплённый монастырь, они могут либо вкладывать в цель Славу, пока союзные NPC и местные владыки не решат, что проще откупиться и построить его для них, либо действительно пойти и купить его за собственные деньги: нанять каменщиков, набрать монахов и найти надёжного аббата, который будет править от имени героев. Этих шагов может не хватить для полного достижения цели — придётся ещё гасить местное противодействие новому монастырю и преодолевать врождённую неправдоподобность затеи поставить монастырь именно там, где им захотелось, — но к успеху они продвинут изрядно.\nМастер назначает разумную цену институции, которую хотят построить герои, и разношёрстным работникам, которые нужны для её работы, опираясь на ориентиры этого раздела. Цены будут резко меняться от ситуации: великолепный каменный замок в пустыне без хорошего источника камня обойдётся куда дороже указанного, а нанять умелых ремесленников в большом столичном городе не в пример проще, чем отыскать их в пустой тундре.\nКогда цена уплачена, Мастер зачисляет в счёт цели подобающее количество Славы. Например, если общая цель — обезопасить торговый путь между двумя далёкими городами, укреплённый караван-сарай с дорожной стражей в дозорах может дать достаточно Славы, чтобы решить половину задачи. Остальное потребует разобраться с тем противодействием, что и порождает опасность: с грабежами разбойничьего вожака или свирепыми чудовищами, что рыщут вдоль дороги.\n**Они могут устранять противодействие.** Золотом, убеждением или острой сталью ПИ могут покончить с сопротивлением сил, стоящих на пути их замысла. С теми, кто продаётся, порой хватает долгого разговора и обмена ценностями, но с иными противниками не справиться без полноценных приключений. Кто-то потребует услуг в обмен на отказ от противодействия, исполненных для него поручений или врагов, погашенных мечами героев. А кто-то настолько непримиримо против самой идеи, что его остаётся либо убить, либо терпеть.\n**Они могут отправиться в приключения ради своей цели.** Такое приключение может быть простым — найти логово досаждающей стаи чудовищ, — а может быть и замысловатым: спуститься в древнее подземелье за утраченными регалиями, которые дадут моральное право предъявлять требования несговорчивому прелату. За такие приключения ПИ получают обычную награду Славой, но если их труды особенно относятся к делу, они могут получить и премию в счёт своей конкретной цели.\nРазмер премии определяет Мастер. Проще всего прикинуть про себя, скольких таких приключений стоит цель группы, и начислять Славу соответственно. Так, если Мастер считает, что три подобных приключения — это ровно столько внимания и сил, сколько группа должна потратить на достижение своей цели, каждое приключение снизит сложность цели на треть.\nПриключения — безусловно самый выгодный способ добиваться групповых целей, если удаётся придумывать приключения, относящиеся к делу. Так задумано: цель, которая даёт Мастеру лёгкий запас сюжетного сырья, — настоящий вклад в игру. Чем больше приключений Мастер извлекает из амбиций ПИ, тем легче готовиться к игре и тем вернее игроки вовлечены в кампанию.\n\n\n| Куплено Славы | Цена за пункт в серебряных монетах |\n|---|---|\n| Первые 1–4 пункта | 500 за пункт |\n| Следующие 4 пункта | 2 000 за пункт |\n| Следующие 8 пунктов | 4 000 за пункт |\n| Следующие 16 пунктов | 8 000 за пункт |\n| Следующие 32 пункта | 16 000 за пункт |\n| Следующие 64 пункта | 32 000 за пункт |\n| Дальнейшие пункты | Запретительно дорого |\n\nНапример, покупка 14 пунктов Славы обойдётся в 2 000 за первые четыре, 8 000 за следующие четыре и 24 000 за следующие шесть — всего 34 000 см."},{"n":"7.6.0","l":2,"te":"Achieving the Goal","tr":"Достижение цели","en":"Once the PCs have piled up enough Renown and lowered the difficulty enough to actually make it feasible to achieve the goal, they need to take the final steps necessary to complete the work. For a minor goal, this might be a simple matter of describing how they take care of the details, while a vast campaign of effort might culminate in several brutal, perilous adventures.\nThe time this change takes will rest with the GM’s judgment. If the PCs have been working on the project for some time already this effort should be taken into account and lessen the time required.\nFor mundane changes or changes the GM doesn’t really want to focus on, the PCs simply declare that they’re spending their Renown and using their own good name, personal prowess, and accumulated friendships and contacts to pull off their ambition. They might give examples of some of the ways they’re working to achieve the goal and specify what allies or resources they’re deploying. The GM then describes the outcome of their efforts. They may not be completely successful and events may not work out exactly as they planned, but they’ll get the substance of what they wanted.\nFor changes that push through opposition instead of subverting it, those that just pay the price for the opposition multiplier, the GM might make the PCs deal with consequences of that unquelled opposition. The kingdom might outlaw slavery, but if not all the opposition was defeated there may remain small pockets where the law doesn’t reach or the populace refuses to accept the freed slaves as fellow citizens. Solving these remnant problems might require their own projects or adventures.\nFor magical, impossible, or truly epic changes, the GM might oblige the PCs to face some culminating adventure or challenge before their ambition becomes real. They might’ve marshaled enough force and enough allies to depose the wicked king, but now the day of reckoning has come and they must face the tyrant and his elite guard in a pitched battle within the capital city. Some heroic changes might require several such adventures, with failure meaning that their efforts somehow fall short of complete success. If the tyrant is not slain, he might escape into exile to foment further trouble, or he might flee to a province he still can control.\nOnce the change is successfully achieved, the GM should take a little while to consider the larger ramifications of the event. Who in the surrounding area is going to take notice of the events, and what are they likely to do about it? What allies of the PCs might be strengthened by the change and able to push their own agendas further? What are the longer-term consequences of their actions, and how might these show up during future adventures?\nThe ultimate point of changes like these is not simply to make marks on the campaign map, but to create the seeds of future adventures and future events. The actions of the characters create reactions, and the deeper they involve themselves in the campaign setting, the more that setting is going to involve itself with them. This is ultimately a virtuous circle for the GM and the group, as it helps to generate adventures and events that matter to the players and spares the GM from confusion or uncertainty over what kind of adventuring grist to generate.","ru":"Когда ПИ накопили достаточно Славы и снизили сложность настолько, что цель стала действительно достижимой, остаётся сделать последние шаги и завершить дело. Для скромной цели, возможно, хватит просто описать, как герои улаживают частности, а огромная кампания трудов может увенчаться несколькими жестокими, гибельными приключениями.\nСколько времени займёт перемена — на усмотрение Мастера. Если ПИ уже какое-то время трудятся над начинанием, эти усилия следует учесть и сократить требуемый срок.\nДля обыденных перемен или перемен, на которых Мастер не хочет задерживаться, ПИ просто объявляют, что тратят Славу и пускают в ход своё доброе имя, личную доблесть и накопленные дружбы и связи, чтобы провернуть задуманное. Они могут привести примеры того, как именно работают на цель, и указать, каких союзников и какие ресурсы задействуют. Затем Мастер описывает исход их усилий. Возможно, успех будет неполным и события повернутся не совсем так, как планировалось, но суть желаемого герои получат.\nЕсли перемена продавлена сквозь противодействие, а не подорвала его изнутри — то есть за множитель противодействия просто уплачена цена, — Мастер может заставить ПИ разбираться с последствиями неусмирённого сопротивления. Королевство может объявить рабство вне закона, но если сломлено не всё противодействие, останутся островки, куда закон не дотягивается или где население отказывается принимать освобождённых рабов как сограждан. Решение этих остаточных проблем может потребовать собственных начинаний и приключений.\nДля магических, невозможных или воистину эпических перемен Мастер может обязать ПИ пройти завершающее приключение или испытание, прежде чем их замысел станет явью. Пусть они собрали достаточно сил и союзников, чтобы низложить злого короля, — но вот настал день расплаты, и им предстоит сойтись с тираном и его отборной стражей в решающей битве в столице. Иные героические перемены могут потребовать нескольких таких приключений, и провал означает, что усилия так и не увенчались полным успехом. Если тиран не убит, он может бежать в изгнание и сеять новые смуты — или укрыться в провинции, которую всё ещё держит в руках.\nКогда перемена успешно свершилась, Мастеру стоит немного подумать о её более широких последствиях. Кто в округе заметит случившееся и что, скорее всего, предпримет? Какие союзники ПИ усилятся благодаря перемене и смогут дальше продвигать собственные планы? Каковы долгосрочные последствия действий героев и как они могут проявиться в будущих приключениях?\nКонечный смысл таких перемен — не просто оставить отметки на карте кампании, а посеять семена будущих приключений и событий. Действия персонажей рождают ответные действия, и чем глубже герои врастают в мир кампании, тем сильнее этот мир вовлекается в их жизнь. В итоге это благотворный круг для Мастера и группы: он помогает порождать приключения и события, которые важны игрокам, и избавляет Мастера от растерянности и сомнений, из какого сюжетного сырья готовить игру."},{"n":"7.7.0","l":2,"te":"Magical Projects","tr":"Магические начинания","en":"Some projects are flatly impossible in nature, such as changing humans into some new humanoid species or creating a magical effect that covers an entire region. These efforts are a step beyond ordinary impossibility, as they often require measures entirely beyond the physical capabilities of normal civilizations.\nWhile exceedingly difficult, such projects are not out of the question for powerful mages who have the help of skilled adventurers. They do require a few more steps than an ordinary project would require, however.\nThe heroes must create one or more Workings dedicated to enabling the change, using the guidelines given in the Magic chapter. The scope of these Workings must be large enough to affect the scope of the change itself; if the alteration is to be done to an entire region, then a region-sized Working must be built. Workings so large as to affect an entire kingdom are beyond the scope of modern magic, and only some special quest into the fathomless past could discover the keys to grand, world-spanning alterations.\nThe degree of the Working will depend on the degree of the change. The devising of a race of humanoid creatures similar to humans but cosmetically different might be a Minor Working, while more substantial alterations will require great degrees of power. The summoning of a river from the depths of the earth might be a Major change for a small stream, while something the size of the Amazon might be of Supreme difficulty.\nIf the magical change is impossible but relatively modest in scope, then one great Working will be necessary to empower it. If the change is significant and will have major repercussions on the future area, it will take two, while a change that seems barely within the limits of possibility will need three Workings to support it, all of the appropriate degree and scope. The construction of these Workings often require adventures in their own right to find the critical components or esoteric substances needed to erect them, to say nothing of the material cost of the work.\nIf these Workings are later destroyed or corrupted the change itself may be damaged as well. Sometimes the effect is so graven on the world that it continues unsupported, but other times the change fades away into something more mundane. In the worst cases, the magic goes rampant and terrible consequences are born from its uncontrolled fury. As a consequence, most nations are highly averse to the construction of large-scale magical infrastructure, even when they can afford to do so.","ru":"Некоторые начинания невозможны по самой своей природе — например, превратить людей в новый гуманоидный вид или создать магический эффект, накрывающий целую область. Эти затеи на ступень выше обычной невозможности: им зачастую нужны средства, целиком лежащие за пределами физических возможностей обычных цивилизаций.\nПри всей их неимоверной трудности такие начинания не заказаны могущественным магам, которым помогают умелые искатели приключений. Однако шагов они требуют чуть больше, чем обычное начинание.\nГерои должны создать одно или несколько Творений, посвящённых этой перемене, по правилам главы о магии. Размах этих Творений должен покрывать размах самой перемены: если преобразить нужно целую область, придётся возвести Творение размаха области. Творения, способные охватить целое королевство, лежат за пределами современной магии, и лишь особый поход в бездонное прошлое мог бы открыть ключи к великим переменам мирового размаха.\nСтепень Творения зависит от глубины перемены. Сотворить расу гуманоидов, подобных людям, но внешне иных, может быть малым Творением, а более существенные превращения потребуют больших степеней силы. Вызвать реку из земных глубин — перемена большой степени, если речь о малом ручье, и высшей сложности, если о чём-то размером с Амазонку.\nЕсли магическая перемена невозможна, но сравнительно скромна по размаху, чтобы дать ей силу, понадобится одно грандиозное Творение. Если перемена значительна и серьёзно отзовётся на будущем этих мест, потребуется два, а перемена, которая кажется едва умещающейся в пределы возможного, потребует трёх поддерживающих Творений — все подобающей степени и размаха. Возведение этих Творений часто само по себе требует приключений: нужно добыть ключевые компоненты и эзотерические субстанции, без которых их не воздвигнуть, не говоря уж о материальной цене работ.\nЕсли позже эти Творения разрушат или осквернят, может пострадать и сама перемена. Иногда эффект так глубоко врезан в мир, что держится и без опоры, но бывает, что перемена выцветает во что-то более обыденное. В худших случаях магия срывается с привязи, и её необузданная ярость рождает ужасные последствия. Поэтому большинство государств крайне неохотно смотрит на строительство масштабной магической инфраструктуры, даже когда может себе её позволить."},{"n":"7.8.0","l":2,"te":"Major Projects and Existing Factions","tr":"Великие начинания и существующие фракции","en":"Players are likely to end up with goals or ambitions that directly involve them with local factions or potentially touch on Assets or other resources significant to faction powers. This is normal, and it’s not difficult to integrate the two systems when they happen to touch.\nAs a general rule, major projects should be treated just as adventures would be. When a project would plausibly damage a faction’s Assets, then the Assets will be damaged or destroyed. When they would create an Asset useful for a faction, whether one belonging to the players or to another group, then the Asset is created. If a faction doesn’t care for a project, it might turn into a source of opposition that must be quelled or overcome, while an allied faction might supply some portion of the Renown itself by taking an action to aid the PCs.\nThe help of a faction should be scaled by the GM; if an empire decides to give the PCs a castle, then it might be such a minor part of the faction’s holding that no Treasure expense or other effort is required to do so. A small religious cult that wants to help build a monastery for the PCs might not be able to give nearly as much help, and might simply be good for a quarter of the Renown needed if they spend an action assisting the PCs. Conversely, when a faction is opposed to some measure, the PCs will probably have to undertake an adventure to change its mind or pull the fangs that it’s using to interfere with their efforts.","ru":"Цели и амбиции игроков наверняка рано или поздно напрямую сведут их с местными фракциями или заденут Активы и другие ресурсы, важные для фракционных сил. Это нормально, и совместить обе системы там, где они соприкасаются, несложно.\nОбщее правило: великие начинания разбираются так же, как приключения. Если начинание правдоподобно повредило бы Активы фракции, Активы получают урон или уничтожаются. Если оно создало бы Актив, полезный фракции — принадлежащей игрокам или кому-то ещё, — Актив создаётся. Фракция, которой начинание не по нраву, может обернуться источником противодействия, которое придётся гасить или преодолевать, а союзная фракция может сама покрыть часть Славы, потратив действие на помощь ПИ.\nМасштаб фракционной помощи определяет Мастер. Если империя решает подарить ПИ замок, для её владений это может быть такая мелочь, что не потребуется ни трат Казны, ни иных усилий. Маленький религиозный культ, желающий помочь ПИ построить монастырь, даст куда меньше — возможно, покроет лишь четверть нужной Славы, потратив действие на содействие героям. И наоборот: если фракция противится какой-то мере, ПИ, скорее всего, придётся отправиться в приключение, чтобы переубедить её — или вырвать клыки, которыми она мешает их делу."},{"n":"7.9.0","l":2,"te":"Player-Run Factions and Major Projects","tr":"Фракции под управлением игроков и Великие начинания","en":"PCs who have the friendship or control of factions can leverage them to assist in their grand plans. A faction can assist on a project only once per faction turn, and this help counts as its action for the turn.\nWhen a faction helps, it spends one point of Treasure and decreases the difficulty of the project by the sum total of its Wealth, Force, and Cunning attributes, down to a minimum difficulty of 1 point. The faction can’t usually complete a major project on its own; it needs the PC or some driving personality to envision and implement the plan. A faction needs to spend Treasure and help only once on a project to decrease the difficulty. The difficulty reduction remains until the project is complete or the faction chooses to withdraw its support for some reason. More than one faction can contribute its help, if they can be persuaded.\nIf the faction is ideally suited to the project, such as a government establishing a new political order, or a religion instituting a new cultural norm, or a thieves’ guild forming a cabal of assassins, then their attribute total is doubled for purposes of calculating the new difficulty.\nIf the faction is willing or forced to go to extremes in helping a project, either out of desperation or the ruthless demands of its leadership, it can commit its Assets and own institutional health to the project. Any Asset or Base of Influence in the same location as the project can accept hit point damage to lower the difficulty; each hit point they spend lowers it by one point. This kind of commitment is difficult to calibrate safely; at the end of the spend, each Asset or Base of Influence that contributed suffers an additional 1d4 damage. This may be enough to destroy an Asset, or even destroy the faction itself if enough damage is done to a Base
