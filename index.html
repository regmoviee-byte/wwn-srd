<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Миры без числа — SRD 1.0</title>
<style>
:root{
  --bg:#F4F5F7; --paper:#FFFFFF; --ink:#1A1E26; --ink-soft:#39424F;
  --muted:#66707E; --faint:#8C96A3;
  --rule:#DCE1E8; --rule-soft:#EAEEF3;
  --accent:#8A5524; --accent-deep:#5E3714; --accent-wash:#F2E9DF;
  --mark:#FFF0BF; --mark-ink:#6B4E00;
  --serif:Charter,"Bitstream Charter",Cambria,Georgia,"Times New Roman",serif;
  --sans:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
  --mono:"Cascadia Mono",Consolas,"DejaVu Sans Mono",Menlo,monospace;
  --rail:312px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg); color:var(--ink); font-family:var(--sans); font-size:16px; line-height:1.5; -webkit-font-smoothing:antialiased}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:3px}

/* ── шапка ── */
.top{position:sticky; top:0; z-index:30; background:var(--paper); border-bottom:1px solid var(--rule);
  display:flex; align-items:center; gap:16px; padding:10px 20px; flex-wrap:wrap}
.brand{display:flex; flex-direction:column; gap:1px; margin-right:auto; min-width:0}
.brand b{font-family:var(--serif); font-size:19px; font-weight:600; letter-spacing:-.01em}
.brand span{font-size:11.5px; color:var(--faint); letter-spacing:.06em; text-transform:uppercase}
.search{position:relative; flex:0 1 320px; min-width:170px}
.search input{width:100%; font:inherit; font-size:14px; padding:8px 30px 8px 11px;
  border:1px solid var(--rule); border-radius:6px; background:var(--bg); color:var(--ink)}
.search input::placeholder{color:var(--faint)}
.search kbd{position:absolute; right:8px; top:50%; transform:translateY(-50%);
  font-family:var(--mono); font-size:11px; color:var(--faint); pointer-events:none}
.langsw{display:inline-flex; border:1px solid var(--rule); border-radius:6px; overflow:hidden; background:var(--bg)}
.langsw button{font:inherit; font-size:13px; font-weight:600; letter-spacing:.04em; padding:7px 15px;
  background:none; border:none; cursor:pointer; color:var(--muted)}
.langsw button+button{border-left:1px solid var(--rule)}
.langsw button[aria-pressed="true"]{background:var(--accent); color:#fff}

/* ── каркас ── */
.wrap{display:grid; grid-template-columns:var(--rail) minmax(0,1fr); align-items:start}
/* Без этого колонка сетки не может стать уже своего содержимого */
main{min-width:0}
.sheet{min-width:0; max-width:100%}
.rail{position:sticky; top:57px; height:calc(100vh - 57px); overflow-y:auto;
  border-right:1px solid var(--rule); background:var(--paper); padding:12px 0 40px}
.rail h4{margin:16px 18px 7px; font-size:11px; font-weight:700; letter-spacing:.09em; text-transform:uppercase; color:var(--faint)}
.nav-ch{margin-top:6px; padding:8px 18px 4px; font-family:var(--serif); font-size:12px; letter-spacing:.02em;
  color:var(--faint); text-transform:uppercase; font-weight:700}
.nav-item{display:grid; grid-template-columns:44px minmax(0,1fr); gap:9px; align-items:baseline; width:100%;
  text-align:left; font:inherit; background:none; border:none; cursor:pointer; padding:6px 18px;
  color:var(--ink-soft); border-left:3px solid transparent}
.nav-item:hover{background:var(--rule-soft)}
.nav-item[aria-current="true"]{background:var(--accent-wash); border-left-color:var(--accent); color:var(--ink); font-weight:600}
.nav-item .num{font-family:var(--mono); font-size:11.5px; color:var(--faint); font-variant-numeric:tabular-nums}
.nav-item[aria-current="true"] .num{color:var(--accent-deep)}
.nav-item .lbl{font-size:14px; line-height:1.35}
.nav-item.ch .lbl{font-family:var(--serif); font-size:15.5px; font-weight:700}
.snip{grid-column:2; font-size:12px; color:var(--muted); line-height:1.42; margin-top:2px}
.snip mark, .lbl mark{background:var(--mark); color:var(--mark-ink); padding:0 1px; border-radius:2px}
.empty{padding:18px; font-size:13.5px; color:var(--muted); line-height:1.5}

/* ── страница ── */
main{padding:32px 40px 130px}
.sheet{background:var(--paper); border:1px solid var(--rule); border-radius:8px; max-width:1020px}
.sheet-in{padding:32px 46px 46px}
.sec-num{font-family:var(--mono); font-size:12.5px; color:var(--accent-deep); letter-spacing:.05em;
  font-variant-numeric:tabular-nums; margin-bottom:6px}
h1.t{font-family:var(--serif); font-size:32px; line-height:1.16; font-weight:600; margin:0 0 5px;
  text-wrap:balance; letter-spacing:-.015em}
.alt-t{font-size:13.5px; color:var(--faint); font-style:italic; margin:0 0 4px}
.hr{height:1px; background:var(--rule); border:0; margin:24px 0}

.toc{margin:22px 0 4px; padding:15px 18px; background:var(--bg); border:1px solid var(--rule-soft); border-radius:7px}
.toc-h{font-size:11px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--faint); margin-bottom:9px}
.toc ol{margin:0; padding:0; list-style:none; display:grid; gap:2px; grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.toc a{display:grid; grid-template-columns:52px minmax(0,1fr); gap:8px; align-items:baseline;
  text-decoration:none; color:var(--ink-soft); padding:4px 6px; border-radius:4px; font-size:13.5px; line-height:1.35}
.toc a:hover{background:var(--accent-wash); color:var(--accent-deep)}
.toc .n{font-family:var(--mono); font-size:11.5px; color:var(--faint); font-variant-numeric:tabular-nums}

.sub{padding-top:6px; margin-top:30px; border-top:1px solid var(--rule)}
.sub:first-of-type{border-top:none}
h2.sh{font-family:var(--serif); font-size:23px; font-weight:600; line-height:1.22; margin:14px 0 3px; letter-spacing:-.012em}
h3.sh{font-family:var(--serif); font-size:18.5px; font-weight:600; line-height:1.25; margin:22px 0 3px}
.sh-n{font-family:var(--mono); font-size:11.5px; color:var(--accent-deep); font-variant-numeric:tabular-nums; letter-spacing:.05em}
.sh-alt{font-size:12.5px; color:var(--faint); font-style:italic; margin:0 0 12px}

/* ── текст правил ── */
/* Длинные ссылки без пробелов рвём принудительно, иначе они распирают колонку */
.prose{font-family:var(--serif); font-size:16.5px; line-height:1.6; max-width:70ch;
  overflow-wrap:anywhere; word-break:break-word}
.snip, .nav-item .lbl, #tip .td, .toc a{overflow-wrap:anywhere}
.prose>p{margin:0 0 11px}
.prose p.def{margin:0 0 9px; padding-left:17px; text-indent:-17px}
.prose p.def>strong:first-child{color:var(--accent-deep)}
.prose h4,.prose h5,.prose h6{font-family:var(--serif); line-height:1.25; letter-spacing:-.008em}
.prose h4{font-size:17.5px; font-weight:600; margin:22px 0 7px; color:var(--accent-deep)}
.prose h5{font-size:16px; font-weight:600; margin:18px 0 6px}
.prose h6{font-size:15px; font-weight:600; margin:16px 0 5px; color:var(--ink-soft)}
.prose ul{margin:0 0 12px; padding-left:21px}
.prose li{margin-bottom:4px}
.prose em{font-style:italic}
.prose code{font-family:var(--mono); font-size:.9em; background:var(--bg); padding:1px 4px; border-radius:3px}
.prose mark{background:var(--mark); color:var(--mark-ink); padding:0 2px; border-radius:2px}
.tw{overflow-x:auto; margin:14px 0 18px; border:1px solid var(--rule); border-radius:6px; max-width:100%}
.prose table{border-collapse:collapse; width:100%; font-family:var(--sans); font-size:13.5px; line-height:1.4}
.prose th,.prose td{padding:7px 11px; text-align:left; border-bottom:1px solid var(--rule-soft); vertical-align:top}
.prose th{background:var(--bg); font-size:11px; font-weight:700; letter-spacing:.05em; text-transform:uppercase;
  color:var(--muted); white-space:nowrap}
.prose tbody tr:last-child td{border-bottom:none}
.prose td{font-variant-numeric:tabular-nums}
.prose td:first-child{font-weight:600; color:var(--ink)}
.raw{font-family:var(--mono); font-size:12.5px; line-height:1.55; white-space:pre; overflow-x:auto;
  background:var(--bg); border:1px solid var(--rule); border-radius:6px; padding:12px 14px; margin:14px 0 18px; color:var(--ink-soft)}
.note{font-family:var(--sans); font-size:14px; line-height:1.55; color:var(--muted); margin:0 0 14px}

/* ── термины ── */
.term{border-bottom:1px dashed rgba(138,85,36,.6); cursor:pointer; color:inherit}
.term:hover{background:var(--accent-wash)}
#tip{position:absolute; z-index:60; max-width:430px; background:var(--paper); color:var(--ink);
  border:1px solid var(--rule); border-radius:8px; box-shadow:0 8px 28px rgba(20,28,40,.16);
  padding:13px 15px; font-family:var(--sans); font-size:13.5px; line-height:1.5; display:none}
#tip.on{display:block}
#tip .tt{font-family:var(--serif); font-size:16px; font-weight:600; margin-bottom:3px}
#tip .ts{font-family:var(--mono); font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--faint); margin-bottom:7px}
#tip .td{color:var(--ink-soft); max-height:230px; overflow-y:auto}
#tip .td p{margin:0 0 7px}
#tip .go{margin-top:10px; font:inherit; font-size:12.5px; font-weight:600; color:#fff; background:var(--accent);
  border:none; border-radius:5px; padding:6px 11px; cursor:pointer}
#tip .go:hover{background:var(--accent-deep)}

.pager{display:flex; gap:10px; justify-content:space-between; margin:26px 0 0; max-width:1020px}
.pager button{font:inherit; font-size:13.5px; padding:10px 15px; background:var(--paper); border:1px solid var(--rule);
  border-radius:6px; cursor:pointer; color:var(--ink-soft); max-width:47%; overflow:hidden;
  text-overflow:ellipsis; white-space:nowrap; text-align:left}
.pager button:hover:not(:disabled){border-color:var(--accent); color:var(--accent-deep)}
.pager button:disabled{opacity:.34; cursor:default}
.pager .r{text-align:right}
footer{max-width:1020px; margin:34px 0 0; padding-top:18px; border-top:1px solid var(--rule);
  font-size:12.5px; color:var(--faint); line-height:1.6}

/* ── режим встраивания в чужую страницу ──
   Рамка растёт под содержимое, своей прокрутки у неё нет, поэтому липкие
   элементы отключаем: липнуть тут не к чему, прокручивается внешняя страница. */
body.embed{background:transparent}
body.embed .top{position:static}
body.embed .rail{position:static; height:auto; overflow:visible; padding-bottom:22px}
body.embed main{padding:26px 30px 40px}
body.embed .sheet{max-width:none}
@media (max-width:1040px){:root{--rail:252px} main{padding:24px 20px 90px} .sheet-in{padding:26px 24px 34px}}
/* Кнопка «Разделы» — только на узких экранах */
.navbtn{display:none; align-items:center; gap:6px; font:inherit; font-size:13px; font-weight:600;
  padding:8px 13px; border:1px solid var(--rule); border-radius:6px; background:var(--bg);
  color:var(--ink-soft); cursor:pointer}
.navbtn[aria-expanded="true"]{background:var(--accent); border-color:var(--accent-deep); color:#fff}

@media (max-width:760px){
  .wrap{grid-template-columns:minmax(0,1fr)}
  .navbtn{display:inline-flex; order:2; padding:7px 11px}
  .top{gap:8px; padding:7px 12px}
  .brand{order:1; margin-right:auto}
  .brand b{font-size:15px; line-height:1.2}
  .brand span{display:none}
  .langsw{order:3}
  .langsw button{padding:6px 10px; font-size:12px}
  .search{order:4; flex:1 1 100%; min-width:0}
  .search input{padding:6px 28px 6px 10px; font-size:13px}
  .search kbd{display:none}
  /* Панель разделов накрывает текст, но НЕ шапку: иначе до кнопки «Закрыть» не добраться.
     Отступ сверху равен высоте шапки и выставляется скриптом — она переносится по строкам. */
  .rail{display:none; position:fixed; left:0; right:0; top:0; bottom:0; z-index:25;
    height:auto; max-height:none; overflow-y:auto; border-right:none; padding:6px 0 40px;
    box-shadow:0 -1px 0 var(--rule) inset}
  .rail.open{display:block}
  body.nav-open{overflow:hidden}
  /* Во встроенном режиме фиксировать нечего: страницу прокручивает хозяин */
  body.embed .rail{position:static; z-index:auto; padding-bottom:16px;
    border-bottom:1px solid var(--rule)}
  main{padding:16px 12px 70px}
  .sheet{border-radius:0; border-left:0; border-right:0; margin:0 -12px}
  .sheet-in{padding:20px 16px 30px}
  h1.t{font-size:24px} h2.sh{font-size:19px} h3.sh{font-size:16.5px}
  .prose{font-size:16px; max-width:none}
  .toc ol{grid-template-columns:1fr}
  .nav-item{padding:10px 16px}
  #tip{max-width:calc(100vw - 24px)}
  .pager{flex-direction:column; gap:8px}
  .pager button{max-width:none; text-align:left}
  .pager .r{text-align:left}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important; animation:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><b id="bTitle"></b><span id="bSub"></span></div>
  <button class="navbtn" id="navBtn" type="button" aria-expanded="false" aria-controls="rail"></button>
  <div class="search"><input id="q" type="search" autocomplete="off" aria-label="search"><kbd>/</kbd></div>
  <div class="langsw" role="group" aria-label="language">
    <button id="lRu" type="button" aria-pressed="true">Русский</button>
    <button id="lEn" type="button" aria-pressed="false">English</button>
  </div>
</header>

<div class="wrap">
  <nav class="rail" id="rail" aria-label="nav"></nav>
  <main>
    <div class="sheet"><div class="sheet-in" id="view"></div></div>
    <div class="pager"><button id="prev" type="button"></button><button id="next" type="button" class="r"></button></div>
    <footer id="foot"></footer>
  </main>
</div>
<div id="tip" role="tooltip"></div>

<script id="srd-data" type="application/json">{"sections":[{"n":"intro","l":1,"te":"An Introduction","tr":"Вступление","en":"The document that follows is intended as a reference for game designers who wish to produce role-playing games using the mechanics of the Worlds Without Number fantasy RPG. It is not intended to substitute for the free PDF version of the game as a player resource or other reference, so the text included here is largely devoid of examples or other instructional text and it is not written to be convenient as a table reference.\nInstead, it is meant to give other RPG designers an explicit document showing exactly what I consider to be freely-usable game mechanics or trivially implemented descriptive text.\nRegarding this document, its copyright and related rights are waived via CC0, with a summary of the waiver at https://creativecommons.org/publicdomain/zero/1.0/ and the legal text itself at https://creativecommons.org/publicdomain/zero/1.0/ legalcode.\nWhile I cannot offer legal advice to the reader, I am providing this introduction as a plain English description of my position.\n## The Reason for the Document\nTo my understanding, the only right that the following document confers that a user did not already have is the right to use its text verbatim in a commercial product. As game mechanics cannot be copyrighted, I have always felt it fair and reasonable for other designers to duplicate the mechanics of my games for their own ends, and the following document simply specifies clearly what I consider to be those unprotected mechanics.\nAlong with these mechanics, trivially-derived ideas such as the damage dice of weapons, the particular layout of tables, and other details of implementation are laid out so as to make clear that I claim no legal or moral right to restrict their use.\nCertain content such as specific spell or art names might arguably be said to be too unique in implementation to be freely copyable. As I have no desire to compel other designers to rework dozens of spells and abilities simply to avoid a name, I have intentionally placed these spell names and other specific text into this document.\n## A Note On Approvals\nAs the following document is affirmed under CC0 terms, I have absolutely no right to edit, approve, police, or restrict materials created with it. While I might have personal opinions regarding products derived from the document, their existence may in no way be represented as official or approved Sine Nomine Publishing products, nor should my endorsement be assumed for anything created. Designers may create what they wish, and I neither have nor desire any ability to control that.\n## What You Can Do\nWhile certain uses are implicit in a CC0 affirmation, I list some of them out here in plain English for the sake of clarity. These uses apply to both personal and commercial uses of the following document, whether for tabletop RPGs, VTTs, online utilities, computer games, or any other work.\n- You may copy verbatim any text in the following document for your own products, including tables and their contents.\n- You may copy, derive, modify, or expand any content in the following document in your own products.\n- You may publish products derived from the following document without crediting either me or this document, as I waive all moral rights to it to the extent permissible by law.\n- You do not need to release your products under a CC0 affirmation or any other license.\n- You may explicitly advertise your products as being compatible with Worlds Without Number or other Sine Nomine RPGs if, in your opinion, the product is compatible.\n- You may not represent your products as “official” Sine Nomine offerings or as otherwise licensed, produced, associated with, or approved by Sine Nomine Publishing.\n- You may not replicate text or setting material included in the Worlds Without Number free or deluxe game but not included in the following document. Setting details such as the default setting, the Latter Earth as described, or particular NPCs, places, or events are reserved as intellectual property and have been intentionally omitted from the following text, as have the bulk of the GM tools and other non-trivial creative content. These elements are actual creative works, and so I do not consider them free for common public use. Note that this does not apply to the basic concepts involved in the GM tools; while I keep my world tag text to myself, for example, I have no objection to someone else writing their own tags with the same enemy/friend/complication/thing/ place structure, or creating one-roll tables with their own text.\nKevin Crawford 3/13/24","ru":"Документ, который следует далее, предназначен как справочник для разработчиков игр, желающих выпускать ролевые игры на механиках фэнтези-НРИ Worlds Without Number. Он не призван заменить бесплатную PDF-версию игры как источник для игроков или иной справочник, поэтому включённый здесь текст почти лишён примеров и прочего пояснительного текста и написан без расчёта на удобство обращения к таблицам.\n\nВместо этого он должен дать другим разработчикам НРИ прямой документ, показывающий в точности то, что я считаю свободно используемыми игровыми механиками или тривиально реализуемым описательным текстом.\n\nВ отношении этого документа авторское право и связанные с ним права отменены посредством CC0; краткое изложение этого отказа от прав — по адресу https://creativecommons.org/publicdomain/zero/1.0/, а сам юридический текст — по адресу https://creativecommons.org/publicdomain/zero/1.0/legalcode.\n\nЯ не могу давать читателю юридических советов, но привожу это вступление как изложение моей позиции простым языком.\n\n## Зачем нужен этот документ\n\nНасколько я понимаю, единственное право, которое даёт нижеследующий документ и которого у пользователя ещё не было, — это право дословно использовать его текст в коммерческом продукте. Поскольку игровые механики не могут быть защищены авторским правом, я всегда считал справедливым и разумным, чтобы другие разработчики воспроизводили механики моих игр в своих целях, и нижеследующий документ просто ясно определяет, что именно я считаю такими незащищёнными механиками.\n\nВместе с этими механиками здесь изложены тривиально производные идеи — кости урона оружия, конкретная компоновка таблиц и прочие детали реализации, — чтобы было ясно: я не претендую ни на какое юридическое или моральное право ограничивать их использование.\n\nКое-какое содержимое — например, конкретные названия заклинаний или Искусств — можно было бы счесть слишком уникальным по реализации для свободного копирования. Но у меня нет никакого желания вынуждать других разработчиков переделывать десятки заклинаний и способностей лишь ради обхода названия, поэтому я намеренно поместил эти названия заклинаний и другой конкретный текст в этот документ.\n\n## Замечание об одобрении\n\nПоскольку нижеследующий документ заявлен на условиях CC0, у меня нет совершенно никакого права редактировать, одобрять, надзирать или ограничивать материалы, созданные на его основе. Хотя у меня могут быть личные мнения о продуктах, производных от этого документа, их существование ни в каком виде не может представляться как официальные или одобренные продукты Sine Nomine Publishing, и не следует предполагать мою поддержку чего-либо созданного. Разработчики могут создавать что хотят, и я не имею и не желаю иметь никакой возможности это контролировать.\n\n## Что вам разрешено\n\nХотя часть способов использования подразумевается самим заявлением CC0, я перечисляю некоторые из них здесь простым языком — ради ясности. Эти способы использования относятся как к личному, так и к коммерческому использованию нижеследующего документа, будь то настольные НРИ, VTT, онлайн-утилиты, компьютерные игры или любая другая работа.\n\n- Вы можете дословно копировать любой текст из нижеследующего документа для своих продуктов, включая таблицы и их содержимое.\n\n- Вы можете копировать, перерабатывать, изменять или расширять любое содержимое нижеследующего документа в своих продуктах.\n\n- Вы можете публиковать продукты, производные от нижеследующего документа, не указывая ни меня, ни этот документ, поскольку я отказываюсь от всех моральных прав на него в той мере, в какой это допускается законом.\n\n- Вам не нужно выпускать свои продукты по заявлению CC0 или по какой-либо другой лицензии.\n\n- Вы можете прямо заявлять в рекламе, что ваши продукты совместимы с Worlds Without Number или другими НРИ Sine Nomine, если, по вашему мнению, продукт совместим.\n\n- Вы *не можете* представлять свои продукты как «официальные» предложения Sine Nomine или как иным образом лицензированные, произведённые, связанные с Sine Nomine Publishing или одобренные ею.\n\n- Вы *не можете* воспроизводить текст или материал сеттинга, включённый в бесплатную или делюкс-версию игры Worlds Without Number, но не включённый в нижеследующий документ. Детали сеттинга — такие как сеттинг по умолчанию, Последняя Земля в её описанном виде или отдельные NPC, места или события — сохраняются как интеллектуальная собственность и намеренно не включены в нижеследующий текст, как и большая часть инструментов Мастера и прочего нетривиального творческого содержимого. Эти элементы — настоящие творческие произведения, и потому я не считаю их свободными для общего публичного использования. Обратите внимание: это не относится к базовым концепциям, лежащим в основе инструментов Мастера; например, хотя текст моих мировых тегов я оставляю за собой, я не возражаю, чтобы кто-то другой написал свои собственные теги с той же структурой «враг/друг/осложнение/вещь/место» или создал таблицы одного броска со своим текстом.\n\nКевин Кроуфорд, 13 марта 2024"},{"n":"1.0.0","l":1,"te":"Character Creation","tr":"Создание персонажа","en":"","ru":""},{"n":"1.1.0","l":2,"te":"Attributes","tr":"Характеристики","en":"A character has six attributes ranging from 3 to 18, reflecting a range from the minimum viable capacity for a playable character to the maximum normal human level.\nThree of these attributes are physical. Strength, reflecting physical prowess, melee combat, carrying gear, and brute force. Dexterity, reflecting speed, evasion, manual dexterity, reaction time, and combat initiative. Constitution, reflecting hardiness, enduring injury, and tolerating large amounts of magical healing.\nThree are mental attributes. Intelligence, reflecting memory, reasoning, technical skills, and general education. Wisdom, reflecting noticing things, making judgments, reading situations, and intuition. Charisma, reflecting commanding, charming, attracting attention, and being taken seriously.\nNPCs do not normally have attributes. If necessary, the GM can choose them as appropriate, but usually they are assumed to have average scores if it’s ever relevant.","ru":"У персонажа шесть характеристик со значениями от 3 до 18 — от минимума, при котором персонажем ещё можно играть, до предела обычных человеческих возможностей.\n\nТри из них — физические. Сила отвечает за физическую мощь, ближний бой, переноску снаряжения и грубую силу. Ловкость — за скорость, уклонение, ловкость рук, время реакции и боевую инициативу. Телосложение — за выносливость, стойкость к ранам и способность переносить большие объёмы магического исцеления.\n\nТри характеристики — ментальные. Интеллект отвечает за память, рассуждение, технические навыки и общую образованность. Мудрость — за наблюдательность, здравые суждения, чтение ситуаций и интуицию. Харизма — за умение командовать, очаровывать, привлекать внимание и добиваться, чтобы тебя принимали всерьёз.\n\nУ NPC характеристик обычно нет. При необходимости Мастер может назначить их по своему усмотрению, но, как правило, считается, что значения у них средние, — если это вообще когда-нибудь понадобится."},{"n":"1.1.1","l":3,"te":"Generating Attributes","tr":"Определение характеристик","en":"To generate their six attributes, the player rolls 3d6 in order, once for each attribute. At any point before section 1.5.0 in character creation the player may substitute a score of 14 for one rolled score.\nOptionally, a player may choose to assign their stats from the following array of numbers: 14, 12, 11, 10, 9, and 7, divided up as desired among the attributes. If an array is used a score may not be substituted with a 14 later.","ru":"Чтобы получить шесть характеристик, игрок бросает 3d6 по порядку, по разу на каждую. В любой момент создания персонажа до раздела 1.5.0 игрок может заменить одно выпавшее значение на 14.\n\nПо желанию игрок может вместо бросков распределить между характеристиками следующий набор значений: 14, 12, 11, 10, 9 и 7 — как ему угодно. Если использован набор, заменить значение на 14 позже уже нельзя."},{"n":"1.1.2","l":3,"te":"Attribute Modifiers","tr":"Модификаторы характеристик","en":"Each attribute has a modifier, usually ranging from -2 to +2. This modifier is added to skill checks, attack rolls, damage rolls, Shock damage, and the relevant saving throw targets.\nAn attribute score of 3 has a modifier of -2. A score of 4-7 has a modifier of -1. A score of 8-13 has a modifier of +0. A score of 14-17 has a modifier of +1. A score of 18 has a modifier of +2.\nSome Foci and abilities may add bonuses or penalties to an attribute’s base modifier. Such bonuses or penalties cannot increase the modifier above +2 or below -2 unless explicitly indicated. Some injuries or character advancements may alter an attribute score; this new score may change the attribute’s modifier.","ru":"У каждой характеристики есть модификатор, обычно в пределах от -2 до +2. Он добавляется к проверкам навыков, броскам атаки, броскам урона, урону Шока и к порогам соответствующих спасбросков.\n\nЗначение характеристики 3 даёт модификатор -2. Значения 4–7 дают -1. Значения 8–13 — +0. Значения 14–17 — +1. Значение 18 — +2.\n\nНекоторые Фокусы и способности могут давать бонусы или штрафы к базовому модификатору характеристики. Такие бонусы и штрафы не могут поднять модификатор выше +2 или опустить ниже -2, если прямо не сказано иное. Травмы или развитие персонажа могут менять значение характеристики; новое значение может изменить и её модификатор."},{"n":"1.2.0","l":2,"te":"Skills","tr":"Навыки","en":"A character’s skills are the PC’s learned abilities. A newly-created character starts with a few relevant skills and may acquire more as they advance in level. NPCs do not have individual skills, instead relying on their combat stat line’s skill bonus when relevant. See section 2.3.0 for the rules for making skill checks.","ru":"Навыки — это выученные умения ПИ. Свежесозданный персонаж начинает с несколькими подходящими навыками и набирает новые с ростом уровней. У NPC отдельных навыков нет: где это важно, они полагаются на бонус навыка из своей боевой строки статов. Правила проверок навыков см. в разделе 2.3.0."},{"n":"1.2.1","l":3,"te":"Skill Levels","tr":"Уровни навыков","en":"Skills are rated on a scale between level-0 and level-4. A character must reach a certain minimum experience level to develop a skill to level-2 or beyond.\nSkill Level\n| Level-0 | Basic competence in the skill, such as an ordinary practitioner would have |\n|---|---|\n| Level-1 | An experienced professional in the skill, clearly better than most |\n| Level-2 | Veteran expert, one respected even by those with considerable experience |\n| Level-3 | Master of the skill, likely one of the best in the city |\n| Level-4 | Superlative expertise, one of the best in the world |","ru":"Навыки измеряются по шкале от уровня-0 до уровня-4. Чтобы развить навык до уровня-2 и выше, персонаж должен достичь определённого минимального уровня опыта.\n\n| Уровень навыка | Что означает |\n|---|---|\n| Уровень-0 | Базовое владение навыком — как у рядового практика |\n| Уровень-1 | Опытный профессионал, заметно лучше большинства |\n| Уровень-2 | Ветеран-эксперт, которого уважают даже люди с немалым опытом |\n| Уровень-3 | Мастер навыка, скорее всего один из лучших в городе |\n| Уровень-4 | Непревзойдённое мастерство, один из лучших в мире |"},{"n":"1.2.2","l":3,"te":"Gaining Skills in Character Creation","tr":"Получение навыков при создании персонажа","en":"Characters gain skills from their Backgrounds as described in the section below and from a single free pick in section 1.7.4. Some Foci also grant particular skills. The first time a skill is picked or given, a character obtains it at level-0. The second time it is picked or given, the skill becomes level-1. The third and further times a skill is picked or given during character creation, the player instead picks any other skill that is not already level-1. No character can begin play with skills above level-1.","ru":"Персонажи получают навыки от своих Происхождений, как описано в разделе ниже, и одним бесплатным выбором из раздела 1.7.4. Некоторые Фокусы тоже дают определённые навыки. Когда навык выбран или получен впервые, персонаж владеет им на уровне-0. Во второй раз навык становится уровнем-1. В третий и последующие разы за время создания персонажа игрок вместо этого выбирает любой другой навык, который ещё не на уровне-1. Ни один персонаж не может начать игру с навыками выше уровня-1."},{"n":"1.2.3","l":3,"te":"The Skill List","tr":"Список навыков","en":"The following skills are standard to most fantasy campaigns. GMs may add or subtract from this list for specialized settings. Some skills may overlap at points in their application; the character may use either skill at their discretion.\n**Administer:** Keep an organization running smoothly, scribe things well, plan out logistics, identify incompetent or treacherous workers, analyze records or archives, or otherwise do things that an executive or middle-manager would need to do.\n**Connect:** Find or know people who are useful to your purposes, make friendships or social acquaintances, know who to talk to get favors or services, and call on the help or resources of organizations you belong to. Connect covers your PC’s ability to find the people you need, though convincing them to help may require more than this.\n**Convince:** Persuade a listener that something you are saying is true. Naturally, the more implausible the claim or more emotionally repugnant it is to them, the more difficult it is to persuade them. Furthermore, how they act on their newfound conviction is up to them and their motivations, and may not be perfectly predictable.\n**Craft:** Craft or repair goods and technology appropriate to the PC’s background and society. The Craft skill can be used for a wide range of artisan pursuits, though a GM is within their rights to keep the PC from building complex things that are too far away from their past background and experience.\n**Exert:** Run, swim, climb, jump, labor for long periods, throw things, or otherwise exert your physical strength, stamina, and coordination. Even a PC with poor physical attributes might have a good Exert skill reflecting athletic training and expertise in making the most of their available talents.\n**Heal:** Treat wounds, cure diseases, neutralize poisons, diagnose psychological health issues, and otherwise tend to the wounds of body and mind. The Heal skill cannot cure lost hit points directly, but it’s a vital skill in stabilizing Mortally Wounded allies or ensuring clean recovery.\n**Know:** Know matters of history, geography, natural science, zoology, and other academic fields appropriate to a sage or scholar. While some sages might specialize in particular fields, most learned men and women in this age have a broad range of understanding, and will rarely be unable to even attempt to answer a question relevant to this skill.\n**Lead:** Inspire others to follow your lead and believe in your plans and goals. Manage subordinates and keep them focused, loyal, and motivated in the face of danger or failure. A successful leader will keep their subordinate’s faith and confidence even when reason might make the leader’s plan appear questionable at best.\n**Magic:** Cast or analyze magic and know things about famous mages or notable magical events. Classes that can’t cast spells obtain only intellectual and scholarly benefits from this skill.\n**Notice:** Notice small details, impending ambushes, hidden features, or concealed objects. Detect subtle smells, sounds, or other sensory input. Notice cannot be used simply to detect a lie, but keen attention can often discern a subject’s emotional state.\n**Perform:** Sing, act, dance, orate, or otherwise perform impressively for an audience. Compose music, plays, writings, or other works of performance art. Most performers will have a particular field they excel at, though polymaths might exist if the PC’s background is appropriate for such versatility.\n**Pray:** Perform the clerical rites of your religion, and be familiar with the gods, demons, and taboos of major and minor faiths, and identify iconography and persons of religious importance. Pray also helps you know the state of local faiths and the important persons in their hierarchies.\n**Punch:** Fight unarmed or with natural body weaponry. Punch, kick, grapple, or otherwise brawl without the benefit of man-made tools. This mode of fighting is inefficient at best without some special Focus to improve it, but it’s reliably non-lethal.\n**Ride:** Ride an animal, drive a cart or carriage, or otherwise deal with land transportation. This skill also includes competence at mount care and tending, basic cart or carriage repair, judging good horseflesh, and other skills appropriate to a beast-rider of whatever society the PC comes from.\n**Sail:** Sail or repair a ship, build small craft, navigate by the stars, read sea weather, manage sailors, and otherwise conduct the business of a professional mariner. This skill may apply to more esoteric means of vehicular travel in some societies.\n**Shoot:** Fire a bow or crossbow or throw a hurled weapon. Maintain ranged weaponry and fletch arrows.\n**Sneak:** Move silently, hide in shadows, avoid notice, pick pockets, disguise yourself, pick locks, defeat traps, or otherwise overcome security measures.\n**Stab:** Fight with melee weapons or throw a hurled weapon. Maintain and identify weaponry.\n**Survive:** Hunt, fish, navigate by the stars, mitigate environmental hazards, identify plants and wildlife, and craft basic survival tools and shelter. A PC’s Survive skill is most pertinent to the environments in their background, but the basic principles can be applied in all but the most alien environments.\n**Trade:** Buy and sell at a profit, identify the worth of goods or treasures, deal with merchants and traders, find black-market goods and services, and know laws regarding smuggling and contraband.\n**Work:** This skill is a catch-all for any profession that might not otherwise merit its own skill, such as a painter, lawyer, farmer, or herdsman. The precise skill it represents will vary with the PC’s background.","ru":"Перечисленные ниже навыки стандартны для большинства фэнтезийных кампаний. Для особых сеттингов Мастер может дополнять или сокращать этот список. Некоторые навыки местами пересекаются в применении; персонаж волен пользоваться любым из подходящих на своё усмотрение.\n\n**Атлетика:** Бегать, плавать, лазать, прыгать, подолгу трудиться, метать предметы — словом, напрягать физическую силу, выносливость и координацию. Даже ПИ со слабыми физическими характеристиками может иметь хорошую Атлетику: она отражает тренированность и умение выжать максимум из доступных талантов.\n\n**Верховая езда:** Ездить верхом, править телегой или каретой — управляться с сухопутным транспортом. Навык включает уход за верховыми животными, простую починку телег и карет, умение оценить добрую лошадь и прочие умения наездника из того общества, откуда родом ПИ.\n\n**Внимание:** Замечать мелкие детали, готовящиеся засады, скрытые особенности и спрятанные предметы. Улавливать слабые запахи, звуки и прочие сигналы чувств. Внимание само по себе не распознаёт ложь, но зоркий наблюдатель часто прочтёт эмоциональное состояние собеседника.\n\n**Выживание:** Охотиться, рыбачить, ориентироваться по звёздам, справляться с опасностями среды, распознавать растения и живность, мастерить простейшие орудия выживания и укрытия. Выживание ПИ сильнее всего в средах из его прошлого, но основные принципы применимы почти везде, кроме самых чуждых мест.\n\n**Выступление:** Петь, играть на сцене, танцевать, ораторствовать — впечатлять публику любым исполнением. Сочинять музыку, пьесы, тексты и другие произведения исполнительского искусства. У большинства артистов есть своя сильная область, хотя встречаются и универсалы, если прошлое ПИ оправдывает такую разносторонность.\n\n**Знание:** Разбираться в истории, географии, естественных науках, зоологии и других учёных областях, приличествующих мудрецу или книжнику. Иные мудрецы углубляются в отдельные области, но большинство учёных мужей и жён этой эпохи обладают широким кругозором и редко окажутся неспособны хотя бы попытаться ответить на вопрос по этому навыку.\n\n**Клинок:** Драться оружием ближнего боя или метать метательное оружие. Ухаживать за оружием и разбираться в нём.\n\n**Кулак:** Драться без оружия или природным оружием тела. Бить кулаком, пинать, бороться — драться без помощи рукотворных орудий. Без особого Фокуса такой бой в лучшем случае малоэффективен, зато надёжно нелетален.\n\n**Лидерство:** Вдохновлять других идти за тобой и верить в твои планы и цели. Руководить подчинёнными, сохраняя их собранность, верность и боевой настрой перед лицом опасности или неудачи. Успешный лидер удержит веру и доверие подчинённых даже тогда, когда рассудок счёл бы его план в лучшем случае сомнительным.\n\n**Магия:** Колдовать и разбирать магию, знать о прославленных магах и громких магических событиях. Классам, не способным читать заклинания, этот навык даёт только умственную и книжную пользу.\n\n**Медицина:** Лечить раны, исцелять болезни, нейтрализовать яды, распознавать душевные недуги — заботиться о ранах тела и разума. Навык Медицина не восстанавливает потерянные пункты здоровья напрямую, но он жизненно важен, чтобы стабилизировать смертельно раненных союзников или обеспечить чистое выздоровление.\n\n**Молитва:** Совершать обряды своей религии, знать богов, демонов и запреты больших и малых вер, узнавать священные образы и лиц духовного звания. Молитва также помогает знать положение местных культов и важных персон в их иерархиях.\n\n**Мореходство:** Водить и чинить корабли, строить малые суда, прокладывать курс по звёздам, читать морскую погоду, управлять матросами — вести дело профессионального морехода. В некоторых обществах этот навык может распространяться и на более диковинные средства передвижения.\n\n**Работа:** Навык-вместилище для любой профессии, не заслуживающей отдельного навыка: художник, законник, земледелец, пастух. Что именно он означает, зависит от прошлого ПИ.\n\n**Ремесло:** Изготавливать и чинить вещи и технику, привычные для прошлого ПИ и его общества. Навык Ремесло годится для широкого круга ремесленных занятий, но Мастер вправе не позволить ПИ строить сложные вещи, слишком далёкие от его прошлого и опыта.\n\n**Связи:** Находить и знать людей, полезных для твоих целей, заводить дружбу и знакомства, знать, к кому обратиться за услугой или сервисом, и привлекать помощь и ресурсы организаций, к которым ты принадлежишь. Связи отвечают за умение ПИ найти нужных людей, но чтобы убедить их помочь, может понадобиться нечто большее.\n\n**Скрытность:** Двигаться бесшумно, прятаться в тенях, избегать внимания, шарить по карманам, менять облик, вскрывать замки, обезвреживать ловушки — обходить меры защиты.\n\n**Стрельба:** Стрелять из лука или арбалета либо метать метательное оружие. Ухаживать за оружием дальнего боя и оперять стрелы.\n\n**Торговля:** Покупать и продавать с прибылью, оценивать товары и сокровища, вести дела с купцами и торговцами, находить товары и услуги чёрного рынка, знать законы о контрабанде и запретных товарах.\n\n**Убеждение:** Уверить слушателя, что твои слова — правда. Разумеется, чем неправдоподобнее утверждение и чем сильнее оно претит собеседнику, тем труднее его убедить. К тому же, как он поступит со своей новообретённой уверенностью, зависит от него самого и его мотивов — и не всегда предсказуемо.\n\n**Управление:** Поддерживать бесперебойную работу организации, аккуратно вести записи, планировать снабжение, распознавать негодных или вероломных работников, разбирать записи и архивы — словом, делать всё то, что требуется от начальника или управленца среднего звена."},{"n":"1.3.0","l":2,"te":"Backgrounds","tr":"Происхождения","en":"Every character has a Background, a past reflecting their career before they took up adventuring. A background may be chosen from the list below or a new one made up with GM permission.","ru":"У каждого персонажа есть Происхождение — прошлое, отражающее его занятие до того, как он подался в искатели приключений. Происхождение можно выбрать из списка ниже или, с разрешения Мастера, придумать новое."},{"n":"1.3.1","l":3,"te":"Background Skills","tr":"Навыки Происхождения","en":"When a Background is chosen, a PC immediately gets its free skill at level-0. At that point, the player decides whether to gain further skills randomly or to pick specific choices.\nIf they choose randomly, they may make three rolls divided between the Growth and Learning tables of their background in any way they wish, including taking all three from just one table. If they pick specific choices they can pick any two skills from the Learning table, including picking the same one twice to raise it to level-1. They may not pick the “Any Skill” option, if it exists.\nA skill pick of “Any Combat” means the player can pick Shoot, Stab, or Punch. A skill roll of “Any Skill” means they can pick any skill from the list above. Some campaigns may involve special magical or psychic skills; these cannot be chose with the Any Skill pick.\nIf an attribute bonus is rolled, such as “+2 Physical”, the player may apply it to any physical attribute or split the bonus between two physical attributes. The same principle applies to Mental attribute increases. “Any Stat” increases may be applied to either physical or mental attributes. No attribute can be raised above 18.","ru":"Выбрав Происхождение, ПИ сразу получает его бесплатный навык на уровне-0. Затем игрок решает, получать ли дальнейшие навыки случайно или выбирать их самому.\n\nЕсли он выбирает случай, то делает три броска, распределяя их между таблицами Развитие и Обучение своего Происхождения как угодно, хоть все три по одной таблице. Если выбирает сам — берёт любые два навыка из таблицы Обучение, в том числе один и тот же дважды, чтобы поднять его до уровня-1. Вариант «Любой навык», если он есть в таблице, выбирать так нельзя.\n\nВыбор «Любой боевой» означает, что игрок может взять Стрельбу, Клинок или Кулак. Результат «Любой навык» позволяет взять любой навык из списка выше. В некоторых кампаниях есть особые магические или психические навыки; их нельзя получить выбором «Любой навык».\n\nЕсли выпал бонус к характеристике, например «+2 Физические», игрок может отдать его любой физической характеристике или разделить между двумя физическими. Тот же принцип действует для прибавок к Ментальным характеристикам. Прибавки «Любая характеристика» можно класть и на физические, и на ментальные. Ни одну характеристику нельзя поднять выше 18."},{"n":"1.3.2","l":3,"te":"New Backgrounds","tr":"Новые Происхождения","en":"To create a new background, the player describes it to the GM and picks an existing background table that best fits the concept. Assuming the GM approves it, they may then roll or pick as usual. If no existing background table fits, they may make a new one with the GM’s permission.","ru":"Чтобы создать новое Происхождение, игрок описывает его Мастеру и подбирает существующую таблицу Происхождения, которая лучше всего подходит замыслу. Если Мастер одобряет, дальше игрок бросает или выбирает как обычно. Если не подходит ни одна существующая таблица, с разрешения Мастера можно составить новую."},{"n":"1.3.3","l":3,"te":"Example Backgrounds","tr":"Примеры Происхождений","en":"The two following backgrounds are examples of those possible for a player, with others to be created as the designer thinks appropriate for their setting. The free granted skill is listed after each background’s name.\n**Artisan — Craft**\n| d6 | Growth | d8 | Learning |\n|---|---|---|---|\n| 1 | +1 Any Stat | 1 | Connect |\n| 2 | +2 Physical | 2 | Convince |\n| 3 | +2 Physical | 3 | Craft |\n| 4 | +2 Mental | 4 | Craft |\n| 5 | Exert | 5 | Exert |\n| 6 | Any Skill | 6 | Know |\n|  |  | 7 | Notice |\n|  |  | 8 | Trade |\n**Barbarian — Survive**\n| d6 | Growth | d8 | Learning |\n|---|---|---|---|\n| 1 | +1 Any Stat | 1 | Any Combat |\n| 2 | +2 Physical | 2 | Connect |\n| 3 | +2 Physical | 3 | Exert |\n| 4 | +2 Mental | 4 | Lead |\n| 5 | Exert | 5 | Notice |\n| 6 | Any Skill | 6 | Punch |\n|  |  | 7 | Sneak |\n|  |  | 8 | Survive |","ru":"Два Происхождения ниже — примеры того, что доступно игроку; остальные создаются по усмотрению разработчика, как подходит его сеттингу. Бесплатный навык указан после названия каждого Происхождения.\n\n**Варвар** — Выживание\n\n| d6 | Развитие | d8 | Обучение |\n|---|---|---|---|\n| 1 | +1 Любая характеристика | 1 | Любой боевой |\n| 2 | +2 Физические | 2 | Связи |\n| 3 | +2 Физические | 3 | Атлетика |\n| 4 | +2 Ментальные | 4 | Лидерство |\n| 5 | Атлетика | 5 | Внимание |\n| 6 | Любой навык | 6 | Кулак |\n| – | – | 7 | Скрытность |\n| – | – | 8 | Выживание |\n\n**Ремесленник** — Ремесло\n\n| d6 | Развитие | d8 | Обучение |\n|---|---|---|---|\n| 1 | +1 Любая характеристика | 1 | Связи |\n| 2 | +2 Физические | 2 | Убеждение |\n| 3 | +2 Физические | 3 | Ремесло |\n| 4 | +2 Ментальные | 4 | Ремесло |\n| 5 | Атлетика | 5 | Атлетика |\n| 6 | Любой навык | 6 | Знание |\n| – | – | 7 | Внимание |\n| – | – | 8 | Торговля |"},{"n":"1.4.0","l":2,"te":"Classes","tr":"Классы","en":"PCs are uncommon in that each of them has a class. A class represents the particular skills, abilities, or talents that make the PC a viable adventurer. NPCs do not normally have classes, though they may have special abilities or powers of their own.","ru":"ПИ необычны тем, что у каждого из них есть класс. Класс представляет особые навыки, способности и таланты, которые делают ПИ дельным искателем приключений. У NPC классов обычно нет, хотя у них могут быть собственные особые способности и силы."},{"n":"1.4.1","l":3,"te":"The Three Base Classes","tr":"Три базовых класса","en":"The three base classes are Expert, Mage, and Warrior. Each of these base classes has its own hit die, attack progression, and Focus advancement. PCs use the tables for the class they choose.","ru":"Три базовых класса — Эксперт, Маг и Воин. У каждого из них своя кость здоровья, своя прогрессия атаки и своё развитие Фокусов. ПИ пользуется таблицами выбранного класса."},{"n":"1.4.2","l":3,"te":"Full and Partial Classes","tr":"Полные и частичные классы","en":"There are two kinds of classes: Full classes and Partial classes. A PC may choose to pick a single Full class, committing completely to that class’ profession, or they may choose to become an Adventurer and pick two Partial classes instead, mixing their abilities.\nThe Warrior, Expert, High Mage, Necromancer, Invoker, and Elementalist classes may be taken either as a Full class or as a Partial class. In the former case, the PC gains the full range of powers granted to the profession. If taken as a Partial class, a more restricted range of abilities are granted.\nThe Healer, Vowed, Bard, Thought Noble, Accursed, Wise, Mageslayer, Skinshifter, Duelist, Beastmaster, and Blood Priest can only be taken as Partial classes. These classes are limited in scope, and must be paired with another Partial class.","ru":"Классы бывают двух видов: полные и частичные. ПИ может взять один полный класс, целиком посвятив себя этому ремеслу, — или стать Авантюристом и взять вместо этого два частичных класса, смешав их способности.\n\nВоина, Эксперта, Высшего мага, Некроманта, Волхва и Стихийника можно брать и как полный класс, и как частичный. В первом случае ПИ получает весь спектр способностей, положенных профессии. Взятый как частичный, класс даёт более узкий набор способностей.\n\nЦелителя, Обетника, Барда, Вельможу мысли, Проклятого, Ведуна, Магоборца, Зверолика, Дуэлянта, Повелителя зверей и Жреца крови можно брать только как частичные классы. Их возможности ограничены, и такой класс обязан идти в паре с другим частичным."},{"n":"1.4.3","l":3,"te":"The Adventurer Class","tr":"Класс Авантюрист","en":"The Adventurer is a special class that allows the PC to take two Partial classes and mix them together. These may be Partial-only classes, such as a Healer/Vowed, or they may be Partial versions of Warrior, Expert, or Mage classes, such as a Partial Expert/Thought Noble. A dual-specialization spellcaster is also possible by mixing a Partial High Mage/Partial Elementalist together, for example.","ru":"Авантюрист — особый класс, позволяющий ПИ взять два частичных класса и соединить их. Это могут быть классы, существующие только как частичные, — например, Целитель/Обетник, — или частичные версии Воина, Эксперта и Мага, например частичный Эксперт/Вельможа мысли. Возможен и заклинатель двойной специализации — скажем, смесь частичного Высшего мага и частичного Стихийника."},{"n":"1.4.4","l":3,"te":"Classes and Effort","tr":"Классы и Усилие","en":"Some classes have special abilities that are fueled with magical power, inner focus, or some other reserve of energy. This capacity is measured in points of Effort, a resource the PC can commit to activate their abilities.\nEvery class that uses Effort has its own unique pool: High Mage Effort, Vowed Effort, Healer Effort, and so forth. Adventurers with two Partial classes that use Effort have two separately-tracked pools, one for each class. Points of Effort from one class cannot be used to fuel powers from another.\nThe maximum Effort of a Full class is equal to 1 plus a relevant skill level and ability modifier given by the class. A Partial class uses the same formula, but with 1 fewer point of Effort, to a minimum of 1.","ru":"У некоторых классов есть особые способности, которые питаются магической силой, внутренней сосредоточенностью или иным запасом энергии. Эта ёмкость измеряется в пунктах Усилия — ресурсе, который ПИ задействует, чтобы включать свои способности.\n\nУ каждого класса, использующего Усилие, свой отдельный пул: Усилие Высшего мага, Усилие Обетника, Усилие Целителя и так далее. Авантюрист с двумя частичными классами, использующими Усилие, ведёт два отдельных пула, по одному на класс. Пунктами Усилия одного класса нельзя питать способности другого.\n\nМаксимум Усилия полного класса равен 1 плюс уровень соответствующего навыка и модификатор характеристики, указанные классом. Частичный класс использует ту же формулу, но с 1 пунктом Усилия меньше, минимум 1."},{"n":"1.4.4.1","l":4,"te":"Committing Effort","tr":"Задействование Усилия","en":"Most class powers require that Effort be Committed. Committing Effort is done as part of activating a power, and ties up the Effort for a varying amount of time depending on the ability used.\nSome powers Commit Effort for the duration. This means the Effort remains Committed as long as the power is active. The PC can reclaim the Committed Effort at any time as an Instant action, deactivating the power.\nSome powers Commit Effort for the scene. The Effort remains Committed until the end of the scene, after which it returns to the PC. It cannot be reclaimed earlier, even if the ability it fuels is only good for a single attack or action. A scene usually amounts to a single fight, event, or dungeon turn, almost never lasting more than fifteen minutes. Further specifics are provided in the time section of the game rules.\nSome powers Commit Effort for the day. Once Committed, this Effort can be recovered only after a comfortable night’s rest. If the PC is hungry, cold, sick, or sleeping without the benefits of a bedroll or other basic comforts, this Effort cannot be recovered.\nActivating a power only ever requires Committing a single point of Effort, unless the power itself says otherwise.","ru":"Большинство классовых способностей требуют задействовать Усилие. Усилие задействуется при активации способности и остаётся занятым на разный срок — в зависимости от использованной способности.\n\nНекоторые способности задействуют Усилие на время действия. Это значит, что Усилие остаётся задействованным, пока способность активна. ПИ может вернуть задействованное Усилие в любой момент Мгновенным действием, отключив способность.\n\nНекоторые способности задействуют Усилие до конца сцены. Усилие остаётся задействованным до конца сцены, после чего возвращается к ПИ. Вернуть его раньше нельзя, даже если питаемая им способность годится лишь на одну атаку или действие. Сцена обычно означает один бой, событие или ход подземелья и почти никогда не длится дольше пятнадцати минут. Подробности — в разделе правил, посвящённом времени.\n\nНекоторые способности задействуют Усилие до конца дня. Задействованное так Усилие можно вернуть только после спокойного ночного отдыха. Если ПИ голоден, замёрз, болен или спит без спального мешка и прочих простейших удобств, это Усилие не восстанавливается.\n\nАктивация способности всегда требует задействовать лишь один пункт Усилия, если сама способность не говорит иного."},{"n":"1.5.0","l":2,"te":"The Class List","tr":"Список классов","en":"The classes that follow are flavor-stripped versions of those found in Worlds Without Number and its supplement, The Atlas of the Latter Earth. While mainstays such as the Warrior, the Expert, or the High Mage are appropriate to almost any fantasy setting, others may not fit specific campaigns. A GM always has the right to omit classes that do not fit the flavor of the game they are running.","ru":"Классы ниже — очищенные от антуража версии классов из «Миров без числа» и дополнения «Атлас Поздней Земли». Если такие столпы, как Воин, Эксперт или Высший маг, уместны почти в любом фэнтезийном сеттинге, то другие классы могут не подойти конкретной кампании. Мастер всегда вправе исключить классы, которые не вписываются в дух его игры."},{"n":"1.5.1","l":3,"te":"The Adventurer","tr":"Авантюрист","en":"Not every hero is perfectly reflected by one of the three main classes, even with the wide latitude of concepts each one allows. For those heroes that straddle the roles, there remains the class of Adventurer.\nAn Adventurer picks two classes to reflect their own particular talents. A spell-slinging swordsman might choose to be a Partial Mage/Partial Warrior, while a stealthy assassin might be a Partial Expert/Partial Warrior, and a grifting mountebank-wizard might be a Partial Expert/Partial Mage. The player should pick whichever pairing serves best.\nThe tables below provide the hit dice, attack bonus, and Foci picks gained by each of the three possible pairings. Thus, a first level Partial Expert/Partial Warrior would roll 1d6+2 for their hit points, have a +1 attack bonus, and pick three Foci: one expert, one warrior, and one free pick.\nAdventurers tend to have a wider range of abilities than a more focused PC, and the extra Focus pick can make a significant difference at low levels. The absence of the strongest class abilities of Experts and Warriors make a difference in the longer run, however, and a Partial Mage will never attain the same magical power in their tradition as a focused specialist.\n#### Partial Expert\nA Partial Expert is treated just as a full Expert, including gaining the benefits of the Quick Learner ability. They do not have the Masterful Expertise ability, however, as they lack the versatility of a full Expert.\n#### Partial Mage\nA Partial Mage is treated as a Mage, and gains the Arcane Tradition ability, allowing them to pick a magical tradition for their powers. That tradition’s abilities will be more limited for Partial Mages, however, as described under each of the paths.\nIt’s even possible for a PC to pick the Partial Mage class twice for two different magical traditions, gaining portions of both arcane powers. They then use the usual full Mage chart for hit dice, attack bonus, and Foci, and the spellcasting table for dual casters if both partial classes cast spells.\nA Partial Mage must adhere to the restrictions and limits of their magical tradition in order to use its abilities, regardless of whatever other partial class they may have.\n#### Partial Warrior\nA Partial Warrior gains certain of the benefits of a full Warrior, including the improved hit die and a somewhat improved attack bonus. They do not have the Veteran’s Luck special ability or the Killing Blow power, however, and must trust to their own talents to land blows and crush their enemies.\n**Partial Expert/Partial Warrior**\n| Level | Hit Dice | Attack Bonus | Focus Picks |\n|---|---|---|---|\n| 1 | 1d6+2 | +1 | 1 Expert + 1 Warrior + 1 Any |\n| 2 | 2d6+4 | +2 | +1 Any |\n| 3 | 3d6+6 | +2 |  |\n| 4 | 4d6+8 | +3 |  |\n| 5 | 5d6+10 | +4 | +1 Any |\n| 6 | 6d6+12 | +5 |  |\n| 7 | 7d6+14 | +5 | +1 Any |\n| 8 | 8d6+16 | +6 |  |\n| 9 | 9d6+18 | +6 |  |\n| 10 | 10d6+20 | +7 | +1 Any |\n**Partial Expert/Partial Mage**\n| Level | Hit Dice | Attack Bonus | Focus Picks |\n|---|---|---|---|\n| 1 | 1d6 | +0 | 1 Expert + |\n| **1 Any** |  |  |  |\n| 2 | 2d6 | +1 | +1 Any |\n| 3 | 3d6 | +1 |  |\n| 4 | 4d6 | +2 |  |\n| 5 | 5d6 | +2 | +1 Any |\n| 6 | 6d6 | +3 |  |\n| 7 | 7d6 | +3 | +1 Any |\n| 8 | 8d6 | +4 |  |\n| 9 | 9d6 | +4 |  |\n| 10 | 10d6 | +5 | +1 Any |\n**Partial Mage/Partial Warrior**\n| Level | Hit Dice | Attack Bonus | Focus Picks |\n|---|---|---|---|\n| 1 | 1d6+2 | +1 | 1 Warrior + 1 Any |\n| 2 | 2d6+4 | +2 | +1 Any |\n| 3 | 3d6+6 | +2 |  |\n| 4 | 4d6+8 | +3 |  |\n| 5 | 5d6+10 | +4 | +1 Any |\n| 6 | 6d6+12 | +5 |  |\n| 7 | 7d6+14 | +5 | +1 Any |\n| 8 | 8d6+16 | +6 |  |\n| 9 | 9d6+18 | +6 |  |\n| 10 | 10d6+20 | +7 | +1 Any |","ru":"Не всякий герой в точности укладывается в один из трёх основных классов, даже при всей широте концепций, которую каждый из них допускает. Для героев, стоящих на стыке ролей, остаётся класс Авантюриста.\n\nАвантюрист выбирает два класса, отражающих его собственные таланты. Мечник, сыплющий заклинаниями, может взять пару частичный Маг/частичный Воин, скрытный убийца — частичный Эксперт/частичный Воин, а плутоватый шарлатан-волшебник — частичный Эксперт/частичный Маг. Игроку стоит выбрать ту пару, что подходит лучше всего.\n\nТаблицы ниже задают Кости здоровья, бонус атаки и выборы Фокусов для каждой из трёх возможных пар. Так, частичный Эксперт/частичный Воин первого уровня бросает 1d6+2 на пункты здоровья, имеет бонус атаки +1 и выбирает три Фокуса: один экспертский, один воинский и один любой.\n\nСпектр способностей Авантюриста обычно шире, чем у более узконаправленного ПИ, и лишний выбор Фокуса может дать заметное преимущество на низких уровнях. Однако на длинной дистанции сказывается отсутствие сильнейших классовых способностей Эксперта и Воина, а частичный Маг никогда не достигнет в своей традиции той же магической мощи, что сосредоточенный на ней специалист.\n\n#### Частичный Эксперт\n\nЧастичный Эксперт считается полным Экспертом во всём, включая преимущества способности «Схватывает на лету». Однако способности «Виртуозное мастерство» у него нет: ему не хватает разносторонности полного Эксперта.\n\n#### Частичный Маг\n\nЧастичный Маг считается Магом и получает способность «Магическая традиция», позволяющую выбрать магическую традицию для своих сил. Однако способности этой традиции у частичного Мага более ограничены, как описано в каждом из путей.\n\nПИ может даже взять класс частичного Мага дважды, для двух разных магических традиций, получив часть тайных сил обеих. Тогда он использует обычную таблицу полного Мага для Костей здоровья, бонуса атаки и Фокусов, а если оба частичных класса читают заклинания — таблицу чтения заклинаний для сдвоенных заклинателей.\n\nЧтобы пользоваться способностями своей магической традиции, частичный Маг обязан соблюдать её запреты и ограничения, каким бы ни был его второй частичный класс.\n\n#### Частичный Воин\n\nЧастичный Воин получает часть преимуществ полного Воина, включая улучшенную Кость здоровья и несколько повышенный бонус атаки. Однако особой способности «Везение ветерана» и способности «Смертельный удар» у него нет — попадать по врагам и крушить их ему придётся собственным талантом.\n\n**Частичный Эксперт/частичный Воин**\n\n| Уровень | Кости здоровья | Бонус атаки | Выборы Фокусов |\n|---|---|---|---|\n| 1 | 1d6+2 | +1 | 1 экспертский + 1 воинский + 1 любой |\n| 2 | 2d6+4 | +2 | +1 любой |\n| 3 | 3d6+6 | +2 | – |\n| 4 | 4d6+8 | +3 | – |\n| 5 | 5d6+10 | +4 | +1 любой |\n| 6 | 6d6+12 | +5 | – |\n| 7 | 7d6+14 | +5 | +1 любой |\n| 8 | 8d6+16 | +6 | – |\n| 9 | 9d6+18 | +6 | – |\n| 10 | 10d6+20 | +7 | +1 любой |\n\n**Частичный Эксперт/частичный Маг**\n\n| Уровень | Кости здоровья | Бонус атаки | Выборы Фокусов |\n|---|---|---|---|\n| 1 | 1d6 | +0 | 1 экспертский + 1 любой |\n| 2 | 2d6 | +1 | +1 любой |\n| 3 | 3d6 | +1 | – |\n| 4 | 4d6 | +2 | – |\n| 5 | 5d6 | +2 | +1 любой |\n| 6 | 6d6 | +3 | – |\n| 7 | 7d6 | +3 | +1 любой |\n| 8 | 8d6 | +4 | – |\n| 9 | 9d6 | +4 | – |\n| 10 | 10d6 | +5 | +1 любой |\n\n**Частичный Маг/частичный Воин**\n\n| Уровень | Кости здоровья | Бонус атаки | Выборы Фокусов |\n|---|---|---|---|\n| 1 | 1d6+2 | +1 | 1 воинский + 1 любой |\n| 2 | 2d6+4 | +2 | +1 любой |\n| 3 | 3d6+6 | +2 | – |\n| 4 | 4d6+8 | +3 | – |\n| 5 | 5d6+10 | +4 | +1 любой |\n| 6 | 6d6+12 | +5 | – |\n| 7 | 7d6+14 | +5 | +1 любой |\n| 8 | 8d6+16 | +6 | – |\n| 9 | 9d6+18 | +6 | – |\n| 10 | 10d6+20 | +7 | +1 любой |"},{"n":"1.5.2","l":3,"te":"The Accursed","tr":"Проклятый","en":"The Accursed are those men and women who have made pacts with otherworldly beings, intentionally or otherwise, and gained powers from that bond.\n#### Benefits of the Accursed\nThe Accursed is a partial Mage class that must be joined with a second partial class by an Adventurer. A Partial Warrior/Accursed might be a grim demonic warrior, a Partial Expert/Accursed might be a sinister tempter, while a Partial Mage/Accursed could be a sorcerer willing to pact with foul creatures for their powers.\nAll Accursed gain Magic-0 during character creation. Even those who are not spellcasters must understand the ways of eldritch beings and the subtleties of sorcery.\nWhile the arts of Accursed Blade and Accursed Bolt use Magic as their combat skill, Foci that normally apply to mundane weapons such as Armsmaster or Deadeye also benefit their relevant melee or ranged attacks. For these Foci, read “Magic” in place of “Shoot” or “Stab” when gaining their benefits, including the granted skill and the stacking damage bonus that the first level of the Focus may grant.\n**Partial Expert/Accursed**\n| Level | Hit Dice | Attack Bonus | Focus Picks |\n|---|---|---|---|\n| 1 | 1d6 | +0 | 1 Expert +1 Any |\n| 2 | 2d6 | +1 | +1 Any |\n| 3 | 3d6 | +1 |  |\n| 4 | 4d6 | +2 |  |\n| 5 | 5d6 | +2 | +1 Any |\n| 6 | 6d6 | +3 |  |\n| 7 | 7d6 | +3 | +1 Any |\n| 8 | 8d6 | +4 |  |\n| 9 | 9d6 | +4 |  |\n| 10 | 10d6 | +5 | +1 Any |\n\n**Partial Mage/Accursed**\n| Level | Hit Dice | Attack Bonus | Focus Picks |\n|---|---|---|---|\n| 1 | 1d6-1 | +0 | 1 Any |\n| 2 | 2d6-2 | +0 | +1 Any |\n| 3 | 3d6-3 | +0 |  |\n| 4 | 4d6-4 | +0 |  |\n| 5 | 5d6-5 | +1 | +1 Any |\n| 6 | 6d6-6 | +1 |  |\n| 7 | 7d6-7 | +1 | +1 Any |\n| 8 | 8d6-8 | +1 |  |\n| 9 | 9d6-9 | +1 |  |\n| 10 | 10d6-10 | +2 | +1 Any |\n\n**Partial Warrior/Accursed**\n| Level | Hit Dice | Attack Bonus | Focus Picks |\n|---|---|---|---|\n| 1 | 1d6+2 | +1 | 1 Warrior +1 Any |\n| 2 | 2d6+4 | +2 | +1 Any |\n| 3 | 3d6+6 | +2 |  |\n| 4 | 4d6+8 | +3 |  |\n| 5 | 5d6+10 | +4 | +1 Any |\n| 6 | 6d6+12 | +5 |  |\n| 7 | 7d6+14 | +5 | +1 Any |\n| 8 | 8d6+16 | +6 |  |\n| 9 | 9d6+18 | +6 |  |\n| 10 | 10d6+20 | +7 | +1 Any |","ru":"Проклятые — это мужчины и женщины, заключившие договор с потусторонними существами, намеренно или нет, и получившие силу от этой связи.\n\n#### Преимущества Проклятого\n\nПроклятый — частичный класс Мага: Авантюрист должен соединить его со вторым частичным классом. Частичный Воин/Проклятый может быть мрачным демоническим бойцом, частичный Эксперт/Проклятый — зловещим искусителем, а частичный Маг/Проклятый — чародеем, готовым ради силы заключать договоры с мерзкими тварями.\n\nВсе Проклятые получают Магию-0 при создании персонажа. Даже те из них, кто не читает заклинаний, должны разбираться в повадках жутких существ и тонкостях колдовства.\n\nХотя Искусства «Проклятый клинок» и «Проклятая стрела» используют Магию как боевой навык, Фокусы, обычно относящиеся к мирскому оружию, — такие как Оружейный мастер или Верный глаз, — тоже усиливают соответствующие им атаки ближнего или дальнего боя. Для этих Фокусов читай «Магия» вместо «Стрельба» или «Клинок» при получении их преимуществ, включая даруемый навык и складывающийся бонус урона, который может давать первый уровень Фокуса.\n\n**Частичный Эксперт/Проклятый**\n\n| Уровень | Кости здоровья | Бонус атаки | Выборы Фокусов |\n|---|---|---|---|\n| 1 | 1d6 | +0 | 1 экспертский + 1 любой |\n| 2 | 2d6 | +1 | +1 любой |\n| 3 | 3d6 | +1 | – |\n| 4 | 4d6 | +2 | – |\n| 5 | 5d6 | +2 | +1 любой |\n| 6 | 6d6 | +3 | – |\n| 7 | 7d6 | +3 | +1 любой |\n| 8 | 8d6 | +4 | – |\n| 9 | 9d6 | +4 | – |\n| 10 | 10d6 | +5 | +1 любой |\n\n**Частичный Маг/Проклятый**\n\n| Уровень | Кости здоровья | Бонус атаки | Выборы Фокусов |\n|---|---|---|---|\n| 1 | 1d6-1 | +0 | 1 любой |\n| 2 | 2d6-2 | +0 | +1 любой |\n| 3 | 3d6-3 | +0 | – |\n| 4 | 4d6-4 | +0 | – |\n| 5 | 5d6-5 | +1 | +1 любой |\n| 6 | 6d6-6 | +1 | – |\n| 7 | 7d6-7 | +1 | +1 любой |\n| 8 | 8d6-8 | +1 | – |\n| 9 | 9d6-9 | +1 | – |\n| 10 | 10d6-10 | +2 | +1 любой |\n\n**Частичный Воин/Проклятый**\n\n| Уровень | Кости здоровья | Бонус атаки | Выборы Фокусов |\n|---|---|---|---|\n| 1 | 1d6+2 | +1 | 1 воинский + 1 любой |\n| 2 | 2d6+4 | +2 | +1 любой |\n| 3 | 3d6+6 | +2 | – |\n| 4 | 4d6+8 | +3 | – |\n| 5 | 5d6+10 | +4 | +1 любой |\n| 6 | 6d6+12 | +5 | – |\n| 7 | 7d6+14 | +5 | +1 любой |\n| 8 | 8d6+16 | +6 | – |\n| 9 | 9d6+18 | +6 | – |\n| 10 | 10d6+20 | +7 | +1 любой |"},{"n":"1.5.2.1","l":4,"te":"Accursed Arts","tr":"Искусства Проклятого","en":"An Accursed has an Effort score equal to their Magic skill level plus their Intelligence or Charisma modifier, to a minimum of one point. Every Accursed gains either Accursed Bolt or Accursed Blade as a starting art, plus one more of their choice. Accursed arts may be used in or out of armor.\n**Accursed Blade:** As an On Turn action, manifest an occult melee weapon as a one-handed 1d8 weapon or a two-handed 2d6 weapon. Both add your Magic skill to the damage roll, have a Shock rating of 2/15, and use Magic as the attack skill and the best of Str, Dex, Int, or Cha as its modifying attribute.\n**Accursed Bolt:** As Accursed Blade, but you launch blasts of occult force instead of meleeing. Their damage is 1d8 plus your Magic skill, their range is 200’, and the bolts can be thrown in melee at a -4 penalty to hit. These bolts need both hands free to hurl them.\n**Bewitching Distraction:** Commit Effort for the day as a Main Action when talking to an intelligent target when not in combat. They must make a Mental save or become dazed, oblivious to their surroundings and forgetting you and all else that happened in that scene. Danger ends the daze but not the forgetting.\n**Compelling Shriek:** Once per scene, Commit Effort for the day as a Main Action and shout a command of no more than seven words. Chosen targets who hear and understand must make a Mental save or perform that action for one round, provided it is not totally contrary to their character.\n**Devil’s Bargain:** As a Main Action, consecrate a deal you’ve made with an uncoerced person. If they violate the deal or its spirit, you know instantly and may inflict 1d6 damage per level on them if desired.\n**Dire Pact:** Foes suffer a penalty equal to your Magic skill on all saves versus your Accursed arts. If they succeed, however, you gain one System Strain.\n**Lying Face:** Commit Effort as a Main Action; while it remains Committed, you can disguise yourself as any humanoid of the same general size, including clothing, scent, and voice.\n**Night-Black Eyes:** You can see clearly in perfect darkness. As\na Main Action, focus on a particular visible object, person, or location; you can tell if it is enchanted, though no details about the magic are seen.\n**Pacted Protection:** Choose a type of harmful energy: fire, frost, acid, electricity, or the like. You become immune to natural degrees of this energy and take half damage from magical attacks involving it.\n**Rob Vitality:** Once per scene, as an On Turn action, Commit Effort for the scene and target a visible foe. They must make a Physical save or lose their next Main Action, which you immediately gain instead.\n**Scourging Curse:** Commit Effort for the scene as a Main Action and target a visible foe. Your curse inflicts a -1 penalty to their hit, damage, and saving throw rolls for one round per level. At 4th level this penalty becomes -2, and at 9th it becomes -3. Only one such curse can be active at a given time.\n**Shadowed Steps:** As a Move Action, Commit Effort for the scene and teleport up to your Move distance. You cannot bypass walls or physical obstacles, but you can teleport vertically or into high places.\n**Snaring Speech:** Once per round as an Instant action, Commit Effort for the day when failing a skill check to persuade or tempt someone. They must make a Mental save or agree with your proposal if it’s something they would normally consider doing. Gain one System Strain when using this art.\n**Sorcerous Battery:** Once per day, as an On Turn action, Commit Effort for the day. You or a visible ally refresh the spell slot of a spell that has been cast since the start of the prior round. Gain one System Strain.\n**Soul Consumption:** As an Instant action, Commit Effort for the day when you fell an intelligent target with Accursed Bolt or Accursed Blade. They die instantly. You heal 1d6 hit points plus your level and lose one accumulated System Strain.\n**Tendrils of Night:** Commit Effort as an On Turn action. While Committed, you exude numerous tentacles or eldritch arms that can manipulate objects with your strength up to 20’ away. You gain no bonus actions, but the arms can melee at range. These arms have your AC, and you are damaged if they are hurt.\n**Unseen Steps:** As an On Turn action, Commit Effort for the day to turn invisible for 1d6 rounds plus your level. This invisibility breaks before you attack, cast spells, or perform other vigorous or violent actions.\n**Weight of Sin:** As a Main Action, Commit Effort for the day and target a visible foe. They must make a Physical save or lose their Move action for 1d6 rounds plus your level.\n**Weeping Wounds:** Once per round, Commit Effort for the scene as an Instant action when a visible enemy takes damage. They must make a Physical save or suffer 1d6 damage per round for one round per level. They cannot heal or regenerate any hit point damage during this effect. This art does not stack.","ru":"Показатель Усилия Проклятого равен уровню его навыка Магия плюс модификатор Интеллекта или Харизмы, минимум один пункт. Каждый Проклятый получает стартовым Искусством Проклятую стрелу или Проклятый клинок, плюс ещё одно на свой выбор. Искусства Проклятого можно применять как в доспехах, так и без них.\n\n**Бичующее проклятие:** Задействуй Усилие до конца сцены Основным действием и выбери видимого врага. Твоё проклятие даёт ему штраф -1 к броскам атаки, урона и спасброскам на один раунд за уровень. На 4-м уровне штраф становится -2, на 9-м — -3. Одновременно может действовать лишь одно такое проклятие.\n\n**Бремя греха:** Основным действием задействуй Усилие до конца дня и выбери видимого врага. Он должен пройти Физический спасбросок, иначе потеряет Действие перемещения на 1d6 раундов плюс твой уровень.\n\n**Властный окрик:** Раз за сцену задействуй Усилие до конца дня Основным действием и выкрикни приказ не длиннее семи слов. Выбранные цели, которые слышат и понимают тебя, должны пройти Ментальный спасбросок, иначе один раунд будут выполнять приказанное — если только это не полностью противно их натуре.\n\n**Глаза чернее ночи:** Ты ясно видишь в полной темноте. Основным действием сосредоточься на конкретном видимом предмете, человеке или месте: ты поймёшь, наложены ли на него чары, но никаких подробностей этой магии не разглядишь.\n\n**Дьяволова сделка:** Основным действием освяти сделку, заключённую тобой с человеком без принуждения. Если он нарушит сделку или её дух, ты мгновенно узнаешь об этом и по желанию можешь нанести ему 1d6 урона за уровень.\n\n**Зловещий договор:** Враги получают штраф, равный твоему навыку Магия, ко всем спасброскам против твоих Искусств Проклятого. Но если спасбросок им удаётся, ты получаешь один пункт Системной нагрузки.\n\n**Колдовской накопитель:** Раз в день Действием в свой ход задействуй Усилие до конца дня. Ты или видимый союзник восстанавливаете ячейку заклинания, прочитанного после начала прошлого раунда. Получи один пункт Системной нагрузки.\n\n**Лживое лицо:** Задействуй Усилие Основным действием; пока оно задействовано, ты можешь выдавать себя за любого гуманоида примерно того же размера — вплоть до одежды, запаха и голоса.\n\n**Морок:** Задействуй Усилие до конца дня Основным действием, беседуя с разумной целью вне боя. Цель должна пройти Ментальный спасбросок, иначе впадёт в оцепенение, не замечая ничего вокруг и забывая тебя и всё прочее, что случилось в этой сцене. Опасность обрывает оцепенение, но не забвение.\n\n**Незримые шаги:** Действием в свой ход задействуй Усилие до конца дня, чтобы стать невидимым на 1d6 раундов плюс свой уровень. Невидимость спадает за миг до того, как ты атакуешь, прочитаешь заклинание или совершишь иное энергичное или насильственное действие.\n\n**Оберег договора:** Выбери тип разрушительной энергии: огонь, холод, кислоту, электричество и тому подобное. Ты становишься невосприимчив к естественным проявлениям этой энергии и получаешь половину урона от магических атак, в которых она участвует.\n\n**Плачущие раны:** Раз в раунд задействуй Усилие до конца сцены Мгновенным действием, когда видимый враг получает урон. Он должен пройти Физический спасбросок, иначе будет получать 1d6 урона в раунд в течение одного раунда за уровень. Пока действует этот эффект, он не может исцелять или регенерировать урон пунктам здоровья. Это Искусство не складывается само с собой.\n\n**Пожирание душ:** Мгновенным действием задействуй Усилие до конца дня, когда ты сражаешь разумную цель Проклятой стрелой или Проклятым клинком. Цель умирает мгновенно. Ты исцеляешь 1d6 пунктов здоровья плюс свой уровень и теряешь один накопленный пункт Системной нагрузки.\n\n**Похищение жизни:** Раз за сцену Действием в свой ход задействуй Усилие до конца сцены и выбери видимого врага. Он должен пройти Физический спасбросок, иначе потеряет своё следующее Основное действие, которое ты немедленно получаешь вместо него.\n\n**Проклятая стрела:** Как Проклятый клинок, но вместо ближнего боя ты мечешь разряды оккультной силы. Их урон — 1d8 плюс твой навык Магия, дистанция — 200 футов, а в ближнем бою стрелы можно метать со штрафом -4 к попаданию. Чтобы метать их, обе руки должны быть свободны.\n\n**Проклятый клинок:** Действием в свой ход сотвори оккультное оружие ближнего боя: одноручное с уроном 1d8 или двуручное с уроном 2d6. И то и другое добавляет твой навык Магия к броску урона, имеет Шок 2/15 и использует Магию как навык атаки, а лучший из модификаторов Сил, Лов, Инт или Хар — как модифицирующую характеристику.\n\n**Силки речи:** Раз в раунд Мгновенным действием задействуй Усилие до конца дня, провалив проверку навыка на то, чтобы убедить или соблазнить кого-то. Цель должна пройти Ментальный спасбросок, иначе согласится с твоим предложением, если это нечто такое, на что она в принципе могла бы пойти. Применяя это Искусство, получи один пункт Системной нагрузки.\n\n**Шаги в тени:** Действием перемещения задействуй Усилие до конца сцены и телепортируйся на расстояние до своей скорости перемещения. Ты не можешь миновать стены и физические преграды, но можешь телепортироваться вертикально или на возвышения.\n\n**Щупальца ночи:** Задействуй Усилие Действием в свой ход. Пока оно задействовано, из тебя тянутся многочисленные щупальца или жуткие руки, способные обращаться с предметами с твоей силой на расстоянии до 20 футов. Дополнительных действий ты не получаешь, но руки могут вести ближний бой на этом расстоянии. У этих рук твой КЗщ, и когда ранят их — урон получаешь ты."},{"n":"1.5.3","l":3,"te":"The Bard","tr":"Бард","en":"Bards are those who have an uncanny ability to move others through the power of their performance.\n#### Benefits of the Bard\nThe Bard is a partial Expert class that must be joined with a second partial class by an Adventurer. A Partial Warrior/Bard might be a martial skald, a Partial Expert/Bard might be a light-fingered troubadour, while a Partial Mage/Bard might mix true magic in with their artful performances.\nAll Bards gain Perform-0 during character creation. Their abilities hinge on their power to move a listener, whether that is by song, musicianship, or stirring oratory.\nUnlike the normal Partial Expert class, Bards do not get a bonus non-combat Focus at first level, nor do they get a Partial Expert’s bonus skill point when advancing a character level. One who takes the standard Partial Expert for their other class gains these things normally.\n**Partial Expert/Bard**\n| Level | Hit Dice | Bonus Attack | Focus Picks |\n|---|---|---|---|\n| 1 | 1d6 | +0 | 1 Expert +1 Any |\n| 2 | 2d6 | +1 | +1 Any |\n| 3 | 3d6 | +1 |  |\n| 4 | 4d6 | +2 |  |\n| 5 |
