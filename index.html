l of combat competence, however, and so \nthe “Form Bonus” hit bonus is used in place of the PC’s basic class \nhit bonus when in a non-humanoid shape, assuming they don’t \nalready have a better basic bonus from their other partial class.\nArts that improve the alternate forms can apply their benefits \neven if the creature’s natural shape wouldn’t normally grant it. Thus, \na Skinshifter with the Manifest Wings art could have a wolf-form \nthat had wings and a flying speed if they wished. A given form can \nhave no more than three arts applied to it.\nA Skinshifter’s alternate forms can be any size between a horse \nand a kitten, barring modification by some art. They do not need \nto emulate a specific type of creature; a Skinshifter could have a \nclawed and winged humanoid form as an alternate shape, or a \ndog with the head of a man, or a cat with razor-sharp mandibles.\nThe belongings carried by a Skinshifter meld into any new form \nunless the PC decides otherwise, granting any benefit to Armor \nClass or other worn advantage they may normally give. Melded \nobjects can be manifested and dropped as an On Turn action, \nbut cannot be re-melded again unless the PC changes form with \nthem again.\nSkinshifter forms cannot perfectly duplicate another individual crea-\nture without an appropriate art.","ru":"Зверолик — частичный класс Мага, дающий владельцу способность менять облик: принимать форму зверей или тел собственного изобретения.\n\n#### Преимущества Зверолика\n\nЗверолик — частичный класс Мага, который Авантюрист берёт в паре с другим частичным классом. Частичный Воин/Зверолик может быть меняющим облик убийцей или диким свирепым бойцом, а частичный Эксперт/Зверолик — самозванцем, которого не разоблачить, или мошенником.\n\nВсе Зверолики получают Выживание-0 как бонусный навык, или Выживание-1, если Выживание-0 у них уже есть.\n\n#### Облики Зверолика\n\nИскусства Зверолика сосредоточены на улучшении и настройке его вторых обликов. Для всех разновидностей этих обликов действует несколько базовых правил.\n\nЗверолик может освоить один второй облик за каждый уровень персонажа. Чтобы заменить выбранный облик, Зверолику нужен день тщательной практики и подгонки. ПИ-Звероликам стоит записывать особые способности и черты своих вторых обликов и помнить, какие из них доступны в каждый момент.\n\nУ вторых обликов Зверолика те же пункты здоровья, характеристики и скорость перемещения, что и у обычного тела, если их не меняют отдельные Искусства. Так, Зверолик в волчьей шкуре без усиливающего Искусства нанесёт укусом не больше урона, чем безоружная атака человека. Однако вторые облики дают минимальный уровень боевой сноровки: в негуманоидной форме вместо базового классового бонуса атаки ПИ используется бонус облика из таблицы — если только другой частичный класс уже не даёт бонус лучше.\n\nИскусства, улучшающие вторые облики, дают свои преимущества, даже если естественное тело такого существа их бы не дало. Так, Зверолик с Искусством «Явить крылья» может, если пожелает, завести волчий облик с крыльями и скоростью полёта. К одному облику можно применить не больше трёх Искусств.\n\nВторой облик Зверолика может быть любого размера от лошади до котёнка, если какое-нибудь Искусство этого не изменит. Подражать конкретному виду существ не обязательно: вторым обликом Зверолика может быть когтистый крылатый гуманоид, пёс с человеческой головой или кошка с острыми как бритва жвалами.\n\nВещи, которые Зверолик несёт на себе, сливаются с новым обликом, если ПИ не решит иначе, и продолжают давать свои обычные преимущества — к Классу защиты или любую другую пользу носимого. Слитый предмет можно проявить и бросить Действием в свой ход, но заново слить его с обликом нельзя, пока ПИ снова не сменит облик вместе с ним. Облики Зверолика не могут в точности повторить другое конкретное существо без подходящего Искусства."},{"n":"1.5.15.1","l":4,"te":"Skinshifter Arts","tr":"Искусства Зверолика","en":"Skinshifter Effort is based on Survive, and is equal to the PC’s Sur-\nvive skill level plus the highest of their Constitution or Charisma \nmodifiers, to a minimum of one point. All Skinshifters begin play \nwith the Change Form art and one more of their choice. Additional \narts are learned as the PC advances in experience.\nChange Form: Commit Effort for the day as a Main Action to trans-\nLevel\nHit Dice\n10d6\n+5\n+1 Any\nLevel\nHit Dice\n10d6-10\n+2\n+1 Any\nLevel\nHit Dice\n10d6+20\n+7\n+1 Any\nSkinshifter Arts and Form Bonus\nForm \nBonus\nArts Gained\nLevel\n+1\nChange Form and Any One\n+1\nAny One\n+2\n+2\nAny One\n+3\nAny One\n+3\nAny One\n+4\n+4\nAny One\n+5\n+6\nAny One\nform into an available Alternate form. This shift persists until you die, \nshift to a new form, or end the transformation as an On Turn action. \nYour hit points, System Strain, and other scores remain the same in\nany new form, but in a non-humanoid form your class’ base attack \nbonus can be no worse than the one listed on the table. If your shape \nis quadrupedal, its Move is 10’ faster than your base.\nOther Skinshifter Arts\nEyes of the Hawk: This shape has remarkably acute senses. You can \nscent trails and objects like a dog, hear very faint noises, see objects \nclearly enough to identify faces at a thousand feet of distance, and \nsee clearly in anything short of complete darkness. You gain a +2 \nbonus on all sensory Notice checks.\nFeline Leap: This form can vault great distances. You can jump your \nfull Move rating as a Move action, crossing the full distance hori-\nzontally or up to half the distance vertically. You subtract your Move \nrating from fall distance for damage calculations.\nFeral Prowess: This form has an augmented degree of speed, \nstrength, or hardiness. For this form, pick either Strength, Dexterity, \nor Constitution; that attribute modifier is improved by +1 in this form, \nto a maximum of +2. These alterations are obvious and extreme; it is \nimpossible to masquerade as a normal baseline human if using this art. \nHit points gained from Con improvements are lost when shifting back.\nIntrinsic Armor: This shape has tough scales, hide, shell, or other \ndefensive integuments. Your base Armor Class is 14 plus half your \ncharacter level, rounded down. This AC can be modified by your \nDexterity modifier, and by shields if the shape can hold one.\nManifest Wings: This shape can form usable wings. You can’t ef-\nfectively attack while concentrating on remaining aloft, but you can \nfly at your normal movement rate +10’ per action. If unhindered and \nflying overland you can travel up to ten miles an hour and fly up to \nfive hours a day.\nOctopus’ Embrace: This shape can have more than four usable\nlimbs. These additional tentacles, arms, legs, or grippers can hold and \nmanipulate things; up to four Stowed objects can be held Ready by \nthese limbs without counting against your Readied Encumbrance limit. \nThese extra limbs cannot effectively employ extra shields, perform\nadditional attacks or actions, or do other things that require significant \nfocus beyond your current action.\nPerfect Mimicry: This alternate form can exactly duplicate another \ncreature, provided you either have a lock of their hair, a still-liquid \ndrop of their blood, or ten minutes of observation of them from within \nfive feet. Once learned, you need no further samples.\nPliant Flesh: You’ve mastered your shapeshifting skills, and Change \nForm can be used as an On Turn action, albeit only once per round. \nAlternately, it can take as long as a minute but cost no Effort. When-\never you spend Effort to shift shape, you heal lost hit points equal \nto 1d6 plus your level; this does not apply when merely reverting a \nform’s change. This art is intrinsic to you, and doesn’t count against \nthe total number of arts allowed to apply to a form.\nSavage Talons: This shape has extremely dangerous claws, fangs, \npincers, or other body weapons. At first level these weapons do 1d8 \ndamage, use either Str or Dex as the modifying attribute, Punch as \nthe combat skill, and have a Shock value of 2/AC 13. At level 3 the \ndamage and Shock increase by +1, at level 6 they increase to +2, \nand at level 9 they increase to +3. These weapons can harm even \ncreatures immune to non-magical weaponry.\nSculptor’s Beauty: You’ve developed a refined aesthetic sense\nthat can directly appeal to the subconscious beauty preferences of \nviewers. This shape improves your Charisma modifier by +1, to a\nmaximum of +2. There is always something alien about this beauty, \nand such forms can never be mistaken for an entirely normal human \nor animal, though they may be taken for some exotic demihuman \nor altered baseline.\nSerpent’s Kiss: This shape can exude a venom on its claws or fangs. \nSuccessful hits allow you to Commit Effort for the scene as an Instant \naction to inflict an additional 1d8 damage plus your Survive skill. You \ncan elect to make the toxin paralytic rather than fatal; foes reduced \nto zero hit points by such a blow are paralyzed and helpless for an \nhour rather than mortally wounded.\nThe Monkey’s Road: This shape has an arboreal agility when it \ncomes to climbing. You can travel up sheer surfaces at your usual \nmovement rate provided at least three limbs are available for use \nand the surface is not glassily smooth. If you fall, you can halt your \nplunge without damage so long as a serviceable surface to cling to \nis within ten feet of you.\nWarform: You gain a flat +2 bonus to all melee hit rolls in this shape \nand can use your form hit bonus even in a humanoid body. This shape \nis blatantly martial in appearance, however, and cannot pass as \nanything harmless or wholly human.\nWisdom of Fin and Scale: This shape can breathe water, swim \nat double your usual Move rate, and is impervious to any normal \nclimatic extreme of cold or undersea pressure. It can see up to sixty \nfeet while underwater even in the absence of normal light.\nPartial Expert/Thought Noble\nAttack\nBonus\nFocus Picks\n1d6\n+0\n1 Expert\n+1 Any\n2d6\n+1\n+1 Any\n3d6\n+1\n4d6\n+2\n5d6\n+2\n+1 Any\n6d6\n+3\n7d6\n+3\n+1 Any\n8d6\n+4\n9d6\n+4\nPartial Other Mage/Thought Noble\nAttack\nBonus\nFocus Picks\n1d6-1\n+0\n 1 Any\n2d6-2\n+0\n+1 Any\n3d6-3\n+0\n4d6-4\n+0\n5d6-5\n+1\n+1 Any\n6d6-6\n+1\n7d6-7\n+1\n+1 Any\n8d6-8\n+1\n9d6-9\n+1\nPartial Warrior/Thought Noble\nAttack\nBonus\nFocus Picks\n1d6+2\n+1\n1 Warrior\n+1 Any\n2d6+4\n+2\n+1 Any\n3d6+6\n+2\n4d6+8\n+3\n5d6+10\n+4\n+1 Any\n6d6+12\n+5\n7d6+14\n+5\n+1 Any\n8d6+16\n+6\n9d6+18\n+6","ru":"Усилие Зверолика основано на Выживании: оно равно уровню навыка Выживание ПИ плюс лучший из модификаторов Телосложения или Харизмы, минимум один пункт. Все Зверолики начинают игру с Искусством «Смена облика» и ещё одним на свой выбор. Новые Искусства осваиваются по мере роста опыта ПИ.\n\n**Смена облика:** задействуй Усилие до конца дня Основным действием, чтобы превратиться в один из доступных вторых обликов. Превращение длится, пока ты не умрёшь, не сменишь облик на новый или не прекратишь его Действием в свой ход. Пункты здоровья, Системная нагрузка и прочие показатели в новом облике не меняются, но в негуманоидной форме базовый бонус атаки твоего класса не может быть хуже указанного в таблице. Если облик четвероногий, его скорость перемещения на 10 футов выше твоей базовой.\n\n**Частичный Эксперт/Зверолик**\n\n| Уровень | Кости здоровья | Бонус атаки | Выборы Фокусов |\n|---|---|---|---|\n| 1 | 1d6 | +0 | 1 Эксперт, +1 Любой |\n| 2 | 2d6 | +1 | +1 Любой |\n| 3 | 3d6 | +1 | – |\n| 4 | 4d6 | +2 | – |\n| 5 | 5d6 | +2 | +1 Любой |\n| 6 | 6d6 | +3 | – |\n| 7 | 7d6 | +3 | +1 Любой |\n| 8 | 8d6 | +4 | – |\n| 9 | 9d6 | +4 | – |\n| 10 | 10d6 | +5 | +1 Любой |\n\n**Частичный другой Маг/Зверолик**\n\n| Уровень | Кости здоровья | Бонус атаки | Выборы Фокусов |\n|---|---|---|---|\n| 1 | 1d6-1 | +0 | 1 Любой |\n| 2 | 2d6-2 | +0 | +1 Любой |\n| 3 | 3d6-3 | +0 | – |\n| 4 | 4d6-4 | +0 | – |\n| 5 | 5d6-5 | +1 | +1 Любой |\n| 6 | 6d6-6 | +1 | – |\n| 7 | 7d6-7 | +1 | +1 Любой |\n| 8 | 8d6-8 | +1 | – |\n| 9 | 9d6-9 | +1 | – |\n| 10 | 10d6-10 | +2 | +1 Любой |\n\n**Частичный Воин/Зверолик**\n\n| Уровень | Кости здоровья | Бонус атаки | Выборы Фокусов |\n|---|---|---|---|\n| 1 | 1d6+2 | +1 | 1 Воин, +1 Любой |\n| 2 | 2d6+4 | +2 | +1 Любой |\n| 3 | 3d6+6 | +2 | – |\n| 4 | 4d6+8 | +3 | – |\n| 5 | 5d6+10 | +4 | +1 Любой |\n| 6 | 6d6+12 | +5 | – |\n| 7 | 7d6+14 | +5 | +1 Любой |\n| 8 | 8d6+16 | +6 | – |\n| 9 | 9d6+18 | +6 | – |\n| 10 | 10d6+20 | +7 | +1 Любой |\n\n**Искусства Зверолика и бонус облика**\n\n| Уровень | Бонус облика | Полученные Искусства |\n|---|---|---|\n| 1 | +1 | Смена облика и одно любое |\n| 2 | +1 | Одно любое |\n| 3 | +2 | – |\n| 4 | +2 | Одно любое |\n| 5 | +3 | Одно любое |\n| 6 | +3 | Одно любое |\n| 7 | +4 | – |\n| 8 | +4 | Одно любое |\n| 9 | +5 | – |\n| 10 | +6 | Одно любое |\n\n#### Другие Искусства Зверолика\n\n**Боевой облик:** в этом облике ты получаешь чистый бонус +2 ко всем броскам атаки в ближнем бою и можешь пользоваться бонусом атаки облика даже в гуманоидном теле. Однако вид у этого облика откровенно боевой: он не сойдёт ни за что безобидное или вполне человеческое.\n\n**Врождённая броня:** у этого облика прочная чешуя, шкура, панцирь или иные защитные покровы. Твой базовый Класс защиты равен 14 плюс половина уровня персонажа с округлением вниз. Этот КЗщ модифицируется модификатором Ловкости и щитами, если облик способен их держать.\n\n**Глаза ястреба:** у этого облика необычайно острые чувства. Ты чуешь следы и предметы, как пёс, слышишь самые слабые звуки, видишь достаточно ясно, чтобы узнавать лица с тысячи футов, и хорошо видишь при любом освещении, кроме полной темноты. Ты получаешь бонус +2 ко всем проверкам Внимания, связанным с восприятием.\n\n**Звериная удаль:** у этого облика повышенная скорость, сила или крепость. Выбери для него Силу, Ловкость или Телосложение; модификатор этой характеристики в этом облике растёт на +1, максимум до +2. Изменения явные и разительные: с этим Искусством невозможно выдать себя за обычного, ничем не изменённого человека. Пункты здоровья, полученные от роста Телосложения, теряются при обратном превращении.\n\n**Кошачий прыжок:** этот облик прыгает на огромные расстояния. Действием перемещения ты можешь прыгнуть на полную скорость перемещения — на всё расстояние по горизонтали или до половины по вертикали. При расчёте урона от падения вычитай свою скорость перемещения из высоты падения.\n\n**Красота ваятеля:** ты развил утончённое эстетическое чувство, напрямую играющее на подсознательных представлениях зрителей о красоте. Этот облик улучшает твой модификатор Харизмы на +1, максимум до +2. В такой красоте всегда есть что-то нездешнее: подобный облик никогда не примут за полностью обычного человека или зверя, хотя могут счесть каким-нибудь диковинным полулюдом или изменённой человеческой породой.\n\n**Мудрость плавника и чешуи:** этот облик дышит водой, плавает вдвое быстрее твоей обычной скорости перемещения и неуязвим для любого обычного климатического холода и глубинного давления. Под водой он видит до шестидесяти футов даже без обычного света.\n\n**Обезьянья дорога:** в лазании этот облик ловок, как древесный зверь. Ты взбираешься по отвесным поверхностям с обычной скоростью перемещения, если свободны хотя бы три конечности, а поверхность не гладкая, как стекло. При падении ты можешь остановить полёт без урона, если в десяти футах от тебя есть пригодная поверхность, за которую можно уцепиться.\n\n**Объятия осьминога:** у этого облика может быть больше четырёх рабочих конечностей. Дополнительные щупальца, руки, ноги или хваталки могут держать предметы и управляться с ними: этими конечностями можно держать в готовности до четырёх предметов из укладки, не занимая свой лимит Загруженности в готовности. Лишние конечности не могут по-настоящему нести дополнительные щиты, совершать дополнительные атаки или действия и вообще делать что-то, что требует заметного внимания сверх твоего текущего действия.\n\n**Податливая плоть:** ты в совершенстве овладел сменой облика: «Смену облика» можно применять Действием в свой ход, хотя и лишь раз в раунд. Или же она может занять целую минуту, но не стоить Усилия вовсе. Всякий раз, когда ты задействуешь Усилие ради превращения, ты исцеляешь потерянные пункты здоровья в размере 1d6 плюс твой уровень; это не работает при простом возвращении из облика. Это Искусство присуще тебе самому и не считается в предельном числе Искусств, применимых к облику.\n\n**Поцелуй змеи:** этот облик может выделять яд на когти или клыки. При успешном попадании ты можешь задействовать Усилие до конца сцены Мгновенным действием, чтобы нанести дополнительно 1d8 урона плюс твой навык Выживание. Ты можешь сделать токсин парализующим, а не смертельным: враги, сведённые таким ударом до нуля пунктов здоровья, на час парализованы и беспомощны, а не смертельно ранены.\n\n**Свирепые когти:** у этого облика крайне опасные когти, клыки, клешни или иное природное оружие. На первом уровне это оружие наносит 1d8 урона, использует Сил или Лов как модифицирующую характеристику и Кулак как боевой навык и имеет Шок 2/КЗщ 13. На 3-м уровне урон и Шок растут на +1, на 6-м — до +2, на 9-м — до +3. Это оружие ранит даже существ, неуязвимых для немагического оружия.\n\n**Совершенное подражание:** этот второй облик может в точности повторить другое существо, если у тебя есть прядь его волос, ещё не свернувшаяся капля его крови или десять минут наблюдения за ним с пяти футов. Один раз выучив облик, новых образцов ты не требуешь.\n\n**Явить крылья:** этот облик может отращивать рабочие крылья. Сосредоточившись на том, чтобы держаться в воздухе, ты не можешь толком атаковать, но летишь со своей обычной скоростью перемещения +10 футов за действие. Без помех в полёте по местности ты покрываешь до десяти миль в час и держишься в воздухе до пяти часов в день."},{"n":"1.5.16","l":3,"te":"The Thought Noble","tr":"Вельможа мысли","en":"This partial Mage class allows a PC to subtly manipulate the\nthoughts of others and control their own mind and body’s operation.\nThought Noble Benefits\nA Thought Noble exists only as a partial Mage class, to be \ntaken by an Adventurer alongside another partial class. A Partial \nWarrior/Thought Noble might be a cunning duelist who chooses his \nenemies with uncanny foreknowledge, while a Partial High Mage/\nThought Noble might be an arcanist who has managed to unearth\nthe secrets of these psychic arts in the course of their own studies.\nAll Thought Nobles gain Notice as a bonus skill, acquiring it at \nlevel-0, or level-1 if they already have it at level-0. An ability to \nclearly sense perceptual inputs is fundamental to a Thought Noble’s \ntraining, and it is all but impossible to make sense of foreign mental \ninputs without a disciplined and trained sensorium.\nThought Nobles do not cast spells. Instead, they develop various \ncognitive and telepathic abilities based on the focus of their studies.","ru":"Этот частичный класс Мага позволяет ПИ незаметно управлять чужими мыслями и повелевать работой собственного разума и тела.\n\n#### Преимущества Вельможи мысли\n\nВельможа мысли существует только как частичный класс Мага, который Авантюрист берёт вместе с другим частичным классом. Частичный Воин/Вельможа мысли может быть хитрым дуэлянтом, выбирающим врагов со сверхъестественным предвидением, а частичный Высший маг/Вельможа мысли — чародеем, сумевшим раскопать тайны этих психических искусств в собственных изысканиях.\n\nВсе Вельможи мысли получают Внимание как бонусный навык: на уровне-0 или на уровне-1, если он уже был на уровне-0. Умение ясно воспринимать сигналы чувств — основа подготовки Вельможи мысли: без дисциплинированного, тренированного сенсориума почти невозможно разобраться в чужих ментальных сигналах.\n\nВельможи мысли не читают заклинаний. Вместо этого они развивают различные когнитивные и телепатические способности сообразно направлению своих занятий."},{"n":"1.5.16.1","l":4,"te":"Thought Noble Arts","tr":"Искусства Вельможи мысли","en":"Thought Noble Effort is calculated with Notice rather than Magic,\nwith each PC’s maximum being equal to their Notice skill level plus \nthe better of their Intelligence or Wisdom modifiers, to a minimum \nof one point.\nAll Thought Nobles are trained in the Open Mind art, but may \ndevelop other techniques with time. If an art allows a saving throw \nto resist it, success renders the target immune to that art for the rest \nof the scene. Thought Noble arts are all entirely invisible to any but \nmagical senses and provide no hint as to who is using them, even \non a successful Mental saving throw.\nOpen Mind: Commit Effort as an On Turn action. While Effort \nremains Committed, you may detect the current emotional state of \na visible living creature as a Main Action. This discernment isn’t fine \nenough to identify the object of their emotions unless it’s obvious \nfrom the context.\nOther Thought Noble Arts\nBlock Memory: Target a visible living creature and Commit Effort \nfor the day as a Main Action while specifying a particular event or \nsituation that didn’t extend longer than a scene. The target gets a \nMental saving throw; on a failure, they simply cannot remember the \nevent and will construct a plausible false memory to paper over the \ngap. The memory can be restored by use of this power once more \nor a magical dispelling ability, but detecting the alteration is difficult; \nany power that detects enchantments on a target does so with a \n+2 difficulty penalty to any skill check made to discern the ban.\nElicitation of Truth: This art can only be taken by those who have \nmastered Surface Apprehension. It can only be used on a helpless \nor cooperative target; the Thought Noble may Commit Effort for \nthe day and ask the target a question that takes no more than two \nsentences to ask. If the target fails a Mental saving throw, they must \nfully and completely answer the question. They need not exercise \nany personal judgment or speculation, but they must answer directly \nand without conscious deception.\nFacile Speech: An improvement to the Far Speech art, you may \nnow nominate up to a half-dozen companions to be favored targets \nfor Far Speech. You may link with a favored target as an On Turn \naction without Committing Effort. The range to contact a favored \ntarget is one mile per Thought Noble level. You can change your\nLevel\nHit Dice\n10d6\n+5\n+1 Any\nLevel\nHit Dice\n10d6-10\n+2\n+1 Any\nLevel\nHit Dice\n10d6+20\n+7\n+1 Any\nThought Noble Arts\nOpen Mind and Any One\nAny One\nAny One\nAny One\nAny One\nAny One\nAny One\nAny One\nAny One\nAny One\nnominated companions with an hour’s meditation in the new com-\npanion’s presence.\nFar Speech: Commit Effort for the scene as an On Turn action and \ntarget an intelligent creature known to you that is within two hundred \nfeet per level. If they consent, you forge a telepathic link with them that \ncan convey thoughts, speech, and images even without a common \nlanguage. The link lasts for the rest of the scene. While linked with \nsomeone, both of you may reroll failed Mental saving throws and \nneither of you can be surprised unless both are.\nHypercognition: You can drive your mind to tremendous feats of \ncalculation, estimation, and recall. You have an eidetic memory and \ncan perform extremely advanced calculations in your head. As an In-\nstant action, Commit Effort for the day and reroll any failed Int-based \nskill check. This ability can be used only once on any given check.\nIconograph: Commit Effort for the scene as a Main Action and tar-\nget a visible written text, piece of sculpture, iconographic symbol, or \nother visible artifact. You receive a short description of the message \nor idea the maker was trying to convey with the object. Optionally, \nyou may use this art when making a sigil, art object, or text of your \nown; any valid target will automatically understand your intended \nmessage when they see the item. You may restrict your audience to \nparticular people or types if you wish.\nImpress Imperative: Commit Effort for the day as a Main Action \nwhile targeting a visible living creature. You may give it an over-\nwhelming urge to perform some action that takes no longer than a \nround and is not completely contrary to its nature or wishes. It can \nmake a Mental save to resist, but on a failure it spends its next action \ncarrying out the imperative.\nMind Light: Your Open Mind art is enhanced. While active, you \nbecome aware of the location of all living minds within sixty feet \nof you provided there isn’t a physical barrier between you and the \nsubject and they are not actively hiding from you. You can identify \nthe species of these minds, if the species is known to you, any strong \nemotional states, and can recognize known individuals. While Open \nMind is active you cannot be surprised by a living creature.\nMind Over Matter: Your mental control over your physical process-\nes is considerable. Commit Effort for the day as an Instant action to \ngain one of the following benefits: automatically stabilize if Mortally \nWounded, go without sleep for twenty-four hours, heal 1d6 hit points \nof damage you’ve suffered, or completely ignore normal climatic \nextremes of heat or cold for one day. Similar tricks of bodily control \nmay be allowed at the GM’s discretion.\nMirror Mask: You become instantly aware of any mind-affecting \npower directed at you and can identify the user if they’re within your \ncurrent sensory range. You may reroll any Mental saving throw the \nattacking ability allows you; if it doesn’t allow a save, you get a single \nMental save to resist anyway. If you succeed, you may Commit Effort\nfor the day as an Instant action to give the power false information \nof your choice or a false impression of success.\nPositive Association: As a Main Action, Commit Effort for the day \nand target a visible sentient creature. It gets a Mental saving throw \nto resist; on a failure, any thought of you or your actions is suffused \nby a glow of benign happiness and admiration. They will treat you \nas an admired friend and find all your actions to be eminently rea-\nsonable and wise until you or your allies attack them, bring harm \nto something they love, or leave their presence for more than an \nhour. Affected creatures that were not misused are unlikely to think \nthemselves bespelled when this power ends unless given reason to. \nThis ability can affect only one target at a time.\nRead Intent: As an Instant action, Commit Effort for the scene and\nLevel\nArts\ntarget a visible living creature. It gets a Mental saving throw to resist; \non a failure, the GM will tell you exactly what it is currently intending \nto do on its next turn, or its next relevant action if used out of combat. \nIf you perform a Total Defense action this round, your insight into its \nmotions ensures that no attack it makes that you could theoretically \nphysically avoid can hit you for the rest of the round.\nSurface Apprehension: Commit Effort for the scene as a Main \nAction while targeting a visible living creature. If it fails a Mental\nsaving throw, you become aware of its immediate surface thoughts \nfor the rest of the round. If you ask specific questions of the creature \nduring this round it will instinctively think of the answers, though the \ndetail of these surface thoughts is generally limited to one or two \nsentences of information.\nThoughts Like Razors: As a Main Action, Commit Effort for the day \nto launch a psychic assault on any visible living creature within sixty \nfeet. The target gets a Mental saving throw to resist; on a failure, it \ntakes 1d8 damage per level of the Thought Noble. The damage can \nknock it unconscious but cannot kill. On a successful save, the Thought \nNoble is stunned by the backlash, taking one quarter of the damage, \nrounded down, and losing their next turn’s actions. This ability can \nbe used only once per scene.\nUnthinkable Thought: Target a visible living creature and Commit \nEffort for the day as a Main Action while specifying a particular \nperson, object, or situation that is currently ongoing in their presence. \nThe target may make a Mental save to resist; on a failure, they simply\ncannot consciously acknowledge the existence of the subject or its \nactions unless ignoring it would obviously put their life at risk. This \nforced ignorance lasts for up to a scene; at its end, the target will \nhave no memory of the subject.\nPartial Expert/Vowed\nAttack\nBonus\nFocus Picks\n1d6\n+0\n1 Expert\n+1 Any\n2d6\n+1\n+1 Any\n3d6\n+1\n4d6\n+2\n5d6\n+2\n+1 Any\n6d6\n+3\n7d6\n+3\n+1 Any\n8d6\n+4\n9d6\n+4\nPartial Other Mage/Vowed\nAttack\nBonus\nFocus Picks\n1d6\n+0\n 1 Any\n2d6\n+0\n+1 Any\n3d6\n+0\n4d6\n+0\n5d6\n+1\n+1 Any\n6d6\n+1\n7d6\n+1\n+1 Any\n8d6\n+1\n9d6\n+1\nPartial Warrior/Vowed\nAttack\nBonus\nFocus Picks\n1d6+2\n+1\n1 Warrior\n+1 Any\n2d6+4\n+2\n+1 Any\n3d6+6\n+2\n4d6+8\n+3\n5d6+10\n+4\n+1 Any\n6d6+12\n+5\n7d6+14\n+5\n+1 Any\n8d6+16\n+6\n9d6+18\n+6","ru":"Усилие Вельможи мысли считается по Вниманию, а не по Магии: максимум каждого ПИ равен уровню навыка Внимание плюс лучший из модификаторов Интеллекта или Мудрости, минимум один пункт.\n\nВсе Вельможи мысли обучены Искусству «Открытый разум», а со временем могут развить и другие приёмы. Если Искусство позволяет спасбросок для сопротивления, успех делает цель невосприимчивой к этому Искусству до конца сцены. Все Искусства Вельможи мысли совершенно невидимы для любых чувств, кроме магических, и не дают ни намёка на того, кто их применяет, — даже при успешном Ментальном спасброске.\n\n**Открытый разум:** задействуй Усилие Действием в свой ход. Пока Усилие задействовано, ты можешь Основным действием определять текущее эмоциональное состояние видимого живого существа. Эта чуткость недостаточно тонка, чтобы понять, на что направлены эмоции, если это не очевидно из обстановки.\n\n**Частичный Эксперт/Вельможа мысли**\n\n| Уровень | Кости здоровья | Бонус атаки | Выборы Фокусов |\n|---|---|---|---|\n| 1 | 1d6 | +0 | 1 Эксперт, +1 Любой |\n| 2 | 2d6 | +1 | +1 Любой |\n| 3 | 3d6 | +1 | – |\n| 4 | 4d6 | +2 | – |\n| 5 | 5d6 | +2 | +1 Любой |\n| 6 | 6d6 | +3 | – |\n| 7 | 7d6 | +3 | +1 Любой |\n| 8 | 8d6 | +4 | – |\n| 9 | 9d6 | +4 | – |\n| 10 | 10d6 | +5 | +1 Любой |\n\n**Частичный другой Маг/Вельможа мысли**\n\n| Уровень | Кости здоровья | Бонус атаки | Выборы Фокусов |\n|---|---|---|---|\n| 1 | 1d6-1 | +0 | 1 Любой |\n| 2 | 2d6-2 | +0 | +1 Любой |\n| 3 | 3d6-3 | +0 | – |\n| 4 | 4d6-4 | +0 | – |\n| 5 | 5d6-5 | +1 | +1 Любой |\n| 6 | 6d6-6 | +1 | – |\n| 7 | 7d6-7 | +1 | +1 Любой |\n| 8 | 8d6-8 | +1 | – |\n| 9 | 9d6-9 | +1 | – |\n| 10 | 10d6-10 | +2 | +1 Любой |\n\n**Частичный Воин/Вельможа мысли**\n\n| Уровень | Кости здоровья | Бонус атаки | Выборы Фокусов |\n|---|---|---|---|\n| 1 | 1d6+2 | +1 | 1 Воин, +1 Любой |\n| 2 | 2d6+4 | +2 | +1 Любой |\n| 3 | 3d6+6 | +2 | – |\n| 4 | 4d6+8 | +3 | – |\n| 5 | 5d6+10 | +4 | +1 Любой |\n| 6 | 6d6+12 | +5 | – |\n| 7 | 7d6+14 | +5 | +1 Любой |\n| 8 | 8d6+16 | +6 | – |\n| 9 | 9d6+18 | +6 | – |\n| 10 | 10d6+20 | +7 | +1 Любой |\n\n**Искусства Вельможи мысли**\n\n| Уровень | Искусства |\n|---|---|\n| 1 | Открытый разум и одно любое |\n| 2 | Одно любое |\n| 3 | Одно любое |\n| 4 | Одно любое |\n| 5 | Одно любое |\n| 6 | Одно любое |\n| 7 | Одно любое |\n| 8 | Одно любое |\n| 9 | Одно любое |\n| 10 | Одно любое |\n\n#### Другие Искусства Вельможи мысли\n\n**Внушённая приязнь:** Основным действием задействуй Усилие до конца дня и выбери целью видимое разумное существо. Оно делает Ментальный спасбросок; при провале всякая мысль о тебе и твоих поступках окрашивается тёплым светом благодушия и восхищения. Цель будет обращаться с тобой как с почитаемым другом и находить все твои действия исключительно разумными и мудрыми, пока ты или твои союзники не нападёте на неё, не навредите чему-то, что она любит, или пока ты не покинешь её общество больше чем на час. Существа, которыми не злоупотребляли, после окончания действия способности вряд ли заподозрят, что были околдованы, если не дать им повода. Эта способность действует лишь на одну цель за раз.\n\n**Внушить приказ:** задействуй Усилие до конца дня Основным действием, выбрав целью видимое живое существо. Ты можешь вселить в него непреодолимое желание совершить действие, которое занимает не больше раунда и не полностью противно его природе или желаниям. Цель может сопротивляться Ментальным спасброском, но при провале тратит своё следующее действие на исполнение приказа.\n\n**Дальняя речь:** задействуй Усилие до конца сцены Действием в свой ход и выбери целью знакомое тебе разумное существо в пределах 200 футов за уровень. С его согласия ты создаёшь телепатическую связь, передающую мысли, речь и образы даже без общего языка. Связь держится до конца сцены. Пока вы связаны, вы оба можете перебрасывать проваленные Ментальные спасброски, и ни одного из вас нельзя застать врасплох, если не застигнуты оба.\n\n**Запереть память:** выбери целью видимое живое существо и задействуй Усилие до конца дня Основным действием, назвав определённое событие или ситуацию длительностью не больше сцены. Цель делает Ментальный спасбросок; при провале она попросту не может вспомнить событие и выстроит правдоподобное ложное воспоминание, чтобы закрыть пробел. Память можно вернуть повторным применением этой способности или магическим развеиванием, но заметить вмешательство трудно: любая способность, обнаруживающая чары на цели, работает со штрафом +2 к сложности любой проверки навыка на распознание этого запрета.\n\n**Зеркальная маска:** ты мгновенно узнаёшь о любой направленной на тебя способности, влияющей на разум, и опознаёшь её источник, если тот в пределах твоих текущих чувств. Ты можешь перебросить любой Ментальный спасбросок, который позволяет атакующая способность; если она спасброска не даёт, ты всё равно получаешь один Ментальный спасбросок на сопротивление. При успехе ты можешь задействовать Усилие до конца дня Мгновенным действием, чтобы скормить способности ложные сведения на свой выбор или ложное впечатление успеха.\n\n**Извлечение истины:** это Искусство могут взять лишь освоившие «Поверхностное чтение мыслей». Оно работает только на беспомощной или согласной цели: Вельможа мысли может задействовать Усилие до конца дня и задать цели вопрос длиной не больше двух предложений. Если цель провалит Ментальный спасбросок, она обязана ответить на вопрос полно и исчерпывающе. От неё не требуется собственных суждений и догадок, но отвечать она должна прямо и без сознательного обмана.\n\n**Лёгкая речь:** улучшение Искусства «Дальняя речь»: теперь ты можешь назначить до полудюжины спутников избранными целями «Дальней речи». С избранной целью ты связываешься Действием в свой ход, не задействуя Усилие. Дальность связи с избранной целью — одна миля за уровень Вельможи мысли. Сменить назначенных спутников можно часом медитации в присутствии нового спутника.\n\n**Мыслеобраз:** задействуй Усилие до конца сцены Основным действием и выбери целью видимый письменный текст, скульптуру, иконографический символ или иной видимый артефакт. Ты получаешь краткое описание послания или идеи, которую создатель хотел вложить в предмет. Также ты можешь применять это Искусство, создавая собственный сигил, предмет искусства или текст: любая подходящая цель, увидев вещь, автоматически поймёт вложенное тобой послание. При желании можешь ограничить аудиторию определёнными людьми или типами людей.\n\n**Мысли острее бритв:** Основным действием задействуй Усилие до конца дня, чтобы обрушить психическую атаку на любое видимое живое существо в шестидесяти футах. Цель делает Ментальный спасбросок; при провале она получает 1d8 урона за уровень Вельможи мысли. Урон может лишить её сознания, но не убить. При успешном спасброске Вельможу мысли оглушает отдачей: он получает четверть урона с округлением вниз и теряет действия своего следующего хода. Эта способность применяется лишь раз за сцену.\n\n**Немыслимая мысль:** выбери целью видимое живое существо и задействуй Усилие до конца дня Основным действием, указав определённого человека, предмет или ситуацию, происходящую сейчас в присутствии цели. Цель может сопротивляться Ментальным спасброском; при провале она попросту не способна сознательно признавать существование указанного предмета или его действий — разве что не замечать его значило бы очевидно рисковать жизнью. Эта вынужденная слепота длится до конца сцены; по её окончании у цели не останется никаких воспоминаний о предмете.\n\n**Поверхностное чтение мыслей:** задействуй Усилие до конца сцены Основным действием, выбрав целью видимое живое существо. Если оно провалит Ментальный спасбросок, до конца раунда ты воспринимаешь его сиюминутные поверхностные мысли. Если в этот раунд задавать существу конкретные вопросы, оно невольно подумает об ответах, хотя подробность таких поверхностных мыслей обычно ограничена одним-двумя предложениями сведений.\n\n**Разум над материей:** твоя власть разума над телесными процессами велика. Задействуй Усилие до конца дня Мгновенным действием, чтобы получить одно из следующего: автоматически стабилизироваться, будучи смертельно раненным; обойтись без сна двадцать четыре часа; исцелить 1d6 пунктов здоровья полученного урона; или полностью не замечать обычной климатической жары или стужи один день. Мастер может разрешить и другие подобные фокусы телесного контроля.\n\n**Сверхмышление:** ты способен разгонять разум до чудовищных подвигов вычисления, оценки и припоминания. У тебя эйдетическая память, и ты выполняешь в уме крайне сложные расчёты. Мгновенным действием задействуй Усилие до конца дня и перебрось любую проваленную проверку навыка на Инт. На одну и ту же проверку эта способность применяется лишь один раз.\n\n**Свет разума:** твоё Искусство «Открытый разум» усилено. Пока оно активно, ты чувствуешь расположение всех живых разумов в шестидесяти футах от себя, если между вами нет физической преграды и они не прячутся от тебя намеренно. Ты распознаёшь вид этих разумов, если он тебе знаком, и любые сильные эмоциональные состояния, а знакомых узнаёшь. Пока «Открытый разум» активен, живое существо не может застать тебя врасплох.\n\n**Чтение намерений:** Мгновенным действием задействуй Усилие до конца сцены и выбери целью видимое живое существо. Оно делает Ментальный спасбросок; при провале Мастер точно скажет тебе, что оно намерено делать в свой следующий ход, а вне боя — каким будет его следующее значимое действие. Если в этом раунде ты выполняешь действие «Полная защита», понимание его движений гарантирует: до конца раунда по тебе не попадёт ни одна его атака, от которой ты в принципе мог бы физически уклониться."},{"n":"1.5.17","l":3,"te":"The Vowed","tr":"Обетник","en":"Adepts of fist and bodily discipline, the Vowed are a partial Mage\nclass dedicated to unarmed combat, physical training, and mental \ndiscipline.\nVowed Benefits\nThe Vowed class exists only as a partial Mage class, to be taken\nby an Adventurer along with another partial class. Thus, a Partial \nWarrior/Partial Vowed might be a hardened temple warrior-monk, \na Partial Expert/Partial Vowed might be a sage teacher of religious \nor philosophical truths, and a Partial Elementalist/Partial Vowed \nmight be a mountain sage who wields the elemental forces of nature. \nRegardless of classes, a Vowed’s hit dice can’t be worse than 1d6 \nper level thanks to Martial Style.\nAll Vowed gain a non-combat bonus skill appropriate to their \norder, acquiring it at level-0, or level-1 if they already have it at \nlevel-0. Orders that focus on physical training might grant Exert, \nwhile scholarly ones might give Know, religious ones Pray, or occult \nsects grant Magic. You may pick whatever non-combat skill suits \nyour order, assuming the GM finds it reasonable.\nVowed do not learn how to cast spells. Instead, they refine their \ninner powers and physical capabilities. These arts are too precise \nand delicate to bear the encumbrance of heavy clothing, armor, \nor shields, and cannot be used when so burdened. The Armored \nMagic Focus can mitigate this, but Vowed are all trained in effective \nunarmored defense techniques.\nAt first level, a Vowed gains the Martial Style, Unarmed Might, \nand Unarmored Defense arts, in addition to one more art of their \nchoice as given on the adjacent list. Further advancement will grant \nadditional arts.","ru":"Адепты кулака и телесной дисциплины, Обетники — частичный класс Мага, посвящённый рукопашному бою, физической закалке и дисциплине разума.\n\n#### Преимущества Обетника\n\nКласс Обетника существует только как частичный класс Мага, который Авантюрист берёт вместе с другим частичным классом. Так, частичный Воин/частичный Обетник может быть закалённым храмовым воином-монахом, частичный Эксперт/частичный Обетник — мудрым наставником в религиозных или философских истинах, а частичный Стихийник/частичный Обетник — горным мудрецом, повелевающим стихийными силами природы. Каким бы ни было сочетание классов, кости здоровья Обетника не могут быть хуже 1d6 за уровень благодаря «Боевому стилю».\n\nВсе Обетники получают небоевой бонусный навык, подобающий их ордену: на уровне-0 или на уровне-1, если он уже был на уровне-0. Ордена, сосредоточенные на физической закалке, могут давать Атлетику, учёные — Знание, религиозные — Молитву, а оккультные секты — Магию. Можешь выбрать любой небоевой навык, подходящий твоему ордену, если Мастер сочтёт выбор разумным.\n\nОбетники не учатся читать заклинания. Вместо этого они оттачивают внутренние силы и возможности тела. Эти Искусства слишком точны и тонки, чтобы терпеть груз тяжёлой одежды, брони или щитов, и не работают под такой ношей. Фокус «Магия в доспехах» может это смягчить, но все Обетники и так обучены действенным приёмам защиты без доспехов.\n\nНа первом уровне Обетник получает Искусства «Боевой стиль», «Безоружная мощь» и «Защита без доспехов», а вдобавок ещё одно Искусство на выбор из приведённого рядом списка. Дальнейшее развитие принесёт новые Искусства."},{"n":"1.5.17.1","l":4,"te":"Vowed Arts","tr":"Искусства Обетника","en":"Vowed Effort is based on the skill they chose to represent their \norder’s main focus of study, whether Exert, Know, Magic, Pray, or \nsome more esoteric skill.\nTheir maximum Vowed Effort is equal to this skill level plus their \nbest attribute modifier, whatever it may be, to a minimum of one \npoint. All Vowed automatically gain the Martial Style, Unarmed \nMight, and Unarmored Defense arts as part of their training.\nMartial Style: Regardless of class, your hit die can’t be worse than \n1d6 per level. When attacking with the Punch skill, your class hit \nbonus can be no worse than that of an Expert of your same char-\nacter level. At third level, any attack using the Punch skill counts \nas a magic weapon.\nUnarmed Might: Your unarmed attack damage increases as you \ngain levels, as noted on the chart. You may add your Punch skill \nto the damage done by these attacks as usual, but Foci such as \nUnarmed Combatant that replace or improve your usual Punch \ndamage do not apply to you.\nUnarmored Defense: When not wearing armor or using a shield, \nyour base Armor Class is equal to 13 plus half your character level, \nrounded down.\nOther Vowed Arts\nBrutal Counter: Commit Effort for the scene as an Instant action \nafter resolving an enemy melee attack against you, whether it hits or \nmisses. You may make a free physical attack against your assailant, \nusing either a normal attack or some other offensive ability that\nLevel\nHit Dice\n10d6\n+5\n+1 Any\nLevel\nHit Dice\n10d6\n+2\n+1 Any\nLevel\nHit Dice\n10d6+20\n+7\n+1 Any\nVowed Arts and Unarmed Abilities\nPunch\nPunch Hit\nDam-\nPunch\nShock\nArts Gained\nLevel\nBonus\nage\n+0\n1d6\n1/15\nMartial Style, Unarmed Might, \nUnarmed Defense,\nand Any One\n+1\n1d6\n2/15\nAny One\n+1\n1d8\n2/15\n+2\n1d8\n2/15\nAny One\n+2\n1d10\n2/15\nAny One\n+3\n1d10\n3/15\nAny One\n+3\n1d10+1\n3/15\n+4\n1d10+1\n3/15\nAny One\n+4\n1d10+2\n4/15\n+5\n1d10+3\n4/15\nAny One\ntakes no more than one Main Action to execute. You cannot use \nthis art more than once per any given attack, but you may use it \nwhile performing a Total Defense.\nFaultless Awareness: Your awareness is such that you cannot \nbe surprised, and will even wake from a sound sleep in time to \nrespond normally to some imminent peril.\nHurling Throw: After you make a successful attack, you may \nCommit Effort for the scene as an Instant action. The target must\nmake a Physical saving throw or be thrown up to ten feet in any \ndirection, falling prone on landing and suffering the damage rolled \nfor your attack. If the Physical save is successful, the target simply \ntakes damage as normal. This art can be used only once per round \non any given target, and the target must be no larger than an ox.\nThe Inward Eye: Commit Effort as an On Turn action. For as long \nas it remains Committed, you are mystically aware of your sur-\nroundings with a sense equivalent to normal eyesight regardless \nof darkness, obscuring mists, or your actual eyes being closed or \nblinded.\nLeap of the Heavens: Commit Effort for the scene as a Move \naction to leap up to your full Move action horizontally or half that \nvertically. You may also Commit Effort for the scene as an Instant \naction to negate falling damage, no matter the distance.\nMaster’s Vigor: Your body retains its vigor and youthful vitality to\nthe full normal span of your life. You regain two lost hit points per \nhour due to your natural restorative powers.\nMob Justice: As an Instant action, Commit Effort for the day to be-\ncome impervious to the Make a Swarm Attack maneuver. Your as-\nsailants cannot use this maneuver against you for the rest of the scene, \nand you become immune to Shock as long as you remain in melee \nwith at least two foes. Making use of this benefit disrupts any spell-\ncasting you may attempt, however, due to the violent motion required.\nNimble Ascent: Commit Effort for the scene as an On Turn action. \nFor the remainder of the scene you may move up vertical and over-\nhanging surfaces and across difficult terrain at your full movement \nrate with no chance of slipping or falling, provided the surface is not \nglass-smooth or enchanted. You require only one free hand to cling \nto a wall or ceiling.\nPurified Body: You may Commit Effort for the day as an Instant ac-\ntion to cure any disease or poison currently affecting you, or instead \nto negate any need for sleep, food, water, or air for the next 24 hours.\nRevivifying Breath: Commit Effort for the day as an On Turn action \nto heal yourself for 1d6 hit points plus your level. This healing does \nnot increase System Strain. This ability may be used on your turn even \nwhen you are at zero hit points, but in such a case it Commits all your \nremaining Effort for the day. This art can be used once per scene.\nShattering Strike: Commit Effort for the day and take a full round \nof motionlessness to prepare. On the next round, as a Main Action, \nyour unarmed attack can shatter a wooden door, wooden wall, or \nother similar object up to a depth of one foot per level and a width \nsufficient to allow a man-sized creature to pass through. At fourth \nlevel this ability improves to affect even a stone wall and at seventh \nit can affect even a metal wall or solid iron door. The blow is useless \nagainst a target that can move, but against an immobilized creature \nthe attack does 1d12 damage per character level.\nStyle Weaponry: Pick three general classes of weapons, such as \n“swords”, “bows”, “axes”, “daggers”, or the like. When using weap-\nons of those classes, you may use Punch for hit rolls instead of Stab \nor Shoot. Your Punch skill does not add to the damage done by \nthese weapons, however, though the benefits of Martial Style apply \nto their hit rolls.\nUnobtrusive Step: You not only possess a considerable skill for \ndisguise and obfuscation, you can become extremely hard to detect. \nOnce per scene, you may Commit Effort for the day as an Instant \naction to reroll a failed Sneak skill check or skill check related to \nimpersonating someone else.\nFull Warrior\nAttack\nBonus\nFocus Picks\n1d6+2\n+1\n1 Any +\n1 Warrior\n2d6+4\n+2\n+1 Any\n3d6+6\n+3\n4d6+8\n+4\n5d6+10\n+5\n+1 Any\n6d6+12\n+6\n7d6+14\n+7\n+1 Any\n8d6+16\n+8\n9d6+18\n+9\nPartial Mage/Partial Warrior\nAttack\nBonus\nFocus Picks\n1d6+2\n+1\n1 Any +\n1 Warrior\n2d6+4\n+2\n+1 Any\n3d6+6\n+2\n4d6+8\n+3\nPartial Warriors do not get this ability.\n5d6+10\n+4\n+1 Any\n6d6+12\n+5\n7d6+14\n+5\n+1 Any\n8d6+16\n+6\n9d6+18\n+6\nPartial Warrior/Partial Expert\nAttack\nBonus\nFocus Picks\n1d6+2\n+1\n1 Warrior\n+1 Expert\n+1 Any\nPartial Warriors do not get this ability.\n2d6+4\n+2\n+1 Any\n3d6+6\n+2\n4d6+8\n+3\n5d6+10\n+4\n+1 Any\n6d6+12\n+5\n7d6+14\n+5\n+1 Any\n8d6+16\n+6\n9d6+18\n+6","ru":"Усилие Обетника основано на навыке, выбранном как главный предмет занятий его ордена, — будь то Атлетика, Знание, Магия, Молитва или что-то более эзотерическое.\n\nМаксимум Усилия Обетника равен уровню этого навыка плюс его лучший модификатор характеристики, какой бы это ни была характеристика, минимум один пункт. Все Обетники автоматически получают Искусства «Боевой стиль», «Безоружная мощь» и «Защита без доспехов» как часть своей подготовки.\n\n**Боевой стиль:** независимо от класса, твоя кость здоровья не может быть хуже 1d6 за уровень. При атаке с навыком Кулак твой классовый бонус атаки не может быть хуже, чем у Эксперта того же уровня персонажа. С третьего уровня любая атака с навыком Кулак считается магическим оружием.\n\n**Безоружная мощь:** урон твоих безоружных атак растёт с уровнями, как указано в таблице. Ты, как обычно, можешь добавлять к урону этих атак свой навык Кулак, но Фокусы вроде «Рукопашника», заменяющие или улучшающие твой обычный урон Кулака, на тебя не действуют.\n\n**Защита без доспехов:** когда ты без брони и щита, твой базовый Класс защиты равен 13 плюс половина уровня персонажа с округлением вниз.\n\n**Частичный Эксперт/Обетник**\n\n| Уровень | Кости здоровья | Бонус атаки | Выборы Фокусов |\n|---|---|---|---|\n| 1 | 1d6 | +0 | 1 Эксперт, +1 Любой |\n| 2 | 2d6 | +1 | +1 Любой |\n| 3 | 3d6 | +1 | – |\n| 4 | 4d6 | +2 | – |\n| 5 | 5d6 | +2 | +1 Любой |\n| 6 | 6d6 | +3 | – |\n| 7 | 7d6 | +3 | +1 Любой |\n| 8 | 8d6 | +4 | – |\n| 9 | 9d6 | +4 | – |\n| 10 | 10d6 | +5 | +1 Любой |\n\n**Частичный другой Маг/Обетник**\n\n| Уровень | Кости здоровья | Бонус атаки | Выборы Фокусов |\n|---|---|---|---|\n| 1 | 1d6 | +0 | 1 Любой |\n| 2 | 2d6 | +0 | +1 Любой |\n| 3 | 3d6 | +0 | – |\n| 4 | 4d6 | +0 | – |\n| 5 | 5d6 | +1 | +1 Любой |\n| 6 | 6d6 | +1 | – |\n| 7 | 7d6 | +1 | +1 Любой |\n| 8 | 8d6 | +1 | – |\n| 9 | 9d6 | +1 | – |\n| 10 | 10d6 | +2 | +1 Любой |\n\n**Частичный Воин/Обетник**\n\n| Уровень | Кости здоровья | Бонус атаки | Выборы Фокусов |\n|---|---|---|---|\n| 1 | 1d6+2 | +1 | 1 Воин, +1 Любой |\n| 2 | 2d6+4 | +2 | +1 Любой |\n| 3 | 3d6+6 | +2 | – |\n| 4 | 4d6+8 | +3 | – |\n| 5 | 5d6+10 | +4 | +1 Любой |\n| 6 | 6d6+12 | +5 | – |\n| 7 | 7d6+14 | +5 | +1 Любой |\n| 8 | 8d6+16 | +6 | – |\n| 9 | 9d6+18 | +6 | – |\n| 10 | 10d6+20 | +7 | +1 Любой |\n\n**Искусства Обетника и безоружные способности**\n\n| Уровень | Бонус атаки Кулаком | Урон Кулака | Шок Кулака | Полученные Искусства |\n|---|---|---|---|---|\n| 1 | +0 | 1d6 | 1/15 | Боевой стиль, Безоружная мощь, Защита без доспехов и одно любое |\n| 2 | +1 | 1d6 | 2/15 | Одно любое |\n| 3 | +1 | 1d8 | 2/15 | – |\n| 4 | +2 | 1d8 | 2/15 | Одно любое |\n| 5 | +2 | 1d10 | 2/15 | Одно любое |\n| 6 | +3 | 1d10 | 3/15 | Одно любое |\n| 7 | +3 | 1d10+1 | 3/15 | – |\n| 8 | +4 | 1d10+1 | 3/15 | Одно любое |\n| 9 | +4 | 1d10+2 | 4/15 | – |\n| 10 | +5 | 1d10+3 | 4/15 | Одно любое |\n\n#### Другие Искусства Обетника\n\n**Безупречное восприятие:** твоя бдительность такова, что тебя нельзя застать врасплох; даже от крепкого сна ты проснёшься вовремя, чтобы обычным порядком ответить на надвигающуюся опасность.\n\n**Внутреннее око:** задействуй Усилие Действием в свой ход. Пока оно задействовано, ты мистически воспринимаешь окружение чувством, равным обычному зрению, — невзирая на темноту, застилающие туманы, а также закрытые или ослеплённые глаза.\n\n**Жестокий контрудар:** задействуй Усилие до конца сцены Мгновенным действием после того, как разрешена вражеская атака по тебе в ближнем бою, — попала она или нет. Ты можешь провести бесплатную физическую атаку по нападавшему: обычную атаку или иную наступательную способность, исполнение которой занимает не больше одного Основного действия. Это Искусство нельзя применять больше одного раза на каждую отдельную атаку, но можно применять во время «Полной защиты».\n\n**Живительное дыхание:** задействуй Усилие до конца дня Действием в свой ход, чтобы исцелить себе 1d6 пунктов здоровья плюс твой уровень. Это исцеление не повышает Системную нагрузку. Способность можно применить в свой ход даже при нуле пунктов здоровья, но тогда она задействует всё твоё оставшееся Усилие до конца дня. Это Искусство применяется раз за сцену.\n\n**Крушащий удар:** задействуй Усилие до конца дня и потрать на подготовку полный раунд неподвижности. В следующем раунде твоя безоружная атака Основным действием может проломить деревянную дверь, деревянную стену или похожий предмет глубиной до фута за уровень и шириной, достаточной для прохода существа размером с человека. На четвёртом уровне способность усиливается и берёт даже каменную стену, а на седьмом — даже металлическую стену или цельную железную дверь. Против способной двигаться цели удар бесполезен, но обездвиженному существу атака наносит 1d12 урона за уровень персонажа.\n\n**Мощный бросок:** после успешной атаки ты можешь задействовать Усилие до конца сцены Мгновенным действием. Цель должна сделать Физический спасбросок, иначе её отбрасывает до десяти футов в любом направлении: при приземлении она падает наземь и получает урон, выброшенный для твоей атаки. При успешном Физическом спасброске цель просто получает урон как обычно. Это Искусство применяется к одной и той же цели не больше раза в раунд, и цель должна быть не крупнее вола.\n\n**Неприметный шаг:** ты не только изрядно умел в маскировке и отводе глаз — тебя бывает крайне трудно обнаружить. Раз за сцену ты можешь задействовать Усилие до конца дня Мгновенным действием, чтобы перебросить проваленную проверку навыка Скрытность или проверку навыка, связанную с выдачей себя за другого.\n\n**Оружие стиля:** выбери три общих класса оружия — например, «мечи», «луки», «топоры», «кинжалы» и тому подобное. Атакуя оружием этих классов, ты можешь делать броски атаки по Кулаку вместо Клинка или Стрельбы. Однако навык Кулак не добавляется к урону этого оружия, хотя преимущества «Боевого стиля» к его броскам атаки применяются.\n\n**Очищенное тело:** ты можешь задействовать Усилие до конца дня Мгновенным действием, чтобы излечить любую действующую на тебя болезнь или яд — или же избавиться от нужды во сне, еде, воде и воздухе на ближайшие 24 часа.\n\n**Проворный подъём:** задействуй Усилие до конца сцены Действием в свой ход. До конца сцены ты движешься по отвесным и нависающим поверхностям и по труднопроходимой местности с полной скоростью перемещения без всякого риска соскользнуть или упасть, если поверхность не гладкая, как стекло, и не зачарована. Чтобы держаться на стене или потолке, тебе хватает одной свободной руки.\n\n**Прыжок к небесам:** задействуй Усилие до конца сцены Действием перемещения, чтобы прыгнуть на расстояние до полной скорости перемещения по горизонтали или вдвое меньше по вертикали. Также ты можешь задействовать Усилие до конца сцены Мгновенным действием, чтобы отменить урон от падения с любой высоты.\n\n**Сила мастера:** твоё тело сохраняет бодрость и юношескую жизненную силу до конца отпущенного тебе природой срока. Благодаря природным восстановительным силам ты возвращаешь два потерянных пункта здоровья в час.\n\n**Управа на толпу:** Мгновенным действием задействуй Усилие до конца дня, чтобы стать неуязвимым для манёвра «Атаковать в свалке». До конца сцены нападающие не могут применять против тебя этот манёвр, а ты становишься невосприимчив к Шоку, пока ведёшь ближний бой хотя бы с двумя врагами. Однако пользование этим преимуществом срывает любое твоё чтение заклинаний — слишком уж резки нужные для него движения."},{"n":"1.5.18","l":3,"te":"The Warrior","tr":"Воин","en":"The Warrior is a hero born to the blade, a man or woman gifted\nwith a superb capacity for physical violence. Savage barbarians, \nhardened mercenaries, courageous young farm boys, and ordinary \nlaborers who just happen to have an undiscovered capacity for \nmassive bloodshed all might qualify as Warriors.\nWarriors aren’t all formal soldiers or recognized veterans of the \nblade. Any adventurer who excels in dealing with their problems \nthrough violence might qualify as a Warrior, however peaceful their \nbackground. It’s possible that their very talent for killing was what \nforced them out of their old life after some terrible event or awful \nencounter compelled them to recognize their gifts.\nWarriors have more hit points than heroes of other class, and \nare capable of surviving wounds and hardships that would kill an \nordinary man. They’re also gifted with a superior attack bonus, and \na native ability to inflict more damage than other PCs. Full Warriors \neven have the ability to ensure a hit or force a miss by an enemy \nonce per scene, making them lethal foes to common combatants.\nClass Ability: Killing Blow\nWhenever a Warrior inflicts damage with any attack, spell, or \nspecial ability they may add half their character level, rounded \nup, to the damage done. This damage is also added to any Shock \nthey may inflict.\nCombined with Foci meant to improve Shock attacks such as \nArmsmaster, Close Combatant, or Shocking Assault, this abil-\nity ensures that an experienced Warrior will almost always kill \nany ordinary human soldier or minor monster, regardless of their \nattack roll result.\nClass Ability: Veteran’s Luck\nOnce per scene, as an Instant action, the Warrior may turn a missed \nattack they have made into a hit. Alternately, they may turn a suc-\ncessful attack against them into a miss, also as an Instant action. \nThis ability is particularly lethal when used with the Make a Snap \nAttack action and leveled against weaker monsters or ordinary\nhuman warriors.\nOnly one exercise of this ability is possible in a scene, either \nto force a miss or ensure a hit on a foe; both options may not be \nemployed in the same fight.\nA Warrior may use this ability with crew-served weapons they \nare assisting in firing. This ability cannot be used to negate envi-\nronmental damage or damage done to a vehicle or mount they \nare riding.\nLevel\nHit Dice\n10d6+20\n+10\n+1 Any\nLevel\nHit Dice\n10d6+20\n+7\n+1 Any\nLevel\nHit Dice\n10d6+20\n+7\n+1 Any\nPartial Expert/Wise\nAttack\nBonus\nFocus Picks\n1d6\n+0\n1 Expert\n+1 Any\n2d6\n+1\n+1 Any\n3d6\n+1\n4d6\n+2\n5d6\n+2\n+1 Any\n6d6\n+3\n7d6\n+3\n+1 Any\n8d6\n+4\n9d6\n+4\nPartial Mage/Wise\nAttack\nBonus\nFocus Picks\n1d6\n+0\n 1 Any\n2d6\n+0\n+1 Any\n3d6\n+0\n4d6\n+0\n5d6\n+1\n+1 Any\n6d6\n+1\n7d6\n+1\n+1 Any\n8d6\n+1\n9d6\n+1\nPartial Warrior/Wise\nAttack\nBonus\nFocus Picks\n1d6+2\n+1\n1 Warrior\n+1 Any\n2d6+4\n+2\n+1 Any\n3d6+6\n+2\n4d6+8\n+3\n5d6+10\n+4\n+1 Any\n6d6+12\n+5\n7d6+14\n+5\n+1 Any\n8d6+16\n+6\n9d6+18\n+6","ru":"Воин — герой, рождённый для клинка, мужчина или женщина с исключительным даром к физическому насилию. Воинами могут оказаться дикие варвары, закалённые наёмники, отважные деревенские парни и обычные работяги, в которых просто дремлет нераскрытая способность к большому кровопролитию.\n\nНе всякий Воин — солдат на службе или признанный ветеран клинка. Воином может считаться любой искатель приключений, который отменно решает свои проблемы насилием, каким бы мирным ни было его прошлое. Возможно, сам талант к убийству и вытолкнул его из прежней жизни, когда некое страшное событие или жуткая встреча заставили его осознать свой дар.\n\nУ Воинов больше пунктов здоровья, чем у героев других классов, и они переживают раны и лишения, которые убили бы обычного человека. Вдобавок они одарены повышенным бонусом атаки и врождённой способностью наносить больше урона, чем прочие ПИ. Полные Воины к тому же умеют раз за сцену обеспечить себе попадание или вынудить врага промахнуться, что делает их смертоносными противниками для рядовых бойцов.\n\n#### Классовая способность: Смертельный удар\n\nВсякий раз, когда Воин наносит урон любой атакой, заклинанием или особой способностью, он может добавить к нанесённому урону половину своего уровня персонажа с округлением вверх. Эта прибавка добавляется и к любому Шоку, который он наносит.\n\nВ сочетании с Фокусами, усиливающими атаки Шоком, — такими как Оружейный мастер, Ближний бой или Шокирующий натиск, — эта способность гарантирует, что опытный Воин почти всегда убьёт обычного солдата-человека или мелкое чудовище, каким бы ни был результат его броска атаки.\n\nЧастичные Воины эту способность не получают.\n\n#### Классовая способность: Везение ветерана\n\nРаз за сцену Мгновенным действием Воин может превратить свой промах в попадание. Либо, тоже Мгновенным действием, он может превратить успешную атаку по себе в промах. Эта способность особенно смертоносна в сочетании с действием «Атаковать навскидку», направленным против слабых чудовищ или обычных воинов-людей.\n\nЗа сцену этой способностью можно воспользоваться лишь один раз — либо вынудить промах, либо обеспечить попадание по врагу; оба варианта в одном бою применить нельзя.\n\nВоин может применять эту способность к оружию с расчётом, в стрельбе из которого он помогает. Ею нельзя отменить урон от окружающей среды или урон, нанесённый транспорту либо верховому животному, на котором он едет.\n\nЧастичные Воины эту способность не получают.\n\n**Полный Воин**\n\n| Уровень | Кости здоровья | Бонус атаки | Выборы Фокусов |\n|---|---|---|---|\n| 1 | 1d6+2 | +1 | 1 любой + 1 воинский |\n| 2 | 2d6+4 | +2 | +1 любой |\n| 3 | 3d6+6 | +3 | – |\n| 4 | 4d6+8 | +4 | – |\n| 5 | 5d6+10 | +5 | +1 любой |\n| 6 | 6d6+12 | +6 | – |\n| 7 | 7d6+14 | +7 | +1 любой |\n| 8 | 8d6+16 | +8 | – |\n| 9 | 9d6+18 | +9 | – |\n| 10 | 10d6+20 | +10 | +1 любой |\n\n**Частичный Маг/частичный Воин**\n\n| Уровень | Кости здоровья | Бонус атаки | Выборы Фокусов |\n|---|---|---|---|\n| 1 | 1d6+2 | +1 | 1 любой + 1 воинский |\n| 2 | 2d6+4 | +2 | +1 любой |\n| 3 | 3d6+6 | +2 | – |\n| 4 | 4d6+8 | +3 | – |\n| 5 | 5d6+10 | +4 | +1 любой |\n| 6 | 6d6+12 | +5 | – |\n| 7 | 7d6+14 | +5 | +1 любой |\n| 8 | 8d6+16 | +6 | – |\n| 9 | 9d6+18 | +6 | – |\n| 10 | 10d6+20 | +7 | +1 любой |\n\n**Частичный Воин/частичный Эксперт**\n\n| Уровень | Кости здоровья | Бонус атаки | Выборы Фокусов |\n|---|---|---|---|\n| 1 | 1d6+2 | +1 | 1 воинский + 1 экспертский + 1 любой |\n| 2 | 2d6+4 | +2 | +1 любой |\n| 3 | 3d6+6 | +2 | – |\n| 4 | 4d6+8 | +3 | – |\n| 5 | 5d6+10 | +4 | +1 любой |\n| 6 | 6d6+12 | +5 | – |\n| 7 | 7d6+14 | +5 | +1 любой |\n| 8 | 8d6+16 | +6 | – |\n| 9 | 9d6+18 | +6 | – |\n| 10 | 10d6+20 | +7 | +1 любой |"},{"n":"1.5.19","l":3,"te":"The Wise","tr":"Ведун","en":"Some low-magic settings have a particular place for concepts that \naren’t exactly magical, but have some special place in society. \nWhether a mundane priest of the dominant faith, a feared forest \nwarlock, or a sacred oracle of the gods, these Wise have a special \nrole to fill.\nSome of these Wise may have very minor or subtle magical \npowers suitable to a low-magic campaign setting.\nIn general, the Wise class is usually only viable in a low- or \nno-magic setting where their limited powers are still more than \nalmost anyone else has access to. If standard magic exists in your \ncampaign the Wise may not offer enough to appeal to players.\nBenefits of the Wise\nThe Wise is a partial Expert class that must be taken by an Adven-\nturer with another partial class. It’s generally suited for low-magic \ncampaigns, but strictly mundane versions of it may pass muster for \na no-magic setting.\nWhile the Wise count as a partial Expert class for other purpos-\nes, they do not gain the advantage of the partial Expert’s Quick \nLearner class ability or the bonus non-combat Focus that a partial \nExpert normally gets at first level. An Adventurer who is a standard \npartial Expert/partial Wise does get these perks, however.\nAll Wise gain level-0 in a bonus skill appropriate to their concept, \nbe it Pray, Know, Magic, Survive, or some other skill that makes \nsense to the GM.\nThe Wise do not use Effort. All of their arts are either constantly in \neffect or can be used under particular circumstances or a particular \nnumber of times each day.\nThe arts the Wise learn are generally fixed by their concept and \nrole. A mundane priest will learn certain arts as they advance in \nlevel, while a witch or an oracular seer will learn others. At some \nlevels, the Wise might have a choice; they can pick whichever art \nthey wish, but most arts can be taken only once.\nThe example tables here provide progression patterns for a \nnon-magical priest of a faith, a witch with minor magical powers \nof cursing and foresight, and an oracle with limited powers of \ndivination. For GMs that wish to allow player-made concepts, the \nEsoteric column can be used, or a specific progression can be \nworked up in cooperation with the player.","ru":"В некоторых низкомагических сеттингах находится особое место для образов, которые не то чтобы волшебны, но занимают в обществе своё особенное положение. Будь то обычный священник господствующей веры, наводящий страх лесной колдун или священный оракул богов — таким Ведунам отведена особая роль.\n\nУ некоторых Ведунов могут быть совсем небольшие или неприметные магические способности, уместные в низкомагическом сеттинге кампании.\n\nКак правило, класс Ведуна жизнеспособен лишь в сеттинге с малой магией или вовсе без неё, где даже его ограниченные способности — больше, чем доступно почти кому-либо ещё. Если в кампании существует обычная магия, Ведун может оказаться недостаточно привлекательным для игроков.\n\n#### Преимущества Ведуна\n\nВедун — частичный класс Эксперта, и брать его может только Авантюрист в паре с другим частичным классом. В целом он рассчитан на низкомагические кампании, но строго немагические его варианты сойдут и для сеттинга вовсе без магии.\n\nХотя для прочих целей Ведун считается частичным классом Эксперта, он не получает ни классовой способности частичного Эксперта «Схватывает на лету», ни бонусного небоевого Фокуса, который частичный Эксперт обычно получает на первом уровне. Однако Авантюрист, собранный как обычный частичный Эксперт/частичный Ведун, эти преимущества получает.\n\nКаждый Ведун получает уровень-0 в бонусном навыке, подходящем его образу, — будь то Молитва, Знание, Магия, Выживание или иной навык, осмысленный с точки зрения Мастера.\n\nВедуны не используют Усилие. Все их Искусства либо действуют постоянно, либо применяются при определённых обстоятельствах или определённое число раз в день.\n\nИскусства, которые осваивает Ведун, обычно жёстко заданы его образом и ролью. Обычный священник с ростом уровней будет выучивать одни Искусства, а ведьма или прорицающий оракул — другие. На некоторых уровнях у Ведуна может быть выбор: он берёт любое Искусство по своему желанию, но большинство Искусств можно взять лишь один раз.\n\nПримерные таблицы здесь дают схемы развития для немагического священника некой веры, ведьмы с малыми магическими способностями к порче и предвидению и оракула с ограниченным даром гадания. Мастер, желающий разрешить образы, придуманные игроками, может использовать колонку «Эзотерик» — или составить особую прогрессию вместе с игроком.\n\n**Частичный Эксперт/Ведун**\n\n| Уровень | Кости здоровья | Бонус атаки | Выборы Фокусов |\n|---|---|---|---|\n| 1 | 1d6 | +0 | 1 экспертский + 1 любой |\n| 2 | 2d6 | +1 | +1 любой |\n| 3 | 3d6 | +1 | – |\n| 4 | 4d6 | +2 | – |\n| 5 | 5d6 | +2 | +1 любой |\n| 6 | 6d6 | +3 | – |\n| 7 | 7d6 | +3 | +1 любой |\n| 8 | 8d6 | +4 | – |\n| 9 | 9d6 | +4 | – |\n| 10 | 10d6 | +5 | +1 любой |\n\n**Частичный Маг/Ведун**\n\n| Уровень | Кости здоровья | Бонус атаки | Выборы Фокусов |\n|---|---|---|---|\n| 1 | 1d6 | +0 | 1 любой |\n| 2 | 2d6 | +0 | +1 любой |\n| 3 | 3d6 | +0 | – |\n| 4 | 4d6 | +0 | – |\n| 5 | 5d6 | +1 | +1 любой |\n| 6 | 6d6 | +1 | – |\n| 7 | 7d6 | +1 | +1 любой |\n| 8 | 8d6 | +1 | – |\n| 9 | 9d6 | +1 | – |\n| 10 | 10d6 | +2 | +1 любой |\n\n**Частичный Воин/Ведун**\n\n| Уровень | Кости здоровья | Бонус атаки | Выборы Фокусов |\n|---|---|---|---|\n| 1 | 1d6+2 | +1 | 1 воинский + 1 любой |\n| 2 | 2d6+4 | +2 | +1 любой |\n| 3 | 3d6+6 | +2 | – |\n| 4 | 4d6+8 | +3 | – |\n| 5 | 5d6+10 | +4 | +1 любой |\n| 6 | 6d6+12 | +5 | – |\n| 7 | 7d6+14 | +5 | +1 любой |\n| 8 | 8d6+16 | +6 | – |\n| 9 | 9d6+18 | +6 | – |\n| 10 | 10d6+20 | +7 | +1 любой |\n\n**Примерные прогрессии Искусств для разных типов Ведунов**\n\n| Уровень | Обычный священник | Ведьма | Оракул | Эзотерик |\n|---|---|---|---|---|\n| 1 | Святость сана | Благоговейный трепет | Книжник или Свой человек | Любое Искусство |\n| 2 | Благоговейный трепет или Свой человек | Любая порча или благословение | Любое гадание | – |\n| 3 | – | – | – | Любое Искусство |\n| 4 | Умелый или Книжник | Целитель или любая порча или благословение | Любое гадание | – |\n| 5 | Личная неприкосновенность | Любое гадание | Любое гадание | Любое Искусство |\n| 6 | Связи в верхах или Свой человек | Умелый | Умелый или Связи в верхах | – |\n| 7 | – | – | – | Любое Искусство |\n| 8 | Любое общее Искусство | Любое гадание, порча или благословение | Умелый или Связи в верхах | – |\n| 9 | – | – | – | Любое Искусство |\n| 10 | Любое общее Искусство | Любая порча или благословение | Любое гадание | – |"},{"n":"1.5.19.1","l":4,"te":"Wise Arts","tr":"Искусства Ведуна","en":"General Arts\nDread Awe: Your kind are figures of fear and mistrust. Gain a +1 \nbonus on all skill checks related to intimidation or threat. You can \nspend a Main Action cursing your foes in battle; those who hear \nsuffer a -1 penalty to their next Morale check. You can do this only \nonce per scene.\nElite Ties: You have ties with figures of societal importance. You \ncan get audiences with them with minimal effort. Once per game \nsession, get a favor from them that would not particularly incon-\nvenience them to grant.\nErudite: You are uncommonly learned. Once per day, reroll a \nfailed skill check related to intellectual pursuits or things a scholar \nwould know about.\nFolk-Friend: Commoners and other lower-class natives consider \nyou a useful healer and helper. Once per day, get a modest favor \nfrom a commoner who doesn’t hate you in exchange for a blessing\nLevel\nHit Dice\n10d6\n+5\n+1 Any\nLevel\nHit Dice\n10d6\n+2\n+1 Any\nLevel\nHit Dice\n10d6+20\n+7\n+1 Any\nExample Art Progressions For Different Types of Wise\nDread Awe or Folk-Friend\nAny Curse or Blessing\nAny Divination\nSkilled or Erudite\nHealer or Any Curse or Blessing\nAny Divination\nElite Ties or Folk-Friend\nSkilled\nSkilled or Elite Ties\nAny General Art\nAny Divination or Curse or\nSkilled or Elite Ties\nBlessing\nAny General Art\nAny Curse or Blessing\nAny Divination\nLevel\nMundane Priest\nWitch\nSeer\nEsoteric\nHoly Sanctity\nDread Awe\nErudite or Folk-Friend\nAny Art\nAny Art\nPersonal Impunity\nAny Divination\nAny Divination\nAny Art\nAny Art\nAny Art\nor bit of advice.\nHealer: You are a trained and capable healer. Gain a +1 on all \nHeal skill checks; once per day, as an On Turn action, automatically \nsucceed at a skill check to stabilize a Mortally Wounded subject.\nHoly Sanctity: You are honored and respected by most in this re-\ngion. Gain a +1 bonus on social skill checks with locals who are not \nnaturally opposed to your religion or social institution.\nPersonal Impunity: You bear signs of sanctity, and physically harm-\ning you is considered taboo in this region. Only the most vicious or \ndesperate humans will initiate violence against you, though any will \nfight if you attack them. Hostile groups will hesitate to attack your \ncompanions unless provoked.\nSkilled: Gain three skill points to spend on any non-combat skills, \nup to the maximum skill level allowed by your character level. This \nart may be taken more than once.\nDivination Arts\nCompel Truth: The diviner compels a person to drink a particular \nbrew, participate in a specific ritual, or otherwise undergo a scene-\nlong ordeal. Afterwards, the diviner may ask the target a single ques-\ntion and the GM secretly rolls a Cha/Magic skill check against a \ndifficulty of the target’s Morale+1, or level+6 for PCs. On a success, \nthe subject must answer the question truthfully and fully. On a failure, \nthey may give any answer they wish. The same or substantially same \nquestion may not be asked twice with this art.\nDeliver Oracle: A petitioner asks about the outcome of a particular \ncourse of action. The diviner then spends a day in various rituals, \nseeking an oracular answer. At the end, the GM makes a secret Wis/\nMagic skill check. If the skill check beats difficulty 8, an oracular sen-\ntence with some truth in it is produced. If the skill check beats difficulty \n12, a direct and obvious oracle is produced. If the skill check is 7 or \nless, a hopelessly ambiguous oracle is produced, and if the dice roll \na natural 2 an intentionally misleading oracle is delivered. Oracles \nare usually delivered as metaphors, poetry, or visions. The GM should \nensure that some element of a true oracle actually does come to pass.\nFind Object: The diviner spends a scene performing a ritual to locate \na particular animal, object or type of substance known to them, be it \ngold, water, or a specific stolen cow. People cannot be found with this \nart. The GM makes a secret Wis/Magic skill check against a difficulty \nof 8 to 11, depending on how close the nearest suitable object is; \nsomething in the same village is 8, something a mile or more away is\n11, and something more than five miles away is undetectable. If the \ncheck is successful, the diviner gets an impression of the direction the \nobject is in. On a failure, roll 1d12 and use it as a clock face to give \na random direction. This art can be used once per day.\nRead Omens: A petitioner proposes a course of action to the PC. \nAfter a scene-long ritual involving at least 10 sp worth of livestock or\nsacrificial material, the GM makes a secret Wis/Magic skill check \nagainst difficulty 10. On a success, the PC gets an impression of \nwhether the course of action will lead to success or failure, as the \nGM thinks most likely. On a failure, the GM gives a random result. \nMultiplying the ritual costs by 10 adds +1 to the skill check, thus, a \nsacrifice of 1,000 sp worth of livestock gets a +2 on the check. The \nsame course of action cannot be divined more than once a month.\nCurses and Blessings\nThe bringing of fortune or ill fate is not a trivial thing. A given creature\ncan be cursed or blessed by one of these arts only once a day.\nAuspicious Undertaking: As a Main Action, bless a particular\nplan or undertaking currently sought by the target. During the plan’s \nexecution or while seeking the desired end, the blessed subject can \nreroll one failed skill check or one missed hit roll. The blessing lasts \nuntil it is used, the plan is finished, or one day per caster level has \npassed. Only one plan can be blessed at a time.\nEvil Eye: This art improves your curse and blessing arts. You can now \nuse these arts as an Instant action, albeit still only one such art per \nround, and you need do no more than look at the target rather than \nvocalizing any particular curse or blessing.\nIll Fate: As a Main Action, curse a visible target. You may specify \na particular kind of undertaking or apply the curse to anything they \nmay do. The next pertinent skill check they make is made at a -1 \npenalty. If their raw die roll is equal or less than the PC’s Magic skill \nplus one their effort goes disastrously wrong. The curse lasts until the \nnext relevant skill check.\nLuck Blessing: As a Main Action, confer a blessing on a visible target. \nThe next skill check they make that day will have a +1 bonus. Only\none luck blessing can be in place for a creature at a time.\nWar Curse: As a Main Action, curse a visible enemy. They suffer a \n-2 penalty to hit rolls, damage rolls, and Shock damage for the rest\nof the scene. If they miss an attack with a raw to-hit die roll less than \nthe Wise’s Magic skill, they accidentally hurt themselves for normal \ndamage. Only one war curse can be applied at a time.","ru":"##### Общие Искусства\n\n**Благоговейный трепет:** Такие, как ты, внушают страх и недоверие. Получи бонус +1 ко всем проверкам навыков, связанным с запугиванием и угрозами. В бою ты можешь потратить Основное действие на проклятия врагам; все, кто их слышит, получают штраф -1 к своей следующей проверке боевого духа. Так можно делать лишь раз за сцену.\n\n**Книжник:** Ты необычайно учён. Раз в день перебрасывай провальную проверку навыка, связанную с умственными занятиями или тем, в чём сведущ учёный.\n\n**Личная неприкосновенность:** На тебе знаки святости, и причинять тебе телесный вред в этих краях считается табу. Лишь самые злобные или отчаявшиеся люди первыми поднимут на тебя руку, хотя любой станет драться, если нападёшь ты сам. Враждебные группы не решатся напасть на твоих спутников, если их не спровоцировать.\n\n**Свой человек:** Простолюдины и прочий люд попроще считают тебя полезным лекарем и помощником. Раз в день получи скромную услугу от простолюдина, который не питает к тебе ненависти, в обмен на благословение или дельный совет.\n\n**Связи в верхах:** Ты связан с людьми, значимыми в обществе, и без особого труда добиваешься у них аудиенции. Раз за игровую сессию получи от них услугу, оказать которую им не слишком обременительно.\n\n**Святость сана:** В этих краях тебя почитает и уважает большинство. Получи бонус +1 к проверкам социальных навыков с местными жителями, у которых нет природной вражды к твоей религии или общественному институту.\n\n**Умелый:** Получи три пункта навыков и потрать их на любые небоевые навыки, не превышая максимального уровня навыка, разрешённого твоим уровнем персонажа. Это Искусство можно брать больше одного раза.\n\n**Целитель:** Ты обученный и умелый лекарь. Получи +1 ко всем проверкам навыка Медицина; раз в день Действием в свой ход автоматически преуспей в проверке навыка на стабилизацию смертельно раненного.\n\n##### Искусства гадания\n\n**Изречь пророчество:** Проситель спрашивает об исходе задуманного дела. Гадатель проводит день в разнообразных обрядах, ища пророческий ответ. В конце Мастер втайне делает проверку Мдр/Магия. Если проверка преодолевает сложность 8, рождается пророческая фраза, в которой есть доля истины. Если проверка преодолевает сложность 12, пророчество выходит прямым и ясным. Если результат 7 или меньше, пророчество получается безнадёжно двусмысленным, а если на костях выпала чистая 2, изрекается намеренно ложное пророчество. Пророчества обычно облекаются в метафоры, стихи или видения. Мастеру следует позаботиться, чтобы какая-то часть истинного пророчества действительно сбылась.\n\n**Отыскать пропажу:** Гадатель тратит сцену на обряд поиска известного ему животного, предмета или рода вещества — будь то золото, вода или конкретная украденная корова. Людей этим Искусством искать нельзя. Мастер втайне делает проверку Мдр/Магия против сложности от 8 до 11, в зависимости от того, насколько близко ближайший подходящий объект: что-то в той же деревне — 8, что-то в миле и дальше — 11, а что-то дальше пяти миль обнаружить нельзя. При успехе гадатель ощущает направление на объект. При провале брось 1d12 и опре
