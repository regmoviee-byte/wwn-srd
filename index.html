наряжением: базовые принципы работы с древним утилём одни во всех дисциплинах."},{"n":"2.8.1","l":3,"te":"Crafting Gear","tr":"Изготовление снаряжения","en":"An artisan requires a workshop that could plausibly build the gear in \nquestion. This may be nothing more than a sharp knife for a simple \ndevice, or a full-fledged alchemy lab for others. They also require \na plausible source of parts for the device. This is usually a given if \nin a city or other salvage-rich area, but it may not be practical in a \nwilderness.\nBuilding gear takes a month for a wagon-sized vehicle or a week \nfor a weapon, suit of armor, or other portable complex device. Very \nsimple devices may be built faster at the GM’s discretion.\nCrafted gear is made at three levels of quality. Jury-rigged gear \ntakes one-half the time to build and costs one-quarter the market \ncost in parts. If scrap salvage is available it can be built at no cost \nbut normal build times. As an improvised device, it counts as a mod \nrequiring Craft-0 to keep functional, as explained below in the mod \nmaintenance rules. If it goes 24 hours without maintenance, it stops \nfunctioning. Jury-rigged devices cannot be further modded.\nNormal devices cost the same amount in parts as the market cost \nand take the normal amount of time to build. They cannot be built with \nsalvaged parts unless the GM decides the salvage is perfectly suited \nfor it. Consumable devices such as torches must be crafted as normal \ndevices rather than jury-rigged or mastercrafted ones.\nMastercrafted devices cost ten times as much in parts as the usual \nmarket cost and take twice as long to build. They are ideal platforms \nfor an artisan’s mods, however, and the first mod their creator installs \nin them requires no maintenance. Mastercrafted weapons grant a +1 \nto hit. Mastercrafted armor counts as 1 fewer point of encumbrance, \ndown to a minimum of 1 point. This lightening does not affect the \narmor’s suitability for a user of the Armored Magic Focus.","ru":"Ремесленнику нужна мастерская, в которой правдоподобно можно построить нужное снаряжение. Для простого устройства это может быть всего лишь острый нож, для иных — полноценная алхимическая лаборатория. Нужен и правдоподобный источник деталей для устройства. В городе или другом богатом утилём месте это обычно само собой разумеется, а вот в дикой глуши может оказаться недостижимым.\n\nПостройка занимает месяц для машины размером с повозку и неделю для оружия, доспеха или другого переносного сложного устройства. Совсем простые вещи, на усмотрение Мастера, можно делать быстрее.\n\nИзготовленное снаряжение бывает трёх уровней качества. Снаряжение, собранное на скорую руку, требует половины времени постройки и четверти рыночной цены в деталях. Если под рукой есть бросовый утиль, его можно собрать вовсе бесплатно, но за обычное время. Как самоделка, оно считается модом, требующим Ремесло-0 для поддержания в рабочем состоянии, по правилам обслуживания модов ниже. Оставшись без обслуживания на 24 часа, оно перестаёт работать. Собранные на скорую руку устройства нельзя дополнительно модифицировать.\n\nОбычные устройства стоят в деталях столько же, сколько на рынке, и строятся обычное время. Их нельзя собирать из утиля, если только Мастер не решит, что утиль подходит идеально. Расходные предметы вроде факелов изготавливаются только как обычные устройства — ни на скорую руку, ни мастерски.\n\nМастерски изготовленные устройства стоят в деталях вдесятеро дороже обычной рыночной цены и строятся вдвое дольше. Зато они — идеальная платформа для модов ремесленника: первый мод, установленный в них создателем, не требует обслуживания. Мастерски изготовленное оружие даёт +1 к попаданию. Мастерски изготовленная броня считается на 1 пункт загруженности легче, но не ниже минимума в 1 пункт. Это облегчение не влияет на пригодность брони для носителя Фокуса «Магия в доспехах»."},{"n":"2.8.2","l":3,"te":"Modifying Gear","tr":"Модификация снаряжения","en":"Crafted or purchased gear can be modified by a skilled artisan. \nCrafting mods also requires a minimum Fix skill. Without this skill level \nthe tech cannot install the mod or maintain it afterwards.\nCrafting and installing mods has a cost in silver and sometimes \nin arcane salvage. The latter consists of rare monster parts, esoteric \nmaterials, and exotic components that cannot normally be bought on \nthe open market, but must be acquired by adventuring or in payment \nfrom patrons. Arcane salvage is generic in nature; a given piece can \nbe used in any mod that requires salvage.\nIt takes one week per minimum skill level of the mod to build and \ninstall it. Thus, if the mod requires Craft-1 skill, it takes one week. If the \nartisan has an assistant with at least Craft-0 skill, this time is halved. If \nthey do nothing but eat, sleep, and work, this time is further halved.","ru":"Изготовленное или купленное снаряжение может модифицировать умелый ремесленник. Для изготовления модов также нужен минимальный навык Ремесла. Без этого уровня навыка техник не может ни установить мод, ни обслуживать его потом.\n\nИзготовление и установка модов стоят серебра, а иногда и чародейного утиля. Последний состоит из редких частей чудовищ, эзотерических материалов и экзотических компонентов, которые обычно не купишь на открытом рынке: их добывают в приключениях или получают в уплату от покровителей. Чародейный утиль универсален: любой его кусок годится в любой мод, требующий утиля.\n\nПостройка и установка мода занимает одну неделю за каждый уровень его минимального навыка. Так, мод с требованием Ремесло-1 занимает одну неделю. Если у ремесленника есть помощник с навыком хотя бы Ремесло-0, время сокращается вдвое. Если он не делает ничего, кроме как ест, спит и работает, время сокращается вдвое ещё раз."},{"n":"2.8.3","l":3,"te":"Maintaining Mods","tr":"Обслуживание модов","en":"Mods normally require maintenance to keep functioning correctly, \nand a given artisan can maintain only so many mods at once. An arti-\nsan can only maintain mods they have the requisite skill levels to build.\nAn artisan’s maximum maintenance score is equal to the total of \ntheir Intelligence and Constitution modifiers plus three times their Craft \nskill level. Thus, a tech with a +1 Intelligence mod, a -1 Constitution\nmod and Craft-1 could maintain up to three mods at any one time.\nMaintenance is assumed to take place during downtime and does \nnot require any significantly expensive components. If an artisan does \nnothing but maintain mods, they can double their allowed number. \nSuch work assumes sixteen-hour workdays.\nIf a mod goes without maintenance for 24 hours, it stops working. If \nit goes without maintenance for a week, the item it’s attached to stops \nworking, becoming dangerous or ineffective to use. A maintenance \nbacklog on an item can be cleared by an hour’s work by an artisan \ncapable of maintaining it.","ru":"Моды обычно требуют обслуживания, чтобы работать исправно, и один ремесленник может обслуживать лишь ограниченное число модов сразу. Ремесленник может обслуживать только те моды, на постройку которых у него хватает уровней навыка.\n\nМаксимальный предел обслуживания ремесленника равен сумме его модификаторов Интеллекта и Телосложения плюс утроенный уровень навыка Ремесло. Так, техник с модификатором Интеллекта +1, модификатором Телосложения -1 и Ремеслом-1 может обслуживать до трёх модов одновременно.\n\nСчитается, что обслуживание идёт во время простоя и не требует сколько-нибудь дорогих компонентов. Если ремесленник не делает ничего, кроме обслуживания модов, он может удвоить их допустимое число. Такая работа предполагает шестнадцатичасовой рабочий день.\n\nЕсли мод остался без обслуживания на 24 часа, он перестаёт работать. Если без обслуживания прошла неделя, перестаёт работать сам предмет, к которому мод прикреплён: пользоваться им становится опасно или бесполезно. Накопившийся долг по обслуживанию предмета снимается часом работы ремесленника, способного его обслуживать."},{"n":"2.8.4","l":3,"te":"Example Modifications","tr":"Примеры модификаций","en":"The mods listed here are merely some of the possibilities for using \nancient salvage or large amounts of costly mundane materials. These \nmods are almost never available on the open market due to the rarity \nof usable salvage and the difficulty of maintaining the gear. Acquiring \nthe salvage needed to make them usually means finding it as part \nof an adventure, receiving it in payment from a patron, or setting out \non specific expeditions to find it.\nMultiple modifications can stack, but cannot increase a hit, AC, or \ndamage bonus above +3, or a skill check bonus above +1. Magical \nand masterwork weapons and armor can be modified, but mods \ncan’t improve them above this cap.\nArrow Storm (Craft-2): A bow or other projectile weapon automat-\nically generates its own ammunition, albeit the conjured projectiles \nvanish a round after firing. This mod does not increase reload speed. \nCost: One unit of salvage and 5,000 silver pieces.\nAssassin’s Trinket (Craft-2): A one-handed weapon is modified \nto adopt the shape of some item of jewelry or adornment. It can be \nshifted to or from this shape by the owner as an On Turn action. Cost: \nOne unit of salvage and 1,000 silver pieces.\nAugmented Gear (Craft-1): A tool, medical kit, or other item of \nequipment is improved for a specific purpose chosen at the time of \naugmentation. Skill checks made for that purpose gain a +1 skill bo-\nnus with the item. Cost: One unit of salvage and 5,000 silver pieces.\nAutomatic Reload (Craft-2): A hurlant can be modified to reload \nitself, if ammunition is available. Once per scene, a man-portable \nhurlant can be reloaded as an On Turn action. Cost: Two units of \nsalvage and 10,000 silver pieces.\nCustomized (Craft-1): The weapon or suit of armor has been care-\nfully tailored for a specific user. When used by them, they gain a +1 \nto hit with the weapon or +1 Armor Class with the armor. This mod \ndoesn’t work with shields. Cost: 1,000 silver pieces.\nFlying Razor (Craft-1): A throwing weapon is imbued with various \nesoteric materials, allowing it to return to the hand of its thrower after \neach attack. Cost: One unit of salvage and 5,000 silver pieces.\nHarmonized Aegis (Craft-3): A suit of armor is altered to harmonize \nwith the dangerous sorceries of allied casters. Provided the wearer \nand the caster have had ten minutes to coordinate the protection, the \nwearer is unharmed by the caster’s harmful spells for the rest of the \nday, even if caught in their area of effect. Cost: One unit of salvage \nand 10,000 silver pieces.\nLong Arm (Craft-2): A ranged or thrown weapon is modified to \ndouble its normal and maximum ranges. Cost: One unit of salvage \nand 5,000 silver pieces.\nManifold Mail (Craft-2): A suit of armor is augmented to allow it \nto shift its appearance to any of five or six pre-set choices, mimick-\ning normal clothing or other armor types as an On Turn action. The \narmor’s Encumbrance or other statistics are not altered. Cost: One\nunit of salvage, 5,000 silver pieces.\nOmened Aim (Craft-2): Occult components improve a ranged \nor thrown weapon’s targeting, adding +1 to hit rolls. Cost: 4,000 \nsilver pieces.\nPreserving Grace (Craft-1): A suit of clothing or armor is specially \naltered to preserve the wearer. Once per week, when the wearer is \nMortally Wounded, they will automatically stabilize. Cost: One unit \nof salvage and 5,000 silver pieces.\nRazor Edge (Craft-2): A weapon has been given an improved \nedge or shifting weight system, adding +2 to the damage and Shock \nit does, albeit requiring far more care. Cost: One unit of salvage and \n5,000 silver pieces.\nTailored Harness (Craft-2): A suit of armor is altered to perfectly fit \na single wearer, decreasing its effective Encumbrance by 1 for them \nonly. This does not affect skill check penalties or the Armored Magic \nFocus. Cost: 5,000 silver pieces.\nThirsting Blade (Craft-3): A weapon is imbued with a fated incli-\nnation to harm, adding +1 to hit rolls. Cost: Two units of salvage and \n10,000 silver pieces.","ru":"Перечисленные здесь моды — лишь часть возможностей, которые открывают древний утиль или большие объёмы дорогих обычных материалов. На открытом рынке этих модов почти не бывает: пригодный утиль редок, а поддерживать такое снаряжение трудно. Добыть утиль для них обычно значит найти его в приключении, получить в уплату от покровителя или отправиться за ним в отдельную экспедицию.\n\nНесколько модификаций складываются, но не могут поднять бонус к попаданию, КЗщ или урону выше +3, а бонус к проверкам навыка — выше +1. Магическое и мастерски изготовленное оружие и броню модифицировать можно, но моды не поднимут их выше этого предела.\n\n**Безделушка убийцы (Ремесло-2):** Одноручное оружие переделано так, чтобы принимать форму какого-нибудь украшения или убора. Владелец может обращать его в эту форму и обратно Действием в свой ход. Цена: одна единица утиля и 1 000 серебряных монет.\n\n**Бритвенная кромка (Ремесло-2):** Оружие получило улучшенную заточку или систему смещения веса: +2 к наносимым им урону и Шоку, но ухода оно требует куда более тщательного. Цена: одна единица утиля и 5 000 серебряных монет.\n\n**Вещий прицел (Ремесло-2):** Оккультные компоненты улучшают прицел стрелкового или метательного оружия: +1 к броскам на попадание. Цена: 4 000 серебряных монет.\n\n**Длинная рука (Ремесло-2):** Стрелковое или метательное оружие переделано так, что его обычная и максимальная дистанции удвоены. Цена: одна единица утиля и 5 000 серебряных монет.\n\n**Жаждущий клинок (Ремесло-3):** Оружие проникнуто роковой тягой к причинению вреда: +1 к броскам на попадание. Цена: две единицы утиля и 10 000 серебряных монет.\n\n**Индивидуальная подгонка (Ремесло-1):** Оружие или доспех тщательно подогнаны под конкретного пользователя. В его руках оружие даёт +1 к попаданию, а доспех — +1 к Классу защиты. Со щитами этот мод не работает. Цена: 1 000 серебряных монет.\n\n**Летучая бритва (Ремесло-1):** Метательное оружие насыщено разнообразными эзотерическими материалами и после каждой атаки возвращается в руку метнувшего. Цена: одна единица утиля и 5 000 серебряных монет.\n\n**Ливень стрел (Ремесло-2):** Лук или иное стрелковое оружие само порождает себе боеприпасы, хотя сотворённые снаряды исчезают через раунд после выстрела. Скорость перезарядки этот мод не повышает. Цена: одна единица утиля и 5 000 серебряных монет.\n\n**Многоликая броня (Ремесло-2):** Доспех дополнен так, что может Действием в свой ход менять облик на любой из пяти-шести заранее заданных вариантов, подражая обычной одежде или другим типам брони. Загруженность и прочие характеристики доспеха не меняются. Цена: одна единица утиля, 5 000 серебряных монет.\n\n**Подогнанная сбруя (Ремесло-2):** Доспех идеально подогнан под одного-единственного носителя: действующая Загруженность снижена на 1 — для него и только для него. На штрафы к проверкам навыков и Фокус «Магия в доспехах» это не влияет. Цена: 5 000 серебряных монет.\n\n**Самоперезарядка (Ремесло-2):** Болтомёт можно переделать так, чтобы он перезаряжался сам, пока есть боеприпасы. Раз за сцену переносной болтомёт можно перезарядить Действием в свой ход. Цена: две единицы утиля и 10 000 серебряных монет.\n\n**Согласованная эгида (Ремесло-3):** Доспех перестроен в лад с опасным чародейством союзных колдующих. Если носитель и колдующий потратили десять минут на согласование защиты, вредоносные заклинания этого колдующего до конца дня не причиняют носителю вреда — даже если он попал в их область действия. Цена: одна единица утиля и 10 000 серебряных монет.\n\n**Улучшенное снаряжение (Ремесло-1):** Инструмент, сумка лекаря или другой предмет снаряжения улучшен под конкретную задачу, выбранную в момент улучшения. Проверки навыка ради этой задачи получают с этим предметом бонус +1. Цена: одна единица утиля и 5 000 серебряных монет.\n\n**Хранящая благодать (Ремесло-1):** Одежда или доспех особым образом переделаны, чтобы беречь носителя. Раз в неделю, когда носитель становится смертельно раненным, он стабилизируется автоматически. Цена: одна единица утиля и 5 000 серебряных монет."},{"n":"2.9.0","l":2,"te":"Encumbrance","tr":"Загруженность","en":"Gear has encumbrance, measured in points, as exampled in the \ntable below. The more awkward or bulky the object, the greater the \nencumbrance. The GM adjudicates ambiguous objects.\nGear\t\n\t\n\t\n\t\n\t\nEncumbrance\nPortable in a small pocket\t \t\n\t\n0 (Any reasonable \t\n\t\n\t\n\t\n\t\nnumber can be carried)\nPortable in one hand\t\n\t\n\t\nRequires two hands to carry or use it\t\t\nRequires a whole-body effort to haul it\t\n5+\nDragging an unconscious teammate\t \t\nGear is either Stowed or Readied. Stowed gear is packed away \ncarefully in pockets, packs, and harnesses. It’s easier to carry but \nharder to quickly access. Using Stowed gear requires that the bear-\ner take a Main Action to pull it out before using it. Readied gear is \ncarried in hands, holsters, quick-access pockets, or other easily-ac-\ncessible places. It can be used as part of an action without any \nfurther preparation.\nA character can carry a total number of Stowed encumbrance \npoints equal to their Strength score. They can carry a number of \nReadied points equal to half their Strength, rounded down. Thus, a \nPC with a Strength score of 11 could carry 11 points of Stowed gear \nand 5 points of Readied.\nPCs can haul much heavier objects if necessary. If they push their \nlimits for longer terms, they can carry an additional two Ready and \nfour Stowed items. The first time they do this, their Move speed is cut \nby 30%, from 30 feet to 20 feet. The second time, it’s cut by 50%, \nfrom 20 feet to 10 feet. More weight than this can’t be practically \nhauled over significant distances.","ru":"У снаряжения есть загруженность, измеряемая в пунктах, как показано на примерах в таблице ниже. Чем неудобнее и громоздче предмет, тем выше загруженность. Спорные предметы оценивает Мастер.\n\n| Снаряжение | Загруженность |\n|---|---|\n| Помещается в небольшой карман | 0 (можно нести любое разумное количество) |\n| Можно нести в одной руке | 1 |\n| Нести или использовать нужно двумя руками | 2 |\n| Тащить приходится всем телом | 5+ |\n| Волочить союзника без сознания | 12 |\n\nСнаряжение находится либо в укладке, либо в готовности. Снаряжение в укладке аккуратно упаковано по карманам, заплечным мешкам и ремням: его легче нести, но труднее быстро достать. Чтобы применить предмет из укладки, носителю нужно сперва потратить Основное действие и вытащить его. Снаряжение в готовности носят в руках, кобурах, быстрых карманах и прочих легкодоступных местах. Его можно применить как часть действия без всякой дополнительной подготовки.\n\nПерсонаж может нести суммарно пункты загруженности в укладке, равные своему значению Силы, и пункты в готовности, равные половине Силы с округлением вниз. Так, ПИ с Силой 11 может нести 11 пунктов снаряжения в укладке и 5 пунктов в готовности.\n\nПри необходимости ПИ могут волочь куда более тяжёлые грузы. Работая на пределе подолгу, они могут нести дополнительно два предмета в готовности и четыре в укладке. В первый раз их скорость перемещения урезается на 30% — с 30 футов до 20. Во второй раз — на 50%, с 20 футов до 10. Больший вес на сколько-нибудь значимые расстояния практически не утащить."},{"n":"2.9.1","l":3,"te":"Bundled Gear","tr":"Комплекты снаряжения","en":"Small, regularly-shaped objects such as oil flasks, potion bottles, \nrations, and torches can be wrapped into bundles for easier porta-\nbility. Three such items can be tied into a bundle that only counts as \none item of encumbrance. Breaking into this bundle takes an extra \nMain Action, however.","ru":"Небольшие предметы правильной формы — фляги с маслом, бутылочки с зельями, пайки, факелы — можно увязывать в комплекты для удобства переноски. Три таких предмета связываются в комплект, который считается всего одним предметом загруженности. Однако чтобы вскрыть такой комплект, нужно дополнительное Основное действие."},{"n":"2.9.2","l":3,"te":"Bulk Weights","tr":"Вес по объёму","en":"Sometimes the PCs need to transport bulk amounts of goods that are \nmeasured in pounds. When it’s necessary to convert these weights \ninto encumbrance points, a GM can just assume that fifty pounds is \nworth about ten points of encumbrance to a PC hauling a pack out \non their back.\nWhen judging the ability of a vehicle to carry encumbrance points \nof cargo, it can be assumed that a wagon can carry as much as the \nPCs need it to carry, within reason.","ru":"Иногда ПИ нужно перевозить грузы, которые меряются фунтами. Когда нужно перевести эти веса в пункты загруженности, Мастер может просто считать, что пятьдесят фунтов — это около десяти пунктов загруженности для ПИ, тащащего тюк на спине.\n\nОценивая, сколько пунктов загруженности груза увезёт транспорт, можно считать, что повозка увозит столько, сколько нужно ПИ, — в разумных пределах."},{"n":"2.9.3","l":3,"te":"Games Without Encumbrance","tr":"Игра без Загруженности","en":"Not all groups like to track encumbrance or deal with the logistics of \nan adventuring expedition. If the GM so elects, then PCs can carry \nand Ready whatever amount of gear the GM thinks is reasonable. In \nsuch cases the GM should check over character sheets before each \nadventure to make sure reason is not outraged.","ru":"Не всем группам нравится отслеживать загруженность и возиться с логистикой экспедиции. Если Мастер так решил, ПИ могут носить и держать в готовности столько снаряжения, сколько Мастер сочтёт разумным. В таком случае Мастеру стоит проглядывать листы персонажей перед каждым приключением — чтобы здравый смысл не был поруган."},{"n":"2.10.0","l":2,"te":"Falling and Other Hazards","tr":"Падение и другие опасности","en":"Some perils occur with some regularity for adventurers. A few of the \nmost common are detailed here.\nFalling: Most creatures will take 1d6 damage per 10 full feet they \nfall, up to 20d6 maximum. Spikes or other hazardous terrain at the \nbottom will add at least 1d6 to the total. A creature that intentionally \nleaps or skids down in a controlled way may make a Dex or Str/Exert \nskill check at a difficulty of 7 + 1 for every 10 full feet; on a success, \nthe effective distance fallen is halved.\nSuffocation: Creatures can fight or act normally without air for one \nround per point of Constitution, or 10 rounds for most NPCs. If they \ndon’t move, they can quadruple this time. Once they run out of air, \nthey must make a Physical save each round or take 1 hit point of \ndamage per HD or level they have.\nPoisons: Typical dungeon poisons found crusted on needle traps \nforce a Physical save or a loss of half the victim’s maximum hit points. \nVery potent ones might kill a victim outright. Those who die due to \npoison damage usually take at least 1d6 minutes to actually expire, \nbut are helpless in the meanwhile. An antidote applied during this time \ncan revive them with 1 hit point. A skilled healer can try to counteract \nthe toxin with an Int/Heal skill check at a difficult of at least 10 for \nmost poisons, or 12 or more for truly fearsome ones.\nAside from any hit point damage a poison does, many also have \nlingering side effects, such as penalties to hit rolls or skill checks, or \nthe loss of Move actions for a certain period of time. Some also add \nSystem Strain to the victim due to the stress they put on their bodies. \nA victim forced above their maximum System Strain will collapse and \ndie in minutes if the poison is not neutralized.","ru":"Некоторые опасности случаются с искателями приключений с завидной регулярностью. Несколько самых частых разобраны здесь.\n\n**Падение:** Большинство существ получает 1d6 урона за каждые полные 10 футов падения, максимум до 20d6. Шипы или другой опасный рельеф внизу добавят к сумме как минимум 1d6. Существо, которое намеренно прыгает или съезжает вниз, контролируя спуск, может сделать проверку Лов или Сил/Атлетика со сложностью 7 + 1 за каждые полные 10 футов; при успехе действующая высота падения уполовинивается.\n\n**Удушье:** Существа могут драться и действовать без воздуха один раунд за каждый пункт Телосложения, или 10 раундов для большинства NPC. Если не двигаться, это время учетверяется. Когда воздух кончается, они каждый раунд должны делать Физический спасбросок — или получать 1 пункт урона за каждую свою КЗд или уровень.\n\n**Яды:** Типичные подземельные яды, засохшие коркой на игольчатых ловушках, требуют Физического спасброска — иначе жертва теряет половину максимума пунктов здоровья. Особо сильные могут убить на месте. Умирающие от яда обычно испускают дух не раньше чем через 1d6 минут и всё это время беспомощны. Противоядие, применённое за это время, возвращает их к жизни с 1 пунктом здоровья. Умелый лекарь может попытаться нейтрализовать токсин проверкой Инт/Медицина со сложностью не меньше 10 для большинства ядов и 12 и выше — для по-настоящему страшных.\n\nПомимо урона пунктам здоровья многие яды оставляют долгие побочные эффекты: штрафы к броскам на попадание или проверкам навыков, потерю Действий перемещения на какой-то срок. Некоторые ещё и добавляют жертве Системную нагрузку — так тяжело они бьют по телу. Жертва, выведенная за свой максимум Системной нагрузки, свалится и умрёт за считаные минуты, если яд не нейтрализовать."},{"n":"2.11.0","l":2,"te":"Overland Travel","tr":"Путешествие по суше","en":"PCs can generally travel for ten hours a day in most seasons, the rest \nbeing absorbed in rest, camp construction, and incidental activities. \nFor each hour of travel they can cross as many miles of a given terrain \nas listed in the table. This travel presumes that the PCs are moving \ndirectly toward their destination and not taking any particular time to \nscout the area for points of interest or investigate their surroundings. \nThis rate of travel also assumes average walking or wagon speeds; \nhorses can be used by their riders for quick bursts of speed to chase \nor avoid others, but don’t increase the average travel rate much.\nFor every day of travel and every night of camping outdoors, the \nGM rolls one die for a wandering encounter check. The die used \nwill depend on the terrain, with safer or more peaceful lands using a \nlarger die size. On a 1, the PCs come upon creatures or a situation \nthat requires their attention.\nAssuming it’s not an ambush or a sudden encounter in an obscured \narea, the groups usually encounter each other at maximum sight \nrange. An opposed Wis/Notice check can be used to determine \nwho spots who first; PCs who get the edge can usually avoid the \nother group automatically if they have sufficient cover.\nPCs traveling with a caravan or riding a well-stocked travel wagon \nneed not concern themselves with details of food, drink, and shelter, \nbut PCs who plan on making an overland expedition without these \nready comforts should consult the rules for overland exploration for \ndetails on the supplies and difficulties involved.","ru":"В большинство времён года ПИ могут идти по десять часов в день; остальное съедают отдых, обустройство лагеря и попутные дела. За каждый час пути они проходят столько миль данной местности, сколько указано в таблице. Подразумевается, что ПИ движутся прямо к цели, не тратя времени на поиск примечательных мест и изучение окрестностей. Темп рассчитан на среднюю скорость пешехода или повозки: всадники могут пришпоривать лошадей для коротких рывков — догнать кого-то или удрать, — но средней скорости пути это почти не прибавляет.\n\nЗа каждый день пути и каждую ночь лагеря под открытым небом Мастер бросает одну кость проверки случайной встречи. Какую кость — зависит от местности: чем безопаснее и мирнее земли, тем крупнее кость. На 1 ПИ натыкаются на существ или ситуацию, требующую их внимания.\n\nЕсли это не засада и не внезапная встреча в закрытой местности, группы обычно замечают друг друга на максимальной дистанции видимости. Кто кого заметил первым, можно определить встречной проверкой Мдр/Внимание; ПИ, взявшие верх, обычно могут автоматически разминуться с другой группой, если укрытий достаточно.\n\nПИ, путешествующим с караваном или на хорошо снаряжённой дорожной повозке, незачем заботиться о еде, питье и крове, но тем, кто собирается в сухопутную экспедицию без этих готовых удобств, стоит свериться с правилами исследования дикого края — там расписаны нужные припасы и сопутствующие трудности.\n\n| Тип местности | Мили в час |\n|---|---|\n| Равнины и саванны | 3 |\n| Редкий лес или пустыня | 2 |\n| Густой лес или изрезанные холмы | 1,5 |\n| Болото или топь | 1 |\n| Горы или гиблые пустоши | 0,5 |\n| Через местность идёт дорога | ×2* |\n| Скверная погода, грязь или сильный дождь | ×0,5 |\n| Глубокий снег | ×0,1 |\n\n*: Хорошие дороги не могут поднять маршевую скорость отряда выше трёх миль в час."},{"n":"2.11.1","l":3,"te":"Sea Travel","tr":"Морское плавание","en":"A ship can usually manage about six miles an hour of travel when \nunder sail, and can sail around the clock if far from coasts and other \nperils. Oar-powered galleys average the same speed, but are heed-\nless of the winds. An ordinary crew can only row for eight hours a \nday, however.\nEncounters at sea are rarer but potentially more hazardous; the \nGM should roll daily and nightly checks on 1d10 or 1d12. On a 1, \nsome creature has come across the ship, a troublesome wind or storm \nhas sprung up, something has been damaged on the ship or gone \nawry with the crew, or otherwise complicated the vessel’s journey. \nSome such encounters can be overcome with a good plan and a \ndecent Sail skill check, while others may require bloodier answers.\nTerrain Type\nMiles per Hour\nPlains or savannas\nLight forest or desert\nDense forest or rugged hills\n1.5\nSwamp or marsh\nMountains or dire wastelands\n0.5\nThere is a road through the terrain\nx2*\nFoul weather, mud, or heavy rain\nx0.5\nDeep snow on the ground\nx0.1\n* Good roads cannot increase the party’s marching speed above \nthree miles per hour.\nPack Animal and Porter Loads\nSituations That Cause Privation\nSupply Encumbrances","ru":"Под парусом корабль обычно делает около шести миль в час и вдали от берегов и прочих опасностей может идти круглые сутки. Гребные галеры в среднем так же быстры и не зависят от ветра, но обычная команда может грести лишь восемь часов в день.\n\nВстречи на море реже, но потенциально опаснее; Мастеру стоит бросать дневные и ночные проверки на 1d10 или 1d12. На 1 на корабль набрело какое-то существо, поднялся зловредный ветер или шторм, что-то сломалось на судне, стряслось с командой — или плавание осложнилось ещё как-нибудь. Часть таких встреч преодолевается хорошим планом и приличной проверкой навыка Мореходство; другие могут потребовать более кровавых ответов."},{"n":"2.12.0","l":2,"te":"Wilderness Exploration and Expeditions","tr":"Исследование дикого края и экспедиции","en":"These rules assume the PCs are exploring or venturing through a hex-\nmapped wilderness area, one without safe waystations or reliable \nmaps.","ru":"Эти правила предполагают, что ПИ исследуют размеченную гексами дикую местность или пробираются через неё — без безопасных путевых станций и надёжных карт."},{"n":"2.12.1","l":3,"te":"Exploring a Hex","tr":"Исследование гекса","en":"To lightly explore a standard six-mile hex for points of interest takes\na full day of scouting. If the terrain is especially rugged or conceal-\ning, such as a range of mountains or trackless swamp, this time is \ndoubled or tripled.\nThis much time is sufficient to find most major points of interest that \nthe GM may have placed in the hex. It won’t necessarily catch small \nfeatures or provide a detailed survey of the terrain.","ru":"Чтобы бегло осмотреть стандартный шестимильный гекс в поисках примечательных мест, нужен полный день разведки. Если местность особенно труднопроходима или скрытна — горная гряда, бездорожная топь, — это время удваивается или утраивается.\n\nТакого срока хватает, чтобы найти большинство главных примечательных мест, которые Мастер разместил в гексе. Мелкие особенности он не обязательно выловит, и подробной съёмки местности не даст."},{"n":"2.12.2","l":3,"te":"Supplies for an Expedition","tr":"Припасы для экспедиции","en":"When venturing into the untamed wilderness, a group is going to need \ncertain supplies. Fire, water, shelter, and food are the four most critical. \nIn some places, some of these supplies may be easily acquired along \nthe way, such as fresh water from a river the PCs are following, or \nshelter when the climate is warm and pleasant around the clock, but \nusually some kind of provision will need to be made for getting them.\nFood is measured in days of food per person. Each day’s needed \nfood counts as one item of encumbrance, though they can be packed \nsnugly together as weekly rations that count as four items instead. \nSome magical items or Mages might be able to create food; a party \nwho relies entirely on such things had best hope nothing happens to \ntheir literal meal ticket.\nWater is also measured in days of water per person, each unit \ncounting as one item of encumbrance. Exceptionally hot or dry cli-\nmates may require multiples of this to avoid dehydration or over-\nheating.\nShelter means adequate clothing for the climate and some kind of \ntent or lean-to to protect from the elements while resting. Characters \nwith Survival-0 can put together a minimal lean-to of boughs and \nbranches in wooded areas, but in places of torrential rain, fierce \nsnows, or other extreme conditions it may prove more difficult. Lack \nof shelter can make it impossible to rest comfortably and regain Effort, \nHP, or spells. Severe privation can even threaten a PC’s life.\nFire means fuel sufficient to cook food, dry wet clothes, and warm \nPCs after they’ve stopped moving for the day. In most places it’s easy \nenough for even the least wood-wise PC to scavenge enough dry \nwood or twigs to get a minimally sufficient fire going, but voyages \ninto a land devoid of woody vegetation can mean trouble. A load of \ndung cakes, charcoal, or other fuel sufficient to keep a group warm \nfor an ordinary night counts as four items of encumbrance.\nType\nEnc\nOne day of food or water\nOne week of carefully-packed food\nOne night’s load of fire fuel\nOne day’s fodder for a horse or large beast\nOne day’s fodder for a mule or small beast\nDaily water for a large beast\nDaily water for a small beast","ru":"Отправляясь в неукрощённую глушь, группе понадобятся определённые припасы. Огонь, вода, кров и еда — четыре самых насущных. Кое-где часть из них легко добывается по дороге — свежая вода из реки, вдоль которой идут ПИ, или кров, когда климат круглые сутки тёплый и ласковый, — но обычно о них приходится позаботиться заранее.\n\nЕда меряется днями еды на человека. Дневная порция еды считается одним предметом загруженности, но её можно плотно увязать в недельные пайки, которые считаются четырьмя предметами. Некоторые магические предметы и Маги умеют творить еду; группе, которая полностью на это полагается, лучше надеяться, что с их кормильцем — в самом буквальном смысле — ничего не случится.\n\nВода тоже меряется днями воды на человека, и каждая единица считается одним предметом загруженности. В исключительно жарком или сухом климате может понадобиться кратно больше, чтобы не страдать от обезвоживания и перегрева.\n\nКров — это одежда по климату и какая-нибудь палатка или навес, защищающие от стихий на отдыхе. Персонажи с Выживанием-0 могут соорудить простейший навес из веток и лапника в лесистой местности, но там, где хлещут ливни, свирепствуют снегопады или другие крайности, это может оказаться труднее. Без крова бывает невозможно нормально отдохнуть и восстановить Усилие, ПЗ или заклинания. Суровые лишения могут и вовсе угрожать жизни ПИ.\n\nОгонь — это топливо, которого хватит приготовить еду, высушить мокрую одежду и согреть ПИ после дневного перехода. В большинстве мест даже самый далёкий от леса ПИ легко наберёт сухих дров и веток на минимально пристойный костёр, но поход по земле, лишённой древесной растительности, сулит трудности. Запас кизяка, угля или иного топлива, которого хватит греть группу обычную ночь, считается четырьмя предметами загруженности.\n\n**Загруженность припасов**\n\n| Тип | Загр. |\n|---|---|\n| День еды или воды | 1 |\n| Неделя плотно упакованной еды | 4 |\n| Топливо для костра на одну ночь | 4 |\n| Дневной фураж для лошади или крупного животного | 4 |\n| Дневной фураж для мула или мелкого животного | 2 |\n| Дневная вода для крупного животного | 8 |\n| Дневная вода для мелкого животного | 4 |"},{"n":"2.12.3","l":3,"te":"Pack Animals and Porters","tr":"Вьючные животные и носильщики","en":"Pack beasts can carry a certain amount of items of encumbrance, \nassuming they’re packed carefully. Professional porters are also \ncommon hires for adventurers, though they generally refuse to enter \ndangerous ruins.\nMost beasts can survive on nightly browse and brief water stops \nfor the duration of an expedition. In barren lands, food and water \nmust be packed in for the beasts as well as the humans.\nDuring combat, porters will hide or fight as normal humans to de-\nfend their lives. Pack beasts might panic if not calmed by a handler’s \nsuccessful Cha/Ride skill check made as a Move action, usually \nagainst a difficulty of 8 or more. Carters, nomad riders, and other \nprofessional stock handlers always succeed at these calming checks \nbarring the most unusual circumstances.\nAt need, a healthy horse can be butchered into 30 days of rations, \nand a mule or similar-sized beast into 15 days. Preserving this meat \ntakes time and fire, as explained in the Foraging section.\nType\nEnc\nRiding horse or warhorse, with laden rider\nRiding horse or warhorse, pack only\nHeavy pack horse\nMule or donkey\nProfessional porter\nTwo porters carrying a shared litter","ru":"Вьючные животные могут нести определённое число предметов загруженности — при аккуратной укладке. Профессиональные носильщики — тоже обычный найм для искателей приключений, но в опасные руины они, как правило, идти отказываются.\n\nБольшинство животных всю экспедицию продержится на ночном подножном корме и коротких водопоях. В бесплодных землях еду и воду придётся везти не только для людей, но и для животных.\n\nВ бою носильщики прячутся или дерутся как обычные люди, защищая свою жизнь. Вьючные животные могут запаниковать, если их не успокоит погонщик успешной проверкой Хар/Верховая езда, сделанной Действием перемещения, обычно против сложности 8 и выше. Возчики, кочевники-наездники и прочие профессионалы при скотине проходят эти успокаивающие проверки всегда — кроме самых необычайных обстоятельств.\n\nПри нужде здоровую лошадь можно разделать на 30 дней пайков, а мула или животное схожего размера — на 15. Заготовка этого мяса требует времени и огня, как описано в разделе о добыче пропитания.\n\n**Грузы вьючных животных и носильщиков**\n\n| Тип | Загр. |\n|---|---|\n| Верховая или боевая лошадь с гружёным всадником | 5 |\n| Верховая или боевая лошадь, только вьюк | 20 |\n| Тяжёлая вьючная лошадь | 30 |\n| Мул или осёл | 15 |\n| Профессиональный носильщик | 12 |\n| Двое носильщиков с общими носилками | 30 |"},{"n":"2.12.4","l":3,"te":"Starving, Thirsting, and Freezing","tr":"Голод, жажда и холод","en":"If the PCs don’t have enough food, water, warmth, or shelter, bad \nthings will start to happen. Each day without these necessities will \napply the following penalties.\nSystem Strain is gained. If this would put the PC over their max-\nimum, they must make a Physical save or die by dawn if not aided. \nOn a success, they’re helpless until death or rescue.\nThey can’t recover System Strain, gain nightly hit point healing, \nrefresh daily Committed Effort, or restore expended spells until they’ve \nhad a day of proper food, water, and warm sleep.\nCircumstance\nSys. Str.\nFirst day without enough food*\n+0\nConsecutive day without food\n+1\nFirst day without enough water\n+2\nConsecutive day without water\n+3\nNight without adequate shelter or fire*\n+0\nHarsh night without shelter or fire\n+1\n* No System Strain is yet gained, but the PC still suffers privation \nand cannot recover lost resources.\nThe precise nature of a Wandering Encounter will depend on \nthe terrain and the GM’s preparations. These encounters fit the \nlogic of the situation, not the levels of the PCs, so a swift retreat \nmay be in order.\nNot all Wandering Encounters are hostile or involve combat, \nhowever. A pompous noble might be clearing rabble off the road \nin front of him, or a woodsman might be found with a broken leg, \nor the bandit crew might be carousing and willing to have visitors \njoin in. In general, they’re simply situations, creatures, or events that \nthe PCs will need to react to.\nForaging\nWandering Encounter Checks\nType of Terrain\nChance\nDangerous wilderness area\n1 in 6\nArea of civil unrest or heavy banditry\n1 in 6\nOrdinary trade road\n1 in 8\nWell-policed trade road\n1 in 10\nBorderlands or rural back country\n1 in 8\nOrdinary wilderness\n1 in 8","ru":"Если ПИ не хватает еды, воды, тепла или крова, начнётся дурное. Каждый день без этих необходимых вещей влечёт следующие последствия.\n\nРастёт Системная нагрузка. Если она превысила бы максимум ПИ, он должен сделать Физический спасбросок — или умереть к рассвету, если не получит помощи. При успехе он беспомощен до самой смерти или до спасения.\n\nОн не может восстанавливать Системную нагрузку, получать ночное исцеление пунктов здоровья, обновлять задействованное на день Усилие и восстанавливать потраченные заклинания, пока не проведёт день с нормальной едой, водой и тёплым сном.\n\n**Ситуации, вызывающие лишения**\n\n| Обстоятельство | СН |\n|---|---|\n| Первый день без достатка еды* | +0 |\n| Каждый следующий день без еды | +1 |\n| Первый день без достатка воды | +2 |\n| Каждый следующий день без воды | +3 |\n| Ночь без пристойного крова или огня* | +0 |\n| Суровая ночь без крова и огня | +1 |\n\n*: Системная нагрузка ещё не растёт, но ПИ уже страдает от лишений и не может восстанавливать потраченные ресурсы."},{"n":"2.12.5","l":3,"te":"Foraging","tr":"Добыча пропитания","en":"PCs who find themselves low on supplies or lacking a particular re-\nsource can take time to forage the surrounding terrain. It’s assumed \nthe group sticks together during this process, sacrificing efficiency \nfor security. They can split up if desired, but each group then risks \nencounters.\nSome supplies can be gathered as normal parts of travel. If \npassing through ordinary, non-arid, non-barren terrain it’s assumed \nthe PCs can refill their waterskins and scrounge firewood whenever \nthey wish.\nForaging requires either a half-day or a full day of effort. The \ngroup’s most apt member makes a Wis/Survive check against the \ndifficulty listed on the table, and on a success earns 1d6 units of \nforage plus the sum of the group’s Survive skill levels, to a maximum \nof 10. Those without the skill at all subtract 1 from the total, to a \nminimum of one unit found by the group.\nEach forage unit is worth either a day of food for a person, a \nday of water for a person, or a night’s firewood for the party, and \nthe group can decide how much of each was found after the roll \nis made. PCs who are barbarians or other natives of the wilds \nnormally never find less than two units of forage barring extreme \ncircumstances.\nForaged food is unpreserved and will spoil in three days. Smok-\ning or drying it requires use of a day’s worth of firewood and a half-\nday’s labor. Any reasonable amount of forage can be preserved \nwith a single half-day’s work.\nType of Foraged Terrain\nDiff\nWoodlands or areas of heavy vegetation\nMountains, scrublands, savannas\nDeserts, badlands, or normal barrens\nGrim wastes or barely human-survivable lands\nA full day foraging rather than a half-day\n-2\nEach successive day foraging the same hex\n+1\nOn success, 1d6 units of forage are found, plus the total Survive \nskills of the foragers. Those without even level-0 skill in it subtract \n1 from the total found.","ru":"ПИ, у которых кончаются припасы или недостаёт какого-то ресурса, могут потратить время и обшарить окрестности. Считается, что группа при этом держится вместе, жертвуя эффективностью ради безопасности. При желании можно разделиться, но тогда каждая группа рискует нарваться на встречу отдельно.\n\nЧасть припасов добывается прямо по ходу пути. В обычной, не засушливой и не бесплодной местности считается, что ПИ могут наполнять бурдюки и подбирать хворост, когда пожелают.\n\nДобыча пропитания требует полдня или полного дня трудов. Самый способный член группы делает проверку Мдр/Выживание против сложности из таблицы и при успехе добывает 1d6 единиц добычи плюс сумма уровней навыка Выживание всей группы, максимум до 10. Те, у кого навыка нет вовсе, вычитают из суммы 1, но группа всегда находит хотя бы одну единицу.\n\nКаждая единица добычи — это либо день еды на человека, либо день воды на человека, либо дрова на ночь для всей группы; чем именно она обернулась, группа решает после броска. ПИ-варвары и прочие уроженцы дикого края в обычных условиях никогда не находят меньше двух единиц добычи — кроме самых крайних обстоятельств.\n\nДобытая еда не заготовлена и испортится за три дня. Копчение или сушка требуют дневного запаса дров и полудня труда. За один полдень работы можно заготовить любое разумное количество добычи.\n\n**Добыча пропитания**\n\n| Тип обшариваемой местности | Слож. |\n|---|---|\n| Леса и места с густой растительностью | 8 |\n| Горы, кустарниковые степи, саванны | 9 |\n| Пустыни, бедленды и обычные бесплодные земли | 12 |\n| Мрачные пустоши и земли, где человеку едва выжить | 14 |\n| Полный день добычи вместо полудня | -2 |\n| Каждый следующий день добычи в том же гексе | +1 |\n\nПри успехе находится 1d6 единиц добычи плюс сумма навыков Выживание добытчиков. Те, у кого нет даже уровня-0, вычитают 1 из найденного."},{"n":"2.12.6","l":3,"te":"Wandering Encounters","tr":"Случайные встречи","en":"PCs risk encountering trouble in their expeditions. Every so often, \na Wandering Encounter check die should be rolled by the GM, \nwith example probabilities on the table below. If the GM rolls a 1, \nsomething comes up. A GM should roll an encounter check…\n•\t\nOnce per day of travel and once per night of camping \noutdoors. Such encounters will commence at the terrain’s usual \nmaximum sight range, with a Wis/Notice opposed check to see \nwho first spotted who.\n•\t\nOnce per foraging attempt. Whether a half-day or a full \nday, one check is made per attempt, per foraging group. If the \ngroup forages all day instead of traveling, the daily travel check \nabove is omitted.\nwhere perils could spring up at any moment. They’re not meant for \ncasual exploration of some bosky glade or city street, and in such \ncases the PC actions can just be followed scene-by-scene as usual.\nIt’s important that GMs understand the purpose of the Wandering \nEncounter checks in a site. They’re intended to put constant pressure \non the party to get in, accomplish their purpose, and get out before \nthey’re worn down by encounters. Not all Wandering Encounters \nare hostile, but each is a risk of pointless fighting or sudden alarm.\nthis turn.","ru":"В экспедициях ПИ рискуют нарваться на неприятности. Время от времени Мастер должен бросать кость проверки случайной встречи; примерные вероятности — в таблице ниже. Если у Мастера выпала 1, что-то случилось. Проверку встречи стоит бросать…\n\n- Раз за день пути и раз за ночь лагеря под открытым небом. Такие встречи начинаются на обычной для этой местности максимальной дистанции видимости, со встречной проверкой Мдр/Внимание — кто кого заметил первым.\n- Раз за попытку добычи пропитания. Полдня она заняла или полный день — одна проверка на попытку, на каждую группу добытчиков. Если группа весь день добывает пропитание, а не идёт, дневная дорожная проверка выше не делается.\n\nЧто именно это за случайная встреча, зависит от местности и заготовок Мастера. Такие встречи подчиняются логике ситуации, а не уровням ПИ, так что порой уместно быстрое отступление.\n\nВпрочем, не все случайные встречи враждебны и не все ведут к бою. Напыщенный вельможа может разгонять чернь с дороги перед собой, лесоруб — лежать со сломанной ногой, а разбойничья ватага — гулять и радоваться гостям. В общем случае это просто ситуации, существа или события, на которые ПИ придётся отреагировать.\n\n**Проверки случайных встреч**\n\n| Тип местности | Шанс |\n|---|---|\n| Опасная дикая местность | 1 из 6 |\n| Край гражданской смуты или разгула разбоя | 1 из 6 |\n| Обычный торговый тракт | 1 из 8 |\n| Хорошо охраняемый торговый тракт | 1 из 10 |\n| Пограничье или сельская глубинка | 1 из 8 |\n| Обычная дикая местность | 1 из 8 |"},{"n":"2.13.0","l":2,"te":"Dungeon Exploration","tr":"Исследование подземелья","en":"These rules are meant for tracking adventures in a dangerous site","ru":"Эти правила предназначены для отслеживания приключений в опасном месте, где угроза может возникнуть в любой миг. Они не для праздных прогулок по тенистой роще или городской улице — там действия ПИ можно, как обычно, вести сцена за сценой. Мастеру важно понимать назначение проверок случайных встреч в таком месте: они должны постоянно давить на отряд, заставляя войти, сделать дело и уйти, пока встречи не измотали его. Не всякая случайная встреча враждебна, но каждая — риск бессмысленной драки или внезапной тревоги."},{"n":"2.13.1","l":3,"te":"The Order of Play","tr":"Порядок игры","en":"At the start of each turn after the party enters the site:\n•\t\nRoll a secret Wandering Encounter check if necessary. \nOn a 1, the encounter will happen at some appropriate moment\n•\t\nThe PCs decide what they want to do this turn, be it move \ninto a new room, carefully search their current location, fiddle with \nsome object they’ve found, or something else that takes ten minutes.\n•\t\nTell them the result of their actions, whether that’s a first-\nglance description of a new room, notice of the hideous abomination \nthat’s rearing up before them, or the explosive detonation of the \ncrystal they just experimentally rapped.\n•\t\nStart over from the top, assuming their actions have con-\nsumed a full turn, until they withdraw from the site or it becomes safe \nenough to stop counting turns.","ru":"В начале каждого хода после того, как отряд вошёл в опасное место:\n\n- Если нужно, Мастер тайно бросает проверку случайной встречи. На 1 встреча произойдёт в какой-нибудь подходящий момент этого хода.\n- ПИ решают, что хотят делать в этот ход: перейти в новое помещение, тщательно обыскать текущее, повозиться с найденной вещью — или заняться чем-то ещё, что занимает десять минут.\n- Мастер сообщает им результат действий — будь то описание нового помещения с первого взгляда, весть о мерзкой твари, что вздыбилась перед ними, или взрыв кристалла, по которому они только что постучали для пробы.\n- Всё повторяется с начала — считая, что действия заняли полный ход, — пока отряд не покинет это место или не станет достаточно безопасно, чтобы перестать считать ходы."},{"n":"2.13.2","l":3,"te":"Timekeeping in the Dungeon","tr":"Счёт времени в подземелье","en":"Once the heroes intrude on a ruin, dungeon, corrupt noble’s mansion, \nor other dangerous site the GM starts tracking time in turns. Each turn \ncounts as about ten minutes or one scene. Members of the party can \ngenerally do one significant thing per turn. Different party members \ncan be doing different things in the same turn.\nThe point of tracking turns isn’t to have a minute-by-minute tally \nof PC activities, but to have a rough measure of how much activity \nthey’re engaging in within the ruin. The more they do and the longer \nthey stay, the more likely that they’ll run into Wandering Encounters \nor the natives will have time to realize that intruders are present. \nEventually, the PCs need to either pull back or clear the site entirely \nof its dangerous inhabitants.\nActivity\nTurns\nWhen to Roll an Encounter Check\nMove from one room of interest to another\nPick a lock or disarm a trap\nGet in a fight with something\nPerform first aid and looting after a fight\nSearch a room carefully\nJury-rig something or work a device\nTime a torch lasts until burning out\nTime a filled lantern lasts before burning out","ru":"Едва герои вторгаются в руины, подземелье, особняк продажного вельможи или другое опасное место, Мастер начинает считать время ходами. Каждый ход — это около десяти минут или одна сцена. Каждый член отряда за ход обычно успевает одно значимое дело. Разные члены отряда в один и тот же ход могут заниматься разными делами.\n\nСмысл счёта ходов не в поминутной описи занятий ПИ, а в грубой мере того, сколько всего они делают в руинах. Чем больше они делают и чем дольше остаются, тем вероятнее случайные встречи и тем скорее местные обитатели сообразят, что в доме чужие. Рано или поздно ПИ придётся либо отойти, либо вычистить место от опасных обитателей целиком.\n\n**Примерные затраты времени в ходах**\n\n| Занятие | Ходы |\n|---|---|\n| Перейти из одного примечательного помещения в другое | 1 |\n| Вскрыть замок или обезвредить ловушку | 1 |\n| Подраться с кем-нибудь | 1 |\n| Оказать первую помощь и обобрать павших после боя | 1 |\n| Тщательно обыскать помещение | 1 |\n| Соорудить что-то на скорую руку или совладать с устройством | 1 |\n| Время, за которое догорает факел | 6 |\n| Время, за которое выгорает заправленный фонарь | 24 |"},{"n":"2.13.3","l":3,"te":"Movement and Fleeing","tr":"Перемещение и бегство","en":"In simple diagrammatic ruins consisting of points of interest, movement \nfrom one point to another takes one turn. Otherwise, travel is at the \nrate of 120’ per turn, reflecting the party sneaking, listening, mapping, \nand carefully examining their surroundings as they go.\nIf forced to flee, the party needs to decide how exactly they’re \nretreating and what measures they’re using to slow or dissuade pur-\nsuers. Some discouragements may be enough to work without a roll.\nIf their foes are determined, the party uses the chase rules given \nin the rules section of this document. When fleeing madly, the party \nshould not be allowed to reference their maps; the GM just calls out \nintersections and doors until the party escapes, the foes give up, or \nthe enemies catch them.\nOn a successful evasion, the PCs eventually outpace or lose their \npursuers. On a failure, they’re caught somewhere along their escape \nroute. A successful escape usually takes up one turn worth of time and \nleaves the PCs in whatever location they’re in when the pursuit stops.","ru":"В простых схематичных руинах, состоящих из примечательных точек, переход от одной точки к другой занимает один ход. В остальных случаях отряд движется со скоростью 120 футов за ход: он крадётся, прислушивается, наносит путь на карту и внимательно осматривается по дороге.\n\nЕсли отряд вынужден бежать, ему нужно решить, как именно он отступает и какими средствами замедляет или отваживает преследователей. Некоторые препятствия могут сработать и без броска.\n\nЕсли враги настроены решительно, отряд использует правила погонь из раздела правил этого документа. При паническом бегстве отряду нельзя сверяться со своими картами: Мастер просто выкрикивает перекрёстки и двери, пока отряд не спасётся, враги не отстанут или беглецов не догонят.\n\nПри успешном уходе ПИ в конце концов обгоняют преследователей или отрываются от них. При провале их настигают где-то на пути отступления. Успешный побег обычно съедает один ход времени и оставляет ПИ там, где они оказались, когда погоня прекратилась."},{"n":"2.13.4","l":3,"te":"Encounters and Surprise","tr":"Встречи и внезапность","en":"Usually, PCs are sufficiently alert when exploring a site to avoid \nany chance of surprise, barring a set ambush. If they burst in on the \nnatives suddenly, however, the locals might be too stunned to act \nfor a round. If the GM thinks this is possible, give it X-out-of-6 odds.\nIf the PCs run into a Wandering Encounter in a room, the creatures \nwill enter through one of the available entrances. In the corridors \noutside, they’re usually 1d8 x 10 feet away when first spotted or \nheard, assuming there’s enough space for such a distance.\nRemember to make a reaction roll when PCs encounter creatures. \nNot every group of dungeon denizens will immediately lunge for \ntheir weapons.\nUsually, there’s a brief, tense moment of recognition when the PCs \nencounter creatures, just enough time for a reaction roll and a chance \nto size up the odds of diplomacy. The GM should always give the \nPCs a chance to parley or run when encountering creatures unless \nthe situation makes that completely impractical.","ru":"Обычно ПИ, исследуя опасное место, достаточно бдительны, чтобы исключить всякую внезапность, кроме подготовленной засады. А вот если они сами внезапно вламываются к местным, те могут на раунд оцепенеть от неожиданности. Если Мастер считает это возможным, пусть назначит шанс X из 6. Если ПИ натыкаются на случайную встречу в помещении, существа входят через один из имеющихся входов. В коридорах снаружи их обычно впервые замечают или слышат в 1d8 × 10 футах — если места хватает для такой дистанции.\n\nСтоит помнить о проверке реакции, когда ПИ встречают существ. Не всякая компания обитателей подземелья сразу хватается за оружие.\n\nОбычно встреча ПИ с существами начинается с короткого напряжённого мгновения узнавания — как раз хватает на проверку реакции и на то, чтобы прикинуть шансы дипломатии. Мастеру следует всегда давать ПИ шанс вступить в переговоры или сбежать при встрече с существами, если только ситуация не делает это совершенно невозможным."},{"n":"2.13.5","l":3,"te":"Wandering Encounter Checks in the Dungeon","tr":"Проверки случайных встреч в подземелье","en":"Every so many turns, a GM should roll 1d6 to check for a Wandering \nEncounter. On a 1, the PCs will run into one at some point during the \nturn. The frequency of the check will depend on how vigorously alert \nand organized the site’s inhabitants are.\nThe actual contents of the encounter are decided when the GM \nputs together the site. Not all encounters involve running into creatures. \nSome are mere events or situations that fit the site. In the same vein,\nnot all encounters are necessarily hostile, either. Reaction rolls should \nbe made for all groups of creatures.\nExample Time Costs in Turns\nType of Location\nTurns\nAlerted site with organized defenders\nEvery 1\nUnalert site with organized defenders\nEvery 2\nSite with no organized or active defense\nEvery 3\nSite with very few mobile inhabitants\nEvery 4\nAbandoned or disused nook in a site\nEvery 6\nHidden area or concealed chamber unknown to \nthe natives of the site\nNo check","ru":"Каждые сколько-то ходов Мастер должен бросать 1d6 на проверку случайной встречи. На 1 ПИ в какой-то момент хода на неё нарвутся. Частота проверки зависит от того, насколько бдительны и организованы обитатели места.\n\nСамо содержание встречи определяется, когда Мастер готовит это место. Не всякая встреча — это столкновение с существами: некоторые представляют собой просто события или ситуации, подходящие месту. Точно так же не всякая встреча обязательно враждебна. Для всех групп существ делаются проверки реакции.\n\n**Когда бросать проверку встречи**\n\n| Тип места | Ходы |\n|---|---|\n| Поднятое по тревоге место с организованной обороной | Каждый ход |\n| Не поднятое по тревоге место с организованной обороной | Каждые 2 |\n| Место без организованной или деятельной обороны | Каждые 3 |\n| Место с горсткой подвижных обитателей | Каждые 4 |\n| Заброшенный или нехоженый закуток | Каждые 6 |\n| Скрытая область или потайная комната, неизвестная обитателям | Без проверки |"},{"n":"3.0.0","l":1,"te":"Equipment, Armor, and Weapons","tr":"Снаряжение, броня и оружие","en":"Beasts and Transport\nAdventuring Gear\nGear Bundles\nThis section provides a selection of example gear appropriate to most \nfantasy campaigns. The GM is naturally expected to add other items \nthat might suit their particular world.","ru":"Этот раздел даёт подборку примеров снаряжения, подходящего для большинства фэнтезийных кампаний. Мастер, само собой, вправе добавить другие предметы, которые подойдут именно его миру."},{"n":"3.1.0","l":2,"te":"Money and Currency","tr":"Деньги и валюта","en":"The game assumes copper, silver, and gold coins in general circula-\ntion, with ten coppers to a silver and ten silvers to a gold piece. Silver \nis the base currency; one silver piece is a typical laborer’s daily wage.","ru":"Игра исходит из того, что в обращении ходят медные, серебряные и золотые монеты: десять медных составляют серебряную, а десять серебряных — золотую. Базовая валюта — серебро; одна серебряная монета — обычный дневной заработок работника."},{"n":"3.2.0","l":2,"te":"Adventuring Gear","tr":"Снаряжение искателя приключений","en":"Item\nCost\nEnc\nArrows, 20\n2 sp\nBackpack\n2 sp\n1§\nBoots\n2 sp\n1§\nCandle\n1 cp\n*\nCart, one-horse\n50 sp\nN/A\nClothes, common\n25 sp\n1§\nClothes, fine\n100 sp\n1§\nClothes, noble\n500 sp\n2§\nCooking utensils\n4 sp\nCrowbar\n4 sp\nFirewood, one night's fire\n2 cp\nFlask, metal, one pint\n3 sp\nGrappling hook\n5 sp\nHammer or small tool\n2 sp\nHealer's pouch\n5 sp\nHurlant bolts, 20\n20 sp\nIron spikes, 10\n1 sp\nLantern\n10 sp\nMirror, hand\n10 sp\n*\nOil, one pint\n1 sp\n1#\nPaper, 10 sheets\n1 sp\n*\nRations, one week\n5 sp\nRope, 50'\n2 sp\nSack\n1 sp\nShovel, pick, or similar tool\n4 sp\nTinder box\n1 sp\n*\nTorch\n2 cp\n1#\nWaterskin, one gallon\n1 sp\nWriting kit\n3 sp\n* the item is effectively weightless in modest numbers\n§ the item doesn’t count for encumbrance purposes while being \nworn\n# can be bundled in units of three for the same encumbrance, \nwith a Main Action to break open a bundle to get at the contents\nItem\nCost\nHorse, riding\n200 sp\nHorse, draft\n150 sp\nHorse, battle-trained\n2,000 sp\nMule\n30 sp\nCow\n10 sp\nOx, plow-trained\n15 sp\nChicken\n5 cp\nPig\n3 sp\nDog, working\n20 sp\nSheep or goat\n5 sp\nRiver ferry, per passenger\n5 cp\nShip passage, per expected day\n2 sp\nCarriage travel, per mile\n2 cp\nRowboat\n30 sp\nSmall fishing boat\n200 sp\nMerchant ship\n5,000 sp\nWar galleon\n50,000 sp","ru":"**Снаряжение искателя приключений**\n\n| Предмет | Цена | Загр. |\n|---|---|---|\n| Болты для болтомёта, 20 шт. | 20 см | 1 |\n| Бумага, 10 листов | 1 см | * |\n| Бурдюк, галлон | 1 см | 1 |\n| Верёвка, 50 футов | 2 см | 2 |\n| Дрова на одну ночь | 2 мм | 4 |\n| Железные клинья, 10 шт. | 1 см | 1 |\n| Крюк-кошка | 5 см | 1 |\n| Кухонная утварь | 4 см | 1 |\n| Лом | 4 см | 1 |\n| Лопата, кирка и т. п. | 4 см | 2 |\n| Масло, пинта | 1 см | 1# |\n| Мешок | 1 см | 1 |\n| Молоток или мелкий инструмент | 2 см | 1 |\n| Огниво | 1 см | * |\n| Одежда вельможная | 500 см | 2§ |\n| Одежда добротная | 100 см | 1§ |\n| Одежда простая | 25 см | 1§ |\n| Письменный прибор | 3 см | 1 |\n| Припасы на неделю | 5 см | 4 |\n| Ручное зеркальце | 10 см | * |\n| Рюкзак | 2 см | 1§ |\n| Сапоги | 2 см | 1§ |\n| Свеча | 1 мм | * |\n| Стрелы, 20 шт. | 2 см | 1 |\n| Сумка лекаря | 5 см | 1 |\n| Телега одноконная | 50 см | Н/П |\n| Факел | 2 мм | 1# |\n| Фляга железная, пинта | 3 см | 1 |\n| Фонарь | 10 см | 1 |\n\n*: предмет в умеренном количестве фактически ничего не весит\n§: надетый предмет не идёт в счёт Загруженности\n#: можно связывать по три в связку с той же Загруженностью; вскрыть связку, чтобы добраться до содержимого, — Основное действие\n\n**Животные и транспорт**\n\n| Предмет | Цена |\n|---|---|\n| Лошадь верховая | 200 см |\n| Лошадь тягловая | 150 см |\n| Лошадь боевая | 2 000 см |\n| Мул | 30 см |\n| Корова | 10 см |\n| Вол пахотный | 15 см |\n| Курица | 5 мм |\n| Свинья | 3 см |\n| Собака рабочая | 20 см |\n| Овца или коза | 5 см |\n| Речной паром, за пассажира | 5 мм |\n| Проезд на корабле, за расчётный день пути | 2 см |\n| Поездка в экипаже, за милю | 2 мм |\n| Лодка | 30 см |\n| Рыбацкий баркас | 200 см |\n| Торговый корабль | 5 000 см |\n| Боевой галеон | 50 000 см |"},{"n":"3.2.1","l":3,"te":"Gear Bundles","tr":"Комплекты снаряжения","en":"Depending on the tastes of the group, some parties might enjoy track-\ning every torch and carefully weighing their resource expenditures on \nperilous expeditions. Others prefer to gloss over the details. The “gear \nbundle” options below cover all the non-weapon, non-armor gear \nexpected of a particular role and the usual encumbrance weight of \nit all. The specific contents of each bundle are as broad as the GM \nfinds reasonable for the role. A GM who prefers exact accounting \ncan disallow bundles.\nItem\nCost\nEnc\nArtisan’s Equipment\n50 sp\nCriminal Tools\n100 sp\nDungeoneering Kit\n200 sp\nNoble Courtier Outfit\n1,000 sp\nPerformer’s Implements\n100 sp\nWilderness Travel Gear\n100 sp\nHirelings and Day Labor\nServices and Living Expenses","ru":"Смотря по вкусам группы: одним партиям в радость считать каждый факел и тщательно взвешивать расход припасов в опасных экспедициях, другие предпочитают не вдаваться в подробности. Приведённые ниже «комплекты снаряжения» покрывают всё снаряжение, кроме оружия и брони, какое положено определённой роли, вместе с его обычным весом для Загруженности. Что именно входит в каждый комплект — настолько широкий вопрос, насколько Мастер сочтёт разумным для этой роли. Мастер, предпочитающий точный учёт, может запретить комплекты.\n\n**Комплекты снаряжения**\n\n| Предмет | Цена | Загр. |\n|---|---|---|\n| Воровской инструмент | 100 см | 3 |\n| Набор для подземелий | 200 см | 6 |\n| Наряд придворного | 1 000 см | 2 |\n| Походное снаряжение | 100 см | 5 |\n| Реквизит артиста | 100 см | 3 |\n| Снаряжение ремесленника | 50 см | 5 |"},{"n":"3.2.2","l":3,"te":"Hirelings and Services","tr":"Наёмные работники и услуги","en":"The party may find it useful to employ temporary labor in their ad-\nventures, either for extra warm bodies in combat or for the special \ntalents they possess.\nAdventuring hirelings will demand at least a half-share of treasure \nin addition to their daily pay and will undertake no risks that their \nemployers don’t share. Their combat statistics will be as normal for \ntheir type, usually equal to a common human soldier for most. After \na particularly dangerous adventure, the hireling must make a Morale \ncheck; on a failure, they decide the adventuring life is too risky and \nleave the group.\nOn the rare occasions that a mage can be found willing to hire \nout their services, their skills almost never exceed those of a first or \nsecond level Mage.\nMost communities have a limited number of men and women \nwilling to risk an awful doom while adventuring. If the party makes a \nhabit of returning without their employees, others may refuse to join.\nNon-adventuring hirelings who are employed to guard the party’s \nresidence, haul their equipment on expeditions, work on their behalf, \nand otherwise conduct normal business will require no more than their \ndaily wage. If they can’t go home at the end of the day, food and fit \nlodgings must be provided as well.\nWhere it matters, common hirelings can be assumed to have a \ntotal +1 bonus on relevant skill checks.\nItem\nCost/day\nBard of Small Repute\n2 sp\nCommon Prostitute\n2 sp\nDragoman or Skilled Interpreter\n10 sp\nElite Courtesan\n100 sp\nFarmer\n1 sp\nGuard, ordinary\n2 sp\nGuard, sergeant, for every ten guards\n10 sp\nLawyer or Pleader\n10 sp\nMage of Minor Abilities\n200 sp\nMundane Physician\n10 sp\nPorter willing to go into the wilds\n5 sp\nPorter only for relatively safe roads\n1 sp\nNavigator\n5 sp\nSage, per question answered\n200 sp\nSailor\n1 sp\nScribe or Clerk\n3 sp\nSkilled Artisan\n5 sp\nUnskilled Laborer\n1 sp\nVeteran Sellsword\n10 sp\nWilderness Guide\n10 sp","ru":"Партии может пригодиться временная рабочая сила — как лишние руки в бою, так и обладатели особых талантов.\n\nНаёмные работники, идущие в приключение, потребуют сверх дневной платы не меньше половинной доли добычи и не станут рисковать там, где не рискуют их наниматели. Их боевые характеристики обычны для их типа — у большинства как у простого солдата-человека. После особенно опасного приключения работник обязан пройти проверку боевого духа; при провале он решает, что жизнь искателя приключений слишком рискованна, и покидает отряд.\n\nВ тех редких случаях, когда удаётся найти мага, готового наняться, его умения почти никогда не превосходят Мага первого или второго уровня.\n\nВ большинстве общин запас мужчин и женщин, готовых рискнуть страшной участью в приключении, ограничен. Если партия взяла привычку возвращаться без своих работников, новые могут отказаться наниматься.\n\nРаботникам, не участвующим в приключениях, — тем, кто охраняет жилище партии, таскает её снаряжение в экспедициях, трудится по её поручениям и вообще ведёт обычные дела, — хватит их дневного заработка. Если к концу дня им не вернуться домой, придётся обеспечить их едой и пристойным ночлегом.\n\nТам, где это важно, считается, что обычные наёмные работники имеют суммарный бонус +1 к соответствующим проверкам навыков.\n\n**Наёмные работники и подёнщина**\n\n| Работник | Цена/день |\n|---|---|\n| Бард малой известности | 2 см |\n| Ветеран-наёмник | 10 см |\n| Драгоман или умелый толмач | 10 см |\n| Законник или стряпчий | 10 см |\n| Земледелец | 1 см |\n| Маг малых способностей | 200 см |\n| Матрос | 1 см |\n| Мудрец, за один отвеченный вопрос | 200 см |\n| Носильщик, готовый идти в дикий край | 5 см |\n| Носильщик только по сравнительно безопасным дорогам | 1 см |\n| Обычная проститутка | 2 см |\n| Обычный лекарь | 10 см |\n| Писец или конторщик | 3 см |\n| Проводник | 10 см |\n| Сержант стражи, на каждый десяток стражников | 10 см |\n| Стражник обычный | 2 см |\n| Умелый ремесленник | 5 см |\n| Чернорабочий | 1 см |\n| Штурман | 5 см |\n| Элитная куртизанка | 100 см |"},{"n":"3.2.3","l":3,"te":"Services and Living Expenses","tr":"Услуги и расходы на жизнь","en":"Heroes who are sufficiently established as to have their own homes \nor businesses can live comfortably on their own resources. Other PCs, \nhowever, must pay for their keep when not out adventuring.\nImpoverished lifestyle costs cover only the bare minimum of \nfood and a mostly-dry squat to sleep in. Heroes who can afford \nnothing better suffer a -1 penalty to all social skill checks due to their \nunkempt state and must make a Physical saving throw each night to \nbenefit from the usual decrease in System Strain.\nCommon lifestyle fees for an adventurer usually cover adequate \nfood and a shabby private inn room. No penalties or benefits are \ngranted by living this way.\nRich lifestyle costs generally include a rented townhouse, a small \nstaff of servants, and social entree into high society circles that are \nforgiving of the nouveau riche… at least, as long as their coin remains \ngood.\nNoble lifestyles provide the very best the community can offer in \nfine lodging, luxuriant food, sycophantic servants, and the provisional \nfriendship of useful parasites. Once per game session, the PC can \nask a favor of a hanger-on in their retinue, who will perform it if it is \nnot more than mildly humiliating, dangerous or illegal.\nAside from these weekly lifestyle costs, some other services often \nrequired by adventurers are listed.\nItem\nCost\nImpoverished lifestyle, per week\n5 sp\nCommon lifestyle, per week\n20 sp\nRich lifestyle, per week\n200 sp\nNoble lifestyle, per week\n1,000 sp\nMagical healing of wounds\n10 sp/hp*\nMagical curing of a disease\n500 sp*\nLifting a curse or undoing magic\n1,000 sp*\nCasting a minor spell\n250 sp*\nBribe to overlook a minor crime\n10 sp\nBribe to overlook a major crime\n500 sp\nBribe to overlook a capital crime\n10,000 sp\nHire someone for a minor crime\n50 sp\nHire someone for a major crime\n1,000 sp\nHire someone for an infamous crime\n25,000 sp\n* These services are rarely available without personal \nconnections or doing special favors, and many communities may \nlack them entirely.\nArmor","ru":"Герои, достаточно прочно вставшие на ноги, чтобы обзавестись собственным домом или делом, спокойно живут на свои средства. Остальным ПИ, однако, приходится платить за кров и стол, когда они не в приключении.\n\nНищий уровень жизни оплачивает лишь самый скудный стол и по большей части сухой угол для ночлега. Герои, которым не по карману ничего лучше, получают штраф -1 ко всем социальным проверкам навыков из-за неухоженного вида и каждую ночь должны проходить Физический спасбросок, чтобы получить обычное снижение Системной нагрузки.\n\nОбычный уровень жизни для искателя приключений оплачивает, как правило, сносную еду и обшарпанную отдельную комнату на постоялом дворе. Такая жизнь не даёт ни штрафов, ни преимуществ.\n\nБогатый уровень жизни обычно включает съёмный особняк, небольшой штат прислуги и вход в те круги высшего света, что снисходительны к нуворишам… по крайней мере, пока их монета в цене.\n\nВельможный уровень жизни даёт самое лучшее, что может предложить община: прекрасное жильё, роскошный стол, льстивую прислугу и условную дружбу полезных прихлебателей. Раз за игровую сессию ПИ может попросить об услуге приживалу из своей свиты, и тот выполнит её, если она не более чем слегка унизительна, опасна или незаконна.\n\nПомимо этих недельных расходов на жизнь, здесь перечислены и другие услуги, которые часто нужны искателям приключений.\n\n**Услуги и расходы на жизнь**\n\n| Услуга | Цена |\n|---|---|\n| Нищий уровень жизни, за неделю | 5 см |\n| Обычный уровень жизни, за неделю | 20 см |\n| Богатый уровень жизни, за неделю | 200 см |\n| Вельможный уровень жизни, за неделю | 1 000 см |\n| Магическое исцеление ран | 10 см за ПЗ* |\n| Магическое излечение болезни | 500 см* |\n| Снятие проклятия или отмена магии | 1 000 см* |\n| Чтение малого заклинания | 250 см* |\n| Взятка, чтобы закрыли глаза на мелкое преступление | 10 см |\n| Взятка, чтобы закрыли глаза на серьёзное преступление | 500 см |\n| Взятка, чтобы закрыли глаза на преступление, караемое смертью | 10 000 см |\n| Нанять исполнителя для мелкого преступления | 50 см |\n| Нанять исполнителя для серьёзного преступления | 1 000 см |\n| Нанять исполнителя для неслыханного преступления | 25 000 см |\n\n*: Эти услуги редко доступны без личных связей или особых встречных услуг, а во многих общинах их может не быть вовсе."},{"n":"3.3.0","l":2,"te":"Armor","tr":"Броня","en":"While some martial adepts or tradition-bound sorcerers shun armor, \nmost adventurers find it necessary to put something solid between \nthem and their enemies.\nArmor must be worn as a Readied item, counting against the hero’s \nencumbrance limit. Each type of armor grants a different base Armor \nClass to the wearer, making it more difficult for enemies to land a \ntelling blow. This Armor Class is modified by the wearer’s Dexterity \nmodifier and by any shield they might carry, as described below. \nMultiple suits of armor do not stack; only one can usefully benefit \na wearer.\nA hero wearing no armor at all has a base Armor Class of 10, \nmodified by their Dexterity modifier. If they pick up a shield they \ncan improve this to either AC 13 or AC 14, depending on the size \nof the shield.","ru":"Пусть некоторые мастера боевых искусств и связанные традицией чародеи отвергают броню, большинство искателей приключений считают нужным поместить между собой и врагами что-нибудь прочное.\n\nБроня носится как предмет в готовности и идёт в счёт предела Загруженности героя. Каждый тип брони даёт носителю свой базовый класс защиты, мешая врагам нанести чувствительный удар. Этот класс защиты изменяется модификатором Ловкости носителя и любым щитом при нём, как описано ниже. Несколько доспехов не складываются: с пользой носить можно только один.\n\nГерой вовсе без брони имеет базовый класс защиты 10, изменяемый его модификатором Ловкости. Взяв щит, он может поднять его до КЗщ 13 или КЗщ 14, смотря по размеру щита."},{"n":"3.3.1","l":3,"te":"Light, Medium, and Heavy Armor","tr":"Лёгкая, средняя и тяжёлая броня","en":"Light armor may be decidedly heavy, but it is loose and flexible \nenough to offer minimal hindrance to the wearer’s actions. Some \nvarieties are also discreet enough to be worn politely in common \nsociety. Medium armor is significantly noisier and more overt; it \ncannot be worn discreetly and applies its encumbrance as a penalty \nto any physical Sneak rolls made by the wearer. Heavy armor is the \nthickest, toughest panoply available on the market, and its bulk and \nnoise make its encumbrance apply as a penalty to Sneak or Exert \nchecks made by the wearer.","ru":"Лёгкая броня может быть отнюдь не лёгкой на вес, но она достаточно свободна и гибка, чтобы почти не стеснять движений носителя. Некоторые её разновидности к тому же достаточно неприметны, чтобы прилично появляться в них в обществе. Средняя броня заметно шумнее и приметнее: скрытно её не поносишь, а её Загруженность идёт штрафом ко всем физическим проверкам Скрытности носителя. Тяжёлая броня — самый толстый и прочный доспех, какой есть на рынке; из-за её громоздкости и шума её Загруженность идёт штрафом к проверкам Скрытности и Атлетики носителя."},{"n":"3.3.2","l":3,"te":"Shields","tr":"Щиты","en":"Shields come in two general varieties. Small ones, often made of \ncostlier metal, can be strapped to the wearer’s arm and allow them \nto hold and manipulate objects with that hand, albeit not wield a \nweapon with it. Larger shields are of cheaper wood and require a \ngood grip.\nA small shield user has a base AC of 13, while a large shield \nuser has a base AC of 14. Unlike other armor, however, if the user is \nalready wearing equal or better armor the shield grants a +1 bonus \nto their AC. Shields allow the bearer to ignore the first instance of \nShock they might otherwise suffer in a round.","ru":"Щиты бывают двух основных разновидностей. Малые, чаще из более дорогого металла, пристёгиваются к руке и позволяют держать этой рукой предметы и работать ими — но не оружием. Большие щиты делаются из дешёвого дерева и требуют крепкого хвата.\n\nС малым щитом базовый КЗщ равен 13, с большим — 14. Однако, в отличие от прочей брони, если носитель уже одет в равную или лучшую броню, щит даёт ему бонус +1 к КЗщ. Щит позволяет носителю игнорировать первый Шок, который тот иначе получил бы за раунд."},{"n":"3.3.3","l":3,"te":"Types of Armor","tr":"Виды брони","en":"War shirts are nothing more than blessed shirts, lucky cloaks, aus-\npicious warpaint, or whatever tokens of martial victory are favored \nby the poor and humble of a given culture. While they may look like \nnothing but normal clothing, their war-luck is still sufficient to interfere \nwith a spellcaster’s abilities.\nBuff coats are long coats of thick, supple hide, sometimes worn \nto cushion the bite of heavier armor and sometimes sported as or-\nnamented street clothing for the gentry who can afford such luxuries. \nLinothorax armor is a stiffer armor of glued, layered cloth.\nA war robe is a catchall term for various outfits involving layers \nof reinforced cloth or leather. Bits of metal, layers of thick hide, or \nweaves of tough cordage might all go into the various layers of the \nsuit, making it a very heavy, if effective, piece of equipment.\nPieced armor is assembled of a thicker or more durable chest-\npiece and piecework limb armor. While less effective than a proper \ncuirass and greaves, it’s often the best that poor adventurers can get.\nMail shirts are usually of iron or steel wire, though bronze and \nother more exotic materials are not unknown. Such shirts cover only \nthe vitals of the wearer, but are less burdensome than a full hauberk.\nLight Armors\nA
