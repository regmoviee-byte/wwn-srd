.2.0","l":2,"te":"Saving Throws","tr":"Спасброски","en":"Saving throws are rolled to resist some unusual danger or chance \nhazard. To make a saving throw, a person rolls 1d20 and tries to \nget equal or higher than their saving throw target. Sometimes a save \nmight have bonuses or penalties applied to the roll, but a natural \nroll of 1 on the die always fails the save, and a natural roll of 20 is \nalways a success.\nThere are four types of saving throws. Usually it will be obvious \nwhich type is most appropriate for a threat, but the GM can decide \nin marginal situations.\nPhysical saves resist exhaustion, poisons, diseases, or other bodily \nafflictions. A PC’s Physical saving throw target is equal to 16 minus \ntheir character level and the highest of their Strength or Constitution \nmodifiers.\nEvasion saves apply when dodging explosions, avoiding traps, \nreacting to sudden peril, or other occasions where speed is of the \nessence. A PC’s Evasion saving throw target is equal to 16 minus \ntheir character level and the highest of their Dexterity or Intelligence \nmodifiers.\nMental saves apply when resisting mental attacks, insubstantial \nmagic spells, psychological trauma, and other mental hazards. A PC’s \nMental saving throw target is equal to 16 minus their character level\nand the highest of their Wisdom or Charisma modifiers.\nLuck saves are used when only blind chance can save a PC, \nregardless of their native abilities. A PC’s Luck saving throw target is \nequal to 16 minus their character level, unmodified by their attributes.","ru":"Спасброски бросают, чтобы устоять против необычной опасности или случайной угрозы. Чтобы сделать спасбросок, человек бросает 1d20 и пытается получить результат не ниже своего порога спасброска. Иногда к броску применяются бонусы или штрафы, но натуральная 1 на кости — всегда провал спасброска, а натуральная 20 — всегда успех.\nСпасброски бывают четырёх типов. Обычно очевидно, какой тип подходит для угрозы, но в спорных случаях решает Мастер.\nФизические спасброски противостоят истощению, ядам, болезням и другим телесным напастям. Порог Физического спасброска ПИ равен 16 минус уровень персонажа и минус наибольший из модификаторов Силы или Телосложения.\nСпасброски Уклонения применяются, когда нужно уйти от взрыва, избежать ловушки, отреагировать на внезапную угрозу, и в других случаях, где всё решает скорость. Порог спасброска Уклонения ПИ равен 16 минус уровень персонажа и минус наибольший из модификаторов Ловкости или Интеллекта.\nМентальные спасброски применяются, когда нужно устоять против ментальных атак, бесплотных магических заклинаний, психологических травм и прочих ментальных угроз. Порог Ментального спасброска ПИ равен 16 минус уровень персонажа и минус наибольший из модификаторов Мудрости или Харизмы.\nСпасброски Удачи используются, когда ПИ может спасти только слепой случай, независимо от его собственных способностей. Порог спасброска Удачи ПИ равен 16 минус уровень персонажа и не изменяется характеристиками."},{"n":"2.2.1","l":3,"te":"NPC Saving Throws","tr":"Спасброски NPC","en":"NPCs have a single saving throw target equal to 15 minus half their \nrounded-down hit dice. Thus, an NPC with 3 HD would have a saving \nthrow target of 14+ for any particular hazard. The GM may modify \nthis in special circumstances, but it’s usually not worth tracking more \nclosely.","ru":"У NPC один общий порог спасброска, равный 15 минус половина их Костей здоровья с округлением вниз. Так, у NPC с 3 КЗд порог спасброска против любой конкретной угрозы будет 14+. Мастер может изменить его в особых обстоятельствах, но обычно вести учёт точнее не стоит."},{"n":"2.3.0","l":2,"te":"Skill Checks","tr":"Проверки навыков","en":"Most characters are skilled, competent men and women who are \nperfectly capable of carrying out the ordinary duties of their role. \nSometimes, however, they are faced with a situation or challenge \nbeyond the usual scope of their role and the GM calls for a skill check.\nTo make a skill check, roll 2d6 and add the most relevant skill \nlevel and attribute modifier. If the total is equal or higher than the \ncheck’s difficulty, the check is a success. On a failure, the PC either \ncan’t accomplish the feat at all, bad luck cheats them, or they achieve \nit at the cost of some further complication. The GM determines the \nspecific consequence of a failure.\nIf the character doesn’t even have level-0 in the pertinent skill, \nthey suffer a -1 penalty to the roll. In the case of particularly techni-\ncal or esoteric skills they might not even be able to attempt the skill \ncheck at all.\nThe GM is always the one who calls for a skill check, and they \ndo so at their discretion. The player simply describes what their PC is \nattempting to do, and the GM will tell them what skill and attribute \ncombination to roll. If multiple skills or attributes might plausibly fit \nthe action, the player can pick the one most favorable to them. If the \ncombination is only marginally relevant, but still reasonably plausible, \nit might suffer a -1 or -2 penalty at the GM’s discretion.\nA relatively simple task that is still more than the PC\nwould usually be expected to manage in their regular \nbackground. Anything easier than this isn’t worth a \nskill check.\nA significant challenge to a competent professional\nthat they’d still succeed at more often than not.\nSomething too difficult to be expected of anyone but \na skilled expert, and even they might fail.\nOnly a true master could expect to carry this off with \nany degree of reliability.\n14+\nOnly a true master has any chance of achieving this \nat all, and even they will probably fail.","ru":"Большинство персонажей — умелые, толковые мужчины и женщины, вполне способные выполнять обычную работу по своей роли. Но иногда они сталкиваются с ситуацией или испытанием за пределами обычных рамок своей роли, и тогда Мастер требует проверку навыка.\nЧтобы сделать проверку навыка, брось 2d6 и прибавь наиболее подходящий уровень навыка и модификатор характеристики. Если сумма равна сложности проверки или выше — проверка успешна. При провале ПИ либо вообще не справляется, либо его подводит неудача, либо он добивается своего ценой дополнительного осложнения. Конкретное следствие провала определяет Мастер.\nЕсли у персонажа нет даже уровня-0 в подходящем навыке, он получает штраф -1 к броску. В случае особо технических или узкоспециальных навыков он может и вовсе не иметь права на проверку.\nПроверку навыка всегда требует Мастер, и делает это по своему усмотрению. Игрок просто описывает, что пытается сделать его ПИ, а Мастер говорит, какую комбинацию навыка и характеристики бросать. Если действию правдоподобно подходят несколько навыков или характеристик, игрок может выбрать самую выгодную для себя. Если комбинация подходит лишь отчасти, но всё же правдоподобна, она может получить штраф -1 или -2 на усмотрение Мастера."},{"n":"2.3.1","l":3,"te":"Skill Check Difficulties","tr":"Сложности проверок навыков","en":"The following difficulties ratings reflect common challenges.\nDifficulty\nSkill Check\nHelpful or hostile circumstances can modify a skill check by -2 to \n+2. Usually, no combination of situational modifiers should alter the \nroll by more than this, or else it becomes a near-foregone conclusion. \nThis does not include modifiers applied by gear mods, magic items, \nor PC aid.","ru":"Приведённые ниже значения сложности отражают типичные испытания.\n\n| Сложность | Проверка навыка |\n|---|---|\n| 6 | Довольно простая задача, которая всё же сложнее того, что обычно ждут от ПИ в рамках его Происхождения. Всё, что проще, проверки навыка не стоит. |\n| 8 | Серьёзное испытание для толкового профессионала, с которым он всё же справится чаще, чем провалится. |\n| 10 | Нечто слишком трудное для кого-либо, кроме умелого эксперта, — и даже он может провалиться. |\n| 12 | Одолеть такое с какой-то долей надёжности по силам только настоящему мастеру. |\n| 14+ | Только у настоящего мастера вообще есть шанс это сделать, и даже он, скорее всего, провалится. |\n\nБлагоприятные или враждебные обстоятельства могут изменить проверку навыка на -2…+2. Обычно никакое сочетание ситуативных модификаторов не должно менять бросок сильнее, иначе исход становится почти предопределённым. Сюда не входят модификаторы от модов снаряжения, магических предметов или помощи других ПИ."},{"n":"2.3.2","l":3,"te":"NPC Skill Checks","tr":"Проверки навыков NPC","en":"When an NPC needs to make a skill check, they roll 2d6 and add \ntheir listed skill modifier if their action is something they ought reason-\nably to be good at. If it isn’t, they roll at +0, or even at -1 if it seems \nlike something they’d be particularly bad at doing. If the NPC is \nspecial enough to have actual attribute scores and skill levels, they \nuse those instead.","ru":"Когда NPC нужно сделать проверку навыка, он бросает 2d6 и прибавляет свой указанный модификатор навыка, если действие — из тех, в которых он по здравому смыслу должен быть хорош. Если нет, он бросает с +0 или даже с -1, если это что-то, в чём он особенно плох. Если NPC достаточно особенный, чтобы иметь настоящие значения характеристик и уровни навыков, используются они."},{"n":"2.3.3","l":3,"te":"Aiding a Skill Check","tr":"Помощь в проверке навыка","en":"To aid a comrade’s skill check, a player explains what their PC is \ndoing to help. If the GM agrees that it’s plausible, they may roll a \nrelevant skill and attribute modifier against the same difficulty as the \ncheck they are aiding. If they succeed, their ally gains a +1 on their \nskill check. If they fail, no harm is done. Multiple PCs can try to aid \nif their actions are plausible, but the total bonus can’t exceed +1.\nAiding a comrade is usually done in ways that let the aiding PC \nleverage their own special talents or skills. A PC may not have the \nskills to attempt to Sneak past a vigilant guard, for example, but they \nmight have a good Perform skill they can use to create a distraction \nthat helps their comrade skulk past.","ru":"Чтобы помочь товарищу с проверкой навыка, игрок объясняет, что делает его ПИ. Если Мастер согласен, что это правдоподобно, помогающий может бросить подходящий навык и модификатор характеристики против той же сложности, что и у проверки, которой он помогает. При успехе союзник получает +1 к своей проверке навыка. При провале ничего плохого не происходит. Помогать могут несколько ПИ, если их действия правдоподобны, но суммарный бонус не может превысить +1.\nПомощь товарищу обычно строится так, чтобы помогающий ПИ мог задействовать свои особые таланты или навыки. Например, у ПИ может не быть навыка, чтобы прокрасться Скрытностью мимо бдительного охранника, зато у него хорошее Выступление, которым он создаст отвлекающий манёвр и поможет товарищу проскользнуть."},{"n":"2.3.4","l":3,"te":"Opposed Skill Checks","tr":"Встречные проверки навыков","en":"When skills oppose each other, each participant makes a skill check \nand the winner is the one who rolls higher. In cases of ties, the PC \nwins. Thus, a PC trying to sneak past a guard might roll 2d6 plus \ntheir Dex/Sneak against the guard’s 2d6 plus their skill modifier. If \nthe guard was significant enough to actually have attributes and skill \nlevels, it might be a Dex/Sneak challenge versus their Wis/Notice.","ru":"Когда навыки противостоят друг другу, каждый участник делает проверку навыка, и побеждает тот, кто выбросил больше. При равенстве побеждает ПИ. Так, ПИ, пытающийся прокрасться мимо охранника, может бросить 2d6 плюс Лов/Скрытность против 2d6 охранника плюс его модификатор навыка. Если охранник достаточно значим, чтобы иметь характеристики и уровни навыков, это может быть состязание Лов/Скрытность против его Мдр/Внимание."},{"n":"2.4.0","l":2,"te":"Combat","tr":"Бой","en":"Violence is inevitable in most fantasy campaigns. The rules below \nhandle its most common manifestations.","ru":"В большинстве фэнтезийных кампаний насилие неизбежно. Правила ниже описывают его самые частые проявления."},{"n":"2.4.1","l":3,"te":"The Combat Sequence","tr":"Последовательность боя","en":"When combat begins, the fight progresses in the following sequence. \nThe sections below explain each step in the process.\nFirst, each participating side rolls for initiative. The side that rolled \nhighest acts first.\nSecond, each member of a side gets to take their actions. Mem-\nbers of a side act in whatever order they wish. NPC sides act in \nwhatever order the GM wishes.\nThird, once every member of a side has acted, the side that rolled \nnext-highest gets to act. If NPCs have taken losses or are facing de-\nfeat, they may need to roll a Morale check as explained in section \n5.2.0. PCs never check Morale.\nFourth, once every side has acted the process repeats from the \ntop in the same order. Initiative is not re-rolled.","ru":"Когда начинается бой, он идёт в следующей последовательности. Разделы ниже объясняют каждый шаг процесса.\nВо-первых, каждая участвующая сторона бросает инициативу. Сторона с наибольшим результатом действует первой.\nВо-вторых, каждый член стороны совершает свои действия. Члены стороны действуют в любом порядке, какой захотят. Стороны NPC действуют в порядке, который выберет Мастер.\nВ-третьих, когда отыграл каждый член стороны, действует сторона со следующим по величине результатом. Если NPC несут потери или им грозит разгром, им может потребоваться проверка боевого духа, как описано в разделе 5.3.0. ПИ никогда не проверяют боевой дух.\nВ-четвёртых, когда отыграли все стороны, процесс повторяется с начала в том же порядке. Инициатива не перебрасывается."},{"n":"2.4.2","l":3,"te":"Combat Initiative","tr":"Боевая инициатива","en":"When combat begins, each side involved in it rolls initiative, rolling \n1d8 and adding their group’s best Dexterity modifier. NPCs usually \nadd nothing. The groups then act in order from highest to lowest rolls, \nwith PC sides winning ties. When the slowest group has acted, the \nround ends and a new round starts in the same initiative order. Mem-\nbers of a side can act in any order the group agrees upon when it is \nthat side’s turn to act, performing their allowed actions as explained \nin the section below.","ru":"Когда начинается бой, каждая участвующая сторона бросает инициативу: 1d8 плюс лучший модификатор Ловкости в группе. NPC обычно ничего не прибавляют. Затем группы действуют по порядку от высшего результата к низшему, при равенстве побеждают стороны ПИ. Когда отыграла самая медленная группа, раунд заканчивается и начинается новый в том же порядке инициативы. Члены стороны могут действовать в любом порядке, о котором договорится группа, когда приходит очередь их стороны, выполняя доступные им действия, как описано в разделе ниже."},{"n":"2.4.2.1","l":4,"te":"Individual Initiative","tr":"Индивидуальная инициатива","en":"As an optional rule, the GM may use individual initiative. In this case, \neach combatant rolls 1d8 individually, adding their Dexterity modi-\nfier, and acting in order from highest to lowest with PCs winning ties. \nThis leaves a group less likely to be caught flat-footed by enemies, \nbut makes it harder for a group to coordinate actions.","ru":"Как необязательное правило, Мастер может использовать индивидуальную инициативу. В этом случае каждый участник боя бросает 1d8 отдельно, прибавляя свой модификатор Ловкости, и все действуют по порядку от высшего к низшему, при равенстве побеждают ПИ. Так группу реже застают врасплох враги, но ей труднее согласовывать действия."},{"n":"2.4.2.2","l":4,"te":"Surprise","tr":"Внезапность","en":"If a group is caught entirely unawares they may suffer surprise, au-\ntomatically granting their enemies a full free round of action be-\nfore initiative can be rolled. The GM decides when surprise applies, \npossibly calling for an opposed Dex/Sneak skill check versus the \ntarget’s Wis/Notice. Groups cannot be surprised if they are actively \nanticipating the possibility of combat; at most, they might suffer an \ninitiative penalty at the GM’s discretion.","ru":"Если группу застали совершенно неготовой, она может оказаться застигнутой врасплох — тогда её враги автоматически получают целый бесплатный раунд действий до броска инициативы. Мастер решает, когда действует внезапность, и может потребовать встречную проверку Лов/Скрытность против Мдр/Внимание цели. Группу нельзя застать врасплох, если она активно ожидает возможного боя; максимум она получит штраф к инициативе на усмотрение Мастера."},{"n":"2.4.2.3","l":4,"te":"Automatic Initiative Powers","tr":"Способности автоматической инициативы","en":"A PC with certain Foci or abilities may be immune to surprise or gain \nautomatic initiative. In such cases they automatically act first during \na combat round, even if the rest of their side is slower. If multiple \ncombatants have these powers, they roll initiative normally amongst \nthemselves to see which of them acts first.","ru":"ПИ с определёнными Фокусами или способностями может быть невосприимчив к внезапности или получать автоматическую инициативу. В таком случае он автоматически действует первым в боевом раунде, даже если остальная его сторона медленнее. Если такими способностями обладают несколько участников боя, они бросают инициативу между собой обычным порядком, чтобы определить, кто из них действует первым."},{"n":"2.4.3","l":3,"te":"Combat Action Types","tr":"Типы боевых действий","en":"Attacks, movement, spellcasting, and other combat activities all re-\nquire one of the following four types of actions.\nMain actions are a character’s primary action during a combat \nround, such as attacking an enemy, applying first aid to a downed \nally, casting a spell, frantically evading incoming spears, or something\nelse that takes less than six seconds to do. A combatant gets one \nMain action per round.\nMove actions involve moving the character’s normal movement \nrate of 30 feet or performing some other relatively brief bodily action, \nsuch as getting up from prone. A combatant gets one Move action \nper round, but can spend their main action to get a second.\nOn Turn actions are brief, simple acts that require only a mo-\nment’s concentration. Activating certain abilities or speaking a few \nwords might constitute an On Turn action. A character can take as \nmany On Turn actions on their round as the GM finds plausible.\nInstant actions are special, most being provided only by certain \npowers or certain special actions. Instant actions can be performed \neven when it’s not your turn in the round, even after the dice have \nalready been rolled. The Veteran’s Luck class ability provides one \nsuch Instant action, allowing the PC to treat a missed attack roll as an \nautomatic hit. A PC can use as many Instant actions in a round as the \nGM finds plausible. Instant actions performed at the same time are \nresolved simultaneously, with the GM adjudicating any ambiguities.","ru":"Атаки, перемещение, чтение заклинаний и прочие боевые занятия требуют одного из четырёх следующих типов действий.\nОсновные действия — главное действие персонажа в боевом раунде: атаковать врага, оказать первую помощь упавшему союзнику, прочитать заклинание, отчаянно уворачиваться от летящих копий или сделать что-то ещё, на что уходит меньше шести секунд. Участник боя получает одно Основное действие за раунд.\nДействия перемещения — это перемещение на обычную скорость персонажа в 30 футов или другое относительно короткое телесное действие, например встать из положения лёжа. Участник боя получает одно Действие перемещения за раунд, но может потратить Основное действие, чтобы получить второе.\nДействия в свой ход — короткие простые поступки, требующие лишь мгновения сосредоточенности. Активация некоторых способностей или несколько сказанных слов могут считаться Действием в свой ход. Персонаж может совершить за свой раунд столько Действий в свой ход, сколько Мастер сочтёт правдоподобным.\nМгновенные действия — особые: большинство даётся только определёнными способностями или особыми действиями. Мгновенные действия можно выполнять, даже когда сейчас не твой ход в раунде, и даже после того, как кости уже брошены. Классовая способность «Везение ветерана» даёт одно такое Мгновенное действие, позволяя ПИ считать промах в атаке автоматическим попаданием. ПИ может использовать за раунд столько Мгновенных действий, сколько Мастер сочтёт правдоподобным. Мгновенные действия, выполняемые одновременно, разрешаются одновременно, а неоднозначности разбирает Мастер."},{"n":"2.4.4","l":3,"te":"Common Combat Actions","tr":"Частые боевые действия","en":"The actions listed below are merely some of the most common taken \nin combat.\nMake a Melee Attack (Main Action): Attack a target in melee \nrange with an unarmed attack or melee weapon. Such weapons use \neither the Punch or the Stab skill, depending on the type of attack.\nMake a Ranged Attack (Main Action): Attack a target with a bow \nor thrown weapon. The Shoot skill is used for these attacks, though \nStab or Exert can optionally be used for thrown weapons. If there is \nan enemy attacker in melee range, one-handed ranged weapons \nand thrown weapons suffer a -4 penalty to hit, while bows and other \ntwo-handed ranged weapons cannot be fired at all.\nMake a Snap Attack (Instant Action): As an Instant action, give \nup your Main Action and either Make a Melee Attack or Make a \nRanged Attack at a -4 penalty to hit. As an Instant action, you can \nMake a Snap Attack even when it’s not your turn, but you must not \nhave taken your Main Action this round yet. Only well-trained and \ndisciplined NPCs have enough focus to Make a Snap Attack.\nMake a Swarm Attack (Main Action): Target an enemy within \nrange of your weapon and take this action until up to four allies have \nMade a Swarm Attack on that target this round. At that point or any \npoint beforehand, one of these assailants can Make a Melee Attack \nor Make a Ranged Attack on the target with a +2 bonus to hit and +1 \nbonus to damage for every other assailant, up to a maximum bonus \nof +6 to hit and +3 damage. This bonus damage does not add to the \nattack’s Shock and cannot make it do more than its usual maximum \ndamage. Any Shock inflicted by this attack is always applicable, \nhowever, even if the target’s AC is too high, they’re using a shield, or \nhave some power that makes them immune to Shock; the damage a \nSwarm Attack does isn’t really Shock, but a reflection of the inevitable \nhazards of being swarmed by numerous armed foes.\nCharge (Special Action): Spend both your Main Action and your \nMove action to move up to twice your normal movement rate in a \nstraight line, making a melee or thrown ranged attack at the end of it \nwith a +2 bonus to hit. You must be able to charge at least 3 meters \nto build up sufficient momentum and you suffer a -2 penalty to your \nArmor Classes until the end of the round.\nScreen an Ally (Move Action): Move up to your normal movement \nrate to get adjacent to an ally. You then physically block attacks \nagainst them until the start of your next turn, provided they remain\nwithin 3 meters of you. Enemies who attack your ward must make a \nsuccessful opposed combat skill check against you using either Str \nor Dex and the most applicable combat skill. If the enemy succeeds, \ntheir attack targets your ward normally. If you succeed, their attack \ninstead targets you. You can screen against a number of attackers \neach round equal to your highest combat skill; thus, you need at least \nlevel-1 in a combat skill to successfully screen. Multiple defenders \ncan screen the same target, in which case the opposed skill check is \ncompared to all defenders and targets the worst-rolling successful \ndefender. You can only screen against attacks you could feasibly \nphysically parry or body-block.\nTotal Defense (Instant Action): Give up your Main Action to focus \nentirely on dodging and evading incoming perils. Your Melee and \nRanged Armor Classes increase by +2 and you become immune to \nShock until the start of your next turn, including the otherwise-unavoid-\nable damage from a Swarm Attack. You cannot take this action if you \nhave already spent your Main Action for the round.\nRun (Move Action): Move your normal movement rate in combat, \nwhich is 30 feet for an ordinary human. If you start your movement \nadjacent to an armed melee combatant, they get a free melee attack \nagainst you as you flee. To avoid this, you must make a Fighting \nWithdrawal first.\nMake a Fighting Withdrawal (Main Action): Disengage from \nan adjacent melee attacker, allowing you to move away from them \nwithout incurring a free attack as you retreat. You do not actually \nleave melee range with this action alone, and your enemy can simply \nre-engage you next round if you don’t actually take a move action \nto retreat.\nUse a Skill (Main Action): Perform first aid on a downed comrade, \ncry out an appeal for parley, or otherwise use a skill that wouldn’t \nnormally take more than six seconds.\nReady or Stow an Item (Main Action): A character can Ready \nan item for use from their pack or stowage or Stow it, as per the en-\ncumbrance rules. Sheathing or holstering a Readied weapon without \nactually Stowing it does not require this action, though the GM may \ndisallow rapid weapon swaps if they start to become implausible.\nReload a Weapon (Main Action): Reload a crossbow from a \nReadied case of quarrels. Bows and crossbows may be reloaded as \nan On Turn action if the shooter has at least Shoot-1 skill; otherwise \nit’s a Move action to nock a new arrow in a bow.\nDrop an Item (Instant Action): Drop an item you are holding. This \nmay be done at any time to free up a hand.\nPick up an Item (Move Action): Scoop up a dropped item within \nmelee range, leaving it Readied in your hand.\nStand Up (Move Action): Rise from a prone position, picking up \nany dropped items as you do so.\nGo Prone (On Turn Action): Fall prone, applying a -2 penalty to \nranged attacks against you and a +2 bonus to melee-range attacks \nagainst you. Your normal movement rate is halved while you remain \nprone.\nHold An Action (Move Action): Spend your Move action to de-\nlay acting on your side’s turn. You may trigger the rest of your turn’s \nactions as an Instant action at any point until the end of the round, \nafter which they are lost. If your held action is taken in response to \nsomeone else’s action, yours resolves first.\nSituation\nMod","ru":"Перечисленные ниже действия — лишь некоторые из самых частых в бою.\n**Атаковать в ближнем бою (Основное действие):** Атаковать цель на дистанции ближнего боя безоружной атакой или оружием ближнего боя. Такое оружие использует навык Кулак или Клинок, в зависимости от типа атаки.\n**Атаковать в свалке (Основное действие):** Выбери врага в пределах дистанции своего оружия и совершай это действие, пока по этой цели в этом раунде не выполнят Атаковать в свалке до четырёх союзников. В этот момент или в любой момент до него один из этих нападающих может выполнить по цели Атаковать в ближнем бою или Атаковать на расстоянии с бонусом +2 к попаданию и +1 к урону за каждого другого нападающего, максимум +6 к попаданию и +3 к урону. Этот дополнительный урон не добавляется к Шоку атаки и не может поднять урон выше обычного максимума. Однако любой Шок от этой атаки применяется всегда — даже если КЗщ цели слишком высок, она использует щит или у неё есть способность, делающая её невосприимчивой к Шоку; урон Атаки в свалке — это не совсем Шок, а отражение неизбежных опасностей положения, когда тебя облепила куча вооружённых врагов.\n**Атаковать на расстоянии (Основное действие):** Атаковать цель из лука или метательным оружием. Для таких атак используется навык Стрельба, хотя для метательного оружия можно по желанию взять Клинок или Атлетику. Если на дистанции ближнего боя есть нападающий враг, одноручное дальнобойное и метательное оружие получают штраф -4 к попаданию, а из луков и другого двуручного дальнобойного оружия вообще нельзя стрелять.\n**Атаковать навскидку (Мгновенное действие):** Мгновенным действием откажись от своего Основного действия и выполни Атаковать в ближнем бою или Атаковать на расстоянии со штрафом -4 к попаданию. Так как это Мгновенное действие, Атаковать навскидку можно даже не в свой ход, но ты не должен был к этому моменту потратить своё Основное действие в этом раунде. Только хорошо обученные и дисциплинированные NPC достаточно собранны, чтобы Атаковать навскидку.\n**Бежать (Действие перемещения):** Переместись на свою обычную скорость перемещения в бою — для обычного человека это 30 футов. Если ты начинаешь перемещение вплотную к вооружённому бойцу ближнего боя, он получает бесплатную атаку ближнего боя по тебе, пока ты убегаешь. Чтобы этого избежать, надо сначала совершить Боевой отход.\n**Боевой отход (Основное действие):** Разорви сцепку с находящимся вплотную атакующим ближнего боя — это позволит тебе отойти от него, не получив бесплатной атаки при отступлении. Само это действие ещё не выводит тебя за дистанцию ближнего боя, и враг может просто снова сойтись с тобой в следующем раунде, если ты не потратишь действие перемещения на отход.\n**Бросить предмет (Мгновенное действие):** Брось предмет, который держишь. Это можно сделать в любой момент, чтобы освободить руку.\n**Взять или уложить предмет (Основное действие):** Персонаж может перевести предмет в готовность из своего рюкзака или укладки либо уложить его — по правилам загруженности. Убрать оружие в готовности в ножны или в кобуру, не укладывая его при этом, можно и без этого действия, хотя Мастер может запретить быстрые смены оружия, если они начнут выглядеть неправдоподобно.\n**Встать (Действие перемещения):** Поднимись из положения лёжа, попутно подобрав любые выпавшие предметы.\n**Лечь (Действие в свой ход):** Упади на землю: дальнобойные атаки по тебе получают штраф -2, а атаки с дистанции ближнего боя — бонус +2. Пока ты лежишь, твоя обычная скорость перемещения уменьшена вдвое.\n**Отложить действие (Действие перемещения):** Потрать своё Действие перемещения, чтобы отложить действия в ход своей стороны. Ты можешь запустить остальные действия своего хода Мгновенным действием в любой момент до конца раунда, после чего они теряются. Если твоё отложенное действие совершается в ответ на действие кого-то другого, твоё разрешается первым.\n**Перезарядить оружие (Основное действие):** Перезаряди арбалет из колчана болтов в готовности. Луки и арбалеты можно перезаряжать Действием в свой ход, если у стрелка есть хотя бы Стрельба-1; иначе наложить новую стрелу на тетиву лука — Действие перемещения.\n**Поднять предмет (Действие перемещения):** Подхвати упавший предмет в пределах дистанции ближнего боя — он оказывается в готовности у тебя в руке.\n**Полная защита (Мгновенное действие):** Откажись от Основного действия, чтобы полностью сосредоточиться на уклонении от летящих в тебя опасностей. Твои Классы защиты ближнего и дальнего боя растут на +2, и ты становишься невосприимчив к Шоку до начала своего следующего хода — включая обычно неотвратимый урон от Атаки в свалке. Нельзя совершить это действие, если ты уже потратил своё Основное действие в этом раунде.\n**Прикрыть союзника (Действие перемещения):** Переместись на свою обычную скорость перемещения, чтобы встать вплотную к союзнику. После этого ты физически перекрываешь атаки по нему до начала своего следующего хода, пока он остаётся в пределах 3 метров от тебя. Враги, атакующие твоего опекаемого, должны сделать успешную встречную проверку боевого навыка против тебя, используя Сил или Лов и наиболее подходящий боевой навык. Если враг преуспел, его атака нормально бьёт по опекаемому. Если преуспел ты, его атака вместо этого нацеливается на тебя. За раунд ты можешь прикрывать от числа атакующих, равного твоему высшему боевому навыку; то есть для успешного прикрытия нужен хотя бы уровень-1 в боевом навыке. Одну цель могут прикрывать несколько защитников — тогда встречная проверка навыка сравнивается со всеми защитниками, и атака нацеливается на успешного защитника с худшим броском. Прикрывать можно только от атак, которые ты реально мог бы физически парировать или принять на себя телом.\n**Применить навык (Основное действие):** Оказать первую помощь упавшему товарищу, выкрикнуть призыв к переговорам или иначе применить навык, на который обычно уходит не больше шести секунд.\n**Рывок (Особое действие):** Потрать и Основное действие, и Действие перемещения, чтобы переместиться по прямой на удвоенную обычную скорость перемещения и в конце совершить атаку ближнего боя или метательную дальнобойную атаку с бонусом +2 к попаданию. Тебе нужно пробежать не меньше 3 метров, чтобы набрать разгон, и до конца раунда ты получаешь штраф -2 к своим Классам защиты."},{"n":"2.4.5","l":3,"te":"Combat Attack Rolls","tr":"Броски атаки в бою","en":"When an assailant makes an attack, they roll 1d20 and add their \nbase attack bonus, the weapon’s relevant attribute modifier, and their \nrelevant combat skill level. If they lack even level-0 in the appropriate \ncombat skill, they apply a -2 penalty to the roll. If the total is equal \nor greater than the target’s relevant Melee or Ranged Armor Class, \nthey hit. If less, they miss.\nEvery weapon listed in the equipment section is listed as using \none or more attributes, such as either Str or Dex for a dagger. The \nattacker may choose either attribute for modifying the weapon’s \nattack and damage rolls.","ru":"Когда нападающий атакует, он бросает 1d20 и прибавляет свой базовый бонус атаки, модификатор подходящей для оружия характеристики и свой подходящий уровень боевого навыка. Если у него нет даже уровня-0 в нужном боевом навыке, он получает штраф -2 к броску. Если сумма равна подходящему Классу защиты цели — ближнего или дальнего боя — или больше него, это попадание. Если меньше — промах.\nДля каждого оружия в разделе снаряжения указана одна или несколько используемых характеристик — например, Сил или Лов для кинжала. Атакующий может выбрать любую из них для модификации бросков атаки и урона этим оружием."},{"n":"2.4.5.1","l":4,"te":"NPC Attack Rolls","tr":"Броски атаки NPC","en":"NPCs usually do not have attribute modifiers or skill levels. Instead, \nthe attack bonus of a trained NPC combatant is usually equal to their \nhit dice, often with an additional bonus to reflect particularly good \ntraining or talent.","ru":"У NPC обычно нет модификаторов характеристик и уровней навыков. Вместо этого бонус атаки обученного бойца-NPC обычно равен его Костям здоровья, часто с дополнительным бонусом, отражающим особенно хорошую подготовку или талант."},{"n":"2.4.5.2","l":4,"te":"Attack Roll Modifiers","tr":"Модификаторы броска атаки","en":"Some common situations can modify an attack roll, granting a bonus \nor penalty. GMs may add others depending on the situation.\nShooting at a distant prone foe\n-2\nAttacking an adjacent prone foe\n+2\nMelee attacking while prone\n-4\nYour target is past your bow or thrown weapon’s normal\nrange, up to its maximum long range.\n-2\nThe target is at least half behind cover\n-2\nThe target is almost completely in cover\n-4\nMaking a thrown attack while in melee\n-4\nThrowing a weapon while in melee\n-4\nShooting a bow or crossbow while in melee\nN/A\nYou are shooting at a target you can’t see but you know \nwhere they are.\n-4\nYou are shooting at a target you can’t see and don’t\nknow their exact position.\nN/A","ru":"Некоторые типичные ситуации могут изменить бросок атаки, давая бонус или штраф. Мастер может добавить и другие, в зависимости от обстановки.\n\n| Модификатор | Обстоятельство |\n|---|---|\n| -2 | Стрельба по лежащей цели не вплотную. |\n| +2 | Атака по лежащей цели вплотную. |\n| -4 | Атака в ближнем бою из положения лёжа. |\n| -2 | Цель дальше обычной дистанции твоего лука или метательного оружия, но в пределах его максимальной дальней дистанции. |\n| -2 | Цель как минимум наполовину за укрытием. |\n| -4 | Цель почти полностью за укрытием. |\n| -4 | Метательная атака, когда ты в ближнем бою. |\n| -4 | Бросок оружия, когда ты в ближнем бою. |\n| невозможно | Стрельба из лука или арбалета, когда ты в ближнем бою. |\n| -4 | Ты стреляешь в цель, которую не видишь, но знаешь, где она. |\n| невозможно | Ты стреляешь в цель, которую не видишь и не знаешь её точного положения. |"},{"n":"2.4.6","l":3,"te":"Damage and Shock","tr":"Урон и Шок","en":"If an attack hits, it inflicts hit point damage equal to the weapon’s \ndamage die plus the weapon’s relevant attribute modifier. Special \nweapon mods or abilities may increase this damage.","ru":"Если атака попадает, она наносит урон пунктам здоровья, равный кости урона оружия плюс модификатор подходящей для оружия характеристики. Особые моды оружия или способности могут увеличить этот урон."},{"n":"2.4.6.1","l":4,"te":"Non-Lethal Damage","tr":"Нелетальный урон","en":"You may attack non-lethally with an appropriate weapon or unarmed \nattack. Your attacks will only incapacitate the target if you reduce \nthem to zero hit points.","ru":"Ты можешь атаковать нелетально подходящим оружием или безоружной атакой. Такие атаки лишь обездвижат цель, когда ты снизишь её пункты здоровья до нуля."},{"n":"2.4.6.2","l":4,"te":"Punch Weapon Damage","tr":"Урон оружия Кулака","en":"If you are making a purely unarmed attack you may add your Punch \nskill to the damage. You may not add the skill to the damage done \nby artificial weaponry that uses the Punch skill.","ru":"Если ты совершаешь чисто безоружную атаку, можешь прибавить к урону свой навык Кулак. Нельзя прибавлять этот навык к урону искусственного оружия, использующего навык Кулак."},{"n":"2.4.6.3","l":4,"te":"Trauma","tr":"Травма","en":"Trauma Dice are optional in the typical fantasy setting of this game,\nthough GMs may choose to use them if they wish to further increase \nthe peril of combat. Statistics for weapon Trauma Dice and armor \nTrauma Target improvements are given in the Cities Without Number \nSRD.\nIf you use this rule, then when you hit with a weapon or lethally-in-\ntended unarmed attack, roll the weapon’s associated Trauma Die. \nIf it equals or exceeds the victim’s Trauma Target, which is usually 6 \nfor a normal unarmored human, you have inflicted a Traumatic Hit.\nTraumatic Hits multiply the total damage of the hit by the weap-\non’s listed Trauma Rating. Thus, if a shotgun with a x3 Trauma Rating \nwould normally have done 9 damage in total, it instead does 27. If \nthis damage or any later damage in the same fight reduces the victim \nto zero hit points, they risk a Major Injury.\nSome abilities or heavy armor may increase a subject’s Trauma \nTarget. Some other abilities might grant a bonus to the Trauma Die \nroll. To speed the process, it’s generally best to roll the Trauma Die at \nthe same time as the attack or damage roll.\nVehicles and other inanimate objects are immune to Traumatic Hits \nfrom weapons that could not reasonably inflict catastrophic structural \ndamage on them.","ru":"Кости травмы необязательны в типичном фэнтезийном сеттинге этой игры, но Мастера могут использовать их, если хотят сделать бой ещё опаснее. Статистика Костей травмы оружия и улучшений Порога травмы у брони приведена в SRD «Городов без числа».\nЕсли ты используешь это правило, то при попадании оружием или безоружной атакой, которой намерен убить, брось Кость травмы этого оружия. Если результат не меньше Порога травмы жертвы — обычно 6 для обычного человека без брони, — ты нанёс Травматичное попадание.\nТравматичное попадание умножает суммарный урон попадания на указанный Множитель травмы оружия. Так, если дробовик с Множителем травмы ×3 обычно нанёс бы 9 урона в сумме, вместо этого он наносит 27. Если этот урон — или любой позднейший урон в том же бою — снижает пункты здоровья жертвы до нуля, ей грозит Серьёзная травма.\nНекоторые способности или тяжёлая броня могут повышать Порог травмы. Другие способности могут давать бонус к броску Кости травмы. Чтобы ускорить процесс, Кость травмы обычно лучше всего бросать одновременно с броском атаки или урона.\nТранспорт и другие неодушевлённые объекты невосприимчивы к Травматичным попаданиям от оружия, которое по здравому смыслу не могло бы нанести им катастрофических повреждений конструкции."},{"n":"2.4.6.4","l":4,"te":"Shock","tr":"Шок","en":"Some melee weapons inflict Shock on a missed attack roll. This dam-\nage reflects the inevitable harm a poorly-armored combatant suffers \nwhen engaging in armed combat. Shock for a weapon is recorded \nas a point value and target Armor Class, such as “Shock 2/15”. If \nthe wielder misses a target with this weapon that has a Melee Armor \nClass equal or less than the weapon’s Shock rating, they suffer the \nlisted amount of damage anyway. Thus, if that weapon were to miss \na victim with Melee AC 13, it would still do 2 points of damage.\nSome attacks apply Shock on a miss regardless of the target’s \nArmor Class. This benefit may be granted by certain abilities, or it \nmay be part of a dangerous NPC’s talents. Such Shock ratings are \nrecorded with “-” as the affected AC, such as “Shock 5/-”. This \nautomatic Shock is still negated by shields or abilities that grant a \nsubject immunity to Shock.\nThe only modifiers that add to Shock damage are the wielder’s \nrelevant attribute modifier for the weapon and any damage bonuses \nthat explicitly add to Shock. Thus, the Killing Blow class ability adds \nto Shock because it specifically says so, while a weapon mod that \nmerely says it adds +2 damage would not.\nA person using a shield can ignore the first source of Shock they \nwould normally suffer in a round. Some other Foci or special actions \nsuch as Total Defense can also render a subject immune to Shock.\nAn attack that hits can never do less damage than the Shock that \nwould have been inflicted on a miss. If using the Trauma rules, dam-\nage inflicted by Shock cannot cause a Traumatic Hit.","ru":"Некоторое оружие ближнего боя наносит Шок при промахе. Этот урон отражает неизбежный вред, который терпит плохо защищённый боец, ввязавшись в вооружённую схватку. Шок оружия записывается как значение в пунктах и целевой Класс защиты, например «Шок 2/15». Если владелец такого оружия промахивается по цели, чей КЗщ ближнего боя равен рейтингу Шока оружия или меньше него, цель всё равно получает указанный урон. Так, промахнись это оружие по жертве с КЗщ ближнего боя 13, оно всё равно нанесло бы 2 пункта урона.\nНекоторые атаки наносят Шок при промахе независимо от Класса защиты цели. Такое преимущество могут давать определённые способности, или оно может быть частью талантов опасного NPC. Такие рейтинги Шока записываются с «–» вместо затрагиваемого КЗщ, например «Шок 5/–». Этот автоматический Шок всё равно отменяется щитами и способностями, дающими невосприимчивость к Шоку.\nЕдинственные модификаторы, добавляемые к урону Шока, — подходящий для оружия модификатор характеристики владельца и бонусы к урону, которые явно добавляются к Шоку. Так, классовая способность «Смертельный удар» добавляется к Шоку, потому что прямо об этом говорит, а мод оружия, который просто даёт +2 к урону, — нет.\nЧеловек со щитом может проигнорировать первый источник Шока, который должен был бы задеть его в раунде. Некоторые другие Фокусы и особые действия вроде Полной защиты тоже могут дать невосприимчивость к Шоку.\nАтака, которая попала, никогда не наносит меньше урона, чем Шок, который она нанесла бы при промахе. Если используются правила Травмы, урон от Шока не может вызвать Травматичное попадание."},{"n":"2.4.7","l":3,"te":"Special Combat Maneuvers","tr":"Особые боевые манёвры","en":"There are certain special maneuvers or activities that commonly arise \nin combat.","ru":"Есть особые манёвры и занятия, которые часто возникают в бою."},{"n":"2.4.7.1","l":4,"te":"Shoving and Grappling","tr":"Толчок и захват","en":"To shove a target the attacker must make a successful melee attack. \nThis attack does no damage, but forces an opposed Str/Exert or Str/\nPunch skill check. If the attacker wins, the target is shoved back up to \n3 meters or knocked prone at the attacker’s discretion.\nTo grapple, the attacker must make a successful unarmed melee \nattack while having both hands free. This attack does no damage \nbut forces an opposed Str/Punch skill check. If the attacker wins, \nthe victim is grappled. A grappled victim remains so until they take a \nMain Action to perform a successful opposed Str/Punch skill check \nagainst their assailant.\nWhile grappled, neither the assailant or the target can move from \ntheir location, nor can they fight with anything but unarmed attacks, \nincluding fangs or claws for creatures equipped with such. At the end \nof each round, a grappled victim automatically suffers damage as if \nhit by their assailant’s unarmed attack.\nIf the attacker wishes to move the grappled target, they must spend \na Main Action and make an opposed Str/Punch skill check. On a \nsuccess, they move the target up to 10 feet along with them or throw \nthem 5 feet and leave them prone. On a loss or tie, the target escapes.\nAn attacker can grapple only one target at a time, but a defend-\ner can be grappled by multiple assailants, within reason. Any skill \nchecks forced on a multiply-grappled target are compared against \nall assailants, and win only if all assailant rolls are beaten.\nThese rules assume both assailant and target are relatively hu-\nman-sized. Grappling or shoving humanoid but substantially larger \ntargets is done with a -2 penalty on all skill checks, while trying to \nhandle quadrupeds or those only barely plausible to wrestle is done \nat a -4 penalty.","ru":"Чтобы толкнуть цель, атакующий должен совершить успешную атаку ближнего боя. Эта атака не наносит урона, но вынуждает встречную проверку Сил/Атлетика или Сил/Кулак. Если атакующий победил, цель отбрасывается назад на расстояние до 3 метров или сбивается наземь, на усмотрение атакующего.\nЧтобы взять в захват, атакующий должен совершить успешную безоружную атаку ближнего боя, имея обе руки свободными. Эта атака не наносит урона, но вынуждает встречную проверку Сил/Кулак. Если атакующий победил, жертва оказывается в захвате. Жертва остаётся в захвате, пока не потратит Основное действие на успешную встречную проверку Сил/Кулак против нападающего.\nПока длится захват, ни нападающий, ни цель не могут сдвинуться с места и не могут драться ничем, кроме безоружных атак, — включая клыки и когти у существ, которые ими наделены. В конце каждого раунда жертва в захвате автоматически получает урон, как от попадания безоружной атаки нападающего.\nЕсли атакующий хочет переместить цель в захвате, он должен потратить Основное действие и сделать встречную проверку Сил/Кулак. При успехе он перемещает цель вместе с собой на расстояние до 10 футов или отбрасывает её на 5 футов, оставляя лежать. При проигрыше или ничьей цель вырывается.\nАтакующий может держать в захвате только одну цель за раз, но одного защищающегося могут схватить несколько нападающих — в разумных пределах. Любые проверки навыков, вынужденные для цели в захвате нескольких противников, сравниваются со всеми нападающими и выигрываются, только если побиты броски всех нападающих.\nЭти правила предполагают, что и нападающий, и цель примерно человеческого размера. Захват или толчок гуманоидных, но существенно более крупных целей идёт со штрафом -2 ко всем проверкам навыков, а возня с четвероногими или теми, кого бороть едва правдоподобно, — со штрафом -4."},{"n":"2.4.7.2","l":4,"te":"Dual-Wielding Weapons","tr":"Бой двумя оружиями","en":"Some attackers prefer to use two weapons at once. PCs who wish to \ndo so must have at least level-1 in the relevant weapon skills, such as \nStab-1 and Shoot-1 for dual-wielding a knife and hand crossbow.\nWhen making an attack while dual-wielding, the attacker chooses \nwhich weapon they wish to use, rolling the attack roll accordingly. \nOn a hit, the weapon does +2 damage so long as the target is within \nrange of both wielded weapons. This bonus does not add to Shock.\nManaging two weapons at once is difficult, and applies a -1 \npenalty to all hit rolls.","ru":"Некоторые бойцы предпочитают драться двумя оружиями сразу. ПИ, который этого хочет, должен иметь хотя бы уровень-1 в подходящих оружейных навыках — например, Клинок-1 и Стрельба-1 для боя ножом и ручным арбалетом.\nАтакуя с двумя оружиями, атакующий выбирает, каким оружием бьёт, и соответственно делает бросок атаки. При попадании оружие наносит +2 к урону, пока цель в пределах дистанции обоих оружий в руках. Этот бонус не добавляется к Шоку.\nУправляться с двумя оружиями сразу трудно: это даёт штраф -1 ко всем броскам на попадание."},{"n":"2.4.7.3","l":4,"te":"Execution Attacks","tr":"Казнящие атаки","en":"A target that is entirely unsuspecting of danger is subject to execution \nattacks. A subject that is expecting danger or alert to potential harm \ncannot be targeted by an execution attack.\nA ranged execution attack requires one full minute of aiming, \nwaiting, and adjusting on the part of the would-be sniper. Any distur-\nbance during this time will spoil the shot. After spending this time, the \nassassin may make a Dex/Shoot skill check. The difficulty is 6 for an \nattack within two meters, 8 for an attack within the weapon’s normal \nrange, or 10 for one at the weapon’s long range. On a success, the \nattack hits; the victim’s Armor Class is ignored.\nA melee execution attack requires one full minute of near proximity \nto the target, watching for just the right opening and getting to within \nmelee range of the victim. If this time is granted, the assassin may\nmake a melee attack, automatically hitting.\nWhen a target is hit with an execution attack they must make a \nPhysical saving throw at a penalty equal to the assailant’s combat \nskill. On a failure, they are immediately reduced to zero hit points \nand Mortally Wounded, or knocked unconscious if the weapon was \nnon-lethal.\nIf they succeed on the save, they still take maximum damage \nfrom the hit. If using the Trauma rules, damage is rolled normally but \nsuccessful execution attacks always count as Traumatic Hits, so the \nensuing multiplied damage or Major Injury may be enough to kill \nin of itself.","ru":"Цель, которая совершенно не подозревает об опасности, уязвима для казнящих атак. Того, кто ожидает опасности или настороже, казнящей атакой атаковать нельзя.\nДальнобойная казнящая атака требует полной минуты прицеливания, выжидания и подстройки со стороны будущего снайпера. Любая помеха за это время сорвёт выстрел. Потратив это время, убийца может сделать проверку Лов/Стрельба. Сложность — 6 для атаки в пределах двух метров, 8 для атаки в пределах обычной дистанции оружия, 10 — на его дальней дистанции. При успехе атака попадает; Класс защиты жертвы игнорируется.\nКазнящая атака в ближнем бою требует полной минуты рядом с целью: убийца выжидает подходящий момент и подбирается на дистанцию ближнего боя к жертве. Если это время у него было, он может совершить атаку ближнего боя, попадающую автоматически.\nКогда по цели попадает казнящая атака, она должна сделать Физический спасбросок со штрафом, равным боевому навыку нападающего. При провале она немедленно снижается до нуля пунктов здоровья и становится смертельно раненной — или теряет сознание, если оружие было нелетальным.\nЕсли спасбросок удался, цель всё равно получает максимальный урон от попадания. Если используются правила Травмы, урон бросается как обычно, но успешные казнящие атаки всегда считаются Травматичными попаданиями, так что итоговый умноженный урон или Серьёзная травма могут оказаться смертельными сами по себе."},{"n":"2.5.0","l":2,"te":"Injury, Healing, and System Strain","tr":"Раны, лечение и Системная нагрузка","en":"Injury is almost inevitable in an adventurer’s career. Some forms of it \ncan be longer-lasting than others.","ru":"Раны в карьере искателя приключений почти неизбежны. Некоторые из них держатся дольше других."},{"n":"2.5.1","l":3,"te":"Mortal Injury and Stabilization","tr":"Смертельные ранения и стабилизация","en":"When a PC is reduced to zero hit points by a lethal attack, they are \nMortally Injured. They will die at the end of the sixth round after their \nincapacitation unless stabilized by an ally or some special ability. \nA Mortally Wounded character is helpless, and can take no actions \nand do nothing useful.\nStabilizing an ally is usually a Main Action that requires a Dex/\nHeal or Int/Heal skill check. The difficulty is 8 plus the number of full \nrounds since the target fell. If the medic lacks a healer’s kit or other \ntools, this difficulty is increased by 2. Only one ally can try to stabilize \na victim per round, though others can attempt to aid their check, but \nattempts may be retried each round for as long as hope lasts.\nOnce stabilized the victim remains incapacitated for ten minutes \nbefore recovering with 1 hit point and the Frail condition. They may \nact normally after they recover, but if they are reduced to zero hit \npoints again while still Frail, they die instantly. Frailty is removed by \na week of bed rest and medical care. A physician can also make \none attempt to remove Frailty with a healer’s kit and an hour of work, \nrolling a Dex/Heal or Int/Heal skill check against difficulty 10.","ru":"Когда пункты здоровья ПИ сведены к нулю летальной атакой, он смертельно раненный. Он умрёт в конце шестого раунда после того, как был обездвижен, если его не стабилизирует союзник или какая-нибудь особая способность. Смертельно раненный персонаж беспомощен: он не может совершать действия и делать что-либо полезное.\n\nСтабилизация союзника обычно требует Основного действия и проверки Лов/Медицина или Инт/Медицина. Сложность — 8 плюс число полных раундов с момента падения цели. Если у медика нет сумки лекаря или других инструментов, сложность повышается на 2. Стабилизировать жертву за раунд может пытаться только один союзник, хотя остальные могут помогать его проверке; попытки можно повторять каждый раунд, пока жива надежда.\n\nПосле стабилизации жертва остаётся обездвиженной десять минут, после чего приходит в себя с 1 пунктом здоровья и состоянием Хилость. Дальше она может действовать нормально, но если её пункты здоровья снова сведут к нулю, пока она Хилая, она умирает мгновенно. Хилость снимается неделей постельного режима и медицинского ухода. Врач также может сделать одну попытку снять Хилость с сумкой лекаря и часом работы: проверка Лов/Медицина или Инт/Медицина против сложности 10."},{"n":"2.5.1.1","l":4,"te":"NPCs and Mortal Injury","tr":"NPC и смертельные ранения","en":"NPCs who aren’t important enough to merit a name usually die in-\nstantly when reduced to zero hit points.","ru":"NPC, которые недостаточно важны, чтобы иметь имя, обычно умирают мгновенно, когда их пункты здоровья сведены к нулю."},{"n":"2.5.1.2","l":4,"te":"Catastrophic Damage","tr":"Катастрофический урон","en":"Targets reduced to zero hit points by some injury or cause that could \nnot be reasonably survivable are instantly killed. An arrow hole might \nbe patched; a direct hit with a house-sized boulder or a plunge off \na thousand-foot precipice is less survivable. What counts as “not \nreasonably survivable” may vary with inhumanly durable targets.","ru":"Цели, чьи пункты здоровья сведены к нулю раной или причиной, которую нельзя разумно пережить, погибают мгновенно. Дыру от стрелы можно залатать; прямое попадание валуна размером с дом или падение с тысячефутового обрыва переживаются хуже. Что считать «нельзя разумно пережить», может меняться для нечеловечески прочных целей."},{"n":"2.5.1.3","l":4,"te":"Non-Lethal Incapacitation","tr":"Нелетальное обездвиживание","en":"If a target is brought to zero hit points by a non-lethal attack, they \nare incapacitated for ten minutes before regaining 1 hit point. They \ndo not become Frail.","ru":"Если цель сведена к нулю пунктов здоровья нелетальной атакой, она обездвижена на десять минут, после чего восстанавливает 1 пункт здоровья. Хилой она не становится."},{"n":"2.5.2","l":3,"te":"System Strain","tr":"Системная нагрузка","en":"Magical forms of healing or use of powerful augmenting magic can \ntake a toll on a user’s physiology. Their System Strain total reflects \nthe total amount of stress their body has undergone.\nA healthy character normally starts at zero System Strain and has \ntheir Constitution score as their allowed maximum. A character cannot \naccumulate more than this maximum in System Strain.\nMagical healing and certain spells and abilities will add to a \nsubject’s System Strain. If this addition would put them over their \nmaximum they cannot activate the spell, benefit from healing, or \notherwise gain any use from the ability. If they are forced over the \nmaximum by some unavoidable effect, they are instead knocked \nunconscious for at least an hour.\nCharacters lose one point of accumulated System Strain after each \nnight’s rest, assuming they are warm, fed, and comfortable and can \nget at least eight uninterrupted hours of sleep. Cold camps, stony \nbedding, and other sources of privation prevent this recuperation.","ru":"Магические способы лечения и мощная усиливающая магия берут дань с физиологии пользователя. Его суммарная Системная нагрузка отражает общий объём стресса, перенесённого телом.\n\nЗдоровый персонаж обычно начинает с нулевой Системной нагрузкой, а её допустимый максимум равен его значению Телосложения. Персонаж не может накопить Системной нагрузки больше этого максимума.\n\nМагическое исцеление и некоторые заклинания и способности добавляют цели Системную нагрузку. Если такая добавка вывела бы её за максимум, она не может активировать заклинание, получить пользу от исцеления или как-то иначе воспользоваться способностью. Если её выводит за максимум какой-то неизбежный эффект, вместо этого она падает без сознания минимум на час.\n\nПерсонажи теряют один пункт накопленной Системной нагрузки после каждой ночи отдыха — при условии, что им тепло, они сыты, им удобно и они могут проспать не меньше восьми часов без помех. Холодная стоянка, каменистая постель и прочие лишения не дают так восстановиться."},{"n":"2.5.3","l":3,"te":"Natural Healing","tr":"Естественное исцеление","en":"A wounded creature can recover hit points by getting a good night’s \nrest and adequate food. Provided they are warm, fed, and comfort-\nable, they regain hit points each morning equal to their experience \nlevel, or equal to their hit dice if they are NPCs. Characters suffering \nsome form of privation do not recover hit points through sleep.\nFrail creatures do not recover hit points through natural healing. \nThey must cure their Frail condition first or rely on pharmaceuticals. \nRemoving the Frail condition requires a full week of bed rest and the \nmedical attention of someone with at least Heal-0 skill and a healer’s \nkit. Frail victims without this level of medical care must make a Physical \nsave after a week; on a failure they die sometime in the next week, \nwhile success means they lose their Frailty after another month’s rest.","ru":"Раненое существо может восстановить пункты здоровья, хорошо выспавшись и нормально поев. Если ему тепло, оно сыто и ему удобно, каждое утро оно восстанавливает пункты здоровья в количестве, равном своему уровню опыта, или равном своим Костям здоровья, если это NPC. Персонажи, страдающие от каких-либо лишений, не восстанавливают пункты здоровья во сне.\n\nХилые существа не восстанавливают пункты здоровья естественным исцелением. Сначала им нужно излечить Хилость — или полагаться на снадобья. Снятие Хилости требует полной недели постельного режима и медицинского ухода от того, у кого есть хотя бы навык Медицина-0 и сумка лекаря. Хилые жертвы без такого уровня медицинской помощи должны через неделю сделать Физический спасбросок: при провале они умрут в течение следующей недели, а при успехе теряют Хилость ещё через месяц отдыха."},{"n":"2.5.4","l":3,"te":"First Aid","tr":"Первая помощь","en":"Healers can patch up victims in a hurry, albeit at a cost to their phys-\nical resilience. By spending one minute patching up an ally with a \nhealer’s kit, a healer can heal 1d6 points of damage plus their Heal \nskill. If they lack any Heal skill at all, they restore 1d6-1 points. Each \nsuch application of first aid adds one System Strain to the target. \nFirst aid can restore hit points to a Frail target, but it cannot remove \ntheir Frailty.\nOne ten-minute turn is enough time for a healer to apply as much \nfirst aid as is wanted to the rest of their party.","ru":"Лекари умеют латать пострадавших наспех — но ценой их физической выносливости. Потратив минуту на перевязку союзника с сумкой лекаря, лекарь исцеляет 1d6 урона плюс свой навык Медицина. Если навыка Медицина у него нет вообще, он восстанавливает 1d6-1 пунктов. Каждое такое применение первой помощи добавляет цели одну Системную нагрузку. Первая помощь может восстановить пункты здоровья Хилой цели, но не может снять её Хилость.\n\nОдного десятиминутного хода лекарю хватает, чтобы оказать остальному отряду столько первой помощи, сколько нужно."},{"n":"2.5.5","l":3,"te":"Poisons and Diseases","tr":"Яды и болезни","en":"Most toxins force a victim to make a Physical saving throw to resist \ntheir effects or mitigate their harm. Weak perils might grant as much as \na +4 to the saving throw, while dire threats might apply a -4 penalty.\nIf the save is failed, the poison or disease takes hold. Most poisons \nact quickly, inflicting hit point damage, adding System Strain to the \ntarget, or applying long-lasting penalties. Diseases can have a slower \nonset but often apply the same sort of harms.\nA medic who gets to a poisoned person within a minute of the \npoisoning can use a healer’s kit to give them a better chance to resist. \nThey may add twice their Heal skill level to the victim’s saving throw \nroll, or +1 if they have only Heal-0 skill. Specialized antitoxins may \nbe able to neutralize such poisons entirely.","ru":"Большинство токсинов заставляет жертву сделать Физический спасбросок, чтобы сопротивляться их действию или уменьшить вред. Слабые угрозы могут давать до +4 к спасброску, а страшные — штраф -4.\n\nЕсли спасбросок провален, яд или болезнь берёт своё. Большинство ядов действует быстро: наносит урон пунктам здоровья, добавляет цели Системную нагрузку или накладывает долгие штрафы. Болезни могут развиваться медленнее, но вредят часто так же.\n\nМедик, который добрался до отравленного в течение минуты после отравления, может сумкой лекаря дать ему больше шансов устоять. Он добавляет к броску спасброска жертвы удвоенный уровень своего навыка Медицина, или +1, если у него только Медицина-0. Специализированные противоядия могут полностью нейтрализовать такие яды."},{"n":"2.6.0","l":2,"te":"Chases and Pursuit","tr":"Погони и преследование","en":"Adventurers have a habit of chasing after others and being chased \nin turn. The specific rules used vary depending on whether it’s a foot \nchase or mounted pursuit.","ru":"У искателей приключений есть привычка гоняться за другими и удирать самим. Конкретные правила зависят от того, пешая это погоня или конная."},{"n":"2.6.1","l":3,"te":"Foot Chases","tr":"Пешие погони","en":"The group member in the fleeing party with the best Dex/Exert or \nCon/Exert total rolls a skill check. Their result is the fleeing group’s \npace, as they help and encourage the slower members.\nOther fleeing group members then hinder pursuit in whatever \nways they think are helpful. Sometimes a skill check is needed, while \nother times a GM will simply decide it works. Each successful effort \nadds a +1 bonus to the pace, up to +3 maximum. Botched efforts \nare either unhelpful or apply a -1 penalty if they’re actively harmful. \nIf the fleeing group is made up of NPCs, it’s the GM’s judgment as \nto whether any of them try to do something clever to stall the PCs.\nThe pursuing group then makes a single Dex/Exert or Con/Ex-\nert skill check, modified by the table below. If they beat the fleeing \ngroup’s total they catch up to them, and if they tie or roll less the \nfleeing party has escaped immediate pursuit.\nSituation\t\t\n\t\n\t\n\t\nMod\nThere are more pursuers than pursued\t\n-1\nThe pursued have no head start at all\t\t\n+2\n “ have one round’s head start\t\n\t\n+1\n “ have less than a minute’s head start\t\n+0\n “ have more than a minute’s head start\t\n-2\nWho knows the local terrain better?\t \t\n-2 to +2\nThe pursuit is half-hearted or obligatory\t\n-1\nThe pursuers are enraged or vengeful\t\n+1","ru":"Проверку навыка делает тот из убегающей группы, у кого лучшая сумма Лов/Атлетика или Тел/Атлетика. Его результат — темп убегающей группы: он помогает отстающим и подбадривает их.\n\nОстальные беглецы тем временем мешают погоне, как считают полезным. Иногда для этого нужна проверка навыка, а иногда Мастер просто решает, что затея сработала. Каждая удачная попытка добавляет к темпу +1, максимум до +3. Проваленные попытки либо бесполезны, либо дают штраф -1, если деятельно навредили. Если убегает группа NPC, Мастер сам решает, пытается ли кто-то из них выкинуть что-нибудь хитрое, чтобы задержать ПИ.\n\nЗатем преследующая группа делает одну проверку Лов/Атлетика или Тел/Атлетика с модификаторами из таблицы ниже. Если она превзошла итог беглецов — она их нагнала; при равенстве или меньшем результате убегающая группа оторвалась от непосредственной погони.\n\n| Ситуация | Мод. |\n|---|---|\n| Преследователей больше, чем беглецов | -1 |\n| У беглецов нет никакой форы | +2 |\n| У беглецов фора в один раунд | +1 |\n| У беглецов фора меньше минуты | +0 |\n| У беглецов фора больше минуты | -2 |\n| Кто лучше знает местность? | от -2 до +2 |\n| Погоня ведётся нехотя или для галочки | -1 |\n| Преследователи разъярены или жаждут мести | +1 |"},{"n":"2.6.2","l":3,"te":"Mounted Chases","tr":"Конные погони","en":"For mounted or vehicular chases, the fleeing rider makes a Ride skill \ncheck, usually modified by Dexterity. This is the fleeing mount’s pace.\nEach pursuer then makes its own Dex/Ride skill check to catch \nup with the quarry, modified by the table below. Any of them who \ndon’t equal or exceed the fleeing mount’s pace fall behind and are \nlost from the pursuit. Any of them who do make the roll catch up to \nthe mount, and it usually becomes a matter of combat until the quarry \ncan make another escape attempt or win the ensuing battle.\nUnmounted pursuers cannot generally hope to catch up with \nmounted evaders over a short-term chase.\nSituation\t\t\n\t\n\t\n\t\nModifier\nThe pursuer can’t directly see the pursued\t\n-2\nThe pursuer is flying but the pursued isn’t\t\n+3\nThe pursued is flying but the pursuer isn’t\t\n-3\nA spotter is relaying the target’s position\t\n+1\nWho knows the local terrain better?\t \t\n-2 to +2\nThe pursuit is half-hearted or obligatory\t\n-1\nThe pursuers are enraged or vengeful\t\n+1\nThe cost for improving a skill is listed below. Every skill level must","ru":"Для погонь верхом или на повозках убегающий всадник делает проверку навыка Верховая езда, обычно с модификатором Ловкости. Это темп убегающего скакуна.\n\nКаждый преследователь затем делает собственную проверку Лов/Верховая езда, чтобы нагнать добычу, с модификаторами из таблицы ниже. Все, кто не сравнялся с темпом убегающего скакуна и не превзошёл его, отстают и выбывают из погони. Все, кому бросок удался, нагоняют скакуна — и дальше дело обычно решается боем, пока добыча не предпримет новую попытку побега или не выиграет схватку.\n\nПешие преследователи, как правило, не могут надеяться догнать конных беглецов в короткой погоне.\n\n| Ситуация | Модификатор |\n|---|---|\n| Преследователь не видит беглеца напрямую | -2 |\n| Преследователь летит, а беглец нет | +3 |\n| Беглец летит, а преследователь нет | -3 |\n| Наводчик сообщает положение цели | +1 |\n| Кто лучше знает местность? | от -2 до +2 |\n| Погоня ведётся нехотя или для галочки | -1 |\n| Преследователи разъярены или жаждут мести | +1 |"},{"n":"2.7.0","l":2,"te":"Character Advancement","tr":"Развитие персонажа","en":"Characters accumulate experience points through successful ad-\nventure completion or other activities appropriate to the campaign’s \nfocus. By default, PCs gain three experience points for an average \nsuccessful mission. When enough experience points have been accu-\nmulated, they advance an experience level. New characters begin at \nfirst level and can rise to a maximum of tenth under the default rules.\nThe requirements listed below are for “fast” campaigns, where PCs \nadvance in level relatively rapidly, and “slow” campaigns, where the \nadvancement is more measured. Individual GMs may alter these rates \nto suit their table’s needs. Experience points do not reset on leveling \nup; the totals listed are total points accumulated.\nExperience Point Requirements\nLevel\t\nFast\t\nSlow","ru":"Персонажи накапливают пункты опыта, успешно завершая приключения и занимаясь другими делами, соответствующими направленности кампании. По умолчанию ПИ получают три пункта опыта за среднюю успешную миссию. Накопив достаточно пунктов опыта, они поднимаются на новый уровень опыта. Новые персонажи начинают с первого уровня и по умолчанию могут дорасти максимум до десятого.\n\nТребования ниже даны для «быстрых» кампаний, где ПИ растут в уровнях довольно стремительно, и для «медленных», где развитие размереннее. Каждый Мастер может подстроить эти темпы под нужды своего стола. Пункты опыта при подъёме уровня не обнуляются: в таблице указаны суммарные накопленные значения.\n\n**Требования по пунктам опыта**\n\n| Уровень | Быстрая | Медленная |\n|---|---|---|\n| 1 | 0 | 0 |\n| 2 | 3 | 6 |\n| 3 | 6 | 15 |\n| 4 | 12 | 24 |\n| 5 | 18 | 36 |\n| 6 | 27 | 51 |\n| 7 | 39 | 69 |\n| 8 | 54 | 87 |\n| 9 | 72 | 105 |\n| 10 | 93 | 139 |"},{"n":"2.7.1","l":3,"te":"Advancement Benefits","tr":"Преимущества развития","en":"Whenever a character advances a level, they obtain certain benefits.","ru":"Каждый раз, когда персонаж поднимается на уровень, он получает определённые преимущества."},{"n":"2.7.1.1","l":4,"te":"Additional Hit Points","tr":"Дополнительные пункты здоровья","en":"To determine their new maximum hit points, they roll their hit die for \neach level they now possess, adding their Constitution modifier to \neach die, and a further +2 if they have the Die Hard Focus. No \nindividual die can be reduced below 1 point, even with a Consti-\ntution penalty. If the total roll is greater than their current maximum \nhit points, they take the roll. If less or equal, their maximum hit points \nincrease by one.","ru":"Чтобы определить новый максимум пунктов здоровья, персонаж бросает свою кость здоровья за каждый имеющийся теперь уровень, добавляя к каждой кости модификатор Телосложения и ещё +2, если у него есть Фокус «Живучий». Ни одна отдельная кость не может дать меньше 1 пункта даже при штрафе Телосложения. Если сумма броска больше текущего максимума пунктов здоровья, персонаж берёт её. Если меньше или равна — максимум пунктов здоровья вырастает на единицу."},{"n":"2.7.1.2","l":4,"te":"Improved Saving Throw","tr":"Улучшение спасбросков","en":"Their saving throw scores decrease by one, making it easier to suc-\nceed on saving throws by rolling equal or over it. As a first level \ncharacter has saving throw scores of 15, reaching second level would \nlower them to 14, modified by their appropriate attributes.","ru":"Пороги спасбросков персонажа снижаются на единицу: пройти спасбросок, выбросив столько же или больше, становится легче. У персонажа первого уровня пороги спасбросков равны 15, так что на втором уровне они опустятся до 14 — с поправкой на соответствующие характеристики."},{"n":"2.7.1.3","l":4,"te":"Improved Attack Bonus","tr":"Улучшение бонуса атаки","en":"A PC’s base attack bonus improves according to their level and their \nchosen class.","ru":"Базовый бонус атаки ПИ растёт согласно его уровню и выбранному классу."},{"n":"2.7.1.4","l":4,"te":"Gaining and Spending Skill Points","tr":"Получение и трата пунктов навыков","en":"A PC who advances a level gains three skill points they can spend \non improving their skills or save to spend later. Experts and Partial \nExperts with the Quick Learner class ability gain an extra bonus \nskill point to spend, giving them four points each time they advance.\nSkills that are gained or improved immediately on gaining a level \nare assumed to have been perfected over the past level and require \nno training time or teaching. If they save their skill points to spend \nthem later then they’ll need to find some teacher or other explanation \nfor developing them in the meanwhile.\nbe purchased in order; to gain level-1 in a skill you need to pay one \npoint for level-0 and then two points for level-1. A PC must be the \nrequisite minimum level to increase a skill to certain levels. Less hard-\nened adventurers simply don’t have the focus and real-life experience \nto attain such a pitch of mastery.\nA PC cannot “partially buy” a skill level. If they don’t have enough \nskill points to buy a new level, they need to save them up until they \ncan. A PC cannot develop skills beyond level-4.\nSkill\t\n\t\nPoint\t\n\t\nMin.\nLevel\t\n\t\nCost\t\n\t\nCharacter Level","ru":"ПИ, поднявшийся на уровень, получает три пункта навыков, которые может потратить на улучшение навыков или отложить на потом. Эксперты и частичные Эксперты с классовой способностью «Схватывает на лету» получают один дополнительный бонусный пункт навыка — по четыре пункта за каждый подъём.\n\nСчитается, что навыки, взятые или улучшенные сразу при подъёме уровня, оттачивались весь прошлый уровень и не требуют ни времени на обучение, ни учителя. Если же ПИ приберёг пункты навыков, чтобы потратить их позже, ему понадобится найти наставника или другое объяснение тому, откуда взялись новые умения.\n\nСтоимость улучшения навыка указана ниже. Каждый уровень навыка должен покупаться по порядку: чтобы получить в навыке уровень-1, нужно заплатить один пункт за уровень-0 и затем два пункта за уровень-1. Для повышения навыка до определённых уровней ПИ должен иметь требуемый минимальный уровень персонажа. Недостаточно закалённым искателям приключений попросту не хватает собранности и жизненного опыта, чтобы достичь такой высоты мастерства.\n\nПИ не может «купить уровень навыка частично». Если пунктов навыков на новый уровень не хватает, придётся копить, пока не наберётся. Развить навык выше уровня-4 нельзя.\n\n| Уровень навыка | Стоимость в пунктах | Мин. уровень персонажа |\n|---|---|---|\n| 0 | 1 | 1 |\n| 1 | 2 | 1 |\n| 2 | 3 | 3 |\n| 3 | 4 | 6 |\n| 4 | 5 | 9 |"},{"n":"2.7.1.5","l":4,"te":"Improving Attributes","tr":"Повышение характеристик","en":"A PC may optionally choose to use their new skill points to improve \ntheir attribute scores.\nThe first time a PC improves an attribute, it costs 1 skill point and \nadds +1 to an attribute of their choice. The second improvement to \ntheir attributes costs 2 skill points, the third 3, and so forth. Each im-\nprovement adds +1 to the attribute, potentially improving its modifier. \nA PC can only ever make five such improvements total; not five per \nattribute.\nPCs must be third level before buying their third boost, sixth level \nbefore buying their fourth boost, and ninth level before buying their \nfifth boost. No more than five attribute boosts can ever be purchased \nby a PC.","ru":"ПИ может по желанию тратить новые пункты навыков на улучшение значений своих характеристик.\n\nПервое улучшение характеристики стоит 1 пункт навыка и добавляет +1 к характеристике по выбору. Второе улучшение характеристик стоит 2 пункта навыков, третье — 3 и так далее. Каждое улучшение добавляет к характеристике +1 и может улучшить её модификатор. Всего ПИ может сделать не больше пяти таких улучшений — пяти вообще, а не пяти на характеристику.\n\nТретье повышение ПИ может купить не раньше третьего уровня, четвёртое — не раньше шестого, а пятое — не раньше девятого. Больше пяти повышений характеристик ПИ не купит никогда."},{"n":"2.7.1.6","l":4,"te":"Choosing a new Focus","tr":"Выбор нового Фокуса","en":"Finally, the PC might be eligible to pick an additional level in a Focus. \nAt levels 2, 5, 7, and 10 a PC can add a level to an existing Focus \nor pick up the first level in a new Focus.\nIf this is the first level they’ve taken in the Focus, they might be \ngranted a skill as a free bonus pick, depending on the Focus’ benefits. \nDuring character creation, this bonus skill pick is treated like any other \nskill pick. If the Focus is taken as part of advancement, however, it \ninstead counts as three skill points spent toward increasing the skill. \nThis is enough to raise a nonexistent skill to level-1, or boost a level-1 \nskill to level-2. They may do this even if they aren’t high-enough level \nto normally qualify for a skill level that high.\nIf the skill points aren’t quite enough to raise the skill to a new \nlevel, they remain as credit toward future advances. If applied to a \nskill that is already at level-4, the PC can spend the three skill points \non any other skill of their choice.","ru":"Наконец, ПИ может получить право взять дополнительный уровень Фокуса. На уровнях 2, 5, 7 и 10 ПИ может добавить уровень к уже имеющемуся Фокусу или взять первый уровень нового.\n\nЕсли это первый уровень данного Фокуса, персонажу может полагаться навык в качестве бесплатного бонусного выбора — в зависимости от преимуществ Фокуса. При создании персонажа такой бонусный навык считается обычным выбором навыка. Но если Фокус взят в ходе развития, он вместо этого считается тремя пунктами навыков, потраченными на повышение этого навыка. Этого хватает, чтобы поднять отсутствующий навык до уровня-1 или навык уровня-1 — до уровня-2. Это разрешено, даже если уровень персонажа обычно не позволяет взять столь высокий уровень навыка.\n\nЕсли этих пунктов навыков не хватает, чтобы поднять навык на новый уровень, они сохраняются как задел на будущие повышения. Если они приходятся на навык, уже достигший уровня-4, ПИ может потратить эти три пункта навыков на любой другой навык по своему выбору."},{"n":"2.7.1.7","l":4,"te":"Learning New Spells and Arts","tr":"Изучение новых заклинаний и Искусств","en":"Mage characters capable of spellcasting learn new spells when \nthey advance a level. High Mages and Full Invokers learn two new \nHigh Magic spells they are capable of casting. All other spellcasting \nmages learn one spell they can cast, either from High Magic or their \nown specialist spells.\nMages who use arts may also gain a new art pick, depending \non their class. Each such class has a table that lists the schedule for \ngaining new arts.","ru":"Персонажи-Маги, способные к чтению заклинаний, выучивают новые заклинания при подъёме уровня. Высшие маги и полные Волхвы выучивают два новых посильных им заклинания Высшей магии. Все прочие колдующие маги выучивают одно заклинание, которое способны читать, — из Высшей магии или из заклинаний собственной специальности.\n\nМаги, использующие Искусства, могут также получить новый выбор Искусства — в зависимости от класса. У каждого такого класса есть таблица с расписанием получения новых Искусств."},{"n":"2.8.0","l":2,"te":"Crafting and Modifying Gear","tr":"Изготовление и модификация снаряжения","en":"Any Expert or Partial Expert PC with at least Craft-1 skill, or any PC \nwith the Artisan Focus, can modify equipment with ancient salvage. \nTheir crafting background does not need to precisely match the gear \nthey’re modifying; the basic principles of using ancient salvage are \nthe same among all disciplines.","ru":"Любой ПИ — Эксперт или частичный Эксперт — с навыком не ниже Ремесло-1, а также любой ПИ с Фокусом «Ремесленник» может модифицировать снаряжение древним утилём. Его ремесленный профиль не обязан точно совпадать с модифицируемым с
