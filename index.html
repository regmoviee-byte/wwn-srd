ces. Heroically \nwell-trained or tactically-expert enemies with an Instinct score of zero \nmight likewise be immune to Instinct checks. Even martial paragons \nmight be susceptible to Instinct, however, if they’re so proud, blase, \nor contemptuous of their foes that they fail to fight them with their \nutmost cunning.\nWhen an Instinct check is failed, a creature will do something \nthoughtless or sub-optimal that is in line with their natural instincts. \nThe adjacent tables offer example suggestions for various types of \ncreatures, but a GM can simply decide the most reasonable reaction \nbased on the situation and the combatants. A GM should use these \ninstances as opportunities to show off the nature of an enemy or the \ninstincts of a bestial foe, or to set up some battlefield situation that isn’t \nnecessarily tactically-optimal for the enemy but is still troublesome \nfor the heroes. Actions taken as a result of a failed Instinct check will \nusually only occupy one round worth of the creature’s efforts.\nActions forced by an Instinct check failure won’t necessarily be \nentirely useless, but they won’t be the wisest or most effective use of \nthe creature’s abilities. Blindly attacking sub-optimal targets, recklessly \nusing unarmed attacks rather than the weapon in hand, or aiming \nspells or shots at targets of lesser importance might all be actions \ntaken as a result of a failed Instinct check.\nInstinct checks are always optional and at the discretion of the \nGM. Some GMs might choose not to use them at all, judging actions \nstrictly on what seems reasonable to them. In all cases it’s the GM’s \nfinal call as to whether or not to roll one.","ru":"Когда что-то вынуждает проверку Инстинкта, Мастер бросает 1d10. Если выпавшее число равно показателю Инстинкта бойца (измеряемому от 1 до 10) или меньше него, тот делает что-то импульсивное, недальновидное, инстинктивное или иным образом тактически сомнительное. Проверки Инстинкта бросаются отдельно за каждого бойца, но для больших групп Мастер может просто решить, что подходящая доля участников проваливает проверку автоматически. Если у существ Инстинкт 3, Мастер может, к примеру, постановить, что проверку проваливают 30% из них, и не кидать кости за каждого.\n\nПИ никогда не делают проверок Инстинкта. Даже в тисках ужаса или тяжёлого ранения они сохраняют власть над собственными решениями. Героически вымуштрованные или тактически безупречные враги с показателем Инстинкта, равным нулю, тоже могут быть неуязвимы для проверок Инстинкта. Впрочем, даже образцовые воители могут поддаться Инстинкту, если они настолько горды, пресыщены или презирают противника, что не сражаются с ним в полную силу своей хитрости.\n\nПровалив проверку Инстинкта, существо сделает что-то бездумное или невыгодное, но отвечающее его природным инстинктам. Таблицы рядом предлагают примеры для разных типов существ, но Мастер может просто выбрать самую правдоподобную реакцию исходя из ситуации и участников боя. Мастеру стоит использовать такие моменты как возможность показать натуру врага или инстинкты дикой твари либо создать на поле боя положение, не обязательно тактически выгодное противнику, но всё равно неудобное для героев. Действия, вызванные провалом проверки Инстинкта, обычно занимают лишь один раунд усилий существа.\n\nДействия, навязанные провалом проверки Инстинкта, не обязательно окажутся совсем бесполезными, но это будет не самое мудрое и не самое эффективное применение способностей существа. Слепая атака невыгодной цели, безрассудная драка голыми руками вместо оружия в ладони, заклинания или выстрелы по второстепенным целям — всё это возможные следствия проваленной проверки Инстинкта.\n\nПроверки Инстинкта всегда необязательны и остаются на усмотрение Мастера. Кто-то может вовсе от них отказаться, оценивая действия строго по тому, что кажется ему разумным. В любом случае последнее слово о том, бросать проверку или нет, — за Мастером."},{"n":"5.4.2","l":3,"te":"When to Make an Instinct Check","tr":"Когда делать проверку Инстинкта","en":"As a general guide, a GM might make an Instinct check for a creature \nwhenever any of the situations below are applicable, or any time the \nGM thinks the creature might be confused or indecisive.\n•\t\nThe second round of combat for mobs and undisciplined \nfighters. The creature could think clearly before starting the fray, but \nthe fear and exhilaration of mortal combat might confuse it.\n•\t\nThe creature has just had to make a Morale check for any \nreason. Terror might cloud its thoughts.\n•\t\nThe enemy just did something confusing or disorienting. \nWhen the situation is strange, the creature might fall back on instinct.\n•\t\nThe enemy did something to enrage or directly intimidate \nit. Fury or terror might force bad decisions.\n•\t\nThe creature is presented with something it desires, such as \ndropped food, hurled money, or other inducements. It might go after \nthe bait instead of the battle if it seems safe to do so.\nOther situations might force Instinct checks as well at the GM’s \ndiscretion. Indeed, some situations might be so compelling as to \ncause automatic check failure. Depending on the situation, the GM \nmight decide a particular response is the only reasonable one, and \nnot bother to randomly pick it from a table.","ru":"Как общий ориентир: Мастер может делать проверку Инстинкта за существо в любой из перечисленных ниже ситуаций — и всякий раз, когда, по его мнению, существо может растеряться или заколебаться.\n\n* Второй раунд боя для толп и недисциплинированных бойцов. До начала свалки существо могло мыслить ясно, но страх и упоение смертельного боя могут сбить его с толку.\n* Существу только что пришлось делать проверку боевого духа по любой причине. Ужас может замутить его мысли.\n* Враг только что сделал что-то непонятное или дезориентирующее. Когда ситуация странная, существо может положиться на инстинкт.\n* Враг чем-то взбесил существо или прямо его запугал. Ярость или ужас могут толкнуть к дурным решениям.\n* Перед существом оказалось что-то желанное: брошенная еда, швырнутые деньги, иная приманка. Оно может заняться приманкой вместо боя, если это выглядит безопасным.\n\nПроверку Инстинкта могут вынудить и другие ситуации — на усмотрение Мастера. Более того, некоторые ситуации могут быть столь неодолимы, что проверка проваливается автоматически. В зависимости от обстоятельств Мастер может решить, что разумна лишь одна конкретная реакция, и не тянуть её случайным образом из таблицы."},{"n":"5.4.3","l":3,"te":"Assigning Instinct Scores","tr":"Как назначать показатели Инстинкта","en":"For non-sentient beasts, a creature’s Instinct score should usually \nbe about 5. Such beasts act largely by instinct in a fight- often very \nviolent instincts.\nFor non-combatant sentients and those unfamiliar with battle, \nInstinct should be 5 to 7. They are extremely likely to become con-\nfused or useless.\nOrdinary intelligent veterans should have an Instinct of 3 or 4. \nThey might get caught up in the confusion of battle and make some \npoor calls, but they’re unlikely to lose their head entirely.\nHardened, battle-tested fighters might have an Instinct of only 1 \nor 2, being very unlikely to forget themselves in the chaos of battle.\nThe coldest, calmest killers would have an Instinct of 1, and may \nnot have to make Instinct checks at all outside of the most disorienting \nsituations. They’ll fight according to the plan and won’t lose track of \nthe battle.","ru":"Неразумным зверям обычно стоит давать показатель Инстинкта около 5. В драке такие звери действуют в основном по инстинкту — и инстинкты эти зачастую весьма кровожадны.\n\nРазумным небойцам и тем, кто незнаком с битвой, положен Инстинкт от 5 до 7. Они чрезвычайно склонны растеряться или стать бесполезными.\n\nОбычным толковым ветеранам стоит дать Инстинкт 3 или 4. Их может захлестнуть сумятица боя, и кое-какие решения выйдут скверными, но совсем потерять голову они вряд ли способны.\n\nУ закалённых, проверенных боями воинов Инстинкт может быть всего 1 или 2: они едва ли забудутся в хаосе сражения.\n\nСамым же холодным и невозмутимым убийцам полагается Инстинкт 1, а вне самых дезориентирующих ситуаций им может вовсе не требоваться проверок Инстинкта. Они будут драться по плану и не потеряют нить боя."},{"n":"6.0.0","l":1,"te":"Factions","tr":"Фракции","en":"At the start of every faction turn, each faction rolls 1d8 for initiative,\nFactions have several statistics to define their overall qualities. Weak \nor small factions tend to have low ratings even in their main focus, \nwhile kingdoms and major institutions may have a good rating even \nin their less important traits, simply because they have so many re-\nsources available to them.","ru":"Фракцию описывают несколько характеристик, задающих её общие качества. У слабых и мелких фракций рейтинги обычно невысоки даже в главном для них деле, а королевства и крупные институты могут иметь приличный рейтинг даже во второстепенных чертах — просто потому, что ресурсов у них в избытке."},{"n":"6.1.0","l":2,"te":"Faction Statistics","tr":"Характеристики фракций","en":"Cunning is measured from 1 to 8 and indicates the faction’s general \nguile, skill at subterfuge, and subtlety. Low Cunning means the faction \nis straightforward or unaccustomed to dealing with trickery, while high \nCunning is for Machiavellian schemers and secretive organizations.\nForce is measured from 1 to 8 and reflects the overall military \nprowess and martial competence of the faction. A faction with low \nForce isn’t used to using violence to get its way, or is particularly \ninept at it, while a high Force reflects a culture of military expertise.\nWealth is measured from 1 to 8 and shows the faction’s general \nprosperity, material resources, and facility with money. Low Wealth \nmeans the faction is poor, disinterested in material goods, or spend-\nthrift with what they have, while high Wealth factions are rich and \nfamiliar with using money and goods as tools for success.\nMagic measures the amount of magical resources available to \nthe faction. “None” is for factions that have no meaningful access \nto magic. “Low” is for those factions that have at best a few trained \nmages or small stores of magical goods. “Medium” is for a faction \nwhere there is an established source of magical power for the faction, \neither as a sub-group of cooperative mages, a magical academy, a \ntradition of sorcery in the faction, or some other institutionalized aid. \n“High” magic is reserved for those factions that have a strong focus \non wielding magical power, most fitting for a faction that represents \na magical order.\nTreasure is counted in points, and the total reflects how much the \nfaction owns in cash and valuable goods. A single point of Treasure \ndoesn’t have an established cash value; a sack of gold is worthless \nin itself to a faction that needs a dozen oxcarts, and a herd of cattle \nowned by a faction can’t necessarily be turned into a fixed sum of \ncoin.\nHit points work for factions much as they do for characters; when \na faction is reduced to zero hit points, it collapses. Its individual mem-\nbers and sub-groups might not all be dead, but they’re so hopelessly \ndisorganized, dispirited, or conflict-bound that the faction ceases to \nexist as a coherent whole.\nAssets are important resources possessed by a faction, such as \ncontrolling a ring of Smugglers, or having a unit of Infantry. Assets all \nhave their own statistics and hit points, and all of them require certain \nscores in Force, Wealth, Cunning, and Magic to purchase. Assets \ndon’t cover all the resources and institutions the faction may control, \nbut they reflect the ones that are most relevant to the faction at that \nmoment. A kingdom may have more military than the Infantry unit they \nhave, but that Infantry unit is the one that’s doing something important.","ru":"**Хитрость** измеряется от 1 до 8 и показывает общую изворотливость фракции, её мастерство в интригах и умение действовать тонко. Низкая Хитрость означает, что фракция прямолинейна или не привыкла иметь дело с обманом, а высокая — удел макиавеллиевских интриганов и скрытных организаций.\n\n**Мощь** измеряется от 1 до 8 и отражает общее военное умение и боевую выучку фракции. Фракция с низкой Мощью не привыкла добиваться своего насилием или особенно бездарна в нём, а высокая Мощь говорит о культуре военного мастерства.\n\n**Богатство** измеряется от 1 до 8 и показывает общее процветание фракции, её материальные ресурсы и умение обращаться с деньгами. Низкое Богатство означает, что фракция бедна, равнодушна к материальным благам или транжирит то, что имеет, а фракции с высоким Богатством богаты и умеют превращать деньги и товары в орудия успеха.\n\n**Магия** измеряет объём магических ресурсов, доступных фракции. «Нет» — для фракций без сколько-нибудь значимого доступа к магии. «Низкая» — для тех, у кого в лучшем случае найдётся несколько обученных магов или небольшие запасы магических изделий. «Средняя» — для фракции с устоявшимся источником магической силы, будь то содружество магов внутри фракции, магическая академия, собственная традиция чародейства или иная институциональная опора. «Высокая» магия остаётся за фракциями, сосредоточенными на владении магической силой, — лучше всего она подходит фракции, представляющей магический орден.\n\n**Казна** считается в пунктах, и итог отражает, сколько наличности и ценных товаров есть у фракции. У отдельного пункта Казны нет установленной денежной стоимости. Мешок золота сам по себе бесполезен фракции, которой нужна дюжина воловьих повозок, а принадлежащее фракции стадо скота не всегда получится обратить в твёрдую сумму монет.\n\n**Пункты здоровья** работают для фракций почти так же, как для персонажей. Когда пункты здоровья фракции падают до нуля, она рушится. Её отдельные члены и подгруппы не обязательно все погибли, но они настолько безнадёжно разобщены, подавлены или увязли в раздорах, что фракция перестаёт существовать как единое целое.\n\n**Активы** — это важные ресурсы во владении фракции, такие как подконтрольное кольцо Контрабандистов или отряд Пехоты. У каждого Актива есть собственные характеристики и пункты здоровья, и для покупки любого из них нужны определённые значения Мощи, Богатства, Хитрости и Магии. Активы не описывают все ресурсы и институты, какие фракция может контролировать, — только те, что важнее всего для неё прямо сейчас. У королевства может быть больше войск, чем один отряд Пехоты, но именно этот отряд занят чем-то важным."},{"n":"6.2.0","l":2,"te":"The Faction Turn","tr":"Ход фракций","en":"Every month or so, the GM should run a faction turn. This turn may \ntake place more often during times of intense activity, or less often \nif the campaign world is quiet. In general, a faction turn after every \nadventure is a good average, assuming the PCs don’t have back-\nto-back adventures.\nthe highest rolls going first. Ties are resolved as the GM wishes, and \nthen each faction takes the following steps in order.\n•\t\nThe faction earns Treasure equal to half their Wealth plus a \nquarter of their combined Force and Cunning, the total being rounded \nup.\n•\t\nThe faction must pay any upkeep required by their indi-\nvidual Asset costs, or by the cost of having too many Assets for their \nattributes. If they can’t afford this upkeep, individual Assets may have \ntheir own bad consequences, while not being able to afford excess \nAssets means that the excess are lost.\n•\t\nThe faction triggers any special abilities individual Assets \nmay have, such as abilities that allow an Asset to move or perform \nsome other special benefit.\n•\t\nThe faction takes one Faction Action as listed in the follow-\ning section, resolving any Attacks or other consequences from their \nchoice. When an action is taken, every Asset owned by the faction \nmay take it; thus, if Attack is chosen, then every valid Asset owned \nby the faction can Attack. If Repair Asset is chosen, every Asset can \nbe repaired if enough Treasure is spent.\n•\t\nThe faction checks to see if it’s accomplished its most recent \ngoal. If so, it collects the experience points for doing so and picks a \nnew goal. If not, it can abandon the old goal and pick a new one, \nbut it will sacrifice its next turn’s Faction Action to do so and may not \ntrigger any Asset special abilities that round, either.\nThe next faction in order then acts until all factions have acted \nfor the turn.","ru":"Примерно раз в месяц Мастеру следует разыгрывать ход фракций. В пору бурных событий этот ход может случаться чаще, а когда мир кампании затих — реже. В целом хороший средний темп — ход фракций после каждого приключения, если только ПИ не идут из приключения в приключение без передышки.\n\nВ начале каждого хода фракций каждая фракция бросает 1d8 на инициативу; кто выбросил больше, тот ходит раньше. Ничьи Мастер разрешает как пожелает, а затем каждая фракция по очереди выполняет следующие шаги.\n\n* Фракция получает Казну, равную половине её Богатства плюс четверть суммы её Мощи и Хитрости; итог округляется вверх.\n* Фракция должна оплатить содержание, которого требуют отдельные Активы, а также плату за Активы сверх того, что позволяют её атрибуты. Если ей нечем оплатить содержание отдельных Активов, у тех могут наступить собственные дурные последствия, а неоплаченные сверхлимитные Активы попросту теряются.\n* Фракция задействует особые способности отдельных Активов — например, те, что позволяют Активу переместиться или дают иную особую выгоду.\n* Фракция выполняет одно действие фракции из перечисленных в следующем разделе, разрешая все Атаки и прочие последствия своего выбора. Когда действие выбрано, выполнить его может каждый Актив фракции. Если выбрана Атака, атаковать может каждый подходящий Актив фракции; если выбрано «Починить Актив», починить можно каждый Актив, на который хватит Казны.\n* Фракция проверяет, достигла ли она своей текущей цели. Если да, она получает за это пункты опыта и выбирает новую цель. Если нет, она может бросить старую цель и взять новую, но пожертвует ради этого действием фракции в следующем ходу и в тот раунд не сможет задействовать особые способности Активов.\n\nЗатем действует следующая по порядку фракция, и так пока все фракции не отходят за этот ход."},{"n":"6.3.0","l":2,"te":"Asset Locations and Movement","tr":"Расположение и перемещение Активов","en":"Every Asset has a location on the campaign map. This location may \nnot be where all the elements of the Asset are located. It might simply \nbe the headquarters of an organization, or the spot where the most \nactive and important members of it are currently working. However \nit’s described, it’s the center of gravity for the Asset.\nThis location is usually in a town or other settlement, but it could \nbe anything that makes sense. A reclusive Prophet might dwell deep \nwithin the wilderness, and a ring of Smugglers might currently be \nbased out of a hidden sea cave. A location is simply wherever the \nGM thinks it should be.\nAssets can move locations, either with the Move Asset faction \naction or with a special ability possessed by the Asset itself or an \nallied unit. Generally, whenever an Asset moves, it can move one \nturn’s worth of distance.\nAs a rule of thumb, for a one-month turn, this is about one hundred \nmiles. This is as far as an organization can shift itself in thirty days \nwhile still maintaining some degree of control and cohesion. The GM \nmay adjust this distance based on the situation; if the campaign is \ntaking place in an island archipelago with fast sea travel it’s going \nto be easier to move long distances than if the Asset has to march \nthrough mountains to get there.\nSome Assets also have special abilities that work on targets within \none move of the Asset. Again, the GM decides what this means, but\ngenerally it means that the Asset can affect targets within a hundred \nmiles of its location.\nSometimes it doesn’t make logical sense for an Asset to be able to \nmove to a particular location. A unit of Infantry, for example, could \nhardly walk into an enemy nation’s capital so as to later Attack the \nCourt Patronage Asset there. In this case, the best the Infantry could \ndo would be to move to a location near the capital, assuming the \nGM decides that’s plausible. The Infantry couldn’t actually Attack the \nenemy faction’s Assets until they got into the city itself where those \nAssets were located.\nAssets with the Subtle quality are not limited this way. Subtle Assets \ncan move to locations even where they would normally be prohibited \nby the ruling powers. Dislodging them requires that they be Attacked \nuntil destroyed or moved out by their owner.\nAssets with the Stealth quality are also not limited by this, and can \nmove freely to any location within reach. Stealthed Assets cannot \nbe Attacked by other Assets until they lose the Stealth quality. This \nhappens when they are discovered by certain special Assets or when \nthe Stealthed Asset Attacks something.","ru":"У каждого Актива есть местоположение на карте кампании. Не обязательно там находятся все составные части Актива. Это может быть просто штаб-квартира организации или место, где сейчас работают её самые деятельные и важные члены. Как бы оно ни описывалось, это центр тяжести Актива.\n\nОбычно такое местоположение — город или иное поселение, но им может быть что угодно осмысленное. Пророк-затворник может жить в глухом диком краю, а кольцо Контрабандистов — обосноваться до поры в потайной морской пещере. Местоположение — это попросту то место, какое Мастер сочтёт подходящим.\n\nАктивы могут менять местоположение — действием фракции «Переместить Актив» либо особой способностью самого Актива или союзного отряда. Как правило, при каждом перемещении Актив покрывает расстояние одного хода.\n\nКак ориентир, для месячного хода это около сотни миль. Столько организация способна сместиться за тридцать дней, сохранив хоть какую-то управляемость и связность. Мастер может подправить это расстояние по обстановке: если кампания идёт в островном архипелаге с быстрым морским сообщением, покрывать большие расстояния проще, чем когда Активу пришлось бы маршировать через горы.\n\nУ некоторых Активов есть особые способности, действующие на цели в пределах одного перемещения от Актива. Что это значит, опять же решает Мастер, но обычно такой Актив может влиять на цели в сотне миль от своего местоположения.\n\nИногда Актив просто не может правдоподобно переместиться в некое место. Отряд Пехоты, например, едва ли войдёт маршем в столицу вражеской державы, чтобы позже Атаковать тамошний Актив «Придворное покровительство». В этом случае лучшее, что может Пехота, — встать где-то поблизости от столицы, если Мастер сочтёт это правдоподобным. Атаковать Активы вражеской фракции Пехота не сможет, пока не попадёт в сам город, где те находятся.\n\nАктивы с качеством «Неприметный» этим не ограничены. Неприметные Активы могут перемещаться даже туда, куда правящие власти обычно их не пустили бы. Чтобы выбить их оттуда, их придётся Атаковать, пока они не будут уничтожены или пока владелец их не выведет.\n\nАктивы с качеством «Затаённый» тоже свободны от этого ограничения и могут перемещаться в любое достижимое место. Затаившиеся Активы нельзя Атаковать другими Активами, пока они не потеряют качество «Затаённый». Это происходит, когда их обнаруживают определённые особые Активы или когда затаившийся Актив сам что-то Атакует."},{"n":"6.4.0","l":2,"te":"Attribute Checks","tr":"Проверки атрибутов","en":"Some actions, such as Attack, require an attribute check between \nfactions, such as Force versus Cunning, or Wealth versus Force. Other \nspecial Asset abilities sometimes call for attribute checks as well.\nTo make this check, the attacker and defender both roll 1d10 and \nadd their relevant attribute. Thus, for a Force versus Cunning check, \nthe attacker would roll 1d10+Force against the defender’s 1d10+-\nCunning. The attacker wins if their total is higher, and the defender \nwins if it’s a tie or their roll is higher.\nSome special abilities or tags allow the attacker or defender to \nroll more than one die for a check. In this case, the dice are rolled \nand the highest of them are used.","ru":"Некоторые действия, такие как Атака, требуют проверки атрибутов между фракциями — например, Мощь против Хитрости или Богатство против Мощи. Порой проверок атрибутов требуют и особые способности Активов.\n\nВ такой проверке нападающий и защитник бросают по 1d10 и прибавляют соответствующий атрибут. Так, в проверке Мощи против Хитрости нападающий бросает 1d10+Мощь против 1d10+Хитрость защитника. Нападающий побеждает, если его итог выше; защитник — при ничьей или если выше его бросок.\n\nНекоторые особые способности и черты позволяют нападающему или защитнику бросить в проверке больше одной кости. В этом случае он бросает все кости и берёт высшую из них."},{"n":"6.5.0","l":2,"te":"Faction Tags","tr":"Черты фракций","en":"These are merely some possibilities. The GM may devise others to \nsuit their needs.\nAntimagical: Assets that require Medium or higher Magic to pur-\nchase roll all attribute checks twice against this faction during an \nAttack and take the worst roll.\nConcealed: All Assets the faction purchases enter play with the \nStealth quality.\nImperialist: The faction quickly expands its Bases of Influence. Once \nper turn, it can use the Expand Influence action as a special ability \ninstead of it taking a full action.\nInnovative: The faction can purchase Assets as if their attribute ratings \nwere two points higher than they are. Only two such over-complex \nAssets may be owned at any one time.\nMachiavellian: The faction is diabolically cunning. It rolls an extra \ndie for all Cunning attribute checks. Its Cunning must always be its \nhighest attribute.\nMartial: The faction is profoundly devoted to war. It rolls an extra die \nfor all Force attribute checks. Force must always be its highest attribute.\nMassive: The faction is an empire, major kingdom, or other huge \norganizational edifice. It automatically wins attribute checks if its \nattribute is more than twice as big as the opposing side’s attribute, \nunless the other side is also Massive.\nMobile: The faction is exceptionally fast or mobile. Its faction turn \nmovement range is twice what another faction would have in the\nsame situation.\nPopulist: The faction has widespread popular support. Assets that \ncost 5 Treasure or less to buy cost one point less, to a minimum of 1.\nRich: The faction is rich or possessed of mercantile skill. It rolls an \nextra die for all Wealth attribute checks. Wealth must always be its \nhighest attribute.","ru":"Это лишь некоторые возможности. Мастер может придумать другие под свои нужды.\n\n**Антимагическая:** Активы, для покупки которых нужна Магия «Средняя» или выше, во время Атаки бросают все проверки атрибутов против этой фракции дважды и берут худший результат.\n\n**Богатая:** Фракция богата или наделена купеческой хваткой. Она бросает дополнительную кость во всех проверках атрибута Богатства. Богатство всегда должно оставаться её высшим атрибутом.\n\n**Воинственная:** Фракция глубоко предана войне. Она бросает дополнительную кость во всех проверках атрибута Мощи. Мощь всегда должна оставаться её высшим атрибутом.\n\n**Законспирированная:** Все Активы, которые фракция покупает, входят в игру с качеством «Затаённый».\n\n**Захватническая:** Фракция быстро разрастается Базами влияния. Раз за ход она может использовать «Расширить влияние» как особую способность, а не полноценное действие.\n\n**Исполинская:** Фракция — империя, крупное королевство или иная громадная организационная махина. Она автоматически выигрывает проверку атрибутов, если её атрибут больше чем вдвое превосходит атрибут противной стороны, — если только та тоже не Исполинская.\n\n**Коварная:** Фракция дьявольски хитра. Она бросает дополнительную кость во всех проверках атрибута Хитрости. Хитрость всегда должна оставаться её высшим атрибутом.\n\n**Народная:** Фракция пользуется широкой народной поддержкой. Активы ценой 5 Казны и меньше стоят на один пункт дешевле, минимум 1.\n\n**Новаторская:** Фракция может покупать Активы так, будто рейтинги её атрибутов на два пункта выше настоящих. Одновременно можно владеть лишь двумя такими чересчур сложными Активами.\n\n**Подвижная:** Фракция исключительно быстра или подвижна. Дальность её перемещения за ход фракций вдвое больше, чем была бы у другой фракции в том же положении."},{"n":"6.6.0","l":2,"te":"Faction Turn Actions","tr":"Действия хода фракций","en":"Attack: The faction nominates one or more Assets to attack the enemy \nin their locations. In each location, the defender chooses which of the \nAssets present will meet the Attack; thus, if a unit of Infantry attacks in \na location where there is an enemy Base of Influence, Informers, and \nIdealistic Thugs, the defender could decide to use Idealistic Thugs to \ndefend against the attack.\nThe attacker makes an attribute check based on the attack of the \nacting Asset; thus, the Infantry would roll Force versus Force. On a \nsuccess, the defending Asset takes damage equal to the attacking \nAsset’s attack score, or 1d8 in the case of Infantry. On a failure, the \nattacking Asset takes damage equal to the defending Asset’s coun-\nterattack score, or 1d6 in the case of Idealistic Thugs.\nIf the damage done to an Asset reduces it to zero hit points, it is \ndestroyed. The same Asset may be used to defend against multiple \nattacking Assets, provided it can survive the onslaught.\nDamage done to a Base of Influence is also done directly to the \nfaction’s hit points. Overflow damage is not transmitted, however.\nMove Asset: One or more Assets are moved up to one turn’s worth \nof movement each. The receiving location must not have the ability \nand inclination to forbid the Asset from operating there. Subtle and \nStealthed Assets ignore this limit.\nIf an asset loses the Subtle or Stealth qualities while in a hostile \nlocation, they must use this action to retreat to safety within one turn \nor they will take half their maximum hit points in damage at the start \nof the next turn, rounded up.\nRepair Asset: The faction spends 1 Treasure on each Asset they wish \nto repair, fixing half their relevant attribute value in lost hit points, \nrounded up. Thus, fixing a Force Asset would heal half the faction’s \nForce attribute, rounded up. Additional healing can be applied to \nan Asset in this same turn, but the cost increases by 1 Treasure for \neach subsequent fix; thus, the second costs 2 Treasure, the third costs \n3 Treasure, and so forth.\nThis ability can at the same time also be used to repair damage \ndone to the faction, spending 1 Treasure to heal a total equal to the \nfaction’s highest and lowest Force, Wealth, or Cunning attribute di-\nvided by two, rounded up. Thus, a faction with a Force of 5, Wealth \nof 2, and Cunning of 4 would heal 4 points of damage. Only one \nsuch application of healing is possible for a faction each turn.\nExpand Influence: The faction seeks to establish a new base of op-\nerations in a location. The faction must have at least one Asset there \nalready to make this attempt, and must spend 1 Treasure for each \nhit point the new Base of Influence is to have. Thus, to create a new \nBase of Influence with a maximum hit point total of 10, 10 Treasure \nmust be spent. Bases with high maximum hit point totals are harder \nto dislodge, but losing them also inflicts much more damage on the \nfaction’s own hit points.\nOnce the Base of Influence is created, the owner makes a Cunning \nversus Cunning attribute check against every other faction that has\nAttribute\nFaction XP Cost\nHit Point\nRating\nto Purchase\nValue\n-\nat least one Asset in the same location. If the other faction wins the \ncheck, they are allowed to make an immediate Attack against the \nnew Base of Influence with whatever Assets they have present in the \nlocation. The creating faction may attempt to block this action by \ndefending with other Assets present.\nIf the Base of Influence survives this onslaught, it operates as nor-\nmal and allows the faction to purchase new Assets there with the \nCreate Asset action.\nCreate Asset: The faction buys one Asset at a location where they \nhave a Base of Influence. They must have the minimum attribute and \nMagic ratings necessary to buy the Asset and must pay the listed cost \nin Treasure to build it. A faction can create only one Asset per turn.\nA faction can have no more Assets of a particular attribute than \ntheir attribute score. Thus, a faction with a Force of 3 can have only \n3 Force Assets. If this number is exceeded, the faction must pay 1 \nTreasure per excess Asset at the start of each turn, or else they will \nlose the excess.\nHide Asset: An action available only to factions with a Cunning score \nof 3 or better, this action allows the faction to give one owned Asset \nthe Stealth quality for every 2 Treasure they spend. Assets currently \nin a location with another faction’s Base of Influence can’t be hidden. \nIf the Asset later loses the Stealth, no refund is given.\nSell Asset: The faction voluntarily decommissions an Asset, salvaging \nit for what it’s worth. The Asset is lost and the faction gains half its \npurchase cost in Treasure, rounded down. If the Asset is damaged \nwhen it is sold, however, no Treasure is gained.","ru":"**Атака:** Фракция назначает один или несколько Активов атаковать врага там, где он находится. В каждом местоположении защитник выбирает, какой из присутствующих Активов встретит Атаку. Если отряд Пехоты атакует там, где у врага стоят База влияния, Осведомители и Идейные громилы, защитник может выставить против атаки Идейных громил.\n\nНападающий делает проверку атрибутов по графе атаки действующего Актива; так, Пехота бросает Мощь против Мощи. При успехе защищающийся Актив получает урон, равный показателю атаки атакующего Актива, — 1d8 в случае Пехоты. При провале атакующий Актив получает урон, равный показателю контратаки защищающегося Актива, — 1d6 в случае Идейных громил.\n\nЕсли урон снижает пункты здоровья Актива до нуля, он уничтожен. Один и тот же Актив может защищаться от нескольких атакующих Активов — лишь бы пережил этот натиск.\n\nУрон, нанесённый Базе влияния, наносится заодно и напрямую пунктам здоровья фракции. Избыточный урон, впрочем, не переносится.\n\n**Переместить Актив:** Один или несколько Активов перемещаются, каждый на расстояние до одного хода. Принимающее местоположение не должно иметь возможности и желания запретить Активу там действовать. Неприметные и затаившиеся Активы игнорируют это ограничение.\n\nЕсли Актив теряет качество «Неприметный» или «Затаённый» во враждебном местоположении, он должен этим действием отступить в безопасное место в течение одного хода — иначе в начале следующего хода он получит урон в половину своего максимума пунктов здоровья, округляя вверх.\n\n**Починить Актив:** Фракция тратит 1 Казны на каждый Актив, который хочет починить, и восстанавливает ему потерянные пункты здоровья в размере половины соответствующего атрибута, округляя вверх. Так, починка Актива Мощи излечивает половину атрибута Мощи фракции с округлением вверх. В тот же ход Актив можно лечить и дальше, но цена растёт на 1 Казны с каждой следующей починкой: вторая стоит 2 Казны, третья — 3 и так далее.\n\nЭтим же действием можно заодно чинить урон, нанесённый самой фракции: за 1 Казны она излечивает сумму, равную её высшему и низшему атрибутам из Мощи, Богатства и Хитрости, сложенным и делённым на два с округлением вверх. Так, фракция с Мощью 5, Богатством 2 и Хитростью 4 излечила бы 4 пункта урона. Такое лечение фракции возможно лишь один раз за ход.\n\n**Расширить влияние:** Фракция пытается основать новую базу операций в каком-то местоположении. Для этой попытки у неё там уже должен быть хотя бы один Актив, и она должна потратить 1 Казны за каждый пункт здоровья будущей Базы влияния. Так, новая База влияния с максимумом в 10 пунктов здоровья обойдётся в 10 Казны. Базы с высоким максимумом пунктов здоровья труднее выбить, но их потеря и наносит куда больший урон пунктам здоровья самой фракции.\n\nКогда База влияния создана, владелец делает проверку Хитрости против Хитрости против каждой другой фракции, у которой есть хотя бы один Актив в том же местоположении. Если чужая фракция выигрывает проверку, ей позволено немедленно Атаковать новую Базу влияния любыми своими Активами в этом местоположении. Фракция-создатель может попытаться заслонить её, защищаясь другими присутствующими Активами.\n\nЕсли База влияния переживёт этот натиск, она работает как обычно и позволяет фракции покупать там новые Активы действием «Создать Актив».\n\n**Создать Актив:** Фракция покупает один Актив в местоположении, где у неё есть База влияния. У неё должны быть минимальные рейтинги атрибута и Магии, необходимые для покупки этого Актива, и она должна оплатить указанную цену в Казне. Фракция может создавать лишь один Актив за ход.\n\nФракция не может держать Активов одного атрибута больше, чем значение этого атрибута. Так, фракция с Мощью 3 может иметь лишь 3 Актива Мощи. Если это число превышено, фракция платит 1 Казны за каждый лишний Актив в начале каждого хода — или теряет излишек.\n\n**Спрятать Актив:** Действие, доступное лишь фракциям с Хитростью 3 и выше. Оно позволяет за каждые потраченные 2 Казны дать одному своему Активу качество «Затаённый». Активы, стоящие в одном местоположении с Базой влияния другой фракции, спрятать нельзя. Если Актив позже теряет качество «Затаённый», деньги не возвращаются.\n\n**Продать Актив:** Фракция добровольно расформировывает Актив, выручая за него сколько выйдет. Актив теряется, а фракция получает половину его покупной цены в Казне, округляя вниз. Однако если на момент продажи Актив повреждён, выручки не будет вовсе."},{"n":"6.7.0","l":2,"te":"Creating Factions","tr":"Создание фракций","en":"A given campaign should generally not have more than six active \nfactions at any one time, and three or four are generally more man-\nageable. If there are more extant factions than this, then simply run \nturns for the three or four most active or relevant ones.\nTo create a faction, first decide whether it is a small, medium, or \nlarge faction. A small one might be a petty cult or small free city or \nminor magical academy. A medium one might be a local baron’s \ngovernment or province-wide faith. A large one would be an entire \nkingdom or a major province of a vast empire.\nIt’s perfectly acceptable to break a large institution down into a \nsmaller faction, modeling only the branch of government or part of \nthe organization that’s actually relevant to the campaign.\nAll factions have a Base of Influence at their primary headquarters \nwith a hit point total equal to the faction’s maximum. The faction’s \nMagic rating is whatever the GM thinks suitable.\nFor a small faction, give them a 3 or 4 in their best attribute, a 2 \nor 3 in their second-best, and a 1 or 2 in their worst quality.\nMedium factions should assign 5 or 6 to their best attribute, 4 or 5 \nto their second-best, and 2 or 3 to their worst. They should have two \nAssets in their primary attribute and two others among the other two.\nLarge factions should assign 7 or 8 to their strongest attribute, 6 \nor 7 to their second-best attribute, and 3 or 4 to their worst quality. \nThey should have four Assets in their primary attribute, and four oth-\ners spread among the other two. Their Magic rating will depend on \nwhatever you think is appropriate for their scale, but remember that \nit’s harder to concentrate effective magical resources when dealing \nwith a whole province or nation than it is to enchant a single city-state \nor magical institution.\nTo determine a faction’s maximum hit points, use the adjacent \ntable. Thus, one with a Force of 3, a Wealth of 5, and a Cunning \nof 2 would have hit points equal to 4 plus 9 plus 2, or 15 total. The \nBase of Influence at their primary headquarters will always have a \nmaximum hit points equal to the faction’s maximum hit points, even if \nit later rises or falls due to attribute score changes.\nLastly, give a faction a goal, either one from the foregoing list or \none chosen by the GM. When this goal is achieved, the faction earns \nexperience points which it can later spend to increase its attributes. \nThe cost for such increases is given on the table adjacent. Earlier \nlevels must be purchased before later, so to raise Force from 5 to 7 \nwill cost 9 XP to raise it to 6, then 12 more to raise it to 7.\nExample Faction Goals\nThe difficulty of a faction goal is the number of experience points \nearned on a successful completion of it.\nBlood the Enemy: Inflict a number of hit points of damage on enemy \nfaction assets or bases equal to your faction’s total Force, Cunning, \nand Wealth ratings. Difficulty 2.\nDestroy the Foe: Destroy a rival faction. Difficulty equal to 2 plus \nthe average of the faction’s Force, Cunning, and Wealth ratings.\nEliminate Target: Choose an undamaged rival Asset. If you destroy \nit within three turns, succeed at a Difficulty 1 goal. If you fail, pick a \nnew goal without suffering the usual turn of paralysis.\nExpand Influence: Plant a Base of Influence at a new location. \nDifficulty 1, +1 if a rival contests it.\nInside Enemy Territory: Have a number of Stealthed assets in loca-\ntions where there is a rival Base of Influence equal to your Cunning \nscore. Units that are already Stealthed in locations when this goal is \nadopted don’t count. Difficulty 2.\nInvincible Valor: Destroy a Force asset with a minimum purchase \nrating higher than your faction’s Force rating. Difficulty 2.\nPeaceable Kingdom: Don’t take an Attack action for four turns. \nDifficulty 1.\nRoot Out the Enemy: Destroy a Base of Influence of a rival faction in \na specific location. Difficulty equal to half the average of the current \nruling faction’s Force, Cunning, and Wealth ratings, rounded up.\nSphere Dominance: Choose Wealth, Force, or Cunning. Destroy a \nnumber of rival assets of that kind equal to your score in that attribute. \nDifficulty of 1 per 2 destroyed, rounded up.\nWealth of Kingdoms: Spend Treasure equal to four times your \nfaction’s Wealth rating on bribes and influence. This money is effec-\ntively lost, but the goal is then considered accomplished. The faction’s \nWealth rating must increase before this goal can be selected again. \nDifficulty 2.","ru":"В кампании, как правило, не должно быть больше шести действующих фракций разом, а тремя-четырьмя обычно проще управлять. Если фракций расплодилось больше, просто разыгрывайте ходы за три-четыре самые деятельные или значимые.\n\nСоздавая фракцию, сперва решите, малая она, средняя или большая. Малой может быть захудалый культ, небольшой вольный город или скромная магическая академия. Средней — власть местного барона или вера, охватившая провинцию. Большой — целое королевство или крупная провинция обширной империи.\n\nСовершенно нормально выкроить из большого института фракцию поменьше, смоделировав только ту ветвь власти или часть организации, которая действительно важна для кампании.\n\nУ всякой фракции есть База влияния в её главной штаб-квартире, и пунктов здоровья у этой Базы столько же, сколько у самой фракции в максимуме. Рейтинг Магии фракции — какой Мастер сочтёт уместным.\n\nМалой фракции дайте 3 или 4 в лучший атрибут, 2 или 3 во второй и 1 или 2 в худший.\n\nСредним фракциям положите 5 или 6 в лучший атрибут, 4 или 5 во второй и 2 или 3 в худший. Им полагаются два Актива в основном атрибуте и ещё два в двух остальных.\n\nБольшим фракциям дайте 7 или 8 в сильнейший атрибут, 6 или 7 во второй и 3 или 4 в худший. Им полагаются четыре Актива в основном атрибуте и ещё четыре, распределённые между двумя остальными. Их рейтинг Магии зависит от того, что вы сочтёте уместным для их масштаба, но помните: собрать действенные магические ресурсы на целую провинцию или страну труднее, чем зачаровать один город-государство или магический институт.\n\n| Рейтинг атрибута | Цена покупки в пунктах опыта фракции | Пункты здоровья |\n|---|---|---|\n| 1 | – | 1 |\n| 2 | 2 | 2 |\n| 3 | 4 | 4 |\n| 4 | 6 | 6 |\n| 5 | 9 | 9 |\n| 6 | 12 | 12 |\n| 7 | 16 | 16 |\n| 8 | 20 | 20 |\n\nЧтобы определить максимум пунктов здоровья фракции, используйте таблицу рядом. Так, фракция с Мощью 3, Богатством 5 и Хитростью 2 имела бы пункты здоровья 4 плюс 9 плюс 2, всего 15. Максимум пунктов здоровья Базы влияния в главной штаб-квартире всегда равен максимуму пунктов здоровья фракции, даже если тот позже вырастет или упадёт из-за изменения атрибутов.\n\nНапоследок дайте фракции цель — из приведённого рядом списка или выбранную Мастером. Достигнув цели, фракция получает пункты опыта, которые позже может тратить на повышение атрибутов. Цена повышений дана в таблице рядом. Прежние уровни покупаются раньше последующих: чтобы поднять Мощь с 5 до 7, придётся заплатить 9 пунктов опыта за повышение до 6 и ещё 12 за повышение до 7.\n\n### Примерные цели фракций\n\nСложность цели фракции — это число пунктов опыта, которые фракция получает за её успешное достижение.\n\n**Богатство королевств:** Потратьте на взятки и влияние Казну, равную учетверённому рейтингу Богатства вашей фракции. Эти деньги фактически пропадают, но цель после этого считается достигнутой. Прежде чем выбрать эту цель снова, фракция должна поднять рейтинг Богатства. Сложность 2.\n\n**В тылу врага:** Держите в местоположениях с Базой влияния соперника число затаившихся Активов, равное вашей Хитрости. Активы, уже затаившиеся в таких местах на момент выбора цели, не считаются. Сложность 2.\n\n**Выкорчевать врага:** Уничтожьте Базу влияния соперничающей фракции в конкретном местоположении. Сложность равна половине среднего рейтингов Мощи, Хитрости и Богатства текущей правящей фракции, округляя вверх.\n\n**Господство в сфере:** Выберите Богатство, Мощь или Хитрость. Уничтожьте столько Активов соперников этого вида, каково ваше значение этого атрибута. Сложность — 1 за каждые 2 уничтоженных, округляя вверх.\n\n**Мирное царство:** Не выполняйте действие «Атака» четыре хода. Сложность 1.\n\n**Непобедимая доблесть:** Уничтожьте Актив Мощи, чей минимальный рейтинг для покупки выше рейтинга Мощи вашей фракции. Сложность 2.\n\n**Пустить врагу кровь:** Нанесите Активам и Базам вражеских фракций урон пунктами здоровья, равный сумме рейтингов Мощи, Хитрости и Богатства вашей фракции. Сложность 2.\n\n**Расширить влияние:** Поставьте Базу влияния в новом местоположении. Сложность 1, +1, если её оспаривает соперник.\n\n**Уничтожить противника:** Уничтожьте соперничающую фракцию. Сложность равна 2 плюс среднее рейтингов Мощи, Хитрости и Богатства этой фракции.\n\n**Устранить цель:** Выберите неповреждённый Актив соперника. Если уничтожите его за три хода, вы достигли цели Сложности 1. Если провалитесь, выберите новую цель, не страдая от обычного хода паралича."},{"n":"6.8.0","l":2,"te":"Cunning Assets","tr":"Активы Хитрости","en":"Bewitching Charmer: When the Bewitching Charmer succeeds in \nan Attack, the targeted Asset is unable to leave the same location as \nthe Bewitching Charmer until the latter Asset moves or is destroyed. \nBewitching Charmers are immune to Counterattack.\nBlackmail: When a Blackmail asset is in a location, hostile factions \ncan’t roll more than one die during Attacks made by or against them \nthere, even if they have tags or Assets that usually grant bonus dice.\nCourt Patronage: Powerful nobles or officials are appointing their \nagents to useful posts of profit. A Court Patronage Asset automatically \ngrants 1 Treasure to its owning faction each turn.\nCovert Transport: As a free action once per turn, the faction can \npay 1 Treasure and move any Cunning or Wealth Asset at the same \nlocation as the Covert Transport. The transported Asset gains the \nStealth quality until it performs some action or is otherwise utilized \nby the faction.\nCryptomancers: In place of an Attack action, they can make a \nCunning vs. Cunning attack on a specific hostile Asset within one \nmove. On a success, the targeted Asset is unable to do anything or \nbe used for anything on its owner’s next faction turn. On a failure, \nno Counterattack damage is taken.\nDancing Girls: Dancing Girls or other charming distractions are \nimmune to Attack or Counterattack damage from Force Assets, but \nthey cannot be used to defend against Attacks from Force Assets.\nExpert Treachery: On a successful Attack by Expert Treachery, \nthis Asset is lost, 5 Treasure is gained by its owning faction, and the \nAsset that Expert Treachery targeted switches sides. This conversion \nhappens even if their new owners lack the attributes usually necessary \nto maintain their new Asset.\nHired Friends: As a free action, once per turn, the faction may spend \n1 Treasure and grant a Wealth Asset within one turn’s movement \nrange the Subtle quality. This quality will remain until the Hired Friends \nare destroyed or they use this ability again.\nIdealistic Thugs: Easily-manipulated hotheads are enlisted under \nwhatever ideological or religious principle best enthuses them for \nviolence.\nInformers: As a free action, once per turn, the faction can spend 1 \nTreasure and have the Informers look for Stealthed Assets. To do so, \nthe Informers pick a faction and make a Cunning vs. Cunning Attack \non them. No counterattack damage is taken if they fail, but if they \nsucceed, all Stealthed Assets of that faction within one move of the \nInformers are revealed.\nInterrupted Logistics: Non-Stealthed hostile units cannot enter the \nsame location as the Interrupted Logistics Asset without paying 1d4 \nTreasure and waiting one turn to arrive there.\nJust As Planned: Some sublimely cunning mastermind works for the \nfaction. Whenever the faction’s Assets make a roll involving Cunning, \nthey may reroll a failed check at the cost of inflicting 1d6 damage on \nJust As Planned. This may be done repeatedly, though it may destroy \nthe Asset. There is no range limit on this benefit.\nMindbenders: Once per turn as a free action, the Mindbenders can \nforce a rival faction to reroll a check, Attack, or other die roll they just \nmade and take whichever result the Mindbenders prefer. A faction \ncan only be affected this way once until the start of the Mindbender’s \nfaction’s next turn.\nOccult Infiltrators: Magically-gifted spies and assassins are enlisted \nto serve the faction. Occult Infiltrator Assets always begin play with \nthe Stealth quality.\nOmniscient Seers: At the start of their turn, each hostile Stealthed as-\nset within one turn’s movement of the Omniscient Seers must succeed\nin a Cunning vs. Cunning check against the owning faction or lose \ntheir Stealth. In addition, all Cunning rolls made by the faction for units \nor events within one turn’s movement of the seers gain an extra die.\nOrganization Moles: Sleeper agents and deep-cover spies burrow \ninto hostile organizations, waiting to disrupt them from within when \nordered.\nPetty Seers: A cadre of skilled fortune-tellers and minor oracles \nhave been enlisted by the faction to foresee perils and allow swift \ncounterattacks. \nPopular Movement: Any friendly Asset is allowed movement into \nthe same location as the Popular Movement, even if it would normally \nbe forbidden by its owners and lacks the Subtle quality. If the Popular \nMovement later moves or is destroyed, such Assets must also leave \nor suffer the usual consequences for a non-Subtle Asset.\nProphet: Whether a religious prophet, charismatic philosopher, rebel \nleader, or other figure of popular appeal, the Asset is firmly under \nthe faction’s control.\nSaboteurs: An Asset that is Attacked by the Saboteurs can’t use any \nfree action abilities it may have during the next turn, whether or not \nthe Attack was successful.\nSeditionists: In place of an Attack action, the Seditionists’ owners \nmay spend 1d4 Treasure and attach the Asset to a hostile Asset in \nthe same location. Until the Seditionists are destroyed, infest another \nAsset, or leave the same location, the rebelling Asset cannot be used \nfor anything and grants no benefits.\nShapeshifters: As a free action once per turn, the faction can spend \n1 Treasure and grant the Shapeshifters the Stealth quality.\nSmugglers: As a free action, once per faction turn, the Smugglers can \nmove any allied Wealth or Cunning Asset in their same location to a \ndestination within movement range, even if the destination wouldn’t \nnormally allow an un-Subtle Asset.\nSpymaster: A veteran operative runs a counterintelligence bureau \nin the area.\nUnderground Roads: A well-established network of secret transit \nextends far around this Asset. As a free action, the faction may pay \n1 Treasure and move any friendly Asset from a location within one \nround’s move of the Underground Roads to a destination within one \nround of the Roads. \nUseful Idiots: Hirelings, catspaws, foolish idealists, and other dis-\nposable minions are gathered together in this Asset. If another Asset \nwithin one turn’s move of the Useful Idiots is struck by an Attack, the \nfaction can instead sacrifice the Useful Idiots to negate the attack. \nOnly one band of Useful Idiots can be sacrificed on any one turn.\nVigilant Agents: A constant flow of observations runs back to the \nfaction from these watchful counterintelligence agents. Whenever \nanother faction moves a Stealthed asset into a location within one \nmove’s distance from the Vigilant Agents, they may make a Cunning \nvs. Cunning attack against the owning faction. On a success, the \nintruding Asset loses its Stealth after it completes the move.\nCunning 1\nCunning 2\nCunning 3\nCunning 4\nCunning 5\nCunning 6\nCunning 7\nCunning 8\nCunning Asset\nCost\nHP\nMagic\nAttack\nCounter\nQualities\nInformers\nNone\nC v. C/Special\nNone\nSubtle, Special\nPetty Seers\nMedium\nNone\n1d6 damage\nSubtle\nSmugglers\nNone\nC v. W/1d4 damage\nNone\nSubtle, Action\nUseful Idiots\nNone\nNone\nNone\nSubtle, Special\nBlackmail\nNone\nC v. C/1d4 damage\nNone\nSubtle, Special\nDancing Girls\nNone\nC v. W/2d4 damage\nNone\nSubtle, Special\nHired Friends\nNone\nC v. C/1d6 damage\nNone\nSubtle, Special\nSaboteurs\nNone\nC v. W/2d4 damage\nNone\nSubtle, Special\nBewitching Charmer\nLow\nC v. C/Special\nNone\nSubtle, Special\nCovert Transport\nNone\nNone\nNone\nSubtle, Special\nOccult Infiltrators\nMedium\nC v. C/2d6 damage\nNone\nSubtle, Special\nSpymaster\nNone\nC v. C/1d6 damage\n2d6 damage\nSubtle\nCourt Patronage\nNone\nC v. C/1d6 damage\n1d6 damage\nSubtle, Special\nIdealistic Thugs\nNone\nC v. F/1d6 damage\n1d6 damage\nSubtle\nSeditionists\nNone\nSpecial\nNone\nSubtle\nVigilant Agents\nNone\nNone\n1d4 damage\nSubtle, Special\nCryptomancers\nLow\nC v. C/Special\nNone\nSubtle\nOrganization Moles\nNone\nC v. C/2d6 damage\nNone\nSubtle\nShapeshifters\nMedium\nC v. C/2d6 damage\nNone\nSubtle, Special\nInterrupted Logistics\nNone\nNone\nNone\nSubtle, Special\nProphet\nNone\nC v. C/2d8 damage\n1d8 damage\nSubtle\nUnderground Roads\nNone\nNone\nNone\nSubtle, Special\nExpert Treachery\nNone\nC v. C/Special\nNone\nSubtle\nMindbenders\nMedium\nNone\n2d8 damage\nSubtle\nPopular Movement\nNone\nC v. C/2d6 damage\n1d6 damage\nSubtle, Special\nJust As Planned\nNone\nNone\n1d10 damage\nSubtle, Special\nOmniscient Seers\nHigh\nNone\n1d8 damage\nSubtle, Special","ru":"**Всевидящие провидцы:** В начале их хода каждый враждебный затаившийся Актив в пределах перемещения одного хода от Всевидящих провидцев должен преуспеть в проверке Хитрости против Хитрости против владеющей фракции — или потерять качество «Затаённый». Вдобавок все броски Хитрости, которые фракция делает за отряды и события в пределах перемещения одного хода от провидцев, получают дополнительную кость.\n\n**Всё по плану:** На фракцию работает некий гениально хитроумный вдохновитель. Всякий раз, когда Активы фракции делают бросок с участием Хитрости, они могут перебросить проваленную проверку ценой 1d6 урона Активу «Всё по плану». Так можно поступать многократно, хотя это может и уничтожить Актив. Дальность у этой выгоды не ограничена.\n\n**Гнущие разум:** Раз за ход свободным действием Гнущие разум могут заставить соперничающую фракцию перебросить только что сделанную проверку, Атаку или иной бросок кости и принять тот результат, который Гнущим разум больше нравится. Одну и ту же фракцию так можно затронуть лишь один раз до начала следующего хода фракции Гнущих разум.\n\n**Диверсанты:** Актив, Атакованный Диверсантами, в следующий ход не может использовать никакие свои способности свободного действия — неважно, была Атака успешной или нет.\n\n**Идейные громилы:** Легко управляемые горячие головы завербованы под тем идеологическим или религиозным знаменем, которое лучше всего распаляет их на насилие.\n\n**Контрабандисты:** Свободным действием раз за ход фракций Контрабандисты могут переместить любой союзный Актив Богатства или Хитрости из своего местоположения в пункт назначения в пределах дальности перемещения — даже туда, куда Актив без качества «Неприметный» обычно не пустили бы.\n\n**Криптоманты:** Вместо действия «Атака» они могут совершить атаку Хитростью против Хитрости на конкретный враждебный Актив в пределах одного перемещения. При успехе целевой Актив в следующий ход фракции своего владельца не может ничего делать, и использовать его ни для чего нельзя. При провале Криптоманты не получают урона от Контратаки.\n\n**Кроты в организациях:** Спящие агенты и глубоко внедрённые шпионы вгрызаются во враждебные организации и ждут приказа подорвать их изнутри.\n\n**Мастер шпионажа:** Ветеран тайных операций держит в этих краях контрразведывательное бюро.\n\n**Мастерское предательство:** При успешной Атаке Мастерского предательства этот Актив теряется, его фракция-владелец получает 5 Казны, а Актив, бывший целью Мастерского предательства, переходит на другую сторону. Переманивание происходит, даже если новым владельцам не хватает атрибутов, обычно необходимых для содержания нового Актива.\n\n**Мелкие провидцы:** Фракция завербовала когорту умелых гадателей и мелких оракулов, чтобы те предвидели опасности и позволяли быстро отвечать ударом на удар.\n\n**Наёмные друзья:** Свободным действием раз за ход фракция может потратить 1 Казны и дать Активу Богатства в пределах перемещения одного хода качество «Неприметный». Качество держится, пока Наёмные друзья не будут уничтожены или не используют эту способность снова.\n\n**Народное движение:** Любому дружественному Активу позволено переместиться в местоположение Народного движения, даже если хозяева этого места обычно запретили бы это, а качества «Неприметный» у Актива нет. Если Народное движение позже переместится или будет уничтожено, такие Активы тоже должны уйти — или испытать обычные последствия для Актива без качества «Неприметный».\n\n**Неусыпные агенты:** От этих бдительных контрразведчиков к фракции стекается непрерывный поток наблюдений. Всякий раз, когда другая фракция перемещает затаившийся Актив в местоположение в пределах одного перемещения от Неусыпных агентов, те могут совершить атаку Хитростью против Хитрости против владеющей фракции. При успехе вторгшийся Актив, завершив перемещение, теряет качество «Затаённый».\n\n**Оккультные лазутчики:** На службу фракции завербованы магически одарённые шпионы и убийцы. Активы «Оккультные лазутчики» всегда начинают игру с качеством «Затаённый».\n\n**Осведомители:** Свободным действием раз за ход фракция может потратить 1 Казны и пустить Осведомителей искать затаившиеся Активы. Для этого Осведомители выбирают фракцию и совершают против неё Атаку Хитростью против Хитрости. При провале они не получают урона от контратаки, а при успехе раскрываются все затаившиеся Активы этой фракции в пределах одного перемещения от Осведомителей.\n\n**Перевёртыши:** Свободным действием раз за ход фракция может потратить 1 Казны и дать Перевёртышам качество «Затаённый».\n\n**Подземные тропы:** Вокруг этого Актива далеко раскинулась налаженная сеть тайных путей. Свободным действием фракция может заплатить 1 Казны и переместить любой дружественный Актив из местоположения в пределах перемещения одного хода от Подземных троп в пункт назначения тоже в пределах одного хода от Троп.\n\n**Подорванные пути снабжения:** Незатаившиеся враждебные отряды не могут войти в местоположение Актива «Подорванные пути снабжения», не заплатив 1d4 Казны и не потратив на прибытие лишний ход ожидания.\n\n**Полезные идиоты:** В этом Активе собраны наймиты, пешки, глупые идеалисты и прочая расходная мелюзга. Если другой Актив в пределах перемещения одного хода от Полезных идиотов попадает под Атаку, фракция может вместо этого пожертвовать Полезными идиотами и свести атаку на нет. За один ход можно пожертвовать лишь одной шайкой Полезных идиотов.\n\n**Придворное покровительство:** Могущественные вельможи или чиновники расставляют своих агентов на доходные посты. Актив «Придворное покровительство» автоматически приносит владеющей фракции 1 Казны каждый ход.\n\n**Пророк:** Будь то религиозный пророк, харизматичный философ, вождь мятежников или иной любимец народа — этот Актив прочно подконтролен фракции.\n\n**Смутьяны:** Вместо действия «Атака» владельцы Смутьянов могут потратить 1d4 Казны и прикрепить этот Актив к враждебному Активу в том же местоположении. Пока Смутьяны не уничтожены, не переберутся в другой Актив и не покинут это местоположение, охваченный смутой Актив нельзя ни для чего использовать, и никаких выгод он не даёт.\n\n**Тайная перевозка:** Свободным действием раз за ход фракция может заплатить 1 Казны и переместить любой Актив Хитрости или Богатства, находящийся в одном местоположении с Тайной перевозкой. Перевезённый Актив получает качество «Затаённый», пока не совершит какое-нибудь действие или не будет иначе использован фракцией.\n\n**Танцовщицы:** Танцовщицы и прочие обворожительные отвлечения невосприимчивы к урону Атак и Контратак Активов Мощи, но и сами не могут защищаться от Атак Активов Мощи.\n\n**Чарующий обольститель:** Когда Чарующий обольститель преуспевает в Атаке, целевой Актив не может покинуть местоположение Чарующего обольстителя, пока тот не переместится или не будет уничтожен. Чарующие обольстители невосприимчивы к Контратаке.\n\n**Шантаж:** Пока Актив «Шантаж» стоит в местоположении, враждебные фракции не могут бросать больше одной кости в Атаках, которые они совершают там или которые совершают против них, — даже если черты или Активы обычно дают им бонусные кости.\n\nВ таблице ниже Х — Хитрость, М — Мощь, Б — Богатство; «пр.» — «против».\n\n| Актив Хитрости | Цена | ПЗ | Магия | Атака | Контратака | Качества |\n|---|---|---|---|---|---|---|\n| **Хитрость 1** | | | | | | |\n| Контрабандисты | 2 | 4 | Нет | Х пр. Б/1d4 урона | Нет | Неприметный, Действие |\n| Мелкие провидцы | 2 | 2 | Средняя | Нет | 1d6 урона | Неприметный |\n| Осведомители | 2 | 3 | Нет | Х пр. Х/Особое | Нет | Неприметный, Особое |\n| Полезные идиоты | 1 | 2 | Нет | Нет | Нет | Неприметный, Особое |\n| **Хитрость 2** | | | | | | |\n| Диверсанты | 5 | 6 | Нет | Х пр. Б/2d4 урона | Нет | Неприметный, Особое |\n| Наёмные друзья | 4 | 4 | Нет | Х пр. Х/1d6 урона | Нет | Неприметный, Особое |\n| Танцовщицы | 4 | 3 | Нет | Х пр. Б/2d4 урона | Нет | Неприметный, Особое |\n| Шантаж | 4 | 4 | Нет | Х пр. Х/1d4 урона | Нет | Неприметный, Особое |\n| **Хитрость 3** | | | | | | |\n| Мастер шпионажа | 8 | 4 | Нет | Х пр. Х/1d6 урона | 2d6 урона | Неприметный |\n| Оккультные лазутчики | 6 | 4 | Средняя | Х пр. Х/2d6 урона | Нет | Неприметный, Особое |\n| Тайная перевозка | 8 | 4 | Нет | Нет | Нет | Неприметный, Особое |\n| Чарующий обольститель | 6 | 4 | Низкая | Х пр. Х/Особое | Нет | Неприметный, Особое |\n| **Хитрость 4** | | | | | | |\n| Идейные громилы | 8 | 12 | Нет | Х пр. М/1d6 урона | 1d6 урона | Неприметный |\n| Неусыпные агенты | 12 | 8 | Нет | Нет | 1d4 урона | Неприметный, Особое |\n| Придворное покровительство | 8 | 8 | Нет | Х пр. Х/1d6 урона | 1d6 урона | Неприметный, Особое |\n| Смутьяны | 12 | 8 | Нет | Особое | Нет | Неприметный |\n| **Хитрость 5** | | | | | | |\n| Криптоманты | 14 | 6 | Низкая | Х пр. Х/Особое | Нет | Неприметный |\n| Кроты в организациях | 8 | 10 | Нет | Х пр. Х/2d6 урона | Нет | Неприметный |\n| Перевёртыши | 14 | 8 | Средняя | Х пр. Х/2d6 урона | Нет | Неприметный, Особое |\n| **Хитрость 6** | | | | | | |\n| Подземные тропы | 18 | 15 | Нет | Нет | Нет | Неприметный, Особое |\n| Подорванные пути снабжения | 20 | 10 | Нет | Нет | Нет | Неприметный, Особое |\n| Пророк | 20 | 10 | Нет | Х пр. Х/2d8 урона | 1d8 урона | Неприметный |\n| **Хитрость 7** | | | | | | |\n| Гнущие разум | 20 | 10 | Средняя | Нет | 2d8 урона | Неприметный |\n| Мастерское предательство | 10 | 5 | Нет | Х пр. Х/Особое | Нет | Неприметный |\n| Народное движение | 25 | 16 | Нет | Х пр. Х/2d6 урона | 1d6 урона | Неприметный, Особое |\n| **Хитрость 8** | | | | | | |\n| Всевидящие провидцы | 30 | 10 | Высокая | Нет | 1d8 урона | Неприметный, Особое |\n| Всё по плану | 40 | 15 | Нет | Нет | 1d10 урона | Неприметный, Особое |"},{"n":"6.9.0","l":2,"te":"Force Assets","tr":"Активы Мощи","en":"Apocalypse Engine: One of a number of hideously powerful ancient \nsuper-weapons unearthed from some lost armory, an Apocalypse \nEngine rains some eldritch horror down on a targeted enemy Asset.\nBrilliant General: A leader for the ages is in service with the faction. \nWhenever the Brilliant General or any allied Force Asset in the same \nlocation Attacks or is made to defend, it can roll an extra die to do so.\nCavalry: Mounted troops, chariots, or other mobile soldiers are in \nservice to the faction. While weak on defense, they can harry logistics \nand mount powerful charges.\nDemonic Slayer: Powerful sorcerers have summoned or constructed \nan inhuman assassin-beast to hunt down and slaughter the faction’s \nenemies. A Demonic Slayer enters play Stealthed.\nEnchanted Elites: A carefully-selected group of skilled warriors \nare given magical armaments and arcane blessings to boost their \neffectiveness.\nFearful Intimidation: Judicious exercises of force have intimidated \nthe locals, making them reluctant to cooperate with any group that \nstands opposed to the faction.\nFortification Program: A program of organized fortification and \nsupply caching has been undertaken around the Asset’s location, \nhardening allied communities and friendly Assets. Once per turn, \nwhen an enemy makes an Attack that targets the faction’s Force rating, \nthe faction can use the Fortification Program to defend if the Asset is \nwithin a turn’s move from the attack.\nGuerrilla Populace: The locals have the assistance of trained guer-\nrilla warfare leaders who can aid them in sabotaging and attacking \nunwary hostiles.\nInfantry: Common foot soldiers have been organized and armed \nby the faction. While rarely particularly heroic in their capabilities, \nthey have the advantage of numbers.\nInvincible Legion: The faction has developed a truly irresistible \nmilitary organization that can smash its way through opposition with-\nout the aid of any support units. During a Relocate Asset action, the \nInvincible Legion can relocate to locations that would otherwise not \npermit a formal military force to relocate there, as if it had the Subtle \nquality. It is not, however, in any way subtle.\nKnights: Elite warriors of considerable personal prowess have been \ntrained or enlisted by the faction, either from noble sympathizers, \nveteran members, or amenable mercenaries.\nLocal Guard: Ordinary citizens are enlisted into night watch patrols \nand local guard units. They’re most effective when defending from \nbehind a fortified position, but they have some idea of how to use \ntheir weapons.\nMagical Logistics: An advanced web of magical Workings, skilled \nsorcerers, and trained logistical experts are enlisted to streamline the \nfaction’s maintenance and sustain damaged units. Once per faction \nturn, as a free action, the Asset can repair 2 hit points of damage to \nan allied Force Asset.\nMilitary Roads: The faction has established a network of roads \nwith a logistical stockpile at this Asset’s location. As a consequence, \nonce per faction turn, the faction can move any one Asset from any \nlocation within its reach to any other location within its reach at a \ncost of 1 Treasure.\nMilitary Transport: A branch of skilled teamsters, transport ships, \nroad-building crews, or other logistical facilitators is in service to the \nfaction. As a free action once per faction turn, it can bring an allied \nAsset to its location, provided they’re within one turn’s movement \nrange, or move an allied Asset from its own location to a target also \nwithin a turn’s move. Multiple Military Transport assets can chain this\nmovement over long distances.\nPurity Rites: A rigorous program of regular mental inspection and \ncounterintelligence measures has been undertaken by the faction. \nThis Asset can only defend against attacks that target the faction’s \nCunning, but it allows the faction to roll an extra die to defend.\nReserve Corps: Retired military personnel and rear-line troops are \nspread through the area as workers or colonists, available to resist \nhostilities as needed.\nScouts: Long-range scouts and reconnaissance experts work for the \nfaction, able to venture deep into hostile territory.\nSiege Experts: These soldiers are trained in trenching, sapping, and \nrazing targeted structures. When they successfully Attack an enemy \nAsset, the owner loses 1d4 points of Treasure from their reserves and \nthis faction gains it. \nSummoned Hunter: A skilled sorcerer has summoned a magical \nbeast or mentally bound a usefully disposable assassin into the fac-\ntion’s service.\nTemple Fanatics: Fanatical servants of a cult, ideology, or larger \nreligion, these enthusiasts wreak havoc on enemies without a thought \nfor their own lives. After every time the Temple Fanatics defend or \nsuccessfully attack, they take 1d4 damage.\nThugs: These gutter ruffians and common kneebreakers have been \norganized in service to the faction’s causes.\nVanguard Unit: This unit is specially trained to build bridges, reduce \nfortifications, and facilitate a lightning strike into enemy territory. \nWhen its faction takes a Relocate Asset turn, it can move the Vanguard \nUnit and any allied units at the same location to any other location \nwithin range, even if the unit type would normally be prohibitive from \nmoving there. Thus, a Force asset could be moved into a foreign na-\ntion’s territory even against their wishes. The unit may remain at that \nlocation afterwards even if the Vanguard Unit leaves.\nWar Fleet: While a war fleet can only Attack assets and locations \nwithin reach of the waterways, once per turn it can freely relocate \nitself to any coastal area within movement range. The Asset itself \nmust be based out of some landward location to provide for supply \nand refitting.\nWar Machines: Mobile war machines driven by trained beasts or \nmagical motive power are under the faction’s control.\nWarshaped: The faction has the use of magical creatures designed \nspecifically for warfare, or ordinary humans that have been greatly \naltered to serve the faction’s needs. Such forces are few and elusive \nenough to evade easy detection.\nWitch Hunters: Certain personnel are trained in sniffing out traitors \nand spies in the organization, along with the presence of hostile \nmagic or hidden spellcraft.\nForce 1\nForce 2\nForce 3\nForce 4\nForce 5\nForce 6\nForce 7\nForce 8\nForce Asset\nCost\nHP\nMagic\nAttack\nCounter\nQualities\nFearful Intimidation\nNone\nNone\n1d4 damage\nLocal Guard\nNone\nF v. F/1d3+1 damage\n1d4+1 damage\nSummoned Hunter\nMedium\nC v. F/1d6 damage\nNone\nSubtle\nThugs\nNone\nF v. C/1d6 damage\nNone\nSubtle\nGuerrilla Populace\nNone\nF v. F/1d4+1 damage\nNone\nMilitary Transport\nNone\nNone\nNone\nAction\nReserve Corps\nNone\nF v. F/1d6 damage\n1d6 damage\nScouts\nNone\nF v. F/2d4 damage\n1d4+1 damage\nSubtle\nEnchanted Elites\nMedium\nF v. F/1d10 damage\n1d6 damage\nSubtle\nInfantry\nNone\nF v. F/1d8 damage\n1d6 damage\nTemple Fanatics\nNone\nF v. F/2d6 damage\n2d6 damage\nSpecial\nWitch Hunters\nLow\nC v. C/1d4+1 damage\n1d6 damage\nCavalry\nNone\nF v. F/2d6 damage\n1d4 damage\nMilitary Roads\nNone\nNone\nNone\nAction\nVanguard Unit\nNone\nNone\n1d6 damage\nAction\nWar Fleet\nNone\nF v. F/2d6 damage\n1d8 damage\nAction\nDemonic Slayer\nHigh\nC v. C/2d6+2 damage\nNone\nSubtle, Special\nMagical Logistics\nMedium\nNone\nNone\nSpecial\nSiege Experts\nNone\nF v. W/1d6 damage\n1d6 damage\nFortification Program\nNone\nNone\n2d6 damage\nAction\nKnights\nNone\nF v. F/2d8 damage\n2d6 damage\nWar Machines\nMedium\nF v. F/2d10+4 damage\n1d10 damage\nBrilliant General\nNone\nC v. F/1d8 damage\nNone\nSubtle, Special\nPurity Rites\nLow\nNone\n2d8+2 damage\nSpecial\nWarshaped\nHigh\nF v. F/2d8+2 damage\n2d8 damage\nSubtle\nApocalypse Engine\nMedium\nF v. F/3d10+4 damage\nNone\nInvincible Legion\nNone\nF v. F/2d10+4 damage\n2d10+4 damage\nSpecial","ru":"**Боевые машины:** Под контролем фракции — подвижные боевые машины, которые движут обученные звери или магическая тяга.\n\n**Военные дороги:** Фракция проложила сеть дорог с тыловым складом в местоположении этого Актива. Благодаря этому раз за ход фракций фракция может переместить любой один Актив из любого местоположения в пределах досягаемости в любое другое местоположение в пределах досягаемости, заплатив 1 Казны.\n\n**Военный обоз:** Фракции служит корпус умелых возчиков, транспортных судов, дорожно-строительных артелей и прочих пособников снабжения. Свободным действием раз за ход фракций он может доставить союзный Актив к себе, если тот в пределах перемещения одного хода, или переместить союзный Актив из собственного местоположения к цели тоже в пределах хода перемещения. Несколько Активов «Военный обоз» могут передавать это перемещение по цепочке на большие расстояния.\n\n**Военный флот:** Военный флот может Атаковать Активы и местоположения только в досягаемости водных путей, зато раз за ход может свободно перебазироваться в любую прибрежную зону в пределах дальности перемещения. Сам Актив должен стоять в каком-то месте на суше, обеспечивающем снабжение и ремонт.\n\n**Выкованные для войны:** Фракция располагает магическими существами, созданными нарочно для войны, или обычными людьми, глубоко переделанными под её нужды. Таких бойцов немного, и они достаточно неуловимы, чтобы уходить от лёгкого обнаружения.\n\n**Гениальный полководец:** Фракции служит полководец, каких рождается один на век. Когда Гениальный полководец или любой союзный Актив Мощи в том же местоположении Атакует или вынужден защищаться, он может бросить для этого дополнительную кость.\n\n**Громилы:** Уличная шпана и обычные костоломы, организованные на службу делу фракции.\n\n**Демонический убийца:** Могущественные чародеи призвали или собрали нечеловеческую тварь-убийцу, чтобы выслеживать и истреблять врагов фракции. Демонический убийца входит в игру затаившимся.\n\n**Зачарованная элита:** Тщательно отобранные умелые воины получают магическое вооружение и тайные благословения, повышающие их действенность.\n\n**Конница:** Фракции служат конные войска, колесницы или иные подвижные бойцы. Слабые в обороне, они умеют терзать пути снабжения и наносить сокрушительные удары с наскока.\n\n**Магическое снабжение:** Развитая сеть магических Творений, умелых чародеев и опытных снабженцев налаживает содержание сил фракции и поддерживает потрёпанные отряды. Раз за ход фракций свободным действием этот Актив может починить 2 пункта здоровья союзному Активу Мощи.\n\n**Мастера осады:** Эти солдаты обучены рыть траншеи, вести подкопы и сносить намеченные постройки. Когда они успешно Атакуют вражеский Актив, его владелец теряет 1d4 пункта Казны из запасов, а эта фракция их получает.\n\n**Машина апокалипсиса:** Одно из чудовищно мощных древних сверхорудий, извлечённых из какого-нибудь утраченного арсенала. Машина апокалипсиса обрушивает на целевой вражеский Актив некий потусторонний ужас.\n\n**Местная стража:** Обычные горожане записаны в ночные дозоры и отряды местной стражи. Лучше всего они обороняются из-за укреплений, но как держать оружие, в целом представляют.\n\n**Непобедимый легион:** Фракция выстроила поистине неодолимую военную силу, способную проламываться сквозь сопротивление без всяких вспомогательных частей. При действии «Переместить Актив» Непобедимый легион может войти туда, куда регулярному войску входить обычно нельзя, как будто у него есть качество «Неприметный». Неприметным он при этом ни в малейшей степени не является.\n\n**Обряды чистоты:** Фракция ведёт строгую программу регулярных досмотров умов и контрразведывательных мер. Этот Актив может защищаться только от атак, нацеленных на Хитрость фракции, но позволяет фракции бросать при защите дополнительную кость.\n\n**Охотники на ведьм:** Особые люди обучены вынюхивать предателей и шпионов в организации, а заодно чуять враждебную магию и скрытое чародейство.\n\n**Партизанское население:** Местным помогают обученные вожаки партизанской войны, способные вести их в диверсиях и нападениях на неосторожных врагов.\n\n**Передовой отряд:** Этот отряд специально обучен наводить мосты, срывать укрепления и прокладывать путь молниеносному удару в глубь вражеской территории. Когда его фракция выполняет ход с действием «Переместить Актив», она может переместить Передовой отряд и любые союзные отряды из того же местоположения в любое другое местоположение в пределах дальности — даже если отрядам такого типа туда обычно хода нет. Так Актив Мощи можно ввести на территорию чужой державы даже против её воли. Отряд может остаться там и после ухода Передового отряда.\n\n**Пехота:** Фракция организовала и вооружила простых пеших солдат. Геройства от них ждать не приходится, зато у них есть преимущество числа.\n\n**Призванный охотник:** Умелый чародей призвал магического зверя или мысленно подчинил полезного расходного убийцу на службу фракции.\n\n**Разведчики:** На фракцию работают дальние разведчики и мастера рекогносцировки, способные забираться глубоко на враждебную территорию.\n\n**Резервный корпус:** Отставные военные и тыловые части расселены по округе как работники или колонисты, готовые при нужде дать отпор врагу.\n\n**Рыцари:** Фракция обучила или завербовала элитных воинов немалой личной удали — из сочувствующих дворян, ветеранов движения или сговорчивых наёмников.\n\n**Сеть укреплений:** Вокруг местоположения Актива развёрнута программа планомерной фортификации и закладки припасов, укрепляющая союзные общины и дружественные Активы. Раз за ход, когда враг совершает Атаку, нацеленную на рейтинг Мощи фракции, фракция может защищаться Сетью укреплений, если этот Актив находится в пределах хода перемещения от места атаки.\n\n**Устрашение:** Расчётливые показы силы запугали местных, и теперь они неохотно сотрудничают с любой группой, вставшей против фракции.\n\n**Храмовые фанатики:** Фанатичные слуги культа, идеологии или большой религии, эти ревнители сеют опустошение среди врагов, не думая о собственной жизни. Каждый раз после того, как Храмовые фанатики защищаются или успешно атакуют, они получают 1d4 урона.\n\n| Актив Мощи | Цена | ПЗ | Магия | Атака | Контратака | Качества |\n|---|---|---|---|---|---|---|\n| **Мощь 1** | | | | | | |\n| Громилы | 2 | 1 | Нет | М пр. Х/1d6 урона | Нет | – |\n| Местная стража | 3 | 4 | Нет | М пр. М/1d3+1 урона | 1d4+1 урона | – |\n| Призванный охотник | 4 | 4 | Средняя | Х пр. М/1d6 урона | Нет | Неприметный |\n| Устрашение | 2 | 4 | Нет | Нет | 1d4 урона | Неприметный |\n| **Мощь 2** | | | | | | |\n| Военный обоз | 4 | 6 | Нет | Нет | Нет | Действие |\n| Партизанское население | 6 | 4 | Нет | М
