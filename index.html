ne. More than one Morale check may be needed in a fight if more than one condition occurs.\n- When a non-combatant civilian is first faced with the prospect of serious physical harm.\n- When the first member of a group is killed or rendered incapacitated.\n- When the group starts to visibly lose the fight or see their odds of victory considerably shrink.\n- When the group faces some terrifying work of magic, a horrendous slaughter, or a vastly superior foe.\nThe consequences of a failed Morale check will vary based on the situation and the creatures being tested. Non-combatants and undisciplined fighters will generally flee madly, dropping shields and abandoning burdens as they try to escape their doom.\nTrained and experienced warriors will usually make a fighting withdrawal, trying to pull away from their enemies and escape back to safety with as many of their comrades as they can. Of course, in the face of truly devastating situations they may flee just as readily as their green compatriots.\nIf flight seems impossible or prohibitively dangerous, they might throw down their weapons and beg for mercy, if they think they have any chance of receiving it from their assailants. If that seems hopeless, they might just collapse in terrified despair as they pray to their gods, or fight with a renewed frenzy in a desperate attempt to cut their way out of the trap. Some may offer bribes or favors to win their lives.\nIn all cases, once a side has failed its Morale check, it’s not going to be in a condition to fight those foes until it’s had some time to recover its courage.","ru":"Для проверки боевого духа бросается 2d6, и результат сравнивается с показателем боевого духа существа. Если бросок больше показателя, существо падает духом и будет стремиться сбежать или прекратить бой. ПИ никогда не делают проверок боевого духа и сражаются, пока сами не решат отступить.\n\nПроверка боевого духа обычно делается при определённых обстоятельствах, но Мастер может дополнять этот список всякий раз, когда, по его мнению, ситуация того требует. За один бой может понадобиться не одна проверка боевого духа, если наступает несколько условий.\n\n* Когда мирный человек, не боец, впервые сталкивается с перспективой серьёзного физического вреда.\n* Когда первого участника группы убивают или выводят из строя.\n* Когда группа начинает заметно проигрывать бой или её шансы на победу существенно тают.\n* Когда группа сталкивается с ужасающим проявлением магии, чудовищной бойней или несоизмеримо превосходящим противником.\n\nПоследствия проваленной проверки боевого духа зависят от ситуации и от того, кто её проваливает. Небойцы и недисциплинированные вояки обычно бегут без оглядки, бросая щиты и поклажу в попытке спастись от гибели.\n\nОбученные и опытные воины обычно совершают боевой отход, стараясь оторваться от врага и увести в безопасность как можно больше товарищей. Разумеется, перед лицом поистине сокрушительных обстоятельств они могут побежать так же резво, как их зелёные собратья.\n\nЕсли бегство кажется невозможным или чрезмерно опасным, они могут бросить оружие и молить о пощаде — если считают, что есть хоть какой-то шанс получить её от нападающих. Если и это выглядит безнадёжным, они могут просто осесть на землю в парализующем отчаянии, молясь своим богам, или драться с новым неистовством в отчаянной попытке прорубить себе путь из западни. Кто-то предложит откуп или услуги в обмен на свою жизнь.\n\nВ любом случае, провалив проверку боевого духа, сторона будет не в состоянии сражаться с этими врагами, пока не получит время собраться с духом."},{"n":"5.3.2","l":3,"te":"Fleeing and Escape","tr":"Бегство и спасение","en":"Whether from a failed Morale check or the PCs deciding on a prudent retreat, sometimes a side decamps the field. If pursued, the rules for chases and pursuit given in the rules section of this document can be used to judge the likelihood of success.\nGMs should be charitable about allowing PCs to run away. Most pursuers have little reason to be particularly relentless, and a party should be taught that running away is a viable option and not an excuse to die tired.\n### The Importance of Morale\nIt’s very important that GMs keep Morale checks in mind and use them regularly during combat. Only truly abnormal creatures such as mindless undead, unthinking vermin, or command-bound automatons will fight relentlessly onward regardless of the situation. If every goblin warrior is a Spartan at Thermopylae, the PCs are going to lose a lot of comrades cleaning up fights that were clearly won five rounds ago.\nAside from that, warriors are not fools, and they will not linger to fight battles that cannot be won and are not worth their lives. Even if they never fail a Morale check, they will not stay to die to the last man if there’s no pressing reason for them to do so. Once they see that victory is a vain hope, they’ll try to withdraw or to cut some kind of deal with their enemies.\nOf course, not all beaten sides respond rationally. The terror of battle, the confusion of melee, and a misunderstanding of the situation might leave some few warriors battling on even when all is lost, simply because they haven’t realized that all their friends are dead yet. Green troops are notorious for sometimes achieving military goals that veterans never could, because veterans would recognize certain failure much earlier. The same can sometimes apply to frenetic barbarians, savage mobs, or single-minded marauders.","ru":"Из-за проваленной проверки боевого духа или благоразумного решения ПИ отступить — но порой одна из сторон покидает поле. Если за ней гонятся, шансы на успех можно оценить по правилам погонь и преследования, приведённым в разделе правил этого документа.\n\nМастеру стоит быть великодушным, позволяя ПИ убегать. У большинства преследователей мало причин для особого упорства, а партию нужно приучить, что бегство — рабочий вариант, а не способ умереть усталым.\n\n### Важность боевого духа\n\nОчень важно, чтобы Мастер помнил о проверках боевого духа и регулярно применял их в бою. Лишь по-настоящему аномальные существа — безмозглая нежить, неразумные гады да скованные приказом автоматоны — будут неумолимо драться дальше, что бы ни происходило. Если каждый гоблин-воин — спартанец при Фермопилах, ПИ потеряют немало товарищей, дочищая бои, которые были явно выиграны пять раундов назад.\n\nКроме того, воины не дураки: они не станут задерживаться в битвах, которые нельзя выиграть и которые не стоят их жизней. Даже ни разу не провалив проверку боевого духа, они не останутся умирать до последнего человека, если нет веской причины так поступать. Поняв, что победа — пустая надежда, они попытаются отойти или сторговаться с врагом о какой-нибудь сделке.\n\nКонечно, не всякая битая сторона ведёт себя разумно. Ужас боя, сумятица рукопашной и непонимание происходящего могут заставить горстку воинов драться дальше, даже когда всё потеряно, — просто потому, что они ещё не осознали, что все их друзья уже мертвы. Зелёные войска печально знамениты тем, что порой добиваются военных целей, недостижимых для ветеранов: ветераны распознали бы верный провал куда раньше. То же порой относится к исступлённым варварам, озверевшим толпам и одержимым одной целью мародёрам."},{"n":"5.4.0","l":2,"te":"Instinct Checks","tr":"Проверки Инстинкта","en":"Very few creatures are capable of engaging in desperate, life-ordeath struggles without losing some amount of their rationality. Terror, fury, excruciating pain, and situational blindness can sometimes make a combatant do something genuinely stupid, even if they would never have made such a mistake in calmer circumstances The Instinct check is the game’s way of helping a GM take this situational chaos into account.","ru":"Очень немногие существа способны вести отчаянную схватку не на жизнь, а на смерть, не теряя при этом части рассудительности. Ужас, ярость, невыносимая боль и слепота к происходящему вокруг порой заставляют бойца сделать откровенную глупость, которой он никогда не совершил бы в спокойной обстановке. Проверка Инстинкта — это способ, которым игра помогает Мастеру учесть этот ситуационный хаос."},{"n":"5.4.1","l":3,"te":"Making an Instinct Check","tr":"Как делать проверку Инстинкта","en":"Whenever an Instinct check is triggered, the GM rolls a 1d10. If the number rolled is equal or less than a combatant’s Instinct score, measured from 1 to 10, they do something impulsive, short-sighted, instinctual, or otherwise less-than-tactically-sound. Instinct checks are rolled separately for individual combatants, though the GM can simply decide that an appropriate percentage of large groups automatically fail the check. If the creatures have an Instinct of 3, for example, the GM might just decide that 30% of them fail the check rather than dicing for every one.\nPCs never make Instinct checks. Even in the grip of terror or traumatic injury they remain in control of their own choices. Heroically well-trained or tactically-expert enemies with an Instinct score of zero might likewise be immune to Instinct checks. Even martial paragons might be susceptible to Instinct, however, if they’re so proud, blase, or contemptuous of their foes that they fail to fight them with their utmost cunning.\nWhen an Instinct check is failed, a creature will do something thoughtless or sub-optimal that is in line with their natural instincts. The adjacent tables offer example suggestions for various types of creatures, but a GM can simply decide the most reasonable reaction based on the situation and the combatants. A GM should use these instances as opportunities to show off the nature of an enemy or the instincts of a bestial foe, or to set up some battlefield situation that isn’t necessarily tactically-optimal for the enemy but is still troublesome for the heroes. Actions taken as a result of a failed Instinct check will usually only occupy one round worth of the creature’s efforts.\nActions forced by an Instinct check failure won’t necessarily be entirely useless, but they won’t be the wisest or most effective use of the creature’s abilities. Blindly attacking sub-optimal targets, recklessly using unarmed attacks rather than the weapon in hand, or aiming spells or shots at targets of lesser importance might all be actions taken as a result of a failed Instinct check.\nInstinct checks are always optional and at the discretion of the GM. Some GMs might choose not to use them at all, judging actions strictly on what seems reasonable to them. In all cases it’s the GM’s final call as to whether or not to roll one.","ru":"Когда что-то вынуждает проверку Инстинкта, Мастер бросает 1d10. Если выпавшее число равно показателю Инстинкта бойца (измеряемому от 1 до 10) или меньше него, тот делает что-то импульсивное, недальновидное, инстинктивное или иным образом тактически сомнительное. Проверки Инстинкта бросаются отдельно за каждого бойца, но для больших групп Мастер может просто решить, что подходящая доля участников проваливает проверку автоматически. Если у существ Инстинкт 3, Мастер может, к примеру, постановить, что проверку проваливают 30% из них, и не кидать кости за каждого.\n\nПИ никогда не делают проверок Инстинкта. Даже в тисках ужаса или тяжёлого ранения они сохраняют власть над собственными решениями. Героически вымуштрованные или тактически безупречные враги с показателем Инстинкта, равным нулю, тоже могут быть неуязвимы для проверок Инстинкта. Впрочем, даже образцовые воители могут поддаться Инстинкту, если они настолько горды, пресыщены или презирают противника, что не сражаются с ним в полную силу своей хитрости.\n\nПровалив проверку Инстинкта, существо сделает что-то бездумное или невыгодное, но отвечающее его природным инстинктам. Таблицы рядом предлагают примеры для разных типов существ, но Мастер может просто выбрать самую правдоподобную реакцию исходя из ситуации и участников боя. Мастеру стоит использовать такие моменты как возможность показать натуру врага или инстинкты дикой твари либо создать на поле боя положение, не обязательно тактически выгодное противнику, но всё равно неудобное для героев. Действия, вызванные провалом проверки Инстинкта, обычно занимают лишь один раунд усилий существа.\n\nДействия, навязанные провалом проверки Инстинкта, не обязательно окажутся совсем бесполезными, но это будет не самое мудрое и не самое эффективное применение способностей существа. Слепая атака невыгодной цели, безрассудная драка голыми руками вместо оружия в ладони, заклинания или выстрелы по второстепенным целям — всё это возможные следствия проваленной проверки Инстинкта.\n\nПроверки Инстинкта всегда необязательны и остаются на усмотрение Мастера. Кто-то может вовсе от них отказаться, оценивая действия строго по тому, что кажется ему разумным. В любом случае последнее слово о том, бросать проверку или нет, — за Мастером."},{"n":"5.4.2","l":3,"te":"When to Make an Instinct Check","tr":"Когда делать проверку Инстинкта","en":"As a general guide, a GM might make an Instinct check for a creature whenever any of the situations below are applicable, or any time the GM thinks the creature might be confused or indecisive.\n- The second round of combat for mobs and undisciplined fighters. The creature could think clearly before starting the fray, but the fear and exhilaration of mortal combat might confuse it.\n- The creature has just had to make a Morale check for any reason. Terror might cloud its thoughts.\n- The enemy just did something confusing or disorienting. When the situation is strange, the creature might fall back on instinct.\n- The enemy did something to enrage or directly intimidate it. Fury or terror might force bad decisions.\n- The creature is presented with something it desires, such as dropped food, hurled money, or other inducements. It might go after the bait instead of the battle if it seems safe to do so.\nOther situations might force Instinct checks as well at the GM’s discretion. Indeed, some situations might be so compelling as to cause automatic check failure. Depending on the situation, the GM might decide a particular response is the only reasonable one, and not bother to randomly pick it from a table.","ru":"Как общий ориентир: Мастер может делать проверку Инстинкта за существо в любой из перечисленных ниже ситуаций — и всякий раз, когда, по его мнению, существо может растеряться или заколебаться.\n\n* Второй раунд боя для толп и недисциплинированных бойцов. До начала свалки существо могло мыслить ясно, но страх и упоение смертельного боя могут сбить его с толку.\n* Существу только что пришлось делать проверку боевого духа по любой причине. Ужас может замутить его мысли.\n* Враг только что сделал что-то непонятное или дезориентирующее. Когда ситуация странная, существо может положиться на инстинкт.\n* Враг чем-то взбесил существо или прямо его запугал. Ярость или ужас могут толкнуть к дурным решениям.\n* Перед существом оказалось что-то желанное: брошенная еда, швырнутые деньги, иная приманка. Оно может заняться приманкой вместо боя, если это выглядит безопасным.\n\nПроверку Инстинкта могут вынудить и другие ситуации — на усмотрение Мастера. Более того, некоторые ситуации могут быть столь неодолимы, что проверка проваливается автоматически. В зависимости от обстоятельств Мастер может решить, что разумна лишь одна конкретная реакция, и не тянуть её случайным образом из таблицы."},{"n":"5.4.3","l":3,"te":"Assigning Instinct Scores","tr":"Как назначать показатели Инстинкта","en":"For non-sentient beasts, a creature’s Instinct score should usually be about 5. Such beasts act largely by instinct in a fightoften very violent instincts.\nFor non-combatant sentients and those unfamiliar with battle, Instinct should be 5 to 7. They are extremely likely to become confused or useless.\nOrdinary intelligent veterans should have an Instinct of 3 or 4. They might get caught up in the confusion of battle and make some poor calls, but they’re unlikely to lose their head entirely.\nHardened, battle-tested fighters might have an Instinct of only 1 or 2, being very unlikely to forget themselves in the chaos of battle.\nThe coldest, calmest killers would have an Instinct of 1, and may not have to make Instinct checks at all outside of the most disorienting situations. They’ll fight according to the plan and won’t lose track of the battle.","ru":"Неразумным зверям обычно стоит давать показатель Инстинкта около 5. В драке такие звери действуют в основном по инстинкту — и инстинкты эти зачастую весьма кровожадны.\n\nРазумным небойцам и тем, кто незнаком с битвой, положен Инстинкт от 5 до 7. Они чрезвычайно склонны растеряться или стать бесполезными.\n\nОбычным толковым ветеранам стоит дать Инстинкт 3 или 4. Их может захлестнуть сумятица боя, и кое-какие решения выйдут скверными, но совсем потерять голову они вряд ли способны.\n\nУ закалённых, проверенных боями воинов Инстинкт может быть всего 1 или 2: они едва ли забудутся в хаосе сражения.\n\nСамым же холодным и невозмутимым убийцам полагается Инстинкт 1, а вне самых дезориентирующих ситуаций им может вовсе не требоваться проверок Инстинкта. Они будут драться по плану и не потеряют нить боя."},{"n":"6.0.0","l":1,"te":"Factions","tr":"Фракции","en":"Factions have several statistics to define their overall qualities. Weak or small factions tend to have low ratings even in their main focus, while kingdoms and major institutions may have a good rating even in their less important traits, simply because they have so many resources available to them.","ru":"Фракцию описывают несколько характеристик, задающих её общие качества. У слабых и мелких фракций рейтинги обычно невысоки даже в главном для них деле, а королевства и крупные институты могут иметь приличный рейтинг даже во второстепенных чертах — просто потому, что ресурсов у них в избытке."},{"n":"6.1.0","l":2,"te":"Faction Statistics","tr":"Характеристики фракций","en":"Cunning is measured from 1 to 8 and indicates the faction’s general guile, skill at subterfuge, and subtlety. Low Cunning means the faction is straightforward or unaccustomed to dealing with trickery, while high Cunning is for Machiavellian schemers and secretive organizations.\n**Force** is measured from 1 to 8 and reflects the overall military prowess and martial competence of the faction. A faction with low Force isn’t used to using violence to get its way, or is particularly inept at it, while a high Force reflects a culture of military expertise.\n**Wealth** is measured from 1 to 8 and shows the faction’s general prosperity, material resources, and facility with money. Low Wealth means the faction is poor, disinterested in material goods, or spendthrift with what they have, while high Wealth factions are rich and familiar with using money and goods as tools for success.\n**Magic** measures the amount of magical resources available to the faction. “None” is for factions that have no meaningful access to magic. “Low” is for those factions that have at best a few trained mages or small stores of magical goods. “Medium” is for a faction where there is an established source of magical power for the faction, either as a sub-group of cooperative mages, a magical academy, a tradition of sorcery in the faction, or some other institutionalized aid. “High” magic is reserved for those factions that have a strong focus on wielding magical power, most fitting for a faction that represents a magical order.\n**Treasure** is counted in points, and the total reflects how much the faction owns in cash and valuable goods. A single point of Treasure doesn’t have an established cash value; a sack of gold is worthless in itself to a faction that needs a dozen oxcarts, and a herd of cattle owned by a faction can’t necessarily be turned into a fixed sum of coin.\nHit points work for factions much as they do for characters; when a faction is reduced to zero hit points, it collapses. Its individual members and sub-groups might not all be dead, but they’re so hopelessly disorganized, dispirited, or conflict-bound that the faction ceases to exist as a coherent whole.\n**Assets** are important resources possessed by a faction, such as controlling a ring of Smugglers, or having a unit of Infantry. Assets all have their own statistics and hit points, and all of them require certain scores in Force, Wealth, Cunning, and Magic to purchase. Assets don’t cover all the resources and institutions the faction may control, but they reflect the ones that are most relevant to the faction at that moment. A kingdom may have more military than the Infantry unit they have, but that Infantry unit is the one that’s doing something important.","ru":"**Хитрость** измеряется от 1 до 8 и показывает общую изворотливость фракции, её мастерство в интригах и умение действовать тонко. Низкая Хитрость означает, что фракция прямолинейна или не привыкла иметь дело с обманом, а высокая — удел макиавеллиевских интриганов и скрытных организаций.\n\n**Мощь** измеряется от 1 до 8 и отражает общее военное умение и боевую выучку фракции. Фракция с низкой Мощью не привыкла добиваться своего насилием или особенно бездарна в нём, а высокая Мощь говорит о культуре военного мастерства.\n\n**Богатство** измеряется от 1 до 8 и показывает общее процветание фракции, её материальные ресурсы и умение обращаться с деньгами. Низкое Богатство означает, что фракция бедна, равнодушна к материальным благам или транжирит то, что имеет, а фракции с высоким Богатством богаты и умеют превращать деньги и товары в орудия успеха.\n\n**Магия** измеряет объём магических ресурсов, доступных фракции. «Нет» — для фракций без сколько-нибудь значимого доступа к магии. «Низкая» — для тех, у кого в лучшем случае найдётся несколько обученных магов или небольшие запасы магических изделий. «Средняя» — для фракции с устоявшимся источником магической силы, будь то содружество магов внутри фракции, магическая академия, собственная традиция чародейства или иная институциональная опора. «Высокая» магия остаётся за фракциями, сосредоточенными на владении магической силой, — лучше всего она подходит фракции, представляющей магический орден.\n\n**Казна** считается в пунктах, и итог отражает, сколько наличности и ценных товаров есть у фракции. У отдельного пункта Казны нет установленной денежной стоимости. Мешок золота сам по себе бесполезен фракции, которой нужна дюжина воловьих повозок, а принадлежащее фракции стадо скота не всегда получится обратить в твёрдую сумму монет.\n\n**Пункты здоровья** работают для фракций почти так же, как для персонажей. Когда пункты здоровья фракции падают до нуля, она рушится. Её отдельные члены и подгруппы не обязательно все погибли, но они настолько безнадёжно разобщены, подавлены или увязли в раздорах, что фракция перестаёт существовать как единое целое.\n\n**Активы** — это важные ресурсы во владении фракции, такие как подконтрольное кольцо Контрабандистов или отряд Пехоты. У каждого Актива есть собственные характеристики и пункты здоровья, и для покупки любого из них нужны определённые значения Мощи, Богатства, Хитрости и Магии. Активы не описывают все ресурсы и институты, какие фракция может контролировать, — только те, что важнее всего для неё прямо сейчас. У королевства может быть больше войск, чем один отряд Пехоты, но именно этот отряд занят чем-то важным."},{"n":"6.2.0","l":2,"te":"The Faction Turn","tr":"Ход фракций","en":"Every month or so, the GM should run a faction turn. This turn may take place more often during times of intense activity, or less often if the campaign world is quiet. In general, a faction turn after every adventure is a good average, assuming the PCs don’t have backto-back adventures.\nAt the start of every faction turn, each faction rolls 1d8 for initiative, the highest rolls going first. Ties are resolved as the GM wishes, and then each faction takes the following steps in order.\n- The faction earns Treasure equal to half their Wealth plus a quarter of their combined Force and Cunning, the total being rounded up.\n- The faction must pay any upkeep required by their individual Asset costs, or by the cost of having too many Assets for their attributes. If they can’t afford this upkeep, individual Assets may have their own bad consequences, while not being able to afford excess Assets means that the excess are lost.\n- The faction triggers any special abilities individual Assets may have, such as abilities that allow an Asset to move or perform some other special benefit.\n- The faction takes one Faction Action as listed in the following section, resolving any Attacks or other consequences from their choice. When an action is taken, every Asset owned by the faction may take it; thus, if Attack is chosen, then every valid Asset owned by the faction can Attack. If Repair Asset is chosen, every Asset can be repaired if enough Treasure is spent.\n- The faction checks to see if it’s accomplished its most recent goal. If so, it collects the experience points for doing so and picks a new goal. If not, it can abandon the old goal and pick a new one, but it will sacrifice its next turn’s Faction Action to do so and may not trigger any Asset special abilities that round, either.\nThe next faction in order then acts until all factions have acted for the turn.","ru":"Примерно раз в месяц Мастеру следует разыгрывать ход фракций. В пору бурных событий этот ход может случаться чаще, а когда мир кампании затих — реже. В целом хороший средний темп — ход фракций после каждого приключения, если только ПИ не идут из приключения в приключение без передышки.\n\nВ начале каждого хода фракций каждая фракция бросает 1d8 на инициативу; кто выбросил больше, тот ходит раньше. Ничьи Мастер разрешает как пожелает, а затем каждая фракция по очереди выполняет следующие шаги.\n\n* Фракция получает Казну, равную половине её Богатства плюс четверть суммы её Мощи и Хитрости; итог округляется вверх.\n* Фракция должна оплатить содержание, которого требуют отдельные Активы, а также плату за Активы сверх того, что позволяют её атрибуты. Если ей нечем оплатить содержание отдельных Активов, у тех могут наступить собственные дурные последствия, а неоплаченные сверхлимитные Активы попросту теряются.\n* Фракция задействует особые способности отдельных Активов — например, те, что позволяют Активу переместиться или дают иную особую выгоду.\n* Фракция выполняет одно действие фракции из перечисленных в следующем разделе, разрешая все Атаки и прочие последствия своего выбора. Когда действие выбрано, выполнить его может каждый Актив фракции. Если выбрана Атака, атаковать может каждый подходящий Актив фракции; если выбрано «Починить Актив», починить можно каждый Актив, на который хватит Казны.\n* Фракция проверяет, достигла ли она своей текущей цели. Если да, она получает за это пункты опыта и выбирает новую цель. Если нет, она может бросить старую цель и взять новую, но пожертвует ради этого действием фракции в следующем ходу и в тот раунд не сможет задействовать особые способности Активов.\n\nЗатем действует следующая по порядку фракция, и так пока все фракции не отходят за этот ход."},{"n":"6.3.0","l":2,"te":"Asset Locations and Movement","tr":"Расположение и перемещение Активов","en":"Every Asset has a location on the campaign map. This location may not be where all the elements of the Asset are located. It might simply be the headquarters of an organization, or the spot where the most active and important members of it are currently working. However it’s described, it’s the center of gravity for the Asset.\nThis location is usually in a town or other settlement, but it could be anything that makes sense. A reclusive Prophet might dwell deep within the wilderness, and a ring of Smugglers might currently be based out of a hidden sea cave. A location is simply wherever the GM thinks it should be.\nAssets can move locations, either with the Move Asset faction action or with a special ability possessed by the Asset itself or an allied unit. Generally, whenever an Asset moves, it can move one turn’s worth of distance.\nAs a rule of thumb, for a one-month turn, this is about one hundred miles. This is as far as an organization can shift itself in thirty days while still maintaining some degree of control and cohesion. The GM may adjust this distance based on the situation; if the campaign is taking place in an island archipelago with fast sea travel it’s going to be easier to move long distances than if the Asset has to march through mountains to get there.\nSome Assets also have special abilities that work on targets within one move of the Asset. Again, the GM decides what this means, but generally it means that the Asset can affect targets within a hundred miles of its location.\nSometimes it doesn’t make logical sense for an Asset to be able to move to a particular location. A unit of Infantry, for example, could hardly walk into an enemy nation’s capital so as to later Attack the Court Patronage Asset there. In this case, the best the Infantry could do would be to move to a location near the capital, assuming the GM decides that’s plausible. The Infantry couldn’t actually Attack the enemy faction’s Assets until they got into the city itself where those Assets were located.\nAssets with the Subtle quality are not limited this way. Subtle Assets can move to locations even where they would normally be prohibited by the ruling powers. Dislodging them requires that they be Attacked until destroyed or moved out by their owner.\nAssets with the Stealth quality are also not limited by this, and can move freely to any location within reach. Stealthed Assets cannot be Attacked by other Assets until they lose the Stealth quality. This happens when they are discovered by certain special Assets or when the Stealthed Asset Attacks something.","ru":"У каждого Актива есть местоположение на карте кампании. Не обязательно там находятся все составные части Актива. Это может быть просто штаб-квартира организации или место, где сейчас работают её самые деятельные и важные члены. Как бы оно ни описывалось, это центр тяжести Актива.\n\nОбычно такое местоположение — город или иное поселение, но им может быть что угодно осмысленное. Пророк-затворник может жить в глухом диком краю, а кольцо Контрабандистов — обосноваться до поры в потайной морской пещере. Местоположение — это попросту то место, какое Мастер сочтёт подходящим.\n\nАктивы могут менять местоположение — действием фракции «Переместить Актив» либо особой способностью самого Актива или союзного отряда. Как правило, при каждом перемещении Актив покрывает расстояние одного хода.\n\nКак ориентир, для месячного хода это около сотни миль. Столько организация способна сместиться за тридцать дней, сохранив хоть какую-то управляемость и связность. Мастер может подправить это расстояние по обстановке: если кампания идёт в островном архипелаге с быстрым морским сообщением, покрывать большие расстояния проще, чем когда Активу пришлось бы маршировать через горы.\n\nУ некоторых Активов есть особые способности, действующие на цели в пределах одного перемещения от Актива. Что это значит, опять же решает Мастер, но обычно такой Актив может влиять на цели в сотне миль от своего местоположения.\n\nИногда Актив просто не может правдоподобно переместиться в некое место. Отряд Пехоты, например, едва ли войдёт маршем в столицу вражеской державы, чтобы позже Атаковать тамошний Актив «Придворное покровительство». В этом случае лучшее, что может Пехота, — встать где-то поблизости от столицы, если Мастер сочтёт это правдоподобным. Атаковать Активы вражеской фракции Пехота не сможет, пока не попадёт в сам город, где те находятся.\n\nАктивы с качеством «Неприметный» этим не ограничены. Неприметные Активы могут перемещаться даже туда, куда правящие власти обычно их не пустили бы. Чтобы выбить их оттуда, их придётся Атаковать, пока они не будут уничтожены или пока владелец их не выведет.\n\nАктивы с качеством «Затаённый» тоже свободны от этого ограничения и могут перемещаться в любое достижимое место. Затаившиеся Активы нельзя Атаковать другими Активами, пока они не потеряют качество «Затаённый». Это происходит, когда их обнаруживают определённые особые Активы или когда затаившийся Актив сам что-то Атакует."},{"n":"6.4.0","l":2,"te":"Attribute Checks","tr":"Проверки атрибутов","en":"Some actions, such as Attack, require an attribute check between factions, such as Force versus Cunning, or Wealth versus Force. Other special Asset abilities sometimes call for attribute checks as well.\nTo make this check, the attacker and defender both roll 1d10 and add their relevant attribute. Thus, for a Force versus Cunning check, the attacker would roll 1d10+Force against the defender’s 1d10+- Cunning. The attacker wins if their total is higher, and the defender wins if it’s a tie or their roll is higher.\nSome special abilities or tags allow the attacker or defender to roll more than one die for a check. In this case, the dice are rolled and the highest of them are used.","ru":"Некоторые действия, такие как Атака, требуют проверки атрибутов между фракциями — например, Мощь против Хитрости или Богатство против Мощи. Порой проверок атрибутов требуют и особые способности Активов.\n\nВ такой проверке нападающий и защитник бросают по 1d10 и прибавляют соответствующий атрибут. Так, в проверке Мощи против Хитрости нападающий бросает 1d10+Мощь против 1d10+Хитрость защитника. Нападающий побеждает, если его итог выше; защитник — при ничьей или если выше его бросок.\n\nНекоторые особые способности и черты позволяют нападающему или защитнику бросить в проверке больше одной кости. В этом случае он бросает все кости и берёт высшую из них."},{"n":"6.5.0","l":2,"te":"Faction Tags","tr":"Черты фракций","en":"These are merely some possibilities. The GM may devise others to suit their needs.\n**Antimagical:** Assets that require Medium or higher Magic to purchase roll all attribute checks twice against this faction during an Attack and take the worst roll.\n**Concealed:** All Assets the faction purchases enter play with the Stealth quality.\n**Imperialist:** The faction quickly expands its Bases of Influence. Once per turn, it can use the Expand Influence action as a special ability instead of it taking a full action.\n**Innovative:** The faction can purchase Assets as if their attribute ratings were two points higher than they are. Only two such over-complex Assets may be owned at any one time.\n**Machiavellian:** The faction is diabolically cunning. It rolls an extra die for all Cunning attribute checks. Its Cunning must always be its highest attribute.\n**Martial:** The faction is profoundly devoted to war. It rolls an extra die for all Force attribute checks. Force must always be its highest attribute.\n**Massive:** The faction is an empire, major kingdom, or other huge organizational edifice. It automatically wins attribute checks if its attribute is more than twice as big as the opposing side’s attribute, unless the other side is also Massive.\n**Mobile:** The faction is exceptionally fast or mobile. Its faction turn movement range is twice what another faction would have in the same situation.\n**Populist:** The faction has widespread popular support. Assets that cost 5 Treasure or less to buy cost one point less, to a minimum of 1.\n**Rich:** The faction is rich or possessed of mercantile skill. It rolls an extra die for all Wealth attribute checks. Wealth must always be its highest attribute.","ru":"Это лишь некоторые возможности. Мастер может придумать другие под свои нужды.\n\n**Антимагическая:** Активы, для покупки которых нужна Магия «Средняя» или выше, во время Атаки бросают все проверки атрибутов против этой фракции дважды и берут худший результат.\n\n**Богатая:** Фракция богата или наделена купеческой хваткой. Она бросает дополнительную кость во всех проверках атрибута Богатства. Богатство всегда должно оставаться её высшим атрибутом.\n\n**Воинственная:** Фракция глубоко предана войне. Она бросает дополнительную кость во всех проверках атрибута Мощи. Мощь всегда должна оставаться её высшим атрибутом.\n\n**Законспирированная:** Все Активы, которые фракция покупает, входят в игру с качеством «Затаённый».\n\n**Захватническая:** Фракция быстро разрастается Базами влияния. Раз за ход она может использовать «Расширить влияние» как особую способность, а не полноценное действие.\n\n**Исполинская:** Фракция — империя, крупное королевство или иная громадная организационная махина. Она автоматически выигрывает проверку атрибутов, если её атрибут больше чем вдвое превосходит атрибут противной стороны, — если только та тоже не Исполинская.\n\n**Коварная:** Фракция дьявольски хитра. Она бросает дополнительную кость во всех проверках атрибута Хитрости. Хитрость всегда должна оставаться её высшим атрибутом.\n\n**Народная:** Фракция пользуется широкой народной поддержкой. Активы ценой 5 Казны и меньше стоят на один пункт дешевле, минимум 1.\n\n**Новаторская:** Фракция может покупать Активы так, будто рейтинги её атрибутов на два пункта выше настоящих. Одновременно можно владеть лишь двумя такими чересчур сложными Активами.\n\n**Подвижная:** Фракция исключительно быстра или подвижна. Дальность её перемещения за ход фракций вдвое больше, чем была бы у другой фракции в том же положении."},{"n":"6.6.0","l":2,"te":"Faction Turn Actions","tr":"Действия хода фракций","en":"**Attack:** The faction nominates one or more Assets to attack the enemy in their locations. In each location, the defender chooses which of the Assets present will meet the Attack; thus, if a unit of Infantry attacks in a location where there is an enemy Base of Influence, Informers, and Idealistic Thugs, the defender could decide to use Idealistic Thugs to defend against the attack.\nThe attacker makes an attribute check based on the attack of the acting Asset; thus, the Infantry would roll Force versus Force. On a success, the defending Asset takes damage equal to the attacking Asset’s attack score, or 1d8 in the case of Infantry. On a failure, the attacking Asset takes damage equal to the defending Asset’s counterattack score, or 1d6 in the case of Idealistic Thugs.\nIf the damage done to an Asset reduces it to zero hit points, it is destroyed. The same Asset may be used to defend against multiple attacking Assets, provided it can survive the onslaught.\nDamage done to a Base of Influence is also done directly to the faction’s hit points. Overflow damage is not transmitted, however.\n**Move Asset:** One or more Assets are moved up to one turn’s worth of movement each. The receiving location must not have the ability and inclination to forbid the Asset from operating there. Subtle and Stealthed Assets ignore this limit.\nIf an asset loses the Subtle or Stealth qualities while in a hostile location, they must use this action to retreat to safety within one turn or they will take half their maximum hit points in damage at the start of the next turn, rounded up.\n**Repair Asset:** The faction spends 1 Treasure on each Asset they wish to repair, fixing half their relevant attribute value in lost hit points, rounded up. Thus, fixing a Force Asset would heal half the faction’s Force attribute, rounded up. Additional healing can be applied to an Asset in this same turn, but the cost increases by 1 Treasure for each subsequent fix; thus, the second costs 2 Treasure, the third costs 3 Treasure, and so forth. This ability can at the same time also be used to repair damage done to the faction, spending 1 Treasure to heal a total equal to the faction’s highest and lowest Force, Wealth, or Cunning attribute divided by two, rounded up. Thus, a faction with a Force of 5, Wealth of 2, and Cunning of 4 would heal 4 points of damage. Only one such application of healing is possible for a faction each turn.\n**Expand Influence:** The faction seeks to establish a new base of operations in a location. The faction must have at least one Asset there already to make this attempt, and must spend 1 Treasure for each hit point the new Base of Influence is to have. Thus, to create a new Base of Influence with a maximum hit point total of 10, 10 Treasure must be spent. Bases with high maximum hit point totals are harder to dislodge, but losing them also inflicts much more damage on the faction’s own hit points.\nOnce the Base of Influence is created, the owner makes a Cunning versus Cunning attribute check against every other faction that has at least one Asset in the same location. If the other faction wins the check, they are allowed to make an immediate Attack against the new Base of Influence with whatever Assets they have present in the location. The creating faction may attempt to block this action by defending with other Assets present.\nIf the Base of Influence survives this onslaught, it operates as normal and allows the faction to purchase new Assets there with the Create Asset action.\n**Create Asset:** The faction buys one Asset at a location where they have a Base of Influence. They must have the minimum attribute and Magic ratings necessary to buy the Asset and must pay the listed cost in Treasure to build it. A faction can create only one Asset per turn.\nA faction can have no more Assets of a particular attribute than their attribute score. Thus, a faction with a Force of 3 can have only 3 Force Assets. If this number is exceeded, the faction must pay 1 Treasure per excess Asset at the start of each turn, or else they will lose the excess.\n**Hide Asset:** An action available only to factions with a Cunning score of 3 or better, this action allows the faction to give one owned Asset the Stealth quality for every 2 Treasure they spend. Assets currently in a location with another faction’s Base of Influence can’t be hidden. If the Asset later loses the Stealth, no refund is given.\n**Sell Asset:** The faction voluntarily decommissions an Asset, salvaging it for what it’s worth. The Asset is lost and the faction gains half its purchase cost in Treasure, rounded down. If the Asset is damaged when it is sold, however, no Treasure is gained.","ru":"**Атака:** Фракция назначает один или несколько Активов атаковать врага там, где он находится. В каждом местоположении защитник выбирает, какой из присутствующих Активов встретит Атаку. Если отряд Пехоты атакует там, где у врага стоят База влияния, Осведомители и Идейные громилы, защитник может выставить против атаки Идейных громил.\n\nНападающий делает проверку атрибутов по графе атаки действующего Актива; так, Пехота бросает Мощь против Мощи. При успехе защищающийся Актив получает урон, равный показателю атаки атакующего Актива, — 1d8 в случае Пехоты. При провале атакующий Актив получает урон, равный показателю контратаки защищающегося Актива, — 1d6 в случае Идейных громил.\n\nЕсли урон снижает пункты здоровья Актива до нуля, он уничтожен. Один и тот же Актив может защищаться от нескольких атакующих Активов — лишь бы пережил этот натиск.\n\nУрон, нанесённый Базе влияния, наносится заодно и напрямую пунктам здоровья фракции. Избыточный урон, впрочем, не переносится.\n\n**Переместить Актив:** Один или несколько Активов перемещаются, каждый на расстояние до одного хода. Принимающее местоположение не должно иметь возможности и желания запретить Активу там действовать. Неприметные и затаившиеся Активы игнорируют это ограничение.\n\nЕсли Актив теряет качество «Неприметный» или «Затаённый» во враждебном местоположении, он должен этим действием отступить в безопасное место в течение одного хода — иначе в начале следующего хода он получит урон в половину своего максимума пунктов здоровья, округляя вверх.\n\n**Починить Актив:** Фракция тратит 1 Казны на каждый Актив, который хочет починить, и восстанавливает ему потерянные пункты здоровья в размере половины соответствующего атрибута, округляя вверх. Так, починка Актива Мощи излечивает половину атрибута Мощи фракции с округлением вверх. В тот же ход Актив можно лечить и дальше, но цена растёт на 1 Казны с каждой следующей починкой: вторая стоит 2 Казны, третья — 3 и так далее.\n\nЭтим же действием можно заодно чинить урон, нанесённый самой фракции: за 1 Казны она излечивает сумму, равную её высшему и низшему атрибутам из Мощи, Богатства и Хитрости, сложенным и делённым на два с округлением вверх. Так, фракция с Мощью 5, Богатством 2 и Хитростью 4 излечила бы 4 пункта урона. Такое лечение фракции возможно лишь один раз за ход.\n\n**Расширить влияние:** Фракция пытается основать новую базу операций в каком-то местоположении. Для этой попытки у неё там уже должен быть хотя бы один Актив, и она должна потратить 1 Казны за каждый пункт здоровья будущей Базы влияния. Так, новая База влияния с максимумом в 10 пунктов здоровья обойдётся в 10 Казны. Базы с высоким максимумом пунктов здоровья труднее выбить, но их потеря и наносит куда больший урон пунктам здоровья самой фракции.\n\nКогда База влияния создана, владелец делает проверку Хитрости против Хитрости против каждой другой фракции, у которой есть хотя бы один Актив в том же местоположении. Если чужая фракция выигрывает проверку, ей позволено немедленно Атаковать новую Базу влияния любыми своими Активами в этом местоположении. Фракция-создатель может попытаться заслонить её, защищаясь другими присутствующими Активами.\n\nЕсли База влияния переживёт этот натиск, она работает как обычно и позволяет фракции покупать там новые Активы действием «Создать Актив».\n\n**Создать Актив:** Фракция покупает один Актив в местоположении, где у неё есть База влияния. У неё должны быть минимальные рейтинги атрибута и Магии, необходимые для покупки этого Актива, и она должна оплатить указанную цену в Казне. Фракция может создавать лишь один Актив за ход.\n\nФракция не может держать Активов одного атрибута больше, чем значение этого атрибута. Так, фракция с Мощью 3 может иметь лишь 3 Актива Мощи. Если это число превышено, фракция платит 1 Казны за каждый лишний Актив в начале каждого хода — или теряет излишек.\n\n**Спрятать Актив:** Действие, доступное лишь фракциям с Хитростью 3 и выше. Оно позволяет за каждые потраченные 2 Казны дать одному своему Активу качество «Затаённый». Активы, стоящие в одном местоположении с Базой влияния другой фракции, спрятать нельзя. Если Актив позже теряет качество «Затаённый», деньги не возвращаются.\n\n**Продать Актив:** Фракция добровольно расформировывает Актив, выручая за него сколько выйдет. Актив теряется, а фракция получает половину его покупной цены в Казне, округляя вниз. Однако если на момент продажи Актив повреждён, выручки не будет вовсе."},{"n":"6.7.0","l":2,"te":"Creating Factions","tr":"Создание фракций","en":"A given campaign should generally not have more than six active factions at any one time, and three or four are generally more manageable. If there are more extant factions than this, then simply run turns for the three or four most active or relevant ones.\nTo create a faction, first decide whether it is a small, medium, or large faction. A small one might be a petty cult or small free city or minor magical academy. A medium one might be a local baron’s government or province-wide faith. A large one would be an entire kingdom or a major province of a vast empire.\nIt’s perfectly acceptable to break a large institution down into a smaller faction, modeling only the branch of government or part of the organization that’s actually relevant to the campaign.\nAll factions have a Base of Influence at their primary headquarters with a hit point total equal to the faction’s maximum. The faction’s Magic rating is whatever the GM thinks suitable.\nFor a small faction, give them a 3 or 4 in their best attribute, a 2 or 3 in their second-best, and a 1 or 2 in their worst quality.\nMedium factions should assign 5 or 6 to their best attribute, 4 or 5 to their second-best, and 2 or 3 to their worst. They should have two Assets in their primary attribute and two others among the other two.\nLarge factions should assign 7 or 8 to their strongest attribute, 6 or 7 to their second-best attribute, and 3 or 4 to their worst quality. They should have four Assets in their primary attribute, and four others spread among the other two. Their Magic rating will depend on whatever you think is appropriate for their scale, but remember that it’s harder to concentrate effective magical resources when dealing with a whole province or nation than it is to enchant a single city-state or magical institution.\n| Rating Attribute | to Purchase Faction XP Cost | Value Hit Point |\n|---|---|---|\n| 1 | - | 1 |\n| 2 | 2 | 2 |\n| 3 | 4 | 4 |\n| 4 | 6 | 6 |\n| 5 | 9 | 9 |\n| 6 | 12 | 12 |\n| 7 | 16 | 16 |\n| 8 | 20 | 20 |\n| To determine | a faction’s maximum hit | points, use the adjacent |\nTo determine a faction’s maximum hit points, use the adjacent table. Thus, one with a Force of 3, a Wealth of 5, and a Cunning of 2 would have hit points equal to 4 plus 9 plus 2, or 15 total. The Base of Influence at their primary headquarters will always have a maximum hit points equal to the faction’s maximum hit points, even if it later rises or falls due to attribute score changes.\nLastly, give a faction a goal, either one from the foregoing list or one chosen by the GM. When this goal is achieved, the faction earns experience points which it can later spend to increase its attributes. The cost for such increases is given on the table adjacent. Earlier levels must be purchased before later, so to raise Force from 5 to 7 will cost 9 XP to raise it to 6, then 12 more to raise it to 7.\n### Example Faction Goals\nThe difficulty of a faction goal is the number of experience points earned on a successful completion of it.\n**Blood the Enemy:** Inflict a number of hit points of damage on enemy faction assets or bases equal to your faction’s total Force, Cunning, and Wealth ratings. Difficulty 2.\n**Destroy the Foe:** Destroy a rival faction. Difficulty equal to 2 plus the average of the faction’s Force, Cunning, and Wealth ratings.\n**Eliminate Target:** Choose an undamaged rival Asset. If you destroy it within three turns, succeed at a Difficulty 1 goal. If you fail, pick a new goal without suffering the usual turn of paralysis.\n**Expand Influence:** Plant a Base of Influence at a new location. Difficulty 1, +1 if a rival contests it.\n**Inside Enemy Territory:** Have a number of Stealthed assets in locations where there is a rival Base of Influence equal to your Cunning score. Units that are already Stealthed in locations when this goal is adopted don’t count. Difficulty 2.\n**Invincible Valor:** Destroy a Force asset with a minimum purchase rating higher than your faction’s Force rating. Difficulty 2.\n**Peaceable Kingdom:** Don’t take an Attack action for four turns. Difficulty 1.\n**Root Out the Enemy:** Destroy a Base of Influence of a rival faction in a specific location. Difficulty equal to half the average of the current ruling faction’s Force, Cunning, and Wealth ratings, rounded up.\n**Sphere Dominance:** Choose Wealth, Force, or Cunning. Destroy a number of rival assets of that kind equal to your score in that attribute. Difficulty of 1 per 2 destroyed, rounded up.\n**Wealth of Kingdoms:** Spend Treasure equal to four times your faction’s Wealth rating on bribes and influence. This money is effectively lost, but the goal is then considered accomplished. The faction’s Wealth rating must increase before this goal can be selected again. Difficulty 2.","ru":"В кампании, как правило, не должно быть больше шести действующих фракций разом, а тремя-четырьмя обычно проще управлять. Если фракций расплодилось больше, просто разыгрывайте ходы за три-четыре самые деятельные или значимые.\n\nСоздавая фракцию, сперва решите, малая она, средняя или большая. Малой может быть захудалый культ, небольшой вольный город или скромная магическая академия. Средней — власть местного барона или вера, охватившая провинцию. Большой — целое королевство или крупная провинция обширной империи.\n\nСовершенно нормально выкроить из большого института фракцию поменьше, смоделировав только ту ветвь власти или часть организации, которая действительно важна для кампании.\n\nУ всякой фракции есть База влияния в её главной штаб-квартире, и пунктов здоровья у этой Базы столько же, сколько у самой фракции в максимуме. Рейтинг Магии фракции — какой Мастер сочтёт уместным.\n\nМалой фракции дайте 3 или 4 в лучший атрибут, 2 или 3 во второй и 1 или 2 в худший.\n\nСредним фракциям положите 5 или 6 в лучший атрибут, 4 или 5 во второй и 2 или 3 в худший. Им полагаются два Актива в основном атрибуте и ещё два в двух остальных.\n\nБольшим фракциям дайте 7 или 8 в сильнейший атрибут, 6 или 7 во второй и 3 или 4 в худший. Им полагаются четыре Актива в основном атрибуте и ещё четыре, распределённые между двумя остальными. Их рейтинг Магии зависит от того, что вы сочтёте уместным для их масштаба, но помните: собрать действенные магические ресурсы на целую провинцию или страну труднее, чем зачаровать один город-государство или магический институт.\n\n| Рейтинг атрибута | Цена покупки в пунктах опыта фракции | Пункты здоровья |\n|---|---|---|\n| 1 | – | 1 |\n| 2 | 2 | 2 |\n| 3 | 4 | 4 |\n| 4 | 6 | 6 |\n| 5 | 9 | 9 |\n| 6 | 12 | 12 |\n| 7 | 16 | 16 |\n| 8 | 20 | 20 |\n\nЧтобы определить максимум пунктов здоровья фракции, используйте таблицу рядом. Так, фракция с Мощью 3, Богатством 5 и Хитростью 2 имела бы пункты здоровья 4 плюс 9 плюс 2, всего 15. Максимум пунктов здоровья Базы влияния в главной штаб-квартире всегда равен максимуму пунктов здоровья фракции, даже если тот позже вырастет или упадёт из-за изменения атрибутов.\n\nНапоследок дайте фракции цель — из приведённого рядом списка или выбранную Мастером. Достигнув цели, фракция получает пункты опыта, которые позже может тратить на повышение атрибутов. Цена повышений дана в таблице рядом. Прежние уровни покупаются раньше последующих: чтобы поднять Мощь с 5 до 7, придётся заплатить 9 пунктов опыта за повышение до 6 и ещё 12 за повышение до 7.\n\n### Примерные цели фракций\n\nСложность цели фракции — это число пунктов опыта, которые фракция получает за её успешное достижение.\n\n**Богатство королевств:** Потратьте на взятки и влияние Казну, равную учетверённому рейтингу Богатства вашей фракции. Эти деньги фактически пропадают, но цель после этого считается достигнутой. Прежде чем выбрать эту цель снова, фракция должна поднять рейтинг Богатства. Сложность 2.\n\n**В тылу врага:** Держите в местоположениях с Базой влияния соперника число затаившихся Активов, равное вашей Хитрости. Активы, уже затаившиеся в таких местах на момент выбора цели, не считаются. Сложность 2.\n\n**Выкорчевать врага:** Уничтожьте Базу влияния соперничающей фракции в конкретном местоположении. Сложность равна половине среднего рейтингов Мощи, Хитрости и Богатства текущей правящей фракции, округляя вверх.\n\n**Господство в сфере:** Выберите Богатство, Мощь или Хитрость. Уничтожьте столько Активов соперников этого вида, каково ваше значение этого атрибута. Сложность — 1 за каждые 2 уничтоженных, округляя вверх.\n\n**Мирное царство:** Не выполняйте действие «Атака» четыре хода. Сложность 1.\n\n**Непобедимая доблесть:** Уничтожьте Актив Мощи, чей минимальный рейтинг для покупки выше рейтинга Мощи вашей фракции. Сложность 2.\n\n**Пустить врагу кровь:** Нанесите Активам и Базам вражеских фракций урон пунктами здоровья, равный сумме рейтингов Мощи, Хитрости и Богатства вашей фракции. Сложность 2.\n\n**Расширить влияние:** Поставьте Базу влияния в новом местоположении. Сложность 1, +1, если её оспаривает соперник.\n\n**Уничтожить противника:** Уничтожьте соперничающую фракцию. Сложность равна 2 плюс среднее рейтингов Мощи, Хитрости и Богатства этой фракции.\n\n**Устранить цель:** Выберите неповреждённый Актив соперника. Если уничтожите его за три хода, вы достигли цели Сложности 1. Если провалитесь, выберите новую цель, не страдая от обычного хода паралича."},{"n":"6.8.0","l":2,"te":"Cunning Assets","tr":"Активы Хитрости","en":"**Bewitching Charmer:** When the Bewitching Charmer succeeds in an Attack, the targeted Asset is unable to leave the same location as the Bewitching Charmer until the latter Asset moves or is destroyed. Bewitching Charmers are immune to Counterattack.\n**Blackmail:** When a Blackmail asset is in a location, hostile factions can’t roll more than one die during Attacks made by or against them there, even if they have tags or Assets that usually grant bonus dice.\n**Court Patronage:** Powerful nobles or officials are appointing their agents to useful posts of profit. A Court Patronage Asset automatically grants 1 Treasure to its owning faction each turn.\n**Covert Transport:** As a free action once per turn, the faction can pay 1 Treasure and move any Cunning or Wealth Asset at the same location as the Covert Transport. The transported Asset gains the Stealth quality until it performs some action or is otherwise utilized by the faction.\n**Cryptomancers:** In place of an Attack action, they can make a Cunning vs. Cunning attack on a specific hostile Asset within one move. On a success, the targeted Asset is unable to do anything or be used for anything on its owner’s next faction turn. On a failure, no Counterattack damage is taken.\n**Dancing Girls:** Dancing Girls or other charming distractions are immune to Attack or Counterattack damage from Force Assets, but they cannot be used to defend against Attacks from Force Assets.\n**Expert Treachery:** On a successful Attack by Expert Treachery, this Asset is lost, 5 Treasure is gained by its owning faction, and the Asset that Expert Treachery targeted switches sides. This conversion happens even if their new owners lack the attributes usually necessary to maintain their new Asset.\n**Hired Friends:** As a free action, once per turn, the faction may spend 1 Treasure and grant a Wealth Asset within one turn’s movement range the Subtle quality. This quality will remain until the Hired Friends are destroyed or they use this ability again.\n**Idealistic Thugs:** Easily-manipulated hotheads are enlisted under whatever ideological or religious principle best enthuses them for violence.\n**Informers:** As a free action, once per turn, the faction can spend 1 Treasure and have the Informers look for Stealthed Assets. To do so, the Informers pick a faction and make a Cunning vs. Cunning Attack on them. No counterattack damage is taken if they fail, but if they succeed, all Stealthed Assets of that faction within one move of the Informers are revealed.\n**Interrupted Logistics:** Non-Stealthed hostile units cannot enter the same location as the Interrupted Logistics Asset without paying 1d4 Treasure and waiting one turn to arrive there.\n**Just As Planned:** Some sublimely cunning mastermind works for the faction. Whenever the faction’s Assets make a roll involving Cunning, they may reroll a failed check at the cost of inflicting 1d6 damage on Just As Planned. This may be done repeatedly, though it may destroy the Asset. There is no range limit on this benefit.\n**Mindbenders:** Once per turn as a free action, the Mindbenders can force a rival faction to reroll a check, Attack, or other die roll they just made and take whichever result the Mindbenders prefer. A faction can only be affected this way once until the start of the Mindbender’s faction’s next turn.\n**Occult Infiltrators:** Magically-gifted spies and assassins are enlisted to serve the faction. Occult Infiltrator Assets always begin play with the Stealth quality.\n**Omniscient Seers:** At the start of their turn, each hostile Stealthed asset within one turn’s movement of the Omniscient Seers must succeed in a Cunning vs. Cunning check against the owning faction or lose their Stealth. In addition, all Cunning rolls made by the faction for units or events within one turn’s movement of the seers gain an extra die.\n**Organization Moles:** Sleeper agents and deep-cover spies burrow into hostile organizations, waiting to disrupt them from within when ordered.\n**Petty Seers:** A cadre of skilled fortune-tellers and minor oracles have been enlisted by the faction to foresee perils and allow swift counterattacks.\n**Popular Movement:** Any friendly Asset is allowed movement into the same location as the Popular Movement, even if it would normally be forbidden by its owners and lacks the Subtle quality. If the Popular Movement later moves or is destroyed, such Assets must also leave or suffer the usual consequences for a non-Subtle Asset.\n**Prophet:** Whether a religious prophet, charismatic philosopher, rebel leader, or other figure of popular appeal, the Asset is firmly under the faction’s control.\n**Saboteurs:** An Asset that is Attacked by the Saboteurs can’t use any free action abilities it may have during the next turn, whether or not the Attack was successful.\n**Seditionists:** In place of an Attack action, the Seditionists’ owners may spend 1d4 Treasure and attach the Asset to a hostile Asset in the same location. Until the Seditionists are destroyed, infest another Asset, or leave the same location, the rebelling Asset cannot be used for anything and grants no benefits.\n**Shapeshifters:** As a free action once per turn, the faction can spend 1 Treasure and grant the Shapeshifters the Stealth quality.\n**Smugglers:** As a free action, once per faction turn, the Smugglers can move any allied Wealth or Cunning Asset in their same location to a destination within movement range, even if the destination wouldn’t normally allow an un-Subtle Asset.\n**Spymaster:** A veteran operative runs a counterintelligence bureau in the area.\n**Underground Roads:** A well-established network of secret transit extends far around this Asset. As a free action, the faction may pay 1 Treasure and move any friendly Asset from a location within one round’s move of the Underground Roads to a destination within one round of the Roads.\n**Useful Idiots:** Hirelings, catspaws, foolish idealists, and other disposable minions are gathered together in this Asset. If another Asset within one turn’s move of the Useful Idiots is struck by an Attack, the faction can instead sacrifice the Useful Idiots to negate the attack. Only one band of Useful Idiots can be sacrificed on any one turn.\n**Vigilant Agents:** A constant flow of observations runs back to the faction from these watchful counterintelligence agents. Whenever another faction moves a Stealthed asset into a location within one move’s distance from the Vigilant Agents, they may make a Cunning vs. Cunning attack against the owning faction. On a success, the intruding Asset loses its Stealth after it completes the move.\n| Cunning Asset | Cost | HP | Magic | Attack | Counter | Qualities |\n|---|---|---|---|---|---|---|\n| **Cunning 1** |  |  |  |  |  |  |\n| Informers | 2 | 3 | None | C v. C/Special | None | Subtle, Special |\n| Petty Seers | 2 | 2 | Medium | None | 1d6 damage | Subtle |\n| Smugglers | 2 | 4 | None | C v. W/1d4 damage | None | Subtle, Action |\n| Useful Idiots | 1 | 2 | None | None | None | Subtle, Special |\n| **Cunning 2** |  |  |  |  |  |  |\n| Blackmail | 4 | 4 | None | C v. C/1d4 damage | None | Subtle, Special |\n| Dancing Girls | 4 | 3 | None | C v. W/2d4 damage | None | Subtle, Special |\n| Hired Friends | 4 | 4 | None | C v. C/1d6 damage | None | Subtle, Special |\n| Saboteurs | 5 | 6 | None | C v. W/2d4 damage | None | Subtle, Special |\n| **Cunning 3** |  |  |  |  |  |  |\n| Bewitching Charmer | 6 | 4 | Low | C v. C/Special | None | Subtle, Special |\n| Covert Transport | 8 | 4 | None | None | None | Subtle, Special |\n| Occult Infiltrators | 6 | 4 | Medium | C v. C/2d6 damage | None | Subtle, Special |\n| Spymaster | 8 | 4 | None | C v. C/1d6 damage | 2d6 damage | Subtle |\n| **Cunning 4** |  |  |  |  |  |  |\n| Court Patronage | 8 | 8 | None | C v. C/1d6 damage | 1d6 damage | Subtle, Special |\n| Idealistic Thugs | 8 | 12 | None | C v. F/1d6 damage | 1d6 damage | Subtle |\n| Seditionists | 12 | 8 | None | Special | None | Subtle |\n| Vigilant Agents | 12 | 8 | None | None | 1d4 damage | Subtle, Special |\n| **Cunning 5** |  |  |  |  |  |  |\n| Cryptomancers | 14 | 6 | Low | C v. C/Special | None | Subtle |\n| Organization Moles | 8 | 10 | None | C v. C/2d6 damage | None | Subtle |\n| Shapeshifters | 14 | 8 | Medium | C v. C/2d6 damage | None | Subtle, Special |\n| **Cunning 6** |  |  |  |  |  |  |\n| Interrupted Logistics | 20 | 10 | None | None | None | Subtle, Special |\n| Prophet | 20 | 10 | None | C v. C/2d8 damage | 1d8 damage | Subtle |\n| Underground Roads | 18 | 15 | None | None | None | Subtle, Special |\n| **Cunning 7** |  |  |  |  |  |  |\n| Expert Treachery | 10 | 5 | None | C v. C/Special | None | Subtle |\n| Mindbenders | 20 | 10 | Medium | None | 2d8 damage | Subtle |\n| Popular Movement | 25 | 16 | None | C v. C/2d6 damage | 1d6 damage | Subtle, Special |\n| **Cunning 8** |  |  |  |  |  |  |\n| Just As Planned | 40 | 15 | None | None | 1d10 damage | Subtle, Special |\n| Omniscient Seers | 30 | 10 | High | None | 1d8 damage | Subtle, Special |","ru":"**Всевидящие провидцы:** В начале их хода каждый враждебный затаившийся Актив в пределах перемещения одного хода от Всевидящих провидцев должен преуспеть в проверке Хитрости против Хитрости против владеющей фракции — или потерять качество «Затаённый». Вдобавок все броски Хитрости, которые фракция делает за отряды и события в пределах перемещения одного хода от провидцев, получают дополнительную кость.\n\n**Всё по плану:** На фракцию работает некий гениально хитроумный вдохновитель. Всякий раз, когда Активы фракции делают бросок с участием Хитрости, они могут перебросить проваленную проверку ценой 1d6 урона Активу «Всё по плану». Так можно поступать многократно, хотя это может и уничтожить Актив. Дальность у этой выгоды не ограничена.\n\n**Гнущие разум:** Раз за ход свободным действием Гнущие разум могут заставить соперничающую фракцию перебросить только что сделанную проверку, Атаку или иной бросок кости и принять тот результат, который Гнущим разум больше нравится. Одну и ту же фракцию так можно затронуть лишь один раз до начала следующего хода фракции Гнущих разум.\n\n**Диверсанты:** Актив, Атакованный Диверсантами, в следующий ход не может использовать никакие свои способности свободного действия — неважно, была Атака успешной или нет.\n\n**Идейные громилы:** Легко управляемые горячие головы завербованы под тем идеологическим или религиозным знаменем, которое лучше всего распаляет их на насилие.\n\n**Контрабандисты:** Свободным действием раз за ход фракций Контрабандисты могут переместить любой союзный Актив Богатства или Хитрости из своего местоположения в пункт назначения в пределах дальности перемещения — даже туда, куда Актив без качества «Неприметный» обычно не пустили бы.\n\n**Криптоманты:** Вместо действия «Атака» они могут совершить атаку Хитростью против Хитрости на конкретный враждебный Актив в пределах одного перемещения. При успехе целевой Актив в следующий ход фракции своего владельца не может ничего делать, и использовать его ни для чего нельзя. При провале Криптоманты не получают урона от Контратаки.\n\n**Кроты в организациях:** Спящие агенты и глубоко внедрённые шпионы вгрызаются во враждебные организации и ждут приказа подорвать их изнутри.\n\n**Мастер шпионажа:** Ветеран тайных операций держит в этих краях контрразведывательное бюро.\n\n**Мастерское предательство:** При успешной Атаке Мастерского предательства этот Актив теряется, его фракция-владелец получает 5 Казны, а Актив, бывший целью Мастерского предательства, переходит на другую сторону. Переманивание происходит, даже если новым владельцам не хватает атрибутов, обычно необходимых для содержания нового Актива.\n\n**Мелкие провидцы:** Фракция завербовала когорту умелых гадателей и мелких оракулов, чтобы те предвидели опасности и позволяли быстро отвечать ударом на удар.\n\n**Наёмные друзья:** Свободным действием раз за ход фракция может потратить 1 Казны и дать Активу Богатства в пределах перемещения одного хода качество «Неприметный». Качество держится, пока Наёмные друзья не будут уничтожены или не используют эту способность снова.\n\n**Народное движение:** Любому дружественному Активу позволено переместиться в местоположение Народного движения, даже если хозяева этого места обычно запретили бы это, а качества «Неприметный» у Актива нет. Если Народное движение позже переместится или будет уничтожено, такие Активы тоже должны уйти — или испытать обычные последствия для Актива без качества «Неприметный».\n\n**Неусыпные агенты:** От этих бдительных контрразведчиков к фракции стекается непрерывный поток наблюдений. Всякий раз, когда другая фракция перемещает затаившийся Актив в местоположение в пределах одного перемещения от Неусыпных агентов, те могут совершить атаку Хитростью против Хитрости против владеющей фракции. При успехе вторгшийся Актив, завершив перемещение, теряет качество «Затаённый».\n\n**Оккультные лазутчики:** На службу фракции завербованы магически одарённые шпионы и убийцы. Активы «Оккультные лазутчики» всегда начинают игру с качеством «Затаённый».\n\n**Осведомители:** Свободным действием раз за ход фракция может потратить 1 Казны и пустить Осведомителей искать затаившиеся Активы. Для этого Осведомители выбирают фракцию и совершают против неё Атаку Хитростью против Хитрости. При провале они не получают урона от контратаки, а при успехе раскрываются все затаившиеся Активы этой фракции в пределах одного перемещения от Осведомителей.\n\n**Перевёртыши:** Свободным действием раз за ход фракция может потратить 1 Казны и дать Перевёртышам качество «Затаённый».\n\n**Подземные тропы:** Вокруг этого Актива далеко раскинулась налаженная сеть тайных путей. Свободным действием фракция может заплатить 1 Казны и переместить любой дружественный Актив из местоположения в пределах перемещения одного хода от Подземных троп в пункт назначения тоже в пределах одного хода от Троп.\n\n**Подорванные пути снабжения:** Незатаившиеся враждебные отряды не могут войти в местоположение Актива «Подорванные пути снабжения», не заплатив 1d4 Казны и не потратив на прибытие лишний ход ожидания.\n\n**Полезные идиоты:** В этом Активе собраны наймиты, пешки, глупые идеалисты и прочая расходная мелюзга. Если другой Актив в пределах перемещения одного хода от Полезных идиотов попадает под Атаку, фракция может вместо этого пожертвовать Полезными идиотами и свести атаку на нет. За один ход можно пожертвовать лишь одной шайкой Полезных идиотов.\n\n**Придворное покровительство:** Могущественные вельможи или чиновники расставляют своих агентов на доходные посты. Актив «Придворное покровительство» автоматически приносит владеющей фракции 1 Казны каждый ход.\n\n**Пророк:** Будь то религиозный пророк, харизматичный философ, вождь мятежников или иной любимец народа — этот Актив прочно подконтролен фракции.\n\n**Смутьяны:** Вместо действия «Атака» владельцы Смутьянов могут потратить 1d4 Казны и прикрепить этот Актив к враждебному Активу в том же местоположении. Пока Смутьяны не уничтожены, не переберутся в другой Актив и не покинут это местоположение, охваченный смутой Актив нельзя ни для чего использовать, и никаких выгод он не даёт.\n\n**Тайная перевозка:** Свободным действием раз за ход фракция может заплатить 1 Казны и переместить любой Актив Хитрости или Богатства, находящийся в одном местоположении с Тайной перевозкой. Перевезённый Актив получает качество «Затаённый», пока не совершит какое-нибудь действие или не будет иначе использован фракцией.\n\n**Танцовщицы:** Танцовщицы и прочие обворожительные отвлечения невосприимчивы к урону Атак и Контратак Активов Мощи, но и сами не могут защищаться от Атак Активов Мощи.\n\n**Чарующий обольститель:** Когда Чарующий обольститель преуспевает в Атаке, целевой Актив не может покинуть местоположение Чарующего обольстителя, пока тот не переместится или не будет уничтожен. Чарующие обольстители невосприимчивы к Контратаке.\n\n**Шантаж:** Пока Актив «Шантаж» стоит в местоположении, враждебные фракции не могут бросать больше одной кости в Атаках, которые они совершают там или которые совершают против них, — даже если черты или Активы обычно дают им бонусные кости.\n\nВ таблице ниже Х — Хитрость, М — Мощь, Б — Богатство; «пр.» — «против».\n\n| Актив Хитрости | Цена | ПЗ | Магия | Атака | Контратака | Качества |\n|---|---|---|---|---|---|---|\n| **Хитрость 1** | | | | | | |\n| Контрабандисты | 2 | 4 | Нет | Х пр. Б/1d4 урона | Нет | Неприметный, Действие |\n| Мелкие провидцы | 2 | 2 | Средняя | Нет | 1d6 урона | Неприметный |\n| Осведомители | 2 | 3 | Нет | Х пр. Х/Особое | Нет | Неприметный, Особое |\n| Полезные идиоты | 1 | 2 | Нет | Нет | Нет | Неприметный, Особое |\n| **Хитрость 2** | | | | | | |\n| Диверсанты | 5 | 6 | Нет | Х пр. Б/2d4 урона | Нет | Неприметный, Особое |\n| Наёмные друзья | 4 | 4 | Нет | Х пр. Х/1d6 урона | Нет | Неприметный, Особое |\n| Танцовщицы | 4 | 3 | Нет | Х пр. Б/2d4 урона | Нет | Неприметный, Особое |\n| Шантаж | 4 | 4 | Нет | Х пр. Х/1d4 урона | Нет | Неприметный, Особое |\n| **Хитрость 3** | | | | | | |\n| Мастер шпионажа | 8 | 4 | Нет | Х пр. Х/1d6 урона | 2d6 урона | Неприметный |\n| Оккультные лазутчики | 6 | 4 | Средняя | Х пр. Х/2d6 урона | Нет | Неприметный, Особое |\n| Тайная перевозка | 8 | 4 | Нет | Нет | Нет | Неприметный, Особое |\n| Чарующий обольститель | 6 | 4 | Низкая | Х пр. Х/Особое | Нет | Неприметный, Особое |\n| **Хитрость 4** | | | | | | |\n| Идейные громилы | 8 | 12 | Нет | Х пр. М/1d6 урона | 1d6 урона | Неприметный |\n| Неусыпные агенты | 12 | 8 | Нет | Нет | 1d4 урона | Неприметный, Особое |\n| Придворное покровительство | 8 | 8 | Нет | Х пр. Х/1d6 урона | 1d6 урона | Неприметный, Особое |\n| Смутьяны | 12 | 8 | Нет | Особое | Нет | Неприметный |\n| **Хитрость 5** | | | | | | |\n| Криптоманты | 14 | 6 | Низкая | Х пр. Х/Особое | Нет | Неприметный |\n| Кроты в организациях | 8 | 10 | Нет | Х пр. Х/2d6 урона | Нет | Неприметный |\n| Перевёртыши | 14 | 8 | Средняя | Х пр. Х/2d6 урона | Нет | Неприметный, Особое |\n| **Хитрость 6** | | | | | | |\n| Подземные тропы | 18 | 15 | Нет | Нет | Нет | Неприметный, Особое |\n| Подорванные пути снабжения | 20 | 10 | Нет | Нет | Нет | Неприметный, Особое |\n| Пророк | 20 | 10 | Нет | Х пр. Х/2d8 урона | 1d8 урона | Неприметный |\n| **Хитрость 7** | | | | | | |\n| Гнущие разум | 20 | 10 | Средняя | Нет | 2d8 урона | Неприметный |\n| Мастерское предательство | 10 | 5 | Нет | Х пр. Х/Особое | Нет | Неприметный |\n| Народное движение | 25 | 16 | Нет | Х пр. Х/2d6 урона | 1d6 урона | Неприметный, Особое |\n| **Хитрость 8** | | | | | | |\n| Всевидящие провидцы | 30 | 10 | Высокая | Нет | 1d8 урона | Неприметный, Особое |\n| Всё по плану | 40 | 15 | Нет | Нет | 1d10 урона | Неприметный, Особое |"},{"n":"6.9.0","l":2,"te":"Force Assets","tr":"Активы Мощи","en":"**Apocalypse Engine:** One of a number of hideously powerful ancient super-weapons unearthed from some lost armory, an Apocalypse Engine rains some eldritch horror down on a targeted enemy Asset.\n**Brilliant General:** A leader for the ages is in service with the faction. Whenever the Brilliant General or any allied Force Asset in the same location Attacks or is made to defend, it can roll an extra die to do so.\n**Cavalry:** Mounted troops, chariots, or other mobile soldiers are in service to the faction. While weak on defense, they can harry logistics and mount powerful charges.\n**Demonic Slayer:** Powerful sorcerers have summoned or constructed an inhuman assassin-beast to hunt down and slaughter the faction’s enemies. A Demonic Slayer enters play Stealthed.\n**Enchanted Elites:** A carefully-selected group of skilled warriors are given magical armaments and arcane blessings to boost their effectiveness.\n**Fearful Intimidation:** Judicious exercises of force have intimidated the locals, making them reluctant to cooperate with any group that stands opposed to the faction.\n**Fortification Program:** A program of organized fortification and supply caching has been undertaken around the Asset’s location, hardening allied communities and friendly Assets. Once per turn, when an enemy makes an Attack that targets the faction’s Force rating, the faction can use the Fortification Program to defend if the Asset is within a turn’s move from the attack.\n**Guerrilla Populace:** The locals have the assistance of trained guerrilla warfare leaders who can aid them in sabotaging and attacking unwary hostiles.\n**Infantry:** Common foot soldiers have been organized and armed by the faction. While rarely particularly heroic in their capabilities, they have the advantage of numbers.\n**Invincible Legion:** The faction has developed a truly irresistible military organization that can smash its way through opposition without the aid of any support units. During a Relocate Asset action, the Invincible Legion can relocate to locations that would otherwise not permit a formal military force to relocate there, as if it had the Subtle quality. It is not, however, in any way subtle.\n**Knights:** Elite warriors of considerable personal prowess have been trained or enlisted by the faction, either from noble sympathizers, veteran members, or amenable mercenaries.\n**Local Guard:** Ordinary citizens are enlisted into night watch patrols and local guard units. They’re most effective when defending from behind a fortified position, but they have some idea of how to use their weapons.\n**Magical Logistics:** An advanced web of magical Workings, skilled sorcerers, and trained logistical experts are enlisted to streamline the faction’s maintenance and sustain damaged units. Once per faction turn, as a free action, the Asset can repair 2 hit points of damage to an allied Force Asset.\n**Military Roads:** The faction has established a network of roads with a logistical stockpile at this Asset’s location. As a consequence, once per faction turn, the faction can move any one Asset from any location within its reach to any other location within its reach at a cost of 1 Treasure.\n**Military Transport:** A branch of skilled teamsters, transport ships, road-building crews, or other logistical facilitators is in service to the faction. As a free action once per faction turn, it can bring an allied Asset to its location, provided they’re within one turn’s movement range, or move an allied Asset from its own location to a target also within a turn’s move. Multiple Military Transport assets can chain this movement over long distances.\n**Purity Rites:** A rigorous program of regular mental inspection and counterintelligence measures has been undertaken by the faction. This Asset can only defend against attacks that target the faction’s Cunning, but it allows the faction to roll an extra die to defend.\n**Reserve Corps:** Retired military personnel and rear-line troops are spread through the area as workers or colonists, available to resist hostilities as needed.\n**Scouts:** Long-range scouts and reconnaissance experts work for the faction, able to venture deep into hostile territory.\n**Siege Experts:** These soldiers are trained in trenching, sapping, and razing targeted structures. When they successfully Attack an enemy Asset, the owner loses 1d4 points of Treasure from their reserves and this faction gains it.\n**Summoned Hunter:** A skilled sorcerer has summoned a magical beast or mentally bound a usefully disposable assassin into the faction’s service.\n**Temple Fanatics:** Fanatical servants of a cult, ideology, or larger religion, these enthusiasts wreak havoc on enemies without a thought for their own lives. After every time the Temple Fanatics defend or successfully attack, they take 1d4 damage.\n**Thugs:** These gutter ruffians and common kneebreakers have been organized in service to the faction’s causes.\n**Vanguard Unit:** This unit is specially trained to build bridges, reduce fortifications, and facilitate a lightning strike into enemy territory. When its faction takes a Relocate Asset turn, it can move the Vanguard Unit and any allied units at the same location to any other location within range, even if the unit type would normally be pro
