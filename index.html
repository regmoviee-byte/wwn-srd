8 | 4 | 4 | 9 | Любое одно |\n| 9 | 5 | 5 | 10 | – |\n| 10 | 5 | 6 | 12 | Любое одно |\n\n**Искусства и заклинания частичного Стихийника**\n\n| Уровень | Макс. уровень заклинаний | Заклинаний в день | Подготовлено заклинаний | Полученные Искусства |\n|---|---|---|---|---|\n| 1 | 1 | 1 | 2 | Стихийная стойкость, Искры стихий и любое одно |\n| 2 | 1 | 1 | 3 | – |\n| 3 | 1 | 1 | 3 | Любое одно |\n| 4 | 1 | 2 | 4 | – |\n| 5 | 2 | 2 | 5 | – |\n| 6 | 2 | 3 | 6 | Любое одно |\n| 7 | 2 | 3 | 7 | – |\n| 8 | 2 | 3 | 7 | – |\n| 9 | 3 | 4 | 8 | Любое одно |\n| 10 | 3 | 4 | 9 | – |\n\n**Частичный Эксперт/Стихийник**\n\n| Уровень | Кости здоровья | Бонус атаки | Выборы Фокусов |\n|---|---|---|---|\n| 1 | 1d6 | +0 | 1 Эксперта, +1 любой |\n| 2 | 2d6 | +1 | +1 любой |\n| 3 | 3d6 | +1 | – |\n| 4 | 4d6 | +2 | – |\n| 5 | 5d6 | +2 | +1 любой |\n| 6 | 6d6 | +3 | – |\n| 7 | 7d6 | +3 | +1 любой |\n| 8 | 8d6 | +4 | – |\n| 9 | 9d6 | +4 | – |\n| 10 | 10d6 | +5 | +1 любой |\n\n**Частичный другой Маг/Стихийник**\n\n| Уровень | Кости здоровья | Бонус атаки | Выборы Фокусов |\n|---|---|---|---|\n| 1 | 1d6-1 | +0 | 1 любой |\n| 2 | 2d6-2 | +0 | +1 любой |\n| 3 | 3d6-3 | +0 | – |\n| 4 | 4d6-4 | +0 | – |\n| 5 | 5d6-5 | +1 | +1 любой |\n| 6 | 6d6-6 | +1 | – |\n| 7 | 7d6-7 | +1 | +1 любой |\n| 8 | 8d6-8 | +1 | – |\n| 9 | 9d6-9 | +1 | – |\n| 10 | 10d6-10 | +2 | +1 любой |\n\n**Частичный Воин/Стихийник**\n\n| Уровень | Кости здоровья | Бонус атаки | Выборы Фокусов |\n|---|---|---|---|\n| 1 | 1d6+2 | +1 | 1 Воина, +1 любой |\n| 2 | 2d6+4 | +2 | +1 любой |\n| 3 | 3d6+6 | +2 | – |\n| 4 | 4d6+8 | +3 | – |\n| 5 | 5d6+10 | +4 | +1 любой |\n| 6 | 6d6+12 | +5 | – |\n| 7 | 7d6+14 | +5 | +1 любой |\n| 8 | 8d6+16 | +6 | – |\n| 9 | 9d6+18 | +6 | – |\n| 10 | 10d6+20 | +7 | +1 любой |"},{"n":"1.5.8","l":3,"te":"The Expert","tr":"Эксперт","en":"Your hero is an expert at some useful skill. Thieves, diplomats, healers, scholars, explorers, artisans, and other such heroes should pick the Expert class if they wish to focus on developing their special skills and performing tremendous feats of mastery with them. Experts gain the widest variety of non-combat skills and are the quickest to learn more of them.\nAn Expert has an uncanny knack for wielding their skills successfully at a crucial moment, whether or not it’s a skill they’ve taken for their specialty. Once per scene, the Expert can reroll a failed non-combat skill check, gaining a second chance to yank victory from the jaws of otherwise certain failure. Their natural focus on personal development and determined refinement of their skills bleeds through even into those talents they don’t make their special domain.\nExperts are also capable combatants, fully able to hold their own in the midst of a murderous fray. It’s not unknown for some Experts to specialize in professions related to martial pursuits, such as an assassin who relies heavily on their superb powers of stealth and deception to reach their unwary foes.\n#### Class Ability: Masterful Expertise\nOnce per scene, a Full Expert may reroll any non-combat skill check as an Instant action. This allows the Expert to make a roll and then immediately use this ability if the resulting total isn’t good enough to succeed. In cases where it matters, the better of the two rolls may be used.\nNote that the typical ten-minute dungeon exploration turn generally counts as a scene, allowing the Full Expert to use this ability every turn if they so wish.\nPartial Experts do not receive this ability.\n#### Class Ability: Quick Learner\nWhen you advance a character level, you gain an extra skill point which may only be spent on gaining or improving non-combat skills or raising attributes. You may save this point to spend later if you wish.\nPartial Experts do receive this ability.\n**Full Expert**\n| Level | Hit Dice | Bonus Attack | Focus Picks |\n|---|---|---|---|\n| 1 | 1d6 | +0 | 1 Expert +1 Any |\n| 2 | 2d6 | +1 | +1 Any |\n| 3 | 3d6 | +1 |  |\n| 4 | 4d6 | +2 |  |\n| 5 | 5d6 | +2 | +1 Any |\n| 6 | 6d6 | +3 |  |\n| 7 | 7d6 | +3 | +1 Any |\n| 8 | 8d6 | +4 |  |\n| 9 | 9d6 | +4 |  |\n| 10 | 10d6 | +5 | +1 Any |\n|  | Partial | Mage/Partial | Expert |\n**Partial Mage/Partial Expert**\n| Level | Hit Dice | Bonus Attack | Focus Picks |\n|---|---|---|---|\n| 1 | 1d6 | +0 | 1 Expert +1 Any |\n| 2 | 2d6 | +1 | +1 Any |\n| 3 | 3d6 | +1 |  |\n| 4 | 4d6 | +2 |  |\n| 5 | 5d6 | +2 | +1 Any |\n| 6 | 6d6 | +3 |  |\n| 7 | 7d6 | +3 | +1 Any |\n| 8 | 8d6 | +4 |  |\n| 9 | 9d6 | +4 |  |\n| 10 | 10d6 | +5 | +1 Any |\n|  | Partial | Warrior/Partial | Expert |\n**Partial Warrior/Partial Expert**\n| Level | Hit Dice | Bonus Attack | Focus Picks |\n|---|---|---|---|\n| 1 | 1d6+2 | +1 | 1 Warrior +1 Expert +1 Any |\n| 2 | 2d6+4 | +2 | +1 Any |\n| 3 | 3d6+6 | +2 |  |\n| 4 | 4d6+8 | +3 |  |\n| 5 | 5d6+10 | +4 | +1 Any |\n| 6 | 6d6+12 | +5 |  |\n| 7 | 7d6+14 | +5 | +1 Any |\n| 8 | 8d6+16 | +6 |  |\n| 9 | 9d6+18 | +6 |  |\n| 10 | 10d6+20 | +7 | +1 Any |","ru":"Твой герой — эксперт в каком-то полезном навыке. Ворам, дипломатам, лекарям, учёным, землепроходцам, ремесленникам и прочим подобным героям стоит выбирать класс Эксперта, если они хотят сосредоточиться на развитии своих особых навыков и совершать с ними грандиозные подвиги мастерства. Эксперты получают самый широкий набор небоевых навыков и быстрее всех учат новые.\n\nУ Эксперта сверхъестественное чутьё на успешное применение навыков в решающий миг — неважно, взял ли он этот навык своей специальностью. Раз за сцену Эксперт может перебросить провальную проверку небоевого навыка, получая второй шанс вырвать победу из пасти, казалось бы, неминуемого провала. Его природная устремлённость к личному росту и упорной шлифовке навыков проступает даже в тех талантах, которые он не сделал своей особой вотчиной.\n\nЭксперты к тому же способные бойцы и вполне могут постоять за себя в гуще смертоубийственной свалки. Не редкость и Эксперты, чья профессия связана с ратным делом, — например, убийца, который во многом полагается на превосходное искусство скрытности и обмана, чтобы добраться до беспечных жертв.\n\n#### Классовая способность: Виртуозное мастерство\n\nРаз за сцену полный Эксперт может перебросить любую проверку небоевого навыка Мгновенным действием. Это позволяет Эксперту сделать бросок и тут же применить эту способность, если итоговой суммы не хватает для успеха. Там, где это имеет значение, можно использовать лучший из двух бросков.\n\nЗаметь: обычный десятиминутный ход исследования подземелья, как правило, считается сценой, так что полный Эксперт может при желании применять эту способность каждый ход.\n\nЧастичные Эксперты эту способность не получают.\n\n#### Классовая способность: Схватывает на лету\n\nПоднимаясь на уровень персонажа, ты получаешь дополнительный пункт навыка, который можно потратить только на приобретение или улучшение небоевых навыков либо на повышение характеристик. При желании этот пункт можно придержать и потратить позже.\n\nЧастичные Эксперты эту способность получают.\n\n**Полный Эксперт**\n\n| Уровень | Кости здоровья | Бонус атаки | Выборы Фокусов |\n|---|---|---|---|\n| 1 | 1d6 | +0 | 1 Эксперта, +1 любой |\n| 2 | 2d6 | +1 | +1 любой |\n| 3 | 3d6 | +1 | – |\n| 4 | 4d6 | +2 | – |\n| 5 | 5d6 | +2 | +1 любой |\n| 6 | 6d6 | +3 | – |\n| 7 | 7d6 | +3 | +1 любой |\n| 8 | 8d6 | +4 | – |\n| 9 | 9d6 | +4 | – |\n| 10 | 10d6 | +5 | +1 любой |\n\n**Частичный Маг/частичный Эксперт**\n\n| Уровень | Кости здоровья | Бонус атаки | Выборы Фокусов |\n|---|---|---|---|\n| 1 | 1d6 | +0 | 1 Эксперта, +1 любой |\n| 2 | 2d6 | +1 | +1 любой |\n| 3 | 3d6 | +1 | – |\n| 4 | 4d6 | +2 | – |\n| 5 | 5d6 | +2 | +1 любой |\n| 6 | 6d6 | +3 | – |\n| 7 | 7d6 | +3 | +1 любой |\n| 8 | 8d6 | +4 | – |\n| 9 | 9d6 | +4 | – |\n| 10 | 10d6 | +5 | +1 любой |\n\n**Частичный Воин/частичный Эксперт**\n\n| Уровень | Кости здоровья | Бонус атаки | Выборы Фокусов |\n|---|---|---|---|\n| 1 | 1d6+2 | +1 | 1 Воина, +1 Эксперта, +1 любой |\n| 2 | 2d6+4 | +2 | +1 любой |\n| 3 | 3d6+6 | +2 | – |\n| 4 | 4d6+8 | +3 | – |\n| 5 | 5d6+10 | +4 | +1 любой |\n| 6 | 6d6+12 | +5 | – |\n| 7 | 7d6+14 | +5 | +1 любой |\n| 8 | 8d6+16 | +6 | – |\n| 9 | 9d6+18 | +6 | – |\n| 10 | 10d6+20 | +7 | +1 любой |"},{"n":"1.5.9","l":3,"te":"The Healer","tr":"Целитель","en":"The Healer is a partial Mage class that does not use spells. Instead, they gain specific arts that allow them to mend wounds, cure illnesses, and otherwise sustain their allies.\n#### Healer Benefits\nThe Healer class exists only as a partial Mage class, to be taken by an Adventurer along with another partial class. Thus, a Partial Warrior/Partial Healer might be a grizzled combat medic, a Partial Expert/Partial Healer might be an erudite physician gifted in both mundane and magical healing methods, and a Partial Necromancer/Partial Healer might be an adept of life and death.\nAll Healers gain Heal as a bonus skill, acquiring it at level-0, or level-1 if they already have it at level-0. A basic grounding in mundane healing techniques is necessary in order to learn their more sophisticated magical arts.\nHealers do not learn how to cast spells. Instead, they focus on their special arcane healing arts. Wielding these arts usually requires nothing more than touching the target and concentrating on the desired effect, and the process is direct and simple enough to perform even when burdened by armor or carrying a shield. These arts are usually quite subtle, and don’t produce visible or audible indications of their use.\nAt first level, a Healer gains the Healing Touch art and can pick one more of their choice. As they advance in levels afterwards, they can learn new arts. Once chosen, an art is permanent and cannot be exchanged.","ru":"Целитель — частичный класс Мага, не пользующийся заклинаниями. Вместо них он получает особые Искусства, позволяющие врачевать раны, исцелять болезни и иначе поддерживать союзников.\n\n#### Преимущества Целителя\n\nКласс Целителя существует только как частичный класс Мага: его берёт Авантюрист в паре с другим частичным классом. Так, частичный Воин/частичный Целитель может быть бывалым полевым лекарем, частичный Эксперт/частичный Целитель — учёным врачом, одарённым и в обычных, и в магических методах врачевания, а частичный Некромант/частичный Целитель — адептом жизни и смерти.\n\nВсе Целители получают Медицину как бонусный навык: она приобретается на уровне-0 или на уровне-1, если уже была уровня-0. Базовая выучка в обычных приёмах врачевания необходима, чтобы освоить их более изощрённые магические Искусства.\n\nЦелители не учатся читать заклинания. Вместо этого они сосредоточены на своих особых тайных Искусствах врачевания. Чтобы пустить такое Искусство в ход, обычно достаточно коснуться цели и сосредоточиться на желаемом эффекте, а сам процесс настолько прям и прост, что доступен даже обременённому доспехом или щитом. Эти Искусства, как правило, весьма неприметны и не выдают себя ничем видимым или слышимым.\n\nНа первом уровне Целитель получает Искусство «Целительное касание» и может выбрать ещё одно на свой вкус. Поднимаясь в уровнях, он учит новые Искусства. Выбор Искусства окончателен: поменять его позже нельзя."},{"n":"1.5.9.1","l":4,"te":"Healer Arts","tr":"Искусства Целителя","en":"Healer Effort is calculated with Heal rather than Magic, with each PC’s maximum being equal to their Heal skill level plus the better of their Intelligence or Charisma modifiers, to a minimum of one point.\n\nAll Healers are trained in the Healing Touch art, but may develop other techniques with time.\n\n**Healing Touch:** Commit Effort for the scene as an Instant action; for the rest of the scene, you may heal 2d6 damage plus your Heal skill to a touched ally as a Main Action. This healing adds 1 System Strain to the target each time it is applied.\n\n#### Other Healer Arts\n\n**Empowered Healer:** Your Healing Touch becomes more powerful, adding your level to any healing.\n\n**Facile Healer:** Your Healing Touch ability is improved;, and you no longer need to Commit Effort to activate it.\n\n**Far Healer:** Your Healing Touch ability is improved, and may be used on a visible target within ten feet per character level.\n\n**Final Repose:** Target a visible living creature and Commit Effort for the day as an Instant action. For the rest of the scene, they take a Physical saving throw penalty equal to your Heal skill. If they are reduced to zero hit points before the end of the scene, they die with no chance for stabilization or revival.\n\n**Healer’s Eye:** Commit Effort as an On Turn action; while the Effort remains committed, you can use a Main Action to visually detect diseases and poisons, diagnose creatures flawlessly, perceive their physiology, and learn their current hit point totals. As a side effect, you can detect living creatures by sight regardless of available light or obscuring mists.\n\n**Limb Restoration:** Only expert healers can master this art, which\n\ncannot be learned earlier than 8th level. You must Commit all remaining Effort for the day, a minimum of one point, to regenerate a missing limb or organ for a target you are touching, or efface some dramatic scar or other physical debility. The target’s System Strain is automatically maximized.\n\n**Purge Ailment:** Commit Effort for the day as a Main Action. An ally you are touching is cured of one poison or disease. Creatures killed by poison can be revived by this art if it is used within six minutes of death. Magical poisons and diseases may require a Wis/Heal or Cha/Heal skill check against a difficulty of 8 or more. At seventh level, you need only Commit Effort for the scene to use this ability.\n\n**Refined Restoration:** You and up to a dozen allies you tend before they sleep will all lose 2 System Strain from a good night’s rest instead of 1.\n\n**Revive the Fallen:** Only expert healers are capable of mastering this art, which cannot be learned earlier than 8th level. Commit Effort for the day as a Main Action to revive a recently-slain living creature that you are touching. This ability must be used on a target within one minute per caster level of their death, and will not work on a corpse that has been dismembered, incinerated, or otherwise disjected. The target’s System Strain is automatically maximized and they’ll be unconscious for twenty-four hours after their restoration before awakening with 1 hit point.\n\n**Swift Healer:** Your Healing Touch ability is improved, and may be used as an On Turn action once per day per character level, though not more than once per round on any given target.\n\n**The Healer’s Knife:** Your Healing Touch ability is altered, and may be used to inflict damage to a living target instead of healing it. The damage done is equivalent to the healing that would normally be done, albeit you receive 1 System Strain instead of the target. Using this power in melee requires a successful Punch attack with a hit bonus equal to your Heal skill, with the damage added to any done by the blow, or simply touching an unwary target. Ranged use with Far Healer is impossible with this art.\n\n**Tireless Vigor:** Commit Effort; while it remains Committed your need to eat, drink, breathe, or sleep does not grow further. You may exert yourself tirelessly and regenerate 1 lost hit point per hour.\n\n**Vital Furnace:** Your tremendous life energy can be used to instantly regenerate any non-mortal wound you have received. Commit Effort for the day as an Instant action to negate the damage from an injury you just received that did not reduce you to zero hit points. Aside from this ability, you automatically stabilize if reduced to zero hit points and awaken ten minutes later with 1 hit point. This ability cannot undo damage you intentionally inflict on yourself via some power or magical exchange.\n\n**Partial Expert/Healer**\n| Level | Hit Dice | Bonus Attack | Focus Picks |\n|---|---|---|---|\n| 1 | 1d6 | +0 | 1 Expert +1 Any |\n| 2 | 2d6 | +1 | +1 Any |\n| 3 | 3d6 | +1 |  |\n| 4 | 4d6 | +2 |  |\n| 5 | 5d6 | +2 | +1 Any |\n| 6 | 6d6 | +3 |  |\n| 7 | 7d6 | +3 | +1 Any |\n| 8 | 8d6 | +4 |  |\n| 9 | 9d6 | +4 |  |\n| 10 | 10d6 | +5 | +1 Any |\n\n**Partial Mage/Healer**\n| Level | Hit Dice | Bonus Attack | Focus Picks |\n|---|---|---|---|\n| 1 | 1d6-1 | +0 | 1 Any |\n| 2 | 2d6-2 | +0 | +1 Any |\n| 3 | 3d6-3 | +0 |  |\n| 4 | 4d6-4 | +0 |  |\n| 5 | 5d6-5 | +1 | +1 Any |\n| 6 | 6d6-6 | +1 |  |\n| 7 | 7d6-7 | +1 | +1 Any |\n| 8 | 8d6-8 | +1 |  |\n| 9 | 9d6-9 | +1 |  |\n| 10 | 10d6-10 | +2 | +1 Any |\n\n**Partial Warrior/Healer**\n| Level | Hit Dice | Bonus Attack | Focus Picks |\n|---|---|---|---|\n| 1 | 1d6+2 | +1 | 1 Warrior +1 Any |\n| 2 | 2d6+4 | +2 | +1 Any |\n| 3 | 3d6+6 | +2 |  |\n| 4 | 4d6+8 | +3 |  |\n| 5 | 5d6+10 | +4 | +1 Any |\n| 6 | 6d6+12 | +5 |  |\n| 7 | 7d6+14 | +5 | +1 Any |\n| 8 | 8d6+16 | +6 |  |\n| 9 | 9d6+18 | +6 |  |\n| 10 | 10d6+20 | +7 | +1 Any |\n\n| Level | Arts Gained Healer Arts |\n|---|---|\n| 1 | Healing Touch and Any One |\n| 2 | Any One |\n| 3 |  |\n| 4 | Any One |\n| 5 | Any One |\n| 6 | Any One |\n| 7 |  |\n| 8 | Any One |\n| 9 |  |\n| 10 | Any One |","ru":"Усилие Целителя рассчитывается по Медицине, а не по Магии: максимум каждого ПИ равен уровню навыка Медицина плюс больший из модификаторов Интеллекта или Харизмы, минимум один пункт.\n\nВсе Целители обучены Искусству «Целительное касание», но со временем могут развить и другие приёмы.\n\n**Целительное касание:** Задействуй Усилие до конца сцены Мгновенным действием; до конца сцены ты можешь Основным действием исцелять союзнику, которого касаешься, 2d6 урона плюс свой навык Медицина. Каждое применение этого лечения добавляет цели 1 Системной нагрузки.\n\n#### Другие Искусства Целителя\n\n**Быстрое целительство:** Твоё Целительное касание становится лучше: его можно применять Действием в свой ход раз в день за уровень персонажа, но не чаще раза в раунд на одну и ту же цель.\n\n**Восстановление конечностей:** Это Искусство по силам лишь искушённым целителям: его нельзя выучить раньше 8-го уровня. Ты должен задействовать до конца дня всё оставшееся Усилие, минимум один пункт, чтобы отрастить цели, которой касаешься, утраченную конечность или орган либо стереть заметный шрам или иной телесный изъян. Системная нагрузка цели автоматически поднимается до максимума.\n\n**Глаз целителя:** Задействуй Усилие Действием в свой ход; пока оно остаётся задействованным, ты можешь Основным действием на глаз распознавать болезни и яды, безошибочно ставить существам диагноз, видеть их физиологию и узнавать их текущие пункты здоровья. Побочный эффект: ты видишь живых существ независимо от освещения и застилающих взор туманов.\n\n**Горнило жизни:** Твоя колоссальная жизненная энергия способна мгновенно заращивать любую несмертельную рану. Задействуй Усилие до конца дня Мгновенным действием, чтобы отменить урон от только что полученной раны, которая не опустила тебя до нуля пунктов здоровья. Помимо этой способности, ты автоматически стабилизируешься, упав до нуля пунктов здоровья, и очнёшься десять минут спустя с 1 пунктом здоровья. Эта способность не может отменить урон, который ты намеренно причиняешь себе сам через какую-нибудь силу или магический обмен.\n\n**Дальнее целительство:** Твоё Целительное касание становится лучше: его можно применять к видимой цели в пределах десяти футов за уровень персонажа.\n\n**Изгнание недуга:** Задействуй Усилие до конца дня Основным действием. Союзник, которого ты касаешься, исцеляется от одного яда или болезни. Существ, убитых ядом, это Искусство может оживить, если применено в течение шести минут после смерти. Магические яды и болезни могут потребовать проверки Мдр/Медицина или Хар/Медицина против сложности 8 или выше. С седьмого уровня для этой способности довольно задействовать Усилие лишь до конца сцены.\n\n**Искусное восстановление:** Ты и до дюжины союзников, которых ты пользуешь перед сном, теряете за ночь хорошего отдыха 2 Системной нагрузки вместо 1.\n\n**Лёгкое целительство:** Твоё Целительное касание становится лучше: тебе больше не нужно задействовать Усилие, чтобы привести его в действие.\n\n**Мощное целительство:** Твоё Целительное касание становится мощнее, добавляя твой уровень к любому исцелению.\n\n**Неутомимая бодрость:** Задействуй Усилие; пока оно остаётся задействованным, твоя потребность в еде, питье, дыхании и сне не растёт. Ты можешь трудиться без устали и восстанавливаешь 1 потерянный пункт здоровья в час.\n\n**Нож целителя:** Твоё Целительное касание меняется: им можно наносить живой цели урон вместо исцеления. Урон равен исцелению, которое было бы дано обычным образом, но 1 Системной нагрузки получаешь ты, а не цель. Чтобы применить эту силу в ближнем бою, нужна успешная атака Кулаком с бонусом к попаданию, равным твоему навыку Медицина, — урон добавляется к урону самого удара, — либо простое касание беспечной цели. Дальнобойное применение через Дальнее целительство с этим Искусством невозможно.\n\n**Оживить павшего:** Это Искусство по силам лишь искушённым целителям: его нельзя выучить раньше 8-го уровня. Задействуй Усилие до конца дня Основным действием, чтобы оживить недавно убитое живое существо, которого касаешься. Способность нужно применить в пределах одной минуты за уровень колдующего с момента смерти, и она не подействует на тело, которое расчленили, испепелили или иначе разъяли. Системная нагрузка цели автоматически поднимается до максимума, и после восстановления цель пробудет без сознания двадцать четыре часа, прежде чем очнётся с 1 пунктом здоровья.\n\n**Последний покой:** Выбери видимое живое существо и задействуй Усилие до конца дня Мгновенным действием. До конца сцены цель получает штраф к Физическим спасброскам, равный твоему навыку Медицина. Если до конца сцены она упадёт до нуля пунктов здоровья, то умрёт без шанса на стабилизацию или оживление.\n\n**Искусства Целителя**\n\n| Уровень | Полученные Искусства |\n|---|---|\n| 1 | Целительное касание и любое одно |\n| 2 | Любое одно |\n| 3 | – |\n| 4 | Любое одно |\n| 5 | Любое одно |\n| 6 | Любое одно |\n| 7 | – |\n| 8 | Любое одно |\n| 9 | – |\n| 10 | Любое одно |\n\n**Частичный Эксперт/Целитель**\n\n| Уровень | Кости здоровья | Бонус атаки | Выборы Фокусов |\n|---|---|---|---|\n| 1 | 1d6 | +0 | 1 Эксперта, +1 любой |\n| 2 | 2d6 | +1 | +1 любой |\n| 3 | 3d6 | +1 | – |\n| 4 | 4d6 | +2 | – |\n| 5 | 5d6 | +2 | +1 любой |\n| 6 | 6d6 | +3 | – |\n| 7 | 7d6 | +3 | +1 любой |\n| 8 | 8d6 | +4 | – |\n| 9 | 9d6 | +4 | – |\n| 10 | 10d6 | +5 | +1 любой |\n\n**Частичный Маг/Целитель**\n\n| Уровень | Кости здоровья | Бонус атаки | Выборы Фокусов |\n|---|---|---|---|\n| 1 | 1d6-1 | +0 | 1 любой |\n| 2 | 2d6-2 | +0 | +1 любой |\n| 3 | 3d6-3 | +0 | – |\n| 4 | 4d6-4 | +0 | – |\n| 5 | 5d6-5 | +1 | +1 любой |\n| 6 | 6d6-6 | +1 | – |\n| 7 | 7d6-7 | +1 | +1 любой |\n| 8 | 8d6-8 | +1 | – |\n| 9 | 9d6-9 | +1 | – |\n| 10 | 10d6-10 | +2 | +1 любой |\n\n**Частичный Воин/Целитель**\n\n| Уровень | Кости здоровья | Бонус атаки | Выборы Фокусов |\n|---|---|---|---|\n| 1 | 1d6+2 | +1 | 1 Воина, +1 любой |\n| 2 | 2d6+4 | +2 | +1 любой |\n| 3 | 3d6+6 | +2 | – |\n| 4 | 4d6+8 | +3 | – |\n| 5 | 5d6+10 | +4 | +1 любой |\n| 6 | 6d6+12 | +5 | – |\n| 7 | 7d6+14 | +5 | +1 любой |\n| 8 | 8d6+16 | +6 | – |\n| 9 | 9d6+18 | +6 | – |\n| 10 | 10d6+20 | +7 | +1 любой |"},{"n":"1.5.10","l":3,"te":"The High Mage","tr":"Высший маг","en":"High Mages represent the default spellcaster in most campaigns. Their spells tend to be generalist in nature rather than focusing on particular specific themes, but their arts make them extremely skilled at manipulating and augmenting the magics they use.\n#### High Mage Benefits\nAll High Mages gain Magic as a bonus skill, acquiring it at level-0, or level-1 if was already level-0. Every High Mage is well-educated in the principles of magic as understood by the sorcerers of this world.\nHigh Mages can prepare and cast High Magic spells, and have a number of arts dedicated to improving their use of these incantations. As usual for spellcasters, they cannot wear bulky clothing or armor while casting or using arts, nor use shields. Mages who have trained to overcome these limits with the Armored Magic Focus have more latitude.\nHigh Mages conduct extensive experimentation and study as part of their daily activities. Each time they advance a level, they may pick two High Magic spells from the list in this book to add to their repertoire. These spells must be of a level they can cast.\nHigh Mages also gain arts specific to their tradition. At first level, a full High Mage picks two arts and a partial High Mage picks one. As they gain levels and experience, they’ll learn additional arts from the adjacent list. Once picked, an art cannot be changed.","ru":"Высший маг — заклинатель по умолчанию в большинстве кампаний. Его заклинания обычно универсальны по природе и не сосредоточены на каких-то отдельных темах, зато Искусства делают Высших магов исключительно умелыми в управлении используемой магией и её усилении.\n\n#### Преимущества Высшего мага\n\nВсе Высшие маги получают Магию как бонусный навык: она приобретается на уровне-0 или на уровне-1, если уже была уровня-0. Каждый Высший маг хорошо образован в принципах магии, как их понимают чародеи этого мира.\n\nВысшие маги могут готовить и читать заклинания Высшей магии, и ряд их Искусств посвящён совершенствованию работы с этими инкантациями. Как обычно у заклинателей, они не могут читать заклинания и применять Искусства в громоздкой одежде или доспехах, равно как и пользоваться щитами. У магов, научившихся обходить эти ограничения Фокусом «Магия в доспехах», свободы больше.\n\nВысшие маги ведут обширные опыты и изыскания в рамках повседневных занятий. Каждый раз, поднимаясь на уровень, они могут выбрать из списка в этой книге два заклинания Высшей магии и добавить их в свой репертуар. Эти заклинания должны быть уровня, который они способны читать.\n\nВысшие маги также получают Искусства, свойственные их традиции. На первом уровне полный Высший маг выбирает два Искусства, а частичный — одно. С ростом уровней и опыта они выучат новые Искусства из прилагаемого списка. Однажды выбранное Искусство поменять нельзя."},{"n":"1.5.10.1","l":4,"te":"High Mage Arts","tr":"Искусства Высшего мага","en":"High Mage Effort is calculated as usual, with each PC’s maximum being equal to one plus their Magic skill level plus the better of their Intelligence or Charisma modifiers. Partial High Mages have a score one point lower than this, albeit not less than one.\n\n**Arcane Lexicon:** Commit Effort for the scene. For the rest of the scene, you can read any script that was not intentionally obfuscated or encoded by its writer. Extremely esoteric or nonhuman scripts may not be comprehensible this way; the “plain meaning” of the text might be utterly foreign to human logic.\n\n**Counter Magic:** Commit Effort for the day as an Instant action when a visible enemy mage casts a spell. Both of you make opposed Int/Magic or Cha/Magic skill checks; if you win, their spell fizzles and is wasted. This art only works on actual spellcasters and not creatures that merely activate magical powers. You can use this art no more than once per round.\n\n**Empowered Sorcery:** Commit Effort for the day as an Instant action to re-roll any variable die roll associated with a spell’s effects, such as a damage roll; take the roll you prefer.\n\n**Hang Sorcery:** Commit Effort for the scene as an Instant action when casting a spell. The spell does not go off, but remains “hung” and waiting to be triggered as an On Turn action, with details of targeting and effect determined at that time. Damage does not disrupt a hung spell, but no additional spells can be cast until the hung spell is released or allowed to dissipate.\n\n**Inexorable Effect:** Commit Effort for the day as an Instant action to force an enemy to re-roll a successful saving throw and take the worse result. You may use this art only once per scene.\n\n**Iron Resolution:** Commit Effort for the day when injured or disturbed in combat; you may make a Physical saving throw to resist spell disruption and ignore the damage for purposes of spellcasting.\n\n**Preparatory Countermagic:** Commit Effort for the scene when\n\nyou are affected by a spell you have prepared, including when you are standing in the area of effect of one of your own damaging spells. You are unaffected by the spell’s direct effects.\n\n**Psychic Conversion:** Once per day as an On Turn action, expend one casting slot to remove one point of accrued System Strain and heal 2 hit points per level.\n\n**Restrained Casting:** Commit Effort for the day as an Instant action when casting a High Magic spell. You may do so in perfect silence and without need for somatic gestures, though damage will still disrupt the casting.\n\n**Retain Sorcery:** Commit Effort for the day as an On Turn action after casting a spell; it does not count against your casting limits for the day. You can use this art no more than once per day, and the stress of using it prevents you from casting another spell before the end of your next turn.\n\n**Sense Magic:** Commit Effort as an Instant action; while it remains committed, you can visually perceive magical energy and get a one-sentence description of the effect of any standing magics or magical items you inspect. The ambient magical energies in most areas allow you to see clearly even in conditions of perfect darkness.\n\n**Suppress Magic:** Commit Effort for the day as an On Turn action and target a visible or known magical effect within one hundred feet. The effect is suppressed as if by the Extirpate Arcana spell for 1d6 rounds plus the caster’s character level. Spells cast by more powerful casters may not be successfully suppressed, as noted in the spell description. The caster can attempt to suppress an effect only once.\n\n**Swift Casting:** Once per scene, you may Commit Effort for the day to turn a spell that normally requires a Main Action to cast into an On Turn action. You can cast no other spell this round and you can’t use this art if you’ve already cast a spell this round or been injured or otherwise disqualified from casting.\n\n**Ward Allies:** Commit Effort for the day as an Instant action to omit up to six allies from the effects of an area-effect spell you cast, allowing them to avoid any damage or other negative effect that would be directly produced by the spell. This does not protect them from indirect consequences, however, such as destroying the building they are standing in.\n\n**Wizard’s Grandeur:** Commit Effort as an On Turn action. As long as it remains Committed, you will not become dirty, sweaty, stained, or rumpled regardless of the circumstances. Noxious substances will slide off you without staining and you will remain comfortable regardless of your attire in any normal climate. You may sleep comfortably without shelter or bedding as per the privation rules.\n\n**Full High Mage**\n| Level | Hit Dice | Bonus Attack | Focus Picks |\n|---|---|---|---|\n| 1 | 1d6-1 | +0 | 1 Any |\n| 2 | 2d6-2 | +0 | +1 Any |\n| 3 | 3d6-3 | +0 |  |\n| 4 | 4d6-4 | +0 |  |\n| 5 | 5d6-5 | +1 | +1 Any |\n| 6 | 6d6-6 | +1 |  |\n| 7 | 7d6-7 | +1 | +1 Any |\n| 8 | 8d6-8 | +1 |  |\n| 9 | 9d6-9 | +1 |  |\n| 10 | 10d6-10 | +2 | +1 Any |\n\n**Full High Mage Arts and Spells**\n| Level | Max Level | Cast Spells | Pre- pared Spells | Arts Gained |\n|---|---|---|---|---|\n| 1 | 1 | 1 | 3 | Any Two |\n| 2 | 1 | 1 | 3 | Any One |\n| 3 | 2 | 2 | 4 |  |\n| 4 | 2 | 2 | 5 | Any One |\n| 5 | 3 | 3 | 6 |  |\n| 6 | 3 | 3 | 7 | Any One |\n| 7 | 4 | 4 | 8 |  |\n| 8 | 4 | 4 | 9 | Any One |\n| 9 | 5 | 5 | 10 |  |\n| 10 | 5 | 6 | 12 | Any One |\n\n**Partial High Mage Arts and Spells**\n| Level | Max Level | Cast Spells | Pre- pared Spells | Arts Gained |\n|---|---|---|---|---|\n| 1 | 1 | 1 | 2 | Any One |\n| 2 | 1 | 1 | 3 | Any One |\n| 3 | 1 | 1 | 3 | Any One |\n| 4 | 1 | 2 | 4 |  |\n| 5 | 2 | 2 | 5 |  |\n| 6 | 2 | 3 | 6 | Any One |\n| 7 | 2 | 3 | 7 |  |\n| 8 | 2 | 3 | 7 |  |\n| 9 | 3 | 4 | 8 | Any One |\n| 10 | 3 | 4 | 9 |  |\n\n**Partial Expert/High Mage**\n| Level | Hit Dice | Bonus Attack | Focus Picks |\n|---|---|---|---|\n| 1 | 1d6 | +0 | 1 Expert +1 Any |\n| 2 | 2d6 | +1 | +1 Any |\n| 3 | 3d6 | +1 |  |\n| 4 | 4d6 | +2 |  |\n| 5 | 5d6 | +2 | +1 Any |\n| 6 | 6d6 | +3 |  |\n| 7 | 7d6 | +3 | +1 Any |\n| 8 | 8d6 | +4 |  |\n| 9 | 9d6 | +4 |  |\n| 10 | 10d6 | +5 | +1 Any |\n\n**Partial Other Mage/High Mage**\n| Level | Hit Dice | Bonus Attack | Focus Picks |\n|---|---|---|---|\n| 1 | 1d6-1 | +0 | 1 Any |\n| 2 | 2d6-2 | +0 | +1 Any |\n| 3 | 3d6-3 | +0 |  |\n| 4 | 4d6-4 | +0 |  |\n| 5 | 5d6-5 | +1 | +1 Any |\n| 6 | 6d6-6 | +1 |  |\n| 7 | 7d6-7 | +1 | +1 Any |\n| 8 | 8d6-8 | +1 |  |\n| 9 | 9d6-9 | +1 |  |\n| 10 | 10d6-10 | +2 | +1 Any |\n\n**Partial Warrior/High Mage**\n| Level | Hit Dice | Bonus Attack | Focus Picks |\n|---|---|---|---|\n| 1 | 1d6+2 | +1 | 1 Warrior +1 Any |\n| 2 | 2d6+4 | +2 | +1 Any |\n| 3 | 3d6+6 | +2 |  |\n| 4 | 4d6+8 | +3 |  |\n| 5 | 5d6+10 | +4 | +1 Any |\n| 6 | 6d6+12 | +5 |  |\n| 7 | 7d6+14 | +5 | +1 Any |\n| 8 | 8d6+16 | +6 |  |\n| 9 | 9d6+18 | +6 |  |\n| 10 | 10d6+20 | +7 | +1 Any |","ru":"Усилие Высшего мага рассчитывается как обычно: максимум каждого ПИ равен единице плюс уровень навыка Магия плюс больший из модификаторов Интеллекта или Харизмы. У частичных Высших магов этот показатель на пункт ниже, хотя и не меньше единицы.\n\n**Быстрое колдовство:** Раз за сцену ты можешь задействовать Усилие до конца дня, чтобы обратить заклинание, обычно требующее для чтения Основного действия, в Действие в свой ход. В этот раунд ты не можешь прочесть другого заклинания и не можешь использовать это Искусство, если уже читал заклинание в этом раунде, был ранен или иначе лишился возможности колдовать.\n\n**Величие волшебника:** Задействуй Усилие Действием в свой ход. Пока оно остаётся задействованным, ты не пачкаешься, не потеешь, не покрываешься пятнами и не мнёшься, что бы ни происходило. Пакостные субстанции соскальзывают с тебя, не оставляя следов, и в любом обычном климате тебе удобно независимо от наряда. Для правил лишений ты можешь с удобством спать без крова и постели.\n\n**Железная решимость:** Задействуй Усилие до конца дня, когда тебя ранили или потревожили в бою; ты можешь пройти Физический спасбросок, чтобы устоять против срыва заклинания и игнорировать урон для целей чтения заклинаний.\n\n**Контрмагия:** Задействуй Усилие до конца дня Мгновенным действием, когда видимый вражеский маг читает заклинание. Вы оба проходите встречные проверки Инт/Магия или Хар/Магия; если победил ты, его заклинание гаснет и пропадает впустую. Это Искусство действует только на настоящих заклинателей, а не на существ, которые лишь приводят в действие магические способности. Пользоваться этим Искусством можно не чаще раза в раунд.\n\n**Неотвратимый эффект:** Задействуй Усилие до конца дня Мгновенным действием, чтобы заставить врага перебросить успешный спасбросок и взять худший результат. Это Искусство можно использовать лишь раз за сцену.\n\n**Оберечь союзников:** Задействуй Усилие до конца дня Мгновенным действием, чтобы исключить до шести союзников из эффектов прочитанного тобой объёмного заклинания: они избегают любого урона и иных вредных эффектов, которые заклинание произвело бы напрямую. Однако от косвенных последствий — например, обрушения здания, в котором они стоят, — это не защищает.\n\n**Подавить магию:** Задействуй Усилие до конца дня Действием в свой ход и выбери видимый или известный тебе магический эффект в пределах ста футов. Эффект подавляется, как заклинанием «Искоренение чар», на 1d6 раундов плюс уровень персонажа колдующего. Заклинания более могущественных колдующих могут не поддаться подавлению, как отмечено в описании заклинания. Колдующий может попытаться подавить данный эффект лишь однажды.\n\n**Подвешенные чары:** Задействуй Усилие до конца сцены Мгновенным действием при чтении заклинания. Заклинание не срабатывает, а остаётся «подвешенным» и ждёт спуска Действием в свой ход; детали выбора целей и эффекта определяются в этот момент. Урон не срывает подвешенное заклинание, но новых заклинаний читать нельзя, пока подвешенное не выпущено или ему не позволено рассеяться.\n\n**Психическое преобразование:** Раз в день Действием в свой ход истрать одно дневное чтение заклинания, чтобы снять один пункт накопленной Системной нагрузки и исцелить 2 пункта здоровья за уровень.\n\n**Сдержанное колдовство:** Задействуй Усилие до конца дня Мгновенным действием при чтении заклинания Высшей магии. Ты можешь прочесть его в полной тишине и без нужды в жестах, хотя урон по-прежнему срывает чтение.\n\n**Тайный лексикон:** Задействуй Усилие до конца сцены. До конца сцены ты можешь читать любую письменность, которую пишущий не запутал и не зашифровал намеренно. Крайне эзотерические или нечеловеческие письмена так постичь может и не выйти: «прямой смысл» текста может быть совершенно чужд человеческой логике.\n\n**Удержать чары:** Задействуй Усилие до конца дня Действием в свой ход после чтения заклинания: оно не идёт в счёт твоего дневного лимита чтений. Это Искусство можно использовать не чаще раза в день, и от его напряжения ты не можешь прочесть новое заклинание до конца своего следующего хода.\n\n**Упреждающая контрмагия:** Задействуй Усилие до конца сцены, когда на тебя действует заклинание, которое ты сам держишь подготовленным, — в том числе когда стоишь в области действия одного из собственных наносящих урон заклинаний. Прямые эффекты заклинания тебя не затрагивают.\n\n**Усиленное чародейство:** Задействуй Усилие до конца дня Мгновенным действием, чтобы перебросить любой переменный бросок костей, связанный с эффектами заклинания, например бросок урона; возьми тот результат, что больше нравится.\n\n**Чутьё на магию:** Задействуй Усилие Мгновенным действием; пока оно остаётся задействованным, ты зримо воспринимаешь магическую энергию и получаешь описание в одно предложение для эффекта любых постоянных чар или магических предметов, которые рассматриваешь. Фоновых магических энергий в большинстве мест хватает, чтобы ясно видеть даже в полной темноте.\n\n**Полный Высший маг**\n\n| Уровень | Кости здоровья | Бонус атаки | Выборы Фокусов |\n|---|---|---|---|\n| 1 | 1d6-1 | +0 | 1 любой |\n| 2 | 2d6-2 | +0 | +1 любой |\n| 3 | 3d6-3 | +0 | – |\n| 4 | 4d6-4 | +0 | – |\n| 5 | 5d6-5 | +1 | +1 любой |\n| 6 | 6d6-6 | +1 | – |\n| 7 | 7d6-7 | +1 | +1 любой |\n| 8 | 8d6-8 | +1 | – |\n| 9 | 9d6-9 | +1 | – |\n| 10 | 10d6-10 | +2 | +1 любой |\n\n**Искусства и заклинания полного Высшего мага**\n\n| Уровень | Макс. уровень заклинаний | Заклинаний в день | Подготовлено заклинаний | Полученные Искусства |\n|---|---|---|---|---|\n| 1 | 1 | 1 | 3 | Любые два |\n| 2 | 1 | 1 | 3 | Любое одно |\n| 3 | 2 | 2 | 4 | – |\n| 4 | 2 | 2 | 5 | Любое одно |\n| 5 | 3 | 3 | 6 | – |\n| 6 | 3 | 3 | 7 | Любое одно |\n| 7 | 4 | 4 | 8 | – |\n| 8 | 4 | 4 | 9 | Любое одно |\n| 9 | 5 | 5 | 10 | – |\n| 10 | 5 | 6 | 12 | Любое одно |\n\n**Искусства и заклинания частичного Высшего мага**\n\n| Уровень | Макс. уровень заклинаний | Заклинаний в день | Подготовлено заклинаний | Полученные Искусства |\n|---|---|---|---|---|\n| 1 | 1 | 1 | 2 | Любое одно |\n| 2 | 1 | 1 | 3 | Любое одно |\n| 3 | 1 | 1 | 3 | Любое одно |\n| 4 | 1 | 2 | 4 | – |\n| 5 | 2 | 2 | 5 | – |\n| 6 | 2 | 3 | 6 | Любое одно |\n| 7 | 2 | 3 | 7 | – |\n| 8 | 2 | 3 | 7 | – |\n| 9 | 3 | 4 | 8 | Любое одно |\n| 10 | 3 | 4 | 9 | – |\n\n**Частичный Эксперт/Высший маг**\n\n| Уровень | Кости здоровья | Бонус атаки | Выборы Фокусов |\n|---|---|---|---|\n| 1 | 1d6 | +0 | 1 Эксперта, +1 любой |\n| 2 | 2d6 | +1 | +1 любой |\n| 3 | 3d6 | +1 | – |\n| 4 | 4d6 | +2 | – |\n| 5 | 5d6 | +2 | +1 любой |\n| 6 | 6d6 | +3 | – |\n| 7 | 7d6 | +3 | +1 любой |\n| 8 | 8d6 | +4 | – |\n| 9 | 9d6 | +4 | – |\n| 10 | 10d6 | +5 | +1 любой |\n\n**Частичный другой Маг/Высший маг**\n\n| Уровень | Кости здоровья | Бонус атаки | Выборы Фокусов |\n|---|---|---|---|\n| 1 | 1d6-1 | +0 | 1 любой |\n| 2 | 2d6-2 | +0 | +1 любой |\n| 3 | 3d6-3 | +0 | – |\n| 4 | 4d6-4 | +0 | – |\n| 5 | 5d6-5 | +1 | +1 любой |\n| 6 | 6d6-6 | +1 | – |\n| 7 | 7d6-7 | +1 | +1 любой |\n| 8 | 8d6-8 | +1 | – |\n| 9 | 9d6-9 | +1 | – |\n| 10 | 10d6-10 | +2 | +1 любой |\n\n**Частичный Воин/Высший маг**\n\n| Уровень | Кости здоровья | Бонус атаки | Выборы Фокусов |\n|---|---|---|---|\n| 1 | 1d6+2 | +1 | 1 Воина, +1 любой |\n| 2 | 2d6+4 | +2 | +1 любой |\n| 3 | 3d6+6 | +2 | – |\n| 4 | 4d6+8 | +3 | – |\n| 5 | 5d6+10 | +4 | +1 любой |\n| 6 | 6d6+12 | +5 | – |\n| 7 | 7d6+14 | +5 | +1 любой |\n| 8 | 8d6+16 | +6 | – |\n| 9 | 9d6+18 | +6 | – |\n| 10 | 10d6+20 | +7 | +1 любой |"},{"n":"1.5.11","l":3,"te":"The Invoker","tr":"Волхв","en":"The Invoker is an optional spellcasting Mage class that allows a caster to gain flexibility in casting weaker spells. In exchange, an Invoker sacrifices arts and finds more powerful spells to be more draining to cast.\n#### Invoker Benefits\nAll Invokers gain Magic as a bonus skill, acquiring it at level-0, or level-1 if was already level-0. Their arcane versatility requires a thorough grounding in theory.\nInvokers can learn and prepare spells of the High Magic tradition, and have the same limits on casting in armor as they do. Each Invoker can prepare a number of known spells as indicated by the table each day, plus their Intelligence modifier.\nEach Invoker has a number of spell points based on their level, to which is added their Intelligence modifier. When they cast the spell, they subtract its level from their available spell points for the day. So long as they have sufficient spell points left, they can cast the same spell repeatedly. Spell points refresh each morning.\nInvokers do not normally gain arts; their versatility requires complete focus, barring those who take the Invoker-specific Traditional Education Focus. While it’s possible to be a Partial Invoker, this partial class may not be mixed with another partial spellcasting class.\nInvokers begin play knowing four first level High Magic spells, or two if a partial class. When they advance a level, they learn two more of any level or tradition from which they can cast, or one if a partial Invoker.\n#### Focus: Traditional Education\nYour Invoker has received a great deal of education in a specialist arcane spellcasting tradition such as High Magic arts, Elementalism or Necromancy. Only Invokers can take this Focus, and it can only be taken once.\n**Level 1:** You may learn and prepare spells of your chosen tradition as well as those of High Magic. You gain arts as if a first level practitioner of that tradition, full or partial based on whether you’re a full or partial Invoker, and your maximum Effort score is equal to your Magic skill, to a minimum of 1. You cannot gain further arts from this tradition.\n#### Partial Invoker Hit Dice and Attack Bonuses\nPartial Invokers use the High Mage partial-class tables for hit dice and attack bonuses when blending with other classes.\n**Full Invoker**\n| Level | Hit Dice | Bonus Attack | Focus Picks |\n|---|---|---|---|\n| 1 | 1d6-1 | +0 | 1 Any |\n| 2 | 2d6-2 | +0 | +1 Any |\n| 3 | 3d6-3 | +0 |  |\n| 4 | 4d6-4 | +0 |  |\n| 5 | 5d6-5 | +1 | +1 Any |\n| 6 | 6d6-6 | +1 |  |\n| 7 | 7d6-7 | +1 | +1 Any |\n| 8 | 8d6-8 | +1 |  |\n| 9 | 9d6-9 | +1 |  |\n| 10 | 10d6-10 | +2 | +1 Any |\n**Full Invoker Spells**\n| Level | Max Spell Level | Spell Points | Spells Prepared |\n|---|---|---|---|\n| 1 | 1 | 1 + Int Mod | 2 + Int Mod |\n| 2 | 1 | 3 + Int Mod | 3 + Int Mod |\n| 3 | 2 | 4 + Int Mod | 4 + Int Mod |\n| 4 | 2 | 5 + Int Mod | 4 + Int Mod |\n| 5 | 3 | 6 + Int Mod | 5 + Int Mod |\n| 6 | 3 | 7 + Int Mod | 6 + Int Mod |\n| 7 | 4 | 8 + Int Mod | 7 + Int Mod |\n| 8 | 4 | 9 + Int Mod | 7 + Int Mod |\n| 9 | 5 | 10 + Int Mod | 8 + Int Mod |\n| 10 | 5 | 11 + Int Mod | 9 + Int Mod |\n**Partial Invoker Spells**\n| Level | Max Spell Level | Spell Points | Spells Prepared |\n|---|---|---|---|\n| 1 | 1 | 1 + Int Mod | 1 + Int Mod |\n| 2 | 1 | 1 + Int Mod | 3 + Int Mod |\n| 3 | 1 | 2 + Int Mod | 3 + Int Mod |\n| 4 | 1 | 2 + Int Mod | 4 + Int Mod |\n| 5 | 2 | 3 + Int Mod | 4 + Int Mod |\n| 6 | 2 | 3 + Int Mod | 5 + Int Mod |\n| 7 | 2 | 4 + Int Mod | 5 + Int Mod |\n| 8 | 2 | 4 + Int Mod | 6 + Int Mod |\n| 9 | 3 | 5 + Int Mod | 6 + Int Mod |\n| 10 | 3 | 6 + Int Mod | 7 + Int Mod |","ru":"Волхв — необязательный колдующий класс Мага, который даёт заклинателю больше гибкости в чтении слабых заклинаний. Взамен Волхв жертвует Искусствами, а чтение более могущественных заклинаний выматывает его сильнее.\n\n#### Преимущества Волхва\n\nВсе Волхвы получают Магию как бонусный навык: она приобретается на уровне-0 или на уровне-1, если уже была уровня-0. Их магическая разносторонность требует основательной теоретической выучки.\n\nВолхвы могут учить и готовить заклинания традиции Высшей магии и подчиняются тем же ограничениям на колдовство в доспехах, что и Высшие маги. Каждый Волхв может ежедневно готовить указанное в таблице число известных ему заклинаний плюс модификатор Интеллекта.\n\nУ каждого Волхва есть пункты заклинаний, число которых зависит от уровня; к нему добавляется модификатор Интеллекта. Читая заклинание, Волхв вычитает его уровень из своих оставшихся на день пунктов заклинаний. Пока пунктов заклинаний хватает, одно и то же заклинание можно читать снова и снова. Пункты заклинаний восстанавливаются каждое утро.\n\nОбычно Волхвы не получают Искусств: их разносторонность требует полной сосредоточенности — кроме тех, кто берёт особый волховской Фокус «Классическое образование». Частичным Волхвом быть можно, но этот частичный класс нельзя смешивать с другим частичным классом заклинателя.\n\nВолхв начинает игру, зная четыре заклинания Высшей магии первого уровня, или два, если это частичный класс. Поднимаясь на уровень, он выучивает ещё два заклинания любого уровня и любой традиции, из которых способен читать, — или одно, если он частичный Волхв.\n\n#### Фокус «Классическое образование»\n\nТвой Волхв получил серьёзное образование в одной специальной традиции тайного колдовства — например, в Искусствах Высшей магии, стихийной магии или некромантии. Взять этот Фокус могут только Волхвы, и лишь один раз.\n\n**Уровень 1:** Ты можешь учить и готовить заклинания избранной традиции наравне с заклинаниями Высшей магии. Ты получаешь Искусства как практик этой традиции первого уровня — полный или частичный, смотря по тому, полный ты Волхв или частичный, — и твой максимум Усилия равен навыку Магия, минимум 1. Дальнейших Искусств этой традиции ты не получаешь.\n\n#### Кости здоровья и бонусы атаки частичного Волхва\n\nЧастичные Волхвы используют таблицы частичных классов Высшего мага для костей здоровья и бонусов атаки при сочетании с другими классами.\n\n**Полный Волхв**\n\n| Уровень | Кости здоровья | Бонус атаки | Выборы Фокусов |\n|---|---|---|---|\n| 1 | 1d6-1 | +0 | 1 любой |\n| 2 | 2d6-2 | +0 | +1 любой |\n| 3 | 3d6-3 | +0 | – |\n| 4 | 4d6-4 | +0 | – |\n| 5 | 5d6-5 | +1 | +1 любой |\n| 6 | 6d6-6 | +1 | – |\n| 7 | 7d6-7 | +1 | +1 любой |\n| 8 | 8d6-8 | +1 | – |\n| 9 | 9d6-9 | +1 | – |\n| 10 | 10d6-10 | +2 | +1 любой |\n\n**Заклинания полного Волхва**\n\n| Уровень | Макс. уровень заклинаний | Пункты заклинаний | Подготовлено заклинаний |\n|---|---|---|---|\n| 1 | 1 | 1 + мод. Инт | 2 + мод. Инт |\n| 2 | 1 | 3 + мод. Инт | 3 + мод. Инт |\n| 3 | 2 | 4 + мод. Инт | 4 + мод. Инт |\n| 4 | 2 | 5 + мод. Инт | 4 + мод. Инт |\n| 5 | 3 | 6 + мод. Инт | 5 + мод. Инт |\n| 6 | 3 | 7 + мод. Инт | 6 + мод. Инт |\n| 7 | 4 | 8 + мод. Инт | 7 + мод. Инт |\n| 8 | 4 | 9 + мод. Инт | 7 + мод. Инт |\n| 9 | 5 | 10 + мод. Инт | 8 + мод. Инт |\n| 10 | 5 | 11 + мод. Инт | 9 + мод. Инт |\n\n**Заклинания частичного Волхва**\n\n| Уровень | Макс. уровень заклинаний | Пункты заклинаний | Подготовлено заклинаний |\n|---|---|---|---|\n| 1 | 1 | 1 + мод. Инт | 1 + мод. Инт |\n| 2 | 1 | 1 + мод. Инт | 3 + мод. Инт |\n| 3 | 1 | 2 + мод. Инт | 3 + мод. Инт |\n| 4 | 1 | 2 + мод. Инт | 4 + мод. Инт |\n| 5 | 2 | 3 + мод. Инт | 4 + мод. Инт |\n| 6 | 2 | 3 + мод. Инт | 5 + мод. Инт |\n| 7 | 2 | 4 + мод. Инт | 5 + мод. Инт |\n| 8 | 2 | 4 + мод. Инт | 6 + мод. Инт |\n| 9 | 3 | 5 + мод. Инт | 6 + мод. Инт |\n| 10 | 3 | 6 + мод. Инт | 7 + мод. Инт |"},{"n":"1.5.12","l":3,"te":"The Mage","tr":"Маг","en":"The Mage class is a general header under which all heroes with fundamentally supernatural powers or spellcasting ability are place. Once this class is chosen, the PC must choose a specific arcane tradition to follow; one is a High Mage, or a Vowed, or an Elementalist, for example.\nNot all magical traditions necessarily involve classical spell-flinging and conjury. Some traditions are much more physical in nature, granting the practitioners remarkable bodily prowess or unique magical gifts they can exercise. Some Mage traditions involve no spellcasting at all, restricting their focus entirely to the strange arcane gifts their forebears have developed.\nWhile these spells and occult powers are impressive, they tend to come at a cost. A Mage must spend so much time focused on their studies and training that they have little time to master any other art. Most are notably weak combatants with little ability to survive hardships that would merely wound or weary a Warrior.\nIn addition to this, many traditions have their own specific limits on practitioners. Initiates of the High Mage tradition, for example, cannot cast their spells while wearing anything heavier than normal clothing, thus making it impossible for them to wear armor and still wield their spells. The hindrances of some traditions extend beyond physical limitations to social penalties or difficulties in dealing with mundane humanity; a necromancer may have impressive powers of magic, but they are often unwelcome in civilized lands and are sometimes subject to the panicked justice of frightened locals and their lords.\nThe ways of magic tend to be specific to settings in a way that swordplay or skillful arts are not. Your GM may disallow certain Mage traditions or partial classes based on the particulars of their own campaign world or the specific sort of game they want to play. Some campaigns set in historical periods or very low-magic worlds might not include Mages at all, leaving heroes reliant on the strength of their own arms and the cunning of their own native wits.\nWhatever the setting, Mage heroes need to rely on careful planning and a cooperative party to get the most from their abilities. While potent, the spells they wield are few in number and usually narrow in effect; even the mightiest sorcerer is just not going to be as effective as their Warrior peers in slaying fearsome enemies or their Expert companions in carrying out the mundane activities of stealth, persuasion, or investigation. Instead, Mages excel at providing carefully-planned impossibilities, those selective defiances of reality that allow their teammates to pull off incredible schemes or overcome otherwise insurmountable odds.\n#### Class Ability: Arcane Tradition\nThe Mage may pick one magical tradition to represent their occult powers, as listed in this section. This tradition may give them a number of additional benefits and restrictions.","ru":"Класс Мага — общая рубрика, под которой собраны все герои с в основе своей сверхъестественными силами или даром чтения заклинаний. Выбрав этот класс, ПИ обязан выбрать конкретную магическую традицию, которой будет следовать: он, например, Высший маг, Обетник или Стихийник.\n\nНе всякая магическая традиция обязательно сводится к классическому метанию заклинаний и чародейству. Иные традиции куда телеснее по своей природе: они дают адептам поразительную телесную мощь или уникальные магические дары. Некоторые традиции Магов вовсе обходятся без чтения заклинаний, целиком сосредоточившись на странных тайных дарах, взращённых их предшественниками.\n\nКак ни впечатляющи эти заклинания и оккультные способности, обычно за них приходится платить. Маг вынужден отдавать учёбе и упражнениям столько времени, что на овладение каким-либо иным ремеслом его почти не остаётся. Большинство из них — заметно слабые бойцы, которым трудно пережить невзгоды, что Воина лишь ранили бы или утомили.\n\nВдобавок у многих традиций есть собственные ограничения для адептов. Посвящённые традиции Высших магов, например, не могут читать заклинания, нося на себе что-либо тяжелее обычной одежды, — так что носить броню и при этом владеть своими заклинаниями им невозможно. У некоторых традиций помехи выходят за рамки телесных ограничений: это социальные кары или трудности в отношениях с обычным человечеством. У некроманта могут быть впечатляющие магические силы, но в цивилизованных землях ему часто не рады, а порой он попадает под паническое правосудие перепуганных местных и их господ.\n\nПути магии обычно привязаны к конкретному сеттингу — не так, как фехтование или умелые ремёсла. Мастер может запретить отдельные традиции Магов или частичные классы, исходя из особенностей своего мира кампании или конкретного рода игры, которую он хочет вести. В иных кампаниях — по историческим эпохам или мирам с очень слабой магией — Магов может не быть вовсе, и героям останутся сила собственных рук и хитрость собственного природного ума.\n\nКаким бы ни был сеттинг, героям-Магам, чтобы выжать из своих способностей максимум, нужны тщательное планирование и слаженный отряд. Заклинания в их руках могущественны, но немногочисленны и обычно узки по действию; даже самый могучий чародей просто не сравнится с товарищем-Воином в истреблении грозных врагов или со спутником-Экспертом в мирских делах скрытности, убеждения и расследования. Зато Маги блистают, поставляя тщательно спланированные невозможности — те избирательные попрания реальности, что позволяют их команде провернуть невероятные планы или переломить безнадёжные обстоятельства.\n\n#### Классовая способность: Магическая традиция\n\nМаг выбирает одну магическую традицию из перечисленных в этом разделе — она и воплощает его оккультные силы. Традиция может давать ему ряд дополнительных преимуществ и ограничений."},{"n":"1.5.13","l":3,"te":"The Mageslayer","tr":"Магоборец","en":"Mageslayers are those specialist combatants who trade a more general proficiency in battle for certain special arts that make them exceptionally lethal against spellcasters.\n#### Benefits of the Mageslayer\nThe Mageslayer is a partial Warrior class that must be joined with a second partial class by an Adventurer. As no Mage class is allowed to pair with this profession, this usually means a Partial Warrior/ Mageslayer or Partial Expert/Mageslayer.\nUnlike the normal Partial Warrior class, Mageslayers do not get a bonus combat Focus at first level, nor do they grant a Partial Warrior’s +2 hit points per hit die. If their other Partial class is Warrior, they gain these benefits normally.\nAll Mageslayers gain Magic-0 during character creation. While it cannot be used for item creation or other magical pursuits, it allows them an intellectual understanding of their prey’s abilities. Mageslayers gain special arts at first level and as they advance.\n#### Spellcasters and Spells\nMany of these arts refer to “casters” and “spells”. Each of these terms has a specific definition for Mageslayers.\nA “spell” is learned power that a creature casts with the usual spellcasting rules or an art used by a Mage class. Magical effects created by portable magic items also count as spells, such as a wand that hurls fiery bolts, or an amulet that conjures impenetrable barriers.\nPassive magical qualities, like the hit bonus of a magic sword, do not count as spells, nor do magical effects created by Workings or other large-scale edifices. Neither are a magical creature’s innate supernatural powers or magical abilities that mimic specific spells.\nA “caster” is any creature that is capable of casting spells using the usual spellcasting rules or triggering Mage class arts, whatever their brand of magic may be.\nPotent as the Mageslayer’s arts may be, they are not strong enough to negate magic generated by gods, demi-divinities, or other quasi-divine entities.","ru":"Магоборцы — бойцы-специалисты, обменявшие более широкую боевую выучку на особые Искусства, которые делают их исключительно смертоносными для заклинателей.\n\n#### Преимущества Магоборца\n\nМагоборец — частичный класс Воина, который Авантюрист обязан соединить со вторым частичным классом. Поскольку ни одному классу Мага не позволено сочетаться с этим ремеслом, обычно выходит частичный Воин/Магоборец или частичный Эксперт/Магоборец.\n\nВ отличие от обычного частичного Воина, Магоборец не получает на первом уровне бонусный боевой Фокус и не даёт положенных частичному Воину +2 пунктов здоровья за кость здоровья. Если его второй частичный класс — Воин, эти преимущества достаются как обычно.\n\nВсе Магоборцы при создании персонажа получают Магию-0. Для создания предметов и прочих магических занятий она непригодна, но даёт теоретическое понимание способностей их добычи. Свои особые Искусства Магоборцы получают на первом уровне и далее по мере развития.\n\n#### Колдующие и заклинания\n\nМногие из этих Искусств говорят о «колдующих» и «заклинаниях». У каждого из этих терминов есть точное определение для Магоборцев.\n\n«Заклинание» — это выученная сила, которую существо творит по обычным правилам чтения заклинаний, либо Искусство, применяемое классом Мага. Магические эффекты, создаваемые переносными магическими предметами, тоже считаются заклинаниями — например, жезл, мечущий огненные стрелы, или амулет, воздвигающий непроницаемые преграды.\n\nПассивные магические качества, такие как бонус атаки магического меча, заклинаниями не считаются, как и магические эффекты, созданные Творениями и иными крупными сооружениями. Не считаются ими и врождённые сверхъестественные силы магических существ, а также магические способности, подражающие конкретным заклинаниям.\n\n«Колдующий» — любое существо, способное читать заклинания по обычным правилам чтения заклинаний или запускать Искусства классов Мага, какова бы ни была его разновидность магии.\n\nКак ни могучи Искусства Магоборца, им не под силу отменить магию богов, полубожеств и прочих квазибожественных сущностей."},{"n":"1.5.13.1","l":4,"te":"Mageslayer Arts","tr":"Искусства Магоборца","en":"A Mageslayer has an Effort score equal to their Magic skill level plus their highest attribute modifier among Intelligence and Constitution, to a minimum of one point. Mageslayer arts may be used in or out of armor, and require no free hands, incantations, or other overt actions, though some sects have favored prayers or oaths.\n\nA Mageslayer gains their arts at a set rate, beginning with Antimage and Magebane at first level, and acquiring other talents as they gain experience.\n\n**Partial Expert/Mageslayer**\n| Level | Hit Dice | Bonus Attack | Focus Picks |\n|---|---|---|---|\n| 1 | 1d6 | +1 | 1 Expert +1 Any |\n| 2 | 2d6 | +2 | +1 Any |\n| 3 | 3d6 | +2 |  |\n| 4 | 4d6 | +3 |  |\n| 5 | 5d6 | +4 | +1 Any |\n| 6 | 6d6 | +5 |  |\n| 7 | 7d6 | +5 | +1 Any |\n| 8 | 8d6 | +6 |  |\n| 9 | 9d6 | +6 |  |\n| 10 | 10d6 | +7 | +1 Any |\n\n**Absolute Negation:** As an Instant action, Commit Effort for the day when you are about to be affected or impeded by an unwanted spell or a standing magical effect created by a spell. You may ignore the magic.\n\n**Partial Warrior/Mageslayer**\n| Level | Hit Dice | Bonus Attack | Focus Picks |\n|---|---|---|---|\n| 1 | 1d6+2 | +1 | 1 Warrior +1 Any |\n| 2 | 2d6+4 | +2 | +1 Any |\n| 3 | 3d6+6 | +2 |  |\n| 4 | 4d6+8 | +3 |  |\n| 5 | 5d6+10 | +4 | +1 Any |\n| 6 | 6d6+12 | +5 |  |\n| 7 | 7d6+14 | +5 | +1 Any |\n| 8 | 8d6+16 | +6 |  |\n| 9 | 9d6+18 | +6 |  |\n| 10 | 10d6+20 | +7 | +1 Any |\n\n**Antimage:** Get one level of the Nullifier Focus for free, or a free\n\n**Mageslayer Art Progression**\n| Level | Arts Gained at This Level |\n|---|---|\n| 1 | Antimage, Magebane |\n| 2 | Witchfinder, Spellshield |\n| 3 | Disrupt Sorcery |\n| 4 | Know Your Prey |\n| 5 | Share the Pain |\n| 6 | Dispel Enchantment |\n| 7 | Ward Ally |\n| 8 | Immaculate Body |\n| 9 | Immaculate Mind |\n| 10 | Absolute Negation |\n\nFocus if you somehow have both levels.\n\n**Dispel Enchantment:** As a Main Action, touch an ally and Commit Effort for the day. Your touch acts as an Extirpate Arcana spell. This art can only be applied to creatures, not objects, and can be applied to yourself or a given target only once per day.\n\n**Disrupt Sorcery:** As an On Turn action, Commit Effort for the scene.\n\nThe next attack you make that round will leave the target unable to cast spells or trigger Mage arts for the rest of the round, even if the attack misses. Currently-active arts are not disrupted. If the attack is successfully Screened by an ally, however, the target is unaffected.\n\n**Immaculate Body:** Magical transformations, curses, or lingering negative magical penalties last a maximum of one scene on you. Such malisons cannot kill you, reducing you to 1 HP at worst. This applies to all magical effects, and not only to hostile spells.\n\n**Immaculate Mind:** You are impervious to unwanted mind-affecting or mind-reading spells or magical effects, and you automatically see through illusions and magical invisibility. Note that this applies to all such magical effects, not merely spells.\n\n**Know Your Prey:** Your Magic skill is treated as one point higher than it is, up to a maximum of level-4 skill. This benefit adds to your Effort as usual, and may allow you to have a higher Magic skill than your character level would usually allow.\n\n**Magebane:** You add half your level, rounded up, to all damage you inflict on casters from any source, be it by weapon, Shock, or violent action. This does not stack with a Warrior’s Killing Blow class ability.\n\n**Share the Pain:** As an Instant action, Commit Effort for the day when you are targeted by a hostile spell or are in its area of effect. Make a Mental saving throw; on a success, the spell’s caster is treated as also having affected by the spell that just targeted you. This art can be used only once per round.\n\n**Spellshield:** When a spell inflicts hit point damage on you, it’s automatically halved, rounded down, before any saves or resistances are applied.\n\n**Ward Ally:** As an Instant action, Commit Effort for the scene when an ally within thirty feet is affected by a spell; you are affected by the spell in place of your ally. If you are both in the same area of effect, the spell hits you twice. Any defenses or arts you have against sorcery may be applied as usual to this transferred effect.\n\n**Witchfinder:** As a Main Action, Commit Effort for the scene. For the rest of the scene, you gain the benefits of the Apprehend the Arcane Form spell, except for the spell’s dark-vision ability.","ru":"Показатель Усилия Магоборца равен уровню его навыка Магия плюс больший из модификаторов Интеллекта и Телосложения, минимум один пункт. Искусства Магоборца можно применять и в броне, и без неё; им не нужны свободные руки, инкантации и другие явные действия, хотя у иных сект в чести особые молитвы или клятвы.\n\nМагоборец обретает Искусства в заданном порядке: на первом уровне он начинает с Антимага и Грозы магов, а прочие таланты осваивает, набираясь опыта.\n\n**Частичный Эксперт/Магоборец**\n\n| Уровень | Кости здоровья | Бонус атаки | Выборы Фокусов |\n|---|---|---|---|\n| 1 | 1d6 | +1 | 1 Эксперта, +1 любой |\n| 2 | 2d6 | +2 | +1 любой |\n| 3 | 3d6 | +2 | – |\n| 4 | 4d6 | +3 | – |\n| 5 | 5d6 | +4 | +1 любой |\n| 6 | 6d6 | +5 | – |\n| 7 | 7d6 | +5 | +1 любой |\n| 8 | 8d6 | +6 | – |\n| 9 | 9d6 | +6 | – |\n| 10 | 10d6 | +7 | +1 любой |\n\n**Частичный Воин/Магоборец**\n\n| Уровень | Кости здоровья | Бонус атаки | Выборы Фокусов |\n|---|---|---|---|\n| 1 | 1d6+2 | +1 | 1 Воина, +1 любой |\n| 2 | 2d6+4 | +2 | +1 любой |\n| 3 | 3d6+6 | +2 | – |\n| 4 | 4d6+8 | +3 | – |\n| 5 | 5d6+10 | +4 | +1 любой |\n| 6 | 6d6+12 | +5 | – |\n| 7 | 7d6+14 | +5 | +1 любой |\n| 8 | 8d6+16 | +6 | – |\n| 9 | 9d6+18 | +6 | – |\n| 10 | 10d6+20 | +7 | +1 любой |\n\n**Прогрессия Искусств Магоборца**\n\n| Уровень | Искусства, получаемые на этом уровне |\n|---|---|\n| 1 | Антимаг, Гроза магов |\n| 2 | Ведьмолов, Щит от чар |\n| 3 | Разрушить колдовство |\n| 4 | Знай свою добычу |\n| 5 | Разделить боль |\n| 6 | Развеять чары |\n| 7 | Оберечь союзника |\n| 8 | Непорочное тело |\n| 9 | Непорочный разум |\n| 10 | Абсолютное отрицание |\n\n**Абсолютное отрицание:** Мгновенным действием задействуй Усилие до конца дня, когда тебя вот-вот затронет или стеснит нежеланное заклинание либо постоянный магический эффект, созданный заклинанием. Ты можешь проигнорировать эту магию.\n\n**Антимаг:** Получи бесплатно один уровень Фокуса «Гаситель», а если у тебя каким-то образом уже есть оба уровня — бесплатный Фокус.\n\n**Ведьмолов:** Основным действием задействуй Усилие до конца сцены. До конца сцены ты пользуешься преимуществами заклинания «Постижение тайной формы», кроме его способности видеть в темноте.\n\n**Гроза магов:** Ко всему урону, который ты наносишь колдующим из любого источника — оружием, Шоком или иным насильственным действием, — добавляй половину своего уровня с округлением вверх. С классовой способностью Воина «Смертельный удар» это не складывается.\n\n**Знай свою добычу:** Твой навык Магия считается на пункт выше настоящего, максимум до навыка уровня-4. Это преимущество как обычно увеличивает твоё Усилие и может дать тебе уровень навыка Магия выше, чем обычно позволял бы уровень персонажа.\n\n**Непорочное тело:** Магические превращения, проклятия и затяжные вредные магические кары держатся на тебе не дольше одной сцены. Такие напасти не могут тебя убить: в худшем случае ты опускаешься до 1 ПЗ. Это касается всех магических эффектов, а не только враждебных заклинаний.\n\n**Непорочный разум:** Ты непроницаем для нежеланных заклинаний и магических эффектов, воздействующих на разум или читающих его, и автоматически видишь насквозь иллюзии и магическую невидимость. Заметь: это касается всех подобных магических эффектов, а не одних лишь заклинаний.\n\n**Оберечь союзника:** Мгновенным действием задействуй Усилие до конца сцены, когда заклинание поражает союзника в пределах тридцати футов; заклинание действует на тебя вместо союзника. Если вы оба в одной области действия, заклинание бьёт тебя дважды. Любые твои защиты и Искусства против колдовства применимы к перенесённому эффекту как обычно.\n\n**Развеять чары:** Основным действием коснись союзника и задействуй Усилие до конца дня. Твоё касание действует как заклинание «Искоренение чар». Это Искусство применимо только к существам, не к предметам, а к тебе самому или к отдельной цели — лишь раз в день.\n\n**Разделить боль:** Мгновенным действием задействуй Усилие до конца дня, когда враждебное заклинание избирает тебя целью или накрывает областью действия. Сделай Ментальный спасбросок; при успехе считается, что колдующий тоже поражён заклинанием, которое только что было нацелено на тебя. Это Искусство можно применять лишь раз в раунд.\n\n**Разрушить колдовство:** Действием в свой ход задействуй Усилие до конца сцены. Следующая твоя атака в этом раунде лишит цель возможности читать заклинания и запускать Искусства Мага до конца раунда, даже если атака промахнётся. Уже действующие Искусства не прерываются. Но если союзник успешно Прикрыл цель от этой атаки, цель не затронута.\n\n**Щит от чар:** Когда заклинание наносит тебе урон пунктам здоровья, урон автоматически уменьшается вдвое с округлением вниз — ещё до применения любых спасбросков и сопротивлений."},{"n":"1.5.14","l":3,"te":"The Necromancer","tr":"Некромант","en":"Necromancers are those spellcasting Mages who deal with the energies of life and death.\n#### Necromancer Benefits\nAll Necromancers gain Magic as a bonus skill, acquiring it at level-0, or level-1 if was already level-0.\nNecromancers can prepare and cast High Magic spells in addition to the spells specific to Necromancers. Some of the latter are given on the following pages, but others doubtless exist. As usual for spellcasters, Necromancers can’t cast spells or use arts while armored or holding a shield.\nNecromancers are not as talented at general High Magic research as High Mages are, but their studies still bear fruit in time. Each time they advance a level, they can pick a new High Magic spell or a Necromancer spell to add to their spellbook. They must be able to cast the spell to add it to their selection.\nNecromancers can pick an art specific to their tradition from the adjacent list. Further arts are learned as they advance in character level, as given in the tables below. Once chosen, an art cannot be changed.","ru":"Некроманты — те Маги-заклинатели, что имеют дело с энергиями жизни и смерти.\n\n#### Преимущества Некроманта\n\nВсе Некроманты получают Магию бонусным навыком: на уровне-0 или на уровне-1, если она уже была уровня-0.\n\nНекроманты могут готовить и читать заклинания Высшей магии вдобавок к заклинаниям, присущим только Некромантам. Часть последних приведена на следующих страницах, но наверняка существуют и другие. Как обычно у заклинателей, Некромант не может читать заклинания и пользоваться Искусствами, будучи в броне или со щитом в руке.\n\nВ общих исследованиях Высшей магии Некроманты не так одарённы, как Высшие маги, но со временем их занятия всё же приносят плоды. С каждым новым уровнем они могут добавить в свою книгу заклинаний новое заклинание Высшей магии или заклинание Некромантов. Добавить можно лишь то заклинание, которое они способны читать.\n\nНекромант может выбрать Искусство своей традиции из приведённого здесь списка. Дальнейшие Искусства осваиваются с ростом уровня персонажа, как указано в таблицах ниже. Единожды выбранное Искусство сменить нельзя."},{"n":"1.5.14.1","l":4,"te":"Necromancer Arts","tr":"Искусства Некроманта","en":"Necromancer Effort is calculated as usual, with each PC’s maximum being equal to one plus their Magic skill level plus the better of their Intelligence or Charisma modifiers. Partial Necromancers have a score one point lower than this, albeit not less than one.\n\n**Bonetalker:** You can see and communicate with any undead creature, regardless of a shared language or the creature’s natural state of invisibility. By Committing Effort for the scene you can sense the surface thoughts of any visible undead, including an impression of any commands or behavior it has been ordered to carry out. Unintelligent undead will not attack you or your companions unless specifically compelled to do so by a command or a master. Even intelligent undead will generally pause at least for an initial parley before attacking.\n\n**Cold Flesh:** You no longer require sleep and feel pain only in an abstract sense. You can suffer no more than 2 points of damage from any given instance of Shock and you have a natural Armor Class equal to 12 plus half your level, rounded down.\n\n**Consume Life Energy:** By making a Punch attack or using a melee weapon you have spent at least an hour properly consecrating, you can absorb a portion of the damage you inflict on others as healing to yourself. For each successful attack you make with such implements, you heal 1d6 damage, up to a maximum of the damage done by the attack. You cannot drain more life than the target has remaining hit points.\n\n**False Death:** Commit Effort as an Instant action; while it remains Committed you appear dead to all mundane examination. You lose your Main Actions while “dead”, but can move and perceive normally and do not need to eat, drink, breathe, or perform other bodily functions. Poisons and diseases do not progress in you while you are “dead”. You can maintain this state of death for up to one day per level before needing at least an hour to recover.\n\n**Gravesight:** Commit Effort as an On Turn action; while it remains Committed, you can see the life energies of living creatures around you as various glowing patterns, regardless of the mundane illumination available. You can perceive sicknesses, poisons, and other\n\nphysical qualities on sight. As a side effect of this ability, you can see normally even in perfect blackness.\n\n**Keeper of the Gate:** At your discretion, creatures within twenty feet of you per character level that are Mortally Wounded will die instantly and cannot be revived by magic or medicine. Conversely, you can Commit Effort for the day to automatically stabilize any or all within that range, increasing their System Strain by 1 point. This benefit cannot aid creatures that have been dismembered, shredded, or otherwise suffered unsurvivable injuries.\n\n**Life Bridge:** You can transfer life force between willing or helpless participants. Commit Effort for the day; for the rest of the scene, you can shift hit points from one willing or helpless target no smaller than a dog to another as a Main Action, provided you are touching both. You can shift enough hit points to Mortally Wound a donor, but you can’t give more to the recipient than would refresh their maximum allowed hit points.\n\n**Master of Bones:** Undead must roll twice to save versus your abilities or spells and take the worse roll. You may Commit Effort for the scene as an Instant action to negate any single attack, magical power or spell an undead uses against you. Undead with more than twice as many hit dice as you have levels cannot be foiled this way.\n\n**Red Harvest:** You are empowered by death. As an Instant action, whenever an intelligent living creature with at least one hit die perishes within fifty feet of you, Commit Effort for the day to either heal 1d6 plus your level in lost hit points or gain a +4 bonus on your next hit roll this scene. This art cannot be stacked, and it can be used only once per round.\n\n**Unaging:** You no longer naturally age, and will remain perfectly hale and vigorous up to your species’ natural maximum age plus 20% per character level, after which you will collapse into dust and decay. Immortality beyond this point is possible, but generally requires consistent supplies of life energy, occult materials, or other difficult-to-acquire or morally questionable materials. You also become immune to poisons and diseases.\n\n**Uncanny Ichor:** Your blood is not like the blood of normal beings. Predators find it nauseating and will not bite you unless provoked. Unintelligent predators will not consider you edible. This ichor is reluctant to leave your body, and stabbing or puncture injuries can Mortally Wound you but cannot result in your death unless you are entirely pincushioned by your foes or suffer catastrophic physical damage.\n\n**Unliving Persistence:** Commit Effort for the day as an On Turn action to automatically stabilize when Mortally Wounded. You may use this ability to benefit others if you are able to touch them. This ability cannot save a subject that has experienced dismemberment or other extremely final deaths.\n\n**Full Necromancer**\n| Level | Hit Dice | Bonus Attack | Focus Picks |\n|---|---|---|---|\n| 1 | 1d6-1 | +0 | 1 Any |\n| 2 | 2d6-2 | +0 | +1 Any |\n| 3 | 3d6-3 | +0 |  |\n| 4 | 4d6-4 | +0 |  |\n| 5 | 5d6-5 | +1 | +1 Any |\n| 6 | 6d6-6 | +1 |  |\n| 7 | 7d6-7 | +1 | +1 Any |\n| 8 | 8d6-8 | +1 |  |\n| 9 | 9d6-9 | +1 |  |\n| 10 | 10d6-10 | +2 | +1 Any |\n\n**Full Necromancer Arts and Spells**\n| Level | Max Level | Cast Spells | Pre- pared Spells | Arts Gained |\n|---|---|---|---|---|\n| 1 | 1 | 1 | 3 | Any Two |\n| 2 | 1 | 1 | 3 | Any One |\n| 3 | 2 | 2 | 4 |  |\n| 4 | 2 | 2 | 5 | Any One |\n| 5 | 3 | 3 | 6 |  |\n| 6 | 3 | 3 | 7 | Any One |\n| 7 | 4 | 4 | 8 |  |\n| 8 | 4 | 4 | 9 | Any One |\n| 9 | 5 | 5 | 10 |  |\n| 10 | 5 | 6 | 12 | Any One |\n\n**Partial Necromancer Arts and Spells**\n| Level | Max Level | Cast Spells | Pre- pared Spells | Arts Gained |\n|---|---|---|---|---|\n| 1 | 1 | 1 | 2 | Any One |\n| 2 | 1 | 1 | 3 | Any One |\n| 3 | 1 | 1 | 3 | Any One |\n| 4 | 1 | 2 | 4 |  |\n| 5 | 2 | 2 | 5 |  |\n| 6 | 2 | 3 | 6 | Any One |\n| 7 | 2 | 3 | 7 |  |\n| 8 | 2 | 3 | 7 |  |\n| 9 | 3 | 4 | 8 | Any One |\n| 10 | 3 | 4 | 9 |  |\n\n**Partial Expert/Necromancer**\n| Level | Hit Dice | Bonus Attack | Focus Picks |\n|---|---|---|---|\n| 1 | 1d6 | +0 | 1 Expert +1 Any |\n| 2 | 2d6 | +1 | +1 Any |\n| 3 | 3d6 | +1 |  |\n| 4 | 4d6 | +2 |  |\n| 5 | 5d6 | +2 | +1 Any |\n| 6 | 6d6 | +3 |  |\n| 7 | 7d6 | +3 | +1 Any |\n| 8 | 8d6 | +4 |  |\n| 9 | 9d6 | +4 |  |\n| 10 | 10d6 | +5 | +1 Any |\n\n**Partial Other Mage/Necromancer**\n| Level | Hit Dice | Bonus Attack | Focus Picks |\n|---|---|---|---|\n| 1 | 1d6-1 | +0 | 1 Any |\n| 2 | 2d6-2 | +0 | +1 Any |\n| 3 | 3d6-3 | +0 |  |\n| 4 | 4d6-4 | +0 |  |\n| 5 | 5d6-5 | +1 | +1 Any |\n| 6 | 6d6-6 | +1 |  |\n| 7 | 7d6-7 | +1 | +1 Any |\n| 8 | 8d6-8 | +1 |  |\n| 9 | 9d6-9 | +1 |  |\n| 10 | 10d6-10 | +2 | +1 Any |\n\n**Partial Warrior/Necromancer**\n| Level | Hit Dice | Bonus Attack | Focus Picks |\n|---|---|---|---|\n| 1 | 1d6+2 | +1 | 1 Warrior +1 Any |\n| 2 | 2d6+4 | +2 | +1 Any |\n| 3 | 3d6+6 | +2 |  |\n| 4 | 4d6+8 | +3 |  |\n| 5 | 5d6+10 | +4 | +1 Any |\n| 6 | 6d6+12 | +5 |  |\n| 7 | 7d6+14 | +5 | +1 Any |\n| 8 | 8d6+16 | +6 |  |\n| 9 | 9d6+18 | +6 |  |\n| 10 | 10d6+20 | +7 | +1 Any |","ru":"Усилие Некроманта считается как обычно: максимум каждого ПИ равен единице плюс уровень навыка Магия плюс лучший из модификаторов Интеллекта или Харизмы. У частичных Некромантов показатель на пункт ниже, но не меньше единицы.\n\n**Взор могил:** Задействуй Усилие Действием в свой ход; пока оно задействовано, ты видишь жизненные энергии живых существ вокруг как разнообразные светящиеся узоры, каково бы ни было обычное освещение. Ты с одного взгляда распознаёшь болезни, яды и другие телесные свойства. Побочный эффект этой способности: ты видишь как обычно даже в непроглядной тьме.\n\n**Жуткий ихор:** Твоя кровь не похожа на кровь обычных существ. Хищников от неё мутит, и кусать тебя без провокации они не станут. Неразумные хищники вовсе не считают тебя съедобным. Этот ихор неохотно покидает тело: колотые и проникающие раны могут смертельно ранить тебя, но не могут убить — разве что враги истыкают тебя, как подушечку для булавок, или ты получишь катастрофические телесные разрушения.\n\n**Костослов:** Ты видишь любую нежить и можешь с ней объясняться — неважно, есть ли у вас общий язык и не невидима ли она по своей природе. Задействовав Усилие до конца сцены, ты можешь ощущать поверхностные мысли любой видимой нежити, включая впечатление о полученных ею приказах и предписанном ей поведении. Неразумная нежить не нападает на тебя и твоих спутников, если её прямо не понуждает к этому приказ или хозяин. Даже разумная нежить перед нападением обычно помедлит хотя бы ради первых переговоров.\n\n**Красная жатва:** Тебя питает смерть. Когда разумное живое существо хотя бы с одной костью здоровья погибает в пределах пятидесяти футов от тебя, ты можешь Мгновенным действием задействовать Усилие до конца дня, чтобы либо исцелить 1d6 плюс свой уровень потерянных пунктов здоровья, либо получить +4 к своему следующему броску атаки в этой сцене. Это Искусство не складывается само с собой и применяется не чаще раза в раунд.\n\n**Ложная смерть:** Задействуй Усилие Мгновенным действием; пока оно задействовано, любой обычный осмотр находит тебя мёртвым. Будучи «мёртвым», ты теряешь свои Основные действия, но двигаешься и воспринимаешь мир как обычно и не нуждаешься в еде, питье, дыхании и прочих отправлениях тела. Яды и болезни, пока ты «мёртв», в тебе не развиваются. Ты можешь держаться в этом состоянии смерти до одного дня за уровень, после чего тебе нужен хотя бы час на восстановление.\n\n**Мост жизни:** Ты можешь переносить жизненную силу между согласными или беспомощными участниками. Задействуй Усилие до конца дня; до конца сцены ты можешь Основным действием перемещать пункты здоровья от одной согласной или беспомощной цели не мельче собаки к другой, если касаешься обеих. Донора можно выкачать вплоть до смертельного ранения, но получателю нельзя дать больше, чем восполнит его допустимый максимум пунктов здоровья.\n\n**Нестареющий:** Ты больше
