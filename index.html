k. You can do this only once per scene.\n**Elite Ties:** You have ties with figures of societal importance. You can get audiences with them with minimal effort. Once per game session, get a favor from them that would not particularly inconvenience them to grant.\n**Erudite:** You are uncommonly learned. Once per day, reroll a failed skill check related to intellectual pursuits or things a scholar would know about.\n**Folk-Friend:** Commoners and other lower-class natives consider you a useful healer and helper. Once per day, get a modest favor from a commoner who doesn’t hate you in exchange for a blessing\nor bit of advice.\n**Healer:** You are a trained and capable healer. Gain a +1 on all Heal skill checks; once per day, as an On Turn action, automatically succeed at a skill check to stabilize a Mortally Wounded subject.\n**Holy Sanctity:** You are honored and respected by most in this region. Gain a +1 bonus on social skill checks with locals who are not naturally opposed to your religion or social institution.\n**Personal Impunity:** You bear signs of sanctity, and physically harming you is considered taboo in this region. Only the most vicious or desperate humans will initiate violence against you, though any will fight if you attack them. Hostile groups will hesitate to attack your companions unless provoked.\n**Skilled:** Gain three skill points to spend on any non-combat skills, up to the maximum skill level allowed by your character level. This art may be taken more than once.\n##### Divination Arts\n**Compel Truth:** The diviner compels a person to drink a particular brew, participate in a specific ritual, or otherwise undergo a scenelong ordeal. Afterwards, the diviner may ask the target a single question and the GM secretly rolls a Cha/Magic skill check against a difficulty of the target’s Morale+1, or level+6 for PCs. On a success, the subject must answer the question truthfully and fully. On a failure, they may give any answer they wish. The same or substantially same question may not be asked twice with this art.\n**Deliver Oracle:** A petitioner asks about the outcome of a particular course of action. The diviner then spends a day in various rituals, seeking an oracular answer. At the end, the GM makes a secret Wis/ Magic skill check. If the skill check beats difficulty 8, an oracular sentence with some truth in it is produced. If the skill check beats difficulty 12, a direct and obvious oracle is produced. If the skill check is 7 or less, a hopelessly ambiguous oracle is produced, and if the dice roll a natural 2 an intentionally misleading oracle is delivered. Oracles are usually delivered as metaphors, poetry, or visions. The GM should ensure that some element of a true oracle actually does come to pass.\n**Find Object:** The diviner spends a scene performing a ritual to locate a particular animal, object or type of substance known to them, be it gold, water, or a specific stolen cow. People cannot be found with this art. The GM makes a secret Wis/Magic skill check against a difficulty of 8 to 11, depending on how close the nearest suitable object is; something in the same village is 8, something a mile or more away is\n11, and something more than five miles away is undetectable. If the check is successful, the diviner gets an impression of the direction the object is in. On a failure, roll 1d12 and use it as a clock face to give a random direction. This art can be used once per day.\n**Read Omens:** A petitioner proposes a course of action to the PC. After a scene-long ritual involving at least 10 sp worth of livestock or sacrificial material, the GM makes a secret Wis/Magic skill check against difficulty 10. On a success, the PC gets an impression of whether the course of action will lead to success or failure, as the GM thinks most likely. On a failure, the GM gives a random result. Multiplying the ritual costs by 10 adds +1 to the skill check, thus, a sacrifice of 1,000 sp worth of livestock gets a +2 on the check. The same course of action cannot be divined more than once a month.\n##### Curses and Blessings\nThe bringing of fortune or ill fate is not a trivial thing. A given creature can be cursed or blessed by one of these arts only once a day.\n**Auspicious Undertaking:** As a Main Action, bless a particular plan or undertaking currently sought by the target. During the plan’s execution or while seeking the desired end, the blessed subject can reroll one failed skill check or one missed hit roll. The blessing lasts until it is used, the plan is finished, or one day per caster level has passed. Only one plan can be blessed at a time.\n**Evil Eye:** This art improves your curse and blessing arts. You can now use these arts as an Instant action, albeit still only one such art per round, and you need do no more than look at the target rather than vocalizing any particular curse or blessing.\n**Ill Fate:** As a Main Action, curse a visible target. You may specify a particular kind of undertaking or apply the curse to anything they may do. The next pertinent skill check they make is made at a -1 penalty. If their raw die roll is equal or less than the PC’s Magic skill plus one their effort goes disastrously wrong. The curse lasts until the next relevant skill check.\n**Luck Blessing:** As a Main Action, confer a blessing on a visible target. The next skill check they make that day will have a +1 bonus. Only one luck blessing can be in place for a creature at a time.\n**War Curse:** As a Main Action, curse a visible enemy. They suffer a -2 penalty to hit rolls, damage rolls, and Shock damage for the rest of the scene. If they miss an attack with a raw to-hit die roll less than the Wise’s Magic skill, they accidentally hurt themselves for normal damage. Only one war curse can be applied at a time.","ru":"##### Общие Искусства\n\n**Благоговейный трепет:** Такие, как ты, внушают страх и недоверие. Получи бонус +1 ко всем проверкам навыков, связанным с запугиванием и угрозами. В бою ты можешь потратить Основное действие на проклятия врагам; все, кто их слышит, получают штраф -1 к своей следующей проверке боевого духа. Так можно делать лишь раз за сцену.\n\n**Книжник:** Ты необычайно учён. Раз в день перебрасывай провальную проверку навыка, связанную с умственными занятиями или тем, в чём сведущ учёный.\n\n**Личная неприкосновенность:** На тебе знаки святости, и причинять тебе телесный вред в этих краях считается табу. Лишь самые злобные или отчаявшиеся люди первыми поднимут на тебя руку, хотя любой станет драться, если нападёшь ты сам. Враждебные группы не решатся напасть на твоих спутников, если их не спровоцировать.\n\n**Свой человек:** Простолюдины и прочий люд попроще считают тебя полезным лекарем и помощником. Раз в день получи скромную услугу от простолюдина, который не питает к тебе ненависти, в обмен на благословение или дельный совет.\n\n**Связи в верхах:** Ты связан с людьми, значимыми в обществе, и без особого труда добиваешься у них аудиенции. Раз за игровую сессию получи от них услугу, оказать которую им не слишком обременительно.\n\n**Святость сана:** В этих краях тебя почитает и уважает большинство. Получи бонус +1 к проверкам социальных навыков с местными жителями, у которых нет природной вражды к твоей религии или общественному институту.\n\n**Умелый:** Получи три пункта навыков и потрать их на любые небоевые навыки, не превышая максимального уровня навыка, разрешённого твоим уровнем персонажа. Это Искусство можно брать больше одного раза.\n\n**Целитель:** Ты обученный и умелый лекарь. Получи +1 ко всем проверкам навыка Медицина; раз в день Действием в свой ход автоматически преуспей в проверке навыка на стабилизацию смертельно раненного.\n\n##### Искусства гадания\n\n**Изречь пророчество:** Проситель спрашивает об исходе задуманного дела. Гадатель проводит день в разнообразных обрядах, ища пророческий ответ. В конце Мастер втайне делает проверку Мдр/Магия. Если проверка преодолевает сложность 8, рождается пророческая фраза, в которой есть доля истины. Если проверка преодолевает сложность 12, пророчество выходит прямым и ясным. Если результат 7 или меньше, пророчество получается безнадёжно двусмысленным, а если на костях выпала чистая 2, изрекается намеренно ложное пророчество. Пророчества обычно облекаются в метафоры, стихи или видения. Мастеру следует позаботиться, чтобы какая-то часть истинного пророчества действительно сбылась.\n\n**Отыскать пропажу:** Гадатель тратит сцену на обряд поиска известного ему животного, предмета или рода вещества — будь то золото, вода или конкретная украденная корова. Людей этим Искусством искать нельзя. Мастер втайне делает проверку Мдр/Магия против сложности от 8 до 11, в зависимости от того, насколько близко ближайший подходящий объект: что-то в той же деревне — 8, что-то в миле и дальше — 11, а что-то дальше пяти миль обнаружить нельзя. При успехе гадатель ощущает направление на объект. При провале брось 1d12 и определи случайное направление по циферблату часов. Это Искусство можно применять раз в день.\n\n**Принудить к правде:** Гадатель заставляет человека выпить особый отвар, пройти определённый обряд или иначе выдержать испытание длиной в сцену. После этого гадатель может задать цели один вопрос, а Мастер втайне бросает проверку Хар/Магия против сложности, равной боевому духу цели +1, либо уровню +6 для ПИ. При успехе испытуемый обязан ответить на вопрос правдиво и полно. При провале он может дать любой ответ, какой пожелает. Один и тот же — или по сути тот же — вопрос нельзя задать этим Искусством дважды.\n\n**Читать знамения:** Проситель излагает ПИ задуманное дело. После обряда длиной в сцену, требующего скота или жертвенных материалов не меньше чем на 10 см, Мастер втайне делает проверку Мдр/Магия против сложности 10. При успехе ПИ чувствует, приведёт ли замысел к успеху или к провалу — как это кажется наиболее вероятным Мастеру. При провале Мастер выдаёт случайный ответ. Умножение расходов на обряд в 10 раз даёт +1 к проверке: так, жертва скотом на 1000 см даёт +2 к проверке. Об одном и том же замысле нельзя гадать чаще раза в месяц.\n\n##### Порчи и благословения\n\nДаровать удачу или навести злую судьбу — дело нешуточное. Одно и то же существо можно проклясть или благословить этими Искусствами лишь раз в день.\n\n**Благоприятное начинание:** Основным действием благослови конкретный план или начинание, к которому цель стремится сейчас. Во время исполнения плана или на пути к желанной цели благословлённый может перебросить одну провальную проверку навыка или один промахнувшийся бросок атаки. Благословение держится, пока не будет использовано, пока план не завершится или пока не пройдёт по одному дню за уровень колдующего. Одновременно может быть благословлён только один план.\n\n**Благословение удачи:** Основным действием даруй благословение видимой цели. Её следующая проверка навыка в этот день получит бонус +1. На одном существе может действовать лишь одно благословение удачи за раз.\n\n**Дурной глаз:** Это Искусство усиливает твои порчи и благословения. Теперь ты можешь применять эти Искусства Мгновенным действием — хотя по-прежнему не больше одного такого Искусства за раунд — и тебе достаточно лишь взглянуть на цель, не произнося вслух никакого проклятия или благословения.\n\n**Злая доля:** Основным действием наведи порчу на видимую цель. Можно назвать определённый род начинаний или распространить порчу на всё, что цель будет делать. Следующая подходящая проверка навыка, которую она делает, идёт со штрафом -1. Если чистый бросок костей окажется равен навыку Магия этого ПИ плюс один или меньше, затея кончается сокрушительным провалом. Порча держится до следующей подходящей проверки навыка.\n\n**Ратная порча:** Основным действием прокляни видимого врага. До конца сцены он получает штраф -2 к броскам атаки, броскам урона и урону Шока. Если он промахивается атакой, а чистый бросок атаки меньше навыка Магия Ведуна, он случайно ранит сам себя, нанося себе обычный урон. Одновременно может действовать лишь одна ратная порча."},{"n":"1.6.0","l":2,"te":"Foci","tr":"Фокусы","en":"Foci are special talents that a PC can possess. They aren’t as powerful as Edges, but a PC will develop more of them over time. Any PC can select any Focus, barring a few with specific requirements; they do not need to fit the class they selected. So long as the player can explain how or why they acquired the talent they can have it.\nFoci usually come in two levels, though some have only one. The first time a Focus is chosen, the benefits of the first level are gained. The second time it’s chosen, the benefits of the second level are added to those of the first.\nA new character may choose one Focus of any kind. Warriors and Partial Warriors may select another combat-related Focus, and Experts and Partial Experts may select another non-combat-related Focus. If a Focus is ambiguous, the GM decides whether or not it falls into a particular category for the PC.","ru":"Фокусы — это особые таланты, которыми может обладать ПИ. Они не так сильны, как Козыри, но со временем ПИ наберёт их больше. Любой ПИ может выбрать любой Фокус, за вычетом немногих с особыми требованиями; подходить выбранному классу Фокусы не обязаны. Пока игрок может объяснить, как и почему персонаж приобрёл талант, он вправе его взять.\n\nОбычно у Фокуса два уровня, хотя у некоторых только один. Когда Фокус выбран впервые, ты получаешь преимущества первого уровня. При втором выборе преимущества второго уровня добавляются к преимуществам первого.\n\nНовый персонаж может выбрать один Фокус любого рода. Воины и частичные Воины могут выбрать ещё один боевой Фокус, а Эксперты и частичные Эксперты — ещё один небоевой. Если Фокус двусмыслен, Мастер решает, попадает ли он для этого ПИ в нужную категорию."},{"n":"1.6.1","l":3,"te":"Focus List","tr":"Список Фокусов","en":"The Foci below are common to most fantasy settings. Others might be added to support particular campaigns.\n#### Alert\nYou are keenly aware of your surroundings and virtually impossible to take unaware.\n**Level 1:** Gain Notice as a bonus skill. You cannot be surprised, nor can others use the Execution Attack option on you. If the GM rolls initiative by sides, you can add a +1 bonus to your side’s initiative roll, though multiple Alert PCs don’t stack this bonus. If you roll initiative individually, you can roll it twice and take the better result.\n**Level 2:** You always act first in a combat round unless someone else involved is also this Alert.\n#### Armored Magic\nUsable only by Mage heroes who would otherwise be prevented from casting spells or using arts while armored, this Focus reflects special training in channeling magic through the hindering materials of conventional armor.\n**Level 1:** You can cast spells or use arts while wearing armor that has an Encumbrance value of no more than two. You can use a shield while casting, provided your other hand is empty for gesturing.\n**Level 2:** You can cast spells while wearing armor of any Encumbrance. You’ve also learned to cast spells while both your hands are full, though not bound.\n#### Armsmaster\nYou have an unusual competence with thrown weapons and melee attacks. This Focus’ benefits do not apply to unarmed attacks or nonthrown projectile weapons. This Focus’ bonuses also don’t stack with Deadeye or other Foci that add a skill’s level to your damage or Shock.\n**Level 1:** Gain Stab as a bonus skill. You can Ready a Stowed melee or thrown weapon as an Instant action. You may add your Stab skill level to a melee or thrown weapon’s damage roll or Shock damage, assuming it has any to begin with.\n**Level 2:** The Shock from your melee attacks always treats the target as if they have AC 10. Gain a +1 bonus to hit with all thrown or melee attacks.\n#### Artisan\nYou have remarkable gifts as a crafter and can often improvise techniques even in fields unrelated to your usual background. You are able to create mods for equipment even if you are not an Expert.\n**Level 1:** Gain Craft as a bonus skill. Your Craft skill is treated as one level higher, up to a maximum of 5, for purposes of crafting and maintaining mods. Mods you build require one fewer unit of arcane salvage, down to a minimum of one. Your Craft skill is applicable to any normal crafting profession’s work, allowing you to fashion their wares without penalty.\n**Level 2:** The first mod you add to an item requires no Maintenance and only half the silver piece cost usually required. This benefit is in addition to the benefits of installing a mod in masterwork gear you build. You automatically succeed at any attempt to build masterwork gear, and once per month you can reduce a created mod’s salvage cost by one further unit, down to a minimum of zero.\n#### Assassin\nYou are practiced at sudden murder, and have certain advantages in carrying out an Execution Attack.\n**Level 1:** Gain Sneak as a bonus skill. You can conceal an object no larger than a knife from anything less invasive than a strip search. You can draw or produce this object as an On Turn action, and your point-blank thrown or melee attacks made during a surprise round with it cannot miss the target.\n**Level 2:** You can take a Move action on the same round as you make an Execution Attack, closing rapidly with a target before you attack. You may split this Move action when making an Execution Attack, taking part of it before you murder your target and part of it afterwards. This movement happens too quickly to alert a victim or to be hindered by bodyguards.\n#### Authority\nYou have an uncanny kind of charisma about you, one that makes others instinctively follow your instructions and further your causes. At level 1, this is a knack of charm and personal magnetism, while level 2 might suggest latent magical powers or an ancient bloodline of sorcerous rule. Where this Focus refers to followers, it means NPCs who have voluntarily chosen to be in your service. PCs never count as followers.\n**Level 1:** Gain Lead as a bonus skill. Once per day, you can make a request from an NPC who is not openly hostile to you, rolling a Cha/Lead skill check at a difficulty of the NPC’s Morale score. If you succeed, they will comply with the request, provided it is not significantly harmful or extremely uncharacteristic.\n**Level 2:** Those who follow you are fired with confidence. Any NPC being directly led by you gains a Morale and hit roll bonus equal to your Lead skill and a +1 bonus on all skill checks. Your followers and henchmen will not act against your interests unless under extreme pressure.\n#### Close Combatant\nYou’ve had all too much practice at close-in fighting and desperate struggles with drawn blades. You’re extremely skilled at avoiding injury in melee combat, and at level 2 you can dodge through a melee scrum without fear of being knifed in passing.\n**Level 1:** Gain any combat skill as a bonus skill. You can use knifesized thrown weapons in melee without suffering penalties for the proximity of melee attackers. You ignore Shock damage from melee assailants, even if you’re unarmored at the time, but invoking this benefit disrupts any spellcasting you might do that round due to the need for violently active evasion.\n**Level 2:** The Shock damage from your melee attacks treats all targets as if they were AC 10. The Fighting Withdrawal combat action is treated as an On Turn action for you and can be performed freely.\n#### Connected\nYou’re remarkably gifted at making friends and forging ties with the people around you. Wherever you go, you always seem to know somebody useful to your ends.\n**Level 1:** Gain Connect as a bonus skill. If you’ve spent at least a week in a not-entirely-hostile location, you’ll have built a web of contacts willing to do favors for you that are no more than mildly illegal. You can call on one favor per game day and the GM decides how far they’ll go for you.\n**Level 2:** Once per game session, if it’s not entirely implausible, you meet someone you know who is willing to do modest favors for you. You can decide when and where you want to meet this person, but the GM decides who they are and what they can do for you.\n#### Cultured\nThrough wide travel, careful observation, or extensive study, you’ve obtained a wide experience of the cultures of your region and an ability to navigate their customs, laws, and languages. You know what to do and say to impress others with the reasonableness of your wishes.\n**Level 1:** Gain Connect as a bonus skill. You can fluently speak all the common languages of your native region and convey at least basic information in the uncommon or esoteric ones. You can learn a new language with only a week’s practice with a native speaker. Once per game day, your polished ways automatically gain a minor favor from an NPC that would not put them to significant expense or risk, assuming the NPC isn’t hostile to you.\n**Level 2:** Once per game session, reroll a failed social skill check as you use your cultural knowledge to push your interlocutor toward the desired result.\n#### Die Hard\nYou are surprisingly hard to kill. You can survive injuries or bear up under stresses that would incapacitate a less determined hero.\n**Level 1:** You gain an extra 2 maximum hit points per level. This bonus applies retroactively if you take this Focus after first level. You automatically stabilize if Mortally Wounded, provided you have not been incinerated, dismembered, or otherwise torn apart.\n**Level 2:** The first time each day that you are reduced to zero hit points by an injury, you instead survive with one hit point remaining. This ability can’t save you from large-scale, instantly-lethal trauma.\n#### Deadeye\nYou have a gift with ranged weapons. While this talent most commonly applies to bows, it is also applicable to thrown weapons or other ranged weapons that can be used with the Shoot skill. For thrown weapons, you can’t use the benefits of the Armsmaster Focus at the same time as Deadeye.\n**Level 1:** Gain Shoot as a bonus skill. You can Ready a Stowed ranged weapon as an Instant action. You may use a bow or two-handed ranged weapon even when an enemy is within melee range, albeit at a -4 hit penalty. You may add your Shoot skill level to a ranged weapon’s damage roll.\n**Level 2:** You can reload crossbows or other slow-loading weapons as an On Turn action, provided they don’t take more than a round to reload. You can use ranged weapons of any size in melee without penalty. Once per scene, as an On Turn action when target shooting at an inanimate, non-creature target, you automatically hit unless you roll a 2 on your Shoot skill check or the shot is physically impossible.\n#### Dealmaker\nYou have an uncanny ability to sniff out traders and find good deals, licit or otherwise. Even those who might not normally be disposed to bargain with you can sometimes be persuaded to pause and negotiate, if you have something they want.\n**Level 1:** Gain Trade as a bonus skill. With a half hour of effort you can find a buyer or seller for any good or service that can be traded in the community, legal or otherwise. Finding a marginally possible service, like an assassin willing and able to target a king, or some specific precious ancient artifact, may require an adventure if the GM allows it at all.\n**Level 2:** Once per session, target a sentient who is not just then trying to kill you or your allies and make a request of it that it can comprehend. If it’s at all plausible for it to make such terms, it will do so for a price or favor it thinks you can grant, though the price for significant favors might be dear.\n#### Developed Attribute\nYour hero has a remarkable degree of development to one or more of their attributes. This may be derived from an eldritch bloodline, native brilliance, or sheer, stubborn determination. This Focus cannot be taken by heroes with the Mage or Partial Mage classes.\n**Level 1:** Choose an attribute; its modifier is increased by +1, up to a maximum of +3. The actual score does not change, but the modifier increases, and may increase again if later advancement improves the attribute enough. You can choose this Focus more than once to improve different attributes.\n#### Diplomatic Grace\nYour skill at personal negotiations is enormous and uncanny. Some might even think it supernatural in nature.\n**Level 1:** Gain Convince as a bonus skill. You speak all the languages common to your region of the world and can learn new ones to a workable level in a week, becoming fluent in a month. Reroll 1s on any skill check dice related to negotiation or diplomacy.\n**Level 2:** Once per day, silently consecrate a bargain; the target must make a Mental save to break the deal unless their life or something they love as much is imperiled by it. Most NPCs won’t even try to break it. The deal must be for something specific and time-limited, and not an open-ended bargain.\n#### Gifted Chirurgeon\nYou have an unusual gift for saving Mortally Wounded allies and quickening the natural recovery of the wounded in your care.\n**Level 1:** Gain Heal as a bonus skill. You may attempt to stabilize one Mortally Wounded adjacent person per round as an On Turn action. When rolling Heal skill checks, roll 3d6 and drop the lowest die. You heal twice as many hit points as usual when applying first aid after a battle.\n**Level 2:** Your curative gifts count as magical healing. You can heal 1d6+Heal skill in damage to an adjacent wounded ally as a Main Action, potentially reviving them without any lingering Frailty. Each such application of healing adds 1 System Strain to the target, and the gift cannot be used on targets already at their maximum System Strain.\n#### Henchkeeper\nYou have a distinct knack for picking up lost souls who willingly do your bidding. You might induce them with promises of money, power, excitement, sex, or some other prize that you may or may not eventually grant. A henchman obtained with this Focus will serve in loyal fashion until clearly betrayed or placed in unacceptable danger. Henchmen are not “important” people in their society, and are usually marginal sorts, outcasts, the desperate, or other persons with few options.\nYou can use more conventional pay or inducements to acquire additional henchmen, but these extra hirelings are no more loyal or competent than your pay and treatment can purchase.\n**Level 1:** Gain Lead as a bonus skill. You can acquire henchmen within 24 hours of arriving in a community, assuming anyone is suitable hench material. These henchmen will not fight except to save their own lives, but will escort you on adventures and risk great danger to help you. Most henchmen will have the combat statistics of a normal adult from their culture. You can have one henchmen at a time for every three character levels you have, rounded up. You can release henchmen with no hard feelings at any plausible time and pick them back up later should you be without a current henchman.\n**Level 2:** Your henchmen are remarkably loyal and determined, and will fight for you against anything but clearly overwhelming odds. Whether through natural competence or their devotion to you, they’re treated as 2 HD combatants from their culture. You can make faithful henchmen out of skilled and highly-capable NPCs, but this requires that you actually have done them some favor or help that would reasonably earn such fierce loyalty.\n#### Impervious Defense\nWhether through uncanny reflexes, remarkable luck, supernatural heritage, or magical talent, you have natural defenses equivalent to high-quality armor. The benefits of this Focus don’t stack with armor, though Dexterity or shield modifiers apply.\n**Level 1:** You have an innate Armor Class of 15 plus half your character level, rounded up.\n**Level 2:** Once per day, as an Instant action, you can shrug off any single weapon attack or physical trauma inflicted by a foe. Environmental damage, falling damage, or other harm that couldn’t be forfended by strong armor cannot be resisted this way.\n#### Impostor\nYou are exceedingly skilled at presenting yourself as something you are not, including disguises, voice mimicry, and lightning-fast wardrobe changes. Some impostors rely on the acting skills of Perform, while others lean more to the nefarious tricks of Sneak.\n**Level 1:** Gain Perform or Sneak as a bonus skill. Once per scene, reroll any failed skill check or saving throw related to maintaining an imposture or disguise. Create one false identity of no great social importance; you can flawlessly pretend to be that person, such that only extremely persuasive proof can connect you with it. You can change this identity with a week’s worth of effort in building a new one.\n**Level 2:** You can alter your clothing and armor such that a single Main Action lets you swap between any of three chosen appearances. In addition to your original false identity, you can establish a new false identity in each city or significant community you spend at least a day in.\n#### Lucky\nSome fund of remarkable luck has preserved your life at least once in the past, and continues to give you an edge in otherwise hopeless situations. This luck does not favor the already-blessed; this Focus can only be taken by a PC with at least one attribute modifier of -1 or less.\n**Level 1:** Once per week, a blow or effect that would otherwise have left you killed, mortally wounded, or rendered helpless somehow fails to connect or affect you. You make any rolls related to games of chance twice, taking the better roll.\n**Level 2:** Once per session, in a situation of need or peril, you can trust to your luck and roll 1d6. On a 2 or more, something fortunate will happen to further your goal, provide an escape from immediate peril, or otherwise give you an advantage you need, if not immediate victory. On a 1, the situation will immediately grow much worse, as the GM sees fit.\n#### Nullifier\nSomething about your hero interferes with easy use of magic on them. It may be a strangely powerful birth blessing, a particular supernatural bloodline, or simple occult incompatibility. This Focus cannot be taken by Mages or Partial Mages.\n**Level 1:** You and all allies within twenty feet gain a +2 bonus to all saving throws against magical effects. As an On Turn action, you can feel the presence or use of magic within twenty feet of you, though you can’t discern details about it or the specific source. The first failed saving throw against a magical effect you suffer in a day is turned into a success.\n**Level 2:** Once per day, as an Instant action, you are simply not affected by an unwanted magical effect or supernatural monstrous ability, even if it wouldn’t normally allow a saving throw. Immunity to a persistent effect lasts for the rest of the scene.\n#### Poisoner\nYou are a skilled poisoner, capable of compounding toxins out of readily-available flora and minerals. It takes an hour to brew a poison, and you can keep as many doses fresh as you have levels. Blade venoms take a Main Action to apply and last for ten minutes or until a hit or Shock is inflicted, whichever comes first. Detecting poisoned food is a Wis/Notice skill check against 10, or 12 if the diner’s not a noble or otherwise normally wary of poison. One dose can poison up to a half-dozen diners.\n**Level 1:** Gain Heal as a bonus skill. Gain a reroll on any failed saving throw versus poison. Your toxins inflict 2d6 damage plus your level on a hit or Shock, with a Physical save for half. Your incapacitating or hallucinogenic toxins do the same, but those reduced to zero hit points are simply incapacitated for an hour.\n**Level 2:** You are immune to poison and can apply a universal antidote to any poisoned ally as a Main Action. Any attempt to detect or save against your poisons takes a penalty equal to your Heal skill. Your ingested poisons count as an Execution Attack against unsuspecting targets, with Heal used for the Physical saving throw penalty and 1d6 damage per level done on a success. Such poisons can be non-lethal at your discretion.\n#### Polymath\nYou have a passing acquaintance with a vast variety of practical skills and pastimes, and can make a modest attempt at almost any exercise of skill or artisanry. Note that the phantom skill levels granted by this Focus don’t stack with normal skill levels or give a skill purchase discount. Only Experts or Partial Experts can take this Focus.\n**Level 1:** Gain any one bonus skill. You treat all non-combat skills as if they were at least level-0 for purposes of skill checks, even if you lack them entirely.\n**Level 2:** You treat all non-combat skills as if they were at least level-1 for purposes of skill checks.\n#### Rider\nAnyone with any level of Ride skill can fight competently on horseback or keep their mount healthy. You have an almost supernatural bond with your steeds, however, and can push them beyond normal limits.\n**Level 1:** Gain Ride as a bonus skill. Your steeds all count as Morale 12 in battle, use your AC if it’s higher than theirs, and can travel 50% further in a day than normal for their kind. You can intuitively communicate with riding beasts, gaining as much information from it as its intellect can convey.\n**Level 2:** Once per scene, negate a successful attack against your steed as an Instant action. Once per scene, reroll any failed Ride skill check. You can telepathically send and receive simple warnings, thoughts, and commands to and from your steed so long as it’s within two hundred feet. You can so bond with one steed at a time, taking an hour to do so.\n#### Shocking Assault\nYou’re extremely dangerous to enemies around you. The ferocity of your melee attacks stresses and distracts enemies even when your blows don’t draw blood.\n**Level 1:** Gain Punch or Stab as a bonus skill. The Shock damage of your weapon treats all targets as if they were AC 10, assuming your weapon is capable of harming the target in the first place and the target is not immune to Shock.\n**Level 2:** In addition, you gain a +2 bonus to the Shock damage rating of all melee weapons and unarmed attacks that do Shock. As usual, regular hits never do less damage than this Shock would do on a miss.\n#### Sniper’s Eye\nYou are an expert at placing a thrown knife or arrow on an unsuspecting target. These special benefits only apply when making an Execution Attack with a bow, hurlant, or thrown weapon.\n**Level 1:** Gain Shoot as a bonus skill. When making a skill check for a ranged Execution Attack or target shooting, roll 3d6 and drop the lowest die.\n**Level 2:** You don’t miss ranged Execution Attacks. A target hit by one takes a -4 penalty on the Physical saving throw to avoid immediate mortal injury. Even if the save is successful, the target takes double the normal damage inflicted by the attack.\n#### Special Origin\nHeroes in this game are assumed to be human, or close enough as to make no real difference. PCs who want to belong to some more exotic species or demihuman kind can pick the origin Focus appropriate to their chosen species, such as those given in the bestiary chapter for different types of creatures.\nThe availability of these special origins will depend on the campaign and the GM’s permission. Even if elves and dwarves do exist in the campaign world, the GM is not obliged to let players use them as PCs if that choice doesn’t fit the tone or location being used.\nNote also that a PC who just wants to be different without asking for any special mechanical benefits does not need to buy any special Focus. If their particular demihuman or alien has no real advantages over a human, then they can just proclaim their nature as such, assuming the GM allows such beings in their campaign.\n#### Specialist\nYou are remarkably talented at a particular skill. Whether a marvelous cat burglar, a famed athlete, a brilliant scholar, or some other savant, your expertise is extremely reliable. You may take this Focus more than once for different skills.\n**Level 1:** Gain any skill as a bonus, except for Magic, Stab, Shoot, or Punch. Roll 3d6 and drop the lowest die for all skill checks in this skill.\n**Level 2:** Roll 4d6 and drop the two lowest dice for all skill checks in this skill.\n#### Spirit Familiar\nYou have a minor spirit, devil, construct, magical beast, or other creature as a devoted companion. While its abilities are limited, it is absolutely loyal to you.\n**Level 1:** Choose a form for your familiar no smaller than a cat nor larger than a human. It has the traits and abilities of an entity created by Calculation of the Evoked Servitor but may be summoned or dismissed as a Main Action, appearing within melee range of its owner. It cannot carry objects with it during its vanishment aside from the clothing natural to its shape. It has no need for food, water, or sleep. If killed, it vanishes and cannot be re-summoned for 24 hours. Once per day, it can refresh one point of Committed Effort for you.\n**Level 2:** Pick two benefits from the list below for your familiar. This level may be taken more than once, adding two additional options each time.\n- It has hit points equal to three times your level\n- It gains the ability to attack with a hit bonus equal to half your level, rounded up, doing 1d8 damage on a hit with no Shock\n- It gains a +1 skill check bonus and can apply it to a range of situations equivalent to one normal human background\n- It gains another shape of your choice which it can adopt or discard as an On Turn action\n- It can hover or fly at its usual movement rate\n- It can communicate freely with others in any language you know\n#### Trapmaster\nYou have uncommon expertise in handling traps and snares, both mundane ones and the magical perils sometimes found in dungeons or the lairs of sorcerers. You know how to improvise traps with materials you easily carry.\n**Level 1:** Gain Notice as a bonus skill. Once per scene, reroll any failed saving throw or skill check related to traps or snares. Given five minutes of work you can trap a portal, container, passageway, or other relatively narrow space with foot snares, caltrops, toxic needles, or other hazards. Non-lethal traps cause the first victim to trigger it to lose a round of actions while dangerous ones inflict 1d6 damage plus twice the character’s level, with an appropriate saving throw for half. Only one such improvised trap can be maintained at a time. More fearsome traps may be laid with congenial circumstances and the GM’s permission.\n**Level 2:** You know secrets for unraveling even magical traps or arcane hazards that would normally require a wizard to dispel them. Once per scene, your efforts count as an Extirpate Arcana spell against the trap or hazard, cast as if a Mage of twice your level, with any relevant skill check being Int/Notice or Dex/Notice. This ability can be used against any stationary magical effect that’s susceptible to being dispelled by Extirpate Arcana.\n#### Unarmed Combatant\nYour empty hands are more dangerous than swords in the grip of the less gifted. Your unarmed attacks are counted as melee weapons when it comes to binding up opponents wielding bows and similar ranged long arms, though you need at least one hand free to do so.\n**Level 1:** Gain Punch as a bonus skill. Your unarmed attacks become more dangerous as your Punch skill increases. At level-0, they do 1d6 damage. At level-1, they do 1d8 damage. At level-2 they do 1d10, level-3 does 1d12, and level-4 does 1d12+1. At Punch-1 or better, they have the Shock quality equal to your Punch skill against AC 15 or less.\n**Level 2:** Even on a miss with a Punch attack, you do an unmodified 1d6 damage, plus any Shock that the blow might inflict on the target.\n#### Unique Gift\nYour hero has some unusual ability or magical knack that can’t be adequately described by an existing Focus. This choice is a catchall meant to represent a special power that’s in some way worth a Focus pick.\nThe exact effect of the ability should be defined by the player and the GM together, working out some result that seems fair and reasonable. This will vary from table to table and from campaign to campaign; an innate ability to breathe water is little more than a novelty in a desert setting, while a campaign based on piracy in an endless archipelago might make it far more significant.\nAs with any power, the group should be willing to reconsider the gift if it turns out to be exceptionally weak in play or a stronger power than was anticipated.\n#### Valiant Defender\nYou are a bodyguard, shieldbearer, or other gifted defender of others, accustomed to the roil of bloody battle and desperate struggle. You have an exceptional ability to shield your allies from the attacks of those who would slay them.\n**Level 1:** Gain Stab or Punch as a bonus skill. Gain a +2 on all skill checks for the Screen Ally combat action. You can screen against one more attacker per round than your skill would normally allow. Once per round, you can Screen Ally against even intangible spells or magical attacks or bodily shield them from an area-effect explosion or magic. Such attempts require the usual successful opposing skill check, with the assailant using their Magic skill.\n**Level 2:** The first Screen Ally skill check you make in a round is always successful. Gain +2 AC while screening someone. You can screen against foes as large as ogres or oxen.\n#### Well Met\nYou have a striking ability to charm and pacify people and creatures you’ve just met. Once they get to know you, however, their opinions are more likely to be based on experience; this Focus works only once on a target.\n**Level 1:** Reaction rolls made by those the party meets are given a +1 bonus so long as you are present, whether or not you do the talking. Even hostile encountered beings will usually give the party a round to parley before attacking unless they’re in ambush or have a clear reason for immediate violence.\n**Level 2:** Once per game session, when a reaction roll is made, cause the subject to be as friendly and helpful to you and your party as it’s plausibly possible for them to be. It’s up to the GM to decide why the creature becomes so; it might be mistaken about your nature, or find you hilarious, or perhaps want a favor from you and your allies.\n#### Whirlwind Assault\nYou are a frenzy of bloody havoc in melee combat, and can hack down numerous lesser foes in close combat… assuming you survive being surrounded.\n**Level 1:** Gain Stab as a bonus skill. Once per scene, as an On Turn action, apply your Shock damage to all foes within melee range, assuming they’re susceptible to your Shock.\n**Level 2:** The first time you kill someone in a round with a normal attack, either with its rolled damage on a hit or with the Shock damage it inflicts, instantly gain a second attack on any target within range using any Ready weapon you have.\n#### Xenoblooded\nYou have been both blessed and cursed by some exotic supernatural or alien bloodline.\n**Level 1:** Choose one set of benefits from the list below to reflect your alien heritage. Other gifts may exist.\n- You are immune to heat damage and can breathe and see through smoke without hindrance.\n- You are water-adapted and can breathe water and see through it up to 120’ regardless of light. You swim at double your normal Move rate.\n- You were built to heavier or lighter gravity conditions; gain a +1 to either your Strength or Dexterity modifiers, to a maximum of +3, and a -1 penalty to the modifier of the other attribute.\n- You are nourished by invisible radiations and need neither eat, sleep, nor breathe. You can see clearly even in the absence of any light.","ru":"Фокусы ниже обычны для большинства фэнтезийных сеттингов. Для отдельных кампаний можно добавлять и другие.\n\n#### Бдительный\n\nТы остро чувствуешь всё вокруг, и застать тебя врасплох почти невозможно.\n\n**Уровень 1:** Получи Внимание как бонусный навык. Тебя нельзя застигнуть врасплох, и никто не может применить против тебя Казнящую атаку. Если Мастер бросает инициативу по сторонам, добавь +1 к броску инициативы своей стороны; несколько Бдительных ПИ этот бонус не складывают. Если инициатива бросается индивидуально, бросай её дважды и бери лучший результат.\n\n**Уровень 2:** Ты всегда действуешь в боевом раунде первым, если только кто-то из участников не столь же Бдителен.\n\n#### Ближний бой\n\nТебе слишком хорошо знакомы ближняя рубка и отчаянная возня на обнажённых клинках. Ты отлично умеешь избегать ран в ближнем бою, а на уровне 2 проскальзываешь сквозь свалку, не боясь получить нож мимоходом.\n\n**Уровень 1:** Получи любой боевой навык как бонусный. Ты можешь метать оружие размером с нож в ближнем бою без штрафов за близость атакующих врагов. Ты игнорируешь урон Шока от противников в ближнем бою, даже будучи без доспехов, но использование этого преимущества срывает любое твоё колдовство в этом раунде: слишком уж бурны твои уклонения.\n\n**Уровень 2:** Урон Шока твоих атак ближнего боя считает все цели как КЗщ 10. Боевой отход для тебя — Действие в свой ход и выполняется свободно.\n\n#### Везунчик\n\nНекий запас редкостной удачи уже спасал тебе жизнь и продолжает выручать в безнадёжных, казалось бы, положениях. Эта удача не жалует и без того благословенных: этот Фокус может взять только ПИ хотя бы с одним модификатором характеристики -1 или ниже.\n\n**Уровень 1:** Раз в неделю удар или эффект, который убил бы тебя, смертельно ранил или оставил беспомощным, каким-то образом не задевает тебя или на тебя не действует. Любые броски в азартных играх ты делаешь дважды и берёшь лучший.\n\n**Уровень 2:** Раз за сессию, оказавшись в нужде или опасности, доверься удаче и брось 1d6. На 2 и больше случается что-то удачное: оно продвигает твою цель, даёт выход из непосредственной опасности или иное нужное тебе преимущество, хотя и не обязательно немедленную победу. На 1 положение немедленно становится куда хуже — как сочтёт нужным Мастер.\n\n#### Верный глаз\n\nУ тебя дар к дальнобойному оружию. Чаще всего этот талант проявляется с луками, но он применим и к метательному оружию, и к любому другому дальнобойному оружию, используемому с навыком Стрельба. Для метательного оружия нельзя пользоваться преимуществами Оружейного мастера одновременно с Верным глазом.\n\n**Уровень 1:** Получи Стрельбу как бонусный навык. Ты можешь взять дальнобойное оружие из укладки как Мгновенное действие. Ты можешь стрелять из лука или двуручного дальнобойного оружия, даже когда враг на дистанции ближнего боя, — правда, со штрафом -4 к атаке. Ты можешь добавлять уровень навыка Стрельба к броску урона дальнобойного оружия.\n\n**Уровень 2:** Ты можешь перезаряжать арбалеты и другое медленно заряжаемое оружие как Действие в свой ход, если перезарядка занимает не больше раунда. Ты можешь без штрафа использовать в ближнем бою дальнобойное оружие любого размера. Раз за сцену, как Действие в свой ход при стрельбе по неодушевлённой мишени-несуществу, ты попадаешь автоматически — если только не выбросил 2 на проверке навыка Стрельба и если выстрел вообще физически возможен.\n\n#### Вихревой натиск\n\nТы — вихрь кровавого разора в ближнем бою и можешь косить множество слабых врагов вблизи… если выживешь в окружении.\n\n**Уровень 1:** Получи Клинок как бонусный навык. Раз за сцену как Действие в свой ход нанеси свой урон Шока всем врагам на дистанции ближнего боя, если они уязвимы к твоему Шоку.\n\n**Уровень 2:** Когда ты в первый раз за раунд убиваешь кого-то обычной атакой — броском урона при попадании или нанесённым ею уроном Шока, — ты мгновенно получаешь вторую атаку по любой цели в пределах досягаемости любым оружием у тебя в готовности.\n\n#### Властность\n\nВ тебе есть жутковатая харизма, и окружающие инстинктивно следуют твоим указаниям и служат твоим целям. На уровне 1 это дар обаяния и личного магнетизма, а уровень 2 может намекать на скрытые магические силы или древнюю кровь колдовских владык. Где этот Фокус говорит о последователях, имеются в виду NPC, добровольно поступившие к тебе на службу. ПИ последователями не считаются никогда.\n\n**Уровень 1:** Получи Лидерство как бонусный навык. Раз в день ты можешь обратиться с просьбой к NPC, не проявляющему к тебе открытой враждебности, бросив проверку Хар/Лидерство со сложностью, равной Боевому духу этого NPC. При успехе он выполнит просьбу, если она не причиняет ему заметного вреда и не совсем ему несвойственна.\n\n**Уровень 2:** Идущие за тобой окрылены уверенностью. Любой NPC под твоим прямым началом получает бонус к Боевому духу и броскам атаки, равный твоему навыку Лидерство, и +1 ко всем проверкам навыков. Твои последователи и подручные не пойдут против твоих интересов, разве что под крайним давлением.\n\n#### Вожак подручных\n\nУ тебя особый талант подбирать потерянные души, готовые добровольно исполнять твою волю. Ты можешь завлекать их обещаниями денег, власти, азарта, секса или иной награды, которую в итоге дашь или не дашь. Подручный, полученный этим Фокусом, служит верно, пока его явно не предадут или не поставят под неприемлемую угрозу. Подручные — люди не «важные»: обычно это маргиналы, изгои, отчаявшиеся и прочий люд с небольшим выбором.\n\nТы можешь набирать дополнительных подручных обычной платой или посулами, но эти лишние наёмники верны и умелы ровно настолько, насколько это купят твои деньги и обращение.\n\n**Уровень 1:** Получи Лидерство как бонусный навык. Ты можешь обзавестись подручными в течение 24 часов после прибытия в поселение — если там вообще найдётся подходящий материал. Эти подручные не станут драться, кроме как спасая свою жизнь, но пойдут с тобой в приключения и на большой риск ради помощи тебе. У большинства подручных боевые параметры обычного взрослого их культуры. Ты можешь держать одного подручного за каждые три уровня персонажа, с округлением вверх. Ты можешь отпустить подручных без обид в любой правдоподобный момент и позже подобрать их снова, если останешься без подручного.\n\n**Уровень 2:** Твои подручные удивительно верны и решительны: они будут драться за тебя против чего угодно, кроме явно подавляющих сил. Благодаря природной толковости или преданности тебе они считаются бойцами своей культуры с 2 КЗд. Ты можешь делать верными подручными умелых и очень способных NPC, но для этого нужно действительно оказать им услугу или помощь, разумно заслуживающую такой яростной верности.\n\n#### Гаситель\n\nЧто-то в твоём герое мешает применять к нему магию. Может, это на диво сильное родовое благословение, особая сверхъестественная кровь или простая оккультная несовместимость. Этот Фокус нельзя брать Магам и частичным Магам.\n\n**Уровень 1:** Ты и все союзники в пределах двадцати футов получаете +2 ко всем спасброскам против магических эффектов. Как Действие в свой ход ты можешь ощутить присутствие или применение магии в двадцати футах от себя, хотя не различаешь ни подробностей, ни конкретного источника. Первый за день провальный спасбросок против магического эффекта превращается для тебя в успех.\n\n**Уровень 2:** Раз в день как Мгновенное действие нежеланный магический эффект или сверхъестественная способность чудовища просто не действует на тебя — даже если обычно она не даёт спасброска. Неуязвимость к длящемуся эффекту сохраняется до конца сцены.\n\n#### Глаз снайпера\n\nТы мастер укладывать метательный нож или стрелу в ничего не подозревающую цель. Эти особые преимущества действуют только при Казнящей атаке из лука, болтомёта или метательным оружием.\n\n**Уровень 1:** Получи Стрельбу как бонусный навык. При проверке навыка для дальнобойной Казнящей атаки или стрельбы по мишени бросай 3d6 и отбрасывай худшую кость.\n\n**Уровень 2:** Ты не промахиваешься дальнобойными Казнящими атаками. Поражённая такой атакой цель получает -4 на Физический спасбросок, чтобы избежать немедленного смертельного ранения. Даже при успешном спасброске цель получает двойной обычный урон от атаки.\n\n#### Дар дипломата\n\nТвоё искусство личных переговоров огромно и жутковато. Иные даже сочтут его сверхъестественным.\n\n**Уровень 1:** Получи Убеждение как бонусный навык. Ты говоришь на всех языках, распространённых в твоём краю мира, и выучиваешь новые до рабочего уровня за неделю, а до свободного — за месяц. Перебрасывай единицы на любых костях проверок навыков, связанных с переговорами или дипломатией.\n\n**Уровень 2:** Раз в день безмолвно освяти заключаемую сделку: чтобы нарушить её, цель должна пройти Ментальный спасбросок, — если только сделка не грозит её жизни или чему-то столь же ей дорогому. Большинство NPC даже не попытаются её нарушить. Сделка должна быть о чём-то конкретном и ограниченном по времени, а не бессрочным договором.\n\n#### Делец\n\nУ тебя сверхъестественный нюх на торговцев и выгодные сделки, законные и не очень. Даже тех, кто обычно не расположен с тобой торговаться, порой удаётся уговорить остановиться и поторговаться, если у тебя есть то, что им нужно.\n\n**Уровень 1:** Получи Торговлю как бонусный навык. За полчаса усилий ты находишь покупателя или продавца на любой товар или услугу, какими вообще торгуют в этом поселении, легально или нет. Поиск услуги на грани возможного — скажем, убийцы, готового и способного взяться за короля, или некоего конкретного драгоценного древнего артефакта — может потребовать целого приключения, если Мастер это вообще позволит.\n\n**Уровень 2:** Раз за сессию выбери разумное существо, которое прямо сейчас не пытается убить тебя или твоих союзников, и обратись к нему с понятной ему просьбой. Если для него хоть сколько-нибудь правдоподобно пойти на такие условия, оно согласится — за цену или услугу, которую, по его мнению, ты можешь дать; правда, цена серьёзных услуг может оказаться высокой.\n\n#### Доблестный защитник\n\nТы телохранитель, щитоносец или иной одарённый защитник ближних, привычный к водовороту кровавой битвы и отчаянной схватки. Ты исключительно хорошо умеешь заслонять союзников от атак тех, кто желает им смерти.\n\n**Уровень 1:** Получи Клинок или Кулак как бонусный навык. Получи +2 ко всем проверкам навыка для боевого действия «Прикрыть союзника». Ты можешь прикрывать от одного атакующего за раунд больше, чем обычно позволял бы твой навык. Раз в раунд ты можешь Прикрыть союзника даже от бесплотных заклинаний и магических атак или телом заслонить его от взрыва или магии по площади. Такие попытки требуют обычной успешной встречной проверки навыка; нападающий использует свой навык Магия.\n\n**Уровень 2:** Первая проверка навыка «Прикрыть союзника» в раунде всегда успешна. Получи +2 к КЗщ, пока кого-то прикрываешь. Ты можешь прикрывать от врагов размером вплоть до огра или вола.\n\n#### Дух-фамильяр\n\nТвой преданный спутник — мелкий дух, бес, конструкт, магический зверь или иное существо. Способности его скромны, но он абсолютно верен тебе.\n\n**Уровень 1:** Выбери облик фамильяра — не мельче кошки и не крупнее человека. У него свойства и способности существа, созданного Исчислением призванного слуги, но его можно призывать и отпускать Основным действием; появляется он на дистанции ближнего боя от владельца. Исчезая, он не уносит с собой предметов, кроме одежды, естественной для его облика. Ему не нужны еда, вода и сон. Если фамильяра убили, он исчезает, и его нельзя призвать заново 24 часа. Раз в день он может восстановить тебе один пункт задействованного Усилия.\n\n**Уровень 2:** Выбери фамильяру два преимущества из списка ниже. Этот уровень можно брать несколько раз, каждый раз добавляя ещё два варианта.\n\n- У него пункты здоровья, равные тройному твоему уровню.\n- Он получает способность атаковать с бонусом атаки в половину твоего уровня с округлением вверх, нанося 1d8 урона при попадании, без Шока.\n- Он получает +1 к проверкам навыков и может применять этот бонус к кругу задач, соответствующему одному обычному человеческому происхождению.\n- Он получает ещё один облик по твоему выбору, который может принимать и сбрасывать как Действие в свой ход.\n- Он может парить или летать со своей обычной скоростью перемещения.\n- Он может свободно общаться с окружающими на любом известном тебе языке.\n\n#### Душа компании\n\nУ тебя поразительный дар очаровывать и умиротворять людей и существ, которых ты только что встретил. Правда, узнав тебя ближе, они станут судить уже по опыту: этот Фокус действует на цель лишь однажды.\n\n**Уровень 1:** Проверки реакции встреченных отрядом существ получают +1, пока ты рядом, — вне зависимости от того, ты ли ведёшь разговор. Даже враждебные существа при встрече обычно дадут отряду раунд на переговоры, прежде чем напасть, — если только они не в засаде и у них нет явной причины для немедленного насилия.\n\n**Уровень 2:** Раз за игровую сессию, когда делается проверка реакции, сделай её объект настолько дружелюбным и услужливым к тебе и твоему отряду, насколько это для него вообще правдоподобно. Почему существо стало таким, решает Мастер: может, оно обмануто насчёт твоей природы, может, находит тебя уморительным, а может, хочет услуги от тебя и твоих союзников.\n\n#### Живучий\n\nТебя на удивление трудно убить. Ты переживаешь раны и выносишь тяготы, которые свалили бы менее упорного героя.\n\n**Уровень 1:** Ты получаешь дополнительные 2 к максимуму пунктов здоровья за уровень. Этот бонус действует задним числом, если ты берёшь Фокус после первого уровня. Будучи смертельно ранен, ты стабилизируешься автоматически — если тебя не сожгли, не расчленили и не разорвали на куски иным способом.\n\n**Уровень 2:** Первый раз за день, когда ранение опускает тебя до нуля пунктов здоровья, ты вместо этого выживаешь с одним оставшимся пунктом здоровья. Эта способность не спасёт от масштабной мгновенно убийственной травмы.\n\n#### Магия в доспехах\n\nЭтот Фокус доступен только героям-Магам, которым доспехи иначе не давали бы читать заклинания или применять Искусства; он отражает особую выучку в проведении магии сквозь мешающие материалы обычного доспеха.\n\n**Уровень 1:** Ты можешь читать заклинания и применять Искусства в доспехах со значением Загруженности не выше двух. Ты можешь колдовать со щитом, если вторая рука свободна для жестов.\n\n**Уровень 2:** Ты можешь читать заклинания в доспехах любой Загруженности. Ты также научился колдовать, когда обе руки заняты, — но не связаны.\n\n#### Мастер ловушек\n\nТы редкостно сведущ в ловушках и силках — и в обыденных, и в магических опасностях, какие встречаются в подземельях и логовах чародеев. Ты умеешь мастерить ловушки из материалов, которые легко носить с собой.\n\n**Уровень 1:** Получи Внимание как бонусный навык. Раз за сцену перебрасывай любой провальный спасбросок или проверку навыка, связанные с ловушками и силками. За пять минут работы ты можешь заминировать дверной проём, ёмкость, проход или иное относительно узкое место ножными петлями, железным чесноком, отравленными иглами и прочими опасностями. Нелетальная ловушка отнимает раунд действий у первой сработавшей на неё жертвы, а опасная наносит 1d6 урона плюс удвоенный уровень персонажа, с подходящим спасброском вполовину. Одновременно можно поддерживать лишь одну такую самодельную ловушку. При благоприятных обстоятельствах и с разрешения Мастера можно ставить ловушки и пострашнее.\n\n**Уровень 2:** Ты знаешь секреты распутывания даже магических ловушек и тайных опасностей, для снятия которых обычно нужен волшебник. Раз за сцену твои усилия считаются заклинанием Искоренение чар против ловушки или опасности, прочитанным Магом вдвое выше тебя уровнем; все нужные проверки навыка делаются как Инт/Внимание или Лов/Внимание. Эту способность можно применять против любого неподвижного магического эффекта, который поддаётся развеиванию Искоренением чар.\n\n#### Мастер на все руки\n\nУ тебя шапочное знакомство с огромным множеством практических навыков и занятий, и ты можешь сносно взяться почти за любое дело или ремесло. Учти, что фантомные уровни навыков от этого Фокуса не складываются с обычными уровнями навыков и не дают скидки на покупку навыка. Этот Фокус могут брать только Эксперты и частичные Эксперты.\n\n**Уровень 1:** Получи любой один бонусный навык. Все небоевые навыки для целей проверок считаются у тебя не ниже уровня-0, даже если их у тебя нет вовсе.\n\n**Уровень 2:** Все небоевые навыки для целей проверок считаются у тебя не ниже уровня-1.\n\n#### Наездник\n\nСражаться в седле и держать скакуна здоровым может всякий с любым уровнем навыка Верховая езда. Но твоя связь со скакунами почти сверхъестественна, и ты можешь гнать их за обычные пределы.\n\n**Уровень 1:** Получи Верховую езду как бонусный навык. Все твои скакуны считаются в бою существами с Боевым духом 12, используют твой КЗщ, если он выше их собственного, и проходят за день на 50% больше обычного для их породы. Ты интуитивно понимаешь верховых животных, узнавая от них столько, сколько способен передать их разум.\n\n**Уровень 2:** Раз за сцену отмени успешную атаку по своему скакуну как Мгновенное действие. Раз за сцену перебрось любую провальную проверку Верховой езды. Ты можешь телепатически передавать своему скакуну и принимать от него простые предупреждения, мысли и команды, пока он в пределах двухсот футов. Так ты можешь быть связан с одним скакуном за раз; установление связи занимает час.\n\n#### Неуязвимая защита\n\nНебывалые рефлексы, редкое везение, сверхъестественная кровь или магический дар — так или иначе, твоя природная защита не уступает доспеху высшей пробы. Преимущества этого Фокуса не складываются с бронёй, но модификаторы Ловкости и щита действуют.\n\n**Уровень 1:** Твой врождённый Класс защиты равен 15 плюс половина уровня персонажа с округлением вверх.\n\n**Уровень 2:** Раз в день как Мгновенное действие ты можешь стряхнуть любую одну оружейную атаку или физическую травму, нанесённую врагом. Урон от среды, урон от падения и прочий вред, от которого не уберёг бы крепкий доспех, так не отразить.\n\n#### Одарённый лекарь\n\nУ тебя необычный дар спасать смертельно раненных союзников и ускорять естественное восстановление раненых под твоей опекой.\n\n**Уровень 1:** Получи Медицину как бонусный навык. Ты можешь пытаться стабилизировать одного смертельно раненного вплотную к тебе за раунд как Действие в свой ход. При проверках навыка Медицина бросай 3d6 и отбрасывай худшую кость. Оказывая первую помощь после боя, ты исцеляешь вдвое больше пунктов здоровья, чем обычно.\n\n**Уровень 2:** Твои целительные дары считаются магическим исцелением. Как Основное действие ты можешь исцелить 1d6+Медицина урона раненому союзнику вплотную к тебе — и, возможно, привести его в чувство без всякой остаточной Хилости. Каждое такое исцеление добавляет цели 1 Системной нагрузки, и дар нельзя применять к целям, уже достигшим максимума Системной нагрузки.\n\n#### Оружейный мастер\n\nТы необычайно ловок с метательным оружием и в атаках ближнего боя. Преимущества этого Фокуса не действуют на рукопашные атаки и на стрелковое оружие, которое не метают. Его бонусы также не складываются с Верным глазом и другими Фокусами, добавляющими уровень навыка к твоему урону или Шоку.\n\n**Уровень 1:** Получи Клинок как бонусный навык. Ты можешь взять оружие ближнего боя или метательное оружие из укладки как Мгновенное действие. Ты можешь добавлять уровень навыка Клинок к броску урона или урону Шока оружия ближнего боя или метательного оружия — если они у него вообще есть.\n\n**Уровень 2:** Шок твоих атак ближнего боя всегда считает цель как КЗщ 10. Получи +1 к атаке всем метательным оружием и оружием ближнего боя.\n\n#### Особый род\n\nГерои этой игры по умолчанию люди — или настолько близки к ним, что разницы нет. ПИ, желающие принадлежать к более экзотическому виду или народу полулюдей, могут взять Фокус рода, подходящий выбранному виду, — например, из тех, что даны в главе бестиария для разных типов существ.\n\nДоступность таких особых родов зависит от кампании и разрешения Мастера. Даже если эльфы и гномы в мире кампании существуют, Мастер не обязан позволять игрокам брать их как ПИ, если этот выбор не подходит тону или месту действия.\n\nЗаметь также, что ПИ, который просто хочет отличаться, не прося особых механических выгод, не обязан покупать особый Фокус. Если у его народа полулюдей или чужаков нет настоящих преимуществ перед человеком, он может просто объявить свою природу — при условии, что Мастер вообще допускает таких существ в своей кампании.\n\n#### Отравитель\n\nТы искусный отравитель и умеешь составлять токсины из подручных растений и минералов. Варка яда занимает час; свежими ты можешь держать столько доз, сколько у тебя уровней. Клинковые яды наносятся Основным действием и держатся десять минут либо до первого попадания или Шока — смотря что случится раньше. Обнаружить отравленную еду — проверка Мдр/Внимание против 10, или против 12, если едок не вельможа и вообще не привык остерегаться яда. Одной дозы хватит отравить до полудюжины едоков.\n\n**Уровень 1:** Получи Медицину как бонусный навык. Получи переброс любого провального спасброска против яда. Твои токсины наносят 2d6 урона плюс твой уровень при попадании или Шоке, Физический спасбросок — вполовину. Обездвиживающие и галлюциногенные токсины делают то же самое, но опущенные ими до нуля пунктов здоровья просто обездвижены на час.\n\n**Уровень 2:** Ты неуязвим для яда и можешь дать универсальное противоядие любому отравленному союзнику как Основное действие. Любая попытка обнаружить твой яд или спастись от него получает штраф, равный твоему навыку Медицина. Твои пищевые яды считаются Казнящей атакой против ничего не подозревающих целей: Медицина задаёт штраф к Физическому спасброску, а при успешном спасброске цель получает 1d6 урона за твой уровень. Такие яды по твоему желанию могут быть нелетальными.\n\n#### Развитая характеристика\n\nУ твоего героя необычайно развита одна или несколько характеристик. Причиной может быть колдовская кровь, природный дар или чистое упрямое упорство. Этот Фокус нельзя брать героям с классами Мага или частичного Мага.\n\n**Уровень 1:** Выбери характеристику; её модификатор увеличивается на +1, максимум до +3. Само значение не меняется, но модификатор растёт — и может вырасти ещё, если дальнейшее развитие достаточно поднимет характеристику. Ты можешь брать этот Фокус несколько раз для разных характеристик.\n\n#### Ремесленник\n\nУ тебя выдающийся дар мастерового, и ты часто импровизируешь приёмы даже в ремёслах, далёких от твоего обычного занятия. Ты можешь создавать моды для снаряжения, даже если ты не Эксперт.\n\n**Уровень 1:** Получи Ремесло как бонусный навык. Твой навык Ремесло считается на уровень выше, максимум до 5, для целей создания и поддержания модов. Модам твоей работы нужно на одну единицу чародейного утиля меньше, минимум до одной. Твой навык Ремесло применим к работе любой обычной ремесленной профессии, так что ты изготавливаешь её изделия без штрафа.\n\n**Уровень 2:** Первый мод, который ты ставишь на предмет, не требует Обслуживания и стоит лишь половину обычной цены в серебре. Это преимущество добавляется к выгодам установки мода в мастерски изготовленное снаряжение твоей работы. Любая твоя попытка создать мастерски изготовленное снаряжение автоматически успешна, и раз в месяц ты можешь снизить расход утиля на созданный мод ещё на одну единицу, минимум до нуля.\n\n#### Рукопашник\n\nТвои пустые руки опаснее мечей в хватке менее одарённых. Твои рукопашные атаки считаются оружием ближнего боя, когда речь идёт о связывании противников с луками и подобным длинным дальнобойным оружием, но для этого нужна хотя бы одна свободная рука.\n\n**Уровень 1:** Получи Кулак как бонусный навык. Твои рукопашные атаки становятся опаснее с ростом навыка Кулак. На уровне-0 они наносят 1d6 урона. На уровне-1 — 1d8 урона. На уровне-2 — 1d10, уровень-3 даёт 1d12, а уровень-4 — 1d12+1. При Кулак-1 и выше они получают качество Шок, равное твоему навыку Кулак, против КЗщ 15 или меньше.\n\n**Уровень 2:** Даже при промахе атакой Кулаком ты наносишь немодифицированный 1d6 урона плюс любой Шок, который удар мог бы нанести цели.\n\n#### Самозванец\n\nТы изощрённо умеешь выдавать себя за того, кем не являешься: маскировка, подражание голосам, молниеносная смена гардероба. Одни самозванцы полагаются на актёрство Выступления, другие тяготеют к тёмным трюкам Скрытности.\n\n**Уровень 1:** Получи Выступление или Скрытность как бонусный навык. Раз за сцену перебрасывай любую провальную проверку навыка или спасбросок, связанные с поддержанием личины или маскировки. Создай одну фальшивую личность без большого общественного веса; ты можешь безупречно выдавать себя за этого человека, и связать вас смогут лишь крайне убедительные доказательства. Ты можешь сменить эту личность, потратив неделю на создание новой.\n\n**Уровень 2:** Ты можешь так перекроить одежду и доспех, что одним Основным действием переключаешься между любым из трёх выбранных обликов. Вдобавок к исходной фальшивой личности ты можешь заводить новую в каждом городе или крупном поселении, где провёл хотя бы день.\n\n#### Светский\n\nОбширные странствия, зоркая наблюдательность или долгая учёба дали тебе широкое знание культур твоего края и умение ориентироваться в их обычаях, законах и языках. Ты знаешь, что сделать и что сказать, чтобы убедить других в разумности твоих пожеланий.\n\n**Уровень 1:** Получи Связи как бонусный навык. Ты свободно говоришь на всех распространённых языках родного края и можешь передать хотя бы простые сведения на редких и эзотерических. Новый язык ты выучиваешь всего за неделю практики с носителем. Раз в игровой день твои отточенные манеры автоматически приносят мелкую услугу от NPC — такую, что не введёт его в заметные расходы или риск, — если NPC к тебе не враждебен.\n\n**Уровень 2:** Раз за игровую сессию перебрось провальную проверку социального навыка: твоё знание культуры подталкивает собеседника к нужному результату.\n\n#### Со связями\n\nТы на редкость легко заводишь друзей и связи среди окружающих. Куда бы ты ни попал, у тебя всегда найдётся кто-то полезный для твоих целей.\n\n**Уровень 1:** Получи Связи как бонусный навык. Если ты провёл хотя бы неделю в не совсем враждебном месте, ты сплёл там сеть знакомств, готовых оказывать тебе услуги не более чем слегка противозаконные. Ты можешь просить об одной услуге за игровой день; как далеко ради тебя пойдут, решает Мастер.\n\n**Уровень 2:** Раз за игровую сессию, если это не совсем неправдоподобно, ты встречаешь знакомого, готового на скромные услуги для тебя. Ты сам решаешь, когда и где встретить этого человека, но кто он и чем может помочь, решает Мастер.\n\n#### Специалист\n\nТы замечательно талантлив в одном определённом навыке. Изумительный домушник, прославленный атлет, блестящий учёный или иной самородок — твоё мастерство крайне надёжно. Ты можешь брать этот Фокус несколько раз для разных навыков.\n\n**Уровень 1:** Получи любой навык как бонусный, кроме Магии, Клинка, Стрельбы и Кулака. Бросай 3d6 и отбрасывай худшую кость при всех проверках этого навыка.\n\n**Уровень 2:** Бросай 4d6 и отбрасывай две худшие кости при всех проверках этого навыка.\n\n#### Убийца\n\nТы набил руку на внезапном смертоубийстве и имеешь особые преимущества при Казнящей атаке.\n\n**Уровень 1:** Получи Скрытность как бонусный навык. Ты можешь спрятать предмет не крупнее ножа от любого досмотра мягче обыска с раздеванием. Ты можешь выхватить или достать этот предмет как Действие в свой ход, а твои атаки им в упор — метательные или ближние — в раунде внезапности не могут промахнуться по цели.\n\n**Уровень 2:** Ты можешь совершить Действие перемещения в том же раунде, что и Казнящую атаку, стремительно сближаясь с целью перед ударом. Ты можешь разбить это перемещение при Казнящей атаке, пройдя часть пути до убийства, а часть после. Это движение слишком быстро, чтобы насторожить жертву, и телохранители не успевают ему помешать.\n\n#### Уникальный дар\n\nУ твоего героя есть необычная способность или магический дар, который не описать существующими Фокусами как следует. Этот выбор — запасная графа для особой силы, которая так или иначе стоит выбора Фокуса.\n\nТочный эффект способности игрок и Мастер определяют вместе, вырабатывая результат, который выглядит честным и разумным. От стола к столу и от кампании к кампании он будет разным: врождённая способность дышать под водой в пустынном сеттинге — немногим больше, чем курьёз, а в кампании о пиратстве в бескрайнем архипелаге она может значить куда больше.\n\nКак с любой силой, группе стоит быть готовой пересмотреть дар, если в игре он окажется исключительно слаб или сильнее, чем ожидалось.\n\n#### Чужая кровь\n\nНекая экзотическая сверхъестественная или чуждая кровь стала для тебя и благословением, и проклятием.\n\n**Уровень 1:** Выбери один набор преимуществ из списка ниже под стать своему чуждому наследию. Могут существовать и другие дары.\n\n- Ты неуязвим для урона от жара и без помех дышишь в дыму и видишь сквозь него.\n- Ты приспособлен к воде: дышишь под водой и видишь в ней до 120 футов независимо от освещения. Ты плаваешь с удвоенной скоростью перемещения.\n- Ты сложен для более тяжёлого или лёгкого тяготения: получи +1 к модификатору Силы или Ловкости, максимум до +3, и штраф -1 к модификатору второй из этих характеристик.\n- Тебя питают незримые излучения, и тебе не нужно ни есть, ни спать, ни дышать. Ты ясно видишь даже в полной темноте.\n\n#### Шокирующий натиск\n\nТы крайне опасен для врагов рядом с собой. Ярость твоих атак в ближнем бою давит и отвлекает противников, даже когда твои удары не пускают кровь.\n\n**Уровень 1:** Получи Кулак или Клинок как бонусный навык. Урон Шока твоего оружия считает все цели как КЗщ 10 — при условии, что оружие вообще способно навредить цели и цель не защищена от Шока.\n\n**Уровень 2:** Вдобавок ты получаешь +2 к значению урона Шока всего оружия ближнего боя и рукопашных атак, наносящих Шок. Как обычно, попадания никогда не наносят меньше урона, чем нанёс бы этот Шок при промахе."},{"n":"1.7.0","l":2,"te":"Final Character Creation Steps","tr":"Завершающие шаги создания персонажа","en":"The player now records their character’s final statistics and chooses their name and current goal.","ru":"Теперь игрок записывает итоговые характеристики персонажа и выбирает его имя и текущую цель."},{"n":"1.7.1","l":3,"te":"Record Maximum Hit Points","tr":"Запиши максимум пунктов здоровья","en":"Your character’s hit points measure their distance from defeat or death. If your character is reduced to zero hit points, they are either dying or incapacitated based on the nature of the injury.\nA new character rolls the hit die for their class, adding their Constitution modifier to it. If they have chosen the Die Hard Focus they may add +2 to the roll. The final value for a given die cannot be less than 1 hit point.\nA character gains hit points as they advance in character level, rerolling their prior levels and taking the new score if it’s higher, as explained in the rules section.","ru":"Пункты здоровья твоего персонажа измеряют, насколько он далёк от поражения или смерти. Если персонаж падает до нуля пунктов здоровья, он либо умирает, либо обездвижен — смотря какова природа ранения.\n\nНовый персонаж бросает кость здоровья своего класса, добавляя к броску модификатор Телосложения. Если он выбрал Фокус Живучий, он может добавить к броску +2. Итог одной кости не может быть меньше 1 пункта здоровья.\n\nПерсонаж получает пункты здоровья с ростом уровня, перебрасывая прежние уровни и беря новый результат, если он выше, — как объяснено в разделе правил."},{"n":"1.7.2","l":3,"te":"Record Attack Bonus","tr":"Запиши бонус атаки","en":"Your character has a certain degree of basic combat competence based on their class. This bonus increases as you advance in character levels and is added to your attack roll.\nA new character’s attack bonus is usually +0, though Full Warriors start with a +1 base attack bonus.","ru":"У твоего персонажа есть некоторая базовая боевая подготовка, зависящая от класса. Этот бонус растёт с уровнями персонажа и добавляется к броску атаки.\n\nУ нового персонажа бонус атаки обычно +0, но полные Воины начинают с базовым бонусом атаки +1."},{"n":"1.7.3","l":3,"te":"Record Saving Throws","tr":"Запиши спасброски","en":"When faced with unusual dangers such as fireball explosions, toxic darts, pit traps, or magical curses, the character may need to make a saving throw to resist or mitigate the peril. Saving throws are rolled on a d20 and are explained in the rules section.\n**Physical** saving throws are used to resist exhaustion, disease, poison, or other biological harms. A new character’s Physical save target is equal to 15 minus the better of their Strength or Constitution modifiers.\n**Evasion** saving throws are used to avoid explosions, traps, or other dangers requiring fast reactions. A new character’s Evasion save target is equal to 15 minus the better of their Intelligence or Dexterity modifiers.\n**Mental** saving throws are used to resist intangible spells, mental attacks, or other tests of willpower or self-control. A new character’s Mental save target is equal to 15 minus the better of their Wisdom or Charisma modifiers.\n**Luck** saving throws are rolled when facing a danger that only blind chance can spare them from, such as landslide, bridge collapse, or a sniper’s random choice of victims. A new character’s Luck save target is always 15.\nA character’s save targets all decrease by 1 point each time they advance an experience level.","ru":"Столкнувшись с необычными угрозами вроде взрыва огненного шара, отравленных дротиков, ям-ловушек или магических проклятий, персонаж может быть вынужден сделать спасбросок, чтобы устоять или смягчить опасность. Спасброски бросаются на d20 и объясняются в разделе правил.\n\nФизические спасброски используются, чтобы устоять против истощения, болезни, яда и иного биологического вреда. У нового персонажа порог Физического спасброска равен 15 минус лучший из модификаторов Силы или Телосложения.\n\nСпасброски Уклонения используются, чтобы избежать взрывов, ловушек и иных опасностей, требующих быстрой реакции. У нового персонажа порог спасброска Уклонения равен 15 минус лучший из модификаторов Интеллекта или Ловкости.\n\nМентальные спасброски используются, чтобы устоять против бесплотных заклинаний, ментальных атак и иных испытаний воли и самообладания. У нового персонажа порог Ментального спасброска равен 15 минус лучший из модификаторов Мудрости или Харизмы.\n\nСпасброски Удачи бросаются при опасности, от которой может спасти только слепой случай, — оползень, обрушение моста или случайный выбор жертвы снайпером. У нового персонажа порог спасброска Удачи всегда 15.\n\nВсе пороги спасбросков персонажа снижаются на 1 каждый раз, когда он поднимает уровень опыта."},{"n":"1.7.4","l":3,"te":"Pick a Free Skill","tr":"Выбери бесплатный навык","en":"Your character has developed some side interest that may be unrelated to your background or class. You can pick any one skill of your choice. This skill pick is gained at level-0, or level-1 if it’s already level-0. You cannot pick a skill that is already at level-1.","ru":"У твоего персонажа развилось какое-то побочное увлечение, возможно, не связанное с твоим происхождением или классом. Ты можешь выбрать любой навык на свой вкус. Этот выбор навыка даётся на уровне-0 или на уровне-1, если навык уже уровня-0. Ты не можешь выбрать навык, который уже уровня-1."},{"n":"1.7.5","l":3,"te":"Mages Choose Starting Spells","tr":"Маги выбирают стартовые заклинания","en":"Spellcasting full Mages begin play knowing four first-level spells and partial Mages begin play knowing two. Adventurers with two partial spellcasting Mage classes, such as a partial Necromancer/partial High Mage know four. These spells may be chosen from any spell list available to them. A novice High Mage, for example, would pick first-level spells from the High Magic spell list, while a new Elementalist could pick them from either the High Magic or Elementalist spells.","ru":"Колдующие полные Маги начинают игру, зная четыре заклинания первого уровня, а частичные Маги — два. Авантюристы с двумя частичными
