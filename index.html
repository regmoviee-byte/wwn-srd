of Influence. If the Asset is destroyed in the process of helping the project, the fallout of its collapse or exhaustion may have local consequences of its own.\nIf the faction is of a vastly larger scale than the project, such as a prosperous kingdom helping to construct a new border village, the entire project can be resolved in a single action. In some cases, the GM may not even require the faction to spend any Treasure, as the expense is so small relative to its resources that it’s not worth tracking.","ru":"ПИ, которые дружат с фракциями или управляют ими, могут привлекать их к своим великим планам. Фракция может помочь начинанию лишь раз за ход фракций, и эта помощь считается её действием за ход.\nПомогая, фракция тратит один пункт Казны и снижает сложность начинания на сумму своих атрибутов Богатства, Мощи и Хитрости — но не ниже минимальной сложности в 1 пункт. Обычно фракция не может завершить великое начинание сама: ей нужен ПИ или иная движущая личность, чтобы замыслить и воплотить план. Чтобы снизить сложность, фракции достаточно потратить Казну и помочь один раз. Снижение сложности сохраняется, пока начинание не завершено или пока фракция по какой-то причине не отзовёт поддержку. Помочь может и не одна фракция, если их удастся уговорить.\nЕсли фракция идеально подходит начинанию — правительство учреждает новый политический порядок, религия насаждает новую культурную норму, гильдия воров сколачивает клику убийц, — сумма её атрибутов удваивается при расчёте новой сложности.\nЕсли фракция готова — или принуждена — идти на крайности ради начинания, от отчаяния или по безжалостной воле руководства, она может бросить на него свои Активы и само здоровье организации. Любой Актив или База влияния в том же месте, что и начинание, может принять урон пунктам здоровья, чтобы снизить сложность: каждый потраченный пункт здоровья снижает её на один пункт. Такую самоотдачу трудно безопасно дозировать: по завершении траты каждый Актив и каждая База влияния, внёсшие вклад, получают дополнительно 1d4 урона. Этого может хватить, чтобы уничтожить Актив — или даже саму фракцию, если Базе влияния досталось достаточно урона. Если Актив погиб, помогая начинанию, его крах или истощение могут сами по себе иметь местные последствия.\nЕсли фракция несоизмеримо крупнее начинания — скажем, процветающее королевство помогает отстроить новую пограничную деревню, — всё начинание можно разрешить одним действием. В некоторых случаях Мастер может даже не требовать от фракции трат Казны: расход настолько мал по сравнению с её ресурсами, что его не стоит и учитывать."}]}</script>
<script>
"use strict";
/* Документ открыт внутри рамки на чужой странице? Тогда высотой и прокруткой
   управляет внешняя страница, а не мы. */
const EMBED = (window.parent !== window);
if(EMBED) document.body.classList.add("embed");

const DATA = JSON.parse(document.getElementById("srd-data").textContent);
const SECS = DATA.sections;
const byNum = new Map(SECS.map(s => [s.n, s]));

const UI = {
  ru:{ title:"Миры без числа", sub:"Справочный документ по системе 1.0",
    search:"Поиск по документу…", contents:"Разделы", inThis:"В этом разделе",
    navOpen:"Разделы", navClose:"Закрыть",
    found:"Найдено", nothing:"Ничего не найдено. Поиск идёт и по русскому, и по английскому тексту.",
    orig:"В оригинале", prev:"Назад", next:"Дальше", goto:"Открыть раздел",
    noText:"В этом разделе нет своего текста — это заголовок главы.",
    foot:"Оригинал: Worlds Without Number Systems Reference Document v1.0, Kevin Crawford, 13 марта 2024. Автор передал документ в общественное достояние по лицензии CC0. Русский перевод распространяется свободно." },
  en:{ title:"Worlds Without Number", sub:"Systems Reference Document 1.0",
    search:"Search the document…", contents:"Contents", inThis:"In this section",
    navOpen:"Contents", navClose:"Close",
    found:"Found", nothing:"No matches. Search covers both the English and the Russian text.",
    orig:"In Russian", prev:"Back", next:"Next", goto:"Open section",
    noText:"This section has no body text of its own — it is a chapter heading.",
    foot:"Source: Worlds Without Number Systems Reference Document v1.0, Kevin Crawford, 13 March 2024. The author waived copyright and related rights under CC0. The Russian translation is freely distributable." }
};

/* ── страницы: главы (X.0.0) и разделы (X.Y.0); подразделы живут внутри ── */
const PAGES = SECS.filter(s => s.n === "intro" || s.l === 1 || s.l === 2);
const pageIdx = new Map(PAGES.map((s, i) => [s.n, i]));
function childrenOf(num){
  if(num === "intro") return [];
  const p = num.split(".");
  if(p[2] === "0" && p[1] !== "0")            // раздел X.Y.0 → его X.Y.Z и X.Y.Z.W
    return SECS.filter(s => s.n.startsWith(p[0] + "." + p[1] + ".") && s.n !== num);
  return [];
}
function chapterSections(num){               // глава X.0.0 → её разделы X.Y.0
  const p = num.split(".");
  return SECS.filter(s => s.l === 2 && s.n.startsWith(p[0] + "."));
}
/* какая страница показывает данный раздел */
function pageFor(num){
  if(pageIdx.has(num)) return num;
  const p = num.split(".");
  const cand = p[0] + "." + p[1] + ".0";
  return pageIdx.has(cand) ? cand : (p[0] + ".0.0");
}

let lang = (localStorage.getItem("wwn-lang") === "en") ? "en" : "ru";
let cur = "intro", query = "";

const t = () => UI[lang];
const sTitle = s => (lang === "ru" ? (s.tr || s.te) : (s.te || s.tr));
const sAlt   = s => (lang === "ru" ? s.te : s.tr);
const sBody  = s => (lang === "ru" ? s.ru : s.en);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));

/* ═══════════ разметка ═══════════ */
function inline(s){
  s = esc(s);
  s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  s = s.replace(/(^|[\s(«„\-])\*([^*\n]+)\*/g, "$1<em>$2</em>");
  s = s.replace(/`([^`]+)`/g, "<code>$1</code>");
  return s;
}
const isSep = l => /^\|[\s|:—–-]+\|?\s*$/.test(l);
const cells = l => l.replace(/^\|/, "").replace(/\|\s*$/, "").split("|").map(c => c.trim());

function tableHtml(rows){
  const hasHead = rows[1] && isSep(rows[1]);
  let h = "<div class=\"tw\"><table>";
  if(hasHead) h += "<thead><tr>" + cells(rows[0]).map(c => `<th>${inline(c)}</th>`).join("") + "</tr></thead>";
  h += "<tbody>";
  for(const r of rows.slice(hasHead ? 2 : 0)){
    if(isSep(r)) continue;
    h += "<tr>" + cells(r).map(c => `<td>${inline(c)}</td>`).join("") + "</tr>";
  }
  return h + "</tbody></table></div>";
}

/* Каждая непустая строка — самостоятельный абзац: так устроены и исходник, и перевод. */
function renderRu(txt){
  const L = txt.split("\n"); let out = "", seenText = false;
  for(let i = 0; i < L.length; i++){
    const tl = L[i].trim();
    if(!tl) continue;
    let m;
    if((m = tl.match(/^(#{1,6})\s+(.*)$/))){
      /* Первый заголовок первого уровня дублирует название страницы — опускаем его. */
      if(m[1].length === 1 && !seenText){ seenText = true; continue; }
      seenText = true;
      const h = m[1].length <= 2 ? 4 : Math.min(m[1].length + 1, 6);
      out += `<h${h}>${inline(m[2])}</h${h}>`;
      continue;
    }
    seenText = true;
    if(tl.startsWith("|")){
      const rows = []; let j = i;
      while(j < L.length && L[j].trim().startsWith("|")){ rows.push(L[j].trim()); j++; }
      i = j - 1; out += tableHtml(rows); continue;
    }
    if(/^[-*•]\s+/.test(tl)){
      const items = []; let j = i;
      while(j < L.length){
        const t = L[j].trim();
        if(!t){ j++; continue; }
        if(!/^[-*•]\s+/.test(t)) break;
        items.push(t.replace(/^[-*•]\s+/, "")); j++;
      }
      i = j - 1;
      out += "<ul>" + items.map(x => `<li>${inline(x)}</li>`).join("") + "</ul>"; continue;
    }
    if(tl === "---"){ out += "<hr class=\"hr\">"; continue; }
    if((m = tl.match(/^\*\*([^*]{1,72}?):\*\*\s*(.*)$/))){
      out += `<p class="def"><strong>${inline(m[1])}:</strong> ${inline(m[2])}</p>`; continue;
    }
    out += `<p>${inline(tl)}</p>`;
  }
  return out;
}

function renderEn(txt){
  const L = txt.split("\n"); let out = "";
  for(let i = 0; i < L.length; i++){
    const ln = L[i];
    if(!ln.trim()) continue;
    if(ln.includes("\t")){
      const rows = []; let j = i;
      while(j < L.length && (L[j].includes("\t") || !L[j].trim())){
        if(L[j].trim()) rows.push(L[j].replace(/^\t+/, "").replace(/\t+/g, "\t"));
        j++;
      }
      i = j - 1;
      out += "<div class=\"raw\">" + rows.map(r => esc(r.split("\t").join("   "))).join("\n") + "</div>";
      continue;
    }
    const tl = ln.trim();
    if(/^[•·]\s*/.test(tl)){
      const items = []; let j = i;
      while(j < L.length && /^\s*[•·*]\s*/.test(L[j])){ items.push(L[j].trim().replace(/^[•·*]\s*/, "")); j++; }
      i = j - 1;
      out += "<ul>" + items.map(x => `<li>${inline(x)}</li>`).join("") + "</ul>"; continue;
    }
    const m = tl.match(/^([A-Z][A-Za-z0-9’'&/,()– -]{1,60}):\s+(\S.*)$/);
    if(m && m[1].split(/\s+/).length <= 8){
      out += `<p class="def"><strong>${esc(m[1])}:</strong> ${inline(m[2])}</p>`; continue;
    }
    out += `<p>${inline(tl)}</p>`;
  }
  return out;
}
const bodyHtml = s => {
  const b = sBody(s);
  if(!b || !b.trim()) return `<p class="note">${esc(t().noText)}</p>`;
  return renderRu(b);
};

/* ═══════════ указатель терминов ═══════════ */
/* Определения берём из самого документа: строки «Термин: описание» и подзаголовки. */
const CORE = {
  ru:{ "Класс":"1.4.0","Фокус":"1.6.0","Происхождение":"1.3.0","Навык":"1.2.0",
    "Усилие":"1.4.4","Искусство":"4.1.0","Заклинание":"4.2.0",

    "Травматичное попадание":"2.4.6.3","Класс защиты":"2.4.5","Бонус атаки":"2.4.5",
    "Системная нагрузка":"2.5.2","Смертельное ранение":"2.5.1","Первая помощь":"2.5.4",
    "Загруженность":"2.9.0","спасбросок":"2.2.0","проверка навыка":"2.3.0",
    "Основное действие":"2.4.3","Действие перемещения":"2.4.3","Мгновенное действие":"2.4.3",
    "Казнящая атака":"2.4.7.3","Боевой дух":"5.3.0","проверка реакции":"5.2.0",
    "Инстинкт":"5.4.0","Кости здоровья":"5.1.0","Пункты здоровья":"1.7.1",
    "Слава":"7.1.0","Великое начинание":"7.0.0","Творение":"4.8.0",
    "Фракция":"6.1.0","Актив":"6.1.0","Хитрость":"6.8.0","Мощь":"6.9.0","Богатство":"6.10.0",
    "Ход фракций":"6.2.0","Черта":"6.5.0","Уровень жизни":"3.2.3",
    "Ход":"2.1.3","Сцена":"2.1.1","Раунд":"2.1.2" },
  en:{ "Class":"1.4.0","Focus":"1.6.0","Background":"1.3.0","Skill":"1.2.0",
    "Effort":"1.4.4","Art":"4.1.0","Spell":"4.2.0",
    "Shock":"2.4.6.4","Trauma Die":"2.4.6.3","Trauma Target":"2.4.6.3",

/* Сокращения: в подсказке показываем полное название, а не сокращение. */
const ABBR = {
  ru:{ "КЗд":["Кости здоровья","5.1.0"], "ПЗ":["Пункты здоровья","1.7.1"], "КЗщ":["Класс защиты","2.4.5"],

    "Загр.":["Загруженность","2.9.0"], "Слож.":["Сложность проверки","2.3.1"],

let TERMS = new Map();   // ключ в нижнем регистре → {name, sec, def}
function buildTerms(){
  TERMS = new Map();
  const abbrKeys = new Set(Object.keys(ABBR[lang]).map(x => x.toLowerCase()));
  const add = (name, sec, def) => {
    if(!name) return;
    name = name.replace(/\s+/g, " ").trim();
    const k = name.toLowerCase();
    const isAbbr = abbrKeys.has(k);
    if(TERMS.has(k)) return;
    if(!isAbbr && (name.length < 3 || STOP.has(k))) return;
    if(/^[0-9(]/.test(name)) return;
    TERMS.set(k, { name, sec, def });
  };
  const reDefRu = /^\*\*([^*]{3,60}?):\*\*\s*(\S.{15,})$/;
  const reDefEn = /^([A-Z][A-Za-z0-9’'&/,()– -]{2,58}):\s+(\S.{15,})$/;
  const reHead  = /^#{3,6}\s+(\S.{2,58})$/;

  for(const s of SECS){
    const body = sBody(s); if(!body) continue;
    const L = body.split("\n");
    for(let i = 0; i < L.length; i++){
      const tl = L[i].trim(); if(!tl) continue;
      let m;
      if((m = tl.match(reDefRu))){ add(m[1].trim(), s.n, m[2].trim()); continue; }
      if((m = tl.match(reHead))){
        const name = m[1].replace(/\*\*/g, "").trim();
        const acc = [];
        for(let j = i + 1; j < L.length && acc.length < 3; j++){
          const nx = L[j].trim();
          if(!nx) continue;
          if(/^#{3,6}\s/.test(nx) || nx.startsWith("|")) break;
          acc.push(nx.replace(/\*\*/g, "").replace(/^[-*]\s+/, ""));
        }
        if(acc.length) add(name, s.n, acc.join(" "));
      }
    }
  }
  /* базовые механические термины: описание — начало их собственного раздела */
  for(const [name, sec] of Object.entries(CORE[lang])){
    const s = byNum.get(sec) || byNum.get(pageFor(sec));
    if(!s) continue;
    let def = "";
    const own = sBody(s);
    if(own && own.trim()){
      def = own.split("\n").map(x => x.trim())
              .filter(x => x && !x.startsWith("|") && !/^#{3,6}\s/.test(x))
              .slice(0, 2).join(" ");
    }
    if(!def){
      for(const c of childrenOf(s.n)){
        const cb = sBody(c);
        if(cb && cb.trim()){
          def = cb.split("\n").map(x => x.trim())
                  .filter(x => x && !x.startsWith("|") && !/^#{3,6}\s/.test(x))
                  .slice(0, 2).join(" ");
          if(def) break;
        }
      }
    }
    const k = name.toLowerCase();
    if(def) TERMS.set(k, { name, sec, def: def.replace(/\*\*/g, "") });
  }
  /* сокращения: подставляем полное название, определение берём из их раздела */
  const opening = num => {
    const s = byNum.get(num) || byNum.get(pageFor(num));
    if(!s) return "";
    const pick = sec => {
      const b = sBody(sec);
      if(!b || !b.trim()) return "";
      return b.split("\n").map(x => x.trim())
              .filter(x => x && !x.startsWith("|") && !/^#{1,6}\s/.test(x))
              .slice(0, 2).join(" ").replace(/\*\*/g, "");
    };
    let d = pick(s);
    if(!d) for(const c of childrenOf(s.n)){ d = pick(c); if(d) break; }
    return d;
  };
  for(const [ab, [full, sec]] of Object.entries(ABBR[lang])){
    const k = ab.toLowerCase();
    const had = TERMS.get(k);
    const def = (had && had.def) ? had.def : opening(sec);
    if(!def) continue;
    TERMS.set(k, { name:ab, full, sec:(had ? had.sec : sec), def });
  }
  buildTermRe();
}

let TERM_RE = null, TERM_KEYS = [];
function stemPat(w){
  const cyr = /[А-Яа-яЁё]/.test(w);
  const e = w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  if(cyr && w.length >= 6) return w.slice(0, w.length - 2).replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "[а-яё]{0,3}";
  if(!cyr && w.length >= 5) return e + "(?:s|es)?";
  return e;
}
function buildTermRe(){
  TERM_KEYS = [...TERMS.keys()].sort((a, b) => b.length - a.length);
  const parts = TERM_KEYS.map(k => {
    const words = TERMS.get(k).name.split(/\s+/).map(stemPat);
    return "(" + words.join("\\s+") + ")";
  });
  try{
    TERM_RE = new RegExp("(?<![\\p{L}\\p{N}])(?:" + parts.join("|") + ")(?![\\p{L}\\p{N}])", "giu");
  }catch(e){ TERM_RE = null; }
}

/* Обходим готовый DOM: так разметка гарантированно не ломается. */
function linkTerms(root, homeNums){
  if(!TERM_RE) return;
  const nodes = [];
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  let n;
  while((n = w.nextNode())){
    if(!n.nodeValue || n.nodeValue.length < 2) continue;
    const p = n.parentElement;
    /* Таблицы не размечаем: там те же термины стоят плотно и пунктир превращается в шум. */
    if(!p || p.closest(".term,code,.raw,th,td,h1,h2,h3,.sh-alt,.alt-t,.toc,.sec-num,.sh-n")) continue;
    nodes.push(n);
  }
  for(const node of nodes){
    const txt = node.nodeValue;
    TERM_RE.lastIndex = 0;
    let m, last = 0, frag = null;
    while((m = TERM_RE.exec(txt))){
      let gi = -1;
      for(let i = 1; i < m.length; i++) if(m[i] !== undefined){ gi = i - 1; break; }
      if(gi < 0) continue;
      const key = TERM_KEYS[gi], rec = TERMS.get(key);
      if(!rec || homeNums.has(rec.sec)) continue;
      /* Игровые термины в переводе пишутся с заглавной — это отсекает
         совпадения с обычными словами («Ловушка» ≠ «ловушки в полу»). */
      const nameUp = rec.name[0] !== rec.name[0].toLowerCase();
      if(nameUp && m[0][0] === m[0][0].toLowerCase()) continue;
      frag = frag || document.createDocumentFragment();
      if(m.index > last) frag.appendChild(document.createTextNode(txt.slice(last, m.index)));
      const sp = document.createElement("span");
      sp.className = "term"; sp.dataset.term = key; sp.tabIndex = 0;
      sp.textContent = m[0];
      frag.appendChild(sp);
      last = m.index + m[0].length;
    }
    if(frag){
      if(last < txt.length) frag.appendChild(document.createTextNode(txt.slice(last)));
      node.parentNode.replaceChild(frag, node);
    }
  }
}

/* ── подсказка ── */
const tip = document.getElementById("tip");
let tipFor = null;
function showTip(el){
  /* На узком экране наведения нет: по термину просто переходят касанием. */
  if(window.innerWidth <= 760) return;
  const rec = TERMS.get(el.dataset.term); if(!rec) return;
  const s = byNum.get(rec.sec);
  const head = rec.full || rec.name;
  const meta = (rec.full ? esc(rec.name) + " · " : "") + esc(rec.sec) + " · " + esc(s ? sTitle(s) : "");
  tip.innerHTML = `<div class="tt">${esc(head)}</div>
    <div class="ts">${meta}</div>
    <div class="td"><p>${esc(rec.def.length > 1400 ? rec.def.slice(0, 1400) + "…" : rec.def)}</p></div>
    <button class="go" type="button" data-go="${esc(rec.sec)}">${esc(t().goto)} →</button>`;
  tip.classList.add("on");
  const r = el.getBoundingClientRect(), tw = tip.offsetWidth, th = tip.offsetHeight;
  let left = window.scrollX + r.left;
  left = Math.min(left, window.scrollX + document.documentElement.clientWidth - tw - 14);
  left = Math.max(left, window.scrollX + 10);
  let top = window.scrollY + r.bottom + 7;
  if(r.bottom + th + 20 > window.innerHeight && r.top - th - 7 > 0) top = window.scrollY + r.top - th - 7;
  tip.style.left = left + "px"; tip.style.top = top + "px";
  tipFor = el;
}
function hideTip(){ tip.classList.remove("on"); tipFor = null; }
/* Подсказка гаснет не сразу и живёт, пока курсор над ней самой —
   иначе до кнопки «Открыть раздел» не дойти. */
let hideT = null;
const holdTip = () => { clearTimeout(hideT); };
const dropTip = () => { clearTimeout(hideT); hideT = setTimeout(hideTip, 320); };
tip.addEventListener("mouseenter", holdTip);
tip.addEventListener("mouseleave", dropTip);
document.addEventListener("mouseover", e => {
  const el = e.target.closest(".term");
  if(el){ holdTip(); if(el !== tipFor) showTip(el); return; }
  if(e.target.closest("#tip")){ holdTip(); return; }
  dropTip();
});
document.addEventListener("focusin", e => { const el = e.target.closest(".term"); if(el){ holdTip(); showTip(el); } });
document.addEventListener("keydown", e => {
  if(e.key !== "Escape") return;
  hideTip();
  const r = document.getElementById("rail");
  if(r && r.classList.contains("open")) setNav(false);
});

/* ═══════════ поиск ═══════════ */
function search(q){
  const n = q.trim().toLowerCase();
  if(n.length < 2) return null;
  const res = [];
  for(const s of SECS){
    const own = (sTitle(s) + "\n" + (sBody(s) || ""));
    let src = own, k = own.toLowerCase().indexOf(n);
    if(k < 0){
      const alt = [s.n, s.te, s.tr, s.en, s.ru].join("\n");
      k = alt.toLowerCase().indexOf(n);
      if(k < 0) continue;
      src = alt;
    }
    const from = Math.max(0, k - 40);
    const snip = src.slice(from, k + n.length + 70).replace(/\s+/g, " ").trim();
    const rel = k - from - (from ? 0 : 0);
    res.push({ s, snip, k:Math.max(0, rel), len:n.length, cut:from > 0 });
  }
  return res;
}
function snipHtml(r){
  const a = esc(r.snip.slice(0, r.k)), b = esc(r.snip.slice(r.k, r.k + r.len)), c = esc(r.snip.slice(r.k + r.len));
  return (r.cut ? "…" : "") + a + "<mark>" + b + "</mark>" + c + "…";
}

/* ═══════════ панель ═══════════ */
function drawRail(){
  const el = document.getElementById("rail");
  const hits = search(query);
  if(hits){
    if(!hits.length){ el.innerHTML = `<p class="empty">${esc(t().nothing)}</p>`; return; }
    let h = `<h4>${esc(t().found)}: ${hits.length}</h4>`;
    for(const r of hits.slice(0, 120)){
      h += `<button class="nav-item" data-sec="${esc(r.s.n)}" type="button" aria-current="${r.s.n === cur}">
        <span class="num">${esc(r.s.n === "intro" ? "§" : r.s.n)}</span>
        <span class="lbl">${esc(sTitle(r.s))}</span><span class="snip">${snipHtml(r)}</span></button>`;
    }
    el.innerHTML = h; return;
  }
  let h = `<h4>${esc(t().contents)}</h4>`;
  for(const s of PAGES){
    if(s.l === 1 || s.n === "intro"){
      h += `<button class="nav-item ch" data-sec="${esc(s.n)}" type="button" aria-current="${s.n === cur}">
        <span class="num">${esc(s.n === "intro" ? "§" : s.n.split(".")[0])}</span>
        <span class="lbl">${esc(sTitle(s))}</span></button>`;
    } else {
      h += `<button class="nav-item" data-sec="${esc(s.n)}" type="button" aria-current="${s.n === cur}">
        <span class="num">${esc(s.n)}</span><span class="lbl">${esc(sTitle(s))}</span></button>`;
    }
  }
  el.innerHTML = h;
}

/* ═══════════ страница ═══════════ */
function drawPage(){
  const s = byNum.get(cur);
  if(!s){ cur = "intro"; return drawPage(); }
  const kids = childrenOf(cur);
  const home = new Set([cur, ...kids.map(k => k.n)]);
  let h = `<div class="sec-num">${esc(cur === "intro" ? "§" : cur)}</div>`;
  h += `<h1 class="t">${esc(sTitle(s))}</h1>`;
  const alt = sAlt(s);
  if(alt) h += `<p class="alt-t">${esc(t().orig)}: ${esc(alt)}</p>`;

  if(s.l === 1 && cur !== "intro"){
    const list = chapterSections(cur);
    if(list.length){
      h += `<div class="toc"><div class="toc-h">${esc(t().contents)}</div><ol>`;
      for(const c of list) h += `<li><a href="#s=${esc(c.n)}"><span class="n">${esc(c.n)}</span><span>${esc(sTitle(c))}</span></a></li>`;
      h += "</ol></div>";
    }
    const own = sBody(s);
    if(own && own.trim()) h += `<hr class="hr"><div class="prose">${bodyHtml(s)}</div>`;
  } else {
    if(kids.length){
      h += `<div class="toc"><div class="toc-h">${esc(t().inThis)}</div><ol>`;
      for(const c of kids) h += `<li><a href="#s=${esc(c.n)}"><span class="n">${esc(c.n)}</span><span>${esc(sTitle(c))}</span></a></li>`;
      h += "</ol></div>";
    }
    h += `<hr class="hr">`;
    const own = sBody(s);
    if(own && own.trim()) h += `<div class="prose">${bodyHtml(s)}</div>`;
    for(const c of kids){
      const lvl = c.n.split(".").length === 4 ? 3 : 2;
      const ca = sAlt(c);
      h += `<section class="sub" id="sub-${esc(c.n)}">
        <div class="sh-n">${esc(c.n)}</div>
        <h${lvl} class="sh">${esc(sTitle(c))}</h${lvl}>
        ${ca ? `<p class="sh-alt">${esc(ca)}</p>` : ""}
        <div class="prose">${bodyHtml(c)}</div></section>`;
    }
  }
  const v = document.getElementById("view");
  v.innerHTML = h;
  linkTerms(v, home);
}

function draw(scrollTo){
  document.getElementById("bTitle").textContent = t().title;
  document.getElementById("bSub").textContent = t().sub;
  document.getElementById("q").placeholder = t().search;
  document.getElementById("foot").textContent = t().foot;
  document.getElementById("lRu").setAttribute("aria-pressed", lang === "ru");
  document.getElementById("lEn").setAttribute("aria-pressed", lang === "en");
  const navB = document.getElementById("navBtn");
  if(navB) navB.textContent = document.getElementById("rail").classList.contains("open") ? t().navClose : t().navOpen;
  hideTip();
  drawPage();
  drawRail();

  const i = pageIdx.get(cur);
  const pv = i > 0 ? PAGES[i - 1] : null, nx = i < PAGES.length - 1 ? PAGES[i + 1] : null;
  const pb = document.getElementById("prev"), nb = document.getElementById("next");
  pb.disabled = !pv; nb.disabled = !nx;
  pb.textContent = pv ? "← " + sTitle(pv) : t().prev;
  nb.textContent = nx ? sTitle(nx) + " →" : t().next;
  pb.onclick = () => { if(pv) go(pv.n); };
  nb.onclick = () => { if(nx) go(nx.n); };

  /* Заголовок и язык документа во встроенном режиме не трогаем: это чужая страница. */
  if(!EMBED){
    document.documentElement.lang = lang;
    document.title = sTitle(byNum.get(cur)) + " · " + t().title;
  }

  const anchor = scrollTo ? document.getElementById("sub-" + scrollTo) : null;
  if(EMBED){
    /* Прокрутку делает внешняя страница — сообщаем ей, куда встать. */
    const off = anchor ? Math.max(0, anchor.getBoundingClientRect().top + window.scrollY - 8) : 0;
    postSize();
    try{ window.parent.postMessage({ cwn:"scroll", wwn:"scroll", offset:off }, "*"); }catch(e){}
    return;
  }
  if(anchor){ anchor.scrollIntoView({ block:"start", behavior:"instant" }); return; }
  window.scrollTo({ top:0, behavior:"instant" });
}

/* Сообщаем внешней странице нужную высоту рамки, чтобы у неё не появлялась
   вторая полоса прокрутки. */
function postSize(){
  if(!EMBED) return;
  const wrap = document.querySelector(".wrap");
  const top = document.querySelector(".top");
  let h = 0;
  if(wrap && top){
    /* высота шапки плюс высота содержимого: обе меряются по своим коробкам
       и от размера рамки не зависят */
    h = Math.ceil(top.getBoundingClientRect().height + wrap.getBoundingClientRect().height);
  }
  if(!h) h = Math.ceil(document.body.getBoundingClientRect().height);
  if(!h) h = document.body.scrollHeight;
  try{ window.parent.postMessage({ cwn:"height", wwn:"height", height:h }, "*"); }catch(e){}
}
if(EMBED){
  window.addEventListener("load", postSize);
  if(window.ResizeObserver) new ResizeObserver(postSize).observe(document.body);
  else window.addEventListener("resize", postSize);
}

function go(num){
  const page = pageFor(num);
  const anchor = page === num ? null : num;
  cur = page;
  location.hash = "s=" + num;
  draw(anchor);
}

/* ── события ── */
function setLang(l){
  if(l === lang) return;
  lang = l; localStorage.setItem("wwn-lang", l);
  buildTerms(); draw();
}
document.getElementById("lRu").onclick = () => setLang("ru");
document.getElementById("lEn").onclick = () => setLang("en");

/* ── список разделов на узком экране ── */
const navBtn = document.getElementById("navBtn");
const railEl = document.getElementById("rail");
function setNav(open){
  railEl.classList.toggle("open", open);
  document.body.classList.toggle("nav-open", open && !EMBED);
  navBtn.setAttribute("aria-expanded", open ? "true" : "false");
  navBtn.textContent = open ? t().navClose : t().navOpen;
  if(open){
    /* Шапка переносится по строкам, поэтому её высоту берём каждый раз заново. */
    const h = document.querySelector(".top").offsetHeight;
    railEl.style.top = h + "px";
    railEl.scrollTop = 0;
  } else {
    railEl.style.top = "";
  }
}
navBtn.onclick = () => setNav(!railEl.classList.contains("open"));
window.addEventListener("resize", () => {
  if(window.innerWidth > 760) setNav(false);
  else if(railEl.classList.contains("open")) railEl.style.top = document.querySelector(".top").offsetHeight + "px";
});

const qEl = document.getElementById("q");
qEl.oninput = () => { query = qEl.value; drawRail(); };
qEl.onkeydown = e => { if(e.key === "Escape"){ qEl.value = ""; query = ""; qEl.blur(); drawRail(); } };
document.addEventListener("keydown", e => {
  if(e.key === "/" && document.activeElement !== qEl){ e.preventDefault(); qEl.focus(); qEl.select(); }
});
document.addEventListener("click", e => {
  const g = e.target.closest("[data-go]");
  if(g){ hideTip(); go(g.dataset.go); return; }
  const tm = e.target.closest(".term");
  if(tm){
    const rec = TERMS.get(tm.dataset.term);
    if(rec){ hideTip(); go(rec.sec); return; }
  }
  const b = e.target.closest("[data-sec]");
  if(b){ setNav(false); go(b.dataset.sec); return; }
  const a = e.target.closest(".toc a");
  if(a){ e.preventDefault(); setNav(false); go(a.getAttribute("href").replace("#s=", "")); return; }
});

function fromHash(){
  const h = decodeURIComponent(location.hash.replace(/^#/, ""));
  const m = h.match(/^s=(.+)$/);
  if(m && byNum.has(m[1])){
    const page = pageFor(m[1]);
    cur = page;
    return page === m[1] ? null : m[1];
  }
  return undefined;
}
window.addEventListener("hashchange", () => { const a = fromHash(); if(a !== undefined) draw(a); });

buildTerms();
const a0 = fromHash();
draw(a0 === undefined ? null : a0);
</script>
</body>
