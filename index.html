 with a burst of tremendous speed as their localized time begins to flow more rapidly. For 1d4+1 rounds, all subjects get an extra Main Action during their turn. This Main Action may not be used to cast spells or use arts. This spell severely taxes those who take advantage of it, adding 1 System Strain for each round in which the recipient takes the bonus action.\n### Scorn the Fetters of Earth\n**Level 3**\nThe caster and up to one visible ally per caster level are briefly granted the ability to move in three dimensions, being able to walk and run upward into the air as easily as along flat ground. For the rest of the scene, those affected can move in such a way, remaining suspended in the air after their movement for the round. When the spell ends, either naturally or upon being dispelled, all affected targets float gently to the ground. Optionally, the caster can instead use this spell on one visible flying creature per caster level, which must make a Physical save at a penalty equal to the caster’s Magic skill or be forced to land as they had fallen half the distance they had descended. For the rest of the scene, such creatures remain grounded and unable to fly.\n### Sigil of Aeolian Auctoritas\n**Level 4**\nA fierce gust of wind may be conjured in a line a hundred feet long and thirty feet wide. All creatures of man-size or smaller must make Physical saves or be bowled over and blown back thirty feet, losing their next round’s Main Action and suffering 1d6 damage. Light wooden constructions or similar structures are flattened by the wind.\nIf used outdoors, the spell can instead control the local weather, transforming the quarter-mile around the caster into any climate found normally at that location at any point during the year. The spell cannot summon a tornado or other extreme weather, but it can call rain and conventional storms sufficient to cause flooding in areas prone to it. The gust of wind is instantaneous, but the weather change lasts for one hour per caster level before reverting to its natural state.\n### The Torment of Tumefaction\n**Level 3**\nA single visible living creature is smote with a hideous curse of torment. Boils erupt all over their body, blood weeps from their orifices, tumors engorge their flesh, and all of their hair falls out almost instantaneously. If they perform any vigorous physical action save movement they incur two points of damage per caster level from the effects of the curse, damage which can be suffered no more than once per round by a target. A creature may spend its Main Action to attempt a Physical save to throw off the curse and return to a glabrous normalcy, but on a failure, the curse remains for the rest of the scene. If the creature has fewer hit dice than the caster has levels, a single failed save means the curse lasts indefinitely, until dispelled or until the caster releases them.\n### Touch of Elucidating Intangibility\n**Level 3**\nThe caster touches a solid non-magical barrier when casting this spell. A 10 foot cube of the barrier then becomes perfectly transparent on the caster’s side, allowing them to see and hear whatever lies on the other side as if it were well-lit and visible. Optionally, the caster may make the barrier insubstantial for one round per caster level, allowing anyone to pass or shoot through it from either side. The barrier always appears solid and opaque from the other side, even while the caster is peering through. If someone is caught within the barrier when it becomes solid again, they’re spat out on the nearest clear side and suffer 2d10 damage. The spell ends when the caster ceases to touch the barrier or immediately after it has been made insubstantial.\n### Vallation of Specified Exclusion\n**Level 3**\nThe caster must form some sort of line as part of this spell’s invocation, either with dropped powders or a trace drawn in the dirt or a more permanent inlay into a floor. In extremis, the caster can make such a line as part of a Move action, tracing it out or scattering powder as they go. The line itself may be no longer than twenty feet per caster level, and may be straight or curved as the caster wishes. Once it has been drawn, this spell may be cast, empowering the line with the ability to ward off a particular target and prevent them or their powers from crossing or being made to cross the line, as if it were a physical wall. The caster can nominate any kind of target to be warded that could be distinguished without need for knowing their thoughts, such as “humans” or “non-humans” or “men wearing the livery of the baron”. The barrier extends a hundred feet upward and ten feet downward and blocks any attack or magical power used by those warded. If the excluded creatures are attacked or targeted by powers from the other side of the barrier, however, the entire field shatters. The barrier lasts until dispelled, the caster drops it, or until one hour has passed per caster level.\n### Velocitous Imbuement\n**Level 1**\nUnlike most spells, this one may be cast as a simple On Turn action, targeting up to one visible willing creature per caster level within one hundred feet. Enchanted creatures become incredibly fleet of foot, doubling their usual ground movement rate and becoming capable of running up walls and across ceilings without falling, provided they end their round upright on a navigable surface. They may also move away from melee opponents without needing to make a Fighting Withdrawal to avoid a parting attack, and may pass through and around armed foes who do not completely physically block their path. The spell lasts for the remainder of the scene and adds 1 System Strain to those who take advantage of it.\n### The Verdant Vallation\n**Level 2**\nA vast wall of thick, heavy vines and other plant life blooms from a visible point within one hundred feet per caster level. The wall is up to twenty feet high and three feet thick and runs for as much as twenty feet in width per caster level. The vine wall can be shaped as the caster wishes within the spell’s area of effect, so long as it’s contiguous, and may be laid horizontally if a bridge or roof is desired. Enemies must inflict five hit points of damage per caster level to cut a man-sized hole in the vines, and they must be using weapons or means that could actually cut through a wooden wall to do any meaningful harm. The vines may be optionally covered in long, vicious thorns to discourage climbing, inflicting 2d6 damage on any creature who tries to climb over it. If the vine wall is summoned from earth that could plausibly support plant life, it remains until dispelled or until it dies naturally. If called from bare stone or other infertile soils, it withers away to dust at the end of the scene.\n### Visitation of the Clement Clime\n**Level 2**\nThe caster and up to three visible allies per caster level are shielded from the excesses of hostile elemental energies, becoming immune to mundane extremes of heat and cold and natural acids or electrical discharges. Against magical harm of this nature, they automatically take only half the damage they normally would, or none if they make a successful Physical saving throw. This spell lasts for one hour per caster level.\n### Wardpact Invocation\n**Level 1**\nThis spell may be cast in two different forms. If it targets a creature within 200 feet, the target becomes partially immune to physical weapons; any weapon hit on them requires the attacker make a successful Physical save or the hit is negated. This effect lasts for one round per two caster levels, rounded up, and can’t target the caster. If it targets a visible weapon within two hundred feet, that weapon is rendered entirely harmless and unable to inflict damage for the rest of the scene, with no saving throw. The spell may only affect a given target or weapon once per scene and natural body weapons aren’t affected.\n### The Wind of the Final Repose\n**Level 1**\nThe mage designates a visible point within two hundred feet. A silent, invisible burst of soporific influence erupts from that point, targeting all living creatures within a twenty-foot radius. All such targets with 4 or fewer hit dice within that area fall unconscious instantly, and can be roused only by damage or by a Main Action used to kick them awake. If not roused, they revive at the end of the scene. Entities that do not sleep are immune to this spell.","ru":"Изучать и читать заклинания Высшей магии может любой заклинатель, хотя именно у Высших магов обычно есть Искусства, лучше всего подходящие для усиления этих чар и управления ими.\n\n### Адский потоп\n**Уровень 5**\n\nКолдующий обрушивает всепожирающее разрушение на видимую точку в пределах трёх тысяч футов. Ливень потусторонней погибели изливается с небес на всё в радиусе до двухсот футов за уровень колдующего, нанося 1d8 урона за уровень колдующего с Физическим спасброском для половины урона и автоматически убивая все цели с 4 и менее Костями здоровья. Этого урона достаточно, чтобы уничтожить любую деревянную или легко сложенную каменную постройку; серьёзно пострадают даже укрепления. Колдующий может сузить радиус до минимума в 20 футов, но не может выбирать цели внутри этой области. Это заклинание нельзя читать в помещении, и оно крайне опасно для самого колдующего: при чтении он должен пройти Ментальный спасбросок или получить четверть нанесённого урона, округляя вверх.\n\n### Благоразумное временное отречение от жизни\n**Уровень 2**\n\nЭто заклинание можно прочесть Мгновенным действием, даже если в том же раунде уже было прочитано другое; целью служит сам колдующий или согласная видимая цель. Применить его можно лишь в немедленный ответ на рану, доведшую цель до нуля пунктов здоровья. Тогда цель претерпевает эффектную и подчёркнуто очевидную смерть: смертельные удары раскраивают её надвое или кроваво разделывают. Для любого обыденного и магического осмотра она мертва. Однако в срок до двух часов, по усмотрению цели, её разрозненные останки стекаются воедино и восстанавливают её тело с двумя пунктами здоровья за уровень колдующего и двумя дополнительными пунктами Системной нагрузки. Если же останки цели намеренно раскиданы по округе, сожжены или полностью съедены, ей не воскреснуть. Пока субъект «мёртв», он сознаёт происходящее вокруг.\n\n### Буря страха\n**Уровень 3**\n\nВолна леденящего ужаса прокатывается по всем врагам колдующего в сорока футах. Они должны немедленно пройти проверку боевого духа со штрафом -1; провал обращает их в бегство. Прошедшие проверку получают один пункт урона за уровень колдующего от подавленности и отчаяния; доведённые этим до нуля пунктов здоровья вместо того остаются с одним пунктом здоровья и бегут. Это заклинание не действует на существ, не знающих страха или имеющих Боевой дух 12.\n\n### Вал избирательного запрета\n**Уровень 3**\n\nЧастью воззвания этого заклинания колдующий должен провести некую линию: рассыпать порошок, прочертить след в пыли или выложить более постоянную инкрустацию в полу. В крайности колдующий может провести такую линию частью Действия перемещения, вычерчивая её или рассыпая порошок на ходу. Сама линия может быть не длиннее двадцати футов за уровень колдующего и, по желанию колдующего, прямой или изогнутой. Когда она проведена, можно прочесть это заклинание, наделив линию способностью отвращать определённую цель: ни она сама, ни её силы не смогут пересечь линию — по своей воле или чужой, — словно это физическая стена. Колдующий может назначить отвращаемой любую разновидность целей, которую можно различить без знания их мыслей: «люди», «нелюди», «мужчины в ливрее барона». Преграда простирается на сто футов вверх и десять футов вниз и останавливает любую атаку и магическую силу отвращённых. Но если отвращённых существ атакуют или выбирают целью сил с другой стороны преграды, всё поле разбивается. Преграда держится, пока её не развеют, пока колдующий не снимет её или пока не пройдёт один час за уровень колдующего.\n\n### Ветер последнего покоя\n**Уровень 1**\n\nМаг назначает видимую точку в пределах двухсот футов. Из неё вырывается беззвучная незримая волна усыпляющего влияния, целящая во всех живых существ в двадцатифутовом радиусе. Все такие цели с 4 и менее Костями здоровья в этой области мгновенно засыпают; разбудить их можно только уроном или Основным действием, потраченным на то, чтобы растолкать их пинками. Если их не будить, они приходят в себя в конце сцены. Сущности, которые не спят вовсе, к этому заклинанию невосприимчивы.\n\n### Воззвание к несокрушимой цитадели\n**Уровень 5**\n\nКолдующий вздымает магический щит, непроницаемый почти для любых враждебных сил. В отличие от большинства чар, это заклинание можно прочесть Мгновенным действием: вокруг колдующего немедленно возникает прозрачный пузырь силы радиусом до двадцати футов. Сущности и силы снаружи пузыря не могут проникнуть внутрь, а внутри сохраняется тёплая, пригодная для дыхания, безопасная среда, что бы ни творилось снаружи. Находящиеся в пузыре могут выйти из него, но вернуться назад уже не смогут. Пузырь можно развеять подобающей магией, но иные чары и атаки ему не вредят, и ни магические эффекты, ни материальные предметы не проходят сквозь него ни в ту, ни в другую сторону. Заклинание длится, пока колдующий не покинет пузырь.\n\n### Вой света\n**Уровень 3**\n\nСплющенный диск чудовищного жара, грохота и ударной волны вспыхивает в видимой точке в пределах пятидесяти футов за уровень колдующего, взрываясь в радиусе двадцати футов при высоте восемь футов. Всё в этой области получает 1d8 урона за уровень колдующего от пламени, сотрясения и звукового удара, со спасброском Уклонения для половины. Если заклинание применено в пространстве шириной менее 40 футов, взрыв устремляется по смежным помещениям и проходам ещё на 1d6 × 10 футов.\n\n### Вывернуть нутро\n**Уровень 4**\n\nВыбирается одна видимая цель, и всё содержимое, какое в ней есть, извлекается и ложится в руки колдующего. Если заклинание применено к шкафу, заплечному мешку, карману или иному вместилищу, оно должно быть не крупнее гардероба; колдующий мгновенно узнаёт обо всём его содержимом в момент чтения и волен решать, какие именно предметы изнутри принять, а какие нет. Если заклинание применено к существу, оно пытается вырвать его внутренности: если у жертвы столько же или меньше Костей здоровья, чем у колдующего, она должна пройти Физический спасбросок или умереть на месте. Погибнет она или нет, она получает 1d10 урона за уровень колдующего, с Физическим спасброском для половины.\n\n### Выдох леденящего холода\n**Уровень 3**\n\nКолдующий призывает порыв глубочайшей зимы на точку в пределах ста футов за уровень, замораживая всё в радиусе до десяти футов за уровень колдующего. Все жидкости промерзают насквозь на глубину два фута, а все живые существа, не защищённые от арктической стужи, получают 1d6 урона за каждые два уровня колдующего, с Физическим спасброском для половины урона. Провалившие Физический спасбросок цепенеют от холода и теряют Действие перемещения каждый раунд в течение следующих 1d4 раундов. Замороженная область оттаивает с обычной для окружающей среды скоростью.\n\n### Гулкое эхо времени\n**Уровень 2**\n\nКолдующий наполняет до одного видимого союзника за уровень колдующего порывом чудовищной скорости: их локальное время начинает течь быстрее. В течение 1d4+1 раундов все субъекты получают лишнее Основное действие в свой ход. Этим Основным действием нельзя читать заклинания и пользоваться Искусствами. Заклинание тяжко изнуряет тех, кто им пользуется: получатель прибавляет 1 Системной нагрузки за каждый раунд, в котором тратит бонусное действие.\n\n### Долгий янтарный миг\n**Уровень 1**\n\nЭто заклинание можно прочесть Действием в свой ход, если в этом раунде не было прочитано другого, и нацелить на одно согласное или беспомощное существо, которого колдующий касается. Субъект выводится из течения обычного времени: он застывает, очерченный бледным сепийным светом. Он и все его носимые пожитки становятся неуязвимы для любого немагического вреда и заморожены во временном стазисе, пока заклинание не кончится или не будет развеяно. Зачарованные существа весьма легки, но из-за своей неухватистости считаются четырьмя предметами Загруженности. Заклинание кончается, когда маг его отпустит, но не позже одного дня за уровень колдующего. Прочитав его на самого себя, маг не может прервать его до истечения полного срока.\n\n### Заклятие оберегающего пакта\n**Уровень 1**\n\nЭто заклинание читается в двух разных видах. Если целью выбрано существо в пределах 200 футов, оно становится частично неуязвимым для физического оружия: при любом попадании оружием по нему атакующий должен пройти успешный Физический спасбросок, иначе попадание отменяется. Этот эффект длится один раунд за каждые два уровня колдующего, округляя вверх, и не может быть нацелен на самого колдующего. Если же целью выбрано видимое оружие в пределах двухсот футов, это оружие становится совершенно безвредным и неспособным наносить урон до конца сцены — без всякого спасброска. Заклинание может подействовать на данную цель или оружие лишь раз за сцену; естественное телесное оружие не затрагивается.\n\n### Зелёный вал\n**Уровень 2**\n\nИз видимой точки в пределах ста футов за уровень колдующего вырастает обширная стена толстых, тяжёлых лоз и другой зелени. Стена — до двадцати футов в высоту и трёх футов в толщину, длиной до двадцати футов за уровень колдующего. Стену из лоз можно выгибать по желанию колдующего в пределах области действия заклинания, лишь бы она оставалась сплошной; её можно уложить и горизонтально, если нужен мост или крыша. Чтобы прорубить в лозах дыру в человеческий рост, врагам нужно нанести пять пунктов урона за уровень колдующего, причём оружием или средствами, способными в принципе прорубить деревянную стену, — иначе сто́ящего вреда не будет. По желанию лозы можно покрыть длинными злыми шипами, отбивающими охоту лезть: любое существо, пытающееся перелезть стену, получает 2d6 урона. Если стена лоз призвана из земли, которая правдоподобно могла бы питать растения, она стоит, пока её не развеют или пока она не умрёт естественным порядком. Вызванная же из голого камня или иной бесплодной почвы, она истлевает в прах в конце сцены.\n\n### Земля как глина\n**Уровень 5**\n\nКолдующий лепит из почвы и камня окрестных земель, поднимая холмы, роя рвы и выводя простые постройки из выдавленной скальной породы. После чтения маг может психически формовать рельеф в пределах трёхсот футов за уровень колдующего, медленно, в течение часа, придавая ему любую желаемую форму — лишь бы использованный материал был вообще способен такую форму удержать. Из скальной породы и доступного камня можно возводить простые здания и стены; туннели и пещеры можно прокладывать на глубину до 50 футов под колдующим, а холмы — поднимать до 200 футов над окружающим уровнем земли. Это заклинание не работает в пределах тысячи футов от камня или земли, существенно обработанных разумными существами, однако использование этого заклинания тем же колдующим при последующих чтениях обработкой земли не считается.\n\n### Изгнание в лабиринт чёрного стекла\n**Уровень 5**\n\nНацеленное на видимую точку в пределах трёхсот футов, заклинание действует на всех существ, кроме колдующего, в десятифутовом радиусе от цели, перенося их в лишённый света внепространственный лабиринт бесконечно высоких обсидиановых стен. Лабиринт бесконечен, безлик и пуст. Перенесённые существа получают Ментальный спасбросок, чтобы прервать заклинание и вновь появиться через раунд после его чтения. Провалившие спасбросок могут повторять попытку раз в час. Существа с пятью и менее Костями здоровья права на эти спасброски не имеют и заперты навеки, пока маг не будет убит или не прекратит заклинание. Время в ловушке течёт обычным порядком: угодившие туда существа могут отдыхать, драться или голодать, как подскажут им обстоятельства и воля. Погибшие и вырвавшиеся существа появляются в ближайшем свободном месте от точки своего исчезновения.\n\n### Искоренение чар\n**Уровень 2**\n\nКолдующий сметает все нежеланные магические эффекты и чары в двадцатифутовом радиусе с центром в любой видимой точке в пределах ста футов за уровень. Если магический эффект был создан существом с числом Костей здоровья или уровней не выше, чем у колдующего, эффект отменяется автоматически. Иначе нужна встречная проверка Инт/Магия или Хар/Магия: колдующий более высокого уровня получает +2 к своему броску, а при равенстве побеждает развеивающий. Этому заклинанию не хватает силы, чтобы навсегда подавить постоянные магические эффекты: даже для временного их подавления нужна упомянутая встречная проверка. При успехе эффект отменяется на 1d6 раундов. Если заклинание прочитано на очень большие чары, подавляется лишь их часть в зоне действия заклинания.\n\n### Исторжение внутреннего ока\n**Уровень 2**\n\nЗаводь воды, зеркало, открытое пламя, полированный кристалл или иная светящаяся либо отражающая поверхность служит для того, чтобы всмотреться в далёкое место. Оно должно либо лежать в пределах ста футов за уровень колдующего, либо быть местом, где колдующий когда-то физически побывал. Колдующий воспринимает место так, будто стоит в намеченной внутри него точке, видя и слыша происходящее, словно присутствует там. Это заклинание не может заглянуть в места, ограждённые магией, а повторное дальновидение одного и того же места затруднено резонансом, который создаёт само заклинание. Заклинание не может воспринимать ту же область дважды за одну неделю или помещать точку обзора так, чтобы восприятие пересеклось с прежней областью в этот срок. Если у кого-то из присутствующих в области больше Костей здоровья, чем у колдующего уровней, он получает Ментальный спасбросок: при успехе его охватывает жуткое чувство, что за ним наблюдают, — знающих об этом заклинании такое насторожит. Заклинание длится, пока колдующий не совершит какое-либо действие, кроме сосредоточения на дальновидении.\n\n### Исчисление призванного слуги\n**Уровень 2**\n\nЭто заклинание призывает колдующему разумного фамильяра: у него один пункт здоровья за уровень колдующего, КЗщ 14, скорость перемещения по земле 30 футов за действие, спасброски как у колдующего, модификатор навыков +0 и никакой действенной атаки. Фамильяр всегда принимает один и тот же облик для одного и того же колдующего, хотя при первом чтении этот облик можно задать любым по желанию колдующего — лишь бы не крупнее небольшого человека. Фамильяр сохраняет телепатическую связь со своим создателем и исполнит любой отданный приказ, включая самоубийственные. Он способен на любое действие, посильное умелому слуге-человеку. Сражённый фамильяр истаивает, но заклинание может призвать его вновь. Фамильяр помнит всё, что происходило, пока он был призван, и со временем может обзавестись собственным характером. Фамильяр существует до рассвета после чтения заклинания или пока колдующий его не отпустит.\n\n### Исчисление призрачного эйдолона\n**Уровень 4**\n\nКолдующий создаёт полуреальное призрачное существо любого облика и вида, какого пожелает, — лишь бы оно было не крупнее вола. Слуга разумен как человек и повинуется колдующему с бесстрашной, самоубийственной преданностью; у него 4 эффективные Кости здоровья, 20 пунктов здоровья, КЗщ 15, скорость перемещения 30 футов за действие, модификатор навыков +1, спасброски 13+ и атака ближнего боя +6/1d8 урона с Шоком 2/КЗщ 15. Существо отчасти призрачно, потому наносимый им урон не может убить жертву — лишь свалить её без сознания на час, после чего та очнётся с 1 пунктом здоровья. Призывая существо, колдующий может выбрать ему одно особое качество: полёт со скоростью 30 футов за перемещение, совершенное подобие конкретного человека, которого колдующий видел, телепатическую речевую связь с колдующим или умение толково пользоваться обычным оружием и бронёй. Слуга существует, пока не уничтожен, или до рассвета после чтения заклинания.\n\n### Касание проясняющей бесплотности\n**Уровень 3**\n\nЧитая это заклинание, колдующий касается сплошной немагической преграды. 10-футовый куб преграды становится совершенно прозрачным со стороны колдующего, позволяя ему видеть и слышать всё, что лежит по ту сторону, как если бы оно было хорошо освещено и на виду. По желанию колдующий может сделать преграду бесплотной на один раунд за уровень колдующего, позволяя кому угодно проходить и стрелять сквозь неё с обеих сторон. С другой стороны преграда всегда выглядит сплошной и непрозрачной — даже пока колдующий смотрит сквозь неё. Если кто-то оказался внутри преграды в миг, когда она вновь стала твёрдой, его выплёвывает на ближайшую свободную сторону, и он получает 2d10 урона. Заклинание кончается, когда колдующий перестаёт касаться преграды, либо сразу после того, как она побывала бесплотной.\n\n### Личина совершенного подобия\n**Уровень 3**\n\nКороткая инкантация превращает до одной видимой согласной цели за уровень колдующего в совершенное подобие любого гуманоидного существа, которое колдующий видел прежде, — будь то конкретная личность или общий типаж. Превращение не даёт никаких особых способностей, но цель будет в точности походить на избранную личность, вплоть до голоса и запаха. Её немагическая одежда превратится в ту, что подобает образу, а сама цель обретёт интуитивную способность говорить на родном языке образа и понимать его. Заклинание длится до рассвета следующего после чтения дня, после чего цели и вся превращённая одежда возвращают исходный облик.\n\n### Мантия разъятия и рассечения\n**Уровень 2**\n\nВидимое согласное существо в тридцати футах окружает вихрь бритвенно-острых осколков энергии. Всякий, кто попытается коснуться цели или атаковать её в ближнем бою, должен пройти спасбросок Уклонения или получить 1d6 урона плюс уровень колдующего до разрешения своей атаки. Поле клинков не разбирает своих и чужих и заденет даже союзника, пытающегося коснуться цели. Клинки держатся, пока цель тратит Действие перемещения каждый раунд, чтобы не разрушить их изнутри, — самое большее одну сцену.\n\n### Мука распухшей плоти\n**Уровень 3**\n\nОдно видимое живое существо поражается отвратительным проклятием мучений. По всему его телу вскипают нарывы, из отверстий тела сочится кровь, плоть вздувается опухолями, и почти мгновенно выпадают все волосы. Если оно совершает любое энергичное физическое действие, кроме перемещения, эффекты проклятия наносят ему два пункта урона за уровень колдующего; этот урон цель может понести не чаще раза за раунд. Существо может потратить Основное действие на попытку Физического спасброска, чтобы сбросить проклятие и вернуться к гладкой, безволосой норме, но при провале проклятие остаётся до конца сцены. Если Костей здоровья у существа меньше, чем уровней у колдующего, единственный проваленный спасбросок означает, что проклятие держится бессрочно — пока его не развеют или пока колдующий не отпустит жертву.\n\n### Наделение стремительностью\n**Уровень 1**\n\nВ отличие от большинства заклинаний, это можно прочесть простым Действием в свой ход, выбрав целью до одного видимого согласного существа за уровень колдующего в пределах ста футов. Зачарованные существа становятся невероятно быстроноги: их обычная скорость перемещения по земле удваивается, и они могут взбегать по стенам и пробегать по потолкам, не падая, если заканчивают свой раунд стоя на пригодной для этого поверхности. Они также могут отходить от противников в ближнем бою, не совершая Боевого отхода и не опасаясь атаки вдогонку, и проходить сквозь ряды вооружённых врагов и мимо них, если те не перекрывают их путь полностью физически. Заклинание длится до конца сцены и прибавляет 1 Системной нагрузки тем, кто им воспользовался.\n\n### Неизбывные оковы воли\n**Уровень 1**\n\nМаг выбирает целью видимое живое существо в пределах 100 футов. Жертва должна немедленно пройти Ментальный спасбросок со штрафом, равным навыку Магия колдующего, или попасть в рабство его воли. Такие жертвы исполняют любые физические приказы колдующего, кроме тех, что выглядят самоубийственными или явно рассчитанными на их убийство. Колдующий не может приказать существу отвечать на вопросы или совершать поступки, требующие самостоятельного суждения, равно как и пользоваться нефизическими способностями или заклинаниями, — но существо будет сражаться за колдующего или в защиту собственной жизни. Порабощённые жертвы выглядят вялыми и одурманенными и по своей воле действуют лишь ради самозащиты или удовлетворения своих нужд. Заклинание держится, пока его не развеют, пока колдующий не умрёт или не отпустит жертв. Однако при каждом новом чтении этого заклинания все прежние жертвы получают немедленный немодифицированный Ментальный спасбросок, чтобы сбросить его. Если у существа больше Костей здоровья, чем у колдующего, оно получает немодифицированный спасбросок для прекращения эффекта всякий раз, когда его впервые за день заставляют делать что-то глубоко ему противное.\n\n### Неотвратимое вменение\n**Уровень 2**\n\nЧастью чтения этого заклинания колдующий произносит одно-единственное утверждение в одно предложение; процесс столь тонок, что кажется не более чем обычным разговором. Все, кто слышит речь колдующего в радиусе сорока футов, должны пройти Ментальный спасбросок или немедленно поверить в истинность сказанного — если только оно не кажется им физически невозможным или не является эмоционально нестерпимым. Слушатели должны понимать язык колдующего; при чтении заклинания колдующий может изъять из-под этого морока до двух целей за уровень колдующего, чтобы не заморочить собственных спутников. Действие заклинания сохраняется один час за уровень колдующего, после чего уверовавшие останутся убеждены в сказанном не больше, чем позволят события и их собственный здравый смысл.\n\n### Неощутимое выведывание мыслей\n**Уровень 1**\n\nМаг сосредоточивается на видимом живом существе в пределах 100 футов за уровень колдующего. До конца сцены он немедленно получает представление о поверхностных мыслях и интересах цели, понимая их даже при отсутствии общего языка. Колдующий может задать памяти цели один вопрос за уровень колдующего, но каждый вопрос грозит разорвать заклинание: перед ответом цель может пройти Ментальный спасбросок, и при успехе заклинание кончается. Эти вопросы могут лишь запрашивать воспоминания, но не принуждать к суждению или домыслу. Это заклинание очень тонко в исполнении и может быть прочитано без всяких видимых жестов и слышимых инкантаций.\n\n### Нефритовый паланкин безликого бога\n**Уровень 2**\n\nЭто заклинание призывает парящий паланкин из зелёного камня, покрытого затейливой резьбой. В центре платформы стоит тонкая трёхфутовая статуя безликого существа, по углам поднимаются четыре стройных столбика, а крыша и бока задрапированы золотой тканью с металлическим отливом. Сам паланкин двенадцати футов в длину и восьми в ширину — места хватит, чтобы усадить нескольких человек. Он парит на высоте плеча над землёй или поверхностью жидкости под ним. Сам он не движется, но его может тянуть за собой даже один носильщик человеческих размеров. Общий груз на паланкине не может превышать двух тысяч фунтов, иначе он оседает наземь. Он существует до заката, до рассвета или пока статую бога не ударят или не оскорбят — смотря что случится раньше.\n\n### Ниспослание благодатной погоды\n**Уровень 2**\n\nКолдующий и до трёх видимых союзников за уровень колдующего ограждаются от неистовства враждебных стихийных энергий, обретая невосприимчивость к обыденным крайностям жара и холода, природным кислотам и электрическим разрядам. От магического вреда той же природы они автоматически получают лишь половину обычного урона, а при успешном Физическом спасброске — никакого. Это заклинание длится один час за уровень колдующего.\n\n### Открыть горний путь\n**Уровень 5**\n\nКолдующий прорубает метапространственные врата между своим нынешним местоположением и заранее назначенной целевой точкой. Настройка целевой точки требует часа труда, после чего это заклинание сможет открыть к ней непрозрачный портал с расстояния до ста миль за уровень колдующего. Портал достаточно велик, чтобы пропустить телегу с возом, и остаётся открыт до одной минуты за уровень колдующего, закрываясь после прохода. Врата односторонние — только от колдующего к цели. Пройти могут лишь живые существа вместе с повозками, которыми они правят, и вещами, которые несут; воздух и прочая среда остаются по ту сторону врат. Одновременно для этого заклинания можно держать подготовленной лишь одну целевую точку, и при каждом чтении есть шанс 1 из 10, что подлинное место назначения окажется в 1d100 милях в случайном направлении, — обнаружится это лишь после того, как порталом воспользуются.\n\n### Отложенное иссечение чар\n**Уровень 4**\n\nКолдующий выстраивает отложенный резонанс развеивающей магии, который позже можно привести в действие Мгновенным действием. До следующего рассвета маг может Мгновенным действием отменять магию, как заклинанием Искоренение чар. Как только отмена приведена в действие, заклинание кончается.\n\n### Отречение от хода времени\n**Уровень 5**\n\nКолдующий и до одного видимого союзника за уровень колдующего ненадолго выходят из привычного течения времени, и весь остальной мир застывает вокруг них. Эти субъекты получают 1d4+1 свободных раундов действий, но не могут физически воздействовать на мир или сдвинуть любой предмет, которого не несли на себе в момент чтения заклинания. Любые заклинания, прочитанные колдующим или другими союзниками, действуют только на их собственную группу, но не на тех существ, что остались в обычном потоке времени.\n\n### Охряный сигил соположения\n**Уровень 4**\n\nЭто заклинание читается в две части, каждую из которых нужно прочесть отдельно, в пределах мили друг от друга, хотя такое парное использование занимает лишь одну ячейку заклинаний. Первое чтение наносит печать размером с ладонь из ржаво-бурого сияния на землю под колдующим. Второе чтение немедленно меняет местами колдующего и всех существ и все предметы в десяти футах от него со всеми существами и предметами в десяти футах от сигила. Колдующий по желанию может воздержаться от обмена отдельных целей. Переносятся только переносимые предметы: любой предмет, слишком тяжёлый для колдующего или закреплённый на месте, остаётся недвижим. Несогласные цели с четырьмя и менее Костями здоровья спасброска не получают; прочие могут пройти Ментальный спасбросок. Неиспользованные сигилы рассеиваются за день.\n\n### Перемалывающий гейс\n**Уровень 4**\n\nОдно видимое живое существо поражается мрачным гейсом, принуждающим исполнить определённый наказ — иначе его ждёт всё более тяжкая напасть. Колдующий может наложить на цель один наказ в одно предложение — не самоубийственный, не бессрочно расплывчатый и не заведомо физически невыполнимый для неё. Так, можно гейсом заставить человека убить собственного сына или никогда не злоумышлять против своего господина, но нельзя всерьёз приказать крестьянину стать королём или связать кого-то вечным подчинением произвольным приказам хозяина. Если затем цель бросает гейсу вызов или неоправданно затягивает его исполнение, её поражает мучительная прогрессирующая иссушающая болезнь, которая неизбежно убьёт её за 1d6 недель, давая -2 к броскам атаки и -1 к проверкам навыков за каждую прошедшую неделю и уполовинивая максимум её пунктов здоровья. Если жертва после этого вновь начинает исполнять гейс или проклятие снято, болезнь останавливается и отступает с той же скоростью, с какой развивалась. Цель, способная действовать, может пройти Ментальный спасбросок, чтобы воспротивиться этому заклинанию, — но не может, если она связана, без сознания или иначе усмирена. Проклятие держится, пока его не развеют или пока колдующий его не снимет.\n\n### Помрачение воли\n**Уровень 4**\n\nЭто заклинание применимо только к беспомощной или связанной живой жертве, которая получает Ментальный спасбросок, чтобы воспротивиться ему и навсегда обрести невосприимчивость к его эффектам. При провале цель через череду психических пут становится безнадёжно подвластна колдующему и покорно исполняет его волю. Цель должна быть способна понять желания колдующего, но исполнять их будет в полную меру своего разумения, умений и находчивости. Даже чтобы воспротивиться самоубийственным поступкам, ей нужно пройти Ментальный спасбросок. Заклинание держится, пока его не развеют или пока колдующий не отпустит цель. Колдующий не может держать под этим заклинанием больше существ, чем удвоенное число его уровней или Костей здоровья; при превышении этого числа первым освобождается самый ранний невольник. Существа под действием Помрачения воли выказывают множество мелких тиков и магически навязанных причуд поведения: случайных наблюдателей это может озадачить, а наблюдателю с навыком хотя бы Магия-0, следящему за ними хотя бы час, влияние на разум выдаст с головой.\n\n### Постижение тайной формы\n**Уровень 1**\n\nМаг открывает свой разум присутствию оккультных энергий. В течение пятнадцати минут за уровень персонажа он способен видеть действующие магические эффекты, проклятия, чары и прочие волшбы как цветные ауры или узоры света. Он может опознавать магические предметы, получая описание их назначения или самых значимых сил в одно предложение, а успешные проверки Мдр/Магия сложностью от 8 и выше — в зависимости от тонкости чар — дают ответы более изощрённые. Маги с подготовленными заклинаниями видны колдующему, хотя какие именно заклинания у них подготовлены — узнать нельзя. Побочный эффект заклинания: окружающие таумические токи источают достаточно квази-света, чтобы колдующий видел как обычно даже в полной темноте.\n\n### Превосходное прозрачное превращение\n**Уровень 1**\n\nМаг выбирает до одной видимой согласной цели за уровень колдующего в пределах 100 футов; после этого цели могут расходиться свободно. Цели и всё, что на них надето и при них, становятся совершенно прозрачными. Стрелковые атаки по невидимым врагам почти невозможны, а атаки ближнего боя по ним обычно получают штраф -4 к броскам атаки. Заклинание держится до часа за уровень колдующего, но рвётся, если субъект совершает какое-либо резкое движение — бежит, атакует, читает заклинание. Порвавшись для одного субъекта, оно рвётся для всех.\n\n### Презреть оковы земли\n**Уровень 3**\n\nКолдующий и до одного видимого союзника за уровень колдующего ненадолго обретают способность двигаться в трёх измерениях: идти и бежать вверх по воздуху так же легко, как по ровной земле. До конца сцены затронутые могут перемещаться таким образом, повисая в воздухе там, где закончили перемещение в этом раунде. Когда заклинание кончается — само или будучи развеянным, — все затронутые цели мягко опускаются наземь. По желанию колдующий может вместо этого применить заклинание на одно видимое летающее существо за уровень колдующего: каждое должно пройти Физический спасбросок со штрафом, равным навыку Магия колдующего, иначе оно будет принуждено приземлиться, как если бы упало с половины высоты своего снижения. До конца сцены такие существа остаются прикованы к земле и не способны летать.\n\n### Призрачное подражание\n**Уровень 1**\n\nМаг создаёт призрачную видимость в видимом месте в пределах 100 футов за уровень колдующего. Иллюзия может занимать число 10-футовых кубов, равное уровню колдующего, и включать зрительные, слуховые, обонятельные и даже осязательные элементы. Если у зрителей нет причин считать иллюзию ложной, они будут бессознательно двигаться и воспринимать сообразно её мнимым физическим свойствам: останавливаться перед стенами, шататься от воображаемых ударов, видеть свою одежду опалённой призрачным пламенем. Иллюзия ведёт себя и действует сама, следуя замыслу колдующего, но не может удалиться больше чем на сто футов от места, где была создана. Призрачные чудовища бьются с бонусом атаки колдующего, наносят 1d8 урона, имеют КЗщ 10 и исчезают от удара. Одновременно активных иллюзорных бойцов может быть не больше одного за каждые два уровня колдующего. Враги, доведённые до нуля пунктов здоровья, падают без сознания и приходят в себя через десять минут с 1 пунктом здоровья. Существа, убеждённые в ложности иллюзии, могут каждый раунд проходить Ментальный спасбросок, чтобы отвергнуть её психическое влияние и обрести невосприимчивость к её эффектам. Иллюзия держится, пока её не развеют, пока колдующий не отпустит её или пока это заклинание не будет прочитано снова.\n\n### Провидческое постижение\n**Уровень 3**\n\nКолдующий прощупывает ближние течения судьбы, чтобы различить вероятный ближайший исход поступка. Колдующий описывает конкретное действие, которое он или товарищ намерены вот-вот предпринять, и Мастер говорит, что вероятнее всего случится вследствие этого в первые пять минут после действия — так, как это кажется наиболее правдоподобным самому Мастеру. Это заклинание нельзя применять чаще раза в неделю к одной и той же общей теме.\n\n### Проклятие чувства\n**Уровень 1**\n\nКолдующий выбирает целью видимое существо в пределах двухсот футов. Цель получает Ментальный спасбросок для сопротивления: при провале одно чувство по выбору колдующего до конца сцены полностью в его власти, при успехе цель скована лишь на следующий раунд. Можно внушить любое ложное впечатление или скрыть любое истинное; существо можно фактически ослепить или лишить слуха. Отвлекающие осязательные ощущения могут вынуждать жертву каждый раунд проходить Физический спасбросок, чтобы действовать. Ослеплённые существа не могут атаковать на расстоянии, а все броски атак ближнего боя делают дважды, беря худший результат. Если существо считает, что ему грозит смертельная опасность, возбуждение позволяет ему в конце каждого раунда проходить Ментальный спасбросок, чтобы сбросить заклинание.\n\n### Пронзить бледные врата\n**Уровень 4**\n\nКолдующий открывает короткий пространственный разлом между двумя точками в пределах ста футов за уровень — при условии, что он видит обе точки или когда-то ранее физически побывал в них, и что между ними не меньше двадцати футов. Разлом образует проход, соединяющий две точки, достаточно широкий, чтобы проехала телега; те, кто по обе его стороны, могут смотреть сквозь врата и проходить в них. Окружающие среды вроде жидкостей и атмосфер через портал не переливаются: переносятся только намеренно направленные существа и предметы. Пройдя через портал, существо не может пройти через него снова до своего следующего хода. Портал остаётся открыт до одного раунда за уровень колдующего, но колдующий может закрыть его Мгновенным действием. Существ, частично находящихся в разломе при закрытии, выплёвывает на дальнюю сторону.\n\n### Разъятие времени вспять\n**Уровень 4**\n\nКолдующий может прочесть это заклинание Мгновенным действием на любое одно существо в пределах ста футов. Время слегка откатывается назад, позволяя цели переиграть текущий раунд действий, будто его не было, хотя все причастные сохраняют память о том, что случилось изначально. Это заклинание полезно только против целей, которые прямо сейчас выполняют действия своего раунда; если цель уже закончила действовать в этом раунде и начало действовать другое существо, пользоваться этим заклинанием поздно. Если цель не желает отката своего действия, она может пройти Ментальный спасбросок, чтобы воспротивиться заклинанию.\n\n### Сверкающий гроб\n**Уровень 1**\n\nТаумический разряд сосредоточивается на одном видимом существе в пределах ста футов за уровень колдующего, окутывая его смертоносной мантией потрескивающей энергии. Цель получает 1d8 урона за уровень колдующего, с Физическим спасброском для половины. Цели-NPC всего с 1 Костью здоровья гибнут неизбежно, каков бы ни был нанесённый урон. Заклинание не преграждается немагическими препятствиями между колдующим и целью, если колдующий видит её невооружённым взглядом.\n\n### Сигил эоловой власти\n**Уровень 4**\n\nМожно призвать свирепый порыв ветра полосой в сто футов длиной и тридцать футов шириной. Все существа человеческого размера и меньше должны пройти Физический спасбросок, иначе их сшибает с ног и отбрасывает на тридцать футов: они теряют Основное действие своего следующего раунда и получают 1d6 урона. Лёгкие деревянные постройки и подобные сооружения ветер сравнивает с землёй. Под открытым небом заклинание может вместо этого управлять местной погодой, преобразив четверть мили вокруг колдующего в любой климат, естественно встречающийся в этом месте в любую пору года. Заклинание не может призвать смерч или иную предельную непогоду, но способно вызвать дождь и обычные бури, достаточные для наводнения в местах, к нему склонных. Порыв ветра мгновенен, а перемена погоды длится один час за уровень колдующего, после чего всё возвращается к естественному состоянию.\n\n### Слепящий призматический полукруг\n**Уровень 5**\n\nСлепящий веер невозможных цветов обрушивается на все цели перед колдующим в области, равной конусу длиной сто футов и шириной сто футов на дальнем конце. Каждое существо в этой области должно пройти Физический спасбросок; провалившие бросают 1d6. При 1 они невредимы; при 2 — осыпаются горстью праха; при 3 — падают без сознания на час; при 4 — на ближайший час впадают в буйное безумие и нападают на всех вокруг; при 5 — обращаются в камень; при 6 — на ближайший час становятся полностью порабощены приказами колдующего, как под действием заклинания Неизбывные оковы воли.\n\n### Сопряжение живых утроб\n**Уровень 3**\n\nКолдующий обращает плоть и жизненную энергию до одного видимого субъекта за уровень колдующего во что-то пластичное и передаваемое. Пункты здоровья, яды и болезни можно переносить от одного существа другому, если оба согласны или беспомощно связаны, исцеляя цель не выше её максимума пунктов здоровья. Части тела можно обменивать и дарить, пока каждый субъект сохраняет не меньше половины собственного тела. Согласная цель может даже быть поглощена телом другого субъекта заклинания, исчезнув в нём до конца заклинания — или пока не решит выскочить обратно, в полном снаряжении. Поглощённые субъекты продолжают видеть и слышать, что творится вокруг их носителя. Один субъект может вместить до пяти других целей человеческих размеров. Заклинание длится, пока его не развеют, не отпустят или пока не пройдёт один час за уровень колдующего, однако переданные пункты здоровья и хвори к исходному субъекту не возвращаются. Если субъект убит, пока «одалживает» чужие части тела, эти части не возвращаются.\n\n### Сопряжение неотвратимого шага\n**Уровень 2**\n\nВидимая цель в пределах сотни футов немедленно телепортируется в любую видимую твёрдую точку опоры в пределах полумили — при условии, что в точке назначения хватает места её принять и что это не место немедленной физической опасности. Заклинание может переносить и бесхозные предметы, но не крупнее лошади. Несогласное существо, ставшее целью этого заклинания, может пройти Ментальный спасбросок, чтобы воспротивиться: при успехе в намеченное место назначения переносится сам колдующий.\n\n### Стеклянные колокольцы бамбуковой террасы\n**Уровень 3**\n\nЭто заклинание призывает парящую связку цветных стеклянных колокольцев. Ударять по ним может лишь колдующий, извлекая звуки великой тонкости и проникновенности. Колдующий может позволить слышать музыку всем в желаемых пределах, а может сделать её неслышной для всех, кроме избранных целей в пределах дальности. Выразительность колокольцев такова, что слышащие их могут мгновенно понять послание колдующего, сколь угодно отвлечённое. Если колдующий Основным действием яростно ударит по колокольцам, он может разбить их, вызвав оглушительный трезвон, наносящий 3d6 урона всем неглухим целям в сорока футах, кроме самого колдующего. Предельная дальность колокольцев — десять миль за уровень колдующего; они существуют, пока не разбиты или пока не кончится сцена.\n\n### Указ о распаде древа\n**Уровень 1**\n\nДерево, лён, хлопок, верёвка и прочая материя растительного или грибного происхождения уничтожается волной энтропийной силы, прокатывающейся по области рядом с колдующим. Маг намечает точку в пределах ста футов за уровень колдующего и назначает внутри этой области число смежных 10-футовых кубов, не превышающее его уровня колдующего. Вся немагическая растительная материя в этой области немедленно истлевает в прах. Зачарованные предметы из растительной материи не затрагиваются, но обычная одежда из растительных волокон, луки и оружие на деревянных древках будут уничтожены. Против чудовищ растительной природы заклинание наносит 1d10 урона за уровень колдующего, с Физическим спасброском для половины.\n\n### Указ о распаде камня\n**Уровень 2**\n\nКамень, земля, дёрн, песок и прочий по большей части минеральный материал обращается этим чародейством в лёгкую взвесь тонкой пыли, хотя металл и зачарованные предметы не затрагиваются. Колдующий назначает до одного смежного 10-футового куба за уровень колдующего в видимой области в пределах ста футов за уровень колдующего, и весь камень и минеральный материал внутри кубов исчезает. Столь стремительное разрушение вполне может обрушить и более крупные постройки. Против чудовищ каменной природы заклинание наносит 1d10 урона за уровень колдующего, с Физическим спасброском для половины.\n\n### Умственное верховенство над низшими порядками\n**Уровень 1**\n\nМаг выбирает целью видимое обычное немагическое животное или насекомое, получая временную власть над зверем и способность разделять его чувства. Животное обретает телепатическую связь с колдующим, подчиняется любой несамоубийственной команде и позволяет магу воспринимать всё, что воспринимает само. Зверь не станет сражаться за колдующего, но под управлением мага может выполнять сложные действия, совершенно несвойственные его натуре. Чтобы разделять чувства зверя, маг должен сосредоточиться: это требует Основного действия и лишает мага возможности действовать физически, пока он сосредоточен. Заклинание длится, пока маг не отпустит зверя, пока его не развеют или пока оно не будет прочитано снова."},{"n":"4.5.0","l":2,"te":"Elementalist Spells","tr":"Заклинания Стихийника","en":"Only Full or Partial Elementalists can learn or cast these spells.\n### Aqueous Harmony\n**Level 1**\nThe elementalist and up to a dozen allies are charmed with powers of water-breathing, a tolerance for the pressure and cold of the deeps, and the ability to see through water as if it were well-lit air. Ensorceled beings may move freely while in the water at their usual movement rate and their attacks and projectile weapons are not hindered by the medium, nor are their possessions soaked or damaged. The spell lasts for one hour per caster level, but will not naturally end so long as a subject is still at least partially submerged. Only the caster or magical dispelling can stop it under those circumstances.\n### Flame Scrying\n**Level 1**\nThe elementalist becomes aware of the approximate locations of all open flames within thirty feet per caster level. They may choose one of those flames as a focus for the scrying, allowing them to see and hear everything around the flame as if they were present. The spell’s duration lasts for as long as the elementalist remains motionlessly focused on it; during this duration, they may switch their focus between the various flames in range as they wish.\n### Elemental Favor\n**Level 1**\nThe elementalist makes a direct appeal to a non-magical mass of earth, stone, water, flame, or air no larger than a ten-foot cube. At the end of the round, the mass will move or reshape itself within that space as the elementalist requests, maintaining its new form until the end of the scene. If its new shape is one that is stable without magical help, it can be told to remain in it after the spell is finished.\n### Elemental Spy\n**Level 1**\nThe elementalist enchants a stone, ounce of liquid, flame no smaller than a candleflame, or a particular plume of smoke or incense. For one day per level, so long as the charmed object is not destroyed, dispersed, or consumed, they can as a Main Action see and listen to anything around the object as if they were standing there.\n### Boreal Wings\n**Level 2**\nThe elementalist chooses a visible ally within one hundred feet; the target becomes capable of swift and easy aerial travel, flying at twice their usual movement rate. If the spell ends or is dispelled while aloft, the target descends gently to the earth. This spell lasts for one scene, though casters of fifth level or more can make it last an hour, and those of eighth level or more can make it last until dawn or dusk, whichever comes next.\n### The Burrower Below\n**Level 2**\nA passage is carved through natural stone or earth, forming a tunnel up to twenty feet long per caster level and up to ten feet wide and tall. The caster can cause the earth to compress and pack itself so as to stabilize the tunnel even in very sandy or burdened soil, or they can allow it to collapse naturally if burdened by some large structure or unstable surroundings. This spell can function against worked stone, but the length of the tunnel is much shorter, being only two feet per level. Magical stone or earth cannot be altered by this spell. The caster has basic control over the direction and interior features of the tunnel, and can form stairs or other simple structures within it.\n### Flame Without End\n**Level 2**\nA sample of flame no larger than the caster is made effectively eternal. It no longer consumes the object it burns, though it can still be used to burn or heat other things, and it resists all extinguishing save being buried or wholly immersed in water. The elementalist can temporarily extinguish it at will. A number of such flames can be created equal to the elementalist’s level; beyond that, special ingredients and fuels are needed that cost 500 silver pieces per flame. If used as a weapon, it adds +2 damage to a successful hit, albeit nothing to Shock. The flame lasts until dispelled, extinguished, or the elementalist releases it.\n### Pact of Stone and Sea\n**Level 2**\nThe elementalist chooses earth, water, fire, or wind when casting this spell and selects a visible target to be affected. For the rest of the scene, the target is immune to injury caused by mundane manifestations of that substance; stone weapons don’t harm them, water doesn’t drown them, fire doesn’t burn them, and wind doesn’t topple them. This affects secondary effects of the material as well; a fire-pacted mage couldn’t be boiled in a pot, and an earth-pacted one won’t be suffocated if buried alive.\n### Elemental Vallation\n**Level 3**\nA wall of a chosen churning elemental force can be called up by the elementalist. The barrier is ten feet long per character level, with a height of ten feet and a thickness of one foot. The barrier must rest on solid ground but may be bent or shaped as desired so long as no part of it is more than two hundred feet from the caster. Earthen walls are impervious to anything but mining-appropriate tools or rock-shattering strength, taking 20 HP of damage to knock a mansized hole in them. Fire walls inflict 3d6 damage plus the elementalist’s level on anyone who passes through them. Water walls spin and hurl creatures of ox-size or less who pass through them, ejecting them at a random point on the far side of the wall and doing 2d6 damage from the buffeting. Air walls are invisible, inaudible, and twenty feet in height; those who cross them suffer 1d6 plus the elementalist’s level in electrical damage. The walls vanish at the end of the scene.\n### Like the Stones\n**Level 3**\nThe elementalist charges their physical shape with the qualities of a chosen element for the rest of the scene. In all cases, they need not breathe and become immune to poisons and diseases not already present in them. If stone, they automatically stabilize at zero hit points and ignore the first three points of damage from any source of harm. If water, they can pass through any aperture a mouse could get through. If air, they can fly at their usual movement rate and gain a +4 Armor Class bonus against ranged attacks. If fire, they inflict 1d6 damage to all creatures in melee range at the start of their turn each round and become immune to heat damage.\n### Wind Walking\n**Level 3**\nA visible target creature and their possessions are briefly transformed into a misty, insubstantial cloud. Only sources of harm that could conceivably disrupt a cloud of mist can harm them, and until the spell’s end they may pass freely into any area that a vapor could reach. They may move freely in all three dimensions at their normal movement rate, though they cannot physically manipulate objects. The spell lasts until the end of the scene or until the target or the caster choose to end it.\n### Calcifying Scourge\n**Level 4**\nA visible target within one hundred feet must make a Physical saving throw or be turned to stone. Any size of living creature may be so transmuted, though inanimate objects larger than a cart cannot. Objects being held or worn by someone else get a Physical saving throw made by their user. The calcification remains until dispelled or the caster undoes the magic, but if the object or creature is damaged in the meanwhile, it may end up being harmed or killed on its restoration. If the Physical saving throw is made successfully by a creature, the target is temporarily slowed, losing its Move action for the next 1d6 rounds.\n### Elemental Guardian\n**Level 4**\nThe elementalist imbues a human-sized mass of earth, water, fire, or air with a crude awareness and an eagerness to defend them. Whatever the substance used, it now has 4 HD, AC 15, a Move of 40’/action, a +1 skill bonus, saves of 13+, Instinct 0, Morale 12, and a melee attack of +6/1d10 with no Shock. If called from earth, it has 6 hit dice, albeit its other stats don’t change. If called from fire, it does 5/- Shock damage. If summoned from water, it has an AC of 18, and if called from air, it can fly at its usual movement rate. It has a human degree of intelligence, can communicate with others and manipulate objects, and serves with suicidal devotion. Only one elemental guardian can be summoned at any one time, and if destroyed, a new one cannot be called that same scene. A guardian persists until destroyed or until the dawn after they have been summoned.\n### Fury of the Elements\n**Level 5**\nA combination of molten rock, searing pyroclastic winds, and superheated steam erupts forth to ravage a chosen target point within two hundred feet per caster level. The cataclysmic ruin smites everything within thirty feet of the target point for 10d6 damage, destroying all conventional structures. The zone of devastation then moves 1d6x10 feet in a random direction at the start of the next round, blasting everything in its path. The zone will continue to wander in this fashion for 1d6 rounds in total before dying out. The molten remnants of the spell remain after this duration, a hazard for whomever enters the area for the rest of the day.\n### Tremors of the Depths\n**Level 5**\nThe elementalist calls up a deep, rolling tremor from within the earth, centering it on a visible point and affecting all structures in a radius of up to five hundred feet. This spell’s effects build slowly, requiring five minutes to fully manifest, but they can successfully topple or destroy any structures, tunnels, or caves within the affected area unless such structures are magically reinforced. The effects are negated if the spell is dispelled within a minute after it was cast; after that, it’s too late to stop the effect.","ru":"Учить и творить эти заклинания могут только полные или частичные Стихийники.\n\n### Вал стихий\n\n**Уровень 3**\n\nСтихийник может воздвигнуть стену клубящейся стихийной силы по своему выбору. Преграда имеет десять футов длины за уровень персонажа, десять футов высоты и фут толщины. Она должна опираться на твёрдую землю, но её можно изгибать и выгибать как угодно, лишь бы ни одна её часть не отстояла от колдующего дальше двухсот футов. Земляные стены неподвластны ничему, кроме шахтёрского инструмента или скалодробительной мощи: чтобы пробить в них дыру в человеческий рост, нужно нанести 20 ПЗ урона. Огненные стены наносят 3d6 урона плюс уровень Стихийника каждому, кто проходит сквозь них. Водяные стены закручивают и швыряют проходящих сквозь них существ размером с быка и меньше, выбрасывая их в случайной точке по ту сторону стены и нанося 2d6 урона от ударов воды. Воздушные стены невидимы, беззвучны и достигают двадцати футов в высоту; пересекающие их получают 1d6 плюс уровень Стихийника урона электричеством. В конце сцены стены исчезают.\n\n### Водная гармония\n\n**Уровень 1**\n\nСтихийник и до дюжины союзников получают чары дыхания под водой, стойкость к давлению и холоду глубин и способность видеть сквозь воду, как сквозь хорошо освещённый воздух. Зачарованные существа свободно движутся в воде со своей обычной скоростью перемещения, их атакам и стрелковому оружию не мешает среда, а их имущество не промокает и не портится. Заклинание длится час за уровень колдующего, но не закончится само, пока хоть кто-то из подопечных остаётся хотя бы частично под водой: в этих обстоятельствах прервать его могут только сам колдующий или магическое развеивание.\n\n### Гадание по пламени\n\n**Уровень 1**\n\nСтихийник ощущает примерное расположение всех открытых огней в пределах тридцати футов за уровень колдующего. Один из этих огней он может выбрать средоточием гадания: тогда он видит и слышит всё вокруг этого пламени, как если бы был там сам. Заклинание длится, пока Стихийник неподвижно сосредоточен на нём; всё это время он может по желанию переносить внимание с одного пламени в пределах дальности на другое.\n\n### Договор камня и моря\n\n**Уровень 2**\n\nЧитая это заклинание, Стихийник выбирает землю, воду, огонь или ветер и назначает видимую цель. До конца сцены цель неуязвима для ран, причиняемых обыденными проявлениями этой стихии: каменное оружие её не ранит, вода не топит, огонь не жжёт, ветер не сбивает с ног. Это касается и вторичных эффектов вещества: мага, заключившего договор с огнём, не сварить в котле, а заключившего договор с землёй не задушить, закопав заживо.\n\n### Дрожь глубин\n\n**Уровень 5**\n\nСтихийник поднимает из земных недр глубокий раскатистый толчок, сосредоточив его на видимой точке; действие охватывает все постройки в радиусе до пятисот футов. Эффект заклинания нарастает медленно и полностью проявляется лишь через пять минут, но он способен обрушить или уничтожить любые постройки, тоннели и пещеры в зоне действия, если те не укреплены магией. Эффект отменяется, если заклинание развеять в течение минуты после чтения; дальше остановить его уже поздно.\n\n### Каменящий бич\n\n**Уровень 4**\n\nВидимая цель в пределах ста футов должна сделать Физический спасбросок, иначе обратится в камень. Так можно преобразить живое существо любого размера, а вот неодушевлённые предметы крупнее телеги — нет. За предметы, которые кто-то держит или носит, Физический спасбросок делает их владелец. Окаменение держится, пока его не развеют или колдующий сам не снимет магию, но если предмет или существо тем временем повредят, при восстановлении оно может оказаться искалеченным или погибнуть. Если существо преуспело в Физическом спасброске, оно лишь временно замедлено: цель теряет Действие перемещения на следующие 1d6 раундов.\n\n### Крылья борея\n\n**Уровень 2**\n\nСтихийник выбирает видимого союзника в пределах ста футов; цель обретает дар быстрого и лёгкого полёта и летает с удвоенной обычной скоростью перемещения. Если заклинание закончится или будет развеяно в воздухе, цель мягко опустится на землю. Заклинание длится одну сцену, но колдующие 5-го уровня и выше могут продлить его до часа, а 8-го уровня и выше — до рассвета или заката, смотря что наступит раньше.\n\n### Лазутчик стихий\n\n**Уровень 1**\n\nСтихийник зачаровывает камень, унцию жидкости, пламя не меньше свечного огонька либо особую струйку дыма или благовония. Один день за уровень, пока заговорённый предмет не уничтожен, не развеян и не израсходован, Стихийник может Основным действием видеть и слышать всё вокруг предмета, как если бы стоял рядом.\n\n### Милость стихий\n\n**Уровень 1**\n\nСтихийник обращается с прямой просьбой к немагической массе земли, камня, воды, пламени или воздуха размером не больше куба со стороной десять футов. В конце раунда масса сдвинется или перестроится в этих пределах, как просил Стихийник, и сохранит новую форму до конца сцены. Если новая форма устойчива и без магической поддержки, массе можно велеть остаться в ней и после конца заклинания.\n\n### Пламя без конца\n\n**Уровень 2**\n\nОбразец пламени размером не больше самого колдующего становится, по сути, вечным. Он больше не пожирает то, на чём горит, хотя им по-прежнему можно жечь и греть другое, и противится любому тушению, кроме погребения под землёй или полного погружения в воду. Стихийник может по желанию временно гасить его. Таких огней можно создать не больше, чем уровень Стихийника; сверх того нужны особые ингредиенты и топливо ценой 500 серебряных монет за пламя. Применённое как оружие, такое пламя добавляет +2 урона при удачном попадании, но ничего не добавляет к Шоку. Огонь горит, пока его не развеют, не потушат или Стихийник сам его не отпустит.\n\n### Подобно камням\n\n**Уровень 3**\n\nСтихийник наполняет своё тело качествами избранной стихии до конца сцены. В любом случае он перестаёт нуждаться в дыхании и становится неуязвим для ядов и болезней, которых ещё нет в его организме. Если выбран камень, он автоматически стабилизируется на нуле пунктов здоровья и игнорирует первые три пункта урона из любого источника вреда. Если вода — он может протиснуться в любое отверстие, куда пролезла бы мышь. Если воздух — он может летать со своей обычной скоростью перемещения и получает бонус +4 к Классу защиты против дальних атак. Если огонь — в начале каждого своего хода он наносит 1d6 урона всем существам на дистанции ближнего боя и становится неуязвим для урона жаром.\n\n### Роющий в глубине\n\n**Уровень 2**\n\nСквозь природный камень или землю пробивается ход — тоннель длиной до двадцати футов за уровень колдующего, шириной и высотой до десяти футов. Колдующий может заставить землю сжаться и утрамбоваться, чтобы тоннель держался даже в очень песчаном или нагруженном грунте, а может позволить ему естественно осесть, если сверху давит какая-то крупная постройка или окружение неустойчиво. Заклинание действует и на обработанный камень, но тоннель выходит куда короче — лишь два фута за уровень. Магические камень и земля этому заклинанию не поддаются. Колдующий в общих чертах управляет направлением и внутренним устройством тоннеля и может сформировать в нём ступени или другие простые конструкции.\n\n### Страж стихий\n\n**Уровень 4**\n\nСтихийник наделяет массу земли, воды, огня или воздуха размером с человека грубым сознанием и рвением защищать его. Из какого бы вещества ни был создан страж, у него 4 КЗд, КЗщ 15, Скорость 40 футов за действие, бонус навыка +1, спасброски 13+, Инстинкт 0, Боевой дух 12 и атака ближнего боя +6/1d10 без Шока. Призванный из земли, он имеет 6 Костей здоровья, хотя остальные статы не меняются. Созданный из огня наносит Шок 5/–. Поднятый из воды имеет КЗщ 18, а призванный из воздуха может летать со своей обычной скоростью перемещения. Он разумен на человеческом уровне, может общаться с окружающими и управляться с предметами и служит с самоубийственной преданностью. Одновременно можно призвать только одного стража стихий, и если он уничтожен, нового в той же сцене не позвать. Страж существует, пока не уничтожен, — но не дольше, чем до рассвета после призыва.\n\n### Хождение по ветру\n\n**Уровень 3**\n\nВидимая цель-существо вместе с имуществом ненадолго обращается в туманное бесплотное облако. Повредить ей могут лишь те источники вреда, которые в принципе способны разорвать облако тумана, и до конца заклинания она свободно проникает всюду, куда добрался бы пар. Она свободно движется во всех трёх измерениях со своей обычной скоростью перемещения, но не может физически управляться с предметами. Заклинание длится до конца сцены — или пока цель либо колдующий не решат его прервать.\n\n### Ярость стихий\n\n**Уровень 5**\n\nСмесь расплавленного камня, палящих пирокластических ветров и перегретого пара вырывается наружу, чтобы опустошить выбранную точку в пределах двухсот футов за уровень колдующего. Катастрофа поражает всё в тридцати футах от целевой точки, нанося 10d6 урона и уничтожая любые обычные постройки. В начале следующего раунда зона опустошения смещается на 1d6×10 футов в случайном направлении, сметая всё на своём пути. Так она блуждает 1d6 раундов в общей сложности, после чего затухает. Расплавленные останки заклинания сохраняются и после — до конца дня это место опасно для всякого, кто туда сунется."},{"n":"4.6.0","l":2,"te":"Necromancer Spells","tr":"Заклинания Некроманта","en":"Only Full and Partial Necromancers have the necessary background to learn or cast these spells.\n### Command the Dead\n**Level 1**\nThe necromancer exerts their will over a number of hit dice worth of undead equal to twice their character level. These undead must be visible and within one hundred feet of the caster. Undead get a Mental saving throw to resist this binding, at a penalty equal to the caster’s Magic skill. Creatures only partially-bewitched by the spell due to their excess hit dice merely stand dazed for a round. Those fully within the hit die cap who are affected become suicidally loyal to the necromancer until they are released by the caster. Regardless of how often the caster uses this spell, they may have no more than twice their level worth of hit dice bound at any one time, with the oldest-enchanted being first released.\n### Query the Skull\n**Level 1**\nThis spell requires a corpse with largely-intact organs of communication. The corpse cannot have been dead for more than one day per caster level. Once sorceled, the corpse will answer up to one question per caster level, with the caster understanding the answers regardless of the creature’s natural language. Corpses are laconic, and generally answer in no more than one or two sentences; their replies will be truthful, but tend to be literal and they have no power to hypothesize or make judgments. This spell may not be used twice on the same corpse.\n### Smite the Dead\n**Level 1**\nThe necromancer conjures a blast of dispelling force at a point within one hundred feet per caster level, affecting an area up to 20 feet in radius. All hostile undead within that area immediately suffer 1d10 damage per caster level. Undead with hit dice equal or less than the caster’s level must make a Physical save or be destroyed outright. The necromancer may Commit Effort for the day immediately before casting this spell; if so, its casting does not count against the Necromancer’s available spell slots for the day.\n### Terrible Liveliness\n**Level 1**\nA necromancer can give an undead creature the semblance of a healthy, normal living being with this spell. The target appears as it did in life, at any point in its lifespan that the necromancer so desires, and is capable of performing all normal human activities that its cognition allows it to perform. The spell uses the creature’s nature as a template for its effects, so the disguise is tangible and physically real until dispelled or the necromancer drops the effect. A necromancer can maintain only one such disguise per level, and it does not work on sentient unwilling targets.\n### Augment Mortal Vitality\n**Level 2**\nThe necromancer may refine and enhance the natural flow of vitality within a willing visible target. For the rest of the scene, all Physical saving throws they make gain a bonus equal to the necromancer’s Magic skill and they automatically stabilize when Mortally Wounded. Once during the scene, as an Instant action, they can immediately heal from all damage inflicted by an injury that did not Mortally Wound them. The recipient of this spell gains one System Strain.\n### Enfeebling Wave\n**Level 2**\nA wash of debilitating force erupts in a 20-foot radius at a visible point within one hundred feet. All living creatures within the area must make a Physical saving throw or for the rest of the scene their movement rate is halved and they must make all attack and damage rolls twice and take the worse result. If the save is successful, these penalties apply only to their next turn.\n### Final Death\n**Level 2**\nThe necromancer curses one visible target per level. For the rest of the scene, these targets cannot recover or gain hit points and will die instantly if Mortally Wounded. After each failed instance of healing, a target can make a Physical save to throw off the spell.\n### Raise Corpse\n**Level 2**\nThe necromancer targets a mostly-intact skeleton or corpse, imbuing it with a semblance of life. Whatever the creature’s attributes were in life, it now has 1 HD, an AC of 13, a Move of 30’/round, a +0 skill bonus, saves of 15+, a +1/1d6 unarmed melee attack, Instinct 0, and a Morale of 12. Such corpses may be equipped with weapons or armor. Its decay or dissolution immediately ceases, and it becomes suicidally loyal to its creator. The corpse has no natural volition, but will obey commands with a human degree of intelligence. It has only vague memories of its prior life, and while it may retain human tics or habits it had in life it can answer only the simplest and most self-evident questions. Damage to a corpse can be repaired only by casting this spell on it again, which restores it to its original “health”. The corpse continues to exist until it is reduced to zero hit points or its creator releases it. A necromancer cannot have more active subjects of this spell than their character level.\n### Compel Flesh\n**Level 3**\nA visible living creature or physically-bodied undead within 100 feet is ensorceled by this spell, their flesh and bones becoming temporarily enthralled to the caster’s will. The target becomes paralyzed unless commanded by the caster as an On Turn action; once given a command, their body will dutifully carry it out on their next turn. The user’s mind is not affected by this spell, so they cannot be made to cast spells, answer questions, or perform other intellectual tasks, but they will fight, move, and perform other non-suicidal physical acts as normal. The target may make a Physical saving throw at the start of each of their turns to throw off the effect, but they will inevitably suffer one point of damage per caster level with each attempt as their flesh writhes and tears. If not thrown off earlier, the spell lasts until the end of the scene.\n### Festering Curse\n**Level 3**\nThe qualities of a corpse are forced upon a visible living target. The subject begins to rot, fester, and decay in whatever ways the necromancer thinks appropriate. Food tastes like ashes, water does not quench thirst, and their body is numb to all physical pleasures. They suffer a -2 penalty to all social skill checks due to their repugnance. This transformation does not inflict physical injury, but it makes the target’s life an utterly joyless misery until it is dispelled or the necromancer lifts the curse. Creatures with more hit dice than the necromancer has levels can make a Physical save to resist the curse.\n### Forgetting the Grave\n**Level 3**\nA necromancer can temporarily suspend the mortality of a willing target within sight. For one round per Necromancer level, the creature simply cannot die, no matter how drastic their injuries. Those reduced to zero hit points lose their Move action each turn but can continue to act otherwise; if such a target is damaged yet again, they must make a Physical saving throw each time or become incapable of movement until healed. At the spell’s end targets reduced to zero hit points are Mortally Wounded; those that have been dismembered or otherwise slaughtered beyond the hope of survival die instantly.\n### Merge Souls\n**Level 3**\nBy molding the plasmic stuff of life force, the necromancer can create a bond between two willing or helpless targets. These subjects must be close enough for the necromancer to touch; thereafter, for as long as the spell is in effect, the two creatures pool their hit points. Injuries to either subtract from this pool, and neither dies until it is reduced to zero, whereupon both are Mortally Wounded. They can communicate telepathically at will while the spell is in effect. The power ends at daybreak; if dispelled sooner, the remaining pool is split proportionately.\n### Boneshaper\n**Level 4**\nThe clay of flesh and bone run obediently to the will of the necromancer. Whether living or undead, a willing or helpless victim under the effects of this spell can be reshaped into any roughly-equivalent form with an hour’s work. Limbs can be added or removed and existing tissue can be recolored, re-textured, or rearranged to the necromancer’s wishes. Perfect imitation of a particular creature requires a Dex/Magic skill check against difficulty 10. This spell is limited in the physical changes it can effect; a bonus of +1 can be added to modifier of Charisma or a physical attribute at the cost of a -1 penalty to the modifier of one of the same attributes, to a maximum of +2 or -2. This spell lasts until the necromancer lifts it or it is dispelled.\n### Raise Grave Knight\n**Level 4**\nThe corpse used for this spell must be of a relatively powerful creature with at least four hit dice or levels. The result is much like that of the Raise Corpse spell, but this undead servitor is much stronger, with 4 HD, AC 15, a Move of 40’/action, a +1 skill bonus, saves of 13+, Instinct 0, Morale of 12, and a melee attack of +6/1d10, assuming it doesn’t use a normal weapon. It is fully intelligent and self-willed, albeit utterly devoted to its creator, and it remembers a significant amount about its prior life. A grave knight regains all lost hit points at dusk each day, assuming it’s not destroyed. A caster may have only one grave knight active at a time. One that has been reduced to zero hit points is destroyed and can only be rebuilt with a month of painstaking repair and re-enchantment.\n### Call of the Tomb\n**Level 5**\nThe necromancer invokes the inescapable urge for self-dissolution within the substance of all that exists, amplifying the weight of their own mortality. All enemy creatures within forty feet are affected. Targets can make a Physical saving throw to resist, in which case the effects last only one round, otherwise lasting for one round per caster level. During this time all attacks made against the victims automatically hit and all damage dice they suffer are maximized. Any special defenses they may have against mundane weapons or certain types of injury are negated while the spell is on them.\n### Everlasting\n**Level 5**\nThe spell may be triggered as an Instant action by the caster, imparting a burst of unquenchable life force to all allied creatures within 50 feet. For the next five rounds, no affected ally can be reduced below 1 hit point, regardless of the damage inflicted upon them. At the end of the spell’s effect, the caster’s own life energy is exhausted, leaving them with only 1 hit point. A creature can benefit from this spell no more than once per day.","ru":"Только у полных и частичных Некромантов есть подготовка, необходимая, чтобы учить и творить эти заклинания.\n\n### Ваятель костей\n\n**Уровень 4**\n\nГлина плоти и кости послушно течёт по воле Некроманта. Согласную или беспомощную жертву под действием этого заклинания — живую или нежить — можно за час работы перелепить в любую примерно равнозначную форму. Конечности можно добавлять и убирать, а существующие ткани — перекрашивать, менять их фактуру и переставлять по желанию Некроманта. Для безупречного подражания конкретному существу нужна проверка Лов/Магия против сложности 10. Физические изменения, доступные заклинанию, ограничены: можно добавить +1 к модификатору Харизмы или физической характеристики ценой штрафа -1 к модификатору одной из этих же характеристик, максимум до +2 или -2. Заклинание длится, пока Некромант его не снимет или его не развеют.\n\n### Волна немощи\n\n**Уровень 2**\n\nВолна
